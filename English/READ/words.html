<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研英语一 词汇表</title>
<style>
  :root { --bg: #f5f5f0; --card: #ffffff; --text: #2c2c2c; --muted: #6b7280; --accent: #1e40af; --border: #e5e7eb; --highlight: #fef3c7; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Georgia", "Times New Roman", serif; background: var(--bg); color: var(--text); line-height: 1.6; font-size: 16px; }
  .container { max-width: 780px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 24px; border-bottom: 2px solid var(--accent); margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 1.4rem; color: var(--accent); } header h1 span { font-weight: 400; color: var(--muted); font-size: 0.85rem; margin-left: 8px; }
  .header-links a { text-decoration: none; color: var(--accent); font-size: 0.9rem; border: 1px solid var(--accent); padding: 5px 14px; border-radius: 4px; }
  .header-links a:hover { background: var(--accent); color: #fff; }
  .search-bar { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  #search-input { flex: 1; min-width: 200px; font-family: inherit; font-size: 1rem; padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px; }
  .word-table { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .word-table th { background: #f8fafc; padding: 10px 14px; text-align: left; font-size: 0.8rem; color: var(--muted); border-bottom: 1px solid var(--border); position: sticky; top: 0; }
  .word-table td { padding: 9px 14px; border-bottom: 1px solid #f3f4f6; font-size: 0.95rem; }
  .word-cell { font-weight: 700; color: var(--accent); } .count-cell { color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>考研英语一 词汇表 <span>Vocabulary</span></h1>
    <div class="header-links"><a href="index.html">每日阅读</a></div>
  </header>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="搜索单词或中文释义..." oninput="renderWords(this.value)">
  </div>
  <div class="word-table">
    <table>
      <thead><tr><th>单词</th><th>词性</th><th>释义</th><th>频次</th></tr></thead>
      <tbody id="word-body"></tbody>
    </table>
  </div>
  <footer style="text-align:center; margin-top:40px; padding-top:20px; border-top:1px solid var(--border); color:var(--muted); font-size:0.85rem;">
    <p>考研英语一词汇 &middot; 仅收录重难点词汇</p>
  </footer>
</div>
<script src="data/words.js"></script>
<script>
function renderWords(q='') {
  const tbody = document.getElementById('word-body'); tbody.innerHTML = '';
  if (typeof ALL_WORDS === 'undefined') {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);">词汇数据加载失败</td></tr>';
    return;
  }
  ALL_WORDS.forEach(w => {
    if (q && !w.word.toLowerCase().includes(q.toLowerCase()) && !w.def.includes(q)) return;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="word-cell">${w.word}</td><td style="color:var(--muted);font-style:italic">${w.pos}</td><td>${w.def}</td><td class="count-cell">${w.count}</td>`;
    tbody.appendChild(tr);
  });
}
const params = new URLSearchParams(window.location.search);
if (params.get('q')) { document.getElementById('search-input').value = params.get('q'); renderWords(params.get('q')); }
else { renderWords(); }
</script>
</body>
</html>

先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T4-P3-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Now comes word that everyone involved – Democrats, Republicans, the Postal Service, the unions and the system’s heaviest users – has finally agreed on a plan to fix the system.","core":"Now comes word.","structure":"Now 前置引起完全倒装，正常语序为 Word now comes；that ... 是 word 的同位语从句；破折号之间列举 everyone involved 所包含的各方；to fix the system 修饰 a plan。","key":"word：常见义为“单词”；此处作不可数名词，意为“消息”。；heavy user：某项服务的高频或大量使用者，不是“体重较大的用户”。","zh":"如今传来消息：所有相关方——民主党人、共和党人、美国邮政署、工会以及邮政系统的最大用户——终于就一项修复该系统的方案达成了一致。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T4-P3-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Legislation is moving through the House that would save USPS an estimated $28.6 billion over five years, which could help pay for new vehicles, among other survival measures.","core":"Legislation is moving through the House.","structure":"that would save ... 是定语从句，修饰 Legislation；an estimated $28.6 billion 作 save 的直接宾语，USPS 是间接宾语；which could help pay ... 承接前述节省下来的资金及其作用；among other survival measures 表示购置车辆只是多项求生措施之一。","key":"the House：美国国会众议院。；move through：此处指法案在立法程序中推进。；survival measures：帮助机构维持运转、渡过危机的措施。","zh":"一项法案正在众议院推进，预计可在五年内为美国邮政署节省 286 亿美元；除其他维持生存的措施外，这笔钱还可以帮助购买新车辆。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T4-P3-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare.","core":"Most of the money would come from A and from B.","structure":"两个 from 引出并列资金来源；A 是复合定语很长的名词短语，B 是 shifting ... 动名词短语。","key":"a penny-per-letter permanent rate increase：每封信永久加价一美分。；shift sb. into Medicare：把某人转入美国联邦医疗保险计划。；postal retirees：邮政系统退休人员。","zh":"大部分资金将来自两项措施：永久性地将每封信的邮资提高一美分，以及把邮政退休人员纳入联邦医疗保险计划。","tip":"money 并非全部用于购车；本句在解释法案如何节省资金和减轻负担。"},{"id":"2018-T4-P3-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its unions.","core":"The latter step would offset the financial burden.","structure":"of annually pre-funding ... 修饰 burden，说明负担来自何处；thus addressing ... 是现在分词短语，表示由减轻负担自然产生的结果。","key":"the latter step：指前句两项措施中的后一项，即把邮政退休人员纳入 Medicare。；offset：抵消、弥补。；pre-fund：预先筹资，在费用实际发生前先行备足资金。；address a complaint：处理、回应一项不满或诉求。","zh":"后一项措施将大幅抵消每年预先为退休人员医疗保障筹资所造成的财务负担，从而回应美国邮政署及其工会长期以来的一项不满。","tip":"解决长期不满的是转入 Medicare 后减轻退休人员医疗预筹资负担，不是购买新车或单纯提高邮资。"},{"id":"2018-T4-P4-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform.","core":"If it clears the House, this measure would still have to get through the Senate.","structure":"it 指 this measure；破折号后的 where ... 是非限制性定语从句，修饰 the Senate；is bound to 表示必然；that ... 是 point out 的宾语从句；necessary to keep ... 修饰 the bare, bare minimum；句尾 not comprehensive reform 与最低限度措施形成否定对照。","key":"clear the House：获众议院通过，不是“清空众议院”。；get through the Senate：通过参议院审议。；amount to：等同于、实质上是。；keep ... afloat：本义为使……漂浮；此处指使机构在财务上维持运转、不致倒闭。","zh":"即便该措施在众议院获得通过，它仍须过参议院这一关——在那里必定会有人指出，它不过是维持美国邮政署生存所必需的最低限度措施，远非全面改革。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T4-P4-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"There’s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency’s costs.","core":"There’s no change to collective bargaining.","structure":"a major omission 是对前面整个事实的同位补充和评价；considering that ... 表示作出这一评价的依据，其中 that ... 是 considering 的宾语从句。","key":"collective bargaining：集体谈判，通常指工会代表员工与雇主协商工资和劳动条件。；personnel：此处不是单指“人事部门”，而是指人员及相关成本。；account for：占据某一比例。","zh":"该方案没有改变美国邮政署的集体谈判制度；考虑到人员成本占该机构总成本的 80%，这是一个重大遗漏。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T4-P4-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Also missing is any discussion of eliminating Saturday letter delivery.","core":"Any discussion ... is also missing.","structure":"表语 Also missing 前置引起完全倒装；of eliminating ... 修饰 discussion。","key":"见下方词汇笔记","zh":"同样缺失的，还有关于取消周六信件投递的任何讨论。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T4-P4-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"That common-sense change enjoys wide public support and would save the USPS $2 billion per year.","core":"That change enjoys support and would save the USPS $2 billion.","structure":"两个谓语 enjoys 与 would save 并列；save sb. money 是双宾语结构；That ... change 回指取消周六信件投递。","key":"common-sense：合乎常理的、务实明智的；该评价直接体现作者支持取消周六信件投递。","zh":"这一符合常理的改革得到公众广泛支持，而且每年可为美国邮政署节省 20 亿美元。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T4-P4-S05","sec":"text4","sec_label":"Text 4","level":3,"en":"But postal special-interest groups seem to have killed it, at least in the House.","core":"Postal special-interest groups seem to have killed it.","structure":"seem to have done 表示看来某事已经发生；it 指前文取消周六信件投递的改革；at least in the House 限定该改革在众议院阶段遭到阻止。","key":"kill a proposal/change：扼杀、阻止一项提案或改革获得通过。；special-interest group：特殊利益集团，指为特定群体利益影响决策的组织。","zh":"但是，邮政特殊利益集团似乎已经扼杀了这项改革，至少在众议院是如此。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T4-P4-S06","sec":"text4","sec_label":"Text 4","level":3,"en":"The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS.","core":"The emerging consensus is a sign.","structure":"around the bill 修饰 consensus；that ... 是 a sign 的同位语从句；about ... collapse 说明立法者害怕的事情；politically embarrassing 修饰 collapse，实际强调崩溃会给立法者造成政治后果。","key":"emerging consensus：正在形成的共识。；politically embarrassing：会造成政治难堪的、在政治上有损颜面的。","zh":"围绕这项法案逐渐形成的共识表明，立法者开始害怕美国邮政署在短期内崩溃，因为那会令他们在政治上难堪。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T4-P4-S07","sec":"text4","sec_label":"Text 4","level":3,"en":"It is not, however, a sign that they’re getting serious about transforming the postal system for the 21stcentury.","core":"It is not a sign.","structure":"however 是插入的转折副词；that ... 是 a sign 的同位语从句；about transforming ... 是 get serious 的介词宾语；for the 21st century 说明转型应适应新时代需要。","key":"get serious about：开始认真对待、真正着手处理。；It：指上一句所说的“围绕法案形成共识”这一事实。；they：指 legislators（立法者）。；bleed red ink：持续出现赤字、不断亏损。","zh":"然而，这并不表明他们开始认真推动邮政系统转型，以适应 21 世纪。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"}]};</script>

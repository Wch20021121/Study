eventually raised living standards and created more jobs th","note":"取代、消灭工作岗位。","forms":["displace jobs"]},{"w":"boost productivity","pos":"phr.","cn":"提高生产率。","sec":"text1","sec_label":"Text 1","ctx":"Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work.","note":"提高生产率。","forms":["boost productivity"]},{"w":"drive down prices","pos":"phr.","cn":"压低价格。","sec":"text1","sec_label":"Text 1","ctx":"Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work.","note":"压低价格。","forms":["drive down prices"]},{"w":"free sb. from ...","pos":"phr.","cn":"使某人摆脱……。","sec":"text1","sec_label":"Text 1","ctx":"Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work.","note":"使某人摆脱……。","forms":["free sb. from ..."]},{"w":"in the medium term","pos":"phr.","cn":"从中期来看。","sec":"text1","sec_label":"Text 1","ctx":"But in the medium term, middle-class workers may need a lot of help adjusting.","note":"从中期来看。","forms":["in the medium term"]},{"w":"help (in) doing sth.","pos":"phr.","cn":"在做某事方面得到帮助；此处 adjusting 指适应自动化带来的就业变化。","sec":"text1","sec_label":"Text 1","ctx":"But in the medium term, middle-class workers may need a lot of help adjusting.","note":"在做某事方面得到帮助；此处 adjusting 指适应自动化带来的就业变化。","forms":["help (in) doing sth."]},{"w":"grammar school","pos":"phr.","cn":"此处按美国教育语境指“小学”，不是“语法学校”。","sec":"text1","sec_label":"Text 1","ctx":"Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication.","note":"此处按美国教育语境指“小学”，不是“语法学校”。","forms":["grammar school"]},{"w":"evolve","pos":"词","cn":"常见义为“进化”；此处指课程体系“逐步发展、调整”。","sec":"text1","sec_label":"Text 1","ctx":"Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication.","note":"常见义为“进化”；此处指课程体系“逐步发展、调整”。","forms":["evolve"]},{"w":"focus less on A and more on B","pos":"phr.","cn":"减少对 A 的关注，更多关注 B。","sec":"text1","sec_label":"Text 1","ctx":"Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication.","note":"减少对 A 的关注，更多关注 B。","forms":["focus less on A and more on B"]},{"w":"memorize facts","pos":"phr.","cn":"记忆事实性知识。","sec":"text1","sec_label":"Text 1","ctx":"Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication.","note":"记忆事实性知识。","forms":["memorize facts"]},{"w":"do a better job of doing sth.","pos":"phr.","cn":"把某事做得更好。","sec":"text1","sec_label":"Text 1","ctx":"Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots.","note":"把某事做得更好。","forms":["do a better job of doing sth."]},{"w":"foster problem-solving skills","pos":"phr.","cn":"培养解决问题的能力。","sec":"text1","sec_label":"Text 1","ctx":"Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots.","note":"培养解决问题的能力。","forms":["foster problem-solving skills"]},{"w":"work alongside robots","pos":"phr.","cn":"与机器人并肩、协同工作。","sec":"text1","sec_label":"Text 1","ctx":"Vocational schools should do a better job of fostering problem-solving skills and helping students work alongside robots.","note":"与机器人并肩、协同工作。","forms":["work alongside robots"]},{"w":"the traditional kind","pos":"phr.","cn":"kind 代指前面的 education，即传统教育，而非“传统种类”。","sec":"text1","sec_label":"Text 1","ctx":"Online education can supplement the traditional kind.","note":"kind 代指前面的 education，即传统教育，而非“传统种类”。","forms":["the traditional kind"]},{"w":"affordable","pos":"adj.","cn":"不仅指“价格便宜”，更准确地说是费用处在学习者承受范围内。","sec":"text1","sec_label":"Text 1","ctx":"It could make extra training and instruction affordable.","note":"不仅指“价格便宜”，更准确地说是费用处在学习者承受范围内。","forms":["affordable"]},{"w":"It","pos":"词","cn":"指上一句的 Online education。","sec":"text1","sec_label":"Text 1","ctx":"It could make extra training and instruction affordable.","note":"指上一句的 Online education。","forms":["It"]},{"w":"acquire new skills","pos":"phr.","cn":"掌握新技能。","sec":"text1","sec_label":"Text 1","ctx":"Professionals trying to acquire new skills will be able to do so without going into debt.","note":"掌握新技能。","forms":["acquire new skills"]},{"w":"go into debt","pos":"phr.","cn":"陷入债务、负债。","sec":"text1","sec_label":"Text 1","ctx":"Professionals trying to acquire new skills will be able to do so without going into debt.","note":"陷入债务、负债。","forms":["go into debt"]},{"w":"underline","pos":"词","cn":"常见义为“在……下画线”；此处作动词，意为“突出、强调”。","sec":"text1","sec_label":"Text 1","ctx":"The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.","note":"常见义为“在……下画线”；此处作动词，意为“突出、强调”。","forms":["underline"]},{"w":"business dynamism","pos":"phr.","cn":"指企业不断创立、扩张、退出所体现的经济活力，不只是“商业动力”。","sec":"text1","sec_label":"Text 1","ctx":"The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.","note":"指企业不断创立、扩张、退出所体现的经济活力，不只是“商业动力”。","forms":["business dynamism"]},{"w":"smooth the transition","pos":"phr.","cn":"使转型顺利进行；缓和转型冲击。","sec":"text1","sec_label":"Text 1","ctx":"In previous eras of drastic technological change, entrepreneurs smoothed the transition by dreaming up ways to combine labor and machines.","note":"使转型顺利进行；缓和转型冲击。","forms":["smooth the transition"]},{"w":"dream up","pos":"phr.","cn":"构思、想出，常指富有创造性地提出办法。","sec":"text1","sec_label":"Text 1","ctx":"In previous eras of drastic technological change, entrepreneurs smoothed the transition by dreaming up ways to combine labor and machines.","note":"构思、想出，常指富有创造性地提出办法。","forms":["dream up"]},{"w":"invent uses","pos":"phr.","cn":"这里不是“发明用途”的生硬直译，而是“创造、开发新的应用方式”。","sec":"text1","sec_label":"Text 1","ctx":"The best uses of 3D printers and virtual reality haven’t been invented yet.","note":"这里不是“发明用途”的生硬直译，而是“创造、开发新的应用方式”。","forms":["invent uses"]},{"w":"safety net","pos":"phr.","cn":"字面义为“安全网”；此处指为失业者和低收入者提供保障的社会福利制度。","sec":"text1","sec_label":"Text 1","ctx":"Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.","note":"字面义为“安全网”；此处指为失业者和低收入者提供保障的社会福利制度。","forms":["safety net"]},{"w":"rethink","pos":"词","cn":"不是简单地“再想一遍”，而是“重新审视并调整”。","sec":"text1","sec_label":"Text 1","ctx":"Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.","note":"不是简单地“再想一遍”，而是“重新审视并调整”。","forms":["rethink"]},{"w":"wage subsidy","pos":"phr.","cn":"工资补贴；通过公共政策提高劳动者的实际所得。","sec":"text1","sec_label":"Text 1","ctx":"Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward compa","note":"工资补贴；通过公共政策提高劳动者的实际所得。","forms":["wage subsidy"]},{"w":"earned income tax credit","pos":"phr.","cn":"劳动所得税抵免，美国面向中低收入劳动者的税收补助政策。","sec":"text1","sec_label":"Text 1","ctx":"Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward compa","note":"劳动所得税抵免，美国面向中低收入劳动者的税收补助政策。","forms":["earned income tax credit"]},{"w":"reward companies for job creation","pos":"phr.","cn":"因企业创造就业岗位而给予激励。","sec":"text1","sec_label":"Text 1","ctx":"Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward compa","note":"因企业创造就业岗位而给予激励。","forms":["reward companies for job creation"]},{"w":"upend","pos":"词","cn":"本义为“使倒立”；此处意为“彻底打乱、颠覆”。","sec":"text1","sec_label":"Text 1","ctx":"Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automa","note":"本义为“使倒立”；此处意为“彻底打乱、颠覆”。","forms":["upend"]},{"w":"little comfort","pos":"phr.","cn":"几乎算不上安慰；little 表否定含义。","sec":"text1","sec_label":"Text 1","ctx":"Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automa","note":"几乎算不上安慰；little 表否定含义。","forms":["little comfort"]},{"w":"nuts","pos":"词","cn":"口语形容词，意为“疯狂的、荒唐的”，不是“坚果”。","sec":"text1","sec_label":"Text 1","ctx":"Destroying the machines that are coming for our jobs would be nuts.","note":"口语形容词，意为“疯狂的、荒唐的”，不是“坚果”。","forms":["nuts"]},{"w":"indispensable","pos":"adj.","cn":"不可或缺的、必不可少的。","sec":"text1","sec_label":"Text 1","ctx":"But policies to help workers adapt will be indispensable.","note":"不可或缺的、必不可少的。","forms":["indispensable"]},{"w":"disapprove of","pos":"phr.","cn":"不赞成、反对。","sec":"text2","sec_label":"Text 2","ctx":"A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump’s use of Twitter.","note":"不赞成、反对。","forms":["disapprove of"]},{"w":"more than two-thirds of ...","pos":"phr.","cn":"超过……的三分之二。","sec":"text2","sec_label":"Text 2","ctx":"A new survey by Harvard University finds more than two-thirds of young Americans disapprove of President Trump’s use of Twitter.","note":"超过……的三分之二。","forms":["more than two-thirds of ..."]},{"w":"filter","pos":"词","cn":"常见义为“过滤杂质”；此处指新闻经过其他媒体来源的核查、筛选和编辑。","sec":"text2","sec_label":"Text 2","ctx":"The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president’s social media platform.","note":"常见义为“过滤杂质”；此处指新闻经过其他媒体来源的核查、筛选和编辑。","forms":["filter"]},{"w":"Millennials","pos":"词","cn":"千禧一代，通常指出生并成长于数字化时代的一代人。","sec":"text2","sec_label":"Text 2","ctx":"The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president’s social media platform.","note":"千禧一代，通常指出生并成长于数字化时代的一代人。","forms":["Millennials"]},{"w":"rely on ... to do sth.","pos":"phr.","cn":"依靠……做某事。","sec":"text2","sec_label":"Text 2","ctx":"Most Americans rely on social media to check daily headlines.","note":"依靠……做某事。","forms":["rely on ... to do sth."]},{"w":"check daily headlines","pos":"phr.","cn":"查看每日新闻要闻。","sec":"text2","sec_label":"Text 2","ctx":"Most Americans rely on social media to check daily headlines.","note":"查看每日新闻要闻。","forms":["check daily headlines"]},{"w":"beef up","pos":"phr.","cn":"口语短语，意为“加强、充实、提高”，此处近义于选项中的 sharpen，与“牛肉”无关。","sec":"text2","sec_label":"Text 2","ctx":"Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.","note":"口语短语，意为“加强、充实、提高”，此处近义于选项中的 sharpen，与“牛肉”无关。","forms":["beef up"]},{"w":"literacy","pos":"词","cn":"常见义为“读写能力”；media literacy 指辨识、理解和评估媒体信息的能力。","sec":"text2","sec_label":"Text 2","ctx":"Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.","note":"常见义为“读写能力”；media literacy 指辨识、理解和评估媒体信息的能力。","forms":["literacy"]},{"w":"badly","pos":"adv.","cn":"常见义为“糟糕地”；与 need 连用时意为“非常、迫切地”。","sec":"text2","sec_label":"Text 2","ctx":"Such a trend is badly needed.","note":"常见义为“糟糕地”；与 need 连用时意为“非常、迫切地”。","forms":["badly"]},{"w":"Such a trend","pos":"phr.","cn":"指上一句所说的“人们开始提升媒介素养”。","sec":"text2","sec_label":"Text 2","ctx":"Such a trend is badly needed.","note":"指上一句所说的“人们开始提升媒介素养”。","forms":["Such a trend"]},{"w":"critical","pos":"adj.","cn":"常见义为“批判的”；此处意为“关键的、至关重要的”，强调密歇根州在选举政治中的重要性。","sec":"text2","sec_label":"Text 2","ctx":"During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to t","note":"常见义为“批判的”；此处意为“关键的、至关重要的”，强调密歇根州在选举政治中的重要性。","forms":["critical"]},{"w":"rarely or never trust","pos":"phr.","cn":"很少信任或从不信任。","sec":"text2","sec_label":"Text 2","ctx":"And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.","note":"很少信任或从不信任。","forms":["rarely or never trust"]},{"w":"the media giant","pos":"phr.","cn":"这家媒体巨头，回指 Facebook。","sec":"text2","sec_label":"Text 2","ctx":"And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.","note":"这家媒体巨头，回指 Facebook。","forms":["the media giant"]},{"w":"digital native","pos":"phr.","cn":"数字原住民，指从小接触数字技术并在数字环境中成长的人。","sec":"text2","sec_label":"Text 2","ctx":"Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace.","note":"数字原住民，指从小接触数字技术并在数字环境中成长的人。","forms":["digital native"]},{"w":"separate fact from fiction","pos":"phr.","cn":"辨别事实与虚构；识别信息真伪。","sec":"text2","sec_label":"Text 2","ctx":"Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace.","note":"辨别事实与虚构；识别信息真伪。","forms":["separate fact from fiction"]},{"w":"cyberspace","pos":"词","cn":"网络空间。","sec":"text2","sec_label":"Text 2","ctx":"Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace.","note":"网络空间。","forms":["cyberspace"]},{"w":"focus-group survey","pos":"phr.","cn":"焦点小组调查，通过小组访谈了解受访者的看法与行为。","sec":"text2","sec_label":"Text 2","ctx":"A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use “distributed trust” to verify stories.","note":"焦点小组调查，通过小组访谈了解受访者的看法与行为。","forms":["focus-group survey"]},{"w":"distributed trust","pos":"phr.","cn":"分布式信任，即不依赖单一权威来源，而是通过多个来源交叉验证信息。","sec":"text2","sec_label":"Text 2","ctx":"A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use “distributed trust” to verify stories.","note":"分布式信任，即不依赖单一权威来源，而是通过多个来源交叉验证信息。","forms":["distributed trust"]},{"w":"verify stories","pos":"phr.","cn":"核实新闻报道。","sec":"text2","sec_label":"Text 2","ctx":"A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use “distributed trust” to verify stories.","note":"核实新闻报道。","forms":["verify stories"]},{"w":"be open about","pos":"phr.","cn":"坦诚说明、不隐瞒；此处不是“对……持开放态度”。","sec":"text2","sec_label":"Text 2","ctx":"They cross-check sources and prefer news from different perspectives – especially those that are open about any bias.","note":"坦诚说明、不隐瞒；此处不是“对……持开放态度”。","forms":["be open about"]},{"w":"bias","pos":"词","cn":"偏见、倾向性；在新闻语境中指报道立场可能造成的偏向。","sec":"text2","sec_label":"Text 2","ctx":"They cross-check sources and prefer news from different perspectives – especially those that are open about any bias.","note":"偏见、倾向性；在新闻语境中指报道立场可能造成的偏向。","forms":["bias"]},{"w":"cross-check sources","pos":"phr.","cn":"交叉核对信息来源。","sec":"text2","sec_label":"Text 2","ctx":"They cross-check sources and prefer news from different perspectives – especially those that are open about any bias.","note":"交叉核对信息来源。","forms":["cross-check sources"]},{"w":"from different perspectives","pos":"phr.","cn":"来自不同视角。","sec":"text2","sec_label":"Text 2","ctx":"They cross-check sources and prefer news from different perspectives – especially those that are open about any bias.","note":"来自不同视角。","forms":["from different perspectives"]},{"w":"assume responsibility for","pos":"phr.","cn":"承担……的责任。","sec":"text2","sec_label":"Text 2","ctx":"“Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,” the survey concluded.","note":"承担……的责任。","forms":["assume responsibility for"]},{"w":"seek out opposing viewpoints","pos":"phr.","cn":"主动寻找相反的观点。","sec":"text2","sec_label":"Text 2","ctx":"“Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,” the survey concluded.","note":"主动寻找相反的观点。","forms":["seek out opposing viewpoints"]},{"w":"research","pos":"词","cn":"此处不是正式的学术研究，而是年轻人主动检索、核对不同新闻来源的行为。","sec":"text2","sec_label":"Text 2","ctx":"Such active research can have another effect.","note":"此处不是正式的学术研究，而是年轻人主动检索、核对不同新闻来源的行为。","forms":["research"]},{"w":"Such active research","pos":"phr.","cn":"回指上一段的交叉核验信息和寻找对立观点。","sec":"text2","sec_label":"Text 2","ctx":"Such active research can have another effect.","note":"回指上一段的交叉核验信息和寻找对立观点。","forms":["Such active research"]},{"w":"engagement","pos":"n.","cn":"常见义为“订婚”或“约定”；此处意为“参与、投入”，political engagement 即政治参与。","sec":"text2","sec_label":"Text 2","ctx":"A 2014 survey conducted in Australia, Britain, and the United States by the University of Wisconsin-Madison found that young people’s reliance on social media led to grea","note":"常见义为“订婚”或“约定”；此处意为“参与、投入”，political engagement 即政治参与。","forms":["engagement"]},{"w":"intimately","pos":"adv.","cn":"常见义与“亲密”有关；此处指用户能够更贴近新闻事件、更有切身感。","sec":"text2","sec_label":"Text 2","ctx":"Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and intere","note":"常见义与“亲密”有关；此处指用户能够更贴近新闻事件、更有切身感。","forms":["intimately"]},{"w":"projection","pos":"n.","cn":"常见义为“预测、投影”；此处意为个人价值观和兴趣的“外在表达、投射”。","sec":"text2","sec_label":"Text 2","ctx":"Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and intere","note":"常见义为“预测、投影”；此处意为个人价值观和兴趣的“外在表达、投射”。","forms":["projection"]},{"w":"permit sb. to do sth.","pos":"phr.","cn":"允许某人做某事。","sec":"text2","sec_label":"Text 2","ctx":"Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and intere","note":"允许某人做某事。","forms":["permit sb. to do sth."]},{"w":"re-share news","pos":"phr.","cn":"再次分享、转发新闻。","sec":"text2","sec_label":"Text 2","ctx":"Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and intere","note":"再次分享、转发新闻。","forms":["re-share news"]},{"w":"conscious of","pos":"phr.","cn":"意识到、留意到，不是“有意识的”机械直译。","sec":"text2","sec_label":"Text 2","ctx":"This forces users to be more conscious of their role in passing along information.","note":"意识到、留意到，不是“有意识的”机械直译。","forms":["conscious of"]},{"w":"pass along information","pos":"phr.","cn":"把信息转递给他人、传播信息。","sec":"text2","sec_label":"Text 2","ctx":"This forces users to be more conscious of their role in passing along information.","note":"把信息转递给他人、传播信息。","forms":["pass along information"]},{"w":"This","pos":"词","cn":"指上一句所说的用户可以按照自身价值观和兴趣转发新闻这一机制。","sec":"text2","sec_label":"Text 2","ctx":"This forces users to be more conscious of their role in passing along information.","note":"指上一句所说的用户可以按照自身价值观和兴趣转发新闻这一机制。","forms":["This"]},{"w":"top reason","pos":"phr.","cn":"首要原因、最主要的原因。","sec":"text2","sec_label":"Text 2","ctx":"A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is “reader error,” more so than made-up stories or factual mistakes ","note":"首要原因、最主要的原因。","forms":["top reason"]},{"w":"reader error","pos":"phr.","cn":"读者在理解、判断或转发信息时产生的错误。","sec":"text2","sec_label":"Text 2","ctx":"A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is “reader error,” more so than made-up stories or factual mistakes ","note":"读者在理解、判断或转发信息时产生的错误。","forms":["reader error"]},{"w":"more so than","pos":"phr.","cn":"比……更是如此；这里表示“读者错误”比后两类新闻生产端错误更被视为主要原因。","sec":"text2","sec_label":"Text 2","ctx":"A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is “reader error,” more so than made-up stories or factual mistakes ","note":"比……更是如此；这里表示“读者错误”比后两类新闻生产端错误更被视为主要原因。","forms":["more so than"]},{"w":"lie in","pos":"phr.","cn":"在于；问题或原因存在于某处。","sec":"text2","sec_label":"Text 2","ctx":"About a third say the problem of fake news lies in “misinterpretation or exaggeration of actual news” via social media.","note":"在于；问题或原因存在于某处。","forms":["lie in"]},{"w":"misinterpretation or exaggeration","pos":"phr.","cn":"误读或夸大。","sec":"text2","sec_label":"Text 2","ctx":"About a third say the problem of fake news lies in “misinterpretation or exaggeration of actual news” via social media.","note":"误读或夸大。","forms":["misinterpretation or exaggeration"]},{"w":"actual news","pos":"phr.","cn":"真实发生、确有事实依据的新闻。","sec":"text2","sec_label":"Text 2","ctx":"About a third say the problem of fake news lies in “misinterpretation or exaggeration of actual news” via social media.","note":"真实发生、确有事实依据的新闻。","forms":["actual news"]},{"w":"at the heart of","pos":"phr.","cn":"位于……的核心，是……的关键所在。","sec":"text2","sec_label":"Text 2","ctx":"In other words, the choice to share news on social media may be at the heart of the issue.","note":"位于……的核心，是……的关键所在。","forms":["at the heart of"]},{"w":"the choice to share","pos":"phr.","cn":"不仅指分享什么，也包含是否分享以及何时分享的个人判断。","sec":"text2","sec_label":"Text 2","ctx":"In other words, the choice to share news on social media may be at the heart of the issue.","note":"不仅指分享什么，也包含是否分享以及何时分享的个人判断。","forms":["the choice to share"]},{"w":"counteract a problem","pos":"phr.","cn":"抵消、遏制某个问题造成的影响。","sec":"text2","sec_label":"Text 2","ctx":"“This indicates there is a real personal responsibility in counteracting this problem,” says Roxanne Stone, editor in chief at Barna Group.","note":"抵消、遏制某个问题造成的影响。","forms":["counteract a problem"]},{"w":"editor in chief","pos":"phr.","cn":"主编。","sec":"text2","sec_label":"Text 2","ctx":"“This indicates there is a real personal responsibility in counteracting this problem,” says Roxanne Stone, editor in chief at Barna Group.","note":"主编。","forms":["editor in chief"]},{"w":"be critical of","pos":"phr.","cn":"批评、不赞成；不是单纯“对……至关重要”。","sec":"text2","sec_label":"Text 2","ctx":"So when young people are critical of an over-tweeting president, they reveal a mental discipline in thinking skills – and in their choices on when to share on social medi","note":"批评、不赞成；不是单纯“对……至关重要”。","forms":["be critical of"]},{"w":"discipline","pos":"词","cn":"常见义为“学科、纪律、惩罚”；此处指克制而审慎的“自律”。","sec":"text2","sec_label":"Text 2","ctx":"So when young people are critical of an over-tweeting president, they reveal a mental discipline in thinking skills – and in their choices on when to share on social medi","note":"常见义为“学科、纪律、惩罚”；此处指克制而审慎的“自律”。","forms":["discipline"]},{"w":"over-tweeting","pos":"adj.","cn":"发推过多、过度使用推特发声。","sec":"text2","sec_label":"Text 2","ctx":"So when young people are critical of an over-tweeting president, they reveal a mental discipline in thinking skills – and in their choices on when to share on social medi","note":"发推过多、过度使用推特发声。","forms":["over-tweeting"]},{"w":"fair-minded","pos":"v./adj.","cn":"公正的、不偏不倚的。","sec":"text3","sec_label":"Text 3","ctx":"Any fair-minded assessment of the dangers of the deal between Britain’s National Health Service (NHS) and DeepMind must start by acknowledging that both sides mean well.","note":"公正的、不偏不倚的。","forms":["fair-minded"]},{"w":"assessment of the dangers","pos":"phr.","cn":"对风险的评估。","sec":"text3","sec_label":"Text 3","ctx":"Any fair-minded assessment of the dangers of the deal between Britain’s National Health Service (NHS) and DeepMind must start by acknowledging that both sides mean well.","note":"对风险的评估。","forms":["assessment of the dangers"]},{"w":"mean well","pos":"phr.","cn":"出于好意、本意良善。","sec":"text3","sec_label":"Text 3","ctx":"Any fair-minded assessment of the dangers of the deal between Britain’s National Health Service (NHS) and DeepMind must start by acknowledging that both sides mean well.","note":"出于好意、本意良善。","forms":["mean well"]},{"w":"one of the leading ... companies","pos":"phr.","cn":"领先的……公司之一。","sec":"text3","sec_label":"Text 3","ctx":"DeepMind is one of the leading artificial intelligence (AI) companies in the world.","note":"领先的……公司之一。","forms":["one of the leading ... companies"]},{"w":"potential","pos":"adj.","cn":"此处作名词，意为“潜力、可能产生的价值”。","sec":"text3","sec_label":"Text 3","ctx":"The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants.","note":"此处作名词，意为“潜力、可能产生的价值”。","forms":["potential"]},{"w":"concentration of power","pos":"phr.","cn":"权力集中，不是注意力集中。","sec":"text3","sec_label":"Text 3","ctx":"The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants.","note":"权力集中，不是注意力集中。","forms":["concentration of power"]},{"w":"trust","pos":"词","cn":"常见义为“信任”；此处指 NHS 体系中负责运营医疗机构的“医疗信托机构”。","sec":"text3","sec_label":"Text 3","ctx":"It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, whi","note":"常见义为“信任”；此处指 NHS 体系中负责运营医疗机构的“医疗信托机构”。","forms":["trust"]},{"w":"damning","pos":"v./n.","cn":"严厉谴责的、极具否定性的。","sec":"text3","sec_label":"Text 3","ctx":"It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, whi","note":"严厉谴责的、极具否定性的。","forms":["damning"]},{"w":"take account of","pos":"phr.","cn":"考虑、顾及。","sec":"text3","sec_label":"Text 3","ctx":"It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, whi","note":"考虑、顾及。","forms":["take account of"]},{"w":"issue a verdict against ...","pos":"phr.","cn":"作出不利于……的裁定。","sec":"text3","sec_label":"Text 3","ctx":"It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, whi","note":"作出不利于……的裁定。","forms":["issue a verdict against ..."]},{"w":"hand over sth. to sb.","pos":"phr.","cn":"把某物移交给某人。","sec":"text3","sec_label":"Text 3","ctx":"It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, whi","note":"把某物移交给某人。","forms":["hand over sth. to sb."]},{"w":"on the basis of","pos":"phr.","cn":"以……为依据。","sec":"text3","sec_label":"Text 3","ctx":"It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, whi","note":"以……为依据。","forms":["on the basis of"]},{"w":"expectations of privacy","pos":"phr.","cn":"对隐私保护的合理期待。","sec":"text3","sec_label":"Text 3","ctx":"It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, whi","note":"对隐私保护的合理期待。","forms":["expectations of privacy"]},{"w":"almost apologized","pos":"phr.","cn":"字面是“几乎道歉了”，语气暗示其表态接近道歉却不够明确，不能等同于“真诚道歉”。","sec":"text3","sec_label":"Text 3","ctx":"DeepMind has almost apologized.","note":"字面是“几乎道歉了”，语气暗示其表态接近道歉却不够明确，不能等同于“真诚道歉”。","forms":["almost apologized"]},{"w":"mend one’s ways","pos":"phr.","cn":"固定表达，意为“改过自新、改正做法”，在此对应采取必要调整，而不是“修补道路”。","sec":"text3","sec_label":"Text 3","ctx":"The NHS trust has mended its ways.","note":"固定表达，意为“改过自新、改正做法”，在此对应采取必要调整，而不是“修补道路”。","forms":["mend one’s ways"]},{"w":"scrutinise","pos":"v.","cn":"仔细审查；本文采用英式拼写 scrutinised。","sec":"text3","sec_label":"Text 3","ctx":"Further arrangements – and there may be many – between the NHS and DeepMind will be carefully scrutinised to ensure that all necessary permissions have been asked of pati","note":"仔细审查；本文采用英式拼写 scrutinised。","forms":["scrutinise"]},{"w":"clean data","pos":"phr.","cn":"此处结合 unnecessary data，指把不必要的数据清除出数据集，而不是日常意义上的“清洗污渍”。","sec":"text3","sec_label":"Text 3","ctx":"Further arrangements – and there may be many – between the NHS and DeepMind will be carefully scrutinised to ensure that all necessary permissions have been asked of pati","note":"此处结合 unnecessary data，指把不必要的数据清除出数据集，而不是日常意义上的“清洗污渍”。","forms":["clean data"]},{"w":"informed patient consent","pos":"phr.","cn":"患者知情同意，即患者在充分了解用途和风险后作出授权。","sec":"text3","sec_label":"Text 3","ctx":"There are lessons about informed patient consent to learn.","note":"患者知情同意，即患者在充分了解用途和风险后作出授权。","forms":["informed patient consent"]},{"w":"lessons to learn","pos":"phr.","cn":"需要吸取的教训。","sec":"text3","sec_label":"Text 3","ctx":"There are lessons about informed patient consent to learn.","note":"需要吸取的教训。","forms":["lessons to learn"]},{"w":"angle","pos":"词","cn":"常见义为“角度”；此处指分析问题的“方面、视角”。","sec":"text3","sec_label":"Text 3","ctx":"But privacy is not the only angle in this case and not even the most important.","note":"常见义为“角度”；此处指分析问题的“方面、视角”。","forms":["angle"]},{"w":"concentrate the blame on","pos":"phr.","cn":"把责任主要归到……身上。","sec":"text3","sec_label":"Text 3","ctx":"Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it “controlled” the data and DeepMind merely “processed” it.","note":"把责任主要归到……身上。","forms":["concentrate the blame on"]},{"w":"under existing law","pos":"phr.","cn":"按照现行法律。","sec":"text3","sec_label":"Text 3","ctx":"Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it “controlled” the data and DeepMind merely “processed” it.","note":"按照现行法律。","forms":["under existing law"]},{"w":"miss the point","pos":"phr.","cn":"没有抓住要点、偏离问题实质。","sec":"text3","sec_label":"Text 3","ctx":"But this distinction misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value.","note":"没有抓住要点、偏离问题实质。","forms":["miss the point"]},{"w":"aggregation","pos":"n.","cn":"聚合、汇总，即把大量分散数据结合起来分析。","sec":"text3","sec_label":"Text 3","ctx":"But this distinction misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value.","note":"聚合、汇总，即把大量分散数据结合起来分析。","forms":["aggregation"]},{"w":"bits","pos":"词","cn":"此处指零散的数据片段，不宜只译成计算机中的“比特”。","sec":"text3","sec_label":"Text 3","ctx":"But this distinction misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value.","note":"此处指零散的数据片段，不宜只译成计算机中的“比特”。","forms":["bits"]},{"w":"benefit from","pos":"phr.","cn":"从……中获益。","sec":"text3","sec_label":"Text 3","ctx":"The great question is who should benefit from the analysis of all the data that our lives now generate.","note":"从……中获益。","forms":["benefit from"]},{"w":"generate data","pos":"phr.","cn":"产生数据。","sec":"text3","sec_label":"Text 3","ctx":"The great question is who should benefit from the analysis of all the data that our lives now generate.","note":"产生数据。","forms":["generate data"]},{"w":"build on","pos":"phr.","cn":"以……为基础、建立在……之上。","sec":"text3","sec_label":"Text 3","ctx":"Privacy law builds on the concept of damage to an individual from identifiable knowledge about them.","note":"以……为基础、建立在……之上。","forms":["build on"]},{"w":"identifiable knowledge","pos":"phr.","cn":"能够识别出特定个人的信息。","sec":"text3","sec_label":"Text 3","ctx":"Privacy law builds on the concept of damage to an individual from identifiable knowledge about them.","note":"能够识别出特定个人的信息。","forms":["identifiable knowledge"]},{"w":"surveillance economy","pos":"phr.","cn":"监控经济，指通过持续收集、汇总和分析个人数据来创造商业价值的经济模式。","sec":"text3","sec_label":"Text 3","ctx":"That misses the way the surveillance economy works.","note":"监控经济，指通过持续收集、汇总和分析个人数据来创造商业价值的经济模式。","forms":["surveillance economy"]},{"w":"That","pos":"词","cn":"指上一句隐私法关注“可识别信息对单个个人造成损害”的基本思路。","sec":"text3","sec_label":"Text 3","ctx":"That misses the way the surveillance economy works.","note":"指上一句隐私法关注“可识别信息对单个个人造成损害”的基本思路。","forms":["That"]},{"w":"curb","pos":"词","cn":"此处作动词，意为“控制、约束”。","sec":"text3","sec_label":"Text 3","ctx":"The use of privacy law to curb the tech giants in this instance feels slightly maladapted.","note":"此处作动词，意为“控制、约束”。","forms":["curb"]},{"w":"maladapted","pos":"v./adj.","cn":"不适应的、不完全适合特定用途的；这里指隐私法没有精准对应真正风险。","sec":"text3","sec_label":"Text 3","ctx":"The use of privacy law to curb the tech giants in this instance feels slightly maladapted.","note":"不适应的、不完全适合特定用途的；这里指隐私法没有精准对应真正风险。","forms":["maladapted"]},{"w":"in this instance","pos":"phr.","cn":"在这个具体案例中。","sec":"text3","sec_label":"Text 3","ctx":"The use of privacy law to curb the tech giants in this instance feels slightly maladapted.","note":"在这个具体案例中。","forms":["in this instance"]},{"w":"address","pos":"词","cn":"常见义为“地址”或“致辞”；此处作动词，意为“处理、应对”。","sec":"text3","sec_label":"Text 3","ctx":"This practice does not address the real worry.","note":"常见义为“地址”或“致辞”；此处作动词，意为“处理、应对”。","forms":["address"]},{"w":"This practice","pos":"phr.","cn":"指上一句所说的用传统隐私法约束科技巨头。","sec":"text3","sec_label":"Text 3","ctx":"This practice does not address the real worry.","note":"指上一句所说的用传统隐私法约束科技巨头。","forms":["This practice"]},{"w":"private monopoly","pos":"phr.","cn":"私人垄断者或私人垄断企业；此处具体指可能独占算法和数据价值的科技巨头。","sec":"text3","sec_label":"Text 3","ctx":"What matters is that they will belong to a private monopoly which developed them using public resources.","note":"私人垄断者或私人垄断企业；此处具体指可能独占算法和数据价值的科技巨头。","forms":["private monopoly"]},{"w":"public resources","pos":"phr.","cn":"公共资源，这里包括 NHS 的公共医疗体系及患者数据。","sec":"text3","sec_label":"Text 3","ctx":"What matters is that they will belong to a private monopoly which developed them using public resources.","note":"公共资源，这里包括 NHS 的公共医疗体系及患者数据。","forms":["public resources"]},{"w":"promise to do sth.","pos":"phr.","cn":"此处不是“承诺做某事”，而是“有望、显示出做某事的潜力”。","sec":"text3","sec_label":"Text 3","ctx":"If software promises to save lives on the scale that drugs now can, big data may be expected to behave as a big pharma has done.","note":"此处不是“承诺做某事”，而是“有望、显示出做某事的潜力”。","forms":["promise to do sth."]},{"w":"big pharma","pos":"phr.","cn":"大型制药企业或制药巨头。","sec":"text3","sec_label":"Text 3","ctx":"If software promises to save lives on the scale that drugs now can, big data may be expected to behave as a big pharma has done.","note":"大型制药企业或制药巨头。","forms":["big pharma"]},{"w":"at the beginning of","pos":"phr.","cn":"处于……的开端。","sec":"text3","sec_label":"Text 3","ctx":"We are still at the beginning of this revolution and small choices now may turn out to have gigantic consequences later.","note":"处于……的开端。","forms":["at the beginning of"]},{"w":"turn out to do sth.","pos":"phr.","cn":"结果是……、后来证明会……。","sec":"text3","sec_label":"Text 3","ctx":"We are still at the beginning of this revolution and small choices now may turn out to have gigantic consequences later.","note":"结果是……、后来证明会……。","forms":["turn out to do sth."]},{"w":"gigantic consequences","pos":"phr.","cn":"极其重大的后果。","sec":"text3","sec_label":"Text 3","ctx":"We are still at the beginning of this revolution and small choices now may turn out to have gigantic consequences later.","note":"极其重大的后果。","forms":["gigantic consequences"]},{"w":"digital feudalism","pos":"phr.","cn":"数字封建主义，比喻少数科技巨头像封建领主一样控制关键数据、算法和由此产生的利益。","sec":"text3","sec_label":"Text 3","ctx":"A long struggle will be needed to avoid a future of digital feudalism.","note":"数字封建主义，比喻少数科技巨头像封建领主一样控制关键数据、算法和由此产生的利益。","forms":["digital feudalism"]},{"w":"welcome","pos":"词","cn":"此处作形容词，意为“令人乐见的、可喜的”。","sec":"text3","sec_label":"Text 3","ctx":"Ms Denham’s report is a welcome start.","note":"此处作形容词，意为“令人乐见的、可喜的”。","forms":["welcome"]},{"w":"a ... start","pos":"phr.","cn":"强调报告只是治理的起点，并非已经解决全部问题。","sec":"text3","sec_label":"Text 3","ctx":"Ms Denham’s report is a welcome start.","note":"强调报告只是治理的起点，并非已经解决全部问题。","forms":["a ... start"]},{"w":"bleed red ink","pos":"phr.","cn":"字面是“流出红墨水”；财务语境中指不断出现赤字、持续亏损。","sec":"text4","sec_label":"Text 4","ctx":"The U.S. Postal Service (USPS) continues to bleed red ink.","note":"字面是“流出红墨水”；财务语境中指不断出现赤字、持续亏损。","forms":["bleed red ink"]},{"w":"net loss","pos":"phr.","cn":"净亏损。","sec":"text4","sec_label":"Text 4","ctx":"It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue.","note":"净亏损。","forms":["net loss"]},{"w":"fiscal 2016","pos":"phr.","cn":"2016 财年。","sec":"text4","sec_label":"Text 4","ctx":"It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue.","note":"2016 财年。","forms":["fiscal 2016"]},{"w":"the 10th straight year","pos":"phr.","cn":"连续第十年。","sec":"text4","sec_label":"Text 4","ctx":"It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue.","note":"连续第十年。","forms":["the 10th straight year"]},{"w":"expenses exceed revenue","pos":"phr.","cn":"支出超过收入。","sec":"text4","sec_label":"Text 4","ctx":"It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue.","note":"支出超过收入。","forms":["expenses exceed revenue"]},{"w":"unfunded liabilities","pos":"phr.","cn":"无资金保障负债，即已有支付义务却没有预留足够资金。","sec":"text4","sec_label":"Text 4","ctx":"Meanwhile, it has more than $120 billion in unfunded liabilities, mostly for employee health and retirement costs.","note":"无资金保障负债，即已有支付义务却没有预留足够资金。","forms":["unfunded liabilities"]},{"w":"employee health and retirement costs","pos":"phr.","cn":"员工医疗与退休成本。","sec":"text4","sec_label":"Text 4","ctx":"Meanwhile, it has more than $120 billion in unfunded liabilities, mostly for employee health and retirement costs.","note":"员工医疗与退休成本。","forms":["employee health and retirement costs"]},{"w":"find oneself at the brink of","pos":"phr.","cn":"发现自己处在……的边缘。","sec":"text4","sec_label":"Text 4","ctx":"There are many reasons this formerly stable federal institution finds itself at the brink of bankruptcy.","note":"发现自己处在……的边缘。","forms":["find oneself at the brink of"]},{"w":"at the brink of bankruptcy","pos":"phr.","cn":"濒临破产。","sec":"text4","sec_label":"Text 4","ctx":"There are many reasons this formerly stable federal institution finds itself at the brink of bankruptcy.","note":"濒临破产。","forms":["at the brink of bankruptcy"]},{"w":"bread-and-butter","pos":"词","cn":"字面为“面包和黄油”；作定语指赖以生存的、最基本的收入来源。","sec":"text4","sec_label":"Text 4","ctx":"Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, an","note":"字面为“面包和黄油”；作定语指赖以生存的、最基本的收入来源。","forms":["bread-and-butter"]},{"w":"first-class mail","pos":"phr.","cn":"美国邮政的一类邮件，通常包括信件和明信片，不是“头等舱邮件”。","sec":"text4","sec_label":"Text 4","ctx":"Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, an","note":"美国邮政的一类邮件，通常包括信件和明信片，不是“头等舱邮件”。","forms":["first-class mail"]},{"w":"decrease demand for","pos":"phr.","cn":"降低对……的需求。","sec":"text4","sec_label":"Text 4","ctx":"Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, an","note":"降低对……的需求。","forms":["decrease demand for"]},{"w":"deny sb. the flexibility to do sth.","pos":"phr.","cn":"使某人没有灵活做某事的空间。","sec":"text4","sec_label":"Text 4","ctx":"Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, an","note":"使某人没有灵活做某事的空间。","forms":["deny sb. the flexibility to do sth."]},{"w":"adjust operations to the new reality","pos":"phr.","cn":"调整运营以适应新现实。","sec":"text4","sec_label":"Text 4","ctx":"Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, an","note":"调整运营以适应新现实。","forms":["adjust operations to the new reality"]},{"w":"interest group","pos":"phr.","cn":"利益集团，即围绕共同利益影响公共决策的组织，不是“兴趣小组”。","sec":"text4","sec_label":"Text 4","ctx":"And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS’s ultimate overseer – Congress – insisting that whatever","note":"利益集团，即围绕共同利益影响公共决策的组织，不是“兴趣小组”。","forms":["interest group"]},{"w":"self-interested","pos":"v./adj.","cn":"以自身利益为出发点的、自利的。","sec":"text4","sec_label":"Text 4","ctx":"And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS’s ultimate overseer – Congress – insisting that whatever","note":"以自身利益为出发点的、自利的。","forms":["self-interested"]},{"w":"status quo","pos":"phr.","cn":"现状、既有安排。","sec":"text4","sec_label":"Text 4","ctx":"And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS’s ultimate overseer – Congress – insisting that whatever","note":"现状、既有安排。","forms":["status quo"]},{"w":"range from A to B","pos":"phr.","cn":"范围从 A 延伸到 B。","sec":"text4","sec_label":"Text 4","ctx":"And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS’s ultimate overseer – Congress – insisting that whatever","note":"范围从 A 延伸到 B。","forms":["range from A to B"]},{"w":"exert pressure on","pos":"phr.","cn":"向……施加压力。","sec":"text4","sec_label":"Text 4","ctx":"And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS’s ultimate overseer – Congress – insisting that whatever","note":"向……施加压力。","forms":["exert pressure on"]},{"w":"ultimate overseer","pos":"phr.","cn":"最高监督者。","sec":"text4","sec_label":"Text 4","ctx":"And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS’s ultimate overseer – Congress – insisting that whatever","note":"最高监督者。","forms":["ultimate overseer"]},{"w":"pay one’s bills","pos":"phr.","cn":"支付应付款项、维持财务偿付，不仅指日常缴费。","sec":"text4","sec_label":"Text 4","ctx":"This is why repeated attempts at reform legislation have failed in recent years, leaving the Postal Service unable to pay its bills except by deferring vital modernizatio","note":"支付应付款项、维持财务偿付，不仅指日常缴费。","forms":["pay one’s bills"]},{"w":"defer","pos":"词","cn":"推迟、延后。","sec":"text4","sec_label":"Text 4","ctx":"This is why repeated attempts at reform legislation have failed in recent years, leaving the Postal Service unable to pay its bills except by deferring vital modernizatio","note":"推迟、延后。","forms":["defer"]},{"w":"word","pos":"词","cn":"常见义为“单词”；此处作不可数名词，意为“消息”。","sec":"text4","sec_label":"Text 4","ctx":"Now comes word that everyone involved – Democrats, Republicans, the Postal Service, the unions and the system’s heaviest users – has finally agreed on a plan to fix the s","note":"常见义为“单词”；此处作不可数名词，意为“消息”。","forms":["word"]},{"w":"heavy user","pos":"phr.","cn":"某项服务的高频或大量使用者，不是“体重较大的用户”。","sec":"text4","sec_label":"Text 4","ctx":"Now comes word that everyone involved – Democrats, Republicans, the Postal Service, the unions and the system’s heaviest users – has finally agreed on a plan to fix the s","note":"某项服务的高频或大量使用者，不是“体重较大的用户”。","forms":["heavy user"]},{"w":"the House","pos":"phr.","cn":"美国国会众议院。","sec":"text4","sec_label":"Text 4","ctx":"Legislation is moving through the House that would save USPS an estimated $28.6 billion over five years, which could help pay for new vehicles, among other survival measu","note":"美国国会众议院。","forms":["the House"]},{"w":"move through","pos":"phr.","cn":"此处指法案在立法程序中推进。","sec":"text4","sec_label":"Text 4","ctx":"Legislation is moving through the House that would save USPS an estimated $28.6 billion over five years, which could help pay for new vehicles, among other survival measu","note":"此处指法案在立法程序中推进。","forms":["move through"]},{"w":"survival measures","pos":"phr.","cn":"帮助机构维持运转、渡过危机的措施。","sec":"text4","sec_label":"Text 4","ctx":"Legislation is moving through the House that would save USPS an estimated $28.6 billion over five years, which could help pay for new vehicles, among other survival measu","note":"帮助机构维持运转、渡过危机的措施。","forms":["survival measures"]},{"w":"a penny-per-letter permanent rate increase","pos":"phr.","cn":"每封信永久加价一美分。","sec":"text4","sec_label":"Text 4","ctx":"Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare.","note":"每封信永久加价一美分。","forms":["a penny-per-letter permanent rate increase"]},{"w":"shift sb. into Medicare","pos":"phr.","cn":"把某人转入美国联邦医疗保险计划。","sec":"text4","sec_label":"Text 4","ctx":"Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare.","note":"把某人转入美国联邦医疗保险计划。","forms":["shift sb. into Medicare"]},{"w":"postal retirees","pos":"phr.","cn":"邮政系统退休人员。","sec":"text4","sec_label":"Text 4","ctx":"Most of the money would come from a penny-per-letter permanent rate increase and from shifting postal retirees into Medicare.","note":"邮政系统退休人员。","forms":["postal retirees"]},{"w":"the latter step","pos":"phr.","cn":"指前句两项措施中的后一项，即把邮政退休人员纳入 Medicare。","sec":"text4","sec_label":"Text 4","ctx":"The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its union","note":"指前句两项措施中的后一项，即把邮政退休人员纳入 Medicare。","forms":["the latter step"]},{"w":"offset","pos":"词","cn":"抵消、弥补。","sec":"text4","sec_label":"Text 4","ctx":"The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its union","note":"抵消、弥补。","forms":["offset"]},{"w":"pre-fund","pos":"词","cn":"预先筹资，在费用实际发生前先行备足资金。","sec":"text4","sec_label":"Text 4","ctx":"The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its union","note":"预先筹资，在费用实际发生前先行备足资金。","forms":["pre-fund"]},{"w":"address a complaint","pos":"phr.","cn":"处理、回应一项不满或诉求。","sec":"text4","sec_label":"Text 4","ctx":"The latter step would largely offset the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its union","note":"处理、回应一项不满或诉求。","forms":["address a complaint"]},{"w":"clear the House","pos":"phr.","cn":"获众议院通过，不是“清空众议院”。","sec":"text4","sec_label":"Text 4","ctx":"If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary ","note":"获众议院通过，不是“清空众议院”。","forms":["clear the House"]},{"w":"get through the Senate","pos":"phr.","cn":"通过参议院审议。","sec":"text4","sec_label":"Text 4","ctx":"If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary ","note":"通过参议院审议。","forms":["get through the Senate"]},{"w":"amount to","pos":"phr.","cn":"等同于、实质上是。","sec":"text4","sec_label":"Text 4","ctx":"If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary ","note":"等同于、实质上是。","forms":["amount to"]},{"w":"keep ... afloat","pos":"phr.","cn":"本义为使……漂浮；此处指使机构在财务上维持运转、不致倒闭。","sec":"text4","sec_label":"Text 4","ctx":"If it clears the House, this measure would still have to get through the Senate – where someone is bound to point out that it amounts to the bare, bare minimum necessary ","note":"本义为使……漂浮；此处指使机构在财务上维持运转、不致倒闭。","forms":["keep ... afloat"]},{"w":"collective bargaining","pos":"phr.","cn":"集体谈判，通常指工会代表员工与雇主协商工资和劳动条件。","sec":"text4","sec_label":"Text 4","ctx":"There’s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency’s costs.","note":"集体谈判，通常指工会代表员工与雇主协商工资和劳动条件。","forms":["collective bargaining"]},{"w":"personnel","pos":"词","cn":"此处不是单指“人事部门”，而是指人员及相关成本。","sec":"text4","sec_label":"Text 4","ctx":"There’s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency’s costs.","note":"此处不是单指“人事部门”，而是指人员及相关成本。","forms":["personnel"]},{"w":"account for","pos":"phr.","cn":"占据某一比例。","sec":"text4","sec_label":"Text 4","ctx":"There’s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the agency’s costs.","note":"占据某一比例。","forms":["account for"]},{"w":"common-sense","pos":"词","cn":"合乎常理的、务实明智的；该评价直接体现作者支持取消周六信件投递。","sec":"text4","sec_label":"Text 4","ctx":"That common-sense change enjoys wide public support and would save the USPS $2 billion per year.","note":"合乎常理的、务实明智的；该评价直接体现作者支持取消周六信件投递。","forms":["common-sense"]},{"w":"kill a proposal/change","pos":"phr.","cn":"扼杀、阻止一项提案或改革获得通过。","sec":"text4","sec_label":"Text 4","ctx":"But postal special-interest groups seem to have killed it, at least in the House.","note":"扼杀、阻止一项提案或改革获得通过。","forms":["kill a proposal/change"]},{"w":"special-interest group","pos":"phr.","cn":"特殊利益集团，指为特定群体利益影响决策的组织。","sec":"text4","sec_label":"Text 4","ctx":"But postal special-interest groups seem to have killed it, at least in the House.","note":"特殊利益集团，指为特定群体利益影响决策的组织。","forms":["special-interest group"]},{"w":"emerging consensus","pos":"phr.","cn":"正在形成的共识。","sec":"text4","sec_label":"Text 4","ctx":"The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS.","note":"正在形成的共识。","forms":["emerging consensus"]},{"w":"politically embarrassing","pos":"phr.","cn":"会造成政治难堪的、在政治上有损颜面的。","sec":"text4","sec_label":"Text 4","ctx":"The emerging consensus around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS.","note":"会造成政治难堪的、在政治上有损颜面的。","forms":["politically embarrassing"]},{"w":"get serious about","pos":"phr.","cn":"开始认真对待、真正着手处理。","sec":"text4","sec_label":"Text 4","ctx":"It is not, however, a sign that they’re getting serious about transforming the postal system for the 21stcentury.","note":"开始认真对待、真正着手处理。","forms":["get serious about"]},{"w":"they","pos":"词","cn":"指 legislators（立法者）。","sec":"text4","sec_label":"Text 4","ctx":"It is not, however, a sign that they’re getting serious about transforming the postal system for the 21stcentury.","note":"指 legislators（立法者）。","forms":["they"]}],"sentences":[{"id":"2018-T1-P1-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Among the annoying challenges facing the middle class is one that will probably go unmentioned in the next presidential campaign: What happens when the robots come for their jobs?","core":"Among the annoying challenges ... is one ...，即“诸多挑战中有一个挑战”，是地点状语前置引起的完全倒装。","structure":"facing the middle class 是现在分词短语，修饰 challenges；that will probably go unmentioned ... 是定语从句，修饰 one；冒号后的疑问句具体说明这个挑战是什么。","key":"come for：常见义为“来取、来找”；此处带有威胁意味，指机器人“冲着中产阶层的工作而来、要取代这些岗位”。","zh":"中产阶层面临着种种恼人的挑战，其中有一个很可能不会在下一届总统竞选中被提及：当机器人来抢他们的工作时，会发生什么？","tip":"their 指 the middle class（中产阶层群体），不是 robots。"},{"id":"2018-T1-P2-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately squeezed.","core":"About half of U.S. jobs are at high risk of being automated.","structure":"according to ... 交代信息来源；with the middle class disproportionately squeezed 是 with + 宾语 + 过去分词 的独立结构，补充说明中产阶层承受的影响并不成比例地更大。","key":"squeeze：常见义为“挤压”；此处作比喻，表示中产阶层的就业空间和收入机会遭到压缩。","zh":"牛津大学的一项研究显示，美国约有一半的工作面临被自动化取代的高风险，而中产阶层受到的挤压尤其严重。","tip":"disproportionately 不是说中产阶层人数多，而是说其所受冲击相对于其他群体格外严重。"},{"id":"2018-T1-P2-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"But many middle-class occupations – trucking, financial advice, software engineering – have aroused their interest, or soon will.","core":"Many middle-class occupations have aroused their interest, or soon will.","structure":"两个破折号之间列举中产职业；or soon will 是省略结构，完整形式为 or soon will arouse their interest。","key":"arouse one’s interest：引起某人的兴趣；此处继续使用拟人，意为这些职业已经或即将成为自动化取代的对象。","zh":"但许多中产阶层从事的职业——货运、财务咨询、软件工程——已经引起了机器人的“兴趣”，即使现在还没有，也很快会如此。","tip":"their 指上一句中的 robots；不是这些职业引起了中产阶层的兴趣。"},{"id":"2018-T1-P3-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"The Industrial Revolution didn’t go so well for Luddites whose jobs were displaced by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed.","core":"The Industrial Revolution didn’t go so well for Luddites, but it raised living standards and created more jobs.","structure":"whose jobs were displaced ... 是定语从句，修饰 Luddites；than it destroyed 是比较从句，与 more jobs 呼应，destroyed 后省略 jobs。","key":"Luddite：卢德派成员；历史上指反对机器取代手工业劳动的工人，此处也带有“抵制技术变革者”的含义。；displace jobs：取代、消灭工作岗位。","zh":"工业革命对卢德派工人而言并不顺利，他们的工作被机械织布机取代；但工业革命最终提高了生活水平，而且创造的工作岗位比摧毁的更多。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T1-P3-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"Likewise, automation should eventually boost productivity, stimulate demand by driving down prices, and free workers from hard, boring work.","core":"Automation should boost ..., stimulate ..., and free ...，三个动词短语并列作谓语。","structure":"by driving down prices 作方式状语，直接说明如何 stimulate demand，不修饰另外两个并列谓语。","key":"boost productivity：提高生产率。；drive down prices：压低价格。；free sb. from ...：使某人摆脱……。","zh":"同样，自动化最终应当能够提高生产率、通过压低价格来刺激需求，并把劳动者从艰苦乏味的工作中解放出来。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T1-P4-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"The first step, as Erik Brynjolfsson and Andrew McAfee argue in The Second Machine Age, should be rethinking education and job training.","core":"The first step should be rethinking education and job training.","structure":"as ... argue in ... 是插入的方式状语从句，意为“正如……所主张的”；rethinking ... 是动名词短语作表语，说明第一步的具体内容。","key":"见下方词汇笔记","zh":"正如埃里克·布莱恩约尔松和安德鲁·麦卡菲在《第二次机器革命》中所主张的，第一步应当是重新思考教育与职业培训。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T1-P4-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Curriculums – from grammar school to college – should evolve to focus less on memorizing facts and more on creativity and complex communication.","core":"Curriculums should evolve.","structure":"破折号之间的 from grammar school to college 说明课程改革覆盖的教育阶段；to focus ... 表示课程调整的方向；less on ... and more on ... 构成对比。","key":"grammar school：此处按美国教育语境指“小学”，不是“语法学校”。；evolve：常见义为“进化”；此处指课程体系“逐步发展、调整”。；focus less on A and more on B：减少对 A 的关注，更多关注 B。；memorize facts：记忆事实性知识。","zh":"从小学到大学，课程都应当逐步调整，减少对事实记忆的关注，更多培养创造力和复杂沟通能力。","tip":"答案对应的是 creativity（创造潜能），而不是泛泛的个人需求或求职技巧。"},{"id":"2018-T1-P4-S06","sec":"text1","sec_label":"Text 1","level":3,"en":"Professionals trying to acquire new skills will be able to do so without going into debt.","core":"Professionals will be able to do so.","structure":"trying to acquire new skills 是现在分词短语，修饰 Professionals；do so 代替上文所说的接受额外培训、掌握新技能；without going into debt 作方式状语。","key":"acquire new skills：掌握新技能。；go into debt：陷入债务、负债。","zh":"希望掌握新技能的专业人士将能够在不负债的情况下接受这类培训。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T1-P5-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"The challenge of coping with automation underlines the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier.","core":"The challenge underlines the need: Starting new companies must be made easier.","structure":"of coping with automation 修饰 challenge；for the U.S. to revive ... 说明 need 的具体内容；冒号后的被动句进一步给出重振商业活力的办法。","key":"underline：常见义为“在……下画线”；此处作动词，意为“突出、强调”。；business dynamism：指企业不断创立、扩张、退出所体现的经济活力，不只是“商业动力”。","zh":"应对自动化的挑战凸显出美国重振其日渐衰退的商业活力的必要性：必须降低创办新公司的难度。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T1-P5-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"The U.S. needs the new companies that will invent them.","core":"The U.S. needs the new companies.","structure":"that will invent them 是定语从句，修饰 the new companies；them 指上一句的 the best uses，不是 3D 打印机和虚拟现实本身。","key":"见下方词汇笔记","zh":"美国需要由新公司来开发这些最佳用途。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T1-P6-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Finally, because automation threatens to widen the gap between capital income and labor income, taxes and the safety net will have to be rethought.","core":"Taxes and the safety net will have to be rethought.","structure":"because ... 是原因状语从句；threatens to widen ... 表示自动化有造成收入差距扩大的风险；between A and B 界定差距的两端。","key":"safety net：字面义为“安全网”；此处指为失业者和低收入者提供保障的社会福利制度。；rethink：不是简单地“再想一遍”，而是“重新审视并调整”。","zh":"最后，由于自动化可能扩大资本收入与劳动收入之间的差距，税收制度和社会保障体系都必须重新设计。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T1-P6-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax credit should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.","core":"Taxes ... need to be cut, and wage subsidies ... should be expanded: This would boost ..., encourage ..., reward ..., and reduce ... .","structure":"冒号前提出两项并列政策；such as ... 举例说明工资补贴；冒号后的 This 指代前述减税与扩大补贴这一整套做法；四个并列动词说明政策效果。","key":"wage subsidy：工资补贴；通过公共政策提高劳动者的实际所得。；earned income tax credit：劳动所得税抵免，美国面向中低收入劳动者的税收补助政策。；reward companies for job creation：因企业创造就业岗位而给予激励。","zh":"应当降低针对低工资劳动的税负，并扩大劳动所得税抵免等工资补贴：这样做既能提高收入、鼓励就业，也能奖励创造岗位的企业并缩小不平等。","tip":"这些税收政策的最终指向是阻止收入差距继续扩大，而不是鼓励自动化本身或提高资本回报。"},{"id":"2018-T1-P7-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Technology will improve society in ways big and small over the next few years, yet this will be little comfort to those who find their lives and careers upended by automation.","core":"Technology will improve society, yet this will be little comfort to those.","structure":"in ways big and small 表示影响方式不论大小；who find ... 是定语从句，修饰 those；their lives and careers upended 是 find + 宾语 + 过去分词作宾补 结构。","key":"upend：本义为“使倒立”；此处意为“彻底打乱、颠覆”。；little comfort：几乎算不上安慰；little 表否定含义。","zh":"未来几年，技术会从大大小小的方面改善社会；然而，对那些发现自己的生活和职业被自动化彻底打乱的人来说，这并不能带来多少安慰。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T1-P7-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Destroying the machines that are coming for our jobs would be nuts.","core":"Destroying the machines would be nuts.","structure":"动名词短语作主语；that are coming for our jobs 是定语从句，修饰 machines，并回扣首段的 robots come for their jobs。","key":"nuts：口语形容词，意为“疯狂的、荒唐的”，不是“坚果”。","zh":"摧毁那些正要抢走我们工作的机器，无疑是疯狂之举。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T1-P7-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"But policies to help workers adapt will be indispensable.","core":"Policies will be indispensable.","structure":"to help workers adapt 是不定式短语，后置修饰 policies，说明政策的目的和内容。","key":"indispensable：不可或缺的、必不可少的。；be at high risk of being automated：面临被自动化取代的高风险。；be disproportionately squeezed：受到格外严重、不成比例的挤压。；drive down prices：压低价格。","zh":"但是，帮助劳动者适应这种变化的政策将不可或缺。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T2-P1-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president’s social media platform.","core":"The implication is that Millennials prefer news ... to be filtered ... .","structure":"that ... 引导表语从句；prefer + 宾语 + to be done 表示“更希望某事物被怎样处理”；not ... 排除总统的社交媒体平台这一直接来源。","key":"filter：常见义为“过滤杂质”；此处指新闻经过其他媒体来源的核查、筛选和编辑。；Millennials：千禧一代，通常指出生并成长于数字化时代的一代人。","zh":"这意味着，千禧一代更希望来自白宫的新闻经过其他信息来源的筛选，而不是直接出自总统的社交媒体平台。","tip":"年轻人质疑的不是新闻筛选本身，恰恰是未经其他来源筛选、直接由总统社交账号发布信息的做法。"},{"id":"2018-T2-P2-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Yet as distrust has risen toward all media, people may be starting to beef up their media literacy skills.","core":"People may be starting to beef up their media literacy skills.","structure":"as distrust has risen toward all media 是伴随变化的状语从句，说明媒介素养提升的背景；may be starting to 表示谨慎推测，而非已经确定完成。","key":"beef up：口语短语，意为“加强、充实、提高”，此处近义于选项中的 sharpen，与“牛肉”无关。；literacy：常见义为“读写能力”；media literacy 指辨识、理解和评估媒体信息的能力。","zh":"然而，随着人们对各种媒体的不信任不断上升，他们或许正开始强化自己的媒介素养。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T2-P2-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"During the 2016 presidential campaign, nearly a quarter of web content shared by Twitter users in the politically critical state of Michigan was fake news, according to the University of Oxford.","core":"Nearly a quarter of web content was fake news.","structure":"shared by Twitter users 是过去分词短语，修饰 web content；in the politically critical state of Michigan 限定用户所在地区；according to ... 交代研究来源。","key":"critical：常见义为“批判的”；此处意为“关键的、至关重要的”，强调密歇根州在选举政治中的重要性。","zh":"牛津大学的研究显示，在 2016 年总统竞选期间，政治上至关重要的密歇根州内，推特用户所分享的网络内容有近四分之一是假新闻。","tip":"a quarter 指被分享的网络内容中约四分之一是假新闻，不是说四分之一的推特用户制造了假新闻。"},{"id":"2018-T2-P2-S05","sec":"text2","sec_label":"Text 2","level":3,"en":"And a survey conducted for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant.","core":"A survey found (that) 44 percent of Facebook users rarely or never trust news.","structure":"conducted for BuzzFeed News 是过去分词短语，修饰 survey；found 后省略宾语从句连接词 that；from the media giant 修饰 news。","key":"rarely or never trust：很少信任或从不信任。；the media giant：这家媒体巨头，回指 Facebook。","zh":"而为 BuzzFeed News 所做的一项调查发现，44% 的 Facebook 用户很少信任或从不信任这家媒体巨头提供的新闻。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T2-P3-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Young people who are digital natives are indeed becoming more skillful at separating fact from fiction in cyberspace.","core":"Young people are becoming more skillful.","structure":"who are digital natives 是定语从句，修饰 Young people；at separating ... 说明他们越来越熟练的具体事项。","key":"digital native：数字原住民，指从小接触数字技术并在数字环境中成长的人。；separate fact from fiction：辨别事实与虚构；识别信息真伪。；cyberspace：网络空间。","zh":"作为数字原住民的年轻人确实越来越善于在网络空间中辨别事实与虚构。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T2-P3-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"A Knight Foundation focus-group survey of young people between ages 14 and 24 found they use “distributed trust” to verify stories.","core":"A survey found (that) they use “distributed trust”.","structure":"of young people between ages 14 and 24 说明调查对象；found 后省略 that；to verify stories 是目的状语。","key":"focus-group survey：焦点小组调查，通过小组访谈了解受访者的看法与行为。；distributed trust：分布式信任，即不依赖单一权威来源，而是通过多个来源交叉验证信息。；verify stories：核实新闻报道。","zh":"奈特基金会对 14 至 24 岁年轻人开展的一项焦点小组调查发现，他们会利用“分布式信任”来核实新闻报道。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T2-P3-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"They cross-check sources and prefer news from different perspectives – especially those that are open about any bias.","core":"They cross-check sources and prefer news.","structure":"两个动词短语并列；from different perspectives 修饰 news；those that are open about any bias 中，those 代指不同的新闻来源，that ... 是定语从句。","key":"be open about：坦诚说明、不隐瞒；此处不是“对……持开放态度”。；bias：偏见、倾向性；在新闻语境中指报道立场可能造成的偏向。；cross-check sources：交叉核对信息来源。；from different perspectives：来自不同视角。","zh":"他们会交叉核对信息来源，并更愿意选择来自不同视角的新闻，尤其是那些会坦诚说明自身偏见的来源。","tip":"distributed trust 不是交流关于“分布式信任”的观点，而是参考多样来源并进行交叉核验的方法。"},{"id":"2018-T2-P3-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"“Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing viewpoints,” the survey concluded.","core":"The survey concluded, “Many young people assume ... responsibility.”","structure":"直接引语置于引述语之前；for educating themselves and actively seeking out ... 说明所承担责任的具体内容，两个动名词短语并列。","key":"assume responsibility for：承担……的责任。；seek out opposing viewpoints：主动寻找相反的观点。","zh":"“许多年轻人主动承担起很大一部分责任，自我学习并积极寻找对立观点，”该调查总结道。","tip":"这里的责任范围很具体，即自我教育并主动接触相反观点，不能扩大成笼统意义上的“责任感很强”。"},{"id":"2018-T2-P4-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"A 2014 survey conducted in Australia, Britain, and the United States by the University of Wisconsin-Madison found that young people’s reliance on social media led to greater political engagement.","core":"A survey found that young people’s reliance ... led to greater political engagement.","structure":"conducted ... by ... 是过去分词短语，修饰 survey；其中地点状语在前、实施者由 by 引出；that ... 是 found 的宾语从句。","key":"engagement：常见义为“订婚”或“约定”；此处意为“参与、投入”，political engagement 即政治参与。","zh":"威斯康星大学麦迪逊分校 2014 年在澳大利亚、英国和美国开展的一项调查发现，年轻人依赖社交媒体会使其政治参与度提高。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T2-P5-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Social media allows users to experience news events more intimately and immediately while also permitting them to re-share news as a projection of their values and interests.","core":"Social media allows users to experience ... while also permitting them to re-share ... .","structure":"allow sb. to do 与 permit sb. to do 表达两个同时存在的作用；more intimately and immediately 修饰 experience；as a projection ... 说明转发行为所承担的功能。","key":"intimately：常见义与“亲密”有关；此处指用户能够更贴近新闻事件、更有切身感。；projection：常见义为“预测、投影”；此处意为个人价值观和兴趣的“外在表达、投射”。；permit sb. to do sth.：允许某人做某事。；re-share news：再次分享、转发新闻。","zh":"社交媒体让用户能够以更贴近、更即时的方式感受新闻事件，同时也允许他们把转发新闻当作自身价值观和兴趣的投射。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T2-P5-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"A survey by Barna research group found the top reason given by Americans for the fake news phenomenon is “reader error,” more so than made-up stories or factual mistakes in reporting.","core":"A survey found (that) the top reason ... is “reader error”.","structure":"by Barna research group 修饰 survey；given by Americans 是过去分词短语，修饰 the top reason；for the fake news phenomenon 说明原因所针对的现象；more so than ... 把读者错误与编造报道、事实错误作比较。","key":"top reason：首要原因、最主要的原因。；reader error：读者在理解、判断或转发信息时产生的错误。；more so than：比……更是如此；这里表示“读者错误”比后两类新闻生产端错误更被视为主要原因。","zh":"巴纳研究集团的一项调查发现，美国人认为假新闻现象的首要原因是“读者错误”，其影响甚至超过了编造报道或新闻报道中的事实错误。","tip":"调查强调的是读者端的错误，而不是把首要责任归给记者的偏见、编造或事实失误。"},{"id":"2018-T2-P5-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"About a third say the problem of fake news lies in “misinterpretation or exaggeration of actual news” via social media.","core":"About a third say (that) the problem ... lies in “misinterpretation or exaggeration ...”.","structure":"About a third 指约三分之一的受访者；say 后省略 that；of actual news 说明被误读或夸大的对象；via social media 说明这种信息变形发生和传播的渠道。","key":"lie in：在于；问题或原因存在于某处。；misinterpretation or exaggeration：误读或夸大。；actual news：真实发生、确有事实依据的新闻。","zh":"约三分之一的受访者认为，假新闻问题在于真实新闻在社交媒体上遭到“误读或夸大”。","tip":"原文不是说读者持有“过时价值观”，而是说他们可能错误理解或夸大真实新闻。"},{"id":"2018-T2-P5-S06","sec":"text2","sec_label":"Text 2","level":3,"en":"“This indicates there is a real personal responsibility in counteracting this problem,” says Roxanne Stone, editor in chief at Barna Group.","core":"Roxanne Stone says, “This indicates ... .”","structure":"直接引语前置；there is ... 是省略了连接词 that 的宾语从句；editor in chief at Barna Group 是 Roxanne Stone 的同位语。","key":"counteract a problem：抵消、遏制某个问题造成的影响。；editor in chief：主编。","zh":"“这表明，在抵制这一问题的过程中，个人确实负有责任，”巴纳集团主编罗克珊·斯通说道。","tip":"This 指前文关于读者误读、夸大和选择性转发会助长假新闻的调查结论。"},{"id":"2018-T2-P6-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"So when young people are critical of an over-tweeting president, they reveal a mental discipline in thinking skills – and in their choices on when to share on social media.","core":"When young people are critical ..., they reveal a mental discipline.","structure":"when ... 是时间兼条件背景的状语从句；in thinking skills 与 in their choices ... 并列，具体说明这种自律表现在哪些方面；on when to share 中“疑问词 + 不定式”说明选择的内容。","key":"be critical of：批评、不赞成；不是单纯“对……至关重要”。；discipline：常见义为“学科、纪律、惩罚”；此处指克制而审慎的“自律”。；over-tweeting：发推过多、过度使用推特发声。；filter news through other sources：通过其他来源筛选、核查新闻。","zh":"因此，当年轻人批评一位发推过度的总统时，他们展现出一种思维上的自律——这种自律既体现在思考能力上，也体现在他们对何时在社交媒体上分享信息的选择上。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T3-P1-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Any fair-minded assessment of the dangers of the deal between Britain’s National Health Service (NHS) and DeepMind must start by acknowledging that both sides mean well.","core":"Any fair-minded assessment must start by acknowledging ... .","structure":"of the dangers 修饰 assessment；of the deal between ... and ... 继续限定风险来自哪项协议；by acknowledging that ... 说明评估的起点，其中 that ... 作 acknowledging 的宾语。","key":"fair-minded：公正的、不偏不倚的。；assessment of the dangers：对风险的评估。；mean well：出于好意、本意良善。","zh":"任何公允地评估英国国民医疗服务体系（NHS）与 DeepMind 之间这项协议所含风险的做法，都必须首先承认双方的本意是好的。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T3-P1-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"The potential of this work applied to healthcare is very great, but it could also lead to further concentration of power in the tech giants.","core":"The potential ... is very great, but it could also lead to ... .","structure":"applied to healthcare 是过去分词短语，修饰 this work；it 指把 DeepMind 的技术工作应用于医疗这一做法；in the tech giants 表示权力集中在科技巨头手中。","key":"potential：此处作名词，意为“潜力、可能产生的价值”。；concentration of power：权力集中，不是注意力集中。","zh":"把这项工作应用于医疗保健的潜力十分巨大，但它也可能使权力进一步集中到科技巨头手中。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T3-P1-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"It is against that background that the information commissioner, Elizabeth Denham, has issued her damning verdict against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a vague agreement which took far too little account of the patients’ rights and their expectations of privacy.","core":"It is against that background that the information commissioner has issued her verdict against the hospital trust.","structure":"It is ... that ... 是强调句，突出裁定产生的背景；Elizabeth Denham 是 the information commissioner 的同位语；which handed over ... 是非限制性定语从句，补充说明医院信托做了什么；第二个 which took ... account of ... 修饰 a vague agreement。","key":"trust：常见义为“信任”；此处指 NHS 体系中负责运营医疗机构的“医疗信托机构”。；damning：严厉谴责的、极具否定性的。；take account of：考虑、顾及。；issue a verdict against ...：作出不利于……的裁定。","zh":"正是在这一背景下，信息专员伊丽莎白·德纳姆对 NHS 旗下的皇家自由医院信托作出了措辞严厉的裁定：该信托在 2015 年依据一份含糊的协议，将 160 万名患者的记录交给 DeepMind，而这份协议远远没有充分顾及患者的权利及其对隐私的合理期待。","tip":"离第二个 which 最近的先行词是 a vague agreement，因此是协议未充分顾及患者权利，而不是 160 万份患者记录“未顾及权利”。"},{"id":"2018-T3-P2-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"Further arrangements – and there may be many – between the NHS and DeepMind will be carefully scrutinised to ensure that all necessary permissions have been asked of patients and all unnecessary data has been cleaned.","core":"Further arrangements will be carefully scrutinised.","structure":"破折号之间是插入语，补充后续安排可能很多；between the NHS and DeepMind 修饰 arrangements；to ensure that ... 表目的；that 从句中两个现在完成时的被动结构并列。","key":"scrutinise：仔细审查；本文采用英式拼写 scrutinised。；clean data：此处结合 unnecessary data，指把不必要的数据清除出数据集，而不是日常意义上的“清洗污渍”。","zh":"NHS 与 DeepMind 之间后续的合作安排——而且可能会有很多——都将受到仔细审查，以确保已经向患者征得所有必要许可，并且已经清除全部非必要数据。","tip":"permissions have been asked of patients 意为“已向患者请求许可”；不是让“许可”去询问患者。"},{"id":"2018-T3-P2-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"But privacy is not the only angle in this case and not even the most important.","core":"Privacy is not the only angle and not even the most important.","structure":"见原句","key":"angle：常见义为“角度”；此处指分析问题的“方面、视角”。","zh":"但是，隐私并不是看待本案的唯一角度，甚至不是最重要的角度。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T3-P2-S06","sec":"text3","sec_label":"Text 3","level":3,"en":"Ms Denham chose to concentrate the blame on the NHS trust, since under existing law it “controlled” the data and DeepMind merely “processed” it.","core":"Ms Denham chose to concentrate the blame on the NHS trust.","structure":"since ... 引导原因状语从句；从句内 it “controlled” ... 与 DeepMind merely “processed” ... 并列；第一个 it 指 the NHS trust，第二个 it 指 the data。","key":"concentrate the blame on：把责任主要归到……身上。；under existing law：按照现行法律。","zh":"德纳姆女士选择把责任集中归于 NHS 医疗信托，因为按照现行法律，是该信托“控制”数据，而 DeepMind 只是“处理”数据。","tip":"引号标出法律上的角色区分，作者下一句正要质疑这种区分是否抓住问题实质。"},{"id":"2018-T3-P2-S07","sec":"text3","sec_label":"Text 3","level":3,"en":"But this distinction misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value.","core":"This distinction misses the point.","structure":"that ... 是 the point 的同位语从句；从句内部是 it is A, not B, that ... 强调句，强调 processing and aggregation 而排除 the mere possession of bits；作者把“处理与聚合”视作一个整体的数据增值过程，因此关系分句使用单数 gives。","key":"miss the point：没有抓住要点、偏离问题实质。；aggregation：聚合、汇总，即把大量分散数据结合起来分析。；bits：此处指零散的数据片段，不宜只译成计算机中的“比特”。","zh":"但这种区分没有抓住关键：真正赋予数据价值的是对数据的处理与汇总，而不是仅仅占有一个个数据片段。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T3-P3-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"The great question is who should benefit from the analysis of all the data that our lives now generate.","core":"The great question is who should benefit from the analysis.","structure":"who ... 引导表语从句；of all the data 修饰 analysis；that our lives now generate 是定语从句，修饰 data。","key":"benefit from：从……中获益。；generate data：产生数据。","zh":"真正重大的问题是：谁应当从对我们如今生活所产生的全部数据的分析中获益。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T3-P3-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Privacy law builds on the concept of damage to an individual from identifiable knowledge about them.","core":"Privacy law builds on the concept of damage.","structure":"to an individual 说明损害的承受者；from identifiable knowledge about them 说明损害的来源；them 是性别中性的单数代词，回指 an individual。","key":"build on：以……为基础、建立在……之上。；identifiable knowledge：能够识别出特定个人的信息。","zh":"隐私法建立在这样一种损害概念之上：可识别个人身份的信息会对该个人造成伤害。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T3-P3-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"The data of an individual there gains its value only when it is compared with the data of countless millions more.","core":"The data of an individual gains its value.","structure":"there 指在 the surveillance economy 中；only when ... 表示必要条件，其中 it 指个人数据；countless millions more 指另外数以千万计的人，the data of 在语义上承接前文。","key":"见下方词汇笔记","zh":"在监控经济中，一个人的数据只有与另外数以千万计的人的数据进行比较时，才会获得价值。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T3-P4-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"It is not enough to say that the algorithms DeepMind develops will benefit patients and save lives.","core":"It is not enough to say ... .","structure":"It 是形式主语，真正主语是 to say ...；that ... 是 say 的宾语从句；DeepMind develops 是省略关系代词的定语从句，修饰 the algorithms。","key":"见下方词汇笔记","zh":"仅仅声称 DeepMind 开发的算法将使患者受益并挽救生命，是不够的。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T3-P4-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"What matters is that they will belong to a private monopoly which developed them using public resources.","core":"What matters is that they will belong to a private monopoly.","structure":"What matters 是主语从句，意为“真正重要的事情”；that ... 是表语从句；they 指前句的 algorithms；which developed them ... 是定语从句，修饰 a private monopoly；using public resources 作方式状语。","key":"private monopoly：私人垄断者或私人垄断企业；此处具体指可能独占算法和数据价值的科技巨头。；public resources：公共资源，这里包括 NHS 的公共医疗体系及患者数据。","zh":"真正要紧的是，这些算法将归一个私人垄断者所有，而该垄断者是利用公共资源开发出它们的。","tip":"作者真正担忧的不是算法未经控制地被使用，而是科技巨头利用公共资源开发算法后形成私人垄断。"},{"id":"2018-T3-P4-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"If software promises to save lives on the scale that drugs now can, big data may be expected to behave as a big pharma has done.","core":"If software promises ..., big data may be expected to behave ... .","structure":"If ... 引导条件状语从句；on the scale 表示“以这样的规模”；that drugs now can 是定语从句，修饰 the scale，can 后省略 save lives；as ... has done 是方式比较从句，done 代替 behaved。","key":"promise to do sth.：此处不是“承诺做某事”，而是“有望、显示出做某事的潜力”。；big pharma：大型制药企业或制药巨头。","zh":"如果软件有望像如今的药物那样大规模挽救生命，那么人们也可以预料，大数据企业会像大型制药公司过去那样行事。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T3-P4-S06","sec":"text3","sec_label":"Text 3","level":3,"en":"We are still at the beginning of this revolution and small choices now may turn out to have gigantic consequences later.","core":"We are at the beginning ... and small choices may turn out to have consequences.","structure":"见原句","key":"at the beginning of：处于……的开端。；turn out to do sth.：结果是……、后来证明会……。；gigantic consequences：极其重大的后果。","zh":"我们仍处在这场革命的开端，而今天看似微小的选择，日后可能会产生极其重大的后果。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T3-P4-S07","sec":"text3","sec_label":"Text 3","level":3,"en":"A long struggle will be needed to avoid a future of digital feudalism.","core":"A long struggle will be needed.","structure":"to avoid ... 是目的状语；a future of digital feudalism 指数字资源与权力高度集中于私人垄断者的未来。","key":"digital feudalism：数字封建主义，比喻少数科技巨头像封建领主一样控制关键数据、算法和由此产生的利益。","zh":"要避免一个数字封建主义的未来，还需要进行长期斗争。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T4-P1-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have exceeded revenue.","core":"It reported a net loss.","structure":"of $5.6 billion 说明亏损金额；for fiscal 2016 说明财年；逗号后的名词短语 the 10th straight year ... 补充解释这一亏损的连续性，其中 its expenses have exceeded revenue 是省略关系词的定语从句，修饰 year。","key":"net loss：净亏损。；fiscal 2016：2016 财年。；the 10th straight year：连续第十年。；expenses exceed revenue：支出超过收入。","zh":"美国邮政署报告称，2016 财年的净亏损为 56 亿美元；这已是其支出连续第十年超过收入。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T4-P1-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"There are many reasons this formerly stable federal institution finds itself at the brink of bankruptcy.","core":"There are many reasons.","structure":"(why) this ... institution finds itself ... 是修饰 reasons 的定语从句，省略了关系副词 why；formerly stable 与眼下濒临破产形成对比。","key":"find oneself at the brink of：发现自己处在……的边缘。；at the brink of bankruptcy：濒临破产。","zh":"这个曾经稳定的联邦机构如今发现自己濒临破产，背后存在许多原因。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2018-T4-P1-S05","sec":"text4","sec_label":"Text 4","level":3,"en":"Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.","core":"The USPS is in a historic squeeze between technological change and a regulatory structure.","structure":"between A and B 给出困境的两端；that has ... decreased demand ... 修饰 technological change；first-class mail 是 its bread-and-butter product 的同位语；第二个 that ... 修饰 a regulatory structure；to adjust ... 修饰 flexibility。","key":"squeeze：此处作名词，意为“两面夹击、进退两难的困境”。；bread-and-butter：字面为“面包和黄油”；作定语指赖以生存的、最基本的收入来源。；first-class mail：美国邮政的一类邮件，通常包括信件和明信片，不是“头等舱邮件”。；decrease demand for：降低对……的需求。","zh":"从根本上说，美国邮政署陷入了前所未有的两面夹击：一边是技术变革永久性地削弱了对其支柱产品——一类邮件——的需求；另一边是监管结构不允许管理层灵活调整运营以适应新的现实。","tip":"原文不是说技术升级成本太高，而是技术变化降低了传统邮件需求；也不是说管理者主观拒绝改革，而是监管结构使管理失去灵活性。"},{"id":"2018-T4-P2-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS’s ultimate overseer – Congress – insisting that whatever else happens to the Postal Service, aspects of the status quo they depend on get protected.","core":"Interest groups exert pressure on the USPS’s ultimate overseer.","structure":"ranging from ... to ... 修饰 interest groups；破折号之间的 Congress 是 ultimate overseer 的同位语；insisting that ... 是现在分词短语，说明施压时提出的要求；whatever else happens to ... 是让步状语从句；they depend on 是省略关系词的定语从句，修饰 aspects of the status quo。","key":"interest group：利益集团，即围绕共同利益影响公共决策的组织，不是“兴趣小组”。；self-interested：以自身利益为出发点的、自利的。；status quo：现状、既有安排。；range from A to B：范围从 A 延伸到 B。","zh":"而从邮政工会到贺卡制造商，各类利益集团都出于自身利益向美国邮政署的最高监督者——国会——施压，坚持认为无论邮政系统还会发生什么变化，它们所依赖的那些现状都必须受到保护。","tip":"they 指利益集团；利益集团要求保护的是各自依赖的既有制度安排，而不是笼统保护 USPS。"},{"id":"2018-T4-P2-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"This is why repeated attempts at reform legislation have failed in recent years, leaving the Postal Service unable to pay its bills except by deferring vital modernization.","core":"This is why repeated attempts ... have failed.","structure":"why ... 引导表语从句；at reform legislation 修饰 attempts；leaving ... 是现在分词短语，表示改革失败造成的结果；unable to pay ... 作宾补；except by deferring ... 表示唯一勉强应对财务压力的办法。","key":"pay one’s bills：支付应付款项、维持财务偿付，不仅指日常缴费。；defer：推迟、延后。","zh":"这正是近年来一次次邮政改革立法尝试均告失败的原因，结果美国邮政署除了推迟至关重要的现代化改造之外，已无力支付各项账单。","tip":"

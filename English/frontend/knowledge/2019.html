 would foreshadow many ethical questions to be rais","note":"尚未到来、尚未出现。","forms":["yet to come"]},{"w":"artificial general intelligence","pos":"phr.","cn":"通用人工智能，指能够像人一样处理广泛认知任务的智能系统。","sec":"text3","sec_label":"Text 3","ctx":"What is being called artificial general intelligence, machines that would imitate the way humans think, continues to evade scientists.","note":"通用人工智能，指能够像人一样处理广泛认知任务的智能系统。","forms":["artificial general intelligence"]},{"w":"evade","pos":"词","cn":"常见义为“逃避”；此处指通用人工智能仍未被科学家成功理解和实现。","sec":"text3","sec_label":"Text 3","ctx":"What is being called artificial general intelligence, machines that would imitate the way humans think, continues to evade scientists.","note":"常见义为“逃避”；此处指通用人工智能仍未被科学家成功理解和实现。","forms":["evade"]},{"w":"be fascinated by","pos":"phr.","cn":"对……深深着迷。","sec":"text3","sec_label":"Text 3","ctx":"Yet humans remain fascinated by the idea of robots that would look, move, and respond like humans, similar to those recently depicted on popular sci-fi TV series such as ","note":"对……深深着迷。","forms":["be fascinated by"]},{"w":"depict","pos":"词","cn":"描绘、刻画。","sec":"text3","sec_label":"Text 3","ctx":"Yet humans remain fascinated by the idea of robots that would look, move, and respond like humans, similar to those recently depicted on popular sci-fi TV series such as ","note":"描绘、刻画。","forms":["depict"]},{"w":"far too ... to do","pos":"phr.","cn":"太过……以至于无法……，far 加强程度。","sec":"text3","sec_label":"Text 3","ctx":"Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University neuroscientist.","note":"太过……以至于无法……，far 加强程度。","forms":["far too ... to do"]},{"w":"let alone","pos":"phr.","cn":"更不用说。","sec":"text3","sec_label":"Text 3","ctx":"Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University neuroscientist.","note":"更不用说。","forms":["let alone"]},{"w":"neuroscientist","pos":"词","cn":"神经科学家。","sec":"text3","sec_label":"Text 3","ctx":"Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University neuroscientist.","note":"神经科学家。","forms":["neuroscientist"]},{"w":"get there","pos":"phr.","cn":"字面为“到达那里”；此处指机器达到拥有或模拟人类意识的水平。","sec":"text3","sec_label":"Text 3","ctx":"“We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.”","note":"字面为“到达那里”；此处指机器达到拥有或模拟人类意识的水平。","forms":["get there"]},{"w":"at hand","pos":"phr.","cn":"临近的、眼前需要处理的。","sec":"text3","sec_label":"Text 3","ctx":"But that doesn’t mean crucial ethical issues involving AI aren’t at hand.","note":"临近的、眼前需要处理的。","forms":["at hand"]},{"w":"doesn’t mean ... aren’t ...","pos":"phr.","cn":"双重否定结构，实际强调伦理问题已经迫在眉睫。","sec":"text3","sec_label":"Text 3","ctx":"But that doesn’t mean crucial ethical issues involving AI aren’t at hand.","note":"双重否定结构，实际强调伦理问题已经迫在眉睫。","forms":["doesn’t mean ... aren’t ..."]},{"w":"autonomous vehicle","pos":"phr.","cn":"自动驾驶车辆。","sec":"text3","sec_label":"Text 3","ctx":"The coming use of autonomous vehicles, for example, poses thorny ethical questions.","note":"自动驾驶车辆。","forms":["autonomous vehicle"]},{"w":"pose a thorny question","pos":"phr.","cn":"提出一个棘手问题。","sec":"text3","sec_label":"Text 3","ctx":"The coming use of autonomous vehicles, for example, poses thorny ethical questions.","note":"提出一个棘手问题。","forms":["pose a thorny question"]},{"w":"split-second decision","pos":"phr.","cn":"瞬间作出的决定。","sec":"text3","sec_label":"Text 3","ctx":"Human drivers sometimes must make split-second decisions.","note":"瞬间作出的决定。","forms":["split-second decision"]},{"w":"input","pos":"词","cn":"此处指供决策使用的信息或经验输入，不是单纯的“输入动作”。","sec":"text3","sec_label":"Text 3","ctx":"Their reactions may be a complex combination of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment.","note":"此处指供决策使用的信息或经验输入，不是单纯的“输入动作”。","forms":["input"]},{"w":"instant reflex","pos":"phr.","cn":"即时的本能反射。","sec":"text3","sec_label":"Text 3","ctx":"Their reactions may be a complex combination of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment.","note":"即时的本能反射。","forms":["instant reflex"]},{"w":"not nearly as ... as","pos":"phr.","cn":"远没有……那么……。","sec":"text3","sec_label":"Text 3","ctx":"AI “vision” today is not nearly as sophisticated as that of humans.","note":"远没有……那么……。","forms":["not nearly as ... as"]},{"w":"sophisticated","pos":"v./adj.","cn":"此处意为“先进精密的、成熟的”。","sec":"text3","sec_label":"Text 3","ctx":"AI “vision” today is not nearly as sophisticated as that of humans.","note":"此处意为“先进精密的、成熟的”。","forms":["sophisticated"]},{"w":"that","pos":"词","cn":"代替前面的 vision，即 the vision of humans，避免重复。","sec":"text3","sec_label":"Text 3","ctx":"AI “vision” today is not nearly as sophisticated as that of humans.","note":"代替前面的 vision，即 the vision of humans，避免重复。","forms":["that"]},{"w":"anticipate a situation","pos":"phr.","cn":"预见某种情形并提前作准备。","sec":"text3","sec_label":"Text 3","ctx":"And to anticipate every imaginable driving situation is a difficult programming problem.","note":"预见某种情形并提前作准备。","forms":["anticipate a situation"]},{"w":"every imaginable ...","pos":"phr.","cn":"所有可能想象到的……。","sec":"text3","sec_label":"Text 3","ctx":"And to anticipate every imaginable driving situation is a difficult programming problem.","note":"所有可能想象到的……。","forms":["every imaginable ..."]},{"w":"masses of data","pos":"phr.","cn":"海量数据。","sec":"text3","sec_label":"Text 3","ctx":"Whenever decisions are based on masses of data, “you quickly get into a lot of ethical questions,” notes Tan Kiat How, chief executive of a Singapore-based agency that is","note":"海量数据。","forms":["masses of data"]},{"w":"voluntary code","pos":"phr.","cn":"自愿遵守的行为准则。","sec":"text3","sec_label":"Text 3","ctx":"Whenever decisions are based on masses of data, “you quickly get into a lot of ethical questions,” notes Tan Kiat How, chief executive of a Singapore-based agency that is","note":"自愿遵守的行为准则。","forms":["voluntary code"]},{"w":"the ethical use of AI","pos":"phr.","cn":"以合乎伦理的方式使用人工智能。","sec":"text3","sec_label":"Text 3","ctx":"Whenever decisions are based on masses of data, “you quickly get into a lot of ethical questions,” notes Tan Kiat How, chief executive of a Singapore-based agency that is","note":"以合乎伦理的方式使用人工智能。","forms":["the ethical use of AI"]},{"w":"mega-corporation","pos":"n.","cn":"超大型企业。","sec":"text3","sec_label":"Text 3","ctx":"Along with Singapore, other governments and mega-corporations are beginning to establish their own guidelines.","note":"超大型企业。","forms":["mega-corporation"]},{"w":"establish guidelines","pos":"phr.","cn":"制定指导规范。","sec":"text3","sec_label":"Text 3","ctx":"Along with Singapore, other governments and mega-corporations are beginning to establish their own guidelines.","note":"制定指导规范。","forms":["establish guidelines"]},{"w":"deploy AI","pos":"phr.","cn":"部署、投入使用人工智能系统。","sec":"text3","sec_label":"Text 3","ctx":"On June 7 Google pledged not to “design or deploy AI” that would cause “overall harm,” or to develop AI-directed weapons or use AI for surveillance that would violate int","note":"部署、投入使用人工智能系统。","forms":["deploy AI"]},{"w":"AI-directed weapon","pos":"phr.","cn":"由人工智能引导或控制的武器。","sec":"text3","sec_label":"Text 3","ctx":"On June 7 Google pledged not to “design or deploy AI” that would cause “overall harm,” or to develop AI-directed weapons or use AI for surveillance that would violate int","note":"由人工智能引导或控制的武器。","forms":["AI-directed weapon"]},{"w":"surveillance","pos":"n.","cn":"监控、监视。","sec":"text3","sec_label":"Text 3","ctx":"On June 7 Google pledged not to “design or deploy AI” that would cause “overall harm,” or to develop AI-directed weapons or use AI for surveillance that would violate int","note":"监控、监视。","forms":["surveillance"]},{"w":"represent","pos":"词","cn":"此处意为“构成、体现”，即该声明至少可以作为起点。","sec":"text3","sec_label":"Text 3","ctx":"While the statement is vague, it represents one starting point.","note":"此处意为“构成、体现”，即该声明至少可以作为起点。","forms":["represent"]},{"w":"to put it another way","pos":"phr.","cn":"换一种说法。","sec":"text3","sec_label":"Text 3","ctx":"To put it another way: How can we make sure that the thinking of intelligent machines reflects humanity’s highest values?","note":"换一种说法。","forms":["to put it another way"]},{"w":"reflect humanity’s highest values","pos":"phr.","cn":"体现人类最崇高的价值观。","sec":"text3","sec_label":"Text 3","ctx":"To put it another way: How can we make sure that the thinking of intelligent machines reflects humanity’s highest values?","note":"体现人类最崇高的价值观。","forms":["reflect humanity’s highest values"]},{"w":"out-of-control","pos":"词","cn":"失去控制的。","sec":"text3","sec_label":"Text 3","ctx":"Only then will they be useful servants and not Frankenstein’s out-of-control monster.","note":"失去控制的。","forms":["out-of-control"]},{"w":"they","pos":"词","cn":"指智能机器或人工智能系统。","sec":"text3","sec_label":"Text 3","ctx":"Only then will they be useful servants and not Frankenstein’s out-of-control monster.","note":"指智能机器或人工智能系统。","forms":["they"]},{"w":"under","pos":"词","cn":"常见义为“在……下面”；此处作介词，意为“根据、依照”某项裁决。","sec":"text4","sec_label":"Text 4","ctx":"States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wa","note":"常见义为“在……下面”；此处作介词，意为“根据、依照”某项裁决。","forms":["under"]},{"w":"leave","pos":"词","cn":"此处为“使某人处于某种状态”，构成 leave sb. with sth.。","sec":"text4","sec_label":"Text 4","ctx":"States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wa","note":"此处为“使某人处于某种状态”，构成 leave sb. with sth.。","forms":["leave"]},{"w":"sales tax","pos":"phr.","cn":"销售税，由消费者承担、商家代为收取并上缴。","sec":"text4","sec_label":"Text 4","ctx":"States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wa","note":"销售税，由消费者承担、商家代为收取并上缴。","forms":["sales tax"]},{"w":"lighter wallets","pos":"phr.","cn":"钱包更瘪，形象地表示消费者支出增加。","sec":"text4","sec_label":"Text 4","ctx":"States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wa","note":"钱包更瘪，形象地表示消费者支出增加。","forms":["lighter wallets"]},{"w":"a financial win for states","pos":"phr.","cn":"各州在财政上的一项重大收益。","sec":"text4","sec_label":"Text 4","ctx":"States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wa","note":"各州在财政上的一项重大收益。","forms":["a financial win for states"]},{"w":"opinion","pos":"词","cn":"常见义为“意见”；此处是法律用语，指法院的判决意见。","sec":"text4","sec_label":"Text 4","ctx":"The Supreme Court’s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost revenue annually.","note":"常见义为“意见”；此处是法律用语，指法院的判决意见。","forms":["opinion"]},{"w":"overrule","pos":"词","cn":"法院推翻、否定先前裁决。","sec":"text4","sec_label":"Text 4","ctx":"The Supreme Court’s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost revenue annually.","note":"法院推翻、否定先前裁决。","forms":["overrule"]},{"w":"a pair of decades-old decisions","pos":"phr.","cn":"两项已有数十年历史的裁决。","sec":"text4","sec_label":"Text 4","ctx":"The Supreme Court’s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost revenue annually.","note":"两项已有数十年历史的裁决。","forms":["a pair of decades-old decisions"]},{"w":"lost revenue","pos":"phr.","cn":"流失的财政收入。","sec":"text4","sec_label":"Text 4","ctx":"The Supreme Court’s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost revenue annually.","note":"流失的财政收入。","forms":["lost revenue"]},{"w":"collect sales tax on sth.","pos":"phr.","cn":"对某类交易征收、收取销售税。","sec":"text4","sec_label":"Text 4","ctx":"The decisions made it more difficult for states to collect sales tax on certain online purchases.","note":"对某类交易征收、收取销售税。","forms":["collect sales tax on sth."]},{"w":"cases ... said","pos":"phr.","cn":"并非“案件开口说话”，而是指相关判例确立了某项规则。","sec":"text4","sec_label":"Text 4","ctx":"The cases the court overturned said that if a business was shipping a customer’s purchase to a state where the business didn’t have a physical presence such as a warehous","note":"并非“案件开口说话”，而是指相关判例确立了某项规则。","forms":["cases ... said"]},{"w":"physical presence","pos":"phr.","cn":"企业在某州拥有门店、办公室或仓库等实体经营据点。","sec":"text4","sec_label":"Text 4","ctx":"The cases the court overturned said that if a business was shipping a customer’s purchase to a state where the business didn’t have a physical presence such as a warehous","note":"企业在某州拥有门店、办公室或仓库等实体经营据点。","forms":["physical presence"]},{"w":"ship sth. to ...","pos":"phr.","cn":"把商品运送到……","sec":"text4","sec_label":"Text 4","ctx":"The cases the court overturned said that if a business was shipping a customer’s purchase to a state where the business didn’t have a physical presence such as a warehous","note":"把商品运送到……","forms":["ship sth. to ..."]},{"w":"collect sales tax for the state","pos":"phr.","cn":"代该州收取销售税。","sec":"text4","sec_label":"Text 4","ctx":"The cases the court overturned said that if a business was shipping a customer’s purchase to a state where the business didn’t have a physical presence such as a warehous","note":"代该州收取销售税。","forms":["collect sales tax for the state"]},{"w":"be responsible for doing sth.","pos":"phr.","cn":"有责任做某事。","sec":"text4","sec_label":"Text 4","ctx":"Customers were generally responsible for paying the sales tax to the state themselves if they weren’t charged it, but most didn’t realize they owed it and few paid.","note":"有责任做某事。","forms":["be responsible for doing sth."]},{"w":"charge sb. tax","pos":"phr.","cn":"向某人收税。","sec":"text4","sec_label":"Text 4","ctx":"Customers were generally responsible for paying the sales tax to the state themselves if they weren’t charged it, but most didn’t realize they owed it and few paid.","note":"向某人收税。","forms":["charge sb. tax"]},{"w":"owe tax","pos":"phr.","cn":"负有纳税义务、欠缴税款。","sec":"text4","sec_label":"Text 4","ctx":"Customers were generally responsible for paying the sales tax to the state themselves if they weren’t charged it, but most didn’t realize they owed it and few paid.","note":"负有纳税义务、欠缴税款。","forms":["owe tax"]},{"w":"flawed","pos":"v./adj.","cn":"有缺陷的、不合理的，并非指程序上“有瑕疵”这么窄的含义。","sec":"text4","sec_label":"Text 4","ctx":"Justice Anthony Kennedy wrote that the previous decisions were flawed.","note":"有缺陷的、不合理的，并非指程序上“有瑕疵”这么窄的含义。","forms":["flawed"]},{"w":"be removed from ...","pos":"phr.","cn":"与……相去甚远、脱离……","sec":"text4","sec_label":"Text 4","ctx":"“Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,” he wrote in an opinion joine","note":"与……相去甚远、脱离……","forms":["be removed from ..."]},{"w":"economic reality","pos":"phr.","cn":"经济现实。","sec":"text4","sec_label":"Text 4","ctx":"“Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,” he wrote in an opinion joine","note":"经济现实。","forms":["economic reality"]},{"w":"an opinion joined by ...","pos":"phr.","cn":"一份得到……法官附议的判决意见。","sec":"text4","sec_label":"Text 4","ctx":"“Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,” he wrote in an opinion joine","note":"一份得到……法官附议的判决意见。","forms":["an opinion joined by ..."]},{"w":"seek long-term prosperity","pos":"phr.","cn":"谋求长期繁荣。","sec":"text4","sec_label":"Text 4","ctx":"Kennedy wrote that the rule “limited states’ ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.”","note":"谋求长期繁荣。","forms":["seek long-term prosperity"]},{"w":"prevent sb. from doing sth.","pos":"phr.","cn":"阻止某人做某事。","sec":"text4","sec_label":"Text 4","ctx":"Kennedy wrote that the rule “limited states’ ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.”","note":"阻止某人做某事。","forms":["prevent sb. from doing sth."]},{"w":"compete on an even playing field","pos":"phr.","cn":"在公平的竞争环境中竞争。","sec":"text4","sec_label":"Text 4","ctx":"Kennedy wrote that the rule “limited states’ ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.”","note":"在公平的竞争环境中竞争。","forms":["compete on an even playing field"]},{"w":"presence","pos":"n.","cn":"此处仍指企业在某州的实体经营存在，而非抽象的“影响力”。","sec":"text4","sec_label":"Text 4","ctx":"The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already.","note":"此处仍指企业在某州的实体经营存在，而非抽象的“影响力”。","forms":["presence"]},{"w":"chain","pos":"词","cn":"连锁企业，big chains 即大型连锁零售商。","sec":"text4","sec_label":"Text 4","ctx":"The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already.","note":"连锁企业，big chains 即大型连锁零售商。","forms":["chain"]},{"w":"charge sales tax","pos":"phr.","cn":"向顾客收取销售税。","sec":"text4","sec_label":"Text 4","ctx":"Now, rivals will be charging sales tax where they hadn’t before.","note":"向顾客收取销售税。","forms":["charge sales tax"]},{"w":"rivals","pos":"词","cn":"指大型连锁企业的竞争对手，主要是此前无须在外州代征税款的网络卖家。","sec":"text4","sec_label":"Text 4","ctx":"Now, rivals will be charging sales tax where they hadn’t before.","note":"指大型连锁企业的竞争对手，主要是此前无须在外州代征税款的网络卖家。","forms":["rivals"]},{"w":"a network of warehouses","pos":"phr.","cn":"仓库网络。","sec":"text4","sec_label":"Text 4","ctx":"Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don’t have to.","note":"仓库网络。","forms":["a network of warehouses"]},{"w":"third-party sellers","pos":"phr.","cn":"借助平台销售商品、但不属于平台自身的第三方卖家。","sec":"text4","sec_label":"Text 4","ctx":"Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don’t have to.","note":"借助平台销售商品、但不属于平台自身的第三方卖家。","forms":["third-party sellers"]},{"w":"until now","pos":"phr.","cn":"在此之前、截至目前。","sec":"text4","sec_label":"Text 4","ctx":"Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outs","note":"在此之前、截至目前。","forms":["until now"]},{"w":"a physical presence in a single state","pos":"phr.","cn":"在单一州拥有实体经营场所。","sec":"text4","sec_label":"Text 4","ctx":"Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outs","note":"在单一州拥有实体经营场所。","forms":["a physical presence in a single state"]},{"w":"provide platforms for","pos":"phr.","cn":"为……提供交易平台。","sec":"text4","sec_label":"Text 4","ctx":"Sellers that use eBay and Etsy, which provide platforms for smaller sellers, also haven’t been collecting sales tax nationwide.","note":"为……提供交易平台。","forms":["provide platforms for"]},{"w":"collect sales tax nationwide","pos":"phr.","cn":"在全国范围内收取销售税。","sec":"text4","sec_label":"Text 4","ctx":"Sellers that use eBay and Etsy, which provide platforms for smaller sellers, also haven’t been collecting sales tax nationwide.","note":"在全国范围内收取销售税。","forms":["collect sales tax nationwide"]},{"w":"pass laws","pos":"phr.","cn":"通过法律、立法。","sec":"text4","sec_label":"Text 4","ctx":"Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state’s sales tax from customers and send it to the state.","note":"通过法律、立法。","forms":["pass laws"]},{"w":"out-of-state sellers","pos":"phr.","cn":"外州卖家。","sec":"text4","sec_label":"Text 4","ctx":"Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state’s sales tax from customers and send it to the state.","note":"外州卖家。","forms":["out-of-state sellers"]},{"w":"level","pos":"词","cn":"此处为及物动词，意为“使平整、使均等”。","sec":"text4","sec_label":"Text 4","ctx":"Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses.","note":"此处为及物动词，意为“使平整、使均等”。","forms":["level"]},{"w":"level the playing field","pos":"phr.","cn":"营造公平的竞争环境、消除不公平的竞争优势。","sec":"text4","sec_label":"Text 4","ctx":"Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses.","note":"营造公平的竞争环境、消除不公平的竞争优势。","forms":["level the playing field"]},{"w":"retail trade groups","pos":"phr.","cn":"零售行业协会/团体。","sec":"text4","sec_label":"Text 4","ctx":"Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses.","note":"零售行业协会/团体。","forms":["retail trade groups"]},{"w":"local and online businesses","pos":"phr.","cn":"本地实体商户与线上电商。","sec":"text4","sec_label":"Text 4","ctx":"Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses.","note":"本地实体商户与线上电商。","forms":["local and online businesses"]},{"w":"the losers","pos":"phr.","cn":"受害者、利益受损的一方。","sec":"text4","sec_label":"Text 4","ctx":"The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones.","note":"受害者、利益受损的一方。","forms":["the losers"]},{"w":"headache","pos":"词","cn":"常见义为生理上的“头痛”；此处引申指“棘手难题、麻烦事”。","sec":"text4","sec_label":"Text 4","ctx":"Those retailers may face headaches complying with various state sales tax laws.","note":"常见义为生理上的“头痛”；此处引申指“棘手难题、麻烦事”。","forms":["headache"]},{"w":"comply with","pos":"phr.","cn":"遵守、服从（法律、法规）。","sec":"text4","sec_label":"Text 4","ctx":"Those retailers may face headaches complying with various state sales tax laws.","note":"遵守、服从（法律、法规）。","forms":["comply with"]},{"w":"various state sales tax laws","pos":"phr.","cn":"各州各自不同的销售税法律法规。","sec":"text4","sec_label":"Text 4","ctx":"Those retailers may face headaches complying with various state sales tax laws.","note":"各州各自不同的销售税法律法规。","forms":["various state sales tax laws"]},{"w":"advocacy group","pos":"phr.","cn":"权益倡导团体。","sec":"text4","sec_label":"Text 4","ctx":"The Small Business & Entrepreneurship Council advocacy group said in a statement, “Small businesses and internet entrepreneurs are not well served at all by this decision","note":"权益倡导团体。","forms":["advocacy group"]},{"w":"be not well served by","pos":"phr.","cn":"字面为“未被很好地服务”，语境义指“未从中受益、利益受到损害”。","sec":"text4","sec_label":"Text 4","ctx":"The Small Business & Entrepreneurship Council advocacy group said in a statement, “Small businesses and internet entrepreneurs are not well served at all by this decision","note":"字面为“未被很好地服务”，语境义指“未从中受益、利益受到损害”。","forms":["be not well served by"]}],"sentences":[{"id":"2019-T1-P1-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Starting next year, any guaranteed bonus of top executives could be delayed 10 years if their banks are under investigation for wrongdoing.","core":"Any guaranteed bonus ... could be delayed 10 years.","structure":"Starting next year 作时间状语；of top executives 修饰 bonus；if ... 引导条件状语从句；under investigation for ... 表示“因……正在接受调查”。","key":"guaranteed bonus：保底奖金，即事先承诺、不完全取决于后续绩效的奖金。；wrongdoing：违法或不当行为。","zh":"从明年开始，如果银行因不当行为而受到调查，其高层管理人员的任何保底奖金都可能推迟十年发放。","tip":"被推迟的是奖金，而不是对高管的调查；their banks 指这些高管所在的银行。"},{"id":"2019-T1-P1-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"The main purpose of this “clawback” rule is to hold bankers accountable for harmful risk-taking and to restore public trust in financial institutions.","core":"The main purpose ... is to hold ... and to restore ... .","structure":"两个并列不定式作表语，分别说明新规的问责目的和重建信任目的。","key":"clawback：追回已经支付或承诺支付的薪酬、奖金；此处指可延迟乃至追回高管奖金的机制。；hold sb. accountable for：要求某人为……承担责任。","zh":"这项“追回薪酬”规定的主要目的，是让银行家为有害的冒险行为承担责任，并恢复公众对金融机构的信任。","tip":"risk-taking 在此带负面限定词 harmful，不是泛指值得鼓励的进取精神。"},{"id":"2019-T1-P1-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"Yet officials also hope for a much larger benefit: more long-term decisionmaking, not only by banks but by all corporations, to build a stronger economy for future generations.","core":"Officials also hope for a much larger benefit.","structure":"冒号后的 more long-term decisionmaking 解释 benefit；not only by banks but by all corporations 指明决策主体；to build ... 表目的或预期结果。","key":"hope for：期待、希望获得。；not only ... but ...：不仅……而且……。；future generations：后代、未来世代。","zh":"然而，官员们还期待一种大得多的收益：不仅银行，而且所有企业都能作出更多长期决策，从而为后代建设更强健的经济。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T1-P2-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"“Short-termism” or the desire for quick profits, has worsened in publicly traded companies, says the Bank of England’s top economist, Andrew Haldane.","core":"“Short-termism” has worsened in publicly traded companies.","structure":"or the desire for quick profits 是对 Short-termism 的同位解释；says ... 是后置引述语；Andrew Haldane 是 the Bank of England’s top economist 的同位语。","key":"short-termism：短期主义，即过度追求眼前收益而忽视长期价值。；publicly traded company：上市公司、公开交易公司。","zh":"英国央行首席经济学家安德鲁·霍尔丹表示，“短期主义”，也就是追求快速利润的欲望，在上市公司中已经愈演愈烈。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T1-P2-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like “children who pick the plums out of their pudding to eat them at once” rather than putting them aside to be eaten last.","core":"He quotes Alfred Marshall in describing this financial impatience as acting like children.","structure":"Alfred Marshall 是 a giant of classical economics 的同位语；describe A as doing B 表示“把 A 描述成 B”；who ... 修饰 children；rather than putting ... 与 pick ... to eat ... 构成选择对比。","key":"impatience：此处指投资者和企业急于获得眼前回报的短视心态。；a giant of ...：某一领域的巨匠、权威人物。","zh":"在描述这种金融上的急躁时，他引用了古典经济学巨匠阿尔弗雷德·马歇尔的比喻：这种行为就像“孩子们把布丁里的李子挑出来立刻吃掉”，而不是留到最后再吃。","tip":"引用马歇尔是为说明短期主义，而不是介绍快速获利的条件。"},{"id":"2019-T1-P3-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"The average time for holding a stock in both the United States and Britain, he notes, has dropped from seven years to seven months in recent decades.","core":"The average time ... has dropped from seven years to seven months.","structure":"in both ... and ... 限定统计范围；he notes 是插入语；in recent decades 作时间状语。","key":"the average time for holding a stock：持有股票的平均时间。；drop from A to B：从 A 降至 B。","zh":"他指出，近几十年来，美国和英国投资者持有一只股票的平均时间已从七年降至七个月。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T1-P3-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Transient investors, who demand high quarterly profits from companies, can hinder a firm’s efforts to invest in long-term research or to build up customer loyalty.","core":"Transient investors can hinder a firm’s efforts.","structure":"who ... 是非限制性定语从句，说明短期投资者的要求；两个 to 不定式并列，修饰 efforts，说明企业希望进行的长期投入。","key":"transient：短暂停留的、转瞬即逝的；此处指不长期持股的短期投资者。；hinder：阻碍、妨碍，明确表明其影响不利。；quarterly profits：季度利润。；build up customer loyalty：逐步培养客户忠诚度。","zh":"频繁进出的短期投资者要求企业取得高额季度利润，这会阻碍企业投资长期研究或培养客户忠诚度的努力。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T1-P4-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"In addition, new digital technologies have allowed more rapid trading of equities, quicker use of information, and thus shorter attention spans in financial markets.","core":"New digital technologies have allowed A, B, and C.","structure":"三个名词短语并列作 allowed 的宾语；thus 表明更短的市场注意周期是交易和信息处理加速的结果。","key":"equity：常见义为“公平”或“权益”；此处用复数 equities，指股票。；attention span：注意力持续时间；此处比喻市场越来越只关注近期表现。","zh":"此外，新型数字技术使股票交易更加迅速、信息利用更加快捷，也因此缩短了金融市场参与者的注意力持续时间。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T1-P4-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"“There seems to be a predominance of short-term thinking at the expense of long-term investing,” said Commissioner Daniel Gallagher of the US Securities and Exchange Commission in a speech this week.","core":"Commissioner Daniel Gallagher said, “There seems to be ... .”","structure":"直接引语前置；of the US Securities and Exchange Commission 说明委员所属机构；at the expense of ... 表明短期思维的盛行损害了长期投资。","key":"a predominance of：……占主导、占优势。；at the expense of：以牺牲……为代价。","zh":"“短期思维似乎占据了主导地位，而长期投资则为此付出了代价，”美国证券交易委员会委员丹尼尔·加拉格尔本周在一次演讲中说道。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T1-P5-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"In the US, the Sarbanes-Oxley Act of 2002 has pushed most public companies to defer performance bonuses for senior executives by about a year, slightly helping reduce “short-termism.”","core":"The Sarbanes-Oxley Act has pushed most public companies to defer performance bonuses.","structure":"for senior executives 修饰 performance bonuses；by about a year 表示延后的时长；slightly helping ... 是现在分词短语，说明该做法产生的结果。","key":"push sb. to do sth.：促使某人做某事。；defer performance bonuses：推迟发放绩效奖金。","zh":"在美国，2002 年《萨班斯-奥克斯利法案》促使大多数上市公司把高级管理人员的绩效奖金推迟约一年发放，从而对减少“短期主义”略有帮助。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T1-P6-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Much more could be done to encourage “long-termism,” such as changes in the tax code and quicker disclosure of stock acquisitions.","core":"Much more could be done.","structure":"to encourage ... 表目的；such as ... 列举促进长期主义的其他政策路径。","key":"tax code：税法、税收法规体系，不是“税务代码”。；disclosure：公开披露。；stock acquisition：股票收购、取得股票的行为。","zh":"为了鼓励“长期主义”，还可以采取更多措施，例如修改税法，并要求更快披露股票收购信息。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T1-P6-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"In France, shareholders who hold on to a company investment for at least two years can sometimes earn more voting rights in a company.","core":"Shareholders can sometimes earn more voting rights.","structure":"who hold on to ... 是定语从句，修饰 shareholders；for at least two years 表示持股期限。","key":"hold on to：继续持有、不卖出。；earn more voting rights：获得更多投票权；这里的 earn 不是“赚取工资”。","zh":"在法国，持续持有某家公司投资至少两年的股东，有时可以在公司中获得更多投票权。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T1-P7-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Within companies, the right compensation design can provide incentives for executives to think beyond their own time at the company and on behalf of all stakeholders.","core":"The right compensation design can provide incentives for executives.","structure":"to think ... 修饰 incentives；beyond their own time at the company 指考虑超过个人任期的长期影响；on behalf of all stakeholders 与这种长期思考相连。","key":"compensation design：薪酬机制设计。；provide incentives for sb. to do sth.：激励某人做某事。；on behalf of：代表……、为了……的利益。；stakeholder：利益相关者。","zh":"在公司内部，合理的薪酬设计可以激励高管超越自己在公司的任期来思考，并代表所有利益相关者的利益行事。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T1-P7-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Britain’s new rule is a reminder to bankers that society has an interest in their performance, not just for the short term but for the long term.","core":"Britain’s new rule is a reminder to bankers.","structure":"that ... 是 a reminder 的同位语从句；their 指 bankers；not just ... but ... 对比社会关注的短期与长期表现。","key":"have an interest in：关心、与……利益攸关；此处不只是“对……感兴趣”。；hold bankers accountable for：让银行家为……承担责任。；the desire for quick profits：追求快速利润的欲望。；build up customer loyalty：逐步培养客户忠诚度。","zh":"英国的新规提醒银行家，社会关心他们的经营表现，而且关心的不只是短期表现，更是长期表现。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T2-P1-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Grade inflation – the gradual increase in average GPAs (grade-point averages) over the past few decades – is often considered a product of a consumer era in higher education, in which students are treated like customers to be pleased.","core":"Grade inflation is often considered a product of a consumer era.","structure":"两个破折号之间解释 grade inflation；in which ... 是非限制性定语从句，修饰 a consumer era in higher education；to be pleased 是动词不定式的被动式，作名词 customers 的后置定语，表示“需要被取悦的顾客”。","key":"grade inflation：成绩膨胀，指学生成绩在没有相应学业水平提升的情况下普遍走高。；a consumer era：消费主义主导的时代；此处强调高校把学生视为消费者。","zh":"成绩膨胀——即过去几十年中平均 GPA（平均学分绩点）逐渐提高——通常被认为是高等教育进入消费时代的产物；在这个时代，学生被当作需要取悦的顾客。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T2-P1-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"But another, related force – a policy often buried deep in course catalogs called “grade forgiveness” – is helping raise GPAs.","core":"Another, related force is helping raise GPAs.","structure":"破折号之间的名词短语解释 force；often buried deep in course catalogs 是过去分词短语，修饰 a policy；called ... 继续说明政策名称。","key":"force：此处不是物理“力”，而是推动成绩上涨的因素。；be buried deep in：深藏于、不易被发现。；grade forgiveness：成绩宽恕，即重修后以新成绩或最高成绩替代原低分的政策。","zh":"但是，另一股与此相关的力量也在推高 GPA：一项常常深藏于课程目录中的政策，名为“成绩宽恕”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T2-P2-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Grade forgiveness allows students to retake a course in which they received a low grade, and the most recent grade or the highest grade is the only one that counts in calculating a student’s overall GPA.","core":"Grade forgiveness allows students to retake a course, and the ... grade is the only one.","structure":"in which they received a low grade 修饰 a course；that counts ... 修饰 the only one；in calculating ... 说明在哪一计算过程中有效。","key":"count：常见义为“数数”；此处意为“被计算在内、算数”。；overall GPA：总平均绩点。","zh":"成绩宽恕允许学生重修曾经得低分的课程，而且在计算学生总 GPA 时，只有最近一次成绩或最高成绩会被计入。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T2-P3-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"The use of this little-known practice has accelerated in recent years, as colleges continue to do their utmost to keep students in school (and paying tuition) and improve their graduation rates.","core":"The use ... has accelerated.","structure":"as ... 引导原因状语从句；to keep ... and improve ... 是两个并列不定式，说明高校竭力实现的目标；括号中的 and paying tuition 补充学生留校也意味着继续缴费。","key":"do one’s utmost to do sth.：竭尽全力做某事。；keep students in school：让学生继续在校就读。；graduation rate：毕业率。","zh":"近年来，这项鲜为人知的做法加速普及，因为各高校一直竭尽所能让学生留在学校（并继续缴纳学费），同时提高毕业率。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T2-P3-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"When this practice first started decades ago, it was usually limited to freshmen, to give them a second chance to take a class in their first year if they struggled in their transition to college-level courses.","core":"When this practice first started, it was usually limited to freshmen.","structure":"When ... 是时间状语从句；to give ... 表目的；if ... 是条件状语从句；in their transition to college-level courses 说明新生在哪一过程中遇到困难。","key":"freshman：大学一年级学生。；struggle in：在……方面感到吃力。；transition to：向……的过渡、适应……的转变过程。","zh":"几十年前这项做法刚开始时，通常只适用于大一新生，目的是在他们难以适应大学课程的情况下，给他们第二次机会重修第一学年的课程。","tip":"最初目的在于帮助新生适应大学学习，而不是维持全校毕业率；后者是政策后来扩大使用的重要动机。"},{"id":"2019-T2-P4-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"College officials tend to emphasize that the goal of grade forgiveness is less about the grade itself and more about encouraging students to retake courses critical to their degree program and graduation without incurring a big penalty.","core":"College officials tend to emphasize that the goal ... is less about A and more about B.","structure":"that ... 是 emphasize 的宾语从句；critical to their degree program and graduation 后置修饰 courses；without incurring ... 作方式状语。","key":"be less about A and more about B：重点与其说在 A，不如说在 B。；incur a penalty：招致、承受惩罚。","zh":"高校管理者往往强调，成绩宽恕的目的与其说是修改成绩本身，不如说是鼓励学生重修对其学位课程和毕业至关重要的科目，同时避免承受过重的惩罚。","tip":"critical 此处意为“至关重要的”，不是“批判性的”。"},{"id":"2019-T2-P4-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"“Ultimately,” said Jack Miner, Ohio State University’s registrar, “we see students achieve more success because they retake a course and do better in subsequent courses or master the content that allows them to graduate on time.”","core":"We see students achieve more success.","structure":"see + 宾语 + 动词原形 表示看到学生取得成功；because ... 说明原因；retake ... and do ... or master ... 包含并列与选择关系；that allows ... 修饰 the content。","key":"registrar：高校中负责学籍、注册和成绩事务的教务负责人。；subsequent courses：后续课程。","zh":"俄亥俄州立大学教务主任杰克·迈纳说：“归根结底，我们看到学生因为重修一门课而取得更大成功：他们会在后续课程中表现更好，或者掌握使自己能够按时毕业的课程内容。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T2-P5-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"That said, there is a way in which grade forgiveness satisfies colleges’ own needs as well.","core":"There is a way.","structure":"in which ... 是定语从句，修饰 a way，说明成绩宽恕如何也服务于高校自身。","key":"That said：话虽如此、尽管如此，用于从校方宣称的学生利益转向高校自身利益。","zh":"话虽如此，成绩宽恕也确实能以某种方式满足高校自身的需求。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T2-P5-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"For public institutions, state funds are sometimes tied partly to their success on metrics such as graduation rates and student retention – so better grades can, by boosting figures like those, mean more money.","core":"State funds are tied to their success – so better grades can mean more money.","structure":"such as ... 举例说明考核指标；破折号后的 so 引出结果；by boosting figures like those 作方式状语，those 指毕业率和学生留存率等数据。","key":"be tied to：与……挂钩、取决于……。；metric：衡量绩效的指标。；student retention：学生留存率，即学生继续在校而未退学的比例。","zh":"对于公立院校而言，州政府拨款有时会部分取决于其在毕业率、学生留存率等指标上的表现——因此，更高的成绩可以通过改善这些数据，为学校带来更多资金。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T2-P5-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"And anything that raises GPAs will likely make students – who, at the end of the day, are paying the bill – feel they’ve gotten a better value for their tuition dollars, which is another big concern for colleges.","core":"Anything ... will likely make students feel ... .","structure":"that raises GPAs 修饰 anything；破折号之间的 who ... 是定语从句，补充学生是付费者；make + 宾语 + 动词原形 中 feel 作宾补；they’ve gotten ... 是省略 that 的宾语从句；句末 which ... 指前述学生价值感问题。","key":"at the end of the day：归根结底、说到底。；pay the bill：承担费用、买单。；get a better value for ...：觉得为……付出的费用更划算、更物有所值。","zh":"而任何能提高 GPA 的做法，都可能让学生觉得自己缴纳的学费更物有所值——说到底，是学生在买单——这也是高校非常关心的问题。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T2-P6-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Indeed, grade forgiveness is just another way that universities are responding to consumers’ expectations for higher education.","core":"Grade forgiveness is just another way.","structure":"that universities are responding ... 是修饰 way 的定语从句；respond to 意为“回应”；consumers 指作为教育购买者的学生和家长。","key":"见下方词汇笔记","zh":"事实上，成绩宽恕只不过是大学回应消费者对高等教育期待的另一种方式。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T2-P6-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as qualified as possible – or at least appear to be.","core":"Since ..., it is in the best interest of a school to turn out graduates.","structure":"Since ... 引导原因状语从句；it 是形式主语，真正主语为 to turn out ...；who ... 修饰 graduates；or at least appear to be 中 be 后省略 qualified。","key":"in the best interest of：最符合……的利益。；turn out graduates：培养出毕业生。","zh":"由于学生和家长期望大学文凭能带来工作机会，因此学校培养尽可能合格——或至少看起来合格——的毕业生，最符合自身利益。","tip":"appear to be 暗含批评：成绩变好可能只让毕业生显得更合格，不等于实际能力提升。"},{"id":"2019-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Even before the invention of the electric light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come.","core":"The author produced a remarkable work of speculative fiction.","structure":"Even before ... 作时间状语；that would foreshadow ... 是定语从句，修饰 a ... work；to be raised by technologies 是不定式被动结构，修饰 ethical questions；yet to come 修饰 technologies。","key":"speculative fiction：思辨小说，以尚未实现的科技或社会设想探索未来可能性。；foreshadow：预示、预兆。；yet to come：尚未到来、尚未出现。","zh":"甚至在电灯泡发明之前，作者就创作了这部非凡的思辨小说，预示了尚未出现的技术日后将提出的许多伦理问题。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P2-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Today the rapid growth of artificial intelligence (AI) raises fundamental questions: “What is intelligence, identity, or consciousness? What makes humans humans?”","core":"The rapid growth of artificial intelligence raises fundamental questions.","structure":"冒号后的两个直接疑问句具体列出这些根本问题；第二个 humans 作宾语补足语，表示“使人具有人之为人的本质”。","key":"见下方词汇笔记","zh":"如今，人工智能（AI）的迅速发展提出了若干根本问题：“什么是智能、身份或意识？是什么让人之所以为人？”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P3-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"What is being called artificial general intelligence, machines that would imitate the way humans think, continues to evade scientists.","core":"What is being called artificial general intelligence continues to evade scientists.","structure":"What is being called ... 是主语从句；machines that would imitate ... 是同位解释；其中 that ... 修饰 machines，the way humans think 表示人类思考的方式。","key":"artificial general intelligence：通用人工智能，指能够像人一样处理广泛认知任务的智能系统。；evade：常见义为“逃避”；此处指通用人工智能仍未被科学家成功理解和实现。","zh":"所谓的通用人工智能——也就是能够模仿人类思维方式的机器——仍然令科学家难以把握。","tip":"主语中心是整个 What 从句，因此谓语使用单数 continues。"},{"id":"2019-T3-P3-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Yet humans remain fascinated by the idea of robots that would look, move, and respond like humans, similar to those recently depicted on popular sci-fi TV series such as “Westworld” and “Humans.”","core":"Humans remain fascinated by the idea of robots.","structure":"that would look, move, and respond ... 修饰 robots；similar to those ... 是形容词短语，补充比较对象；those 代指电视作品中的机器人；such as ... 列举剧集。","key":"be fascinated by：对……深深着迷。；depict：描绘、刻画。","zh":"然而，人类依然着迷于这样一种机器人设想：它们在外貌、行动和反应上都酷似人类，类似于近期《西部世界》和《真实的人类》等热门科幻电视剧中描绘的机器人。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P4-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Just how people think is still far too complex to be understood, let alone reproduced, says David Eagleman, a Stanford University neuroscientist.","core":"Just how people think is still far too complex to be understood.","structure":"Just how people think 是主语从句；let alone reproduced 是省略结构，完整为 let alone to be reproduced；says David Eagleman 是后置引述语；末尾名词短语是其同位语。","key":"far too ... to do：太过……以至于无法……，far 加强程度。；let alone：更不用说。；neuroscientist：神经科学家。","zh":"斯坦福大学神经科学家戴维·伊格尔曼表示，人类究竟如何思考仍然过于复杂，尚无法被理解，更不用说加以复制了。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P4-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"“We are just in a situation where there are no good theories explaining what consciousness actually is and how you could ever build a machine to get there.”","core":"We are in a situation.","structure":"where ... 是定语从句，修饰 a situation；explaining ... 修饰 theories；what consciousness actually is 与 how you could ... 是两个并列宾语从句。","key":"get there：字面为“到达那里”；此处指机器达到拥有或模拟人类意识的水平。","zh":"“我们目前的处境就是，尚无任何可靠理论能够解释意识究竟是什么，也无法解释究竟怎样才能造出一台达到那种意识状态的机器。”","tip":"no good theories 表明当前知识不足，并不是说现有知识会误导机器人制造。"},{"id":"2019-T3-P5-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"But that doesn’t mean crucial ethical issues involving AI aren’t at hand.","core":"That doesn’t mean (that) ethical issues aren’t at hand.","structure":"That 指人类尚不能理解和复制意识；involving AI 修饰 ethical issues；mean 后省略连接词 that。","key":"at hand：临近的、眼前需要处理的。；doesn’t mean ... aren’t ...：双重否定结构，实际强调伦理问题已经迫在眉睫。","zh":"但这并不意味着，涉及人工智能的关键伦理问题尚未迫近。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P5-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"Their reactions may be a complex combination of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment.","core":"Their reactions may be a complex combination of A, B, and C.","structure":"三个并列成分说明驾驶反应来源；第三项 what their eyes and ears tell them 是宾语从句名词化后作介词 of 的宾语；in that moment 修饰 tell。","key":"input：此处指供决策使用的信息或经验输入，不是单纯的“输入动作”。；instant reflex：即时的本能反射。","zh":"他们的反应可能是多种因素的复杂结合：即时反射、以往驾驶经验提供的信息，以及当时眼睛和耳朵传来的信息。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P5-S06","sec":"text3","sec_label":"Text 3","level":3,"en":"And to anticipate every imaginable driving situation is a difficult programming problem.","core":"To anticipate ... is a difficult programming problem.","structure":"不定式短语作主语；imaginable 后置修饰 driving situation，强调情境范围近乎无限。","key":"anticipate a situation：预见某种情形并提前作准备。；every imaginable ...：所有可能想象到的……。","zh":"而要预见所有可以想象的驾驶情境，也是一个难以解决的编程问题。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P6-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Whenever decisions are based on masses of data, “you quickly get into a lot of ethical questions,” notes Tan Kiat How, chief executive of a Singapore-based agency that is helping the government develop a voluntary code for the ethical use of AI.","core":"Whenever decisions are based on data, “you ... get into ... questions,” notes Tan Kiat How.","structure":"Whenever ... 引导时间兼条件状语从句；直接引语前置；chief executive ... 是人物同位语；that is helping ... 修饰 a Singapore-based agency；develop ... 作 helping 的宾补。","key":"masses of data：海量数据。；voluntary code：自愿遵守的行为准则。；the ethical use of AI：以合乎伦理的方式使用人工智能。","zh":"新加坡一家机构的首席执行官陈杰豪指出，只要决策建立在海量数据之上，“人们很快就会遇到大量伦理问题”；该机构正协助政府制定一套自愿遵守的人工智能伦理使用准则。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P7-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"On June 7 Google pledged not to “design or deploy AI” that would cause “overall harm,” or to develop AI-directed weapons or use AI for surveillance that would violate international norms.","core":"Google pledged not to A, or to B or C.","structure":"that would cause ... 修饰第一处 AI；develop ... 与 use ... 并列；第二个 that would violate ... 修饰 surveillance。","key":"deploy AI：部署、投入使用人工智能系统。；AI-directed weapon：由人工智能引导或控制的武器。；surveillance：监控、监视。","zh":"6 月 7 日，Google 承诺不“设计或部署”会造成“整体伤害”的人工智能，不开发人工智能制导武器，也不把人工智能用于违反国际规范的监控活动。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P7-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"It also pledged not to deploy AI whose use would violate international laws or human rights.","core":"It also pledged not to deploy AI.","structure":"It 指 Google；whose use ... 是定语从句，修饰 AI；international laws or human rights 是 violate 的并列宾语。","key":"见下方词汇笔记","zh":"Google 还承诺不部署其用途会违反国际法律或人权的人工智能。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P8-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"While the statement is vague, it represents one starting point.","core":"While the statement is vague, it represents one starting point.","structure":"见原句","key":"represent：此处意为“构成、体现”，即该声明至少可以作为起点。","zh":"尽管这项声明较为模糊，但它仍代表了一个起点。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P8-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"So does the idea that decisions made by AI systems should be explainable, transparent, and fair.","core":"The idea does so.，其中 does so 指 represents one starting point。","structure":"So 前置引起部分倒装；that ... 是 the idea 的同位语从句；made by AI systems 修饰 decisions；三个形容词并列作表语。","key":"见下方词汇笔记","zh":"同样可以作为起点的，还有这样一种理念：人工智能系统所作的决定应当可解释、透明且公平。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P9-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"To put it another way: How can we make sure that the thinking of intelligent machines reflects humanity’s highest values?","core":"How can we make sure ... ?","structure":"that ... 是 make sure 的宾语从句；从句主语为 the thinking of intelligent machines，谓语 reflects 与中心词 thinking 保持单数一致。","key":"to put it another way：换一种说法。；reflect humanity’s highest values：体现人类最崇高的价值观。","zh":"换一种说法：我们如何才能确保智能机器的思维反映人类最崇高的价值观？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T3-P9-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Only then will they be useful servants and not Frankenstein’s out-of-control monster.","core":"They will be useful servants and not ... monster.","structure":"否定副词短语 Only then 置于句首，引起助动词 will 提前的部分倒装。","key":"out-of-control：失去控制的。；they：指智能机器或人工智能系统。；foreshadow ethical questions：预示伦理问题。；continue to evade scientists：仍令科学家难以理解或实现。","zh":"只有到那时，它们才会成为有用的仆人，而不是弗兰肯斯坦创造出的失控怪物。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T4-P1-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave shoppers with lighter wallets but is a big financial win for states.","core":"States will be able to force more people to pay sales tax.","structure":"when 引导时间状语从句；under ... decision 说明法律依据；that 引导定语从句修饰 decision，从句中 will leave ... but is ... 为并列谓语。","key":"under：常见义为“在……下面”；此处作介词，意为“根据、依照”某项裁决。；leave：此处为“使某人处于某种状态”，构成 leave sb. with sth.。；sales tax：销售税，由消费者承担、商家代为收取并上缴。；lighter wallets：钱包更瘪，形象地表示消费者支出增加。","zh":"根据最高法院周四作出的一项裁决，各州将能要求更多人在网购时缴纳销售税；这项裁决虽会让消费者的钱包缩水，却会给各州带来一笔可观的财政收益。","tip":"that 指代最高法院的裁决，而不是 online purchases；is a big financial win 的主语同样是该裁决。"},{"id":"2019-T4-P2-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The Supreme Court’s opinion Thursday overruled a pair of decades-old decisions that states said cost them billions of dollars in lost revenue annually.","core":"The Supreme Court’s opinion overruled a pair of decisions.","structure":"decades-old 修饰 decisions；that 引导定语从句，完整含义是 states said [the decisions cost them ...]，其中 states said 是插入的报告结构。","key":"opinion：常见义为“意见”；此处是法律用语，指法院的判决意见。；overrule：法院推翻、否定先前裁决。；a pair of decades-old decisions：两项已有数十年历史的裁决。；lost revenue：流失的财政收入。","zh":"最高法院周四发布的判决推翻了两项已有数十年历史的裁决；各州称，这两项旧裁决每年使它们损失数十亿美元的财政收入。","tip":"them 指 states；造成损失的是被推翻的旧裁决，而不是周四的新裁决。"},{"id":"2019-T4-P2-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"The decisions made it more difficult for states to collect sales tax on certain online purchases.","core":"The decisions made it more difficult.","structure":"it 是形式宾语，真正的宾语是 for states to collect ...；旧裁决使各州征税更困难，直接说明各州为何认为它们不利。","key":"collect sales tax on sth.：对某类交易征收、收取销售税。","zh":"这些裁决加大了各州对某些网络购物征收销售税的难度。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T4-P3-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The cases the court overturned said that if a business was shipping a customer’s purchase to a state where the business didn’t have a physical presence such as a warehouse or office, the business didn’t have to collect sales tax for the state.","core":"The cases said that the business didn’t have to collect sales tax.","structure":"the court overturned 是省略关系词的定语从句，修饰 cases；that 引导宾语从句，内部含 if 条件从句；where 引导定语从句修饰 a state。","key":"cases ... said：并非“案件开口说话”，而是指相关判例确立了某项规则。；physical presence：企业在某州拥有门店、办公室或仓库等实体经营据点。；ship sth. to ...：把商品运送到……；collect sales tax for the state：代该州收取销售税。","zh":"法院推翻的那些裁决规定：如果一家企业把顾客购买的商品寄往某州，而该企业在该州没有仓库或办公室等实体经营场所，那么它就不必替该州收取销售税。","tip":"两个 the business 指同一家企业；是否具有 physical presence 是旧规则下是否必须代征税款的关键。"},{"id":"2019-T4-P3-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Customers were generally responsible for paying the sales tax to the state themselves if they weren’t charged it, but most didn’t realize they owed it and few paid.","core":"Customers were responsible ..., but most didn’t realize ... and few paid.","structure":"if they weren’t charged it 是条件状语从句；themselves 强调应由顾客本人缴税；realize 后省略了连接词 that。","key":"be responsible for doing sth.：有责任做某事。；charge sb. tax：向某人收税。；owe tax：负有纳税义务、欠缴税款。","zh":"如果商家没有向顾客收取销售税，通常应由顾客自己向州政府缴纳；但大多数人没有意识到自己负有这项税款，实际缴纳者寥寥无几。","tip":"三处 it 均指 the sales tax；few paid 省略了宾语 it。"},{"id":"2019-T4-P4-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"“Each year the physical presence rule becomes further removed from economic reality and results in significant revenue losses to the States,” he wrote in an opinion joined by four other justices.","core":"The rule becomes ... removed ... and results in ... losses.","structure":"引号内两个谓语 becomes 与 results 由 and 并列；引号后的 joined by four other justices 是过去分词短语，修饰 opinion。","key":"be removed from ...：与……相去甚远、脱离……；economic reality：经济现实。；an opinion joined by ...：一份得到……法官附议的判决意见。","zh":"“实体存在规则逐年脱离经济现实，并给各州造成巨额财政收入损失。”他在一份有另外四名大法官共同署名的判决意见中写道。","tip":"the States 指美国各州；joined 表示另外四名大法官赞同该判决意见，而非后来才加入案件。"},{"id":"2019-T4-P4-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Kennedy wrote that the rule “limited states’ ability to seek long-term prosperity and has prevented market participants from competing on an even playing field.”","core":"Kennedy wrote that the rule limited ... and has prevented ...","structure":"that 引导宾语从句；从句中 limited 与 has prevented 构成并列谓语；from competing ... 是 prevent 的固定结构。","key":"seek long-term prosperity：谋求长期繁荣。；prevent sb. from doing sth.：阻止某人做某事。；compete on an even playing field：在公平的竞争环境中竞争。","zh":"肯尼迪写道，这项规则“限制了各州谋求长期繁荣的能力，并一直妨碍市场参与者在公平的竞争环境中较量”。","tip":"even 在此意为“公平、平等”，不是“甚至”；playing field 是竞争环境的比喻。"},{"id":"2019-T4-P5-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The ruling is a victory for big chains with a presence in many states, since they usually collect sales tax on online purchases already.","core":"The ruling is a victory for big chains.","structure":"with a presence in many states 修饰 big chains；since 引导原因状语从句。","key":"presence：此处仍指企业在某州的实体经营存在，而非抽象的“影响力”。；chain：连锁企业，big chains 即大型连锁零售商。","zh":"这项裁决对在多个州设有实体经营场所的大型连锁企业是一场胜利，因为它们原本通常就已对网购交易收取销售税。","tip":"they 指 big chains，不是 states。"},{"id":"2019-T4-P5-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Big chains have been collecting sales tax nationwide because they typically have physical stores in whatever state a purchase is being shipped to.","core":"Big chains have been collecting sales tax nationwide.","structure":"because 引导原因状语从句；whatever state 相当于 any state that，引导 in 的宾语从句；a purchase is being shipped to 修饰 state。","key":"见下方词汇笔记","zh":"大型连锁企业一直在全国范围内收取销售税，因为无论商品被寄往哪个州，它们通常都在当地设有实体门店。","tip":"purchase 此处指“所购商品”，不是“购买行为”；句末 to 与前面的 whatever state 搭配，表示商品被寄往该州。"},{"id":"2019-T4-P5-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"Amazon.com, with its network of warehouses, also collects sales tax in every state that charges it, though third-party sellers who use the site don’t have to.","core":"Amazon.com also collects sales tax ..., though third-party sellers don’t have to.","structure":"with its network of warehouses 是插入成分，说明亚马逊具有实体存在；that charges it 修饰 state；who use the site 修饰 third-party sellers；though 引导让步从句。","key":"a network of warehouses：仓库网络。；third-party sellers：借助平台销售商品、但不属于平台自身的第三方卖家。","zh":"亚马逊凭借其仓储网络，也在所有征收销售税的州代为收税；不过，使用该网站的第三方卖家此前并无此义务。","tip":"charges it 中的 it 指销售税；don’t have to 后省略 collect sales tax。平台自营业务与平台上的第三方卖家必须区分。"},{"id":"2019-T4-P6-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to addresses outside those states.","core":"Many sellers have been able to avoid charging sales taxes.","structure":"Until now 作时间状语；that have a physical presence ... 是定语从句，修饰 sellers；when ... 引导时间状语从句；those states 指代前文有实体的少数州。","key":"until now：在此之前、截至目前。；a physical presence in a single state：在单一州拥有实体经营场所。","zh":"在此之前，许多仅在一个州或少数几个州拥有实体经营场所的卖家，在将商品运往这些州以外的地址时，一直能够免于收取销售税。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T4-P6-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Sellers that use eBay and Etsy, which provide platforms for smaller sellers, also haven’t been collecting sales tax nationwide.","core":"Sellers also haven’t been collecting sales tax nationwide.","structure":"that use eBay and Etsy 修饰 Sellers；非限制性定语从句 which provide ... 补充说明两家平台以中小卖家为主的属性。","key":"provide platforms for：为……提供交易平台。；collect sales tax nationwide：在全国范围内收取销售税。","zh":"使用 eBay 和 Etsy（这两家网站为较小规模卖家提供平台）的商家，此前也没有在全国范围内收取销售税。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T4-P6-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Under the ruling Thursday, states can pass laws requiring out-of-state sellers to collect the state’s sales tax from customers and send it to the state.","core":"States can pass laws.","structure":"requiring out-of-state sellers to collect ... and send ... 是现在分词短语作后置定语修饰 laws；requiring sb. to do sth. 包含两个并列不定式 to collect ... and (to) send ...。","key":"pass laws：通过法律、立法。；out-of-state sellers：外州卖家。","zh":"根据周四作出的裁决，各州可以立法要求外州卖家向顾客收取该州的销售税并上缴给州政府。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T4-P7-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Retail trade groups praised the ruling, saying it levels the playing field for local and online businesses.","core":"Retail trade groups praised the ruling.","structure":"saying it levels ... 是现在分词短语作伴随状语；it 指代新裁决；省略 that 的宾语从句说明赞赏的理由。","key":"level：此处为及物动词，意为“使平整、使均等”。；level the playing field：营造公平的竞争环境、消除不公平的竞争优势。；retail trade groups：零售行业协会/团体。；local and online businesses：本地实体商户与线上电商。","zh":"零售贸易团体对该裁决表示赞赏，称它为本地实体企业与网络商家营造了公平的竞争环境。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T4-P7-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"The losers, said retail analyst Neil Saunders, are online-only retailers, especially smaller ones.","core":"The losers are online-only retailers.","structure":"said retail analyst Neil Saunders 是插入的报告结构；especially smaller ones 是后置同位语补充，ones 代替 retailers。","key":"the losers：受害者、利益受损的一方。","zh":"零售分析师尼尔·桑德斯表示，其中的输家是纯网络零售商，尤其是规模较小的那些。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T4-P7-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Those retailers may face headaches complying with various state sales tax laws.","core":"Those retailers may face headaches.","structure":"complying with ... 现在分词短语作状语，说明在哪方面面临难题，相当于 in complying with ...。","key":"headache：常见义为生理上的“头痛”；此处引申指“棘手难题、麻烦事”。；comply with：遵守、服从（法律、法规）。；various state sales tax laws：各州各自不同的销售税法律法规。","zh":"这些零售商在遵守各州五花八门的销售税法时，可能会面临令人头疼的问题。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2019-T4-P7-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"The Small Business & Entrepreneurship Council advocacy group said in a statement, “Small businesses and internet entrepreneurs are not well served at all by this decision.”","core":"The advocacy group said in a statement, “... .”","structure":"The Small Business & Entrepreneurship Council 是组织名称，修饰 advocacy group；直接引语表达了小企业利益团体的强烈不满。","key":"advocacy group：权益倡导团体。；be not well served by：字面为“未被很好地服务”，语境义指“未从中受益、利益受到损害”。；under a Supreme Court decision：根据最高法院的一项裁决。；a financial win for：对……而言的一笔财政收益/胜利。","zh":"倡导团体“小型企业与创业委员会”在一份声明中表示：“这项裁决对小型企业和互联网创业者根本没有任何好处。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"}]};</script>

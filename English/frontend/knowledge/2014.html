ay sitting in classrooms or at computers, and few take regular exercise."],["建议一","First, the university could extend the opening hours of the gym and offer free fitness classes in the evening."],["建议二","Second, more sports facilities, such as basketball courts and running tracks, should be made available on campus."],["建议三","Third, physical education courses could be made more varied and interesting so that more students take part."],["期待与结尾","I hope you will consider these suggestions. I am confident that they will help students stay healthy."],["落款","Yours sincerely, Li Ming"]],"expressions":["I am writing to suggest ways to improve...","Many students spend most of their day sitting in classrooms or at computers.","the university could extend the opening hours of the gym","should be made available on campus","physical education courses could be made more varied and interesting","I hope you will consider these suggestions.","I am confident that they will help students..."],"traps":["题目要求写给校长，称呼可用 Dear President，语气礼貌正式；结尾署 Li Ming，不要写自己的真实姓名，也不要写地址。","建议要具体可操作（延长场馆开放时间、增加设施、丰富体育课），只写“希望学校重视体育”会失分。","约100词，书信格式要完整（称呼、正文、结束语、署名），不要写成通知或倡议书。","注意 suggest 的搭配：suggest ways to do sth.、suggest doing sth. 或 suggest that sb. (should) do sth.，不要写 suggest sb. to do sth.。"]},"partB":{"title":"Part B · 图画作文","score":20,"words":"160–200词","prompt":"Write an essay of 160–200 words based on the following drawing. In your essay, you should 1) describe the drawing briefly, 2) interpret its intended meaning, and 3) give your comments. You should write neatly on the ANSWER SHEET. (20 points)","prompt_zh":"根据所给图画写一篇160—200词的短文。要求：1）简要描述图画；2）解释其寓意；3）给出你的评论。","structure":[["第一段·描述图画","The drawing consists of two panels set thirty years apart: a young mother takes her little daughter by the hand; thirty years later, the grown daughter supports her aged mother by the arm. The roles have been reversed."],["第二段·揭示寓意","This silent reversal carries a message about filial piety: parents give us their youth and care, and when they grow old it is our turn to give back. Family care remains irreplaceable in an aging society."],["第三段·给出评论","Moved by the picture, we should not wait until our parents need help. A phone call, a walk or a few hours of company can mean a great deal; repay their love while we can."]],"expressions":["The drawing consists of two panels set thirty years apart.","The roles have been reversed.","This silent reversal carries a clear message about filial piety.","Our parents give us their youth, care and patience; it is our turn to give back.","not merely a legal duty but a moral response to love","We should not wait until our parents need help to think about them.","Let us repay their love while we still can."],"traps":["描述要抓住左右两栏与图注“三十年前……”“现在……”的对照：母亲牵女儿 → 女儿搀母亲，写清“角色互换”，不要只写“母女感情好”。","寓意要落在孝道、赡养父母、代际反哺，不要偏成“时间流逝”“母爱伟大”或单纯讨论社会养老制度。","评论要具体（陪伴、电话、常回家看看），避免只喊“百善孝为先”的空话；160–200词，三段为宜，描述用一般现在时。","不要把左图的母亲误写成祖母、右图的女儿误写成护士；图中没有医院场景，主题是家庭内部的照料。"]}},"vocab":[{"w":"Chancellor of the Exchequer","pos":"phr.","cn":"英国财政大臣。","sec":"text1","sec_label":"Text 1","ctx":"In order to \"change lives for the better\" and reduce \"dependency\", George Osborne, Chancellor of the Exchequer, introduced the \"upfront work search\" scheme.","note":"英国财政大臣。","forms":["Chancellor of the Exchequer"]},{"w":"upfront work search","pos":"phr.","cn":"领取福利前预先开展求职活动。","sec":"text1","sec_label":"Text 1","ctx":"In order to \"change lives for the better\" and reduce \"dependency\", George Osborne, Chancellor of the Exchequer, introduced the \"upfront work search\" scheme.","note":"领取福利前预先开展求职活动。","forms":["upfront work search"]},{"w":"benefit","pos":"词","cn":"常见义为“益处”；此处作名词，指政府发放的“救济金、福利金”。","sec":"text1","sec_label":"Text 1","ctx":"Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit - and then they should","note":"常见义为“益处”；此处作名词，指政府发放的“救济金、福利金”。","forms":["benefit"]},{"w":"be eligible for","pos":"phr.","cn":"有资格获得……。","sec":"text1","sec_label":"Text 1","ctx":"Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit - and then they should","note":"有资格获得……。","forms":["be eligible for"]},{"w":"fortnightly","pos":"adv.","cn":"每两周一次地。","sec":"text1","sec_label":"Text 1","ctx":"Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit - and then they should","note":"每两周一次地。","forms":["fortnightly"]},{"w":"apparent","pos":"词","cn":"此处意为“表面上的、貌似的”，暗示这种合理性未必真实成立。","sec":"text1","sec_label":"Text 1","ctx":"More apparent reasonableness followed.","note":"此处意为“表面上的、貌似的”，暗示这种合理性未必真实成立。","forms":["apparent"]},{"w":"jobseeker's allowance","pos":"phr.","cn":"求职者津贴，英国向符合条件的失业求职者发放的福利。","sec":"text1","sec_label":"Text 1","ctx":"There will now be a seven-day wait for the jobseeker's allowance.","note":"求职者津贴，英国向符合条件的失业求职者发放的福利。","forms":["jobseeker's allowance"]},{"w":"a seven-day wait","pos":"phr.","cn":"七天等待期，指福利生效前的法定无补助期。","sec":"text1","sec_label":"Text 1","ctx":"There will now be a seven-day wait for the jobseeker's allowance.","note":"七天等待期，指福利生效前的法定无补助期。","forms":["a seven-day wait"]},{"w":"sign on","pos":"phr.","cn":"并非普通的“签字”，而是“登记领取失业救济金”。","sec":"text1","sec_label":"Text 1","ctx":"\"Those first few days should be spent looking for work, not looking to sign on,\" he claimed.","note":"并非普通的“签字”，而是“登记领取失业救济金”。","forms":["sign on"]},{"w":"stay off benefits","pos":"phr.","cn":"不领取或不依赖福利救济。","sec":"text1","sec_label":"Text 1","ctx":"\"We're doing these things because we know they help people stay off benefits and help those on benefits get into work faster.\"","note":"不领取或不依赖福利救济。","forms":["stay off benefits"]},{"w":"get into work","pos":"phr.","cn":"找到工作、进入就业状态。","sec":"text1","sec_label":"Text 1","ctx":"\"We're doing these things because we know they help people stay off be ct of doubling your income from the generous state.","note":"此处意为“可能发生的事情、前景”。","forms":["prospect"]},{"w":"minimal","pos":"adj.","cn":"极少的、最低限度的。","sec":"text1","sec_label":"Text 1","ctx":"It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get.","note":"极少的、最低限度的。","forms":["minimal"]},{"w":"hard to get","pos":"phr.","cn":"难以获得；不表示援助数额一定为零。","sec":"text1","sec_label":"Text 1","ctx":"It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get.","note":"难以获得；不表示援助数额一定为零。","forms":["hard to get"]},{"w":"Osborneland","pos":"词","cn":"作者仿造的讽刺性词语，指奥斯本政策想象中的世界。","sec":"text1","sec_label":"Text 1","ctx":"But in Osborneland, your first instinct is to fall into dependency - permanent dependency if you can get it - supported by a state only too ready to indulge your falsehoo","note":"作者仿造的讽刺性词语，指奥斯本政策想象中的世界。","forms":["Osborneland"]},{"w":"only too ready to","pos":"phr.","cn":"非常愿意、简直迫不及待地做……，常带批评意味。","sec":"text1","sec_label":"Text 1","ctx":"But in Osborneland, your first instinct is to fall into dependency - permanent dependency if you can get it - supported by a state only too ready to indulge your falsehoo","note":"非常愿意、简直迫不及待地做……，常带批评意味。","forms":["only too ready to"]},{"w":"falsehood","pos":"词","cn":"虚假陈述、弄虚作假。","sec":"text1","sec_label":"Text 1","ctx":"But in Osborneland, your first instinct is to fall into dependency - permanent dependency if you can get it - supported by a state only too ready to indulge your falsehoo","note":"虚假陈述、弄虚作假。","forms":["falsehood"]},{"w":"as though","pos":"phr.","cn":"仿佛、好像，引出与事实不符的假设。","sec":"text1","sec_label":"Text 1","ctx":"It is as though 20 years of ever-tougher reforms of the job search and benefit administration system never happened.","note":"仿佛、好像，引出与事实不符的假设。","forms":["as though"]},{"w":"ever-tougher","pos":"词","cn":"不断变得更加严苛的。","sec":"text1","sec_label":"Text 1","ctx":"It is as though 20 years of ever-tougher reforms of the job search and benefit administration system never happened.","note":"不断变得更加严苛的。","forms":["ever-tougher"]},{"w":"insure oneself against","pos":"phr.","cn":"为自己投保以防范某种风险；这里指缴纳国民保险费来获得失业保障。","sec":"text1","sec_label":"Text 1","ctx":"The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens.","note":"为自己投保以防范某种风险；这里指缴纳国民保险费来获得失业保障。","forms":["insure oneself against"]},{"w":"allowance","pos":"n.","cn":"此处指政府按条件发放的津贴，语义上弱于基于缴费形成的法定权利。","sec":"text1","sec_label":"Text 1","ctx":"Even the very phrase \"jobseeker's allowance\" is about redefining the unemployed as a \"jobseeker\" who had no fundamental right to a benefit he or she has earned through ma","note":"此处指政府按条件发放的津贴，语义上弱于基于缴费形成的法定权利。","forms":["allowance"]},{"w":"earn","pos":"词","cn":"常见义为“挣得工资”；此处指通过缴纳保险费“取得、赢得”福利资格。","sec":"text1","sec_label":"Text 1","ctx":"Even the very phrase \"jobseeker's allowance\" is about redefining the unemployed as a \"jobseeker\" who had no fundamental right to a benefit he or she has earned through ma","note":"常见义为“挣得工资”；此处指通过缴纳保险费“取得、赢得”福利资格。","forms":["earn"]},{"w":"entitlement","pos":"n.","cn":"依法或按制度应享有的权利，而非普通的“资格感”。","sec":"text1","sec_label":"Text 1","ctx":"Instead, the claimant receives a time-limited \"allowance,\" conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least gene","note":"依法或按制度应享有的权利，而非普通的“资格感”。","forms":["entitlement"]},{"w":"generous","pos":"adj.","cn":"此处形容福利数额“优厚的”，不是指人的慷慨品格。","sec":"text1","sec_label":"Text 1","ctx":"Instead, the claimant receives a time-limited \"allowance,\" conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least gene","note":"此处形容福利数额“优厚的”，不是指人的慷慨品格。","forms":["generous"]},{"w":"generate hostility","pos":"phr.","cn":"招致敌意。","sec":"text2","sec_label":"Text 2","ctx":"All around the world, lawyers generate more hostility than the members of any other profession - with the possible exception of journalism.","note":"招致敌意。","forms":["generate hostility"]},{"w":"with the possible exception of","pos":"phr.","cn":"……可能例外。","sec":"text2","sec_label":"Text 2","ctx":"All around the world, lawyers generate more hostility than the members of any other profession - with the possible exception of journalism.","note":"……可能例外。","forms":["with the possible exception of"]},{"w":"grounds","pos":"词","cn":"常见义为“地面、场地”；此处作复数名词，意为“理由、根据”。","sec":"text2","sec_label":"Text 2","ctx":"But there are few places where clients have more grounds for complaint than America.","note":"常见义为“地面、场地”；此处作复数名词，意为“理由、根据”。","forms":["grounds"]},{"w":"twice as fast as","pos":"phr.","cn":"速度是……的两倍。","sec":"text2","sec_label":"Text 2","ctx":"During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation.","note":"速度是……的两倍。","forms":["twice as fast as"]},{"w":"spending on legal services","pos":"phr.","cn":"法律服务支出。","sec":"text2","sec_label":"Text 2","ctx":"During the decade before the economic crisis, spending on legal services in America grew twice as fast as inflation.","note":"法律服务支出。","forms":["spending on legal services"]},{"w":"skyscrapers-full of money","pos":"phr.","cn":"夸张说法，形容赚取的钱多得惊人。","sec":"text2","sec_label":"Text 2","ctx":"The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools.","note":"夸张说法，形容赚取的钱多得惊人。","forms":["skyscrapers-full of money"]},{"w":"pile into","pos":"phr.","cn":"大量涌入、蜂拥进入。","sec":"text2","sec_label":"Text 2","ctx":"The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools.","note":"大量涌入、蜂拥进入。","forms":["pile into"]},{"w":"big-firm job","pos":"phr.","cn":"大型律师事务所的职位。","sec":"text2","sec_label":"Text 2","ctx":"But most law graduates never get a big-firm job.","note":"大型律师事务所的职位。","forms":["big-firm job"]},{"w":"nuisance lawsuit","pos": sec":"text2","sec_label":"Text 2","ctx":"Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them.","note":"常见义为“身体”；此处指有管理职能的“机构、组织”。","forms":["body"]},{"w":"conservative","pos":"adj.","cn":"此处不是特指政治立场，而是“守旧的、不愿改变的”。","sec":"text2","sec_label":"Text 2","ctx":"Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them.","note":"此处不是特指政治立场，而是“守旧的、不愿改变的”。","forms":["conservative"]},{"w":"study law as an undergraduate degree","pos":"phr.","cn":"把法律作为本科专业学习。","sec":"text2","sec_label":"Text 2","ctx":"One idea is to allow people to study law as an undergraduate degree.","note":"把法律作为本科专业学习。","forms":["study law as an undergraduate degree"]},{"w":"sit for an exam","pos":"phr.","cn":"参加考试。","sec":"text2","sec_label":"Text 2","ctx":"Another is to let students sit for the bar after only two years of law school.","note":"参加考试。","forms":["sit for an exam"]},{"w":"stern","pos":"词","cn":"严格的、严厉的。","sec":"text2","sec_label":"Text 2","ctx":"If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so.","note":"严格的、严厉的。","forms":["stern"]},{"w":"would-be lawyer","pos":"phr.","cn":"有志成为律师的人、准律师。","sec":"text2","sec_label":"Text 2","ctx":"If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so.","note":"有志成为律师的人、准律师。","forms":["would-be lawyer"]},{"w":"debt mountain","pos":"phr.","cn":"比喻巨额、不断累积的债务。","sec":"text2","sec_label":"Text 2","ctx":"Students who do not need the extra training could cut their debt mountain by a third.","note":"比喻巨额、不断累积的债务。","forms":["debt mountain"]},{"w":"cut... by a third","pos":"phr.","cn":"将……减少三分之一，而不是减少到三分之一。","sec":"text2","sec_label":"Text 2","ctx":"Students who do not need the extra training could cut their debt mountain by a third.","note":"将……减少三分之一，而不是减少到三分之一。","forms":["cut... by a third"]},{"w":"guild-like","pos":"词","cn":"类似行会的，暗含封闭和排外之意。","sec":"text2","sec_label":"Text 2","ctx":"The other reason why costs are so high is the restrictive guild-like ownership structure of the business.","note":"类似行会的，暗含封闭和排外之意。","forms":["guild-like"]},{"w":"ownership structure","pos":"phr.","cn":"所有权结构。","sec":"text2","sec_label":"Text 2","ctx":"The other reason why costs are so high is the restrictive guild-like ownership structure of the business.","note":"所有权结构。","forms":["ownership structure"]},{"w":"own a share of","pos":"phr.","cn":"持有……的股份。","sec":"text2","sec_label":"Text 2","ctx":"Except in the District of Columbia, non-lawyers may not own any share of a law firm.","note":"持有……的股份。","forms":["own a share of"]},{"w":"the District of Columbia","pos":"phr.","cn":"哥伦比亚特区，即美国首都华盛顿所在的联邦特区。","sec":"text2","sec_label":"Text 2","ctx":"Except in the District of Columbia, non-lawyers may not own any share of a law firm.","note":"哥伦比亚特区，即美国首都华盛顿所在的联邦特区。","forms":["the District of Columbia"]},{"w":"isolate A from B","pos":"phr.","cn":"使 A 与 B 隔绝、使 A 免受 B 影响。","sec":"text2","sec_label":"Text 2","ctx":"There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers fro","note":"使 A 与 B 隔绝、使 A 免受 B 影响。","forms":["isolate A from B"]},{"w":"outsider","pos":"词","cn":"此处指律师行业之外的投资者或管理者。","sec":"text2","sec_label":"Text 2","ctx":"There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers fro","note":"此处指律师行业之外的投资者或管理者。","forms":["outsider"]},{"w":"focus on doing sth.","pos":"phr.","cn":"专注于做某事。","sec":"text2","sec_label":"Text 2","ctx":"In fact, allowing non-lawyers to own shares in law firms would reduce costs and improve services to customers, by encouraging law firms to use technology and to employ pr","note":"专注于做某事。","forms":["focus on doing sth."]},{"w":"improve firms' efficiency","pos":"phr.","cn":"提高律所运营效率。","sec":"text2","sec_label":"Text 2","ctx":"In fact, allowing non-lawyers to own shares in law firms would reduce costs and improve services to customers, by encouraging law firms to use technology and to employ pr","note":"提高律所运营效率。","forms":["improve firms' efficiency"]},{"w":"liberalize","pos":"v.","cn":"放宽限制、推进市场开放，并非政治意义上的“自由主义化”。","sec":"text2","sec_label":"Text 2","ctx":"After all, other countries, such as Australia and Britain, have started liberalizing their legal professions.","note":"放宽限制、推进市场开放，并非政治意义上的“自由主义化”。","forms":["liberalize"]},{"w":"Fundamental Physics Prize","pos":"phr.","cn":"基础物理学突破奖。","sec":"text3","sec_label":"Text 3","ctx":"The US$3-million Fundamental Physics Prize is indeed an interesting experiment, as Alexander Polyakov said when he accepted this year's award in March.","note":"基础物理学突破奖。","forms":["Fundamental Physics Prize"]},{"w":"as... said","pos":"phr.","cn":"正如……所说，as 引导方式状语从句。","sec":"text3","sec_label":"Text 3","ctx":"The US$3-million Fundamental Physics Prize is indeed an interesting experiment, as Alexander Polyakov said when he accepted this year's award in March.","note":"正如……所说，as 引导方式状语从句。","forms":["as... said"]},{"w":"far from","pos":"phr.","cn":"远非、绝不是。","sec":"text3","sec_label":"Text 3","ctx":"And it is far from the only one of its type.","note":"远非、绝不是。","forms":["far from"]},{"w":"lucrative","pos":"adj.","cn":"有利可图的；此处形容奖项“奖金丰厚的”。","sec":"text3","sec_label":"Text 3","ctx":"As a News Feature article in *Nature* discusses, a string of lucrative awards for researchers have joined the Nobel Prizes in recent years.","note":"有利可图的；此处形容奖项“奖金丰厚的”。","forms":["lucrative"]},{"w":"a string of","pos":"phr.","cn":"一连串、一系列。","sec":"text3","sec_label":"Text 3","ctx":"As a News Feature article in *Nature* discusses, a string of lucrative awards for researchers have joined the Nobel Prizes in recent years.","note":"一连串、一系列。","forms":["a string of"]},{"w":"telephone-number-sized","pos":"v./adj.","cn":"夸张地形容数字位数极多，即账户资金极其庞大。","sec":"text3","sec_label":"Text 3","ctx":"Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.","note":"夸张地形容数字位数极多，即账户资金极其庞大。","forms":["telephone-number-sized"]},{"w":"fund","pos":"词","cn":"作动词，意为“为……提供资金”。","sec":"text3","sec_label":"Text 3","ctx":"Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.","note":"作动词，意为“为……提供资金”。","forms":["fund"]},{"w":"benefactor","pos":"词","cn":"捐助者、赞助人。","sec":"text3","sec_label":"Text 3","ctx":"These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.","note":"捐助者、赞助人。","forms":["benefactor"]},{"w":"chosen field","pos":"phr.","cn":"所选择并从事的领域。","sec":"text3","sec_label":"Text 3","ctx":"These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.","note":"所选择并从事的领域。","forms":["chosen field"]},{"w":"a handful of","pos":"phr.","cn":"少数、少量。","sec":"text3","sec_label":"Text 3","ctx":"Quite a lot, according to a handful of scientists quoted in the News Feature.","note":"少数、少量。","forms":["a handful of"]},{"w":"quite a lot","pos":"phr.","cn":"相当多；是对上一句反问的直接回答。","sec":"text3","sec_label":"Text 3","ctx":"Quite a lot, according to a handful of scientists quoted in the News Feature.","note":"相当多；是对上一句反问的直接回答。","forms":["quite a lot"]},{"w":"class","pos":"词","cn":"常见义为“班级、阶层”；此处指格调、品位和公认的高贵地位。","sec":"text3","sec_label":"Text 3","ctx":"You cannot buy class, as the old saying goes, and these upstart entrepreneurs cannot buy their prizes the prestige of the Nobels.","note":"常见义为“班级、阶层”；此处指格调、品位和公认的高贵地位。","forms":["class"]},{"w":"upstart","pos":"词","cn":"暴发户式的新贵，带贬义。","sec":"text3","sec_label":"Text 3","ctx":"You cannot buy class, as the old saying goes, and these upstart entrepreneurs cannot buy their prizes the prestige of the Nobels.","note":"暴发户式的新贵，带贬义。","forms":["upstart"]},{"w":"an exercise in","pos":"phr.","cn":"一次……的实践或表现；此处带贬义，指变相的自我宣传。","sec":"text3","sec_label":"Text 3","ctx":"The new awards are an exercise in self-promotion for those behind them, say scientists.","note":"一次……的实践或表现；此处带贬义，指变相的自我宣传。","forms":["an exercise in"]},{"w":"those behind them","pos":"phr.","cn":"奖项背后的创办者和出资者。","sec":"text3","sec_label":"Text 3","ctx":"The new awards are an exercise in self-promotion for those behind them, say scientists.","note":"奖项背后的创办者和出资者。","forms":["those behind them"]},{"w":"achievement-based","pos":"v./adj.","cn":"以成就为依据的。","sec":"text3","sec_label":"Text 3","ctx":"They could distort the achievement-based system of peer-review-led research.","note":"以成就为依据的。","forms":["achievement-based"]},{"w":"peer-review-led","pos":"v./adj.","cn":"由同行评审主导的。","sec":"text3","sec_label":"Text 3","ctx":"They could distort the achievement-based system of peer-review-led research.","note":"由同行评审主导的。","forms":["peer-review-led"]},{"w":"cement","pos":"n.","cn":"常见义为“水泥”；此处作动词，意为“巩固、使固定下来”。","sec":"text3","sec_label":"Text 3","ctx":"They could cement the status quo of peer-reviewed research.","note":"常见义为“水泥”；此处作动词，意为“巩固、使固定下来”。","forms":["cement"]},{"w":"status quo","pos":"phr.","cn":"现状、既有格局。","sec":"text3","sec_label":"Text 3","ctx":"They could cement the status quo of peer-reviewed research.","note":"现状、既有格局。","forms":["status quo"]},{"w":"perpetuate","pos":"v.","cn":"使长期存在、使延续。","sec":"text3","sec_label":"Text 3","ctx":"They perpetuate the myth of the lone genius.","note":"使长期存在、使延续。","forms":["perpetuate"]},{"w":"lone genius","pos":"phr.","cn":"孤立完成重大突破的天才形象，与现代科研的协作性相对。","sec":"text3","sec_label":"Text 3","ctx":"They perpetuate the myth of the lone genius.","note":"孤立完成重大突破的天才形象，与现代科研的协作性相对。","forms":["lone genius"]},{"w":"scattered","pos":"v./adj.","cn":"常见义为“分散的”；此处指目标不一、缺乏统一方向。","sec":"text3","sec_label":"Text 3","ctx":"The goals of the prize-givers seem as scattered as the criticism.","note":"常见义为“分散的”；此处指目标不一、缺乏统一方向。","forms":["scattered"]},{"w":"shock","pos":"词","cn":"此处作不及物用法的省略表达，意为制造震动、引起轰动。","sec":"text3","sec_label":"Text 3","ctx":"Some want to shock, others to draw people into science, or to better reward those who have made their careers in research.","note":"此处作不及物用法的省略表达，意为制造震动、引起轰动。","forms":["shock"]},{"w":"make one's career in","pos":"phr.","cn":"以……为职业，在……领域发展职业生涯。","sec":"text3","sec_label":"Text 3","ctx":"Some want to shock, others to draw people into science, or to better reward those who have made their careers in research.","note":"以……为职业，在……领域发展职业生涯。","forms":["make one's career in"]},{"w":"legitimate concern","pos":"phr.","cn":"合理、正当的担忧。","sec":"text3","sec_label":"Text 3","ctx":"As *Nature* has pointed out before, there are some legitimate concerns about how science prizes - both new and old - are distributed.","note":"合理、正当的担忧。","forms":["legitimate concern"]},{"w":"how... are distributed","pos":"phr.","cn":"……如何分配、颁发。","sec":"text3","sec_label":"Text 3","ctx":"As *Nature* has pointed out before, there are some legitimate concerns about how science prizes - both new and old - are distributed.","note":"……如何分配、颁发。","forms":["how... are distributed"]},{"w":"take a... view of","pos":"phr.","cn":"以某种方式看待或界定……。","sec":"text3","sec_label":"Text 3","ctx":"The Breakthrough Prize in Life Sciences, launched this year, takes an unrepresentative view of what the life sciences include.","note":"以某种方式看待或界定……。","forms":["take a... view of"]},{"w":"unrepresentative","pos":"adj.","cn":"不具代表性的，不能反映领域全貌的。","sec":"text3","sec_label":"Text 3","ctx":"The Breakthrough Prize in Life Sciences, launched this year, takes an unrepresentative view of what the life sciences include.","note":"不具代表性的，不能反映领域全貌的。","forms":["unrepresentative"]},{"w":"outgrow","pos":"词","cn":"本义为“长大后不再适合”；此处指现代科研的发展已经“超越、使……过时”。","sec":"text3","sec_label":"Text 3","ctx":"But the Nobel Foundation's limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research -","note":"本义为“长大后不再适合”；此处指现代科研的发展已经“超越、使……过时”。","forms":["outgrow"]},{"w":"row","pos":"词","cn":"常见义为“一排”；此处读 /raʊ/，意为激烈争论。","sec":"text3","sec_label":"Text 3","ctx":"But the Nobel Foundation's limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research -","note":"常见义为“一排”；此处读 /raʊ/，意为激烈争论。","forms":["row"]},{"w":"when it comes to","pos":"phr.","cn":"当涉及……时。","sec":"text3","sec_label":"Text 3","ctx":"But the Nobel Foundation's limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research -","note":"当涉及……时。","forms":["when it comes to"]},{"w":"legitimacy","pos":"词","cn":"正当性、公信力和被广泛承认的地位。","sec":"text3","sec_label":"Text 3","ctx":"Time, rather than intention, has given them legitimacy.","note":"正当性、公信力和被广泛承认的地位。","forms":["legitimacy"]},{"w":"as much as","pos":"phr.","cn":"此处引导让步，意为“尽管、虽然”。","sec":"text3","sec_label":"Text 3","ctx":"As much as some scientists may complain about the new awards, two things seem clear.","note":"此处引导让步，意为“尽管、虽然”。","forms":["as much as"]},{"w":"fair","pos":"词","cn":"此处意为“合理的、正当的”，不是“公平的”。","sec":"text3","sec_label":"Text 3","ctx":"It is fair to criticize and question the mechanism - that is the culture of research, after all - but it is the prize-givers' money to do with as they please.","note":"此处意为“合理的、正当的”，不是“公平的”。","forms":["fair"]},{"w":"do with","pos":"phr.","cn":"处置、处理。","sec":"text3","sec_label":"Text 3","ctx":"It is fair to criticize and question the mechanism - that is the culture of research, after all - but it is the prize-givers' money to do with as they please.","note":"处置、处理。","forms":["do with"]},{"w":"with gratitude and grace","pos":"phr.","cn":"怀着感激并保持得体风度。","sec":"text3","sec_label":"Text 3","ctx":"It is wise to take such gifts with gratitude and grace.","note":"怀着感激并保持得体风度。","forms":["with gratitude and grace"]},{"w":"affirm the importance of","pos":"phr.","cn":"肯定……的重要性。","sec":"text4","sec_label":"Text 4","ctx":"\"The Heart of the Matter,\" the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities an","note":"肯定……的重要性。","forms":["affirm the importance of"]},{"w":"liberal democracy","pos":"phr.","cn":"自由民主制度。","sec":"text4","sec_label":"Text 4","ctx":"\"The Heart of the Matter,\" the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities an","note":"自由民主制度。","forms":["liberal democracy"]},{"w":"address","pos":"词","cn":"常见义为“地址、致辞”；此处作动词，意为“正视并处理”。","sec":"text4","sec_label":"Text 4","ctx":"Regrettably, however, the report's failure to address the true nature of the crisis facing liberal education may cause more harm than good.","note":"常见义为“地址、致辞”；此处作动词，意为“正视并处理”。","forms":["address"]},{"w":"more harm than good","pos":"phr.","cn":"弊大于利。","sec":"text4","sec_label":"Text 4","ctx":"Regrettably, however, the report's failure to address the true nature of the crisis facing liberal education may cause more harm than good.","note":"弊大于利。","forms":["more harm than good"]},{"w":"leading","pos":"v./n.","cn":"此处意为“主要的、有影响力的”，不是“带领中的”。","sec":"text4","sec_label":"Text 4","ctx":"In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by \"federal, state and local governm","note":"此处意为“主要的、有影响力的”，不是“带领中的”。","forms":["leading"]},{"w":"maintain national excellence","pos":"phr.","cn":"保持国家的卓越水平和领先优势。","sec":"text4","sec_label":"Text 4","ctx":"In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by \"federal, state and local governm","note":"保持国家的卓越水平和领先优势。","forms":["maintain national excellence"]},{"w":"top-tier","pos":"词","cn":"顶尖的、最高层级的。","sec":"text4","sec_label":"Text 4","ctx":"Among the commission's 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, fil","note":"顶尖的、最高层级的。","forms":["top-tier"]},{"w":"prominent figure","pos":"phr.","cn":"知名人士、重要人物。","sec":"text4","sec_label":"Text 4","ctx":"Among the commission's 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, fil","note":"知名人士、重要人物。","forms":["prominent figure"]},{"w":"admirable","pos":"adj.","cn":"令人钦佩的、值得赞许的。","sec":"text4","sec_label":"Text 4","ctx":"The goals identified in the report are generally admirable.","note":"令人钦佩的、值得赞许的。","forms":["admirable"]},{"w":"presuppose","pos":"词","cn":"以……为先决条件、预先假定。","sec":"text4","sec_label":"Text 4","ctx":"Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly America","note":"以……为先决条件、预先假定。","forms":["presuppose"]},{"w":"citizenry","pos":"词","cn":"全体公民。","sec":"text4","sec_label":"Text 4","ctx":"Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly America","note":"全体公民。","forms":["citizenry"]},{"w":"literacy","pos":"词","cn":"读写能力；结合语境也包含有效理解公共事务所需的基本素养。","sec":"text4","sec_label":"Text 4","ctx":"Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly America","note":"读写能力；结合语境也包含有效理解公共事务所需的基本素养。","forms":["literacy"]},{"w":"crafting","pos":"v./n.","cn":"此处指精心设计、制定。","sec":"text4","sec_label":"Text 4","ctx":"To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students' ability to solve","note":"此处指精心设计、制定。","forms":["crafting"]},{"w":"bring... to bear on","pos":"phr.","cn":"运用……处理或影响……。","sec":"text4","sec_label":"Text 4","ctx":"To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students' ability to solve","note":"运用……处理或影响……。","forms":["bring... to bear on"]},{"w":"advocate","pos":"v.","cn":"提倡、主张。","sec":"text4","sec_label":"Text 4","ctx":"The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.","note":"提倡、主张。","forms":["advocate"]},{"w":"study abroad program","pos":"phr.","cn":"海外学习项目、留学交流项目。","sec":"text4","sec_label":"Text 4","ctx":"The report also advocates greater study of foreign languages, international affairs and the expansion of study abroad programs.","note":"海外学习项目、留学交流项目。","forms":["study abroad program"]},{"w":"in the making","pos":"phr.","cn":"在制作、酝酿或形成过程中。","sec":"text4","sec_label":"Text 4","ctx":"Unfortunately, despite 2½ years in the making, \"The Heart of the Matter\" never gets to the heart of the matter: the illiberal nature of liberal education at our leading c","note":"在制作、酝酿或形成过程中。","forms":["in the making"]},{"w":"illiberal","pos":"adj.","cn":"不自由的、压制多元观点的；与 liberal education 中强调开阔心智的 liberal 构成反差。","sec":"text4","sec_label":"Text 4","ctx":"Unfortunately, despite 2½ years in the making, \"The Heart of the Matter\" never gets to the heart of the matter: the illiberal nature of liberal education at our leading c","note":"不自由的、压制多元观点的；与 liberal education 中强调开阔心智的 liberal 构成反差。","forms":["illiberal"]},{"w":"character","pos":"词","cn":"常见义为“性格、人物”；此处指自由教育的本质特征。","sec":"text4","sec_label":"Text 4","ctx":"The commission ignores that for several decades America's colleges and universities have produced graduates who don't know the content and character of liberal education ","note":"常见义为“性格、人物”；此处指自由教育的本质特征。","forms":["character"]},{"w":"be deprived of","pos":"phr.","cn":"被剥夺、无法获得……。","sec":"text4","sec_label":"Text 4","ctx":"The commission ignores that for several decades America's colleges and universities have produced graduates who don't know the content and character of liberal education ","note":"被剥夺、无法获得……。","forms":["be deprived of"]},{"w":"at home","pos":"phr.","cn":"此处意为“自在存在、自然属于某处”，不是“在家”。","sec":"text4","sec_label":"Text 4","ctx":"Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for publicizing \"progressive,\" or left-","note":"此处意为“自在存在、自然属于某处”，不是“在家”。","forms":["at home"]},{"w":"vehicle","pos":"词","cn":"常见义为“车辆”；此处比喻传播思想的“载体、工具”。","sec":"text4","sec_label":"Text 4","ctx":"Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for publicizing \"progressive,\" or left-","note":"常见义为“车辆”；此处比喻传播思想的“载体、工具”。","forms":["vehicle"]},{"w":"portray A as B","pos":"phr.","cn":"把 A 描绘成 B。","sec":"text4","sec_label":"Text 4","ctx":"Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or ","note":"把 A 描绘成 B。","forms":["portray A as B"]},{"w":"self-reliance","pos":"n.","cn":"自力更生、自我依靠。","sec":"text4","sec_label":"Text 4","ctx":"Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or ","note":"自力更生、自我依靠。","forms":["self-reliance"]},{"w":"legitimate","pos":"v.","cn":"此处意为可被学术规范承认的、正当的。","sec":"text4","sec_label":"Text 4","ctx":"Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or ","note":"此处意为可被学术规范承认的、正当的。","forms":["legitimate"]},{"w":"set back","pos":"phr.","cn":"阻碍、延误，使进展倒退。","sec":"text4","sec_label":"Text 4","ctx":"Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.","note":"阻碍、延误，使进展倒退。","forms":["set back"]},{"w":"illuminate","pos":"v.","cn":"本义为“照亮”；此处指阐明、解释清楚。","sec":"text4","sec_label":"Text 4","ctx":"Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.","note":"本义为“照亮”；此处指阐明、解释清楚。","forms":["illuminate"]}],"sentences":[{"id":"2014-T1-P1-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"In order to \"change lives for the better\" and reduce \"dependency\", George Osborne, Chancellor of the Exchequer, introduced the \"upfront work search\" scheme.","core":"George Osborne introduced the scheme。","structure":"句首 In order to... 表目的；Chancellor of the Exchequer 是 George Osborne 的同位语。","key":"Chancellor of the Exchequer：英国财政大臣。；upfront work search：领取福利前预先开展求职活动。","zh":"为了“让生活变得更好”并减少人们对福利的“依赖”，英国财政大臣乔治·奥斯本推出了“预先求职”计划。","tip":"引号提示这些说法来自政策制定者，作者随后会检验其是否名副其实。"},{"id":"2014-T1-P1-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Only if the jobless arrive at the jobcentre with a CV, register for online job search, and start looking for work will they be eligible for benefit - and then they should report weekly rather than fortnightly.","core":"They will be eligible for benefit only if...。","structure":"Only if 引导的条件状语置于句首，主句采用部分倒装 will they be；条件从句中三个动作并列。","key":"benefit：常见义为“益处”；此处作名词，指政府发放的“救济金、福利金”。；be eligible for：有资格获得……。；fortnightly：每两周一次地。","zh":"失业者只有带着简历到就业服务中心、注册在线求职并开始找工作，才有资格领取救济金；而且此后他们必须每周报到，而不是每两周一次。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T1-P1-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"What could be more reasonable?","core":"What could be more reasonable?","structure":"见原句","key":"见下方词汇笔记","zh":"还有什么能比这更合理呢？","tip":"这是反问。结合下文可知，作者并非单纯认可，而是在铺垫对这种“表面合理性”的质疑。"},{"id":"2014-T1-P2-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"\"Those first few days should be spent looking for work, not looking to sign on,\" he claimed.","core":"Those days should be spent looking for work, not looking to sign on。","structure":"spend time doing sth. 在被动语态中变为 time be spent doing sth.；not 构成两种行为的对照。","key":"sign on：并非普通的“签字”，而是“登记领取失业救济金”。","zh":"他声称：“最初的这几天应该用来找工作，而不是琢磨着登记领取救济金。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T1-P2-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"\"We're doing these things because we know they help people stay off benefits and help those on benefits get into work faster.\"","core":"We are doing these things because we know...。","structure":"because 引导原因状语从句；know 后省略了连接词 that；两个 help 结构并列。","key":"stay off benefits：不领取或不依赖福利救济。；get into work：找到工作、进入就业状态。","zh":"“我们采取这些措施，是因为我们知道它们能帮助人们不去依赖救济，也能帮助正在领取救济的人更快就业。”","tip":"这是奥斯本对改革效果的宣称，不等于作者已经接受这一说法。"},{"id":"2014-T1-P2-S06","sec":"text1","sec_label":"Text 1","level":3,"en":"On first hearing, this was the socially concerned chancellor, trying to change lives for the better, complete with \"reforms\" to an obviously indulgent system that demands too little effort from the newly unemployed to find work, and subsidises laziness.","core":"This was the socially concerned chancellor。","structure":"trying... 补充说明大臣表现出的意图；complete with... 说明其政策配套；that... 是定语从句，修饰 system，其中两个谓语 demands 与 subsidises 并列。","key":"complete with：此处不是“完成”，而是“连同……在内、配有……”。；subsidise：本义为“补贴”；这里带有讽刺意味，指制度实际上在纵容懒惰。","zh":"乍一听，这位财政大臣似乎心系社会，正努力让人们的生活变得更好，还配套对一个显然过于纵容的制度进行“改革”；这个制度对新近失业者在求职方面要求的努力太少，甚至是在补贴懒惰。","tip":"On first hearing 和 \"reforms\" 表明这一形象只是初听之下的政策包装。"},{"id":"2014-T1-P2-S07","sec":"text1","sec_label":"Text 1","level":3,"en":"What motivated him, we were to understand, was his zeal for \"fundamental fairness\" - protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits.","core":"What motivated him was his zeal for fundamental fairness。","structure":"What motivated him 是主语从句；we were to understand 是插入语；破折号后三个并列的动名词短语具体解释 fundamental fairness。","key":"zeal：热忱、热情，常与 for 连用。；deserving：此处指“值得获得帮助的、应当得到救济的”。","zh":"按照他希望我们形成的理解，驱使他这样做的是他对“根本公平”的热忱，也就是保护纳税人、控制支出，并确保只有最应得到救济的申请者才能领取福利。","tip":"公平的直接指向是纳税人和福利资格审核，并非笼统地改善所有人的生活。"},{"id":"2014-T1-P3-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Losing a job is hurting: you don't skip down to the jobcentre with a song in your heart, delighted at the prospect of doubling your income from the generous state.","core":"Losing a job is hurting: you don't skip down to the jobcentre。","structure":"冒号后解释失业为何不是快乐之事；with a song in your heart 作伴随状语；delighted... 是形容词短语，继续描述主语状态。","key":"with a song in your heart：不是字面的“心中有歌”，而是指心情愉快、兴高采烈。；prospect：此处意为“可能发生的事情、前景”。","zh":"失去工作是一件痛苦的事：你不会心情欢快地蹦跳着去就业服务中心，更不会因为即将从“慷慨的国家”那里获得双倍收入而欣喜不已。","tip":"后半句是反讽式否定，意在驳斥失业者会乐于依赖福利的想象。"},{"id":"2014-T1-P3-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"It is financially terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get.","core":"It is terrifying and embarrassing, and you know that support is minimal and hard to get。","structure":"前半句两个形容词表语并列；that... 是 know 的宾语从句，其中 minimal 与 hard to get 并列作表语。","key":"minimal：极少的、最低限度的。；hard to get：难以获得；不表示援助数额一定为零。","zh":"失业会让人在经济上恐惧、在心理上难堪，而且你清楚，可获得的援助少之又少，还极难申请到。","tip":"It 指失业这一处境；经济恐惧和心理难堪共同指向“不安”。"},{"id":"2014-T1-P3-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"You are now not wanted; you are now excluded from the work environment that offers purpose and structure in your life.","core":"You are not wanted; you are excluded from the work environment。","structure":"分号连接两个递进的被动结构；that offers... 是定语从句，修饰 the work environment。","key":"见下方词汇笔记","zh":"现在，你成了不被需要的人；你被排除在工作环境之外，而工作原本能为你的生活提供目标与秩序。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T1-P3-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"Worse, the crucial income to feed yourself and your family and pay the bills has disappeared.","core":"The crucial income has disappeared。","structure":"两个并列不定式 to feed... 和 (to) pay... 说明这笔收入的用途。","key":"见下方词汇笔记","zh":"更糟的是，用来养活自己和家人、支付账单的关键收入已经消失了。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T1-P3-S05","sec":"text1","sec_label":"Text 1","level":3,"en":"Ask anyone newly unemployed what they want and the answer is always: a job.","core":"见结构","structure":"祈使句 + and + 陈述句 表示“只要……，就会……”；what they want 是 Ask 的直接宾语，anyone newly unemployed 是间接宾语。","key":"见下方词汇笔记","zh":"随便问一个刚刚失业的人想要什么，答案永远都是：一份工作。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T1-P4-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"But in Osborneland, your first instinct is to fall into dependency - permanent dependency if you can get it - supported by a state only too ready to indulge your falsehood.","core":"Your first instinct is to fall into dependency。","structure":"两组破折号插入并强调“永久依赖”；supported by... 是过去分词短语，描述这种依赖受到国家支持；only too ready... 修饰 a state。","key":"Osborneland：作者仿造的讽刺性词语，指奥斯本政策想象中的世界。；only too ready to：非常愿意、简直迫不及待地做……，常带批评意味。；falsehood：虚假陈述、弄虚作假。","zh":"但在“奥斯本世界”里，你的第一本能却是陷入依赖，只要能如愿，甚至会永久依赖；而一个过分乐于纵容你弄虚作假的国家则在背后供养着你。","tip":"整句是在反讽奥斯本对失业者的预设，不是作者认定失业者确实如此。"},{"id":"2014-T1-P4-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"The principle of British welfare is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens.","core":"The principle is no longer that...。","structure":"that 引导表语从句；从句内 insure 与 receive 并列；if 引导条件状语从句。","key":"insure oneself against：为自己投保以防范某种风险；这里指缴纳国民保险费来获得失业保障。","zh":"英国福利制度的原则已不再是：个人可以为失业风险投保，并在失业这一灾难发生时无条件领取补助。","tip":"the disaster 具体指失业，而不是泛指所有个人灾难。"},{"id":"2014-T1-P4-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"Even the very phrase \"jobseeker's allowance\" is about redefining the unemployed as a \"jobseeker\" who had no fundamental right to a benefit he or she has earned through making national insurance contributions.","core":"The phrase is about redefining the unemployed as a jobseeker。","structure":"who... 是定语从句，修饰 jobseeker；其中 he or she has earned... 又是省略关系代词的定语从句，修饰 a benefit。","key":"allowance：此处指政府按条件发放的津贴，语义上弱于基于缴费形成的法定权利。；earn：常见义为“挣得工资”；此处指通过缴纳保险费“取得、赢得”福利资格。","zh":"甚至“求职者津贴”这个说法本身，也是在重新定义失业者：他只是一个“求职者”，对自己通过缴纳国民保险费挣得的福利并不享有基本权利。","tip":"作者强调“缴费换保障”的权利被重新包装为一项附带条件的津贴。"},{"id":"2014-T1-P4-S05","sec":"text1","sec_label":"Text 1","level":3,"en":"Instead, the claimant receives a time-limited \"allowance,\" conditional on actively seeking a job; no entitlement and no insurance, at £71.70 a week, one of the least generous in the EU.","core":"The claimant receives a time-limited allowance。","structure":"conditional on... 是形容词短语，说明领取条件；分号后的几个名词短语补充概括其性质、金额和在欧盟中的水平。","key":"entitlement：依法或按制度应享有的权利，而非普通的“资格感”。；generous：此处形容福利数额“优厚的”，不是指人的慷慨品格。；be eligible for benefit：有资格领取救济金。；sign on：登记领取失业救济金。","zh":"取而代之的是，申请者得到一项有期限且以积极求职为条件的“津贴”；这既不是应得权利，也不是保险保障，每周只有 71.70 英镑，在欧盟各国中属于最微薄之列。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T2-P1-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"All around the world, lawyers generate more hostility than the members of any other profession - with the possible exception of journalism.","core":"Lawyers generate more hostility than the members of any other profession。","structure":"破折号后的介词短语补充一个可能的例外；比较对象是律师与其他职业的成员。","key":"generate hostility：招致敌意。；with the possible exception of：……可能例外。","zh":"在全世界，律师招致的敌意比任何其他职业的从业者都多，新闻业或许是唯一的例外。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T2-P1-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"But there are few places where clients have more grounds for complaint than America.","core":"There are few places。","structure":"where... 是定语从句，修饰 places；more... than America 的比较表达意为美国属于客户抱怨理由最多的地方之一。","key":"grounds：常见义为“地面、场地”；此处作复数名词，意为“理由、根据”。","zh":"但是，很少有地方能像美国这样，让客户有如此充分的理由抱怨律师。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T2-P2-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The best lawyers made skyscrapers-full of money, tempting ever more students to pile into law schools.","core":"The best lawyers made skyscrapers-full of money。","structure":"tempting... 是现在分词短语作结果状语；to pile into law schools 作 students 的宾语补足语。","key":"skyscrapers-full of money：夸张说法，形容赚取的钱多得惊人。；pile into：大量涌入、蜂拥进入。","zh":"顶尖律师赚得盆满钵满，这种巨大的经济回报吸引越来越多的学生蜂拥进入法学院。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T2-P2-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"Many of them instead become the kind of nuisance-lawsuit filer that makes the tort system a costly nightmare.","core":"Many of them become the kind of filer。","structure":"that makes... 是定语从句，修饰 the kind of nuisance-lawsuit filer；make + 宾语 + 宾补 表示“使……变成……”。","key":"nuisance lawsuit：骚扰性、滋扰性诉讼，常指价值有限却耗费资源的案件。；tort system：侵权法体系。","zh":"相反，他们中的许多人沦为了提起滋扰性诉讼的滥诉者，正是这类人使侵权法体系变成了一场代价高昂的噩梦。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T2-P3-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"There is just one path for a lawyer in most American states: a four-year undergraduate degree in some unrelated subject, then a three-year law degree at one of 200 law schools authorized by the American Bar Association and an expensive preparation for the bar exam.","core":"There is just one path for a lawyer。","structure":"冒号后三个并列阶段解释这条路径：四年本科、三年法律学位和昂贵的资格考试准备；authorized by... 修饰 law schools。","key":"bar：常见义为“酒吧、横杆”；法律语境中指律师行业或律师资格制度，bar exam 即律师资格考试。；authorize：批准、认可；这里指美国律师协会对法学院的认证。","zh":"在美国大多数州，成为律师只有一条路径：先取得某个无关专业的四年制本科学位，再到美国律师协会认可的两百所法学院之一攻读三年制法律学位，最后还要为律师资格考试进行费用高昂的备考。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T2-P4-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them.","core":"Ideas have been around, but the bodies have been too conservative。","structure":"that govern the profession 是定语从句，修饰 the state-level bodies；too... to... 表示“太……而不能……”。","key":"body：常见义为“身体”；此处指有管理职能的“机构、组织”。；conservative：此处不是特指政治立场，而是“守旧的、不愿改变的”。","zh":"一些合理的主张早已提出，但管理这一行业的州级机构过于保守，迟迟不肯将其付诸实施。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T2-P4-S05","sec":"text2","sec_label":"Text 2","level":3,"en":"If the bar exam is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so.","core":"Those should be allowed to do so。","structure":"If... 引导条件状语从句；who can sit it earlier 是定语从句，修饰 those；do so 代指提前参加律师资格考试。","key":"stern：严格的、严厉的。；would-be lawyer：有志成为律师的人、准律师。","zh":"如果律师资格考试确实足够严格，能够检验准律师的能力，那么有能力提前参加考试的人就应获准这样做。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T2-P5-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"The other reason why costs are so high is the restrictive guild-like ownership structure of the business.","core":"The other reason is the ownership structure。","structure":"why costs are so high 是定语从句，修饰 reason；restrictive 与 guild-like 共同修饰 ownership structure。","key":"guild-like：类似行会的，暗含封闭和排外之意。；ownership structure：所有权结构。","zh":"成本如此高昂的另一个原因，是这个行业具有类似行会的限制性所有权结构。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T2-P5-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"This keeps fees high and innovation slow.","core":"This keeps fees high and innovation slow。","structure":"keep + 宾语 + 形容词宾补；This 指禁止非律师持有律所股份的规定。","key":"见下方词汇笔记","zh":"这一规定使法律服务费居高不下，也使创新进展缓慢。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T2-P5-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers from the pressure to make money rather than serve clients ethically.","core":"There is pressure, but opponents insist that...。","structure":"that 引导 insist 的宾语从句；从句中动名词短语 keeping outsiders out... 作主语；to make money rather than serve... 修饰 pressure。","key":"isolate A from B：使 A 与 B 隔绝、使 A 免受 B 影响。；outsider：此处指律师行业之外的投资者或管理者。","zh":"行业内部存在变革压力，但监管机构中的保守派坚称，将外部人士挡在律所门外，能让律师免受那种“只顾赚钱而不恪守职业操守服务客户”的压力。","tip":"rather than 对比的是“赚钱”与“合乎伦理地服务客户”，不是作者认可逐利优先。"},{"id":"2014-T2-P6-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"In fact, allowing non-lawyers to own shares in law firms would reduce costs and improve services to customers, by encouraging law firms to use technology and to employ professional managers to focus on improving firms' efficiency.","core":"Allowing non-lawyers to own shares would reduce costs and improve services。","structure":"动名词短语作主语；by encouraging... 表示实现方式；to use... 与 to employ... 并列作 encourage 的宾补；末尾不定式说明经理人的工作目标。","key":"focus on doing sth.：专注于做某事。；improve firms' efficiency：提高律所运营效率。","zh":"事实上，允许非律师持有律师事务所股份，可以通过鼓励律所采用技术、聘用职业经理人专门提升运营效率，从而降低成本并改善客户服务。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T3-P1-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"The US$3-million Fundamental Physics Prize is indeed an interesting experiment, as Alexander Polyakov said when he accepted this year's award in March.","core":"The Fundamental Physics Prize is an interesting experiment。","structure":"as Alexander Polyakov said 引出评价来源；when... 是时间状语从句，修饰 said。","key":"Fundamental Physics Prize：基础物理学突破奖。；as... said：正如……所说，as 引导方式状语从句。","zh":"三百万美元的基础物理学突破奖确实是一项有趣的尝试，正如亚历山大·波利亚科夫今年三月领奖时所说的那样。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T3-P1-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"Many, like the Fundamental Physics Prize, are funded from the telephone-number-sized bank accounts of Internet entrepreneurs.","core":"Many are funded from the bank accounts。","structure":"like... 是插入的举例成分；of Internet entrepreneurs 修饰 bank accounts。","key":"telephone-number-sized：夸张地形容数字位数极多，即账户资金极其庞大。；fund：作动词，意为“为……提供资金”。","zh":"其中许多奖项都像基础物理学突破奖一样，由互联网企业家那余额位数长得像电话号码的银行账户出资。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T3-P1-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"These benefactors have succeeded in their chosen fields, they say, and they want to use their wealth to draw attention to those who have succeeded in science.","core":"These benefactors have succeeded, and they want to use their wealth。","structure":"they say 是插入语；to draw attention... 表目的；who have succeeded... 是定语从句，修饰 those。","key":"benefactor：捐助者、赞助人。；chosen field：所选择并从事的领域。","zh":"这些捐助者说，他们已经在自己选择的领域取得成功，如今希望用自己的财富把公众注意力引向那些在科学领域取得成就的人。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T3-P2-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"You cannot buy class, as the old saying goes, and these upstart entrepreneurs cannot buy their prizes the prestige of the Nobels.","core":"You cannot buy class, and entrepreneurs cannot buy their prizes the prestige。","structure":"as the old saying goes 是插入语；第二分句使用双宾语结构，表示“为奖项买来声望”。","key":"class：常见义为“班级、阶层”；此处指格调、品位和公认的高贵地位。；upstart：暴发户式的新贵，带贬义。","zh":"俗话说，品位是买不来的；同样，这些暴发户式的企业家也无法花钱为自己的奖项买来诺贝尔奖那样的声望。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T3-P3-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Some want to shock, others to draw people into science, or to better reward those who have made their careers in research.","core":"Some want to shock, others (want) to draw people into science, or to reward those。","structure":"others 后省略了 want；三个不定式并列列举设奖目标；who... 是定语从句，修饰 those。","key":"shock：此处作不及物用法的省略表达，意为制造震动、引起轰动。；make one's career in：以……为职业，在……领域发展职业生涯。","zh":"有些人希望制造轰动，另一些人希望吸引公众投身科学，或更丰厚地奖励那些以研究为毕生事业的人。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T3-P4-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"The Breakthrough Prize in Life Sciences, launched this year, takes an unrepresentative view of what the life sciences include.","core":"The Breakthrough Prize takes an unrepresentative view。","structure":"launched this year 是过去分词短语，补充说明该奖项；what the life sciences include 是 of 的宾语从句。","key":"take a... view of：以某种方式看待或界定……。；unrepresentative：不具代表性的，不能反映领域全貌的。","zh":"今年设立的生命科学突破奖，对生命科学所涵盖内容的理解缺乏代表性。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T3-P4-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"But the Nobel Foundation's limit of three recipients per prize, each of whom must still be living, has long been outgrown by the collaborative nature of modern research - as will be demonstrated by the inevitable row over who is ignored when it comes to acknowledging the discovery of the Higgs boson.","core":"The limit has long been outgrown by the collaborative nature of modern research。","structure":"each of whom... 是非限制性定语从句，补充说明三位获奖者；破折号后 as will be demonstrated... 是倒装形式，as 指代前述判断；who is ignored 是 over 的宾语从句。","key":"outgrow：本义为“长大后不再适合”；此处指现代科研的发展已经“超越、使……过时”。；row：常见义为“一排”；此处读 /raʊ/，意为激烈争论。；when it comes to：当涉及……时。","zh":"但诺贝尔基金会规定每个奖项最多只能有三位获奖者，而且每个人都必须在世；现代研究的协作性质早已超越了这一限制。在表彰希格斯玻色子的发现贡献时，究竟谁会被忽略必将引发激烈争论，这正证明了该限制的滞后。","tip":"真正过时的是“最多三人且必须在世”的获奖者限制；希格斯玻色子的发现只是用来说明现代科研依赖多人协作的案例。"},{"id":"2014-T3-P4-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"The Nobels were, of course, themselves set up by a very rich individual who had decided what he wanted to do with his own money.","core":"The Nobels were set up by a very rich individual。","structure":"who... 是定语从句，修饰 individual；what he wanted to do... 是 decided 的宾语从句。","key":"见下方词汇笔记","zh":"当然，诺贝尔奖本身也是由一位非常富有的个人设立的，他决定按照自己的意愿支配自己的财富。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T3-P4-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"Time, rather than intention, has given them legitimacy.","core":"Time has given them legitimacy。","structure":"rather than intention 插入主语之后形成对比；them 指诺贝尔奖。","key":"legitimacy：正当性、公信力和被广泛承认的地位。","zh":"赋予诺贝尔奖正当性的是时间，而不是创设者当初的意图。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T3-P5-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"First, most researchers would accept such a prize if they were offered one.","core":"见结构","structure":"if they were offered one 是虚拟色彩较弱的假设条件；one 代指 such a prize。","key":"见下方词汇笔记","zh":"第一，如果获得这样的奖项，大多数研究人员都会接受。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T3-P5-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"Second, it is surely a good thing that the money and attention come to science rather than go elsewhere.","core":"It is surely a good thing。","structure":"it 是形式主语，that... 是真正主语；come to science 与 go elsewhere 由 rather than 对照。","key":"见下方词汇笔记","zh":"第二，资金与关注流向科学而不是其他地方，这无疑是一件好事。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T3-P5-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"It is fair to criticize and question the mechanism - that is the culture of research, after all - but it is the prize-givers' money to do with as they please.","core":"It is fair to criticize..., but it is the prize-givers' money。","structure":"第一处 it 是形式主语；两组连字符之间为插入语；to do with as they please 说明设奖者可以随意处置资金。","key":"fair：此处意为“合理的、正当的”，不是“公平的”。；do with：处置、处理。","zh":"批评和质疑奖项机制是合理的，毕竟这正是科研文化的一部分；但资金属于设奖者，他们有权按自己的意愿支配。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T4-P1-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"\"The Heart of the Matter,\" the just-released report by the American Academy of Arts and Sciences (AAAS), deserves praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America.","core":"\"The Heart of the Matter\" deserves praise。","structure":"the just-released report... 是报告标题的同位语；for affirming... 说明值得称赞的原因；to the prosperity and security... 说明人文社科对何者重要。","key":"affirm the importance of：肯定……的重要性。；liberal democracy：自由民主制度。","zh":"美国人文与科学院刚刚发布的报告《问题的核心》肯定了人文与社会科学对于美国自由民主之繁荣与安全的重要性，这一点值得称赞。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T4-P1-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Regrettably, however, the report's failure to address the true nature of the crisis facing liberal education may cause more harm than good.","core":"The report's failure may cause more harm than good。","structure":"to address... 修饰 failure；facing liberal education 是现在分词短语，修饰 crisis。","key":"address：常见义为“地址、致辞”；此处作动词，意为“正视并处理”。；more harm than good：弊大于利。","zh":"然而，遗憾的是，这份报告未能触及自由教育所面临危机的真实本质，结果可能弊大于利。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T4-P2-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"In 2010, leading congressional Democrats and Republicans sent letters to the AAAS asking that it identify actions that could be taken by \"federal, state and local governments, universities, foundations, educators, individual benefactors and others\" to \"maintain national excellence in humanities and social scientific scholarship and education.\"","core":"Democrats and Republicans sent letters to the AAAS。","structure":"asking that... 是现在分词短语，说明写信目的；that could be taken... 是定语从句，修饰 actions；末尾不定式说明行动的目标。","key":"leading：此处意为“主要的、有影响力的”，不是“带领中的”。；maintain national excellence：保持国家的卓越水平和领先优势。","zh":"2010 年，国会中有影响力的民主党人与共和党人致函美国人文与科学院，要求该机构找出可由“联邦、州和地方政府、大学、基金会、教育工作者、个人捐助者及其他方面”采取的行动，以“维持国家在人文与社会科学研究及教育领域的卓越地位”。","tip":"it 指 AAAS；引号内第一部分列举行动主体，第二部分才是国会要求实现的目标。"},{"id":"2014-T4-P2-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Among the commission's 51 members are top-tier-university presidents, scholars, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism.","core":"Presidents, scholars, lawyers, judges, executives and figures are among the members。","structure":"地点状语 Among... 置于句首引起完全倒装；as well as 补充另一组并列成员。","key":"top-tier：顶尖的、最高层级的。；prominent figure：知名人士、重要人物。","zh":"该委员会的 51 名成员包括顶尖大学校长、学者、律师、法官和企业高管，以及外交、电影制作、音乐和新闻界的知名人士。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T4-P3-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Because representative government presupposes an informed citizenry, the report supports full literacy; stresses the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.","core":"The report supports..., stresses..., and encourages...。","structure":"Because... 引导原因状语从句；主句三个谓语由分号清楚分隔；particularly... 具体说明历史与政府学习的重点。","key":"presuppose：以……为先决条件、预先假定。；citizenry：全体公民。；literacy：读写能力；结合语境也包含有效理解公共事务所需的基本素养。","zh":"因为代议制政府以公民充分知情为前提，所以报告支持全民具备完整的读写素养；强调历史与政治学的研习，特别是美国历史与美国政治体制；并鼓励使用新的数字技术。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T4-P3-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students' ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.","core":"The report calls for A, B, C and D。","structure":"句首不定式表目的；calls for 后并列四项主张；that improve... 是定语从句，修饰 curricula；to solve... and communicate... 修饰 ability。","key":"crafting：此处指精心设计、制定。；bring... to bear on：运用……处理或影响……。","zh":"为促进创新与竞争，报告呼吁增加研究投入，设计连贯的课程体系以提高学生在 21 世纪解决问题和有效沟通的能力，增加对教师的资金支持，并鼓励学者运用所学应对当今重大挑战。","tip":"increased funding for teachers 与最后的 the encouragement of scholars... 是两个独立并列项。"},{"id":"2014-T4-P4-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Unfortunately, despite 2½ years in the making, \"The Heart of the Matter\" never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.","core":"\"The Heart of the Matter\" never gets to the heart of the matter。","structure":"despite... 是让步介词短语；冒号后解释作者所谓真正的“问题核心”。","key":"in the making：在制作、酝酿或形成过程中。；illiberal：不自由的、压制多元观点的；与 liberal education 中强调开阔心智的 liberal 构成反差。","zh":"遗憾的是，尽管历时两年半才完成，《问题的核心》却始终没有触及问题的核心：美国顶尖高校中所谓自由教育所具有的非自由本质。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T4-P4-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"The commission ignores that for several decades America's colleges and universities have produced graduates who don't know the content and character of liberal education and are thus deprived of its benefits.","core":"The commission ignores that colleges and universities have produced graduates。","structure":"that... 是 ignores 的宾语从句；who... 是定语从句，修饰 graduates，其中 don't know 与 are deprived 并列。","key":"character：常见义为“性格、人物”；此处指自由教育的本质特征。；be deprived of：被剥夺、无法获得……。","zh":"委员会忽视了这样一个事实：几十年来，美国高校培养出的毕业生不了解自由教育的内容与特质，因此也无法享受这种教育带来的益处。","tip":"its 指 liberal education；毕业生并非没有学历，而是没有获得真正自由教育的内容和益处。"},{"id":"2014-T4-P4-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for publicizing \"progressive,\" or left-liberal propaganda.","core":"The spirit of inquiry has been replaced by the use of the humanities and social sciences。","structure":"once at home on campus 修饰 the spirit of inquiry；as vehicles... 是宾语补足成分；for publicizing... 说明工具用途。","key":"at home：此处意为“自在存在、自然属于某处”，不是“在家”。；vehicle：常见义为“车辆”；此处比喻传播思想的“载体、工具”。","zh":"令人遗憾的是，曾经在校园中安然立足的探索精神，如今已被另一种做法取代：把人文与社会科学当作宣传“进步主义”或左翼自由派主张的工具。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T4-P5-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas - such as free markets and self-reliance - as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.","core":"Professors treat A as the proper subject while portraying B as falling outside the boundaries。","structure":"while 连接同时存在且形成对比的两种做法；两个 as 分别引出宾语补足语；破折号之间列举古典自由主义观点；of routine, and sometimes legitimate, intellectual investigation 修饰 boundaries。","key":"portray A as B：把 A 描绘成 B。；self-reliance：自力更生、自我依靠。；legitimate：此处意为可被学术规范承认的、正当的。","zh":"如今，教授们通常把进步主义的历史解释和进步主义公共政策视为恰当的研究对象，与此同时，却将自由市场、自力更生等保守主义或古典自由主义思想，排斥在常规的、乃至正当的学术探究范围之外。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2014-T4-P6-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Yet its report may well set back reform by obscuring the depth and breadth of the challenge that Congress asked it to illuminate.","core":"Its report may set back reform。","structure":"by obscuring... 表示方式或原因；that Congress asked it to illuminate 是定语从句，修饰 the challenge，其中 it 指 AAAS 或其委员会。","key":"set back：阻碍、延误，使进展倒退。；illuminate：本义为“照亮”；此处指阐明、解释清楚。；affirm the importance of：肯定……的重要性。；cause more harm than good：弊大于利。","zh":"然而，这份报告掩盖了国会要求它阐明的挑战之深度与广度，很可能反而阻碍改革。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"}]};</script>

_label":"Text 1","ctx":"Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.","note":"不是“很少用到”，而是“不欣赏、不需要，对……不感兴趣”。","forms":["have little use for"]},{"w":"upholstered","pos":"v./adj.","cn":"本义为“装有软垫的”；此处比喻文字铺陈华丽、修饰繁复。","sec":"text1","sec_label":"Text 1","ctx":"Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.","note":"本义为“装有软垫的”；此处比喻文字铺陈华丽、修饰繁复。","forms":["upholstered"]},{"w":"Vicwardian","pos":"词","cn":"由 Victorian 与 Edwardian 合成，指兼具维多利亚时代和爱德华时代特征的风格。","sec":"text1","sec_label":"Text 1","ctx":"Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.","note":"由 Victorian 与 Edwardian 合成，指兼具维多利亚时代和爱德华时代特征的风格。","forms":["Vicwardian"]},{"w":"amateur","pos":"词","cn":"此处不是贬义的“不专业”，而是指由并非学院派专职学者、但具广博修养的评论家写作的传统。","sec":"text1","sec_label":"Text 1","ctx":"Moreover, the amateur tradition in music criticism has been in headlong retreat.","note":"此处不是贬义的“不专业”，而是指由并非学院派专职学者、但具广博修养的评论家写作的传统。","forms":["amateur"]},{"w":"in headlong retreat","pos":"phr.","cn":"迅速败退、急剧衰落。","sec":"text1","sec_label":"Text 1","ctx":"Moreover, the amateur tradition in music criticism has been in headlong retreat.","note":"迅速败退、急剧衰落。","forms":["in headlong retreat"]},{"w":"grant","pos":"词","cn":"常见义为“给予”；在专利语境中指正式“授予、批准”专利权。","sec":"text2","sec_label":"Text 2","ctx":"Over the past decade, thousands of patents have been granted for what are called business methods.","note":"常见义为“给予”；在专利语境中指正式“授予、批准”专利权。","forms":["grant"]},{"w":"business-method patent","pos":"phr.","cn":"商业方法专利，即对开展某类商业活动的方法给予的专利保护。","sec":"text2","sec_label":"Text 2","ctx":"Over the past decade, thousands of patents have been granted for what are called business methods.","note":"商业方法专利，即对开展某类商业活动的方法给予的专利保护。","f cope of protections"]},{"w":"uphold","pos":"词","cn":"法律语境中指法院“维持”原决定或权利的有效性。","sec":"text2","sec_label":"Text 2","ctx":"Last April, for example, the justices signaled that too many patents were being upheld for \"inventions\" that are obvious.","note":"法律语境中指法院“维持”原决定或权利的有效性。","forms":["uphold"]},{"w":"obvious","pos":"adj.","cn":"专利法中“显而易见”意味着缺乏足够创新性，通常不应获得专利保护。","sec":"text2","sec_label":"Text 2","ctx":"Last April, for example, the justices signaled that too many patents were being upheld for \"inventions\" that are obvious.","note":"专利法中“显而易见”意味着缺乏足够创新性，通常不应获得专利保护。","forms":["obvious"]},{"w":"epidemic","pos":"adj.","cn":"常见义为“流行病”；social epidemics 用疾病传播作比喻，指观念、风尚或行为在社会中的迅速流行。","sec":"text3","sec_label":"Text 3","ctx":"In his book *The Tipping Point*, Malcolm Gladwell argues that \"social epidemics\" are driven in large part by the actions of a tiny minority of special individuals, often ","note":"常见义为“流行病”；social epidemics 用疾病传播作比喻，指观念、风尚或行为在社会中的迅速流行。","forms":["epidemic"]},{"w":"influential","pos":"adj.","cn":"通常作形容词“有影响力的”；此处名词化，指“意见领袖、有影响力的人”。","sec":"text3","sec_label":"Text 3","ctx":"In his book *The Tipping Point*, Malcolm Gladwell argues that \"social epidemics\" are driven in large part by the actions of a tiny minority of special individuals, often ","note":"通常作形容词“有影响力的”；此处名词化，指“意见领袖、有影响力的人”。","forms":["influential"]},{"w":"in large part","pos":"phr.","cn":"在很大程度上。","sec":"text3","sec_label":"Text 3","ctx":"In his book *The Tipping Point*, Malcolm Gladwell argues that \"social epidemics\" are driven in large part by the actions of a tiny minority of special individuals, often ","note":"在很大程度上。","forms":["in large part"]},{"w":"well connected","pos":"phr.","cn":"人脉广泛的、社会关系良好的。","sec":"text3","sec_label":"Text 3","ctx":"In his book *The Tipping Point*, Malcolm Gladwell argues that \"social epidemics\" are driven in large part by the actions of a tiny minority of special individuals, often ","note":"人脉广泛的、社会关系良好的。","forms":["well connected"]},{"w":"compelling","pos":"v./n.","cn":"此处意为“有说服力的、令人信服的”，不是“强迫性的”。","sec":"text3","sec_label":"Text 3","ctx":"The idea is intuitively compelling, but it doesn't explain how ideas actually spread.","note":"此处意为“有说服力的、令人信服的”，不是“强迫性的”。","forms":["compelling"]},{"w":"supposed","pos":"v./adj.","cn":"此处带保留意味，指“所谓的、被认为存在的”，暗示其重要性尚未得到证实。","sec":"text3","sec_label":"Text 3","ctx":"The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the \"two-step flow of communication\": Information flows from ","note":"此处带保留意味，指“所谓的、被认为存在的”，暗示其重要性尚未得到证实。","forms":["supposed"]},{"w":"derive from","pos":"phr.","cn":"源自、来自。","sec":"text3","sec_label":"Text 3","ctx":"The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the \"two-step flow of communication\": Information flows from ","note":"源自、来自。","forms":["derive from"]},{"w":"plausible-sounding","pos":"adj.","cn":"听起来似乎合理的。","sec":"text3","sec_label":"Text 3","ctx":"The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the \"two-step flow of communication\": Information flows from ","note":"听起来似乎合理的。","forms":["plausible-sounding"]},{"w":"largely untested","pos":"phr.","cn":"基本未经验证的。","sec":"text3","sec_label":"Text 3","ctx":"The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the \"two-step flow of communication\": Information flows from ","note":"基本未经验证的。","forms":["largely untested"]},{"w":"the two-step flow of communication","pos":"phr.","cn":"传播的两级流动，即媒体先影响意见领袖，再由意见领袖影响大众。","sec":"text3","sec_label":"Text 3","ctx":"The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the \"two-step flow of communication\": Information flows from ","note":"传播的两级流动，即媒体先影响意见领袖，再由意见领袖影响大众。","forms":["the two-step flow of communication"]},{"w":"embrace","pos":"词","cn":"常见义为“拥抱”；此处意为“欣然接受、采纳”一种理论。","sec":"text3","sec_label":"Text 3","ctx":"Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for ","note":"常见义为“拥抱”；此处意为“欣然接受、采纳”一种理论。","forms":["embrace"]},{"w":"select","pos":"词","cn":"此处作形容词，意为“经过挑选的、少数优选的”。","sec":"text3","sec_label":"Text 3","ctx":"Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for ","note":"此处作形容词，意为“经过挑选的、少数优选的”。","forms":["select"]},{"w":"look","pos":"词","cn":"此处作名词，指一种外观、造型或时尚风格。","sec":"text3","sec_label":"Text 3","ctx":"The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.","note":"此处作名词，指一种外观、造型或时尚风格。","forms":["look"]},{"w":"neighborhood","pos":"词","cn":"此处不仅是地理上的邻里，也指突然成为热门去处的街区。","sec":"text3","sec_label":"Text 3","ctx":"The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods.","note":"此处不仅是地理上的邻里，也指突然成为热门去处的街区。","forms":["neighborhood"]},{"w":"cursory","pos":"词","cn":"粗略的、走马观花的。","sec":"text3","sec_label":"Text 3","ctx":"In many such cases, a cursory search for causes finds that some small group of people was wearing, promoting, or developing whatever it is before anyone else paid attenti","note":"粗略的、走马观花的。","forms":["cursory"]},{"w":"whatever it is","pos":"phr.","cn":"泛指当时讨论的任何流行对象，不必机械译成“无论它是什么”。","sec":"text3","sec_label":"Text 3","ctx":"In many such cases, a cursory search for causes finds that some small group of people was wearing, promoting, or developing whatever it is before anyone else paid attenti","note":"泛指当时讨论的任何流行对象，不必机械译成“无论它是什么”。","forms":["whatever it is"]},{"w":"anecdotal evidence","pos":"phr.","cn":"来自个别案例或传闻的证据，通常缺乏系统验证。","sec":"text3","sec_label":"Text 3","ctx":"Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.","note":"来自个别案例或传闻的证据，通常缺乏系统验证。","forms":["anecdotal evidence"]},{"w":"fit nicely with","pos":"phr.","cn":"与……看似十分吻合；结合上下文含有“容易迎合该理论但证明力不足”的意味。","sec":"text3","sec_label":"Text 3","ctx":"Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.","note":"与……看似十分吻合；结合上下文含有“容易迎合该理论但证明力不足”的意味。","forms":["fit nicely with"]},{"w":"come up with the finding that...","pos":"phr.","cn":"得出……的研究发现。","sec":"text3","sec_label":"Text 3","ctx":"In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.","note":"得出……的研究发现。","forms":["come up with the finding that..."]},{"w":"far less... than...","pos":"phr.","cn":"远不如……。","sec":"text3","sec_label":"Text 3","ctx":"In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.","note":"远不如……。","forms":["far less... than..."]},{"w":"required","pos":"v./adj.","cn":"此处指意见领袖并非社会传播发生的“必要条件”。","sec":"text3","sec_label":"Text 3","ctx":"In fact, they don't seem to be required at all.","note":"此处指意见领袖并非社会传播发生的“必要条件”。","forms":["required"]},{"w":"outsize","pos":"v.","cn":"超常的、格外巨大的。","sec":"text3","sec_label":"Text 3","ctx":"The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey - whose outsize presence is p","note":"超常的、格外巨大的。","forms":["outsize"]},{"w":"a function of","pos":"phr.","cn":"此处不是数学“函数”，而是“由……造成的结果、取决于……”。","sec":"text3","sec_label":"Text 3","ctx":"The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey - whose outsize presence is p","note":"此处不是数学“函数”，而是“由……造成的结果、取决于……”。","forms":["a function of"]},{"w":"that many","pos":"phr.","cn":"那么多；that 作程度副词。","sec":"text3","sec_label":"Text 3","ctx":"The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey - whose outsize presence is p","note":"那么多；that 作程度副词。","forms":["that many"]},{"w":"so affected","pos":"phr.","cn":"如此受到影响的；so 回指前句“受非名人意见领袖直接影响”这一方式。","sec":"text3","sec_label":"Text 3","ctx":"For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just ","note":"如此受到影响的；so 回指前句“受非名人意见领袖直接影响”这一方式。","forms":["so affected"]},{"w":"in turn","pos":"phr.","cn":"继而、依次、转而。","sec":"text3","sec_label":"Text 3","ctx":"For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just ","note":"继而、依次、转而。","forms":["in turn"]},{"w":"two degrees removed from","pos":"phr.","cn":"与……相隔两层社会关系，而非“被移走两度”。","sec":"text3","sec_label":"Text 3","ctx":"If people in the network just two degrees removed from the initial influential prove resistant, for example, the cascade of change won't propagate very far or affect many","note":"与……相隔两层社会关系，而非“被移走两度”。","forms":["two degrees removed from"]},{"w":"cascade","pos":"词","cn":"本义为“瀑布”；此处指层层传递的连锁变化。","sec":"text3","sec_label":"Text 3","ctx":"If people in the network just two degrees removed from the initial influential prove resistant, for example, the cascade of change won't propagate very far or affect many","note":"本义为“瀑布”；此处指层层传递的连锁变化。","forms":["cascade"]},{"w":"propagate","pos":"v.","cn":"传播、扩散。","sec":"text3","sec_label":"Text 3","ctx":"If people in the network just two degrees removed from the initial influential prove resistant, for example, the cascade of change won't propagate very far or affect many","note":"传播、扩散。","forms":["propagate"]},{"w":"build on","pos":"phr.","cn":"在……基础上进一步发展或研究。","sec":"text3","sec_label":"Text 3","ctx":"Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of po","note":"在……基础上进一步发展或研究。","forms":["build on"]},{"w":"manipulate variables","pos":"phr.","cn":"在实验中有控制地调整变量，不含“暗中操纵”的贬义。","sec":"text3","sec_label":"Text 3","ctx":"Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of po","note":"在实验中有控制地调整变量，不含“暗中操纵”的贬义。","forms":["manipulate variables"]},{"w":"critical mass","pos":"phr.","cn":"本义为核反应的“临界质量”；此处指足以触发大规模连锁传播的最低必要人数。","sec":"text3","sec_label":"Text 3","ctx":"They found that the principal requirement for what is called \"global cascades\" - the widespread propagation of influence through networks - is the presence not of a few i","note":"本义为核反应的“临界质量”；此处指足以触发大规模连锁传播的最低必要人数。","forms":["critical mass"]},{"w":"blame oneself for","pos":"phr.","cn":"因……责怪自己；承认自己应为……负责。","sec":"text4","sec_label":"Text 4","ctx":"Bankers have been blaming themselves for their troubles in public.","note":"因……责怪自己；承认自己应为……负责。","forms":["blame oneself for"]},{"w":"in public","pos":"phr.","cn":"公开地，当着公众的面。","sec":"text4","sec_label":"Text 4","ctx":"Bankers have been blaming themselves for their troubles in public.","note":"公开地，当着公众的面。","forms":["in public"]},{"w":"take aim at","pos":"phr.","cn":"本义为“瞄准”；此处指把批评或攻击的目标对准某人。","sec":"text4","sec_label":"Text 4","ctx":"Behind the scenes, they have been taking aim at someone else: the accounting standard-setters.","note":"本义为“瞄准”；此处指把批评或攻击的目标对准某人。","forms":["take aim at"]},{"w":"behind the scenes","pos":"phr.","cn":"在幕后、不公开地。","sec":"text4","sec_label":"Text 4","ctx":"Behind the scenes, they have been taking aim at someone else: the accounting standard-setters.","note":"在幕后、不公开地。","forms":["behind the scenes"]},{"w":"accounting standard-setter","pos":"phr.","cn":"会计准则制定者或制定机构。","sec":"text4","sec_label":"Text 4","ctx":"Behind the scenes, they have been taking aim at someone else: the accounting standard-setters.","note":"会计准则制定者或制定机构。","forms":["accounting standard-setter"]},{"w":"moan","pos":"词","cn":"本义为“呻吟”；此处指带有不满地“抱怨”。","sec":"text4","sec_label":"Text 4","ctx":"Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.","note":"本义为“呻吟”；此处指带有不满地“抱怨”。","forms":["moan"]},{"w":"say","pos":"词","cn":"此处主语是规则，意为“规定、要求”。","sec":"text4","sec_label":"Text 4","ctx":"These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.","note":"此处主语是规则，意为“规定、要求”。","forms":["say"]},{"w":"fetch","pos":"词","cn":"常见义为“取来”；用于价格时意为“售得、卖得某一价格”。","sec":"text4","sec_label":"Text 4","ctx":"These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.","note":"常见义为“取来”；用于价格时意为“售得、卖得某一价格”。","forms":["fetch"]},{"w":"work","pos":"词","cn":"此处意为“奏效、产生预期效果”。","sec":"text4","sec_label":"Text 4","ctx":"Unfortunately, banks' lobbying now seems to be working.","note":"此处意为“奏效、产生预期效果”。","forms":["work"]},{"w":"lobbying","pos":"v./n.","cn":"游说，即试图影响立法者或政策制定者。","sec":"text4","sec_label":"Text 4","ctx":"Unfortunately, banks' lobbying now seems to be working.","note":"游说，即试图影响立法者或政策制定者。","forms":["lobbying"]},{"w":"compromise","pos":"v.","cn":"常见义为“妥协”；此处作被动，意为“受到损害、被削弱”。","sec":"text4","sec_label":"Text 4","ctx":"The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.","note":"常见义为“妥协”；此处作被动，意为“受到损害、被削弱”。","forms":["compromise"]},{"w":"carry","pos":"词","cn":"常见义为“携带”；会计语境中指以某一价值在账面上“列示、计列”资产。","sec":"text4","sec_label":"Text 4","ctx":"And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.","note":"常见义为“携带”；会计语境中指以某一价值在账面上“列示、计列”资产。","forms":["carry"]},{"w":"toxic asset","pos":"phr.","cn":"有毒资产，指价值大幅缩水、难以出售且风险很高的资产。","sec":"text4","sec_label":"Text 4","ctx":"And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.","note":"有毒资产，指价值大幅缩水、难以出售且风险很高的资产。","forms":["toxic asset"]},{"w":"bruising","pos":"v./n.","cn":"本义为“造成瘀伤的”；此处形容交锋激烈、令人受挫。","sec":"text4","sec_label":"Text 4","ctx":"After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.","note":"本义为“造成瘀伤的”；此处形容交锋激烈、令人受挫。","forms":["bruising"]},{"w":"rush through","pos":"phr.","cn":"匆忙使某项规则或法案获得通过。","sec":"text4","sec_label":"Text 4","ctx":"After a bruising encounter with Congress, America's Financial Accounting Standards Board (FASB) rushed through rule changes.","note":"匆忙使某项规则或法案获得通过。","forms":["rush through"]},{"w":"illiquid asset","pos":"phr.","cn":"流动性不足、难以迅速按合理价格出售的资产。","sec":"text4","sec_label":"Text 4","ctx":"These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.","note":"流动性不足、难以迅速按合理价格出售的资产。","forms":["illiquid asset"]},{"w":"recognize losses","pos":"phr.","cn":"会计语境中指在报表中“确认损失”。","sec":"text4","sec_label":"Text 4","ctx":"These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.","note":"会计语境中指在报表中“确认损失”。","forms":["recognize losses"]},{"w":"cry out against","pos":"phr.","cn":"大声抗议、强烈反对。","sec":"text4","sec_label":"Text 4","ctx":"Bob Herz, the FASB's chairman, cried out against those who \"question our motives.\"","note":"大声抗议、强烈反对。","forms":["cry out against"]},{"w":"judgment","pos":"n.","cn":"此处指管理层在资产估值和损失确认上的主观裁量。","sec":"text4","sec_label":"Text 4","ctx":"Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"","note":"此处指管理层在资产估值和损失确认上的主观裁量。","forms":["judgment"]},{"w":"politely calls","pos":"phr.","cn":"字面是“礼貌地称为”，实际暗示这是一种粉饰性、委婉的说法。","sec":"text4","sec_label":"Text 4","ctx":"Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"","note":"字面是“礼貌地称为”，实际暗示这是一种粉饰性、委婉的说法。","forms":["politely calls"]},{"w":"do likewise","pos":"phr.","cn":"照样做、采取同样措施，此处指仿照美国放宽会计规则。","sec":"text4","sec_label":"Text 4","ctx":"European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.","note":"照样做、采取同样措施，此处指仿照美国放宽会计规则。","forms":["do likewise"]},{"w":"fold","pos":"词","cn":"常见义为“折叠”；此处指在压力下“屈服、让步”。","sec":"text4","sec_label":"Text 4","ctx":"The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.","note":"常见义为“折叠”；此处指在压力下“屈服、让步”。","forms":["fold"]},{"w":"reconstruction of rules","pos":"phr.","cn":"对规则体系的重构，而非建筑物重建。","sec":"text4","sec_label":"Text 4","ctx":"The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.","note":"对规则体系的重构，而非建筑物重建。","forms":["reconstruction of rules"]},{"w":"vacuum","pos":"词","cn":"本义为“真空”；political vacuum 指不受政治环境和压力影响的状态。","sec":"text4","sec_label":"Text 4","ctx":"Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop differen","note":"本义为“真空”；political vacuum 指不受政治环境和压力影响的状态。","forms":["vacuum"]},{"w":"yet","pos":"词","cn":"此处意为“仍然、到头来仍有可能”，不是转折连词。","sec":"text4","sec_label":"Text 4","ctx":"Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop differen","note":"此处意为“仍然、到头来仍有可能”，不是转折连词。","forms":["yet"]},{"w":"on the wrong planet","pos":"phr.","cn":"字面为“在错误的星球上”，此处讽刺银行脱离市场现实。","sec":"text4","sec_label":"Text 4","ctx":"It was banks that were on the wrong planet, with accounts that vastly overvalued assets.","note":"字面为“在错误的星球上”，此处讽刺银行脱离市场现实。","forms":["on the wrong planet"]},{"w":"account","pos":"词","cn":"此处指银行账目或财务报表，不是普通“账户”。","sec":"text4","sec_label":"Text 4","ctx":"It was banks that were on the wrong planet, with accounts that vastly overvalued assets.","note":"此处指银行账目或财务报表，不是普通“账户”。","forms":["account"]},{"w":"book value","pos":"phr.","cn":"账面价值，即资产负债表所记录的净资产价值，不是“书的价值”。","sec":"text4","sec_label":"Text 4","ctx":"But banks' shares trade below their book value, suggesting that investors are skeptical.","note":"账面价值，即资产负债表所记录的净资产价值，不是“书的价值”。","forms":["book value"]},{"w":"dead market","pos":"phr.","cn":"交易活动几乎停滞、缺乏流动性的市场。","sec":"text4","sec_label":"Text 4","ctx":"And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.","note":"交易活动几乎停滞、缺乏流动性的市场。","forms":["dead market"]},{"w":"book a loss","pos":"phr.","cn":"把损失记入账目、确认损失。","sec":"text4","sec_label":"Text 4","ctx":"And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.","note":"把损失记入账目、确认损失。","forms":["book a loss"]},{"w":"bargain","pos":"词","cn":"此处指价格低廉、值得买入的资产。","sec":"text4","sec_label":"Text 4","ctx":"And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.","note":"此处指价格低廉、值得买入的资产。","forms":["bargain"]},{"w":"mark assets to levels","pos":"phr.","cn":"按某一价位重新标记或计量资产价值，语境中指将账面估值调整到市场可接受水平。","sec":"text4","sec_label":"Text 4","ctx":"America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.","note":"按某一价位重新标记或计量资产价值，语境中指将账面估值调整到市场可接受水平。","forms":["mark assets to levels"]},{"w":"buy up","pos":"phr.","cn":"大量收购、全部或集中买入。","sec":"text4","sec_label":"Text 4","ctx":"America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.","note":"大量收购、全部或集中买入。","forms":["buy up"]},{"w":"combative","pos":"adj.","cn":"好斗的、敢于抗争的；此处褒义地指敢于抵抗利益集团压力。","sec":"text4","sec_label":"Text 4","ctx":"Successful markets require independent and even combative standard-setters.","note":"好斗的、敢于抗争的；此处褒义地指敢于抵抗利益集团压力。","forms":["combative"]},{"w":"special interests","pos":"phr.","cn":"特殊利益集团，即试图让政策服务于自身利益的组织或行业力量。","sec":"text4","sec_label":"Text 4","ctx":"The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests.","note":"特殊利益集团，即试图让政策服务于自身利益的组织或行业力量。","forms":["special interests"]},{"w":"clean up rules","pos":"phr.","cn":"清理、整顿和完善规则。","sec":"text4","sec_label":"Text 4","ctx":"The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests.","note":"清理、整顿和完善规则。","forms":["clean up rules"]},{"w":"give in to","pos":"phr.","cn":"向……屈服、让步。","sec":"text4","sec_label":"Text 4","ctx":"But by giving in to critics now they are inviting pressure to make more concessions.","note":"向……屈服、让步。","forms":["give in to"]},{"w":"make concessions","pos":"phr.","cn":"作出让步。","sec":"text4","sec_label":"Text 4","ctx":"But by giving in to critics now they are inviting pressure to make more concessions.","note":"作出让步。","forms":["make concessions"]}],"sentences":[{"id":"2010-T1-P1-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts coverage.","core":"the most far-reaching has been the inexorable decline。","structure":"Of all the changes... 限定比较范围；that have taken place... 修饰 changes；in the scope and seriousness... 说明衰退体现在哪两个方面。","key":"coverage：常见义为“覆盖”；此处指媒体对某一领域的“报道”。；scope：此处不是具体的“范围界线”，而是艺术报道所涉及内容的广度。；far-reaching：影响深远的。；inexorable decline：无法阻止、难以逆转的衰退。","zh":"在过去四分之一个世纪里，英语报纸经历了种种变化，其中影响最为深远的，或许就是艺术报道在覆盖范围和严肃程度上不可阻挡的衰退。","tip":"their 指 English-language newspapers；作者说的是艺术报道的广度与严肃性下降，不是所有新闻业都消失。"},{"id":"2010-T1-P2-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"It is difficult to the point of impossibility for the average reader under the age of forty to imagine a time when high-quality arts criticism could be found in most big-city newspapers.","core":"It is difficult for the average reader to imagine a time。","structure":"It 是形式主语，真正主语是 to imagine...；under the age of forty 修饰 reader；when... 修饰 a time。","key":"to the point of：达到……的程度。；arts criticism：艺术评论，而非泛指对艺术的“批评”。","zh":"对普通的 40 岁以下读者来说，要想象多数大城市报纸都能读到高质量艺术评论的年代，几乎是不可能的。","tip":"年轻读者是无法想象过去曾有这种盛况，并非怀疑艺术评论是否适合刊登。"},{"id":"2010-T1-P2-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"To read such books today is to marvel at the fact that their learned contents were once deemed suitable for publication in general-circulation dailies.","core":"To read such books is to marvel at the fact。","structure":"两个不定式分别作主语和表语；that... 是 the fact 的同位语从句；deem A suitable for B 的被动形式为 A be deemed suitable for B。","key":"learned：此处读作 /ˈlɜːnɪd/，作形容词，意为“学术性强的、博学的”，不是动词 learn 的过去式。；marvel at：对……感到惊叹。；general-circulation daily：面向普通大众发行的日报。","zh":"今天读到这样的书，人们不免惊叹：其中那些学术性很强的内容，竟曾被认为适合刊登在面向大众发行的日报上。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T1-P3-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared.","core":"We are even farther removed from the unfocused newspaper reviews。","structure":"published in England... 修饰 reviews；at a time 与前面的历史时期同位衔接；when... 修饰 time；in which it appeared 修饰 publications。","key":"unfocused：此处不是“注意力不集中”，而是指评论题材不受严格限制、主题自由。；ornament：本义为“装饰品”；此处比喻能提升刊物品位和吸引力的内容。；be removed from：与……相隔遥远；此处强调时代和阅读经验上的距离。；the turn of the 20th century：19 世纪与 20 世纪之交。","zh":"而我们与另一种传统的距离甚至更远：从 20 世纪之交到第二次世界大战前夕，英国报纸曾刊登主题不受拘束的评论；当时新闻纸便宜得很，文笔优雅的艺术评论被视为给刊物增光添彩的点缀。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T1-P3-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"In those far-off days, it was taken for granted that the critics of major papers would write in detail and at length about the events they covered.","core":"it was taken for granted that the critics would write...。","structure":"it 是形式宾语转化后的形式主语；that... 承载真正内容；they covered 修饰 events。","key":"take it for granted that...：想当然地认为……；把……视为理所当然。；in detail and at length：详尽而充分地。","zh":"在那个久远的年代，人们理所当然地认为，大报评论家会对自己报道的事件作细致而充分的论述。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T1-P3-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Theirs was a serious business, and even those reviewers who wore their learning lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about.","core":"Theirs was a serious business, and reviewers could be trusted。","structure":"Theirs 相当于 Their work；who wore... 修饰 reviewers；like... 举例；to know... 是 be trusted 后的不定式补足语；what... 作 know 的宾语。","key":"business：此处意为“要认真对待的事务、事业”，不是商业买卖。；wear one's learning lightly：字面为“轻松地带着学问”，实际指虽学识渊博却不卖弄。；know what one is about：清楚自己在做什么或谈什么，精通本行。","zh":"评论对他们而言是一项严肃的事业；即便像萧伯纳和欧内斯特·纽曼那样不刻意炫耀学问的评论家，也完全可以让人相信他们深知自己在谈什么。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T1-P3-S05","sec":"text1","sec_label":"Text 1","level":3,"en":"\"So few authors have brains enough or literary gift enough to keep their own end up in journalism,\" Newman wrote, \"that I am tempted to define 'journalism' as 'a term of contempt applied by writers who are not read to writers who are.'\"","core":"So few authors have... that I am tempted to define...。","structure":"so few... that... 表示“如此少……以至于……”；applied by A to B 修饰 a term of contempt；who are not read 和 who are 分别修饰两类作家，末尾省略了 read。","key":"read：此处是被动意义，writers who are read 指“作品有人读的作家”。；keep one's own end up：并非“把自己的一端抬起来”，而是指在竞争或困难中不落下风、站稳脚跟。","zh":"纽曼写道：“有足够才智或文学天赋、能够在新闻写作中站稳脚跟的作家少之又少，以至于我忍不住想把‘新闻业’定义为：那些无人问津的作家用来贬低那些拥有读者的作家的一个词。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T1-P4-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Neville Cardus, who wrote for the *Manchester Guardian* from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of cricket.","core":"Neville Cardus is now known solely as a writer。","structure":"who wrote... 是非限制性定语从句，补充其职业经历；until shortly before... 表示写作一直持续到去世前不久；on the game of cricket 修饰 essays。","key":"见下方词汇笔记","zh":"内维尔·卡杜斯从 1917 年起一直为《曼彻斯特卫报》撰稿，直到 1975 年去世前不久；如今人们只知道他是一位板球随笔作家。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T1-P4-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"During his lifetime, though, he was also one of England's foremost classical-music critics, and a stylist so widely admired that his *Autobiography* (1947) became a best-seller.","core":"he was one of the critics, and a stylist。","structure":"so widely admired that... 是 so...that... 结果结构，修饰 a stylist；though 表示与他今日被遗忘的处境形成转折。","key":"stylist：此处不是“造型师”，而是指文风卓越、善于遣词行文的作家。","zh":"然而在世时，他还是英国最杰出的古典音乐评论家之一，也是一位广受推崇的文体家，就连他 1947 年出版的《自传》都成了畅销书。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T1-P5-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he specialized.","core":"tastes had changed, and readers have little use for the prose。","structure":"long before his death 说明变化很早发生；richly upholstered 修饰 prose；in which he specialized 修饰这种文体。","key":"have little use for：不是“很少用到”，而是“不欣赏、不需要，对……不感兴趣”。；upholstered：本义为“装有软垫的”；此处比喻文字铺陈华丽、修饰繁复。；Vicwardian：由 Victorian 与 Edwardian 合成，指兼具维多利亚时代和爱德华时代特征的风格。","zh":"早在他去世之前，新闻写作的审美趣味就已经改变；后现代读者也不欣赏他所擅长的那种辞藻华美、兼具维多利亚与爱德华时代风格的散文。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T2-P2-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Now the nation's top patent court appears completely ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.","core":"the nation's top patent court appears ready to scale back on business-method patents。","structure":"which... 是非限制性定语从句，补充说明商业方法专利长期存在争议；ever since... 表示争议从十年前持续至今。","key":"scale back on：此处不是按比例缩小物体，而是“削减、收紧、限制”。；the nation's top patent court：指后文的美国联邦巡回上诉法院，而非美国最高法院。","zh":"如今，美国最高级别的专利法院似乎已经做好充分准备，要收紧商业方法专利的授权；这类专利自十年前首次获准以来就一直备受争议。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T2-P2-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"In a move that has intellectual-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.","core":"the U.S. Court of Appeals... said it would use a case to conduct a review。","structure":"In a move... 概括法院举措；that has...abuzz 修饰 move；it would... 是省略 that 的宾语从句。","key":"move：此处意为一项“行动、举措”，不是移动。；abuzz：议论纷纷的，充满兴奋或关注的。","zh":"美国联邦巡回上诉法院表示，将借一宗特定案件对商业方法专利展开全面审查；这一举动已在知识产权律师中引发热议。","tip":"it 指法院；该案是法院重新审视整类专利的载体，不只是普通商业纠纷。"},{"id":"2010-T2-P2-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"It \"has the potential to eliminate an entire class of patents.\"","core":"It has the potential to eliminate an entire class of patents。","structure":"见原句","key":"见下方词汇笔记","zh":"它“有可能使整个这一类别的专利不复存在”。","tip":"It 指比尔斯基案；an entire class 指商业方法专利这一整类专利，体现其可能带来的制度性改变。"},{"id":"2010-T2-P3-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.","core":"Curbs would be a dramatic about-face, because it was the Federal Circuit that introduced such patents。","structure":"it was...that... 是强调句，突出当年正是该法院引入此类专利；with its 1998 decision... 说明方式和时间；approving... 补充该判决的具体内容。","key":"claim：在专利语境中指专利申请中的“权利要求”，这里可概括为商业方法专利申请。；about-face：本义为军事口令“向后转”；此处比喻态度或政策发生 180 度转变。；pool：此处作动词，意为“集中、汇集”资金或资产。；curbs on：对……的限制。","zh":"限制商业方法专利申请将是一次彻底的立场逆转，因为正是联邦巡回上诉法院自己在 1998 年所谓的道富银行案判决中开创了此类专利，当时法院批准了一项汇集共同基金资产的方法专利。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T2-P3-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"That ruling produced an explosion in business-method patent filings, initially by emerging Internet companies trying to stake out exclusive rights to specific types of online transactions.","core":"That ruling produced an explosion in filings。","structure":"initially by... 说明最初申请者；trying to... 修饰 companies，说明其目的；to specific types... 修饰 exclusive rights。","key":"filing：此处指正式提交的专利“申请”，不是普通文件归档。；stake out：本义为划定地界；此处指抢先占据并确立专属权利。","zh":"该判决引发了商业方法专利申请的爆炸式增长；最初提出这些申请的是新兴互联网公司，它们试图抢先取得特定类型在线交易的专有权。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T2-P3-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Later, more established companies raced to add such patents to their files, if only as a defensive move against rivals that might beat them to the punch.","core":"companies raced to add such patents to their files。","structure":"more established 表示经营更成熟；if only as... 补充最低限度的动机；that might... 修饰 rivals。","key":"file：此处指公司持有的专利组合或档案，不是单个文件。；if only：此处意为“哪怕只是”，说明一个最低限度但足够成立的目的。；beat someone to the punch：抢在某人前面行动、先下手为强。","zh":"后来，根基更稳固的公司也争相把此类专利收入自己的专利储备，哪怕只是为了防守，以免竞争对手抢先一步。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T2-P3-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"In 2005, IBM noted in a court filing that it had been issued more than 300 business-method patents, despite the fact that it questioned the legal basis for granting them.","core":"IBM noted that it had been issued more than 300 patents。","structure":"第一个 it 指 IBM；despite the fact that... 表示让步，其中 them 指商业方法专利。","key":"见下方词汇笔记","zh":"2005 年，IBM 在一份法庭文件中指出，尽管它质疑授予商业方法专利的法律依据，自己却已获批 300 多项此类专利。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T2-P4-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The Federal Circuit issued an unusual order stating that the case would be heard by all 12 of the court's judges, rather than a typical panel of three, and that one issue it wants to evaluate is whether it should \"reconsider\" its State Street Bank ruling.","core":"The Federal Circuit issued an unusual order。","structure":"stating 引出命令的两项内容，两个 that 从句并列；第一个从句包含 rather than... 对比；第二个从句中 it wants to evaluate 修饰 one issue，whether... 作表语。","key":"hear a case：法律语境中指“审理案件”，不是单纯听取。；panel：此处指由若干法官组成的合议庭。","zh":"联邦巡回上诉法院发布了一项不同寻常的命令，称该案将由法院全部 12 名法官共同审理，而不是由通常的三人合议庭审理；法院还要评估的一个问题是，是否应当“重新考虑”其在道富银行案中的判决。","tip":"案件尚在由全体法官审理，法院是在考虑是否推翻旧判例，并非已经作出判决或驳回案件。"},{"id":"2010-T2-P5-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"The Federal Circuit's action comes in the wake of a series of recent decisions by the Supreme Court that has narrowed the scope of protections for patent holders.","core":"The Federal Circuit's action comes in the wake of a series of decisions。","structure":"by the Supreme Court 修饰 decisions；that has narrowed... 从语法形式上承接单数中心词 a series，说明这一系列判决的共同效果。","key":"in the wake of：紧随……而来；作为……的结果或后续。；narrow the scope of protections：缩小保护范围。","zh":"在最高法院近期一系列缩小专利权人保护范围的判决之后，联邦巡回上诉法院采取了上述行动。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T2-P5-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Last April, for example, the justices signaled that too many patents were being upheld for \"inventions\" that are obvious.","core":"the justices signaled that too many patents were being upheld。","structure":"that... 作 signaled 的宾语；for \"inventions\" 说明专利所保护的对象；that are obvious 修饰 inventions；引号暗示作者质疑这些东西是否配称为发明。","key":"uphold：法律语境中指法院“维持”原决定或权利的有效性。；obvious：专利法中“显而易见”意味着缺乏足够创新性，通常不应获得专利保护。","zh":"例如，去年 4 月，大法官们发出明确信号：有太多专利仅仅因为一些显而易见的所谓“发明”而获得维持。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T2-P5-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"The judges on the Federal Circuit are \"reacting to the anti-patent trend at the Supreme Court,\" says Harold C. Wegner, a patent attorney and professor at George Washington University Law School.","core":"The judges are reacting to the anti-patent trend, says Harold C. Wegner。","structure":"句末 a patent attorney and professor... 与人名同位，补充其身份；at the Supreme Court 指这一趋势体现在最高法院的判决中。","key":"scale back on：削减、收紧。；have the potential to：有可能……。；a dramatic about-face：彻底的立场逆转。；stake out exclusive rights：抢先确立专有权。","zh":"专利律师、乔治·华盛顿大学法学院教授哈罗德·C·韦格纳说，联邦巡回上诉法院的法官们正在“回应最高法院的反专利趋势”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T3-P1-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"In his book *The Tipping Point*, Malcolm Gladwell argues that \"social epidemics\" are driven in large part by the actions of a tiny minority of special individuals, often called influentials, who are unusually informed, persuasive, or well connected.","core":"Malcolm Gladwell argues that \"social epidemics\" are driven by the actions of individuals。","structure":"that... 是 argues 的宾语从句；often called influentials 是过去分词短语，补充说明 individuals；who... 继续修饰这些特殊人物；三个形容词并列描述其特点。","key":"epidemic：常见义为“流行病”；social epidemics 用疾病传播作比喻，指观念、风尚或行为在社会中的迅速流行。；influential：通常作形容词“有影响力的”；此处名词化，指“意见领袖、有影响力的人”。；in large part：在很大程度上。；well connected：人脉广泛的、社会关系良好的。","zh":"马尔科姆·格拉德威尔在《引爆点》一书中提出，“社会流行潮”在很大程度上由极少数特殊人物的行动所推动；这些人通常被称为“意见领袖”，他们往往信息格外灵通、极具说服力或人脉广泛。","tip":"本句介绍的是格拉德威尔的观点，不等于本文作者最终赞同这一观点。"},{"id":"2010-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"The idea is intuitively compelling, but it doesn't explain how ideas actually spread.","core":"The idea is compelling, but it doesn't explain...。","structure":"见原句","key":"compelling：此处意为“有说服力的、令人信服的”，不是“强迫性的”。","zh":"这一观点从直觉上看很有说服力，却没有解释观念究竟是如何传播的。","tip":"it 指前句“少数意见领袖推动社会流行”的观点。"},{"id":"2010-T3-P2-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"The supposed importance of influentials derives from a plausible-sounding but largely untested theory called the \"two-step flow of communication\": Information flows from the media to the influentials and from them to everyone else.","core":"The supposed importance derives from a theory: Information flows...。","structure":"called... 修饰 theory；冒号后具体解释理论内容；from the media to... and from them to... 是两个并列的传播阶段。","key":"supposed：此处带保留意味，指“所谓的、被认为存在的”，暗示其重要性尚未得到证实。；derive from：源自、来自。；plausible-sounding：听起来似乎合理的。；largely untested：基本未经验证的。","zh":"意见领袖之所以被认为重要，源自一种听起来合理却基本未经检验的理论，即“传播的两级流动”：信息先从媒体流向意见领袖，再由他们传给其他所有人。","tip":"them 指 the influentials；plausible-sounding 不等于已被可靠证据证实，真正落点在 largely untested。"},{"id":"2010-T3-P2-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them.","core":"Marketers have embraced the flow because it suggests that people will do the work。","structure":"because 引导原因状语从句；that... 作 suggests 的宾语；其中 if... 是条件从句，those select people... 是主句。","key":"embrace：常见义为“拥抱”；此处意为“欣然接受、采纳”一种理论。；select：此处作形容词，意为“经过挑选的、少数优选的”。","zh":"营销人员欣然接受了两级传播理论，因为该理论表明，只要他们能找到并影响意见领袖，这些精心选中的人就会替他们完成大部分传播工作。","tip":"营销人员喜欢该理论，只能说明它实用且诱人，不能证明它真实有效。"},{"id":"2010-T3-P2-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"In many such cases, a cursory search for causes finds that some small group of people was wearing, promoting, or developing whatever it is before anyone else paid attention.","core":"a cursory search finds that some group was wearing, promoting, or developing...。","structure":"that... 作 finds 的宾语；三个现在分词并列；whatever it is 作三个动作的共同宾语；before... 表示这群人行动早于大众关注。","key":"cursory：粗略的、走马观花的。；whatever it is：泛指当时讨论的任何流行对象，不必机械译成“无论它是什么”。","zh":"在许多这类案例中，只要粗略追寻一下原因，就会发现早在其他人注意到之前，已有一小群人在穿戴、推广或开发后来走红的东西。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T3-P2-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"Anecdotal evidence of this kind fits nicely with the idea that only certain special people can drive trends.","core":"Anecdotal evidence fits with the idea。","structure":"that... 是 the idea 的同位语从句，说明该观点的内容。","key":"anecdotal evidence：来自个别案例或传闻的证据，通常缺乏系统验证。；fit nicely with：与……看似十分吻合；结合上下文含有“容易迎合该理论但证明力不足”的意味。","zh":"这类个案式证据恰好与“只有某些特殊人物才能推动潮流”的观点吻合。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T3-P3-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"In their recent work, however, some researchers have come up with the finding that influentials have far less impact on social epidemics than is generally supposed.","core":"researchers have come up with the finding。","structure":"that... 是 finding 的同位语从句；than is generally supposed 是比较结构，补足“比通常设想的影响小得多”。","key":"come up with the finding that...：得出……的研究发现。；far less... than...：远不如……。","zh":"然而，一些研究人员在近期研究中发现，意见领袖对社会流行潮的影响远比人们通常认为的要小。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T3-P4-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"The researchers' argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey - whose outsize presence is primarily a function of media, not interpersonal, influence - even the most influential members of a population simply don't interact with that many others.","core":"The argument stems from an observation: even the most influential members don't interact with that many others。","structure":"冒号后给出观察内容；With the exception of... 排除少数媒体名人；两个破折号之间的 whose... 修饰 celebrities；not interpersonal 与 media 对比。","key":"outsize：超常的、格外巨大的。；a function of：此处不是数学“函数”，而是“由……造成的结果、取决于……”。；that many：那么多；that 作程度副词。","zh":"研究人员的论证源于一个关于社会影响力的简单观察：除奥普拉·温弗里等少数名人之外，即便一个群体中最有影响力的人，实际交往的对象也没有那么多；而这些名人影响力格外巨大，主要是媒体作用的结果，并非人际交往影响的结果。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T3-P4-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Yet it is precisely these non-celebrity influentials who, according to the two-step-flow theory, are supposed to drive social epidemics, by influencing their friends and colleagues directly.","core":"it is these non-celebrity influentials who are supposed to drive social epidemics。","structure":"it is...who... 是强调句，突出非名人意见领袖；according to... 是插入语；by influencing... 说明理论设想中的推动方式。","key":"见下方词汇笔记","zh":"然而，按照两级传播理论，恰恰是这些并非名人的意见领袖被认为会直接影响朋友和同事，从而推动社会流行潮。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T3-P4-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"For a social epidemic to occur, however, each person so affected must then influence his or her own acquaintances, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.","core":"each person must influence acquaintances; and how many others pay attention has little to do with the initial influential。","structure":"For a social epidemic to occur 是目的兼条件背景；who... 修饰 acquaintances；theirs 省略重复名词，等于 their own acquaintances；分号后 how many... 是主语从句。","key":"so affected：如此受到影响的；so 回指前句“受非名人意见领袖直接影响”这一方式。；in turn：继而、依次、转而。","zh":"然而，要形成一场社会流行潮，每一个这样受到影响的人随后都必须影响自己的熟人，这些熟人又必须反过来影响他们各自的熟人，如此延续下去；而究竟还有多少人会听取这一传播链中每个人的意见，与最初那位意见领袖并没有多大关系。","tip":"these people 并非只指第一批受意见领袖影响的人，而是指传播链中那些“先受影响、再影响别人”的各层传播者，对应 Q34 的 C 项。"},{"id":"2010-T3-P4-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"If people in the network just two degrees removed from the initial influential prove resistant, for example, the cascade of change won't propagate very far or affect many people.","core":"If people prove resistant, the cascade won't propagate or affect many people。","structure":"in the network 和 two degrees removed... 都修饰 people；propagate 与 affect 并列。","key":"two degrees removed from：与……相隔两层社会关系，而非“被移走两度”。；cascade：本义为“瀑布”；此处指层层传递的连锁变化。；propagate：传播、扩散。","zh":"例如，如果网络中与最初意见领袖仅隔两层关系的人表现出抵触，那么这股变化的连锁浪潮就不会传播很远，也不会影响很多人。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T3-P5-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Building on this basic truth about interpersonal influence, the researchers studied the dynamics of social influence by conducting thousands of computer simulations of populations, manipulating a number of variables relating to people's ability to influence others and their tendency to be influenced.","core":"the researchers studied the dynamics of social influence。","structure":"Building on... 说明研究基础；by conducting... 说明研究方式；manipulating... 表示模拟过程中伴随的变量调整；relating to... 修饰 variables，后接两个并列对象 ability 和 tendency。","key":"build on：在……基础上进一步发展或研究。；manipulate variables：在实验中有控制地调整变量，不含“暗中操纵”的贬义。","zh":"基于这一人际影响的基本事实，研究人员进行了数千次群体计算机模拟，通过调整与人们影响他人的能力及其受他人影响倾向有关的多项变量，研究社会影响力的动态机制。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T3-P5-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"They found that the principal requirement for what is called \"global cascades\" - the widespread propagation of influence through networks - is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.","core":"They found that the principal requirement is the presence of a critical mass。","structure":"that... 是宾语从句；for what is called... 修饰 requirement，其中 what 表示“所谓的事物”；两个破折号之间解释 global cascades；not of A but, rather, of B 修饰 presence，突出真正需要的是 B。","key":"critical mass：本义为核反应的“临界质量”；此处指足以触发大规模连锁传播的最低必要人数。；in large part：在很大程度上。；intuitively compelling：直觉上很有说服力。；derive from：源自。","zh":"他们发现，形成所谓“全球级联效应”也就是影响力在网络中广泛传播的首要条件，并不是存在少数意见领袖，而是要有达到临界数量的大批容易受影响的人。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T4-P1-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Their rules, moan the banks, have forced them to report enormous losses, and it's just not fair.","core":"Their rules have forced them to report enormous losses, and it is not fair。","structure":"moan the banks 是倒装的插入性引语，相当于 the banks complain；Their 指准则制定者，them 指银行。","key":"moan：本义为“呻吟”；此处指带有不满地“抱怨”。","zh":"银行抱怨说，这些机构的规则迫使它们报告巨额亏损，这实在不公平。","tip":"这是银行的抱怨，不代表作者认同“不公平”的判断。"},{"id":"2010-T4-P1-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to fetch.","core":"These rules say they must value some assets at the price, not the price。","structure":"两个 price 后都省略关系词，分别由 a third party would pay 和 managers and regulators would like them to fetch 修饰；not 构成实际市场价与管理层期望价的对比。","key":"say：此处主语是规则，意为“规定、要求”。；fetch：常见义为“取来”；用于价格时意为“售得、卖得某一价格”。","zh":"这些规则要求银行按照第三方实际愿意支付的价格为部分资产估值，而不能按照管理者和监管者希望这些资产卖到的价格估值。","tip":"they 指银行，them 指部分资产；规则的核心是按第三方愿付的市场价格估值。"},{"id":"2010-T4-P2-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.","core":"The details may be unknowable, but the independence is being compromised。","structure":"essential to... 是插入性的形容词短语，补充说明 independence 的重要性。","key":"compromise：常见义为“妥协”；此处作被动，意为“受到损害、被削弱”。","zh":"具体内情或许无从得知，但准则制定者的独立性正在受损，而这种独立性对于资本市场正常运行至关重要。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T4-P2-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"And, unless banks carry toxic assets at prices that attract buyers, reviving the banking system will be difficult.","core":"unless banks carry assets at prices, reviving the banking system will be difficult。","structure":"unless 引导必要条件；that attract buyers 修饰 prices；动名词短语 reviving... 作主语。","key":"carry：常见义为“携带”；会计语境中指以某一价值在账面上“列示、计列”资产。；toxic asset：有毒资产，指价值大幅缩水、难以出售且风险很高的资产。","zh":"而且，除非银行按足以吸引买家的价格在账面上计列有毒资产，否则银行体系将很难恢复运转。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T4-P3-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"These gave banks more freedom to use models to value illiquid assets and more flexibility in recognizing losses on long-term assets in their income statements.","core":"These gave banks more freedom and more flexibility。","structure":"These 指规则修改；两个并列宾语分别由 to use... 和 in recognizing... 具体说明；in their income statements 修饰损失确认。","key":"illiquid asset：流动性不足、难以迅速按合理价格出售的资产。；recognize losses：会计语境中指在报表中“确认损失”。","zh":"这些修改让银行在使用模型评估非流动资产价值时拥有更大自由，也让它们在利润表中确认长期资产损失时拥有更大灵活性。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T4-P3-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"Yet bank shares rose and the changes enhance what one lobbying group politely calls \"the use of judgment by management.\"","core":"bank shares rose and the changes enhance what one group calls...。","structure":"what...calls... 是宾语从句，等于“该团体所称的东西”；Yet 将主席对动机受质疑的抗议与规则明显有利于银行的结果对照。","key":"judgment：此处指管理层在资产估值和损失确认上的主观裁量。；politely calls：字面是“礼貌地称为”，实际暗示这是一种粉饰性、委婉的说法。","zh":"然而，银行股价随之上涨，而且这些修改强化了某游说团体委婉所称的“管理层判断的运用”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T4-P4-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"European ministers instantly demanded that the International Accounting Standards Board (IASB) do likewise.","core":"见结构","structure":"demand that...do... 中从句使用动词原形 do，是表示要求的虚拟语气。","key":"do likewise：照样做、采取同样措施，此处指仿照美国放宽会计规则。","zh":"欧洲各国部长随即要求国际会计准则理事会也采取同样行动。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T4-P4-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"The IASB says it does not want to act without overall planning, but the pressure to fold when it completes its reconstruction of rules later this year is strong.","core":"The IASB says..., but the pressure is strong。","structure":"it does not want... 是省略 that 的宾语从句；to fold 修饰 pressure；when... 说明压力可能迫使其让步的时间。","key":"fold：常见义为“折叠”；此处指在压力下“屈服、让步”。；reconstruction of rules：对规则体系的重构，而非建筑物重建。","zh":"国际会计准则理事会表示，它不愿在缺乏整体规划的情况下贸然行动；但当它在今年晚些时候完成规则重构时，迫使它屈服的压力将十分强大。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T4-P4-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Charlie McCreevy, a European commissioner, warned the IASB that it did \"not live in a political vacuum\" but \"in the real world\" and that Europe could yet develop different rules.","core":"Charlie McCreevy warned the IASB that it did not live... and that Europe could develop different rules。","structure":"两个 that 从句并列，都是 warned 的内容；第一个从句内 not...but... 对比政治真空与现实世界；a European commissioner 与人名同位。","key":"vacuum：本义为“真空”；political vacuum 指不受政治环境和压力影响的状态。；yet：此处意为“仍然、到头来仍有可能”，不是转折连词。","zh":"欧盟委员查理·麦克里维警告国际会计准则理事会，它并非“生活在政治真空中”，而是“身处现实世界”，并称欧洲仍可能另行制定不同的规则。","tip":"警告和另立规则的威胁表明，麦克里维反对 IASB 独立按照自己的程序与判断制定规则，对应 Q38 的“act on their own in rule-setting”。"},{"id":"2010-T4-P5-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"It was banks that were on the wrong planet, with accounts that vastly overvalued assets.","core":"It was banks that were on the wrong planet。","structure":"It was...that... 是强调句，突出真正脱离现实的是银行；with accounts... 说明判断依据；that... 修饰 accounts。","key":"on the wrong planet：字面为“在错误的星球上”，此处讽刺银行脱离市场现实。；account：此处指银行账目或财务报表，不是普通“账户”。","zh":"真正脱离现实的恰恰是银行，因为它们的账目严重高估了资产价值。","tip":"overvalued assets 指账面价值高于真实价值，对应“夸大资产的实际价值”。"},{"id":"2010-T4-P5-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Today they argue that market prices overstate losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts.","core":"they argue that market prices overstate losses。","structure":"because... 给出银行的理由；其中 they 指 market prices；not... 与 the temporary illiquidity 对比。","key":"见下方词汇笔记","zh":"如今银行辩称，市场价格夸大了损失，因为这些价格主要反映市场暂时缺乏流动性，而非坏账最终可能达到的规模。","tip":"整句仍是在转述银行立场，作者下一句说真相多年后才会知道，并未直接接受这一辩护。"},{"id":"2010-T4-P5-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"But banks' shares trade below their book value, suggesting that investors are skeptical.","core":"banks' shares trade below their book value。","structure":"suggesting... 是现在分词短语，说明低于账面价值这一市场现象传递出的信号。","key":"book value：账面价值，即资产负债表所记录的净资产价值，不是“书的价值”。","zh":"但银行股票的交易价格低于每股账面价值，这表明投资者对此持怀疑态度。","tip":"投资者怀疑的正是银行账面资产估值及其关于损失被夸大的说法。"},{"id":"2010-T4-P5-S05","sec":"text4","sec_label":"Text 4","level":3,"en":"And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are reluctant to buy all those supposed bargains.","core":"dead markets reflect the paralysis of banks。","structure":"which... 修饰 banks；will not sell... 与 are reluctant to buy... 由 yet 连接，构成矛盾；for fear of... 说明不卖的原因。","key":"dead market：交易活动几乎停滞、缺乏流动性的市场。；book a loss：把损失记入账目、确认损失。；bargain：此处指价格低廉、值得买入的资产。","zh":"而市场交易停滞，部分原因正是银行陷入瘫痪：它们害怕在账面上确认损失而不肯出售资产，却又不愿买入那些据称十分便宜的资产。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T4-P6-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"To get the system working again, losses must be recognized and dealt with.","core":"losses must be recognized and dealt with。","structure":"To get the system working again 是目的状语；get + 宾语 + 现在分词 表示使体系恢复运行。","key":"见下方词汇笔记","zh":"要让这一体系重新运转，就必须确认并处理损失。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T4-P6-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"America's new plan to buy up toxic assets will not work unless banks mark assets to levels which buyers find attractive.","core":"The plan will not work unless banks mark assets to levels。","structure":"to buy up... 修饰 plan；unless 引导必要条件；which buyers find attractive 修饰 levels，其中 attractive 是宾语补足语。","key":"mark assets to levels：按某一价位重新标记或计量资产价值，语境中指将账面估值调整到市场可接受水平。；buy up：大量收购、全部或集中买入。","zh":"除非银行把资产减记到买家认为有吸引力的价位，否则美国收购有毒资产的新计划不会奏效。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2010-T4-P6-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"The FASB and IASB have been exactly that, cleaning up rules on stock options and pensions, for example, against hostility from special interests.","core":"The FASB and IASB have been exactly that。","structure":"that 指前句“独立甚至敢于抗争的准则制定者”；cleaning up... 补充其具体作为；against hostility... 表示在利益集团敌视下仍坚持行动。","key":"special interests：特殊利益集团，即试图让政策服务于自身利益的组织或行业力量。；clean up rules：清理、整顿和完善规则。","zh":"美国财务会计准则委员会和国际会计准则理事会一直正是这样的机构；例如，它们曾顶住特殊利益集团的敌意，整顿有关股票期权和养老金的规则。","tip":"作者在肯定两机构过去维护独立性的表现，为判断其态度提供直接依据。"},{"id":"2010-T4-P6-S05","sec":"text4","sec_label":"Text 4","level":3,"en":"But by giving in to critics now they are inviting pressure to make more concessions.","core":"they are inviting pressure。","structure":"by giving in... 说明招致压力的方式；to make more concessions 修饰 pressure，说明压力将迫使其继续让步。","key":"give in to：向……屈服、让步。；make concessions：作出让步。；behind the scenes：在幕后。；take aim at：把批评矛头对准。","zh":"但如今它们一旦向批评者让步，就等于招致更多压力，迫使自己作出更多妥协。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"}]};</script>

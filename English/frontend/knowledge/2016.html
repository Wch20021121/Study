them,\" he said, \"but if you discontinue it, you're going to have your most loyal customers really u","note":"停止提供或经营某项产品、服务。","forms":["discontinue"]},{"w":"accelerate the transition","pos":"phr.","cn":"加快转型。","sec":"text4","sec_label":"Text 4","ctx":"\"Figuring out a way to accelerate that transition would make sense for them,\" he said, \"but if you discontinue it, you're going to have your most loyal customers really u","note":"加快转型。","forms":["accelerate the transition"]},{"w":"have sb. upset with you","pos":"phr.","cn":"使某人对你不满。","sec":"text4","sec_label":"Text 4","ctx":"\"Figuring out a way to accelerate that transition would make sense for them,\" he said, \"but if you discontinue it, you're going to have your most loyal customers really u","note":"使某人对你不满。","forms":["have sb. upset with you"]},{"w":"give the example of","pos":"phr.","cn":"举……为例。","sec":"text4","sec_label":"Text 4","ctx":"Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming.","note":"举……为例。","forms":["give the example of"]},{"w":"DVD-mailing service","pos":"phr.","cn":"DVD 邮寄租赁服务。","sec":"text4","sec_label":"Text 4","ctx":"Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming.","note":"DVD 邮寄租赁服务。","forms":["DVD-mailing service"]},{"w":"focus on streaming","pos":"phr.","cn":"专注于流媒体业务。","sec":"text4","sec_label":"Text 4","ctx":"Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming.","note":"专注于流媒体业务。","forms":["focus on streaming"]},{"w":"blunder","pos":"词","cn":"因判断不当造成的严重错误。","sec":"text4","sec_label":"Text 4","ctx":"\"It was seen as a blunder,\" he said.","note":"因判断不当造成的严重错误。","forms":["blunder"]},{"w":"turn out to be","pos":"phr.","cn":"结果证明是……。","sec":"text4","sec_label":"Text 4","ctx":"The move turned out to be foresighted.","note":"结果证明是……。","forms":["turn out to be"]},{"w":"foresighted","pos":"v./adj.","cn":"有先见之明的、有远见的。","sec":"text4","sec_label":"Text 4","ctx":"The move turned out to be foresighted.","note":"有先见之明的、有远见的。","forms":["foresighted"]},{"w":"be in charge at","pos":"phr.","cn":"在某机构负责、掌管该机构。","sec":"text4","sec_label":"Text 4","ctx":"And if Peretti were in charge at the Times?","note":"在某机构负责、掌管该机构。","forms":["be in charge at"]},{"w":"pick a year","pos":"phr.","cn":"选定一个明确年份作为时间节点。","sec":"text4","sec_label":"Text 4","ctx":"\"I wouldn't pick a year to end print,\" he said.","note":"选定一个明确年份作为时间节点。","forms":["pick a year"]},{"w":"legacy product","pos":"phr.","cn":"由旧有业务延续下来的传统产品；这里指不再服务大众市场，而面向仍珍视纸质版的核心老用户的高价产品。","sec":"text4","sec_label":"Text 4","ctx":"\"I would raise prices and make it into more of a legacy product.\"","note":"由旧有业务延续下来的传统产品；这里指不再服务大众市场，而面向仍珍视纸质版的核心老用户的高价产品。","forms":["legacy product"]},{"w":"more of","pos":"phr.","cn":"更接近、更像某类事物。","sec":"text4","sec_label":"Text 4","ctx":"\"I would raise prices and make it into more of a legacy product.\"","note":"更接近、更像某类事物。","forms":["more of"]},{"w":"the idea goes","pos":"phr.","cn":"插入语，意为“这一设想认为、按这一思路来说”。","sec":"text4","sec_label":"Text 4","ctx":"The most loyal customers would still get the product they favor, the idea goes, and they'd feel like they were helping sustain the quality of something they believe in.","note":"插入语，意为“这一设想认为、按这一思路来说”。","forms":["the idea goes"]},{"w":"sustain","pos":"词","cn":"维持某事物的存续或品质。","sec":"text4","sec_label":"Text 4","ctx":"The most loyal customers would still get the product they favor, the idea goes, and they'd feel like they were helping sustain the quality of something they believe in.","note":"维持某事物的存续或品质。","forms":["sustain"]},{"w":"overpay for","pos":"phr.","cn":"为某物支付高于常规价值或替代方案的价格。","sec":"text4","sec_label":"Text 4","ctx":"\"So if you're overpaying for print, you could feel like you were helping,\" Peretti said.","note":"为某物支付高于常规价值或替代方案的价格。","forms":["overpay for"]},{"w":"at a higher rate","pos":"phr.","cn":"以更高的比率或幅度。","sec":"text4","sec_label":"Text 4","ctx":"\"Then increase it at a higher rate each year and essentially try to generate additional revenue.\"","note":"以更高的比率或幅度。","forms":["at a higher rate"]},{"w":"generate additional revenue","pos":"phr.","cn":"创造额外收入。","sec":"text4","sec_label":"Text 4","ctx":"\"Then increase it at a higher rate each year and essentially try to generate additional revenue.\"","note":"创造额外收入。","forms":["generate additional revenue"]},{"w":"be obsessed with","pos":"phr.","cn":"对某事物极度着迷；此处指对纸质报纸有强烈忠诚和偏好。","sec":"text4","sec_label":"Text 4","ctx":"In other words, if you're going to make a print product, make it for the people who are already obsessed with it.","note":"对某事物极度着迷；此处指对纸质报纸有强烈忠诚和偏好。","forms":["be obsessed with"]},{"w":"digital-only subscription","pos":"phr.","cn":"纯数字版订阅。","sec":"text4","sec_label":"Text 4","ctx":"Getting the print edition seven days a week costs nearly $500 a year - more than twice as much as a digital-only subscription.","note":"纯数字版订阅。","forms":["digital-only subscription"]},{"w":"more than twice as much as","pos":"phr.","cn":"是……的两倍多。","sec":"text4","sec_label":"Text 4","ctx":"Getting the print edition seven days a week costs nearly $500 a year - more than twice as much as a digital-only subscription.","note":"是……的两倍多。","forms":["more than twice as much as"]},{"w":"luxury","pos":"词","cn":"此处不是物质“奢侈品”，而是他人难以拥有的有利条件。","sec":"text4","sec_label":"Text 4","ctx":"\"It's a really hard thing to do and it's a tremendous luxury that BuzzFeed doesn't have a legacy business,\" Peretti remarked.","note":"此处不是物质“奢侈品”，而是他人难以拥有的有利条件。","forms":["luxury"]},{"w":"legacy business","pos":"phr.","cn":"从旧时代延续下来的传统业务，通常伴随既有成本和忠实客户牵制。","sec":"text4","sec_label":"Text 4","ctx":"\"It's a really hard thing to do and it's a tremendous luxury that BuzzFeed doesn't have a legacy business,\" Peretti remarked.","note":"从旧时代延续下来的传统业务，通常伴随既有成本和忠实客户牵制。","forms":["legacy business"]},{"w":"make sense","pos":"phr.","cn":"合乎情理、在商业上仍然说得通。","sec":"text4","sec_label":"Text 4","ctx":"\"But we're going to have questions like that where we have things we're doing that don't make sense when the market changes and the world changes.","note":"合乎情理、在商业上仍然说得通。","forms":["make sense"]},{"w":"aggressive","pos":"adj.","cn":"此处不是“好斗的、攻击性的”，而是商业决策上积极、果断、敢于推进改变的。","sec":"text4","sec_label":"Text 4","ctx":"In those situations, it's better to be more aggressive than less aggressive.\"","note":"此处不是“好斗的、攻击性的”，而是商业决策上积极、果断、敢于推进改变的。","forms":["aggressive"]}],"sentences":[{"id":"2016-T1-P1-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"France, which prides itself as the global innovator of fashion, has decided its fashion industry has lost an absolute right to define physical beauty for women.","core":"France has decided (that) its fashion industry has lost an absolute right.","structure":"which prides itself as ... 是非限制性定语从句，补充法国一贯的自我定位；to define ... 是不定式，修饰 right；for women 限定被定义的是女性之美。","key":"decide：常见义为“决定做某事”；此处意为“认定、作出判断”，后接省略了 that 的宾语从句。；pride oneself as：以某种身份自豪或自居。；an absolute right to do：做某事的绝对权利。","zh":"法国一向以全球时尚创新者自居，如今却认定本国时尚业已经失去了定义女性形体美的绝对权利。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T1-P1-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Its lawmakers gave preliminary approval last week to a law that would make it a crime to employ ultra-thin models on runways.","core":"Its lawmakers gave preliminary approval to a law.","structure":"that would make it a crime ... 是定语从句，说明法案内容；其中 it 是形式宾语，真正的宾语是 to employ ...。","key":"give preliminary approval to：初步批准；说明法案尚未完成全部立法程序。；make it a crime to do：将某种行为定为犯罪。；runway：此处指“时装秀台、T 台”，不是机场跑道。","zh":"法国立法者上周初步通过了一项法案，该法案将把在时装秀台上雇用过度消瘦模特的行为定为犯罪。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T1-P1-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"The parliament also agreed to ban websites that \"incite excessive thinness\" by promoting extreme dieting.","core":"The parliament agreed to ban websites.","structure":"that ... 是定语从句，限定被禁的网站；by promoting ... 是方式状语，说明这些网站如何助长过度消瘦。","key":"incite excessive thinness：煽动或助长对过度消瘦的追求。；extreme dieting：极端节食。","zh":"议会还同意取缔那些通过鼓吹极端节食来“煽动人们过度追求消瘦”的网站。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T1-P2-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"They suggest beauty should not be defined by looks that end up impinging on health.","core":"They suggest (that) beauty should not be defined by looks.","structure":"that end up impinging on health 是定语从句，修饰 looks；suggest 后省略连接词 that。","key":"end up doing：最终落得某种结果。；impinge on：对某事物产生不利影响，侵害或损害某事物。","zh":"这些措施表明，美不应由那些最终会损害健康的外貌标准来界定。","tip":"impinge on 在此强调外貌标准“损害”健康，与 doing harm to 同义，不是描述健康状况。"},{"id":"2016-T1-P2-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"And the ban on ultra-thin models seems to go beyond protecting models from starving themselves to death - as some have done.","core":"The ban seems to go beyond protecting models.","structure":"from starving themselves to death 补充说明保护模特免于何种后果；破折号后的 as some have done 是方式比较，其中 done 代替前面的 starved themselves to death。","key":"go beyond doing：超越某一直接目的，不仅仅是做某事。；protect sb. from doing：保护某人，使其免于某种伤害性行为或结果。；starve oneself to death：把自己活活饿死。","zh":"而且，禁止使用过度消瘦的模特，其意义似乎不只是保护模特，使她们免于像某些同行那样因自我节食而饿死。","tip":"as some have done 中的 some 指已有模特，不能泛指所有女性。"},{"id":"2016-T1-P2-S05","sec":"text1","sec_label":"Text 1","level":3,"en":"It tells the fashion industry that it must take responsibility for the signal it sends women, especially teenage girls, about the social tape-measure they must use to determine their individual worth.","core":"It tells the fashion industry that it must take responsibility for the signal.","structure":"第一个 It 指禁止使用过瘦模特这一措施；that 引导 tells 的宾语从句，其中第二个 it 指时尚业；it sends women 是省略关系代词的定语从句，修饰 signal；they must use ... 修饰 social tape-measure。","key":"tell：常见义为“告诉”；此处带有规诫意味，意为“明确告诫、传达要求”。；tape-measure：本义为“卷尺”；此处是比喻，指社会用来评判女性价值的外貌尺度。；take responsibility for：为某事承担责任。；determine one's individual worth：判定一个人的自身价值。","zh":"这项禁令是在告诫时尚业：它必须为自己向女性，尤其是少女，传递的那种社会衡量标准负责，因为女性会被暗示用这种标准判断自身的个人价值。","tip":"about ... 说明信号的内容，而非修饰 women；最后的 they 指女性，尤其是少女。"},{"id":"2016-T1-P3-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"The bans, if fully enforced, would suggest to women (and many men) that they should not let others be arbiters of their beauty.","core":"The bans would suggest to women that ...","structure":"if fully enforced 是省略了 they are 的条件状语从句；that 引导所传达观念的具体内容；其中 they 指前面的 women (and many men)。","key":"arbiter：常见义为争议的“仲裁者”；此处指有权决定他人美丑标准的“评判者”。；fully enforce a ban：全面执行禁令。；let sb. be arbiters of ...：让某人成为某事的评判者。","zh":"这些禁令若得到充分执行，就会向女性（以及许多男性）传达一个观念：不应让别人充当自己美丑的裁判。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T1-P3-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"And perhaps faintly, they hint that people should look to intangible qualities like character and intellect rather than dieting their way to size zero or wasp-waist physiques.","core":"They hint that people should look to intangible qualities rather than dieting ...","structure":"they 指上一句的 The bans；that 引导宾语从句；rather than 连接被提倡的内在品质与被否定的极端节食行为。","key":"look to：常见义为“看向”；此处意为“关注、重视，并以之作为依据”。；diet one's way to：不是普通的“节食”，而是“通过持续节食使自己达到某种身材”。；intangible qualities：无形的内在品质。；size zero：零号女装尺码，文中代指极瘦身材。","zh":"这些禁令或许还隐约暗示，人们应当看重品格、才智等无形品质，而不是靠节食把自己变成零号身材或蜂腰体形。","tip":"faintly 修饰 hint，表示这种更深层的信息只是“隐约”传达出来，并非禁令能够直接实现的效果。"},{"id":"2016-T1-P4-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"The French measures, however, rely too much on severe punishment to change a culture that still regards beauty as skin-deep - and bone-showing.","core":"The French measures rely too much on severe punishment.","structure":"however 表示从肯定动机转向批评手段；to change ... 是目的状语；that still regards ... 是定语从句，修饰 a culture。","key":"skin-deep：本义为“只有皮肤那么深”；此处指“肤浅的、只看外表的”。；bone-showing：文中仿照 skin-deep 构造的表达，指瘦到骨骼显露，并以此为美。；rely too much on：过度依赖。；regard A as B：把 A 看作 B。","zh":"然而，法国的措施过度依赖严厉惩罚，试图借此改变一种仍把美看成只关乎皮相，甚至以瘦到骨头凸显为美的文化。","tip":"skin-deep - and bone-showing 带有讽刺意味，不能仅按“皮肤和骨骼外露”机械翻译。"},{"id":"2016-T1-P4-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Under the law, using a fashion model that does not meet a government-defined index of body mass could result in a $85,000 fine and six months in prison.","core":"Using a fashion model could result in a fine and prison.","structure":"动名词短语 using ... 作主语；that does not meet ... 是定语从句，限定何种模特；a $85,000 fine 与 six months in prison 是并列后果。","key":"government-defined：由政府规定的。；index of body mass：体重指数，即通常所说的 BMI。；result in：导致、招致某种结果。","zh":"根据该法，使用未达到政府规定体重指数的时装模特，可能招致 8.5 万美元罚款和六个月监禁。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T1-P5-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.","core":"The fashion industry knows (that) it has an inherent problem.","structure":"knows 后省略了宾语从句连接词 that；in focusing on ... 说明问题具体存在于何处。","key":"inherent：内在固有的、生来就有的。；material adornment：外在的物质装饰。；idealized body types：经过理想化、脱离普通现实的体形标准。；have a problem in doing：在做某事方面存在问题。","zh":"时尚业清楚，自己一味关注外在装饰和理想化体形，本身就存在一个内生的固有问题。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T1-P5-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforcement.","core":"It is trying to set voluntary standards.","structure":"it 指 the fashion industry；for models and fashion images 说明标准适用对象；that rely more on peer pressure ... 修饰 standards，for enforcement 表示同行压力的用途。","key":"voluntary standards：不是可以随意忽略的“志愿标准”，而是行业自愿制定并遵守、区别于法律强制的规范。；peer pressure：此处不是青少年语境中的“同伴压力”，而是行业成员之间促使彼此合规的压力。","zh":"在丹麦、美国和其他少数国家，时尚业正尝试为模特和时尚图像制定自愿性标准，而这些标准更多依靠同行压力来落实。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T1-P6-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"In contrast to France's actions, Denmark's fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.","core":"Denmark's fashion industry agreed on rules and sanctions.","structure":"句首介词短语明确对比对象；regarding ... 修饰 rules and sanctions，说明规范涉及的方面。","key":"in contrast to：与某事形成对照。；agree on：就某项方案或规则达成一致。；sanction：此处作名词，意为“处罚、惩戒措施”，不是“批准”。","zh":"与法国的做法不同，丹麦时尚业上月就有关模特年龄、健康状况及其他特征的规则和惩戒措施达成了一致。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T1-P6-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"The newly revised Danish Fashion Ethical Charter clearly states: \"We are aware of and take responsibility for the impact the fashion industry has on body ideals, especially on young people.\"","core":"引语主干为 We are aware of and take responsibility for the impact.","structure":"be aware of 与 take responsibility for 共享宾语 the impact；the fashion industry has on body ideals 是省略关系代词的定语从句；especially on young people 进一步突出受影响最明显的群体。","key":"be aware of：意识到、清楚知道。；take responsibility for：为某种影响承担责任。；body ideals：社会所推崇的理想体形观念。","zh":"新近修订的《丹麦时尚伦理宪章》明确写道：“我们意识到时尚业会影响人们的理想身材观，尤其会影响年轻人，并愿为此承担责任。”","tip":"on body ideals 说明影响落在“理想体形观念”上，on young people 则转而指出这种观念影响的重点人群。"},{"id":"2016-T1-P6-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"The charter's main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.","core":"The charter's main tool is to deny access.","structure":"不定式 to deny ... 作表语，解释具体执行手段；for designers and modeling agencies 指被拒绝者；to Copenhagen Fashion Week 指被拒绝进入的活动；which ... 修饰 CFW。","key":"access：此处不是网络或文件的“访问权限”，而是进入、参加哥本哈根时装周的资格。；tool of enforcement：促使规则得到执行的手段。；deny access for sb. to sth.：拒绝给予某人进入或参加某事的资格。；modeling agency：模特经纪公司。","zh":"该宪章的主要执行手段，是禁止相关设计师和模特经纪公司参加由丹麦时尚协会主办的哥本哈根时装周（CFW）。","tip":"拒绝资格的依据来自上一句所说的年龄、健康等规则；Q24 应把“几乎不关注健康因素”与违反规则联系起来。"},{"id":"2016-T1-P6-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"But in general it relies on a name-and-shame method of compliance.","core":"It relies on a name-and-shame method.","structure":"it 指《丹麦时尚伦理宪章》；of compliance 表示这一方法旨在促成合规。","key":"compliance：此处意为“遵守规则、合规”，不是一般意义上的“顺从”。；name-and-shame：公开点名并使违规者承受声誉压力。","zh":"不过总体而言，该宪章依赖的是点名曝光、使违规者蒙羞的办法来促使行业守规。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T1-P7-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Relying on ethical persuasion rather than law to address the misuse of body ideals may be the best step.","core":"Relying on ethical persuasion may be the best step.","structure":"动名词短语作主语；rather than law 与 ethical persuasion 构成手段对比；to address ... 说明这一步的目的。","key":"ethical persuasion：道德劝导，即借助伦理共识和声誉压力改变行为。；rather than：而不是，用于突出作者偏好的手段。；address the misuse of：处理、纠正对某事物的滥用。","zh":"要纠正对理想体形观念的滥用，依靠道德劝导而非法律或许是最佳一步。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T1-P7-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Even better would be to help elevate notions of beauty beyond the material standards of a particular industry.","core":"To help elevate notions of beauty would be even better.","structure":"原句把表语 Even better 前置，形成倒装；真正说明“更好做法”的是不定式短语 to help elevate ...；beyond ... 表示审美观需要超越的界限。","key":"elevate：常见义为“抬高”；此处意为“提升、升华”，使审美观摆脱狭窄层次。；notions of beauty：关于美的观念。；beyond the material standards：超越外在物质标准。；pride oneself as：以某种身份自居。","zh":"更理想的做法，是帮助人们提升对美的认识，使其超越某一个行业所设定的外在物质标准。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P1-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"In Britain this has had a curious result.","core":"This has had a curious result.","structure":"见原句","key":"curious：此处不是“好奇的”，而是“奇特的、耐人寻味的”。","zh":"在英国，这一变化带来了一个耐人寻味的结果。","tip":"this 指上一句所述“城镇人口首次超过乡村人口”这一社会变化。"},{"id":"2016-T2-P1-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"While polls show Britons rate \"the countryside\" alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country, this has limited political support.","core":"This has limited political support.","structure":"While 引导让步状语从句；从句内部是 polls show + 宾语从句；rate A alongside B as C 意为“把 A 与 B 并列视为 C”；what makes them proudest ... 是 as 的宾语，其中 what 同时充当从句主语。","key":"rate：常见义为“比率、速度”；此处作动词，意为“评价、把……视为”。；alongside：与……并列、同等看待。；have limited political support：得到的政治支持有限。","zh":"尽管民调显示，英国人把“乡村”与王室、莎士比亚和国民医疗服务体系并列，视为最令他们为祖国自豪的事物，但这种乡村情结得到的政治支持却很有限。","tip":"主句的 this 指公众对乡村的珍视，而不是王室、莎士比亚或 NHS 中的任何一个单项。"},{"id":"2016-T2-P2-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save \"the beauty of natural places for everyone forever.\"","core":"Octavia Hill launched the National Trust.","structure":"not to rescue ... but to save ... 是平行的不定式结构，否定一个创立目的并突出真正目的。","key":"launch：常见义为“发射”；此处意为“发起、创立”一个组织。；stylish houses：结合国民信托组织语境，指有风格、气派的历史宅邸，并非普通的“时髦住宅”。","zh":"一个世纪前，奥克塔维娅·希尔创立英国国民信托组织，并不是为了抢救华美宅邸，而是为了“让自然之地的美永远为所有人保存下来”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P2-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"It was specifically to provide city dwellers with spaces for leisure where they could experience \"a refreshing air.\"","core":"It was to provide city dwellers with spaces.","structure":"It 指创立国民信托组织这件事或其宗旨；不定式作表语；where ... 是定语从句，修饰 spaces for leisure。","key":"city dweller：城市居民。；provide sb. with sth.：向某人提供某物。；spaces for leisure：休闲空间。","zh":"它的明确目的，是为城市居民提供休闲空间，让他们能在那里感受“清新的空气”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P2-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"They don't make countryside any more, and every year concrete consumes more of it.","core":"They don't make countryside, and concrete consumes more of it.","structure":"They 是泛指用法，相当于“人们、社会”；it 指 countryside；两个并列分句构成“无法补充，却持续流失”的对照。","key":"make：此处不是普通的“制造”，而是强调乡村土地是不可新增、不可再生的资源。；concrete consumes：拟人化表达，字面为“混凝土吞噬”，实际指建设开发不断侵占乡村土地。","zh":"乡村土地无法再造，而每年都有更多乡野被混凝土蚕食。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P3-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The Conservatives' planning reform explicitly gives rural development priority over conservation, even authorising \"off-plan\" building where local people might object.","core":"The planning reform gives rural development priority over conservation.","structure":"even authorising ... 是现在分词短语，补充说明改革偏向开发的具体表现；where local people might object 是地点状语从句。","key":"off-plan building：在本文的土地规划语境中，指脱离或绕开地方既定规划的建设，并非房地产销售中的“楼花”。；give A priority over B：赋予 A 高于 B 的优先地位。；authorise doing：授权、准许做某事。","zh":"保守党的规划改革明确把乡村开发置于保护之上，甚至允许在当地居民可能反对的地方进行规划之外的建设。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P3-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"Labour likewise wants to discontinue local planning where councils oppose development.","core":"Labour wants to discontinue local planning.","structure":"where councils oppose development 表示在何种地方或情形下停止地方规划。","key":"discontinue local planning：结合语境，指停止或架空地方层面的规划程序，而不是停止所有建设规划。","zh":"同样，凡地方议会反对开发之处，工党也想中止当地的规划自主权。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P3-S06","sec":"text2","sec_label":"Text 2","level":3,"en":"Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land.","core":"Only Ukip has sided with those.","structure":"sensing its chance 是现在分词短语，补充说明英国独立党支持保护派的政治动机；pleading for ... 修饰 those。","key":"considered：常见义为“被认为的”；此处作形容词，意为“经过深思熟虑的、审慎的”。；sense one's chance：意识到机会来临。；side with：站在……一边，支持……。；plead for：恳切呼吁、主张。","zh":"只有英国独立党嗅到了机会，转而支持那些呼吁以更审慎方式使用绿地的人。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P4-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"The sensible place to build new houses, factories and offices is where people are, in cities and towns where infrastructure is in place.","core":"The sensible place is where people are.","structure":"to build ... 修饰 place；where people are 是表语从句；后面的 in cities and towns 是对该地点的具体说明；第二个 where 引导定语从句，修饰 cities and towns。","key":"in place：此处意为“已经具备、已经就位”，不是简单的“在某个地方”。","zh":"兴建新住宅、工厂和办公楼的合理地点，应是人口已经聚集、基础设施已经就位的城市和城镇。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P4-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The London agents Stirling Ackroyd recently identified enough sites for half a million houses in the London area alone, with no intrusion on green belt.","core":"Stirling Ackroyd identified enough sites.","structure":"for half a million houses 说明地块的容量；in the London area alone 突出仅伦敦一地就有如此空间；with no intrusion on green belt 是 with 复合补充结构，说明无需付出的环境代价。","key":"agent：此处指房地产代理机构，而非“特工”或一般的“代理人”。；intrusion on：侵入、侵占某一受保护空间。","zh":"伦敦房地产机构 Stirling Ackroyd 最近确认，仅伦敦地区就有足以兴建五十万套住房的地块，而且无须侵占绿化隔离带。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P4-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"What is true of London is even truer of the provinces.","core":"What is true of London is even truer of the provinces.","structure":"What is true of London 是主语从句，意为“适用于伦敦的情况”。","key":"the provinces：此处指伦敦之外的英国其他地区，不宜直译为中国行政概念中的“各省”。","zh":"伦敦尚且如此，其他地区就更是这样。","tip":"truer 不是事实真假的程度比较，而是说其他地区比伦敦更有条件在不侵占绿地的前提下找到建设空间。"},{"id":"2016-T2-P5-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"The idea that \"housing crisis\" equals \"concreted meadows\" is pure lobby talk.","core":"The idea is pure lobby talk.","structure":"that ... 是同位语从句，完整解释 the idea 的内容；引号表明作者对“住房危机必然要求开发草地”这一说法持批判距离。","key":"lobby：此处指试图影响政府决策的利益集团，lobby talk 即服务于特定利益的游说话术。；concreted meadows：被混凝土覆盖的草地，形象指在乡村绿地上大兴土木。","zh":"把“住房危机”等同于“必须用混凝土覆盖草地”，纯粹是利益集团的游说话术。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P5-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The issue is not the need for more houses but, as always, where to put them.","core":"The issue is not the need ... but where to put them.","structure":"not ... but ... 对比“住房需求”与“选址问题”；as always 是插入语；them 指 more houses。","key":"见下方词汇笔记","zh":"问题不在于是否需要更多住房，而在于一如既往的那个关键：这些住房究竟应建在哪里。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P5-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal.","core":"George Osborne favours rural new-build.","structure":"句首介词短语交代其偏好的外部动因；against urban renovation and renewal 说明他在两类方案中偏向前者。","key":"new-build：此处作名词，指在未开发地块上新建的项目。；against：此处不是“反对”，而是表示两种方案的对照取舍，可译为“而不是、相对于”。；under lobby pressure：在利益集团的游说压力下。；urban renovation and renewal：城市改造与更新。","zh":"在利益集团的游说压力下，乔治·奥斯本偏爱乡村新建项目，而不愿选择城市改造与更新。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P5-S05","sec":"text2","sec_label":"Text 2","level":3,"en":"This is not a free market but a biased one.","core":"见结构","structure":"not A but B 直接否定“自由市场”的说法；one 替代 market，避免重复。","key":"biased：有偏向的、不公允的；这里指政策在游说作用下偏袒乡村新建和城外开发。","zh":"这并不是自由市场，而是一个受到人为偏袒的市场。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P5-S07","sec":"text2","sec_label":"Text 2","level":3,"en":"They do so best where building sticks to their edges and respects their character.","core":"They do so best where ...","structure":"They 指 Rural towns and villages；so 替代 grow；where 引导地点兼条件状语从句；sticks to 与 respects 是并列谓语。","key":"character：此处不是人的“性格”，而是乡村城镇和村庄独有的环境风貌与整体特征。；stick to the edges：局限在边缘地带，不向外无序铺开。；do so：如此做，代指上一句的 grow。","zh":"但最理想的发展方式，是把建设限制在原有聚落边缘，并尊重当地原有风貌。","tip":"本句给出作者接受乡村发展的条件，反衬奥斯本偏好乡村新建却未尊重这种边界和风貌。"},{"id":"2016-T2-P5-S09","sec":"text2","sec_label":"Text 2","level":3,"en":"Why ruin rural ones?","core":"见结构","structure":"这是省略主语的反问句，完整形式近似 Why should we ruin rural ones?；ones 替代上一句的 conservation areas。","key":"见下方词汇笔记","zh":"那又为什么要毁掉乡村保护区呢？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P6-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Development should be planned, not let rip.","core":"见结构","structure":"not let rip 是省略表达，可理解为 development should not be allowed to rip，与前面的 should be planned 构成鲜明对照。","key":"let rip：习语，意为“放任其全速发展、不加控制”，此处指让开发肆意蔓延。","zh":"开发应当经过规划，而不能放任其无序扩张。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P6-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living.","core":"Half a century of planning has enabled it to retain a rural coherence.","structure":"it 指英国；enable sb. to do 表示使英国能够保持乡村整体性；while still permitting ... 是让步兼并列的分词结构，说明规划并未以牺牲城市居住空间为代价。","key":"coherence：常见义为论述的“连贯性”；此处指乡村景观在空间和风貌上的完整、协调。；town and country planning：城乡规划。；retain an enviable rural coherence：保持令人称羡的乡村整体性。；low-density urban living：低密度城市居住形态。","zh":"半个世纪的城乡规划使英国既能保持令人称羡的乡村整体风貌，又能允许低密度的城市居住形态存在。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T2-P6-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"There is no doubt of the alternative - the corrupted landscapes of southern Portugal, Spain or Ireland.","core":"There is no doubt of the alternative.","structure":"破折号后的名词短语具体解释 the alternative 是什么。","key":"the alternative：此处不是中性的“另一选择”，而是与英国规划成果相反的后果。；corrupted landscapes：遭无序开发破坏、失去原有完整性的景观。","zh":"如果放弃这种规划，结果毫无疑问会是另一番景象，即像葡萄牙南部、西班牙或爱尔兰那样遭到破坏的景观。","tip":"作者并非称赞这些国家，而是把其受破坏的景观作为英国应当避免的反例。"},{"id":"2016-T2-P6-S05","sec":"text2","sec_label":"Text 2","level":3,"en":"Avoiding this rather than promoting it should unite the left and right of the political spectrum.","core":"Avoiding this should unite the left and right.","structure":"动名词短语 Avoiding this rather than promoting it 作主语；this 与 it 均指上一句所说的景观破坏。","key":"the left and right of the political spectrum：政治光谱上的左翼和右翼。；rather than：而不是。；have limited political support：得到的政治支持有限。；give development priority over conservation：把开发置于保护之上。","zh":"避免而不是助长这种景观破坏，应当成为左右两翼政治力量的共同立场。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P1-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"\"There is one and only one social responsibility of business,\" wrote Milton Friedman, a Nobel prize-winning economist, \"That is, to use its resources and engage in activities designed to increase its profits.\"","core":"引语的核心为 There is one social responsibility of business. That is to use ... and engage ...","structure":"a Nobel prize-winning economist 是 Milton Friedman 的同位语；第二段引语解释“唯一责任”的具体内容；to use 与 engage in 并列；designed to increase ... 是过去分词短语，修饰 activities。","key":"one and only one：有且只有一个，用于排除其他可能。；engage in activities：从事某些活动。；be designed to do：旨在做某事。","zh":"诺贝尔奖得主、经济学家米尔顿·弗里德曼曾写道：“企业有且只有一种社会责任，那就是运用自身资源，从事旨在增加利润的活动。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"But even if you accept Friedman's premise and regard corporate social responsibility (CSR) policies as a waste of shareholders' money, things may not be absolutely clear-cut.","core":"Things may not be absolutely clear-cut.","structure":"even if 引导让步状语从句；从句中 accept 与 regard 是并列谓语；corporate social responsibility policies 是 regard 的宾语，as ... 是宾语补足语。","key":"premise：论证赖以成立的前提，而非普通的“场所”。；clear-cut：界限分明的、明确无疑的；not absolutely clear-cut 表示结论仍有商榷余地。；regard A as B：把 A 视为 B。；a waste of shareholders' money：对股东资金的浪费。","zh":"但是，即便你接受弗里德曼的前提，认为企业社会责任（CSR）政策是在浪费股东的钱，事情也未必如此泾渭分明。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P1-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"New research suggests that CSR may create monetary value for companies - at least when they are prosecuted for corruption.","core":"New research suggests that CSR may create monetary value.","structure":"破折号后的 at least ... 限定该研究结论目前成立的具体情境；they 指 companies。","key":"value：此处不是抽象的“价值观”，而是可体现为罚款降低的经济价值。；prosecute：依法起诉，不是一般意义上的调查或指责。","zh":"新研究表明，企业社会责任或许能为公司创造货币价值，至少在公司因腐败而遭起诉时是如此。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P2-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"First, consumers may take CSR spending as a \"signal\" that a company's products are of high quality.","core":"Consumers may take CSR spending as a signal.","structure":"that ... 是同位语从句，说明 signal 所传递的具体内容。","key":"signal：此处不是具体信号，而是能帮助消费者推断企业或产品品质的信息指标。；take A as B：把 A 看作 B。；be of high quality：质量很高，be of + 抽象名词 相当于对应形容词。","zh":"第一，消费者可能把企业的 CSR 支出视为一种“信号”，认为该公司的产品质量很高。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P2-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"Second, customers may be willing to buy a company's products as an indirect way to donate to the good causes it helps.","core":"Customers may be willing to buy a company's products.","structure":"as an indirect way to donate ... 说明购买行为的附加意义；it helps 是省略关系代词的定语从句，修饰 the good causes；it 指公司。","key":"good cause：公益事业、慈善目标，不是一般意义上的“正当理由”。","zh":"第二，顾客可能愿意购买该公司的产品，以此作为间接捐助其所支持公益事业的方式。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P2-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"And third, through a more diffuse \"halo effect,\" whereby its good deeds earn it greater consideration from consumers and others.","core":"本句承接 S2 的 This could add value ...，补全后可理解为 Third, this could add value through a halo effect.","structure":"whereby ... 修饰 halo effect；第一个 it 是所有格 its 所指的企业，第二个 it 作 earn 的间接宾语，也指企业。","key":"diffuse：此处作形容词，意为“广泛弥散而不易明确分离的”。；consideration：常见义为“考虑”；此处指消费者对公司的重视、好感和优待。；halo effect：光环效应，即某一方面的正面印象扩散到对整体的评价。；whereby：凭借这一点、由此，引导说明机制的定语从句。","zh":"第三，是通过一种影响更为弥散的“光环效应”：企业的善举会使它得到消费者及其他群体更多的青睐。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P3-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Previous studies on CSR have had trouble differentiating these effects because consumers can be affected by all three.","core":"Previous studies have had trouble differentiating these effects.","structure":"because 引导原因状语从句；all three 指上一段的产品质量信号、借消费支持公益和光环效应。","key":"have trouble doing：做某事有困难。；differentiate these effects：区分这些效应。","zh":"以往关于企业社会责任的研究一直难以区分这些效应，因为消费者可能同时受到三者影响。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P3-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"A recent study attempts to separate them by looking at bribery prosecutions under America's Foreign Corrupt Practices Act (FCPA).","core":"A recent study attempts to separate them.","structure":"them 指三种 CSR 效应；by looking at ... 是方式状语；under ... 修饰 bribery prosecutions。","key":"separate：此处不是把实体“分开”，而是在研究设计中识别不同效应。；under：此处意为“依据、在某部法律框架下”。；bribery prosecution：行贿起诉案件。；Foreign Corrupt Practices Act：美国《反海外腐败法》。","zh":"一项近期研究试图通过考察美国《反海外腐败法》框架下的行贿起诉案件，把这些效应区分开来。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P3-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"It argues that since prosecutors do not consume a company's products as part of their investigations, they could be influenced only by the halo effect.","core":"It argues that they could be influenced only by the halo effect.","structure":"It 指 A recent study；that 引导宾语从句；宾语从句内嵌 since 原因状语从句；they/their 均指 prosecutors。","key":"argue：此处不是“争吵”，而是研究提出并论证某一判断。；as part of：作为……的组成部分、在……过程中。","zh":"该研究认为，检察官在调查过程中并不消费被查公司的产品，因此能够影响他们的只能是光环效应。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P4-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties.","core":"The study found that those tended to get penalties.","structure":"that 引导宾语从句；among prosecuted firms 是插入的范围状语；those with ... 指拥有最全面 CSR 项目的公司。","key":"lenient：宽大的、不严厉的；修饰 penalties 时表示处罚较轻。；comprehensive：全面的、覆盖范围广的。；prosecuted firms：受到起诉的公司。；tend to do：往往、倾向于做某事。","zh":"研究发现，在被起诉的企业中，企业社会责任项目最为全面的那些公司往往受到更宽松的处罚。","tip":"more lenient penalties 指处罚强度更低，即 less severe，不是处罚更有效或持续更久。"},{"id":"2016-T3-P4-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Their analysis ruled out the possibility that it was firms' political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed more to political campaigns did not receive lower fines.","core":"Their analysis ruled out the possibility.","structure":"that ... 是同位语从句，说明被排除的可能性；其中 it was A rather than B that ... 是强调句，强调可能造成宽大处罚的原因；冒号后的句子给出排除政治影响这一解释的证据。","key":"stand：常见义为“站立”；此处作名词，意为企业在社会责任方面的“立场和表现”。；account for：此处意为“解释、构成……的原因”，不是“占据比例”。；rule out the possibility：排除某种可能性。；contribute to political campaigns：向政治竞选活动捐款。","zh":"研究人员的分析排除了这样一种可能：造成从宽处罚的是公司的政治影响力，而不是其企业社会责任立场；因为向政治竞选捐款更多的公司并没有获得更低罚款。","tip":"Their 指研究人员，而不是被起诉公司；the leniency 指上一句的较宽松处罚。"},{"id":"2016-T3-P5-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"In all, the study concludes that whereas prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company's record in CSR.","core":"The study concludes that they do seem to be influenced by a company's CSR record.","structure":"that 引导宾语从句；其中 whereas 引导让步兼对比从句，将检察官“应当依据案情”的规范要求与“实际受 CSR 影响”的研究发现对照；do 用于强调 seem。","key":"merit：常见义为“优点”；on its merits 是法律语境表达，指只依据案件本身的事实和是非曲直。；record：此处指企业长期以来在 CSR 方面留下的行为记录，而非单份档案。；in all：总的来说、综上。；evaluate a case based on its merits：只根据案情本身评判案件。","zh":"总的来说，该研究得出结论：检察官本应只根据案件本身的是非曲直作出评判，但他们似乎确实会受到公司 CSR 记录的影响。","tip":"they 指 prosecutors；its 指 a case，不是公司。"},{"id":"2016-T3-P5-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"\"We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for bribing foreign officials,\" says one researcher.","core":"We estimate that either A or B results in fines.","structure":"either eliminating ... or increasing ... 是由 either ... or ... 连接的两个动名词短语，共同作宾语从句的主语；such as child labour 举例说明劳工权益问题；that ... 修饰 fines；for bribing ... 修饰 punishment。","key":"concern：常见义为“担忧”；此处指需要重视和处理的严重问题。；corporate giving：企业向公益或慈善事业的捐赠。","zh":"一位研究人员说：“据我们估算，企业若消除一项严重的劳工权益问题，例如童工问题，或者把企业捐赠提高约 20%，其罚款通常会比行贿外国官员的典型处罚低 40%。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P6-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Researchers admit that their study does not answer the question of how much businesses ought to spend on CSR.","core":"Researchers admit that their study does not answer the question.","structure":"that 引导宾语从句；of how much businesses ought to spend ... 修饰 the question，其中 how much 兼作 spend 的宾语。","key":"admit that：承认某项局限或不利事实。；the question of how much ...：有关多少数量的问题。","zh":"研究人员承认，他们的研究并未回答企业究竟应当在 CSR 上投入多少这一问题。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P6-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they decide their do-gooding policies.","core":"Nor does it reveal how much companies are banking on the halo effect.","structure":"否定副词 Nor 置于句首触发部分倒装；it 指研究；how much ... 是 reveal 的宾语从句；rather than ... 对比光环效应与其他收益；when ... 是时间状语从句。","key":"bank on：指望、押注于某事能够成功，与“把钱存入银行”无关。；do-gooding：带有审慎甚至略带讽刺色彩，指旨在表现企业“行善”的活动。","zh":"该研究也没有揭示，公司在制定行善政策时，究竟在多大程度上押注于光环效应，而不是其他可能的收益。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T3-P6-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"But at least they have demonstrated that when companies get into trouble with the law, evidence of good character can win them a less costly punishment.","core":"They have demonstrated that evidence can win them a punishment.","structure":"they 指研究人员；that 引导宾语从句；宾语从句中的 when ... 交代作用情境；win + 间接宾语 + 直接宾语 表示“为某人赢得某物”。","key":"character：此处指公司的品行与声誉，不是人物“性格”。；win：此处意为“为……赢得、使……获得”，不是比赛获胜。；get into trouble with the law：惹上法律麻烦。；evidence of good character：良好品行或声誉的证据。","zh":"但至少研究人员已经证明，当公司惹上法律麻烦时，能够体现良好品行的证据可以为它们换来代价较低的处罚。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P1-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"There will eventually come a day when The New York Times ceases to publish stories on newsprint.","core":"There will eventually come a day.","structure":"这是 there 存现句；when ... 是定语从句，修饰 a day。","key":"newsprint：印刷报纸所用的新闻纸，也可借指纸质报纸这一媒介。；cease to do：停止做某事。","zh":"终有一天，《纽约时报》将不再把新闻报道印在新闻纸上。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P1-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Exactly when that day will be is a matter of debate.","core":"Exactly when that day will be is a matter of debate.","structure":"Exactly when that day will be 是主语从句，使用陈述语序；that day 指纸质版停止出版之日。","key":"a matter of debate：尚有争议的问题。","zh":"真正有争议的是，那一天究竟何时到来。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P2-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Nostalgia for ink on paper and the rustle of pages aside, there's plenty of incentive to ditch print.","core":"There is plenty of incentive to ditch print.","structure":"Nostalgia ... aside 是“名词 + aside”的独立结构，表示排除情感因素后再作现实判断。","key":"aside：此处构成独立结构，意为“把……暂且放在一边”。；ditch：口语化动词，意为“抛弃、不再使用”。；nostalgia for：对……的怀旧之情。；the rustle of pages：纸页翻动的沙沙声。","zh":"撇开人们对纸上油墨和翻页沙沙声的怀旧情结不谈，放弃纸质版有着充足的现实动因。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P2-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"The infrastructure required to make a physical newspaper - printing presses, delivery trucks - isn't just expensive; it's excessive at a time when online-only competitors don't have the same set of financial constraints.","core":"The infrastructure isn't just expensive; it's excessive.","structure":"required to make ... 是过去分词短语，修饰 infrastructure；两个破折号之间列举基础设施；at a time 后的 when ... 是定语从句，交代判断其过剩的时代背景。","key":"physical newspaper：实体纸质报纸，与数字版相对。；excessive：不只是“过贵”，还表示投入或配置已超出当前业务所需。；printing press：印刷机。；financial constraints：财务约束、成本负担。","zh":"制作实体报纸所需的基础设施，例如印刷机和送报车辆，不只是成本高昂；在纯网络竞争者不受同类财务约束的时代，这套设施甚至显得过剩。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P2-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"And though print ad sales still dwarf their online and mobile counterparts, revenue from print is still declining.","core":"Revenue from print is still declining.","structure":"though 引导让步状语从句；从句承认纸质广告目前规模仍大，主句强调纸质收入下滑的趋势并未改变。","key":"dwarf：常见义为“矮小的人”；此处作动词，意为“使……相形见绌、远远超过”。；counterpart：功能或地位相对应的事物，此处指网络和移动端广告销售额。","zh":"而且，尽管纸质广告销售额仍远高于网络和移动端广告，但纸质业务收入仍在下降。","tip":"销售额的静态规模较大，不等于收入的动态趋势上升；still 在两处分属不同层面。"},{"id":"2016-T4-P3-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Overhead may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti.","core":"Rushing to eliminate its print edition would be a mistake.","structure":"Overhead may be high and circulation lower 是让步内容，其中 lower 后省略了 may be；but 后是佩雷蒂真正强调的判断；句末 says ... 是倒装的引语来源说明。","key":"overhead：企业维持日常运营的经常性开支，此处包括印刷、配送等固定成本。；circulation：报纸或杂志的发行量，不是一般意义上的“循环”。；rush to do：仓促做某事。；eliminate the print edition：取消纸质版。","zh":"BuzzFeed 首席执行官乔纳·佩雷蒂表示，运营成本或许很高，发行量或许也在下降，但仓促取消《纽约时报》纸质版将是一个错误。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P4-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Peretti says the Times shouldn't waste time getting out of the print business, but only if they go about doing it the right way.","core":"Peretti says the Times shouldn't waste time getting out of the print business.","structure":"says 后是省略 that 的宾语从句；but only if ... 补充必要条件；they 指《纽约时报》方面；it 指退出纸质业务这件事。","key":"waste time doing：在做某事上浪费时间，此处结合后文指不应拖延转型。；go about doing：着手并按某种方式处理一件事。","zh":"佩雷蒂认为，《纽约时报》不应在退出纸质业务这件事上拖延，但前提是必须采取正确的方式来推进。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P4-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"\"Figuring out a way to accelerate that transition would make sense for them,\" he said, \"but if you discontinue it, you're going to have your most loyal customers really upset with you.\"","core":"前半句为 Figuring out a way would make sense；后半句为 you are going to have your customers upset.","structure":"动名词短语作前半句主语；to accelerate ... 修饰 a way；if 引导条件状语从句；have + 宾语 + 形容词 表示使宾语处于某种状态。","key":"make sense for sb.：对某人而言合乎情理、是合理做法。；discontinue：停止提供或经营某项产品、服务。；accelerate the transition：加快转型。；have sb. upset with you：使某人对你不满。","zh":"他说：“想办法加快这一转型对他们而言是合理的，但如果直接中止纸质版，就会让最忠实的顾客对你极为不满。”","tip":"it 指纸质业务或纸质版；them 指《纽约时报》方面；you 是泛指经营者。"},{"id":"2016-T4-P5-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Sometimes that's worth making a change anyway.","core":"That's worth making a change anyway.","structure":"见原句","key":"见下方词汇笔记","zh":"不过有时，即便会惹恼忠实顾客，作出改变仍然值得。","tip":"that 承接上一段“最忠实顾客会非常不满”这一代价；anyway 表示即便如此仍要改变。"},{"id":"2016-T4-P5-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Peretti gives the example of Netflix discontinuing its DVD-mailing service to focus on streaming.","core":"Peretti gives the example.","structure":"of Netflix discontinuing ... 是“名词所有格含义 + 动名词”结构，解释例子的内容；to focus on ... 是目的状语。","key":"give the example of：举……为例。；DVD-mailing service：DVD 邮寄租赁服务。；focus on streaming：专注于流媒体业务。","zh":"佩雷蒂举了 Netflix 停止 DVD 邮寄服务、转而专注流媒体的例子。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P5-S05","sec":"text4","sec_label":"Text 4","level":3,"en":"And if Peretti were in charge at the Times?","core":"见结构","structure":"这是省略主句的虚拟条件问句，were 表明与现实相反；完整含义近似 What would he do if Peretti were in charge ...?","key":"be in charge at：在某机构负责、掌管该机构。","zh":"那么，如果让佩雷蒂来掌管《纽约时报》，他会怎么做呢？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P5-S07","sec":"text4","sec_label":"Text 4","level":3,"en":"\"I would raise prices and make it into more of a legacy product.\"","core":"I would raise prices and make it into a legacy product.","structure":"raise 与 make 是两个并列谓语；make A into B 表示“把 A 转变成 B”；it 指纸质版。","key":"legacy product：由旧有业务延续下来的传统产品；这里指不再服务大众市场，而面向仍珍视纸质版的核心老用户的高价产品。；more of：更接近、更像某类事物。","zh":"“我会提高价格，让纸质版更像一种面向传统忠实用户的经典产品。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P6-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The most loyal customers would still get the product they favor, the idea goes, and they'd feel like they were helping sustain the quality of something they believe in.","core":"The customers would get the product, and they would feel like ...","structure":"they favor 是省略关系代词的定语从句，修饰 the product；the idea goes 是插入语；they were helping ... 是 feel like 后的宾语从句；they believe in 修饰 something。","key":"the idea goes：插入语，意为“这一设想认为、按这一思路来说”。；sustain：维持某事物的存续或品质。","zh":"按照这一设想，最忠实的顾客仍能得到自己偏爱的产品，而且会觉得自己正在帮助维持一项所信赖事物的品质。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P6-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"\"So if you're overpaying for print, you could feel like you were helping,\" Peretti said.","core":"见结构","structure":"if 引导条件状语从句；feel like 后接省略 that 的从句；were helping 与现实时间拉开距离，突出顾客的主观感受。","key":"overpay for：为某物支付高于常规价值或替代方案的价格。","zh":"佩雷蒂说：“这样一来，即使你为纸质版支付了高于通常水平的价格，也会觉得自己是在出力维持它。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P6-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"In other words, if you're going to make a print product, make it for the people who are already obsessed with it.","core":"If you are going to make a print product, make it for the people.","structure":"if 引导条件状语从句；主句是祈使句；who ... 是定语从句，修饰 the people；末尾 it 指纸质产品。","key":"be obsessed with：对某事物极度着迷；此处指对纸质报纸有强烈忠诚和偏好。","zh":"换句话说，如果还要制作纸质产品，那就专门为那些已经对它情有独钟的人制作。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P6-S05","sec":"text4","sec_label":"Text 4","level":3,"en":"Which may be what the Times is doing already.","core":"见结构","structure":"这是承接上一句的补充性片段；Which 指“专为纸媒忠实用户制作高价纸质版”这一做法；what ... 是表语从句，意为《纽约时报》正在做的事情。","key":"见下方词汇笔记","zh":"而这或许正是《纽约时报》已经在做的事。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P6-S06","sec":"text4","sec_label":"Text 4","level":3,"en":"Getting the print edition seven days a week costs nearly $500 a year - more than twice as much as a digital-only subscription.","core":"Getting the print edition costs nearly $500 a year.","structure":"动名词短语作主语；seven days a week 说明订阅频率；破折号后补充纸质版与纯数字版的价格比较。","key":"digital-only subscription：纯数字版订阅。；more than twice as much as：是……的两倍多。","zh":"每周七天订阅纸质版一年需花费近 500 美元，是纯数字订阅价格的两倍多。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P7-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"\"It's a really hard thing to do and it's a tremendous luxury that BuzzFeed doesn't have a legacy business,\" Peretti remarked.","core":"It is a hard thing, and it is a tremendous luxury that ...","structure":"第一个 It 指处理传统业务转型这件事；第二个 it 是形式主语，真正主语是 that BuzzFeed doesn't have a legacy business。","key":"luxury：此处不是物质“奢侈品”，而是他人难以拥有的有利条件。；legacy business：从旧时代延续下来的传统业务，通常伴随既有成本和忠实客户牵制。","zh":"佩雷蒂评论道：“这种转型确实很难，而 BuzzFeed 没有传统业务包袱，实在是一项难得的优势。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P7-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"\"But we're going to have questions like that where we have things we're doing that don't make sense when the market changes and the world changes.","core":"We are going to have questions where we have things.","structure":"where 引导定语从句，描述这类问题出现的情境；we're doing 修饰 things；第二个 that don't make sense ... 也修饰 things；when 引导时间状语从句。","key":"make sense：合乎情理、在商业上仍然说得通。","zh":"“但是我们都会遇到这类问题：当市场和世界发生变化时，手头仍在做的一些事情已经不再合理。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2016-T4-P7-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"In those situations, it's better to be more aggressive than less aggressive.\"","core":"It is better to be more aggressive.","structure":"it 是形式主语，真正主语是 to be ...；more aggressive than less aggressive 形成直接比较。","key":"aggressive：此处不是“好斗的、攻击性的”，而是商业决策上积极、果断、敢于推进改变的。；nostalgia for ink on paper：对纸上油墨的怀旧情结。；ditch print：放弃纸质业务。；dwarf their online counterparts：远高于网络端对应业务。","zh":"在那种情况下，采取更积极果断的行动总比畏缩保守更好。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"}]};</script>

hat people should look to intangible qualities like character and intellect rather than dieting their way to size zero or wasp-waist physi","note":"无形的内在品质。","forms":["intangible qualities"]},{"w":"size zero","pos":"phr.","cn":"零号女装尺码，文中代指极瘦身材。","sec":"text1","sec_label":"Text 1","ctx":"And perhaps faintly, they hint that people should look to intangible qualities like character and intellect rather than dieting their way to size zero or wasp-waist physi","note":"零号女装尺码，文中代指极瘦身材。","forms":["size zero"]},{"w":"wasp-waist physique","pos":"phr.","cn":"蜂腰体形，即腰部异常纤细的身材。","sec":"text1","sec_label":"Text 1","ctx":"And perhaps faintly, they hint that people should look to intangible qualities like character and intellect rather than dieting their way to size zero or wasp-waist physi","note":"蜂腰体形，即腰部异常纤细的身材。","forms":["wasp-waist physique"]},{"w":"skin-deep","pos":"词","cn":"本义为“只有皮肤那么深”；此处指“肤浅的、只看外表的”。","sec":"text1","sec_label":"Text 1","ctx":"The French measures, however, rely too much on severe punishment to change a culture that still regards beauty as skin-deep - and bone-showing.","note":"本义为“只有皮肤那么深”；此处指“肤浅的、只看外表的”。","forms":["skin-deep"]},{"w":"bone-showing","pos":"adj.","cn":"文中仿照 skin-deep 构造的表达，指瘦到骨骼显露，并以此为美。","sec":"text1","sec_label":"Text 1","ctx":"The French measures, however, rely too much on severe punishment to change a culture that still regards beauty as skin-deep - and bone-showing.","note":"文中仿照 skin-deep 构造的表达，指瘦到骨骼显露，并以此为美。","forms":["bone-showing"]},{"w":"rely too much on","pos":"phr.","cn":"过度依赖。","sec":"text1","sec_label":"Text 1","ctx":"The French measures, however, rely too much on severe punishment to change a culture that still regards beauty as skin-deep - and bone-showing.","note":"过度依赖。","forms":["rely too much on"]},{"w":"regard A as B","pos":"phr.","cn":"把 A 看作 B。","sec":"text1","sec_label":"Text 1","ctx":"The French measures, however, rely too much on severe punishment to change a culture that still regards beauty as skin-deep - and bone-showing.","note":"把 A 看作 B。","forms":["regard A as B"]},{"w":"government-defined","pos":"v./adj.","cn":"由政府规定的。","sec":"text1","sec_label":"Text 1","ctx":"Under the law, using a fashion model that does not meet a government-defined index of body mass could result in a $85,000 fine and six months in prison.","note":"由政府规定的。","forms":["government-defined"]},{"w":"index of body mass","pos":"phr.","cn":"体重指数，即通常所说的 BMI。","sec":"text1","sec_label":"Text 1","ctx":"Under the law, using a fashion model that does not meet a government-defined index of body mass could result in a $85,000 fine and six months in prison.","note":"体重指数，即通常所说的 BMI。","forms":["index of body mass"]},{"w":"result in","pos":"phr.","cn":"导致、招致某种结果。","sec":"text1","sec_label":"Text 1","ctx":"Under the law, using a fashion model that does not meet a government-defined index of body mass could result in a $85,000 fine and six months in prison.","note":"导致、招致某种结果。","forms":["result in"]},{"w":"inherent","pos":"词","cn":"内在固有的、生来就有的。","sec":"text1","sec_label":"Text 1","ctx":"The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.","note":"内在固有的、生来就有的。","forms":["inherent"]},{"w":"material adornment","pos":"phr.","cn":"外在的物质装饰。","sec":"text1","sec_label":"Text 1","ctx":"The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.","note":"外在的物质装饰。","forms":["material adornment"]},{"w":"idealized body types","pos":"phr.","cn":"经过理想化、脱离普通现实的体形标准。","sec":"text1","sec_label":"Text 1","ctx":"The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.","note":"经过理想化、脱离普通现实的体形标准。","forms":["idealized body types"]},{"w":"have a problem in doing","pos":"phr.","cn":"在做某事方面存在问题。","sec":"text1","sec_label":"Text 1","ctx":"The fashion industry knows it has an inherent problem in focusing on material adornment and idealized body types.","note":"在做某事方面存在问题。","forms":["have a problem in doing"]},{"w":"voluntary standards","pos":"phr.","cn":"不是可以随意忽略的“志愿标准”，而是行业自愿制定并遵守、区别于法律强制的规范。","sec":"text1","sec_label":"Text 1","ctx":"In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforc","note":"不是可以随意忽略的“志愿标准”，而是行业自愿制定并遵守、区别于法律强制的规范。","forms":["voluntary standards"]},{"w":"peer pressure","pos":"phr.","cn":"此处不是青少年语境中的“同伴压力”，而是行业成员之间促使彼此合规的压力。","sec":"text1","sec_label":"Text 1","ctx":"In Denmark, the United States, and a few other countries, it is trying to set voluntary standards for models and fashion images that rely more on peer pressure for enforc","note":"此处不是青少年语境中的“同伴压力”，而是行业成员之间促使彼此合规的压力。","forms":["peer pressure"]},{"w":"in contrast to","pos":"phr.","cn":"与某事形成对照。","sec":"text1","sec_label":"Text 1","ctx":"In contrast to France's actions, Denmark's fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.","note":"与某事形成对照。","forms":["in contrast to"]},{"w":"agree on","pos":"phr.","cn":"就某项方案或规则达成一致。","sec":"text1","sec_label":"Text 1","ctx":"In contrast to France's actions, Denmark's fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.","note":"就某项方案或规则达成一致。","forms":["agree on"]},{"w":"sanction","pos":"n.","cn":"此处作名词，意为“处罚、惩戒措施”，不是“批准”。","sec":"text1","sec_label":"Text 1","ctx":"In contrast to France's actions, Denmark's fashion industry agreed last month on rules and sanctions regarding the age, health, and other characteristics of models.","note":"此处作名词，意为“处罚、惩戒措施”，不是“批准”。","forms":["sanction"]},{"w":"be aware of","pos":"phr.","cn":"意识到、清楚知道。","sec":"text1","sec_label":"Text 1","ctx":"The newly revised Danish Fashion Ethical Charter clearly states: \"We are aware of and take responsibility for the impact the fashion industry has on body ideals, especial","note":"意识到、清楚知道。","forms":["be aware of"]},{"w":"body ideals","pos":"phr.","cn":"社会所推崇的理想体形观念。","sec":"text1","sec_label":"Text 1","ctx":"The newly revised Danish Fashion Ethical Charter clearly states: \"We are aware of and take responsibility for the impact the fashion industry has on body ideals, especial","note":"社会所推崇的理想体形观念。","forms":["body ideals"]},{"w":"access","pos":"词","cn":"此处不是网络或文件的“访问权限”，而是进入、参加哥本哈根时装周的资格。","sec":"text1","sec_label":"Text 1","ctx":"The charter's main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institut","note":"此处不是网络或文件的“访问权限”，而是进入、参加哥本哈根时装周的资格。","forms":["access"]},{"w":"tool of enforcement","pos":"phr.","cn":"促使规则得到执行的手段。","sec":"text1","sec_label":"Text 1","ctx":"The charter's main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institut","note":"促使规则得到执行的手段。","forms":["tool of enforcement"]},{"w":"deny access for sb. to sth.","pos":"phr.","cn":"拒绝给予某人进入或参加某事的资格。","sec":"text1","sec_label":"Text 1","ctx":"The charter's main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institut","note":"拒绝给予某人进入或参加某事的资格。","forms":["deny access for sb. to sth."]},{"w":"modeling agency","pos":"phr.","cn":"模特经纪公司。","sec":"text1","sec_label":"Text 1","ctx":"The charter's main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institut","note":"模特经纪公司。","forms":["modeling agency"]},{"w":"compliance","pos":"n.","cn":"此处意为“遵守规则、合规”，不是一般意义上的“顺从”。","sec":"text1","sec_label":"Text 1","ctx":"But in general it relies on a name-and-shame method of compliance.","note":"此处意为“遵守规则、合规”，不是一般意义上的“顺从”。","forms":["compliance"]},{"w":"name-and-shame","pos":"词","cn":"公开点名并使违规者承受声誉压力。","sec":"text1","sec_label":"Text 1","ctx":"But in general it relies on a name-and-shame method of compliance.","note":"公开点名并使违规者承受声誉压力。","forms":["name-and-shame"]},{"w":"ethical persuasion","pos":"phr.","cn":"道德劝导，即借助伦理共识和声誉压力改变行为。","sec":"text1","sec_label":"Text 1","ctx":"Relying on ethical persuasion rather than law to address the misuse of body ideals may be the best step.","note":"道德劝导，即借助伦理共识和声誉压力改变行为。","forms":["ethical persuasion"]},{"w":"rather than","pos":"phr.","cn":"而不是，用于突出作者偏好的手段。","sec":"text1","sec_label":"Text 1","ctx":"Relying on ethical persuasion rather than law to address the misuse of body ideals may be the best step.","note":"而不是，用于突出作者偏好的手段。","forms":["rather than"]},{"w":"address the misuse of","pos":"phr.","cn":"处理、纠正对某事物的滥用。","sec":"text1","sec_label":"Text 1","ctx":"Relying on ethical persuasion rather than law to address the misuse of body ideals may be the best step.","note":"处理、纠正对某事物的滥用。","forms":["address the misuse of"]},{"w":"elevate","pos":"v.","cn":"常见义为“抬高”；此处意为“提升、升华”，使审美观摆脱狭窄层次。","sec":"text1","sec_label":"Text 1","ctx":"Even better would be to help elevate notions of beauty beyond the material standards of a particular industry.","note":"常见义为“抬高”；此处意为“提升、升华”，使审美观摆脱狭窄层次。","forms":["elevate"]},{"w":"notions of beauty","pos":"phr.","cn":"关于美的观念。","sec":"text1","sec_label":"Text 1","ctx":"Even better would be to help elevate notions of beauty beyond the material standards of a particular industry.","note":"关于美的观念。","forms":["notions of beauty"]},{"w":"beyond the material standards","pos":"phr.","cn":"超越外在物质标准。","sec":"text1","sec_label":"Text 1","ctx":"Even better would be to help elevate notions of beauty beyond the material standards of a particular industry.","note":"超越外在物质标准。","forms":["beyond the material standards"]},{"w":"the country","pos":"phr.","cn":"此处不是“国家”，而是与 towns 相对的“乡村地区”。","sec":"text2","sec_label":"Text 2","ctx":"For the first time in history more people live in towns than in the country.","note":"此处不是“国家”，而是与 towns 相对的“乡村地区”。","forms":["the country"]},{"w":"for the first time in history","pos":"phr.","cn":"有史以来第一次。","sec":"text2","sec_label":"Text 2","ctx":"For the first time in history more people live in towns than in the country.","note":"有史以来第一次。","forms":["for the first time in history"]},{"w":"curious","pos":"adj.","cn":"此处不是“好奇的”，而是“奇特的、耐人寻味的”。","sec":"text2","sec_label":"Text 2","ctx":"In Britain this has had a curious result.","note":"此处不是“好奇的”，而是“奇特的、耐人寻味的”。","forms":["curious"]},{"w":"rate","pos":"v.","cn":"常见义为“比率、速度”；此处作动词，意为“评价、把……视为”。","sec":"text2","sec_label":"Text 2","ctx":"While polls show Britons rate \"the countryside\" alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country","note":"常见义为“比率、速度”；此处作动词，意为“评价、把……视为”。","forms":["rate"]},{"w":"alongside","pos":"词","cn":"与……并列、同等看待。","sec":"text2","sec_label":"Text 2","ctx":"While polls show Britons rate \"the countryside\" alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country","note":"与……并列、同等看待。","forms":["alongside"]},{"w":"have limited political support","pos":"phr.","cn":"得到的政治支持有限。","sec":"text2","sec_label":"Text 2","ctx":"While polls show Britons rate \"the countryside\" alongside the royal family, Shakespeare and the National Health Service (NHS) as what makes them proudest of their country","note":"得到的政治支持有限。","forms":["have limited political support"]},{"w":"launch","pos":"词","cn":"常见义为“发射”；此处意为“发起、创立”一个组织。","sec":"text2","sec_label":"Text 2","ctx":"A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save \"the beauty of natural places for everyone forever.\"","note":"常见义为“发射”；此处意为“发起、创立”一个组织。","forms":["launch"]},{"w":"stylish houses","pos":"phr.","cn":"结合国民信托组织语境，指有风格、气派的历史宅邸，并非普通的“时髦住宅”。","sec":"text2","sec_label":"Text 2","ctx":"A century ago Octavia Hill launched the National Trust not to rescue stylish houses but to save \"the beauty of natural places for everyone forever.\"","note":"结合国民信托组织语境，指有风格、气派的历史宅邸，并非普通的“时髦住宅”。","forms":["stylish houses"]},{"w":"city dweller","pos":"phr.","cn":"城市居民。","sec":"text2","sec_label":"Text 2","ctx":"It was specifically to provide city dwellers with spaces for leisure where they could experience \"a refreshing air.\"","note":"城市居民。","forms":["city dweller"]},{"w":"provide sb. with sth.","pos":"phr.","cn":"向某人提供某物。","sec":"text2","sec_label":"Text 2","ctx":"It was specifically to provide city dwellers with spaces for leisure where they could experience \"a refreshing air.\"","note":"向某人提供某物。","forms":["provide sb. with sth."]},{"w":"spaces for leisure","pos":"phr.","cn":"休闲空间。","sec":"text2","sec_label":"Text 2","ctx":"It was specifically to provide city dwellers with spaces for leisure where they could experience \"a refreshing air.\"","note":"休闲空间。","forms":["spaces for leisure"]},{"w":"pressure","pos":"词","cn":"此处不是负面的“压力”，而是希尔为保护自然所作的倡议和推动。","sec":"text2","sec_label":"Text 2","ctx":"Hill's pressure later led to the creation of national parks and green belts.","note":"此处不是负面的“压力”，而是希尔为保护自然所作的倡议和推动。","forms":["pressure"]},{"w":"lead to the creation of","pos":"phr.","cn":"促成……的建立。","sec":"text2","sec_label":"Text 2","ctx":"Hill's pressure later led to the creation of national parks and green belts.","note":"促成……的建立。","forms":["lead to the creation of"]},{"w":"green belt","pos":"phr.","cn":"环绕城市、限制无序扩张的绿化隔离带。","sec":"text2","sec_label":"Text 2","ctx":"Hill's pressure later led to the creation of national parks and green belts.","note":"环绕城市、限制无序扩张的绿化隔离带。","forms":["green belt"]},{"w":"make","pos":"词","cn":"此处不是普通的“制造”，而是强调乡村土地是不可新增、不可再生的资源。","sec":"text2","sec_label":"Text 2","ctx":"They don't make countryside any more, and every year concrete consumes more of it.","note":"此处不是普通的“制造”，而是强调乡村土地是不可新增、不可再生的资源。","forms":["make"]},{"w":"concrete consumes","pos":"phr.","cn":"拟人化表达，字面为“混凝土吞噬”，实际指建设开发不断侵占乡村土地。","sec":"text2","sec_label":"Text 2","ctx":"They don't make countryside any more, and every year concrete consumes more of it.","note":"拟人化表达，字面为“混凝土吞噬”，实际指建设开发不断侵占乡村土地。","forms":["concrete consumes"]},{"w":"constant guardianship","pos":"phr.","cn":"持续的保护与监管。","sec":"text2","sec_label":"Text 2","ctx":"It needs constant guardianship.","note":"持续的保护与监管。","forms":["constant guardianship"]},{"w":"sentiment","pos":"n.","cn":"此处不是一时的“情绪”，而是上文所述保护和珍视乡村的公众态度。","sec":"text2","sec_label":"Text 2","ctx":"At the next election none of the big parties seem likely to endorse this sentiment.","note":"此处不是一时的“情绪”，而是上文所述保护和珍视乡村的公众态度。","forms":["sentiment"]},{"w":"endorse a sentiment","pos":"phr.","cn":"公开赞同某种立场或观念。","sec":"text2","sec_label":"Text 2","ctx":"At the next election none of the big parties seem likely to endorse this sentiment.","note":"公开赞同某种立场或观念。","forms":["endorse a sentiment"]},{"w":"off-plan building","pos":"phr.","cn":"在本文的土地规划语境中，指脱离或绕开地方既定规划的建设，并非房地产销售中的“楼花”。","sec":"text2","sec_label":"Text 2","ctx":"The Conservatives' planning reform explicitly gives rural development priority over conservation, even authorising \"off-plan\" building where local people might object.","note":"在本文的土地规划语境中，指脱离或绕开地方既定规划的建设，并非房地产销售中的“楼花”。","forms":["off-plan building"]},{"w":"give A priority over B","pos":"phr.","cn":"赋予 A 高于 B 的优先地位。","sec":"text2","sec_label":"Text 2","ctx":"The Conservatives' planning reform explicitly gives rural development priority over conservation, even authorising \"off-plan\" building where local people might object.","note":"赋予 A 高于 B 的优先地位。","forms":["give A priority over B"]},{"w":"authorise doing","pos":"phr.","cn":"授权、准许做某事。","sec":"text2","sec_label":"Text 2","ctx":"The Conservatives' planning reform explicitly gives rural development priority over conservation, even authorising \"off-plan\" building where local people might object.","note":"授权、准许做某事。","forms":["authorise doing"]},{"w":"defined as profitable","pos":"phr.","cn":"表面意为“被定义为有利可图”，实质讽刺政策把经济收益偷换成可持续性的判断标准。","sec":"text2","sec_label":"Text 2","ctx":"The concept of sustainable development has been defined as profitable.","note":"表面意为“被定义为有利可图”，实质讽刺政策把经济收益偷换成可持续性的判断标准。","forms":["defined as profitable"]},{"w":"discontinue local planning","pos":"phr.","cn":"结合语境，指停止或架空地方层面的规划程序，而不是停止所有建设规划。","sec":"text2","sec_label":"Text 2","ctx":"Labour likewise wants to discontinue local planning where councils oppose development.","note":"结合语境，指停止或架空地方层面的规划程序，而不是停止所有建设规划。","forms":["discontinue local planning"]},{"w":"considered","pos":"v./adj.","cn":"常见义为“被认为的”；此处作形容词，意为“经过深思熟虑的、审慎的”。","sec":"text2","sec_label":"Text 2","ctx":"Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land.","note":"常见义为“被认为的”；此处作形容词，意为“经过深思熟虑的、审慎的”。","forms":["considered"]},{"w":"sense one's chance","pos":"phr.","cn":"意识到机会来临。","sec":"text2","sec_label":"Text 2","ctx":"Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land.","note":"意识到机会来临。","forms":["sense one's chance"]},{"w":"side with","pos":"phr.","cn":"站在……一边，支持……。","sec":"text2","sec_label":"Text 2","ctx":"Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land.","note":"站在……一边，支持……。","forms":["side with"]},{"w":"plead for","pos":"phr.","cn":"恳切呼吁、主张。","sec":"text2","sec_label":"Text 2","ctx":"Only Ukip, sensing its chance, has sided with those pleading for a more considered approach to using green land.","note":"恳切呼吁、主张。","forms":["plead for"]},{"w":"strike terror into sb.","pos":"phr.","cn":"使某人极度恐慌。","sec":"text2","sec_label":"Text 2","ctx":"Its Campaign to Protect Rural England struck terror into many local Conservative parties.","note":"使某人极度恐慌。","forms":["strike terror into sb."]},{"w":"in place","pos":"phr.","cn":"此处意为“已经具备、已经就位”，不是简单的“在某个地方”。","sec":"text2","sec_label":"Text 2","ctx":"The sensible place to build new houses, factories and offices is where people are, in cities and towns where infrastructure is in place.","note":"此处意为“已经具备、已经就位”，不是简单的“在某个地方”。","forms":["in place"]},{"w":"agent","pos":"词","cn":"此处指房地产代理机构，而非“特工”或一般的“代理人”。","sec":"text2","sec_label":"Text 2","ctx":"The London agents Stirling Ackroyd recently identified enough sites for half a million houses in the London area alone, with no intrusion on green belt.","note":"此处指房地产代理机构，而非“特工”或一般的“代理人”。","forms":["agent"]},{"w":"intrusion on","pos":"phr.","cn":"侵入、侵占某一受保护空间。","sec":"text2","sec_label":"Text 2","ctx":"The London agents Stirling Ackroyd recently identified enough sites for half a million houses in the London area alone, with no intrusion on green belt.","note":"侵入、侵占某一受保护空间。","forms":["intrusion on"]},{"w":"the provinces","pos":"phr.","cn":"此处指伦敦之外的英国其他地区，不宜直译为中国行政概念中的“各省”。","sec":"text2","sec_label":"Text 2","ctx":"What is true of London is even truer of the provinces.","note":"此处指伦敦之外的英国其他地区，不宜直译为中国行政概念中的“各省”。","forms":["the provinces"]},{"w":"lobby","pos":"词","cn":"此处指试图影响政府决策的利益集团，lobby talk 即服务于特定利益的游说话术。","sec":"text2","sec_label":"Text 2","ctx":"The idea that \"housing crisis\" equals \"concreted meadows\" is pure lobby talk.","note":"此处指试图影响政府决策的利益集团，lobby talk 即服务于特定利益的游说话术。","forms":["lobby"]},{"w":"concreted meadows","pos":"phr.","cn":"被混凝土覆盖的草地，形象指在乡村绿地上大兴土木。","sec":"text2","sec_label":"Text 2","ctx":"The idea that \"housing crisis\" equals \"concreted meadows\" is pure lobby talk.","note":"被混凝土覆盖的草地，形象指在乡村绿地上大兴土木。","forms":["concreted meadows"]},{"w":"new-build","pos":"词","cn":"此处作名词，指在未开发地块上新建的项目。","sec":"text2","sec_label":"Text 2","ctx":"Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal.","note":"此处作名词，指在未开发地块上新建的项目。","forms":["new-build"]},{"w":"against","pos":"词","cn":"此处不是“反对”，而是表示两种方案的对照取舍，可译为“而不是、相对于”。","sec":"text2","sec_label":"Text 2","ctx":"Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal.","note":"此处不是“反对”，而是表示两种方案的对照取舍，可译为“而不是、相对于”。","forms":["against"]},{"w":"under lobby pressure","pos":"phr.","cn":"在利益集团的游说压力下。","sec":"text2","sec_label":"Text 2","ctx":"Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal.","note":"在利益集团的游说压力下。","forms":["under lobby pressure"]},{"w":"urban renovation and renewal","pos":"phr.","cn":"城市改造与更新。","sec":"text2","sec_label":"Text 2","ctx":"Under lobby pressure, George Osborne favours rural new-build against urban renovation and renewal.","note":"城市改造与更新。","forms":["urban renovation and renewal"]},{"w":"high street","pos":"phr.","cn":"英国城镇的主要商业街，不是字面意义上的“高街”。","sec":"text2","sec_label":"Text 2","ctx":"He favours out-of-town shopping sites against high streets.","note":"英国城镇的主要商业街，不是字面意义上的“高街”。","forms":["high street"]},{"w":"out-of-town","pos":"词","cn":"位于城镇边缘或城外的。","sec":"text2","sec_label":"Text 2","ctx":"He favours out-of-town shopping sites against high streets.","note":"位于城镇边缘或城外的。","forms":["out-of-town"]},{"w":"biased","pos":"v./adj.","cn":"有偏向的、不公允的；这里指政策在游说作用下偏袒乡村新建和城外开发。","sec":"text2","sec_label":"Text 2","ctx":"This is not a free market but a biased one.","note":"有偏向的、不公允的；这里指政策在游说作用下偏袒乡村新建和城外开发。","forms":["biased"]},{"w":"character","pos":"词","cn":"此处不是人的“性格”，而是乡村城镇和村庄独有的环境风貌与整体特征。","sec":"text2","sec_label":"Text 2","ctx":"They do so best where building sticks to their edges and respects their character.","note":"此处不是人的“性格”，而是乡村城镇和村庄独有的环境风貌与整体特征。","forms":["character"]},{"w":"stick to the edges","pos":"phr.","cn":"局限在边缘地带，不向外无序铺开。","sec":"text2","sec_label":"Text 2","ctx":"They do so best where building sticks to their edges and respects their character.","note":"局限在边缘地带，不向外无序铺开。","forms":["stick to the edges"]},{"w":"do so","pos":"phr.","cn":"如此做，代指上一句的 grow。","sec":"text2","sec_label":"Text 2","ctx":"They do so best where building sticks to their edges and respects their character.","note":"如此做，代指上一句的 grow。","forms":["do so"]},{"w":"let rip","pos":"phr.","cn":"习语，意为“放任其全速发展、不加控制”，此处指让开发肆意蔓延。","sec":"text2","sec_label":"Text 2","ctx":"Development should be planned, not let rip.","note":"习语，意为“放任其全速发展、不加控制”，此处指让开发肆意蔓延。","forms":["let rip"]},{"w":"After the Netherlands","pos":"phr.","cn":"此处按排名表示“仅次于荷兰”，不是时间上的“在荷兰之后”。","sec":"text2","sec_label":"Text 2","ctx":"After the Netherlands, Britain is Europe's most crowded country.","note":"此处按排名表示“仅次于荷兰”，不是时间上的“在荷兰之后”。","forms":["After the Netherlands"]},{"w":"coherence","pos":"n.","cn":"常见义为论述的“连贯性”；此处指乡村景观在空间和风貌上的完整、协调。","sec":"text2","sec_label":"Text 2","ctx":"Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living.","note":"常见义为论述的“连贯性”；此处指乡村景观在空间和风貌上的完整、协调。","forms":["coherence"]},{"w":"town and country planning","pos":"phr.","cn":"城乡规划。","sec":"text2","sec_label":"Text 2","ctx":"Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living.","note":"城乡规划。","forms":["town and country planning"]},{"w":"retain an enviable rural coherence","pos":"phr.","cn":"保持令人称羡的乡村整体性。","sec":"text2","sec_label":"Text 2","ctx":"Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living.","note":"保持令人称羡的乡村整体性。","forms":["retain an enviable rural coherence"]},{"w":"low-density urban living","pos":"phr.","cn":"低密度城市居住形态。","sec":"text2","sec_label":"Text 2","ctx":"Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban living.","note":"低密度城市居住形态。","forms":["low-density urban living"]},{"w":"the alternative","pos":"phr.","cn":"此处不是中性的“另一选择”，而是与英国规划成果相反的后果。","sec":"text2","sec_label":"Text 2","ctx":"There is no doubt of the alternative - the corrupted landscapes of southern Portugal, Spain or Ireland.","note":"此处不是中性的“另一选择”，而是与英国规划成果相反的后果。","forms":["the alternative"]},{"w":"corrupted landscapes","pos":"phr.","cn":"遭无序开发破坏、失去原有完整性的景观。","sec":"text2","sec_label":"Text 2","ctx":"There is no doubt of the alternative - the corrupted landscapes of southern Portugal, Spain or Ireland.","note":"遭无序开发破坏、失去原有完整性的景观。","forms":["corrupted landscapes"]},{"w":"the left and right of the political spectrum","pos":"phr.","cn":"政治光谱上的左翼和右翼。","sec":"text2","sec_label":"Text 2","ctx":"Avoiding this rather than promoting it should unite the left and right of the political spectrum.","note":"政治光谱上的左翼和右翼。","forms":["the left and right of the political spectrum"]},{"w":"one and only one","pos":"phr.","cn":"有且只有一个，用于排除其他可能。","sec":"text3","sec_label":"Text 3","ctx":"\"There is one and only one social responsibility of business,\" wrote Milton Friedman, a Nobel prize-winning economist, \"That is, to use its resources and engage in activi","note":"有且只有一个，用于排除其他可能。","forms":["one and only one"]},{"w":"engage in activities","pos":"phr.","cn":"从事某些活动。","sec":"text3","sec_label":"Text 3","ctx":"\"There is one and only one social responsibility of business,\" wrote Milton Friedman, a Nobel prize-winning economist, \"That is, to use its resources and engage in activi","note":"从事某些活动。","forms":["engage in activities"]},{"w":"be designed to do","pos":"phr.","cn":"旨在做某事。","sec":"text3","sec_label":"Text 3","ctx":"\"There is one and only one social responsibility of business,\" wrote Milton Friedman, a Nobel prize-winning economist, \"That is, to use its resources and engage in activi","note":"旨在做某事。","forms":["be designed to do"]},{"w":"premise","pos":"v.","cn":"论证赖以成立的前提，而非普通的“场所”。","sec":"text3","sec_label":"Text 3","ctx":"But even if you accept Friedman's premise and regard corporate social responsibility (CSR) policies as a waste of shareholders' money, things may not be absolutely clear-","note":"论证赖以成立的前提，而非普通的“场所”。","forms":["premise"]},{"w":"clear-cut","pos":"词","cn":"界限分明的、明确无疑的；not absolutely clear-cut 表示结论仍有商榷余地。","sec":"text3","sec_label":"Text 3","ctx":"But even if you accept Friedman's premise and regard corporate social responsibility (CSR) policies as a waste of shareholders' money, things may not be absolutely clear-","note":"界限分明的、明确无疑的；not absolutely clear-cut 表示结论仍有商榷余地。","forms":["clear-cut"]},{"w":"a waste of shareholders' money","pos":"phr.","cn":"对股东资金的浪费。","sec":"text3","sec_label":"Text 3","ctx":"But even if you accept Friedman's premise and regard corporate social responsibility (CSR) policies as a waste of shareholders' money, things may not be absolutely clear-","note":"对股东资金的浪费。","forms":["a waste of shareholders' money"]},{"w":"value","pos":"词","cn":"此处不是抽象的“价值观”，而是可体现为罚款降低的经济价值。","sec":"text3","sec_label":"Text 3","ctx":"New research suggests that CSR may create monetary value for companies - at least when they are prosecuted for corruption.","note":"此处不是抽象的“价值观”，而是可体现为罚款降低的经济价值。","forms":["value"]},{"w":"prosecute","pos":"词","cn":"依法起诉，不是一般意义上的调查或指责。","sec":"text3","sec_label":"Text 3","ctx":"New research suggests that CSR may create monetary value for companies - at least when they are prosecuted for corruption.","note":"依法起诉，不是一般意义上的调查或指责。","forms":["prosecute"]},{"w":"spend ... on CSR","pos":"phr.","cn":"在企业社会责任项目上投入……。","sec":"text3","sec_label":"Text 3","ctx":"The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm.","note":"在企业社会责任项目上投入……。","forms":["spend ... on CSR"]},{"w":"according to an estimate by","pos":"phr.","cn":"根据某机构的估算。","sec":"text3","sec_label":"Text 3","ctx":"The largest firms in America and Britain together spend more than $15 billion a year on CSR, according to an estimate by EPG, a consulting firm.","note":"根据某机构的估算。","forms":["according to an estimate by"]},{"w":"signal","pos":"adj.","cn":"此处不是具体信号，而是能帮助消费者推断企业或产品品质的信息指标。","sec":"text3","sec_label":"Text 3","ctx":"First, consumers may take CSR spending as a \"signal\" that a company's products are of high quality.","note":"此处不是具体信号，而是能帮助消费者推断企业或产品品质的信息指标。","forms":["signal"]},{"w":"take A as B","pos":"phr.","cn":"把 A 看作 B。","sec":"text3","sec_label":"Text 3","ctx":"First, consumers may take CSR spending as a \"signal\" that a company's products are of high quality.","note":"把 A 看作 B。","forms":["take A as B"]},{"w":"be of high quality","pos":"phr.","cn":"质量很高，be of + 抽象名词 相当于对应形容词。","sec":"text3","sec_label":"Text 3","ctx":"First, consumers may take CSR spending as a \"signal\" that a company's products are of high quality.","note":"质量很高，be of + 抽象名词 相当于对应形容词。","forms":["be of high quality"]},{"w":"good cause","pos":"phr.","cn":"公益事业、慈善目标，不是一般意义上的“正当理由”。","sec":"text3","sec_label":"Text 3","ctx":"Second, customers may be willing to buy a company's products as an indirect way to donate to the good causes it helps.","note":"公益事业、慈善目标，不是一般意义上的“正当理由”。","forms":["good cause"]},{"w":"diffuse","pos":"词","cn":"此处作形容词，意为“广泛弥散而不易明确分离的”。","sec":"text3","sec_label":"Text 3","ctx":"And third, through a more diffuse \"halo effect,\" whereby its good deeds earn it greater consideration from consumers and others.","note":"此处作形容词，意为“广泛弥散而不易明确分离的”。","forms":["diffuse"]},{"w":"consideration","pos":"n.","cn":"常见义为“考虑”；此处指消费者对公司的重视、好感和优待。","sec":"text3","sec_label":"Text 3","ctx":"And third, through a more diffuse \"halo effect,\" whereby its good deeds earn it greater consideration from consumers and others.","note":"常见义为“考虑”；此处指消费者对公司的重视、好感和优待。","forms":["consideration"]},{"w":"halo effect","pos":"phr.","cn":"光环效应，即某一方面的正面印象扩散到对整体的评价。","sec":"text3","sec_label":"Text 3","ctx":"And third, through a more diffuse \"halo effect,\" whereby its good deeds earn it greater consideration from consumers and others.","note":"光环效应，即某一方面的正面印象扩散到对整体的评价。","forms":["halo effect"]},{"w":"whereby","pos":"词","cn":"凭借这一点、由此，引导说明机制的定语从句。","sec":"text3","sec_label":"Text 3","ctx":"And third, through a more diffuse \"halo effect,\" whereby its good deeds earn it greater consideration from consumers and others.","note":"凭借这一点、由此，引导说明机制的定语从句。","forms":["whereby"]},{"w":"have trouble doing","pos":"phr.","cn":"做某事有困难。","sec":"text3","sec_label":"Text 3","ctx":"Previous studies on CSR have had trouble differentiating these effects because consumers can be affected by all three.","note":"做某事有困难。","forms":["have trouble doing"]},{"w":"differentiate these effects","pos":"phr.","cn":"区分这些效应。","sec":"text3","sec_label":"Text 3","ctx":"Previous studies on CSR have had trouble differentiating these effects because consumers can be affected by all three.","note":"区分这些效应。","forms":["differentiate these effects"]},{"w":"separate","pos":"v.","cn":"此处不是把实体“分开”，而是在研究设计中识别不同效应。","sec":"text3","sec_label":"Text 3","ctx":"A recent study attempts to separate them by looking at bribery prosecutions under America's Foreign Corrupt Practices Act (FCPA).","note":"此处不是把实体“分开”，而是在研究设计中识别不同效应。","forms":["separate"]},{"w":"under","pos":"词","cn":"此处意为“依据、在某部法律框架下”。","sec":"text3","sec_label":"Text 3","ctx":"A recent study attempts to separate them by looking at bribery prosecutions under America's Foreign Corrupt Practices Act (FCPA).","note":"此处意为“依据、在某部法律框架下”。","forms":["under"]},{"w":"bribery prosecution","pos":"phr.","cn":"行贿起诉案件。","sec":"text3","sec_label":"Text 3","ctx":"A recent study attempts to separate them by looking at bribery prosecutions under America's Foreign Corrupt Practices Act (FCPA).","note":"行贿起诉案件。","forms":["bribery prosecution"]},{"w":"Foreign Corrupt Practices Act","pos":"phr.","cn":"美国《反海外腐败法》。","sec":"text3","sec_label":"Text 3","ctx":"A recent study attempts to separate them by looking at bribery prosecutions under America's Foreign Corrupt Practices Act (FCPA).","note":"美国《反海外腐败法》。","forms":["Foreign Corrupt Practices Act"]},{"w":"argue","pos":"词","cn":"此处不是“争吵”，而是研究提出并论证某一判断。","sec":"text3","sec_label":"Text 3","ctx":"It argues that since prosecutors do not consume a company's products as part of their investigations, they could be influenced only by the halo effect.","note":"此处不是“争吵”，而是研究提出并论证某一判断。","forms":["argue"]},{"w":"as part of","pos":"phr.","cn":"作为……的组成部分、在……过程中。","sec":"text3","sec_label":"Text 3","ctx":"It argues that since prosecutors do not consume a company's products as part of their investigations, they could be influenced only by the halo effect.","note":"作为……的组成部分、在……过程中。","forms":["as part of"]},{"w":"lenient","pos":"词","cn":"宽大的、不严厉的；修饰 penalties 时表示处罚较轻。","sec":"text3","sec_label":"Text 3","ctx":"The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties.","note":"宽大的、不严厉的；修饰 penalties 时表示处罚较轻。","forms":["lenient"]},{"w":"comprehensive","pos":"adj.","cn":"全面的、覆盖范围广的。","sec":"text3","sec_label":"Text 3","ctx":"The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties.","note":"全面的、覆盖范围广的。","forms":["comprehensive"]},{"w":"prosecuted firms","pos":"phr.","cn":"受到起诉的公司。","sec":"text3","sec_label":"Text 3","ctx":"The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties.","note":"受到起诉的公司。","forms":["prosecuted firms"]},{"w":"tend to do","pos":"phr.","cn":"往往、倾向于做某事。","sec":"text3","sec_label":"Text 3","ctx":"The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient penalties.","note":"往往、倾向于做某事。","forms":["tend to do"]},{"w":"stand","pos":"词","cn":"常见义为“站立”；此处作名词，意为企业在社会责任方面的“立场和表现”。","sec":"text3","sec_label":"Text 3","ctx":"Their analysis ruled out the possibility that it was firms' political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed ","note":"常见义为“站立”；此处作名词，意为企业在社会责任方面的“立场和表现”。","forms":["stand"]},{"w":"account for","pos":"phr.","cn":"此处意为“解释、构成……的原因”，不是“占据比例”。","sec":"text3","sec_label":"Text 3","ctx":"Their analysis ruled out the possibility that it was firms' political influence, rather than their CSR stand, that accounted for the leniency: Companies that contributed ","note":"此处意为“解释、构成……

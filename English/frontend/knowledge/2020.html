，口语中意为“赢得、拿下”。","forms":["bag"]},{"w":"prestigious","pos":"adj.","cn":"有声望的、享有盛誉的。","sec":"text1","sec_label":"Text 1","ctx":"Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a so","note":"有声望的、享有盛誉的。","forms":["prestigious"]},{"w":"sought-after","pos":"词","cn":"广受追捧的、抢手的。","sec":"text1","sec_label":"Text 1","ctx":"Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a so","note":"广受追捧的、抢手的。","forms":["sought-after"]},{"w":"fever","pos":"词","cn":"常见义为“发烧”；此处比喻一种狂热状态。","sec":"text1","sec_label":"Text 1","ctx":"A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit wo","note":"常见义为“发烧”；此处比喻一种狂热状态。","forms":["fever"]},{"w":"reinvent oneself","pos":"phr.","cn":"重新塑造自身定位或形象，并非字面上的“重新发明自己”。","sec":"text1","sec_label":"Text 1","ctx":"A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit wo","note":"重新塑造自身定位或形象，并非字面上的“重新发明自己”。","forms":["reinvent oneself"]},{"w":"be on the verge of doing","pos":"phr.","cn":"濒临、即将做某事。","sec":"text1","sec_label":"Text 1","ctx":"A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit wo","note":"濒临、即将做某事。","forms":["be on the verge of doing"]},{"w":"in one's desperation to do","pos":"phr.","cn":"由于急切甚至不顾一切地想做某事。","sec":"text1","sec_label":"Text 1","ctx":"A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit wo","note":"由于急切甚至不顾一切地想做某事。","forms":["in one's desperation to do"]},{"w":"post-Brexit world","pos":"phr.","cn":"英国脱欧后的世界格局。","sec":"text1","sec_label":"Text 1","ctx":"A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit wo","note":"英国脱欧后的世界格局。","forms":["post-Brexit world"]},{"w":"cure-all","pos":"词","cn":"能解决一切问题的办法、万灵药。","sec":"text1","sec_label":"Text 1","ctx":"It is also wise to recall that such titles are not a cure-all.","note":"能解决一切问题的办法、万灵药。","forms":["cure-all"]},{"w":"prominence","pos":"n.","cn":"受关注、显眼的地位；此处不是“杰出人物”。","sec":"text1","sec_label":"Text 1","ctx":"A badly run \"year of culture\" washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community.","note":"受关注、显眼的地位；此处不是“杰出人物”。","forms":["prominence"]},{"w":"for a spell","pos":"phr.","cn":"一小段时间、暂时；spell 在此不表示“拼写”或“咒语”。","sec":"text1","sec_label":"Text 1","ctx":"A badly run \"year of culture\" washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community.","note":"一小段时间、暂时；spell 在此不表示“拼写”或“咒语”。","forms":["for a spell"]},{"w":"wash in and wash out","pos":"phr.","cn":"像潮水般涌入又退去，比喻活动来得快、去得也快。","sec":"text1","sec_label":"Text 1","ctx":"A badly run \"year of culture\" washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community.","note":"像潮水般涌入又退去，比喻活动来得快、去得也快。","forms":["wash in and wash out"]},{"w":"lasting benefits","pos":"phr.","cn":"持久的收益。","sec":"text1","sec_label":"Text 1","ctx":"A badly run \"year of culture\" washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community.","note":"持久的收益。","forms":["lasting benefits"]},{"w":"holder","pos":"词","cn":"此处指某项称号的获得者或拥有者。","sec":"text1","sec_label":"Text 1","ctx":"The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year.","note":"此处指某项称号的获得者或拥有者。","forms":["holder"]},{"w":"good press","pos":"phr.","cn":"媒体的正面报道，而非“优质出版社”。","sec":"text1","sec_label":"Text 1","ctx":"The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year.","note":"媒体的正面报道，而非“优质出版社”。","forms":["good press"]},{"w":"a great deal more than","pos":"phr.","cn":"远不只是……。","sec":"text1","sec_label":"Text 1","ctx":"The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year.","note":"远不只是……。","forms":["a great deal more than"]},{"w":"high-profile","pos":"词","cn":"备受关注的、高规格的。","sec":"text1","sec_label":"Text 1","ctx":"The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year.","note":"备受关注的、高规格的。","forms":["high-profile"]},{"w":"nudge","pos":"词","cn":"本义为“轻推”；此处指以渐进方式促使城市形象发生改变。","sec":"text1","sec_label":"Text 1","ctx":"They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.","note":"本义为“轻推”；此处指以渐进方式促使城市形象发生改变。","forms":["nudge"]},{"w":"light","pos":"词","cn":"此处意为“看待事物的方式或角度”。","sec":"text1","sec_label":"Text 1","ctx":"They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.","note":"此处意为“看待事物的方式或角度”。","forms":["light"]},{"w":"get sth. right","pos":"phr.","cn":"把某事做对、做好，并非“获得正确的东西”。","sec":"text1","sec_label":"Text 1","ctx":"It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural or","note":"把某事做对、做好，并非“获得正确的东西”。","forms":["get sth. right"]},{"w":"vision","pos":"n.","cn":"此处指对未来的远见和规划能力，不是“视力”。","sec":"text1","sec_label":"Text 1","ctx":"It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural or","note":"此处指对未来的远见和规划能力，不是“视力”。","forms":["vision"]},{"w":"powerhouse","pos":"词","cn":"常见义与发电设施有关；此处比喻在某一领域实力强劲、影响突出的中心。","sec":"text1","sec_label":"Text 1","ctx":"But it can be done: Glasgow's year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhous","note":"常见义与发电设施有关；此处比喻在某一领域实力强劲、影响突出的中心。","forms":["powerhouse"]},{"w":"a complex series of factors","pos":"phr.","cn":"一系列相互交织的因素。","sec":"text1","sec_label":"Text 1","ctx":"But it can be done: Glasgow's year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhous","note":"一系列相互交织的因素。","forms":["a complex series of factors"]},{"w":"turn A into B","pos":"phr.","cn":"使 A 转变为 B。","sec":"text1","sec_label":"Text 1","ctx":"But it can be done: Glasgow's year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhous","note":"使 A 转变为 B。","forms":["turn A into B"]},{"w":"high street","pos":"phr.","cn":"英国城镇的主要商业街，也可泛指当地实体零售业，不能直译为“高街”。","sec":"text1","sec_label":"Text 1","ctx":"A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities—helping sustain its high street, supporting local facilities and above all","note":"英国城镇的主要商业街，也可泛指当地实体零售业，不能直译为“高街”。","forms":["high street"]},{"w":"peculiarity","pos":"n.","cn":"此处指一地独有的特点，并非贬义的“怪癖”。","sec":"text1","sec_label":"Text 1","ctx":"A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities—helping sustain its high street, supporting local facilities and above all","note":"此处指一地独有的特点，并非贬义的“怪癖”。","forms":["peculiarity"]},{"w":"not just ... but ...","pos":"phr.","cn":"不只是……，还在于……。","sec":"text1","sec_label":"Text 1","ctx":"A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities—helping sustain its high street, supporting local facilities and above all","note":"不只是……，还在于……。","forms":["not just ... but ..."]},{"w":"sustain its high street","pos":"phr.","cn":"维持城镇主要商业街的商业活力与生机。","sec":"text1","sec_label":"Text 1","ctx":"A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities—helping sustain its high street, supporting local facilities and above all","note":"维持城镇主要商业街的商业活力与生机。","forms":["sustain its high street"]},{"w":"support local facilities","pos":"phr.","cn":"支持当地公共设施。","sec":"text1","sec_label":"Text 1","ctx":"A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities—helping sustain its high street, supporting local facilities and above all","note":"支持当地公共设施。","forms":["support local facilities"]},{"w":"above all","pos":"phr.","cn":"最重要的是、尤其是。","sec":"text1","sec_label":"Text 1","ctx":"A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities—helping sustain its high street, supporting local facilities and above all","note":"最重要的是、尤其是。","forms":["above all"]},{"w":"turn ... into action","pos":"phr.","cn":"把……转化为行动、将……付诸实施。","sec":"text1","sec_label":"Text 1","ctx":"Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.","note":"把……转化为行动、将……付诸实施。","forms":["turn ... into action"]},{"w":"hope-filled","pos":"v./adj.","cn":"充满希望的。","sec":"text1","sec_label":"Text 1","ctx":"Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.","note":"充满希望的。","forms":["hope-filled"]},{"w":"a licence to print money","pos":"phr.","cn":"字面义为“印钞许可证”；此处比喻几乎稳赚不赔、利润极高的生意。","sec":"text2","sec_label":"Text 2","ctx":"Scientific publishing has long been a licence to print money.","note":"字面义为“印钞许可证”；此处比喻几乎稳赚不赔、利润极高的生意。","forms":["a licence to print money"]},{"w":"without monetary reward","pos":"phr.","cn":"没有金钱报酬、无偿地。","sec":"text2","sec_label":"Text 2","ctx":"Scientists need journals in which to publish their research, so they will supply the articles without monetary reward.","note":"没有金钱报酬、无偿地。","forms":["without monetary reward"]},{"w":"a journal in which to publish","pos":"phr.","cn":"用于发表论文的期刊。","sec":"text2","sec_label":"Text 2","ctx":"Scientists need journals in which to publish their research, so they will supply the articles without monetary reward.","note":"用于发表论文的期刊。","forms":["a journal in which to publish"]},{"w":"peer review","pos":"phr.","cn":"同行评审，即由同领域专家审查论文质量的机制。","sec":"text2","sec_label":"Text 2","ctx":"Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific ","note":"同行评审，即由同领域专家审查论文质量的机制。","forms":["peer review"]},{"w":"status","pos":"词","cn":"此处指学术地位和专业声望，而非一般的“状态”。","sec":"text2","sec_label":"Text 2","ctx":"Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific ","note":"此处指学术地位和专业声望，而非一般的“状态”。","forms":["status"]},{"w":"secure","pos":"词","cn":"常见义为“安全的”；此处作动词，意为“获得、取得”。","sec":"text2","sec_label":"Text 2","ctx":"With the content of papers secured for free, the publisher needs only find a market for its journal.","note":"常见义为“安全的”；此处作动词，意为“获得、取得”。","forms":["secure"]},{"w":"price sensitive","pos":"phr.","cn":"对价格变动敏感；不敏感意味着即便价格上涨仍可能继续购买。","sec":"text2","sec_label":"Text 2","ctx":"Until this century, university libraries were not very price sensitive.","note":"对价格变动敏感；不敏感意味着即便价格上涨仍可能继续购买。","forms":["price sensitive"]},{"w":"margin","pos":"词","cn":"此处指利润率，不是“页边空白”或一般的“差距”。","sec":"text2","sec_label":"Text 2","ctx":"Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.","note":"此处指利润率，不是“页边空白”或一般的“差距”。","forms":["margin"]},{"w":"existential crisis","pos":"phr.","cn":"生存危机，指行业的存续本身受到威胁。","sec":"text2","sec_label":"Text 2","ctx":"Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.","note":"生存危机，指行业的存续本身受到威胁。","forms":["existential crisis"]},{"w":"profit margin","pos":"phr.","cn":"利润率。","sec":"text2","sec_label":"Text 2","ctx":"Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.","note":"利润率。","forms":["profit margin"]},{"w":"routinely report","pos":"phr.","cn":"经常达到或报告出某一水平。","sec":"text2","sec_label":"Text 2","ctx":"Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.","note":"经常达到或报告出某一水平。","forms":["routinely report"]},{"w":"giant","pos":"词","cn":"此处指行业巨头、大型企业，不是“巨人”。","sec":"text2","sec_label":"Text 2","ctx":"The Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alo","note":"此处指行业巨头、大型企业，不是“巨人”。","forms":["giant"]},{"w":"publicly funded","pos":"phr.","cn":"由公共财政或公共资金资助的。","sec":"text2","sec_label":"Text 2","ctx":"The Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alo","note":"由公共财政或公共资金资助的。","forms":["publicly funded"]},{"w":"enable sb. to do sth.","pos":"phr.","cn":"使某人能够做某事。","sec":"text2","sec_label":"Text 2","ctx":"The Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alo","note":"使某人能够做某事。","forms":["enable sb. to do sth."]},{"w":"rise unstoppably","pos":"phr.","cn":"不可阻挡地上升。","sec":"text2","sec_label":"Text 2","ctx":"The Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alo","note":"不可阻挡地上升。","forms":["rise unstoppably"]},{"w":"drastic","pos":"adj.","cn":"激烈的、极端的，强调手段力度大。","sec":"text2","sec_label":"Text 2","ctx":"The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims","note":"激烈的、极端的，强调手段力度大。","forms":["drastic"]},{"w":"paywalled","pos":"v./adj.","cn":"受付费墙限制的，须付费或订阅后才能访问。","sec":"text2","sec_label":"Text 2","ctx":"The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims","note":"受付费墙限制的，须付费或订阅后才能访问。","forms":["paywalled"]},{"w":"the emergence of","pos":"phr.","cn":"……的出现、兴起。","sec":"text2","sec_label":"Text 2","ctx":"The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims","note":"……的出现、兴起。","forms":["the emergence of"]},{"w":"offer access to","pos":"phr.","cn":"提供对……的访问权限。","sec":"text2","sec_label":"Text 2","ctx":"The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims","note":"提供对……的访问权限。","forms":["offer access to"]},{"w":"legitimacy","pos":"词","cn":"此处不仅是法律上的合法性，更指制度在使用者眼中的正当性与认可度。","sec":"text2","sec_label":"Text 2","ctx":"The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users","note":"此处不仅是法律上的合法性，更指制度在使用者眼中的正当性与认可度。","forms":["legitimacy"]},{"w":"ecosystem","pos":"词","cn":"此处比喻由出版商、研究人员、大学等共同构成的出版体系。","sec":"text2","sec_label":"Text 2","ctx":"The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users","note":"此处比喻由出版商、研究人员、大学等共同构成的出版体系。","forms":["ecosystem"]},{"w":"rely on sb. doing sth.","pos":"phr.","cn":"依靠某人做某事。","sec":"text2","sec_label":"Text 2","ctx":"The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users","note":"依靠某人做某事。","forms":["rely on sb. doing sth."]},{"w":"pass on copies","pos":"phr.","cn":"把副本转交给他人。","sec":"text2","sec_label":"Text 2","ctx":"The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users","note":"把副本转交给他人。","forms":["pass on copies"]},{"w":"open access publishing","pos":"phr.","cn":"开放获取出版，即读者无需付费即可读取研究成果的出版模式。","sec":"text2","sec_label":"Text 2","ctx":"In Britain the move towards open access publishing has been driven by funding bodies.","note":"开放获取出版，即读者无需付费即可读取研究成果的出版模式。","forms":["open access publishing"]},{"w":"funding bodies","pos":"phr.","cn":"科研资助机构。","sec":"text2","sec_label":"Text 2","ctx":"In Britain the move towards open access publishing has been driven by funding bodies.","note":"科研资助机构。","forms":["funding bodies"]},{"w":"in some ways","pos":"phr.","cn":"在某些方面；这一限定语意味着成功并不全面，为下一段的转折埋下伏笔。","sec":"text2","sec_label":"Text 2","ctx":"In some ways it has been very successful.","note":"在某些方面；这一限定语意味着成功并不全面，为下一段的转折埋下伏笔。","forms":["in some ways"]},{"w":"term","pos":"词","cn":"此处指规定或条款，而不是“学期”或单纯的“术语”。","sec":"text2","sec_label":"Text 2","ctx":"More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a yea","note":"此处指规定或条款，而不是“学期”或单纯的“术语”。","forms":["term"]},{"w":"general release","pos":"phr.","cn":"向所有人公开发布、全面开放。","sec":"text2","sec_label":"Text 2","ctx":"More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a yea","note":"向所有人公开发布、全面开放。","forms":["general release"]},{"w":"work out","pos":"phr.","cn":"此处意为“结果是、最终证明为”，不是“锻炼”或“计算出”。","sec":"text2","sec_label":"Text 2","ctx":"Yet the new system has not yet worked out any cheaper for the universities.","note":"此处意为“结果是、最终证明为”，不是“锻炼”或“计算出”。","forms":["work out"]},{"w":"product","pos":"词","cn":"此处指发表的论文内容，而不是普通实物商品。","sec":"text2","sec_label":"Text 2","ctx":"Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article.","note":"此处指发表的论文内容，而不是普通实物商品。","forms":["product"]},{"w":"writer","pos":"词","cn":"此处指论文作者、研究人员。","sec":"text2","sec_label":"Text 2","ctx":"Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article.","note":"此处指论文作者、研究人员。","forms":["writer"]},{"w":"range from ... to ...","pos":"phr.","cn":"范围从……到……不等。","sec":"text2","sec_label":"Text 2","ctx":"These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it.","note":"范围从……到……不等。","forms":["range from ... to ..."]},{"w":"the more ..., the more ...","pos":"phr.","cn":"越……，就越……。","sec":"text2","sec_label":"Text 2","ctx":"These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it.","note":"越……，就越……。","forms":["the more ..., the more ..."]},{"w":"at a rate above inflation","pos":"phr.","cn":"以高于通货膨胀率的速度。","sec":"text2","sec_label":"Text 2","ctx":"A report last year pointed out tha playing field","pos":"phr.","cn":"创造公平的竞争环境，使各方处于同等起点。","sec":"text3","sec_label":"Text 3","ctx":"Progressives often support diversity mandates as a path to equality and a way to level the playing field.","note":"创造公平的竞争环境，使各方处于同等起点。","forms":["level the playing field"]},{"w":"virtue-signaling","pos":"adj.","cn":"通过公开表态或行动展示自己道德正确，却未必解决实际问题的“美德展示”。","sec":"text3","sec_label":"Text 3","ctx":"But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.","note":"通过公开表态或行动展示自己道德正确，却未必解决实际问题的“美德展示”。","forms":["virtue-signaling"]},{"w":"average people","pos":"phr.","cn":"普通人、一般民众，不是数学意义上的“平均的人”。","sec":"text3","sec_label":"Text 3","ctx":"But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.","note":"普通人、一般民众，不是数学意义上的“平均的人”。","forms":["average people"]},{"w":"a case in point","pos":"phr.","cn":"恰当的例证、典型案例。","sec":"text3","sec_label":"Text 3","ctx":"A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure \"gender parity\" on boards and commissions, p","note":"恰当的例证、典型案例。","forms":["a case in point"]},{"w":"board","pos":"词","cn":"此处指承担管理或决策职能的委员会，而非“木板”。","sec":"text3","sec_label":"Text 3","ctx":"A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure \"gender parity\" on boards and commissions, p","note":"此处指承担管理或决策职能的委员会，而非“木板”。","forms":["board"]},{"w":"sponsor a bill","pos":"phr.","cn":"发起、提出一项法案。","sec":"text3","sec_label":"Text 3","ctx":"A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure \"gender parity\" on boards and commissions, p","note":"发起、提出一项法案。","forms":["sponsor a bill"]},{"w":"gender parity","pos":"phr.","cn":"性别人数或代表比例均等。","sec":"text3","sec_label":"Text 3","ctx":"A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure \"gender parity\" on boards and commissions, p","note":"性别人数或代表比例均等。","forms":["gender parity"]},{"w":"impose government quotas","pos":"phr.","cn":"实行由政府强制规定的配额。","sec":"text3","sec_label":"Text 3","ctx":"In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas.","note":"实行由政府强制规定的配额。","forms":["impose government quotas"]},{"w":"elite women","pos":"phr.","cn":"精英女性；这一限定暗示直接受益者并非普通女性。","sec":"text3","sec_label":"Text 3","ctx":"In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas.","note":"精英女性；这一限定暗示直接受益者并非普通女性。","forms":["elite women"]},{"w":"set aside","pos":"phr.","cn":"此处意为“专门保留、预留”，不是“暂且不考虑”。","sec":"text3","sec_label":"Text 3","ctx":"If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.","note":"此处意为“专门保留、预留”，不是“暂且不考虑”。","forms":["set aside"]},{"w":"on the basis of sex","pos":"phr.","cn":"以性别为依据。","sec":"text3","sec_label":"Text 3","ctx":"In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.","note":"以性别为依据。","forms":["on the basis of sex"]},{"w":"unconstitutional","pos":"adj.","cn":"违反宪法的。","sec":"text3","sec_label":"Text 3","ctx":"In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.","note":"违反宪法的。","forms":["unconstitutional"]},{"w":"frown on","pos":"phr.","cn":"不赞成、不认可，字面义为“对……皱眉”。","sec":"text3","sec_label":"Text 3","ctx":"The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest.","note":"不赞成、不认可，字面义为“对……皱眉”。","forms":["frown on"]},{"w":"classification","pos":"n.","cn":"在法律语境中指按特定属性对人群进行分类并区别对待。","sec":"text3","sec_label":"Text 3","ctx":"The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest.","note":"在法律语境中指按特定属性对人群进行分类并区别对待。","forms":["classification"]},{"w":"rule","pos":"词","cn":"此处作动词，意为法院“裁定”，不是“统治”或“规则”。","sec":"text3","sec_label":"Text 3","ctx":"Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitution","note":"此处作动词，意为法院“裁定”，不是“统治”或“规则”。","forms":["rule"]},{"w":"prior discrimination","pos":"phr.","cn":"以往存在的歧视。","sec":"text3","sec_label":"Text 3","ctx":"Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitution","note":"以往存在的歧视。","forms":["prior discrimination"]},{"w":"constitutional guarantee","pos":"phr.","cn":"宪法保障。","sec":"text3","sec_label":"Text 3","ctx":"Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitution","note":"宪法保障。","forms":["constitutional guarantee"]},{"w":"equal protection","pos":"phr.","cn":"平等保护原则。","sec":"text3","sec_label":"Text 3","ctx":"Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitution","note":"平等保护原则。","forms":["equal protection"]},{"w":"mirror","pos":"词","cn":"此处作动词，意为“反映、与……相对应”。","sec":"text3","sec_label":"Text 3","ctx":"Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?","note":"此处作动词，意为“反映、与……相对应”。","forms":["mirror"]},{"w":"so what?","pos":"phr.","cn":"那又怎样？表示该事实本身不足以证明必须采取所提措施。","sec":"text3","sec_label":"Text 3","ctx":"Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?","note":"那又怎样？表示该事实本身不足以证明必须采取所提措施。","forms":["so what?"]},{"w":"government interference","pos":"phr.","cn":"政府干预。","sec":"text3","sec_label":"Text 3","ctx":"The number of women on corporate boards has been steadily increasing without government interference.","note":"政府干预。","forms":["government interference"]},{"w":"steadily increase","pos":"phr.","cn":"稳步增加。","sec":"text3","sec_label":"Text 3","ctx":"The number of women on corporate boards has been steadily increasing without government interference.","note":"稳步增加。","forms":["steadily increase"]},{"w":"share","pos":"词","cn":"此处指比例、份额，不是“分享”。","sec":"text3","sec_label":"Text 3","ctx":"According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.","note":"此处指比例、份额，不是“分享”。","forms":["share"]},{"w":"qualification","pos":"n.","cn":"此处指入选董事会的资格或衡量条件，而不只是一纸“资质证书”。","sec":"text3","sec_label":"Text 3","ctx":"Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards.","note":"此处指入选董事会的资格或衡量条件，而不只是一纸“资质证书”。","forms":["qualification"]},{"w":"board membership","pos":"phr.","cn":"董事会成员资格。","sec":"text3","sec_label":"Text 3","ctx":"Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards.","note":"董事会成员资格。","forms":["board membership"]},{"w":"lead to","pos":"phr.","cn":"导致。","sec":"text3","sec_label":"Text 3","ctx":"Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards.","note":"导致。","forms":["lead to"]},{"w":"pool","pos":"词","cn":"此处指可供选择的人才储备，不是“水池”。","sec":"text3","sec_label":"Text 3","ctx":"Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the ,"forms":["outlet"]},{"w":"refer to A as B","pos":"phr.","cn":"把 A 称为 B。","sec":"text4","sec_label":"Text 4","ctx":"Many French politicians and media outlets have referred to this as a \"GAFA tax,\" meaning that it is designed to apply primarily to companies such as Google, Apple, Facebo","note":"把 A 称为 B。","forms":["refer to A as B"]},{"w":"apply primarily to","pos":"phr.","cn":"主要适用于、主要针对。","sec":"text4","sec_label":"Text 4","ctx":"Many French politicians and media outlets have referred to this as a \"GAFA tax,\" meaning that it is designed to apply primarily to companies such as Google, Apple, Facebo","note":"主要适用于、主要针对。","forms":["apply primarily to"]},{"w":"GAFA","pos":"词","cn":"Google、Apple、Facebook、Amazon 四家公司名称的首字母缩写。","sec":"text4","sec_label":"Text 4","ctx":"Many French politicians and media outlets have referred to this as a \"GAFA tax,\" meaning that it is designed to apply primarily to companies such as Google, Apple, Facebo","note":"Google、Apple、Facebook、Amazon 四家公司名称的首字母缩写。","forms":["GAFA"]},{"w":"measure","pos":"词","cn":"常见义为“测量、尺度”；此处作名词，指已经通过的“措施、法案”。","sec":"text4","sec_label":"Text 4","ctx":"The digital services tax now awaits the signature of President Emmanuel Macron, who has expressed support for the measure, and it could go into effect within the next few","note":"常见义为“测量、尺度”；此处作名词，指已经通过的“措施、法案”。","forms":["measure"]},{"w":"await the signature of","pos":"phr.","cn":"等待……签署。","sec":"text4","sec_label":"Text 4","ctx":"The digital services tax now awaits the signature of President Emmanuel Macron, who has expressed support for the measure, and it could go into effect within the next few","note":"等待……签署。","forms":["await the signature of"]},{"w":"go into effect","pos":"phr.","cn":"生效、开始实施。","sec":"text4","sec_label":"Text 4","ctx":"The digital services tax now awaits the signature of President Emmanuel Macron, who has expressed support for the measure, and it could go into effect within the next few","note":"生效、开始实施。","forms":["go into effect"]},{"w":"spark significant controversy","pos":"phr.","cn":"引发重大争议。","sec":"text4","sec_label":"Text 4","ctx":"But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against Americ","note":"引发重大争议。","forms":["spark significant controversy"]},{"w":"open an investigation into whether ...","pos":"phr.","cn":"启动调查，以查明是否……。","sec":"text4","sec_label":"Text 4","ctx":"But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against Americ","note":"启动调查，以查明是否……。","forms":["open an investigation into whether ..."]},{"w":"discriminate against","pos":"phr.","cn":"歧视；对……给予不利的差别待遇。","sec":"text4","sec_label":"Text 4","ctx":"But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against Americ","note":"歧视；对……给予不利的差别待遇。","forms":["discriminate against"]},{"w":"in turn","pos":"phr.","cn":"继而、转而，表示连锁结果。","sec":"text4","sec_label":"Text 4","ctx":"But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against Americ","note":"继而、转而，表示连锁结果。","forms":["in turn"]},{"w":"trade sanctions against","pos":"phr.","cn":"针对……的贸易制裁。","sec":"text4","sec_label":"Text 4","ctx":"But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against Americ","note":"针对……的贸易制裁。","forms":["trade sanctions against"]},{"w":"a unilateral move","pos":"phr.","cn":"单边行动，即一国未等待多边共识而自行采取的措施。","sec":"text4","sec_label":"Text 4","ctx":"The French tax is not just a unilateral move by one country in need of revenue.","note":"单边行动，即一国未等待多边共识而自行采取的措施。","forms":["a unilateral move"]},{"w":"in need of revenue","pos":"phr.","cn":"需要财政收入、面临增收需求。","sec":"text4","sec_label":"Text 4","ctx":"The French tax is not just a unilateral move by one country in need of revenue.","note":"需要财政收入、面临增收需求。","forms":["in need of revenue"]},{"w":"an alphabet soup of","pos":"phr.","cn":"字面是“字母汤”；","sec":"text4","sec_label":"Text 4","ctx":"Instead, the digital services tax is part of a much larger trend, with countries over the past few years proposing or putting in place an alphabet soup of new internation","note":"字面是“字母汤”；","forms":["an alphabet soup of"]},{"w":"be part of a much larger trend","pos":"phr.","cn":"是一股更大趋势的一部分。","sec":"text4","sec_label":"Text 4","ctx":"Instead, the digital services tax is part of a much larger trend, with countries over the past few years proposing or putting in place an alphabet soup of new internation","note":"是一股更大趋势的一部分。","forms":["be part of a much larger trend"]},{"w":"put in place","pos":"phr.","cn":"建立并实施一项制度或措施。","sec":"text4","sec_label":"Text 4","ctx":"Instead, the digital services tax is part of a much larger trend, with countries over the past few years proposing or putting in place an alphabet soup of new internation","note":"建立并实施一项制度或措施。","forms":["put in place"]},{"w":"tax provision","pos":"phr.","cn":"税收条款、税制规定。","sec":"text4","sec_label":"Text 4","ctx":"Instead, the digital services tax is part of a much larger trend, with countries over the past few years proposing or putting in place an alphabet soup of new internation","note":"税收条款、税制规定。","forms":["tax provision"]},{"w":"diverted profits tax","pos":"phr.","cn":"转移利润税，针对跨国企业把利润转移到低税地区的安排。","sec":"text4","sec_label":"Text 4","ctx":"They have included Britain's DPT. (diverted profits tax), Australia's MAAL (multinational anti-avoidance law), and India's SEP (significant economic presence) test, to na","note":"转移利润税，针对跨国企业把利润转移到低税地区的安排。","forms":["diverted profits tax"]},{"w":"multinational anti-avoidance law","pos":"phr.","cn":"跨国反避税法。","sec":"text4","sec_label":"Text 4","ctx":"They have included Britain's DPT. (diverted profits tax), Australia's MAAL (multinational anti-avoidance law), and India's SEP (significant economic presence) test, to na","note":"跨国反避税法。","forms":["multinational anti-avoidance law"]},{"w":"significant economic presence","pos":"phr.","cn":"显著经济存在，以经济活动而非实体场所判断税收联系。","sec":"text4","sec_label":"Text 4","ctx":"They have included Britain's DPT. (diverted profits tax), Australia's MAAL (multinational anti-avoidance law), and India's SEP (significant economic presence) test, to na","note":"显著经济存在，以经济活动而非实体场所判断税收联系。","forms":["significant economic presence"]},{"w":"to name but a few","pos":"phr.","cn":"仅举几例，暗示实际项目远不止这些。","sec":"text4","sec_label":"Text 4","ctx":"They have included Britain's DPT. (diverted profits tax), Australia's MAAL (multinational anti-avoidance law), and India's SEP (significant economic presence) test, to na","note":"仅举几例，暗示实际项目远不止这些。","forms":["to name but a few"]},{"w":"contemplate","pos":"v.","cn":"此处不是单纯“注视”，而是“认真考虑是否采取”。","sec":"text4","sec_label":"Text 4","ctx":"At the same time, the European Union, Spain, Britain and several other countries have all seriously contemplated digital services taxes.","note":"此处不是单纯“注视”，而是“认真考虑是否采取”。","forms":["contemplate"]},{"w":"seriously contemplate doing sth.","pos":"phr.","cn":"认真考虑做某事。","sec":"text4","sec_label":"Text 4","ctx":"At the same time, the European Union, Spain, Britain and several other countries have all seriously contemplated digital services taxes.","note":"认真考虑做某事。","forms":["seriously contemplate doing sth."]},{"w":"specifics","pos":"词","cn":"此处作复数名词，指“具体细节、具体规定”，不是形容词“具体的”。","sec":"text4","sec_label":"Text 4","ctx":"These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a r","note":"此处作复数名词，指“具体细节、具体规定”，不是形容词“具体的”。","forms":["specifics"]},{"w":"grant","pos":"词","cn":"常见义可为“拨款”；此处作动词，意为“正式赋予（权利）”。","sec":"text4","sec_label":"Text 4","ctx":"These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a r","note":"常见义可为“拨款”；此处作动词，意为“正式赋予（权利）”。","forms":["grant"]},{"w":"differ in their specifics","pos":"phr.","cn":"在具体内容上有所不同。","sec":"text4","sec_label":"Text 4","ctx":"These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a r","note":"在具体内容上有所不同。","forms":["differ in their specifics"]},{"w":"tax sb. on income","pos":"phr.","cn":"就某人的收入向其征税。","sec":"text4","sec_label":"Text 4","ctx":"These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a r","note":"就某人的收入向其征税。","forms":["tax sb. on income"]},{"w":"have a right to do sth.","pos":"phr.","cn":"有权做某事。","sec":"text4","sec_label":"Text 4","ctx":"These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a r","note":"有权做某事。","forms":["have a right to do sth."]},{"w":"share a view that ...","pos":"phr.","cn":"共同持有……看法；that 从句解释 view 的内容。","sec":"text4","sec_label":"Text 4","ctx":"In other words, they all share a view that the international tax system has failed to keep up with the current economy.","note":"共同持有……看法；that 从句解释 view 的内容。","forms":["share a view that ..."]},{"w":"keep up with","pos":"phr.","cn":"跟上……的发展或变化。","sec":"text4","sec_label":"Text 4","ctx":"In other words, they all share a view that the international tax system has failed to keep up with the current economy.","note":"跟上……的发展或变化。","forms":["keep up with"]},{"w":"in response to","pos":"phr.","cn":"作为对……的回应。","sec":"text4","sec_label":"Text 4","ctx":"In response to these many unilateral measures, the Organization for Economic Cooperation and Development (OECD) is currently working with 131 countries to reach a consens","note":"作为对……的回应。","forms":["in response to"]},{"w":"work with sb. to do sth.","pos":"phr.","cn":"与某方合作做某事。","sec":"text4","sec_label":"Text 4","ctx":"In response to these many unilateral measures, the Organization for Economic Cooperation and Development (OECD) is currently working with 131 countries to reach a consens","note":"与某方合作做某事。","forms":["work with sb. to do sth."]},{"w":"reach a consensus on","pos":"phr.","cn":"就……达成共识。","sec":"text4","sec_label":"Text 4","ctx":"In response to these many unilateral measures, the Organization for Economic Cooperation and Development (OECD) is currently working with 131 countries to reach a consens","note":"就……达成共识。","forms":["reach a consensus on"]},{"w":"by the end of 2020","pos":"phr.","cn":"最迟在 2020 年底前；by 强调截止时间。","sec":"text4","sec_label":"Text 4","ctx":"In response to these many unilateral measures, the Organization for Economic Cooperation and Development (OECD) is currently working with 131 countries to reach a consens","note":"最迟在 2020 年底前；by 强调截止时间。","forms":["by the end of 2020"]},{"w":"hold","pos":"词","cn":"常见义为“拿着、持有”；what the future holds 中意为","sec":"text4","sec_label":"Text 4","ctx":"Both France and the United States are involved in the organization's work, but France's digital services tax and the American response raise questions about what the futu","note":"常见义为“拿着、持有”；what the future holds 中意为","forms":["hold"]},{"w":"be involved in","pos":"phr.","cn":"参与……。","sec":"text4","sec_label":"Text 4","ctx":"Both France and the United States are involved in the organization's work, but France's digital services tax and the American response raise questions about what the futu","note":"参与……。","forms":["be involved in"]},{"w":"raise questions about","pos":"phr.","cn":"使人对……产生疑问。","sec":"text4","sec_label":"Text 4","ctx":"Both France and the United States are involved in the organization's work, but France's digital services tax and the American response raise questions about what the futu","note":"使人对……产生疑问。","forms":["raise questions about"]},{"w":"what the future holds for ...","pos":"phr.","cn":"……未来将会怎样。","sec":"text4","sec_label":"Text 4","ctx":"Both France and the United States are involved in the organization's work, but France's digital services tax and the American response raise questions about what the futu","note":"……未来将会怎样。","forms":["what the future holds for ..."]},{"w":"suit","pos":"词","cn":"常见义为“西装、诉讼”；follow suit 是固定表达，","sec":"text4","sec_label":"Text 4","ctx":"France's planned tax is a clear warning: Unless a broad consensus can be reached on reforming the international tax system, other nations are likely to follow suit, and A","note":"常见义为“西装、诉讼”；follow suit 是固定表达，","forms":["suit"]},{"w":"prove","pos":"词","cn":"此处作系动词，意为“结果表明是、最终成为”。","sec":"text4","sec_label":"Text 4","ctx":"France's planned tax is a clear warning: Unless a broad consensus can be reached on reforming the international tax system, other nations are likely to follow suit, and A","note":"此处作系动词，意为“结果表明是、最终成为”。","forms":["prove"]},{"w":"reach a broad consensus on","pos":"phr.","cn":"就……达成广泛共识。","sec":"text4","sec_label":"Text 4","ctx":"France's planned tax is a clear warning: Unless a broad consensus can be reached on reforming the international tax system, other nations are likely to follow suit, and A","note":"就……达成广泛共识。","forms":["reach a broad consensus on"]},{"w":"follow suit","pos":"phr.","cn":"照着做、跟进。","sec":"text4","sec_label":"Text 4","ctx":"France's planned tax is a clear warning: Unless a broad consensus can be reached on reforming the international tax system, other nations are likely to follow suit, and A","note":"照着做、跟进。","forms":["follow suit"]},{"w":"a cascade of","pos":"phr.","cn":"一连串接踵而来的……，强调连锁累积。","sec":"text4","sec_label":"Text 4","ctx":"France's planned tax is a clear warning: Unless a broad consensus can be reached on reforming the international tax system, other nations are likely to follow suit, and A","note":"一连串接踵而来的……，强调连锁累积。","forms":["a cascade of"]},{"w":"burdensome and costly","pos":"phr.","cn":"负担沉重且代价高昂。","sec":"text4","sec_label":"Text 4","ctx":"France's planned tax is a clear warning: Unless a broad consensus can be reached on reforming the international tax system, other nations are likely to follow suit, and A","note":"负担沉重且代价高昂。","forms":["burdensome and costly"]}],"sentences":[{"id":"2020-T1-P1-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"A group of Labour MPs, among them Yvette Cooper, are bringing in the new year with a call to institute a UK \"town of culture\" award.","core":"A group of Labour MPs are bringing in the new year with a call.","structure":"among them Yvette Cooper 是插入语，补充说明议员成员；to institute ... 作后置定语，说明呼吁的具体内容。","key":"bring in the new year：迎接新年；此处表示在新年伊始采取行动。；a call to do sth.：做某事的呼吁。；institute an award：设立一项奖项或制度。","zh":"包括伊薇特·库珀在内的一批工党议员，在新年伊始呼吁英国设立一个“文化之镇”奖项。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T1-P1-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"The proposal is that it should sit alongside the existing city of culture title, which was held by Hull in 2017, and has been awarded to Coventry for 2021.","core":"The proposal is that it should sit alongside the existing title.","structure":"that 引导表语从句；which 引导非限制性定语从句，指代 the existing city of culture title；was held 与 has been awarded 说明该称号在不同年份的归属。","key":"sit alongside：常见义为“坐在……旁边”；此处意为“与……并列存在”。；hold a title：此处指“获得并拥有某项称号”，不是“握住”。","zh":"该提议主张，这一奖项应与现有的“文化之城”称号并列；后者在 2017 年由赫尔获得，2021 年的称号则已授予考文垂。","tip":"it 指拟议中的 town of culture award，which 则指已有的 city of culture title，二者不能混淆。"},{"id":"2020-T1-P1-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Cooper and her colleagues argue that the success of the crown for Hull, where it brought in £20m of investment and an avalanche of arts, ought not to be confined to cities.","core":"Cooper and her colleagues argue that the success ... ought not to be confined to cities.","structure":"that 引导宾语从句；for Hull 说明成功对谁而言；where 引导非限制性定语从句，补充该称号在赫尔产生的效果。","key":"crown：常见义为“王冠”；此处借指“文化之城”这一称号及其荣誉。；bring in：此处意为“引入、吸引来”，宾语是投资和艺术活动。；an avalanche of：大量的、纷至沓来的，强调数量之多。；be confined to：被限制在……范围内。","zh":"库珀及其同僚认为，这一称号给赫尔带来的成功不应仅限于城市；它为赫尔吸引了 2,000 万英镑投资和大量艺术活动。","tip":"it 指 the crown，where 指 Hull；arts 在此主要指艺术活动和文化资源，不只是“艺术”这一抽象概念。"},{"id":"2020-T1-P1-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"Britain's towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger competitors.","core":"Britain's towns are not prevented from applying, but they lack the resources.","structure":"it is true 是让步性插入语；两个 to 不定式中，to put together ... 修饰 resources，to beat ... 表示申报的目的。","key":"it is true：诚然，插入语，先承认一个事实再作转折。；put together a bid：组织、筹备一份竞标申请。；beat one's competitors：击败竞争对手。","zh":"诚然，英国的小镇并未被禁止申报该称号，但它们通常缺少整合申报方案、击败规模更大竞争者所需的资源。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T1-P1-S05","sec":"text1","sec_label":"Text 1","level":3,"en":"A town of culture award could, it is argued, become an annual event, attracting funding and creating jobs.","core":"A town of culture award could become an annual event.","structure":"it is argued 是插入语；attracting funding and creating jobs 是两个并列的现在分词短语，说明该活动可能产生的结果。","key":"an annual event：一年一度的活动。；attract funding：吸引资金。","zh":"有人认为，“文化之镇”评选可以成为一年一度的活动，吸引资金并创造就业机会。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T1-P2-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Some might see the proposal as a booby prize for the fact that Britain is no longer able to apply for the much more prestigious title of European capital of culture, a sought-after award bagged by Glasgow in 1990 and Liverpool in 2008.","core":"Some might see the proposal as a booby prize.","structure":"for the fact 说明如此看待的原因；that Britain ... 是 fact 的同位语从句；a sought-after award 是 title 的同位说明；bagged by ... 是过去分词短语，修饰 award。","key":"booby prize：不是正式的大奖，而是给失败者的安慰奖；此处含讽刺意味。；bag：常见义为“袋子”；此处作动词，口语中意为“赢得、拿下”。；prestigious：有声望的、享有盛誉的。；sought-after：广受追捧的、抢手的。","zh":"有些人或许会把这项提议视为一个安慰奖，因为英国已无法再申报声望高得多的“欧洲文化之都”称号；这一备受追捧的奖项曾于 1990 年和 2008 年分别被格拉斯哥与利物浦摘得。","tip":"for 在此表示原因；该句呈现的是“有些人”的负面看法，并非作者最终态度。"},{"id":"2020-T1-P2-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"A cynic might speculate that the UK is on the verge of disappearing into an endless fever of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow—village of culture? Suburb of culture? Hamlet of culture?","core":"A cynic might speculate that the UK is on the verge of disappearing into ... .","structure":"that 引导宾语从句；in its desperation to reinvent itself 说明英国陷入狂热的心理动因；冒号后的连续反问具体展现所谓“自我庆祝”的荒诞延伸。","key":"fever：常见义为“发烧”；此处比喻一种狂热状态。；reinvent oneself：重新塑造自身定位或形象，并非字面上的“重新发明自己”。；be on the verge of doing：濒临、即将做某事。；in one's desperation to do：由于急切甚至不顾一切地想做某事。","zh":"愤世嫉俗者或许会猜测，英国为了在脱欧后的世界中重塑自身，正急切得几乎要陷入一场没完没了的自我庆祝狂热：继“文化之镇”之后，谁知道还会冒出什么，“文化之村”？“文化郊区”？还是“文化小村落”？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T1-P3-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"It is also wise to recall that such titles are not a cure-all.","core":"It is wise to recall ... .","structure":"It 是形式主语，真正主语是 to recall ...；that 引导 recall 的宾语从句。","key":"cure-all：能解决一切问题的办法、万灵药。","zh":"同时也应清醒地认识到，这类称号并非包治百病的灵药。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T1-P3-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"A badly run \"year of culture\" washes in and washes out of a place like the tide, bringing prominence for a spell but leaving no lasting benefits to the community.","core":"A badly run \"year of culture\" washes in and washes out of a place.","structure":"like the tide 作方式状语；bringing ... but leaving ... 是两个由 but 连接的分词短语，补充活动造成的一正一负两种结果。","key":"prominence：受关注、显眼的地位；此处不是“杰出人物”。；for a spell：一小段时间、暂时；spell 在此不表示“拼写”或“咒语”。；wash in and wash out：像潮水般涌入又退去，比喻活动来得快、去得也快。；lasting benefits：持久的收益。","zh":"一场组织不善的“文化年”会像潮水一样涌入一地又迅速退去，虽能带来一时的关注，却不会给当地社区留下持久收益。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T1-P3-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"The really successful holders of such titles are those that do a great deal more than fill hotel bedrooms and bring in high-profile arts events and good press for a year.","core":"The really successful holders are those.","structure":"that 引导定语从句修饰 those；fill ...、bring in ... 与其后的 good press 共同列举一年内可见却偏短期的成果。","key":"holder：此处指某项称号的获得者或拥有者。；good press：媒体的正面报道，而非“优质出版社”。；a great deal more than：远不只是……。；high-profile：备受关注的、高规格的。","zh":"真正成功的称号获得者，所做的远不只是让酒店客房在一年中住满、引进高规格艺术活动并赢得媒体好评。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T1-P3-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"They transform the aspirations of the people who live there; they nudge the self-image of the city into a bolder and more optimistic light.","core":"They transform the aspirations; they nudge the self-image ... .","structure":"分号连接两个递进的并列分句；who live there 修饰 the people；nudge A into B 表示推动 A 进入 B 所描述的新状态。","key":"nudge：本义为“轻推”；此处指以渐进方式促使城市形象发生改变。；light：此处意为“看待事物的方式或角度”。","zh":"它们会改变当地居民的抱负，也会逐步推动这座城市以更自信、更乐观的眼光看待自身。","tip":"They 在句法上回指上句主语 The really successful holders（真正成功的称号获得者/承办城市），借指其推行的文化转型举措；原文说 transform the aspirations，不是“满足居民已有的愿望”，因此不能机械对应 Q23 的 B 项。"},{"id":"2020-T1-P3-S05","sec":"text1","sec_label":"Text 1","level":3,"en":"It is hard to get right, and requires a remarkable degree of vision, as well as cooperation between city authorities, the private sector, community groups and cultural organisations.","core":"It is hard to get right, and requires vision as well as cooperation.","structure":"It 指借助文化称号实现真正转型这件事；between ... 列出四类需要协作的主体。","key":"get sth. right：把某事做对、做好，并非“获得正确的东西”。；vision：此处指对未来的远见和规划能力，不是“视力”。","zh":"要把这件事做好并不容易，它既需要非凡的远见，也需要城市管理部门、私营部门、社区团体与文化机构之间的协作。","tip":"as well as 连接的是 vision 与 cooperation，并未说只靠政府或文化机构即可成功。"},{"id":"2020-T1-P3-S06","sec":"text1","sec_label":"Text 1","level":3,"en":"But it can be done: Glasgow's year as European capital of culture can certainly be seen as one of a complex series of factors that have turned the city into the powerhouse of art, music and theatre that it remains today.","core":"Glasgow's year ... can be seen as one of ... factors.","structure":"冒号后的内容解释 it can be done；第一个 that 引导定语从句，修饰 factors；第二个 that 引导定语从句，修饰 the powerhouse of art, music and theatre。","key":"powerhouse：常见义与发电设施有关；此处比喻在某一领域实力强劲、影响突出的中心。；a complex series of factors：一系列相互交织的因素。；turn A into B：使 A 转变为 B。","zh":"但这种转型是可以实现的：格拉斯哥担任“欧洲文化之都”的那一年，无疑可以被视为一系列复杂因素中的一个；正是这些因素使该市成为艺术、音乐与戏剧重镇，并延续至今。","tip":"作者只把文化之都经历视为 one of 多个因素之一，并未把城市转型全部归因于这一称号。"},{"id":"2020-T1-P4-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities—helping sustain its high street, supporting local facilities and above all celebrating its people.","core":"A \"town of culture\" could be not just about the arts but about honouring a town's peculiarities.","structure":"破折号后的三个并列分词短语解释如何 honour 小镇的独特之处；其中 above all 突出居民的重要性。","key":"high street：英国城镇的主要商业街，也可泛指当地实体零售业，不能直译为“高街”。；peculiarity：此处指一地独有的特点，并非贬义的“怪癖”。；not just ... but ...：不只是……，还在于……。；sustain its high street：维持城镇主要商业街的商业活力与生机。","zh":"“文化之镇”的意义可以不只在艺术，还在于珍视一座小镇的独特之处，包括帮助维持其商业街活力、支持当地公共设施，而最重要的是礼赞当地居民。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T1-P4-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Jeremy Wright, the culture secretary, should welcome this positive, hope-filled proposal, and turn it into action.","core":"Jeremy Wright should welcome this proposal, and turn it into action.","structure":"the culture secretary 是 Jeremy Wright 的同位语；welcome 与 turn 是由 and 连接的并列谓语。","key":"turn ... into action：把……转化为行动、将……付诸实施。；hope-filled：充满希望的。；put together a bid：组织、筹备竞标申请。；be confined to：被限制在……范围内。","zh":"文化大臣杰里米·赖特应当欢迎这一积极、充满希望的提议，并将其付诸行动。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T2-P1-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Scientists need journals in which to publish their research, so they will supply the articles without monetary reward.","core":"Scientists need journals, so they will supply the articles.","structure":"in which to publish their research 是“介词 + 关系代词 + 不定式”结构，修饰 journals；so 引出科学家无偿供稿这一结果。","key":"without monetary reward：没有金钱报酬、无偿地。；a journal in which to publish：用于发表论文的期刊。","zh":"科学家需要借助期刊发表研究成果，因此会在没有金钱报酬的情况下向期刊提供论文。","tip":"they 指 scientists；科学家不是向期刊付费购买文章，而是免费提供文章内容。"},{"id":"2020-T2-P1-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Other scientists perform the specialised work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge.","core":"Other scientists perform the specialised work also for free.","structure":"of peer review 说明工作的内容；because 引导原因状语从句；the acquisition of status 与 the production of scientific knowledge 是并列成分。","key":"peer review：同行评审，即由同领域专家审查论文质量的机制。；status：此处指学术地位和专业声望，而非一般的“状态”。","zh":"其他科学家同样免费承担专业的同行评审工作，因为这既是获得学术地位的核心环节，也是生产科学知识的重要组成部分。","tip":"免费评审并不是因为工作不专业，而是因为它与学术声望和知识生产密切相关。"},{"id":"2020-T2-P2-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"With the content of papers secured for free, the publisher needs only find a market for its journal.","core":"The publisher needs only find a market for its journal.","structure":"With + 宾语 + 过去分词 构成独立结构，表示内容已经免费取得这一前提；need only find 意为“只需找到”。","key":"secure：常见义为“安全的”；此处作动词，意为“获得、取得”。","zh":"论文内容既已免费获得，出版商只需为期刊找到市场即可。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T2-P2-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Scientific publishers routinely report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis.","core":"Scientific publishers routinely report profit margins approaching 40%.","structure":"approaching 40% 是现在分词短语，修饰 profit margins；at a time when ... 引导时间背景，其中 when 修饰 a time。","key":"margin：此处指利润率，不是“页边空白”或一般的“差距”。；existential crisis：生存危机，指行业的存续本身受到威胁。；profit margin：利润率。；routinely report：经常达到或报告出某一水平。","zh":"在出版业其他领域陷入生存危机之际，科学出版商的业务利润率却经常接近 40%。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T2-P3-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"The Dutch giant Elsevier, which claims to publish 25% of the scientific papers produced in the world, made profits of more than £900m last year, while UK universities alone spent more than £210m in 2016 to enable researchers to access their own publicly funded research; both figures seem to rise unstoppably despite increasingly desperate efforts to change them.","core":"Elsevier made profits ..., while UK universities spent ...; both figures seem to rise ... .","structure":"which 引导非限制性定语从句，补充爱思唯尔的市场规模；produced in the world 修饰 papers；while 对照出版社利润与大学支出；to enable ... 表支出目的；分号后的 both figures 指前述利润和支出。","key":"giant：此处指行业巨头、大型企业，不是“巨人”。；publicly funded：由公共财政或公共资金资助的。；enable sb. to do sth.：使某人能够做某事。；rise unstoppably：不可阻挡地上升。","zh":"荷兰出版巨头爱思唯尔声称，其出版的论文占全球科学论文总量的 25%；该公司去年利润超过 9 亿英镑，而仅英国大学在 2016 年就花费逾 2.1 亿英镑，才能让研究人员查阅由公共资金资助的自身研究成果。尽管人们越来越迫切地设法改变这种局面，这两个数字似乎仍在不可阻挡地上升。","tip":"their own publicly funded research 指研究人员所参与、由公共资金支持的成果；大学花钱只是为了重新获取这些成果，凸显模式的不合理。"},{"id":"2020-T2-P4-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"The most drastic, and thoroughly illegal, reaction has been the emergence of Sci-Hub, a kind of global photocopier for scientific papers, set up in 2012, which now claims to offer access to every paywalled article published since 2015.","core":"The most drastic reaction has been the emergence of Sci-Hub.","structure":"and thoroughly illegal 插入补充该反应的违法性质；a kind of global photocopier ... 是 Sci-Hub 的同位语；set up in 2012 是过去分词短语；which 引导非限制性定语从句；published since 2015 修饰 article。","key":"drastic：激烈的、极端的，强调手段力度大。；paywalled：受付费墙限制的，须付费或订阅后才能访问。；the emergence of：……的出现、兴起。；offer access to：提供对……的访问权限。","zh":"最激进而且完全违法的反应，是 2012 年创立的 Sci-Hub 的出现；它如同一台面向全球的科学论文复印机，如今声称可以让人获取自 2015 年以来发表的每一篇付费墙内论文。","tip":"global photocopier 是功能比喻，强调大规模复制和传播论文，并非真实的复印设备。"},{"id":"2020-T2-P4-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The success of Sci-Hub, which relies on researchers passing on copies they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.","core":"The success of Sci-Hub shows [the legal ecosystem has lost legitimacy and must be transformed].","structure":"which 引导非限制性定语从句，补充 Sci-Hub 的运行方式；they have themselves legally accessed 是省略关系代词的定语从句，修饰 copies；has lost 与 must be transformed 是宾语从句中的并列谓语；so that 引导目的状语从句。","key":"legitimacy：此处不仅是法律上的合法性，更指制度在使用者眼中的正当性与认可度。；ecosystem：此处比喻由出版商、研究人员、大学等共同构成的出版体系。；rely on sb. doing sth.：依靠某人做某事。；pass on copies：把副本转交给他人。","zh":"Sci-Hub 的成功依赖研究人员转交他们本人合法获取的论文副本；这一成功表明，现有合法出版生态已经失去用户的认同，必须加以改造，使其能够服务所有参与者。","tip":"they 指 researchers；研究人员最初访问副本合法，但将副本传给 Sci-Hub 并不因此自动合法。"},{"id":"2020-T2-P5-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"More than half of all British scientific research is now published under open access terms: either freely available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release.","core":"More than half of all British scientific research is now published under open access terms.","structure":"冒号后的 either ... or ... 列出开放获取的两种形式；so that 引导目的状语从句；before being placed ... 是省略主语的被动分词结构，其逻辑主语是研究论文。","key":"term：此处指规定或条款，而不是“学期”或单纯的“术语”。；general release：向所有人公开发布、全面开放。","zh":"如今，英国一半以上的科学研究成果都按开放获取条款发表：要么从发表之时起就可免费读取，要么先设一年或更久的付费墙，让出版商能够在成果全面公开前赚取利润。","tip":"open access 不一定等于发表当日立即免费，原文明确包括“先收费、后公开”的模式。"},{"id":"2020-T2-P6-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Yet the new system has not yet worked out any cheaper for the universities.","core":"The new system has not worked out any cheaper for the universities.","structure":"见原句","key":"work out：此处意为“结果是、最终证明为”，不是“锻炼”或“计算出”。","zh":"然而事实证明，这套新制度并没有让大学少花钱。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T2-P6-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Publishers have responded to the demand that they make their product free to readers by charging their writers fees to cover the costs of preparing an article.","core":"Publishers have responded to the demand by charging their writers fees.","structure":"that they make their product free to readers 是 demand 的同位语从句；by charging ... 表示应对方式；to cover ... 表示收费目的；of preparing an article 修饰 costs。","key":"product：此处指发表的论文内容，而不是普通实物商品。；writer：此处指论文作者、研究人员。","zh":"面对“向读者免费提供产品”的要求，出版商的应对方式是向论文作者收取费用，以覆盖文章处理成本。","tip":"出版商只是把收费对象从读者部分转移到作者，并未放弃盈利或让整个出版流程免费。"},{"id":"2020-T2-P6-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"These range from around £500 to $5,000, and apparently the work gets more expensive the more that publishers do it.","core":"These range ..., and the work gets more expensive.","structure":"These 指上一句的作者付费；the more that publishers do it 是比较关联结构的后半部分，it 指文章处理工作。","key":"range from ... to ...：范围从……到……不等。；the more ..., the more ...：越……，就越……。","zh":"这些费用从大约 500 英镑到 5,000 美元不等，而且显然，出版商处理的文章越多，这项工作反而越昂贵。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T2-P6-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"A report last year pointed out that the costs both of subscriptions and of these \"article preparation costs\" had been steadily rising at a rate above inflation.","core":"A report pointed out that the costs had been steadily rising.","structure":"both of subscriptions and of these ... costs 共同修饰 the costs，表示两类费用都在上涨；had been rising 强调截至报告发布前持续发生的趋势。","key":"at a rate above inflation：以高于通货膨胀率的速度。；article preparation costs：文章处理费、论文发表处理费用。","zh":"去年的一份报告指出，订阅费用和这些所谓的“文章处理费”都一直以高于通货膨胀率的速度上涨。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T2-P7-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"In some ways the scientific publishing model resembles the economy of the social internet: labour is provided free in exchange for the hope of status, while huge profits are made by a few big firms who run the market places.","core":"The scientific publishing model resembles the economy of the social internet.","structure":"冒号后的两个分句解释相似之处；while 表对比，把多数人无偿劳动与少数企业获利并置；who run the market places 修饰 a few big firms。","key":"market places：此处指由大型企业控制的交易或信息平台，不只是实体集市。；status：在科学出版中指学术声望，在社交互联网中也可指社会认可和影响力。；in exchange for：作为对……的交换。；make huge profits：获取巨额利润。","zh":"在某些方面，科学出版模式与社交互联网经济相似：劳动者免费提供劳动，以换取获得地位的希望；与此同时，经营这些市场平台的少数大公司却攫取巨额利润。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"But all too often such policies are an insincere form of virtue-signaling that benefits only the most privileged and does little to help average people.","core":"Such policies are an insincere form of virtue-signaling.","structure":"that 引导定语从句修饰 virtue-signaling；benefits 与 does little 是并列谓语。","key":"virtue-signaling：通过公开表态或行动展示自己道德正确，却未必解决实际问题的“美德展示”。；average people：普通人、一般民众，不是数学意义上的“平均的人”。","zh":"但很多时候，这类政策只是虚伪的“美德展示”，只让最具特权的人受益，对普通人几乎没有帮助。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T3-P2-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"A pair of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure \"gender parity\" on boards and commissions, provide a case in point.","core":"A pair of bills provide a case in point.","structure":"sponsored by ... 是过去分词短语，修饰 bills；两个人名分别与其职务构成同位关系；to ensure ... 表法案目的。","key":"a case in point：恰当的例证、典型案例。；board：此处指承担管理或决策职能的委员会，而非“木板”。；sponsor a bill：发起、提出一项法案。；gender parity：性别人数或代表比例均等。","zh":"马萨诸塞州参议员杰森·刘易斯和州众议院临时议长帕特里夏·哈达德共同发起了两项法案，旨在确保各委员会和专门机构实现“性别均等”；这正是一个典型案例。","tip":"谓语用复数 provide，因为主语中心词是 A pair of bills，实际指两项法案。"},{"id":"2020-T3-P3-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent female.","core":"Haddad and Lewis are concerned that ... .","structure":"that 引导宾语从句；more than half the state-government boards 是从句主语；less than 40 percent female 表示这些委员会中女性占比不足 40%。","key":"见下方词汇笔记","zh":"哈达德和刘易斯担忧的是，在超过一半的州政府委员会中，女性成员比例不足 40%。","tip":"不是说“全州女性中不足 40% 进入委员会”，而是说超过半数的委员会各自没有达到 40% 的女性比例。"},{"id":"2020-T3-P3-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"In order to ensure that elite women have more such opportunities, they have proposed imposing government quotas.","core":"They have proposed imposing government quotas.","structure":"In order to ... 表目的；其中 that 引导 ensure 的宾语从句；propose doing sth. 表示提议做某事。","key":"impose government quotas：实行由政府强制规定的配额。；elite women：精英女性；这一限定暗示直接受益者并非普通女性。","zh":"为了确保精英女性获得更多这类机会，他们提议实行政府配额。","tip":"they 指 Haddad and Lewis；作者特意使用 elite women，与首段 average people 形成对比。"},{"id":"2020-T3-P3-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"If the bills become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.","core":"State boards and commissions will be required to set aside 50 percent of board seats.","structure":"If 引导条件状语从句；be required to do 表示被强制要求；by 2022 表示最迟在 2022 年前达到目标。","key":"set aside：此处意为“专门保留、预留”，不是“暂且不考虑”。","zh":"如果这些法案成为法律，那么到 2022 年，州政府各委员会和专门机构将被要求为女性预留 50% 的席位。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T3-P4-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"The bills are similar to a measure recently adopted in California, which last year became the first state to require gender quotas for private companies.","core":"The bills are similar to a measure.","structure":"recently adopted in California 是过去分词短语，修饰 measure；which 引导非限制性定语从句，其语义先行词是 California。","key":"见下方词汇笔记","zh":"这两项法案与加利福尼亚州最近通过的一项措施相似；去年，加州成为美国第一个要求私营公司实行性别配额的州。","tip":"从语义上看，which 指 California，而不是 a measure，因为“成为第一个州”的只能是加州。"},{"id":"2020-T3-P4-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"In signing the measure, California Governor Jerry Brown admitted that the law, which expressly classifies people on the basis of sex, is probably unconstitutional.","core":"California Governor Jerry Brown admitted that the law is probably unconstitutional.","structure":"In signing the measure 作时间状语；that 引导宾语从句；which 引导非限制性定语从句，补充该法律如何划分人群。","key":"on the basis of sex：以性别为依据。；unconstitutional：违反宪法的。","zh":"加州州长杰里·布朗在签署该措施时承认，这部法律明确按性别对人进行分类，因此很可能违宪。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T3-P5-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"The US Supreme Court frowns on sex-based classifications unless they are designed to address an \"important\" policy interest.","core":"The US Supreme Court frowns on sex-based classifications.","structure":"unless 引导条件状语从句，相当于 if ... not；they 指 sex-based classifications；be designed to 表示“旨在”。","key":"frown on：不赞成、不认可，字面义为“对……皱眉”。；classification：在法律语境中指按特定属性对人群进行分类并区别对待。","zh":"美国最高法院通常不认可基于性别的分类，除非这类分类旨在处理某项“重要的”政策利益。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T3-P5-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Because the California law applies to all boards, even where there is no history of prior discrimination, courts are likely to rule that the law violates the constitutional guarantee of \"equal protection\".","core":"Courts are likely to rule that the law violates the constitutional guarantee.","structure":"Because 引导原因状语从句；even where ... 补充法律适用范围，where 指没有歧视历史的董事会情形；that 引导 rule 的宾语从句。","key":"rule：此处作动词，意为法院“裁定”，不是“统治”或“规则”。；prior discrimination：以往存在的歧视。；constitutional guarantee：宪法保障。；equal protection：平等保护原则。","zh":"由于加州法律适用于所有董事会，甚至包括以往没有歧视记录的董事会，法院很可能裁定该法违反宪法所保障的“平等保护”原则。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T3-P6-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Female participation on corporate boards may not currently mirror the percentage of women in the general population, but so what?","core":"Female participation may not mirror the percentage, but so what?","structure":"见原句","key":"mirror：此处作动词，意为“反映、与……相对应”。；so what?：那又怎样？表示该事实本身不足以证明必须采取所提措施。","zh":"目前，女性在公司董事会中的占比或许尚未反映女性在总人口中的比例，但那又怎样呢？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T3-P7-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"According to a study by Catalyst, between 2010 and 2015 the share of women on the boards of global corporations increased by 54 percent.","core":"The share of women ... increased by 54 percent.","structure":"According to ... 引出数据来源；between 2010 and 2015 是时间状语；on the boards of global corporations 修饰 women。","key":"share：此处指比例、份额，不是“分享”。","zh":"根据 Catalyst 的一项研究，2010 至 2015 年间，全球企业董事会中的女性占比增长了 54%。","tip":"increased by 54 percent 表示增长幅度为 54%，不是最终占比达到 54%。"},{"id":"2020-T3-P8-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Requiring companies to make gender the primary qualification for board membership will inevitably lead to less experienced private sector boards.","core":"Requiring companies ... will lead to less experienced private sector boards.","structure":"整个动名词短语 Requiring companies to make ... 作主语；make gender the primary qualification 是“make + 宾语 + 宾补”结构；for board membership 修饰 qualification。","key":"qualification：此处指入选董事会的资格或衡量条件，而不只是一纸“资质证书”。；board membership：董事会成员资格。；lead to：导致。","zh":"要求企业把性别作为董事会成员资格的首要条件，必然会导致私营企业董事会成员的经验水平下降。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T3-P8-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"That is exactly what happened when Norway adopted a nationwide corporate gender quota.","core":"That is exactly what happened.","structure":"what happened 是表语从句；when 引导时间状语从句。","key":"见下方词汇笔记","zh":"挪威实行全国性企业性别配额后，出现的正是这种情况。","tip":"That 回指上一句的 less experienced private sector boards，因此挪威案例说明经验不足者进入董事会，而不是女性参与受到反对。"},{"id":"2020-T3-P9-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of qualified women to serve on such boards has led to a \"golden skirt\" phenomenon, where the same elite women scoop up multiple seats on a variety of boards.","core":"Alice Lee notes that [increasing opportunities without increasing the pool] has led to a phenomenon.","structure":"Writing in The New Republic 是现在分词短语，修饰 Alice Lee；that 引导宾语从句；宾语从句中，increasing ... without increasing ... 是动名词主语；qualified women to serve ... 中不定式修饰 women；where 引导非限制性定语从句，解释该现象的表现。","key":"pool：此处指可供选择的人才储备，不是“水池”。；golden skirt：对少数精英女性同时占据多个董事席位现象的形象说法。；scoop up：迅速获得、尽数揽取。","zh":"爱丽丝·李在《新共和》撰文指出，董事会席位机会增加了，具备任职资格的女性候选人储备却没有相应扩大，这造成了一种“金裙子”现象：同一批精英女性在多个不同董事会中包揽多个席位。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T3-P10-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women.","core":"Remember that such policies are largely self-serving measures.","structure":"Next time ... 是时间状语；somebody pushes ... 修饰 next time；that 引导 remember 的宾语从句；第二个 that 引导定语从句修饰 measures；make ... feel good 与 do little ... 由 but 连接。","key":"push：此处意为积极兜售、推动某项政策，不是一般的“推”。；self-serving：为自身利益服务的、利己的。；gender equity：性别公平。；do little to help：对……几乎没有帮助。","zh":"下次再有人鼓吹以企业配额促进性别公平时，请记住：这类政策在很大程度上只是利己措施，能让倡议者自我感觉良好，却几乎帮不到普通女性。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T4-P1-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large multinationals that provide digital services to consumers or users in France.","core":"the French Senate passed a digital services tax。","structure":"which 引导非限制性定语从句，补充说明该税将征收何种税；","key":"digital services tax：数字服务税，即针对特定数字服务收入征收的税。；impose a tax on sb.：对某人或某类主体征税。","zh":"上周四，法国参议院通过了一项数字服务税；该税将对向法国消费者或用户提供数字服务的大型跨国企业征收一种全新的税。","tip":"which 指 a digital services tax；"},{"id":"2020-T4-P1-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Digital services include everything from providing a platform for selling goods and services online to targeting advertising based on user data, and the tax applies to gross revenue from such services.","core":"Digital services include everything ..., and the tax applies to gross revenue.","structure":"from providing ... to targeting ... 以两个动名词短语列举范围；","key":"gross：常见义为“总的、毛的”；此处修饰 revenue，；target advertising based on user data：依据用户数据定向投放广告。；apply to：适用于；此处表示该税以何种收入为征税对象。","zh":"数字服务涵盖广泛：从提供在线商品与服务交易平台，到依据用户数据定向投放广告；该税按这类服务的总收入征收。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T4-P1-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Many French politicians and media outlets have referred to this as a \"GAFA tax,\" meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon—in other words, multinational tech companies based in the United States.","core":"Many French politicians and media outlets have referred to this as a GAFA tax.","structure":"meaning ... 是现在分词短语，解释这一称呼意味着什么；","key":"outlet：常见义为“出口、插座”；此处指传播信息的“媒体机构”。；refer to A as B：把 A 称为 B。；apply primarily to：主要适用于、主要针对。；GAFA：Google、Apple、Facebook、Amazon 四家公司名称的首字母缩写。","zh":"许多法国政界人士和媒体把它称为“GAFA 税”，意思是，该税主要针对谷歌、苹果、脸书和亚马逊等公司，换言之，就是总部设在美国的跨国科技企业。","tip":"it 指数字服务税；based in the United States 修饰跨国科技公司，"},{"id":"2020-T4-P2-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The digital services tax now awaits the signature of President Emmanuel Macron, who has expressed support for the measure, and it could go into effect within the next few weeks.","core":"The tax awaits the signature ..., and it could go into effect.","structure":"who 引导非限制性定语从句，补充马克龙对该法案的态度；","key":"measure：常见义为“测量、尺度”；此处作名词，指已经通过的“措施、法案”。；await the signature of：等待……签署。；go into effect：生效、开始实施。","zh":"这项数字服务税目前正等待法国总统埃马纽埃尔·马克龙签署；马克龙已表示支持该措施，因此它可能在未来几周内生效。","tip":"it 指 the digital services tax，不是马克龙的支持。"},{"id":"2020-T4-P2-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax discriminates against American companies, which in turn could lead to trade sanctions against France.","core":"it has already sparked significant controversy。","structure":"with + 名词 + opening ... 是伴随结构，说明争议的具体表现；","key":"spark significant controversy：引发重大争议。；open an investigation into whether ...：启动调查，以查明是否……。；discriminate against：歧视；对……给予不利的差别待遇。；in turn：继而、转而，表示连锁结果。","zh":"但它已经引发了巨大争议：美国贸易代表已着手调查这项税是否歧视美国企业，而这一调查继而可能导致美国对法国实施贸易制裁。","tip":"which 并非指“美国公司”，而是承接美国发起调查这一事态。"},{"id":"2020-T4-P3-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The French tax is not just a unilateral move by one country in need of revenue.","core":"The French tax is not just a unilateral move.","structure":"by one country 说明行动主体；","key":"a unilateral move：单边行动，即一国未等待多边共识而自行采取的措施。；in need of revenue：需要财政收入、面临增收需求。","zh":"法国这项税收并非只是某个财政缺钱的国家采取的单边行动。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T4-P3-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Instead, the digital services tax is part of a much larger trend, with countries over the past few years proposing or putting in place an alphabet soup of new international tax provisions.","core":"the digital services tax is part of a much larger trend。","structure":"with countries ... proposing or putting in place ...","key":"an alphabet soup of：字面是“字母汤”；；be part of a much larger trend：是一股更大趋势的一部分。；put in place：建立并实施一项制度或措施。；tax provision：税收条款、税制规定。","zh":"相反，数字服务税是一股更大趋势的一部分：过去几年，各国纷纷提出或实施了一连串名称繁杂的国际税收新规。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T4-P3-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"They have included Britain's DPT. (diverted profits tax), Australia's MAAL (multinational anti-avoidance law), and India's SEP (significant economic presence) test, to name but a few.","core":"They have included Britain's DPT, Australia's MAAL, and India's SEP test.","structure":"三组括号分别解释三个缩写；","key":"diverted profits tax：转移利润税，针对跨国企业把利润转移到低税地区的安排。；multinational anti-avoidance law：跨国反避税法。；significant economic presence：显著经济存在，以经济活动而非实体场所判断税收联系。；to name but a few：仅举几例，暗示实际项目远不止这些。","zh":"其中包括英国的 DPT（转移利润税）、澳大利亚的 MAAL（跨国反避税法），以及印度的 SEP（显著经济存在）测试，这里仅举数例。","tip":"They 回指上一句的 new international tax provisions。"},{"id":"2020-T4-P4-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"These unilateral developments differ in their specifics, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right.","core":"These developments differ ..., but they are all designed to tax multinationals.","structure":"that 引导定语从句，修饰 income and revenue；","key":"specifics：此处作复数名词，指“具体细节、具体规定”，不是形容词“具体的”。；grant：常见义可为“拨款”；此处作动词，意为“正式赋予（权利）”。；differ in their specifics：在具体内容上有所不同。；tax sb. on income：就某人的收入向其征税。","zh":"这些单边举措在具体内容上各不相同，但它们的目的都是：对跨国企业的某些收入征税，因为各国认为自己有权对这些收入征税，即使现行国际税收规则并未赋予它们这项权利。","tip":"but they are all designed ... 中的 they 指这些单边举措；"},{"id":"2020-T4-P4-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"In other words, they all share a view that the international tax system has failed to keep up with the current economy.","core":"they all share a view。","structure":"that the international tax system ... 是同位语从句，","key":"share a view that ...：共同持有……看法；that 从句解释 view 的内容。；keep up with：跟上……的发展或变化。","zh":"换言之，这些国家都认为，国际税收体系未能跟上当前经济的发展。","tip":"they 回指上一句的单边举措实施国；"},{"id":"2020-T4-P5-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"In response to these many unilateral measures, the Organization for Economic Cooperation and Development (OECD) is currently working with 131 countries to reach a consensus by the end of 2020 on an international solution.","core":"the OECD is currently working with 131 countries。","structure":"句首介词短语说明多边协调的背景；","key":"in response to：作为对……的回应。；work with sb. to do sth.：与某方合作做某事。；reach a consensus on：就……达成共识。；by the end of 2020：最迟在 2020 年底前；by 强调截止时间。","zh":"为了应对这些单边措施，经济合作与发展组织（OECD）目前正与 131 个国家合作，力争在 2020 年底前就一项国际解决方案达成共识。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T4-P5-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Both France and the United States are involved in the organization's work, but France's digital services tax and the American response raise questions about what the future holds for the international tax system.","core":"Both France and the United States are involved ..., but the tax and response raise questions.","structure":"but 连接“双方参与合作”与“双方冲突制造不确定性”；","key":"hold：常见义为“拿着、持有”；what the future holds 中意为；be involved in：参与……。；raise questions about：使人对……产生疑问。；what the future holds for ...：……未来将会怎样。","zh":"法国和美国都参与了该组织的工作，但法国的数字服务税以及美国的回应，让国际税收体系的未来走向变得令人疑虑。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2020-T4-P6-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"France's planned tax is a clear warning: Unless a broad consensus can be reached on reforming the international tax system, other nations are likely to follow suit, and American companies will face a cascade of different taxes from dozens of nations that will prove burdensome and costly.","core":"France's planned tax is a clear warning；","structure":"Unless 引导否定条件状语从句；","key":"suit：常见义为“西装、诉讼”；follow suit 是固定表达，；prove：此处作系动词，意为“结果表明是、最终成为”。；reach a broad consensus on：就……达成广泛共识。；follow suit：照着做、跟进。","zh":"法国计划征收的这项税发出了明确警告：除非各方能够就改革国际税收体系达成广泛共识，否则其他国家很可能跟进，美国企业将面对来自数十个国家、接踵而至的不同税种，这些税收会造成沉重负担，代价高昂。","tip":"Unless 相当于 if ... not；"}]};</script>

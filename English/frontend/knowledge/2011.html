"Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.","note":"无法替代……。","forms":["be no substitute for"]},{"w":"miss the point","pos":"phr.","cn":"没有抓住要点。","sec":"text1","sec_label":"Text 1","ctx":"Devoted concertgoers who reply that recordings are no substitute for live performance are missing the point.","note":"没有抓住要点。","forms":["miss the point"]},{"w":"consume","pos":"词","cn":"常见义为“消耗、消费”；加引号后指“欣赏、使用”文化产品。","sec":"text1","sec_label":"Text 1","ctx":"These recordings are cheap, available everywhere, and very often much higher in artistic quality than today's live performances; moreover, they can be “consumed” at a tim","note":"常见义为“消耗、消费”；加引号后指“欣赏、使用”文化产品。","forms":["consume"]},{"w":"bring about","pos":"phr.","cn":"导致，引起。","sec":"text1","sec_label":"Text 1","ctx":"The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.","note":"导致，引起。","forms":["bring about"]},{"w":"institution","pos":"n.","cn":"此处不是某个具体“机构”，而是长期形成的制度或社会文化形式。","sec":"text1","sec_label":"Text 1","ctx":"The widespread availability of such recordings has thus brought about a crisis in the institution of the traditional classical concert.","note":"此处不是某个具体“机构”，而是长期形成的制度或社会文化形式。","forms":["institution"]},{"w":"program","pos":"词","cn":"常见义为“编程、节目”；此处作动词，指“把作品安排进演出曲目”。","sec":"text1","sec_label":"Text 1","ctx":"One possible response is for classical performers to program attractive new music that is not yet available on record.","note":"常见义为“编程、节目”；此处作动词，指“把作品安排进演出曲目”。","forms":["program"]},{"w":"markedly","pos":"adv.","cn":"明显地，显著地。","sec":"text1","sec_label":"Text 1","ctx":"Gilbert's own interest in new music has been widely noted: Alex Ross, a classical-music critic, has described him as a man who is capable of turning the Philharmonic into","note":"明显地，显著地。","forms":["markedly"]},{"w":"vibrant","pos":"词","cn":"充满活力的。","sec":"text1","sec_label":"Text 1","ctx":"Gilbert's own interest in new music has been widely noted: Alex Ross, a classical-music critic, has described him as a man who is capable of turning the Philharmonic into","note":"充满活力的。","forms":["vibrant"]},{"w":"repertoire","pos":"词","cn":"某位演奏者或某个团体能够演出的全部曲目；也可泛指技能储备。","sec":"text1","sec_label":"Text 1","ctx":"Merely expanding the orchestra's repertoire will not be enough.","note":"某位演奏者或某个团体能够演出的全部曲目；也可泛指技能储备。","forms":["repertoire"]},{"w":"depart","pos":"词","cn":"此处不是一般的“离开某地”，而是“离任、辞职”。","sec":"text2","sec_label":"Text 2","ctx":"When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up.","note":"此处不是一般的“离开某地”，而是“离任、辞职”。","forms":["depart"]},{"w":"straight up","pos":"phr.","cn":"坦率直接的，不拐弯抹角的。","sec":"text2","sec_label":"Text 2","ctx":"When Liam McGee departed as president of Bank of America in August, his explanation was surprisingly straight up.","note":"坦率直接的，不拐弯抹角的。","forms":["straight up"]},{"w":"cloak A in B","pos":"phr.","cn":"用 B 掩饰 A。","sec":"text2","sec_label":"Text 2","ctx":"Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving “to pursue my goal of running a company.”","note":"用 B 掩饰 A。","forms":["cloak A in B"]},{"w":"come right out and say...","pos":"phr.","cn":"直截了当地说……。","sec":"text2","sec_label":"Text 2","ctx":"Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving “to pursue my goal of running a company.”","note":"直截了当地说……。","forms":["come right out and say..."]},{"w":"run a company","pos":"phr.","cn":"经营、执掌一家公司。","sec":"text2","sec_label":"Text 2","ctx":"Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving “to pursue my goal of running a company.”","note":"经营、执掌一家公司。","forms":["run a company"]},{"w":"broadcast","pos":"词","cn":"常见义为“广播”；此处指“公开宣告、广而告之”。","sec":"text2","sec_label":"Text 2","ctx":"Broadcasting his ambition was “very much my decision,” McGee says.","note":"常见义为“广播”；此处指“公开宣告、广而告之”。","forms":["broadcast"]},{"w":"have a position lined up","pos":"phr.","cn":"事先安排好一个职位。","sec":"text2","sec_label":"Text 2","ctx":"McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run.","note":"事先安排好一个职位。","forms":["have a position lined up"]},{"w":"reflect on","pos":"phr.","cn":"认真思考，反思。","sec":"text2","sec_label":"Text 2","ctx":"McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run.","note":"认真思考，反思。","forms":["reflect on"]},{"w":"aspiration","pos":"n.","cn":"志向，抱负；此处具体指担任公司最高领导者。","sec":"text2","sec_label":"Text 2","ctx":"It also sent a clear message to the outside world about his aspirations.","note":"志向，抱负；此处具体指担任公司最高领导者。","forms":["aspiration"]},{"w":"It","pos":"词","cn":"指麦吉在没有下家时主动离职并公开说明目标这件事。","sec":"text2","sec_label":"Text 2","ctx":"It also sent a clear message to the outside world about his aspirations.","note":"指麦吉在没有下家时主动离职并公开说明目标这件事。","forms":["It"]},{"w":"No. 2 executive","pos":"phr.","cn":"公司中仅次于最高领导者的二号高管。","sec":"text2","sec_label":"Text 2","ctx":"In recent weeks the No. 2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post.","note":"公司中仅次于最高领导者的二号高管。","forms":["No. 2 executive"]},{"w":"CEO post","pos":"phr.","cn":"首席执行官职位。","sec":"text2","sec_label":"Text 2","ctx":"In recent weeks the No. 2 executives at Avon and American Express quit with the explanation that they were looking for a CEO post.","note":"首席执行官职位。","forms":["CEO post"]},{"w":"nod","pos":"词","cn":"常见义为“点头”；get the nod 指“获得认可或选中”。","sec":"text2","sec_label":"Text 2","ctx":"As boards scrutinize succession plans in response to shareholder pressure, executives who don't get the nod also may wish to move on.","note":"常见义为“点头”；get the nod 指“获得认可或选中”。","forms":["nod"]},{"w":"move on","pos":"phr.","cn":"此处指离开现职、转向新的职业机会。","sec":"text2","sec_label":"Text 2","ctx":"As boards scrutinize succession plans in response to shareholder pressure, executives who don't get the nod also may wish to move on.","note":"此处指离开现职、转向新的职业机会。","forms":["move on"]},{"w":"cloud","pos":"词","cn":"常见义为“云”；此处作动词，意为“给……蒙上阴影、损害”。","sec":"text2","sec_label":"Text 2","ctx":"A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.","note":"常见义为“云”；此处作动词，意为“给……蒙上阴影、损害”。","forms":["cloud"]},{"w":"pronouncement","pos":"n.","cn":"正式或公开发表的说法。","sec":"text2","sec_label":"Text 2","ctx":"A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.","note":"正式或公开发表的说法。","forms":["pronouncement"]},{"w":"have sb. cautious of doing sth.","pos":"phr.","cn":"使某人对做某事保持谨慎。","sec":"text2","sec_label":"Text 2","ctx":"A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their reputations.","note":"使某人对做某事保持谨慎。","forms":["have sb. cautious of doing sth."]},{"w":"take hold","pos":"phr.","cn":"开始产生明显影响，逐渐稳固。","sec":"text2","sec_label":"Text 2","ctx":"As the first signs of recovery begin to take hold, deputy chiefs may be more willing to make the jump without a net.","note":"开始产生明显影响，逐渐稳固。","forms":["take hold"]},{"w":"make the jump without a net","pos":"phr.","cn":"本指没有安全网便跳下；此处比喻尚未找到下家就辞职。","sec":"text2","sec_label":"Text 2","ctx":"As the first signs of recovery begin to take hold, deputy chiefs may be more willing to make the jump without a net.","note":"本指没有安全网便跳下；此处比喻尚未找到下家就辞职。","forms":["make the jump without a net"]},{"w":"turnover","pos":"词","cn":"此处指高管职位的“更替率”，不是营业额。","sec":"text2","sec_label":"Text 2","ctx":"In the third quarter, CEO turnover was down 23% from a year ago as nervous boards stuck with the leaders they had, according to Liberum Research.","note":"此处指高管职位的“更替率”，不是营业额。","forms":["turnover"]},{"w":"stick with","pos":"phr.","cn":"继续使用或支持，不作改变。","sec":"text2","sec_label":"Text 2","ctx":"In the third quarter, CEO turnover was down 23% from a year ago as nervous boards stuck with the leaders they had, according to Liberum Research.","note":"继续使用或支持，不作改变。","forms":["stick with"]},{"w":"pick up","pos":"phr.","cn":"此处指经济“好转、复苏”。","sec":"text2","sec_label":"Text 2","ctx":"As the economy picks up, opportunities will abound for aspiring leaders.","note":"此处指经济“好转、复苏”。","forms":["pick up"]},{"w":"abound","pos":"词","cn":"大量存在，充足。","sec":"text2","sec_label":"Text 2","ctx":"As the economy picks up, opportunities will abound for aspiring leaders.","note":"大量存在，充足。","forms":["abound"]},{"w":"poach","pos":"词","cn":"常见义为“偷猎”或“水煮”；此处指从其他公司“挖走、猎取”人才。","sec":"text2","sec_label":"Text 2","ctx":"For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached.","note":"常见义为“偷猎”或“水煮”；此处指从其他公司“挖走、猎取”人才。","forms":["poach"]},{"w":"sitting CEO","pos":"phr.","cn":"在任的首席执行官。","sec":"text2","sec_label":"Text 2","ctx":"Says Korn/Ferry senior partner Dennis Carey: “I can't think of a single search I've done where a board has not instructed me to look at sitting CEOs first.”","note":"在任的首席执行官。","forms":["sitting CEO"]},{"w":"search","pos":"词","cn":"此处指为企业寻找高管的“猎聘项目”。","sec":"text2","sec_label":"Text 2","ctx":"Says Korn/Ferry senior partner Dennis Carey: “I can't think of a single search I've done where a board has not instructed me to look at sitting CEOs first.”","note":"此处指为企业寻找高管的“猎聘项目”。","forms":["search"]},{"w":"land in a position","pos":"phr.","cn":"成功获得某个职位。","sec":"text2","sec_label":"Text 2","ctx":"Those who jumped without a job haven't always landed in top positions quickly.","note":"成功获得某个职位。","forms":["land in a position"]},{"w":"take a post","pos":"phr.","cn":"就任某个职位。","sec":"text2","sec_label":"Text 2","ctx":"He finally took that post at a major financial institution three years later.","note":"就任某个职位。","forms":["take a post"]},{"w":"that post","pos":"phr.","cn":"回指 CEO 职位。","sec":"text2","sec_label":"Text 2","ctx":"He finally took that post at a major financial institution three years later.","note":"回指 CEO 职位。","forms":["that post"]},{"w":"disgrace","pos":"词","cn":"此处指社会或职场赋予“无业状态”的负面标签。","sec":"text2","sec_label":"Text 2","ctx":"Many recruiters say the old disgrace is fading for top performers.","note":"此处指社会或职场赋予“无业状态”的负面标签。","forms":["disgrace"]},{"w":"between jobs","pos":"phr.","cn":"暂时待业，处于两份工作之间。","sec":"text2","sec_label":"Text 2","ctx":"The financial crisis has made it more acceptable to be between jobs or to leave a bad one.","note":"暂时待业，处于两份工作之间。","forms":["between jobs"]},{"w":"invert","pos":"词","cn":"使颠倒，使反转。","sec":"text2","sec_label":"Text 2","ctx":"“The traditional rule was it's safer to stay where you are, but that's been fundamentally inverted,” says one headhunter.","note":"使颠倒，使反转。","forms":["invert"]},{"w":"rough guide","pos":"phr.","cn":"不是“粗糙的指南”，而是可供大体判断的“经验准则”。","sec":"text3","sec_label":"Text 3","ctx":"The rough guide to marketing success used to be that you got what you paid for.","note":"不是“粗糙的指南”，而是可供大体判断的“经验准则”。","forms":["rough guide"]},{"w":"get what you pay for","pos":"phr.","cn":"一分钱一分货；此处指营销成效曾大体取决于付费投入。","sec":"text3","sec_label":"Text 3","ctx":"The rough guide to marketing success used to be that you got what you paid for.","note":"一分钱一分货；此处指营销成效曾大体取决于付费投入。","forms":["get what you pay for"]},{"w":"exploit","pos":"词","cn":"常见义为“剥削”；此处意为“充分利用”。","sec":"text3","sec_label":"Text 3","ctx":"While traditional “paid” media - such as television commercials and print advertisements - still play a major role, companies today can exploit many alternative forms of ","note":"常见义为“剥削”；此处意为“充分利用”。","forms":["exploit"]},{"w":"earned","pos":"v./adj.","cn":"此处不是一般的“挣得”，而是指品牌凭消费者自发传播“赢得”的曝光。","sec":"text3","sec_label":"Text 3","ctx":"Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts abo","note":"此处不是一般的“挣得”，而是指品牌凭消费者自发传播“赢得”的曝光。","forms":["earned"]},{"w":"leverage","pos":"n.","cn":"本义为“杠杆”；此处作动词，意为“借力利用、发挥……的效用”。","sec":"text3","sec_label":"Text 3","ctx":"Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts abo","note":"本义为“杠杆”；此处作动词，意为“借力利用、发挥……的效用”。","forms":["leverage"]},{"w":"stem from","pos":"phr.","cn":"源于，来自。","sec":"text3","sec_label":"Text 3","ctx":"The way consumers now approach the process of making purchase decisions means that marketing's impact stems from a broad range of factors beyond conventional paid media.","note":"源于，来自。","forms":["stem from"]},{"w":"a broad range of","pos":"phr.","cn":"范围广泛的，多种多样的。","sec":"text3","sec_label":"Text 3","ctx":"The way consumers now approach the process of making purchase decisions means that marketing's impact stems from a broad range of factors beyond conventional paid media.","note":"范围广泛的，多种多样的。","forms":["a broad range of"]},{"w":"initiator","pos":"词","cn":"发起者，启动者；营销者只能触发传播，实际内容和扩散由用户产生。","sec":"text3","sec_label":"Text 3","ctx":"For earned media, such marketers act as the initiator for users' responses.","note":"发起者，启动者；营销者只能触发传播，实际内容和扩散由用户产生。","forms":["initiator"]},{"w":"define A as B","pos":"phr.","cn":"把 A 定义为 B。","sec":"text3","sec_label":"Text 3","ctx":"We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.","note":"把 A 定义为 B。","forms":["define A as B"]},{"w":"traffic","pos":"adj.","cn":"此处指网站或平台的用户访问流量。","sec":"text3","sec_label":"Text 3","ctx":"We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.","note":"此处指网站或平台的用户访问流量。","forms":["traffic"]},{"w":"e-commerce engine","pos":"phr.","cn":"支撑线上交易的电子商务系统或入口。","sec":"text3","sec_label":"Text 3","ctx":"We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.","note":"支撑线上交易的电子商务系统或入口。","forms":["e-commerce engine"]},{"w":"in its infancy","pos":"phr.","cn":"处于早期、萌芽阶段，并非真的指婴儿期。","sec":"text3","sec_label":"Text 3","ctx":"This trend, which we believe is still in its infancy, effectively began with retailers and travel providers such as airlines and hotels and will no doubt go further.","note":"处于早期、萌芽阶段，并非真的指婴儿期。","forms":["in its infancy"]},{"w":"property","pos":"词","cn":"常见义为“财产、房产”；media property 指一个可经营的媒体平台或品牌资产。","sec":"text3","sec_label":"Text 3","ctx":"Johnson & Johnson, for example, has created BabyCenter, a stand-alone media property that promotes complementary and even competitive products.","note":"常见义为“财产、房产”；media property 指一个可经营的媒体平台或品牌资产。","forms":["property"]},{"w":"complementary","pos":"adj.","cn":"互补的；不要误作 complimentary“免费的、赞美的”。","sec":"text3","sec_label":"Text 3","ctx":"Johnson & Johnson, for example, has created BabyCenter, a stand-alone media property that promotes complementary and even competitive products.","note":"互补的；不要误作 complimentary“免费的、赞美的”。","forms":["complementary"]},{"w":"provide sb. with sth.","pos":"phr.","cn":"向某人提供某物。","sec":"text3","sec_label":"Text 3","ctx":"The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate cons","note":"向某人提供某物。","forms":["provide sb. with sth."]},{"w":"voice one's opinion","pos":"phr.","cn":"表达意见。","sec":"text3","sec_label":"Text 3","ctx":"The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate cons","note":"表达意见。","forms":["voice one's opinion"]},{"w":"hijack","pos":"词","cn":"本义为“劫持交通工具”；此处指用户夺走品牌对媒体内容和话语方向的控制。","sec":"text3","sec_label":"Text 3","ctx":"Such hijacked media are the opposite of earned media: an asset or campaign becomes hostage to consumers, other stakeholders, or activists who make negative allegations ab","note":"本义为“劫持交通工具”；此处指用户夺走品牌对媒体内容和话语方向的控制。","forms":["hijack"]},{"w":"hostage","pos":"n.","cn":"本义为“人质”；become hostage to 比喻“受制于……”。","sec":"text3","sec_label":"Text 3","ctx":"Such hijacked media are the opposite of earned media: an asset or campaign becomes hostage to consumers, other stakeholders, or activists who make negative allegations ab","note":"本义为“人质”；become hostage to 比喻“受制于……”。","forms":["hostage"]},{"w":"apply pressure on","pos":"phr.","cn":"向……施加压力。","sec":"text3","sec_label":"Text 3","ctx":"Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.","note":"向……施加压力。","forms":["apply pressure on"]},{"w":"them","pos":"词","cn":"指被劫持的媒体或营销渠道，而非 businesses。","sec":"text3","sec_label":"Text 3","ctx":"Members of social networks, for instance, are learning that they can hijack media to apply pressure on the businesses that originally created them.","note":"指被劫持的媒体或营销渠道，而非 businesses。","forms":["them"]},{"w":"boycott","pos":"词","cn":"抵制，拒绝购买或参与。","sec":"text3","sec_label":"Text 3","ctx":"If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.","note":"抵制，拒绝购买或参与。","forms":["boycott"]},{"w":"put... at risk","pos":"phr.","cn":"使……面临风险。","sec":"text3","sec_label":"Text 3","ctx":"If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.","note":"使……面临风险。","forms":["put... at risk"]},{"w":"learning curve","pos":"phr.","cn":"掌握新事物的学习过程；steep 在此强调企业需要迅速学习，过程艰难、代价高。","sec":"text3","sec_label":"Text 3","ctx":"In such a case, the company's response may not be sufficiently quick or thoughtful, and the learning curve has been steep.","note":"掌握新事物的学习过程；steep 在此强调企业需要迅速学习，过程艰难、代价高。","forms":["learning curve"]},{"w":"alleviate damage","pos":"phr.","cn":"减轻损害。","sec":"text3","sec_label":"Text 3","ctx":"Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response camp","note":"减轻损害。","forms":["alleviate damage"]},{"w":"well-orchestrated","pos":"v./adj.","cn":"组织周密、协调得当的。","sec":"text3","sec_label":"Text 3","ctx":"Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response camp","note":"组织周密、协调得当的。","forms":["well-orchestrated"]},{"w":"engage with consumers","pos":"phr.","cn":"与消费者直接互动、沟通。","sec":"text3","sec_label":"Text 3","ctx":"Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response camp","note":"与消费者直接互动、沟通。","forms":["engage with consumers"]},{"w":"provocative","pos":"adj.","cn":"此处指“引发争议和思考的”，不宜机械译作“挑衅的”。","sec":"text4","sec_label":"Text 4","ctx":"It's no surprise that Jennifer Senior's insightful, provocative magazine cover story, “I love My Children, I Hate My Life,” is arousing much chatter - nothing gets people","note":"此处指“引发争议和思考的”，不宜机械译作“挑衅的”。","forms":["provocative"]},{"w":"anything less than","pos":"phr.","cn":"并非完全……、达不到……；本句嵌在 the suggestion that 后，表示对完美育儿体验的质疑。","sec":"text4","sec_label":"Text 4","ctx":"It's no surprise that Jennifer Senior's insightful, provocative magazine cover story, “I love My Children, I Hate My Life,” is arousing much chatter - nothing gets people","note":"并非完全……、达不到……；本句嵌在 the suggestion that 后，表示对完美育儿体验的质疑。","forms":["anything less than"]},{"w":"rather than doing","pos":"phr.","cn":"不是做……，而是采取另一种理解。","sec":"text4","sec_label":"Text 4","ctx":"Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that ca","note":"不是做……，而是采取另一种理解。","forms":["rather than doing"]},{"w":"moment-to-moment joy","pos":"phr.","cn":"每时每刻、即时感受到的快乐。","sec":"text4","sec_label":"Text 4","ctx":"Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that ca","note":"每时每刻、即时感受到的快乐。","forms":["moment-to-moment joy"]},{"w":"past-tense condition","pos":"phr.","cn":"字面为“过去时状态”，此处指事后回顾时才体会到的幸福。","sec":"text4","sec_label":"Text 4","ctx":"Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that ca","note":"字面为“过去时状态”，此处指事后回顾时才体会到的幸福。","forms":["past-tense condition"]},{"w":"day-to-day","pos":"词","cn":"日常的，日复一日的。","sec":"text4","sec_label":"Text 4","ctx":"Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that “the very things that in the moment dampen our moods can later be so","note":"日常的，日复一日的。","forms":["day-to-day"]},{"w":"soul-crushingly hard","pos":"phr.","cn":"艰难到令人精神受挫、心力交瘁。","sec":"text4","sec_label":"Text 4","ctx":"Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that “the very things that in the moment dampen our moods can later be so","note":"艰难到令人精神受挫、心力交瘁。","forms":["soul-crushingly hard"]},{"w":"dampen one's mood","pos":"phr.","cn":"压低情绪，使人扫兴。","sec":"text4","sec_label":"Text 4","ctx":"Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that “the very things that in the moment dampen our moods can later be so","note":"压低情绪，使人扫兴。","forms":["dampen one's mood"]},{"w":"gratification","pos":"n.","cn":"满足感，成就感。","sec":"text4","sec_label":"Text 4","ctx":"Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that “the very things that in the moment dampen our moods can later be so","note":"满足感，成就感。","forms":["gratification"]},{"w":"hardly the only","pos":"phr.","cn":"远非唯一，说明同类形象很多；不能误读成“几乎是唯一”。","sec":"text4","sec_label":"Text 4","ctx":"The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.","note":"远非唯一，说明同类形象很多；不能误读成“几乎是唯一”。","forms":["hardly the only"]},{"w":"Madonna-and-child","pos":"词","cn":"艺术史中的圣母子图像，此处借指被美化、神圣化的母婴形象。","sec":"text4","sec_label":"Text 4","ctx":"The magazine cover showing an attractive mother holding a cute baby is hardly the only Madonna-and-child image on newsstands this week.","note":"艺术史中的圣母子图像，此处借指被美化、神圣化的母婴形象。","forms":["Madonna-and-child"]},{"w":"as well as","pos":"phr.","cn":"以及，除……之外还……。","sec":"text4","sec_label":"Text 4","ctx":"There are also stories about newly adoptive - and newly single - mom Sandra Bullock, as well as the usual “Jennifer Aniston is pregnant” news.","note":"以及，除……之外还……。","forms":["as well as"]},{"w":"the usual... news","pos":"phr.","cn":"已成惯例、反复出现的某类新闻。","sec":"text4","sec_label":"Text 4","ctx":"There are also stories about newly adoptive - and newly single - mom Sandra Bullock, as well as the usual “Jennifer Aniston is pregnant” news.","note":"已成惯例、反复出现的某类新闻。","forms":["the usual... news"]},{"w":"feature","pos":"词","cn":"此处作动词，意为“以……为重点刊载、让……亮相”。","sec":"text4","sec_label":"Text 4","ctx":"Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.","note":"此处作动词，意为“以……为重点刊载、让……亮相”。","forms":["feature"]},{"w":"procreation","pos":"n.","cn":"生育，繁衍后代。","sec":"text4","sec_label":"Text 4","ctx":"In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing","note":"生育，繁衍后代。","forms":["procreation"]},{"w":"Is it any wonder that...?","pos":"phr.","cn":"……又有什么可奇怪的呢？实际表示结果完全可以预料。","sec":"text4","sec_label":"Text 4","ctx":"In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing","note":"……又有什么可奇怪的呢？实际表示结果完全可以预料。","forms":["Is it any wonder that...?"]},{"w":"be equivalent to","pos":"phr.","cn":"等同于……。","sec":"text4","sec_label":"Text 4","ctx":"In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing","note":"等同于……。","forms":["be equivalent to"]},{"w":"compare A to B","pos":"phr.","cn":"把 A 与 B 相比较。","sec":"text4","sec_label":"Text 4","ctx":"It doesn't seem quite fair, then, to compare the regrets of parents to the regrets of the childless.","note":"把 A 与 B 相比较。","forms":["compare A to B"]},{"w":"then","pos":"词","cn":"此处表示根据上文所得出的推论，“既然如此”。","sec":"text4","sec_label":"Text 4","ctx":"It doesn't seem quite fair, then, to compare the regrets of parents to the regrets of the childless.","note":"此处表示根据上文所得出的推论，“既然如此”。","forms":["then"]},{"w":"provoke sb. to wonder","pos":"phr.","cn":"促使、刺激某人开始怀疑或思考。","sec":"text4","sec_label":"Text 4","ctx":"Unhappy parents rarely are provoked to wonder if they shouldn't have had kids, but unhappy childless folks are bothered with the message that children are the single most","note":"促使、刺激某人开始怀疑或思考。","forms":["provoke sb. to wonder"]},{"w":"gaping","pos":"v./n.","cn":"张大的、豁开的；此处夸张地形容被社会想象出来的巨大人生缺口。","sec":"text4","sec_label":"Text 4","ctx":"Unhappy parents rarely are provoked to wonder if they shouldn't have had kids, but unhappy childless folks are bothered with the message that children are the single most","note":"张大的、豁开的；此处夸张地形容被社会想象出来的巨大人生缺口。","forms":["gaping"]},{"w":"parenthood","pos":"词","cn":"为人父母的身份与经历。","sec":"text4","sec_label":"Text 4","ctx":"Of course, the image of parenthood that celebrity magazines like *Us Weekly* and *People* present is hugely unrealistic, especially when the parents are single mothers li","note":"为人父母的身份与经历。","forms":["parenthood"]},{"w":"hugely unrealistic","pos":"phr.","cn":"极不现实，严重失真。","sec":"text4","sec_label":"Text 4","ctx":"Of course, the image of parenthood that celebrity magazines like *Us Weekly* and *People* present is hugely unrealistic, especially when the parents are single mothers li","note":"极不现实，严重失真。","forms":["hugely unrealistic"]},{"w":"lean on","pos":"phr.","cn":"依靠，倚赖。","sec":"text4","sec_label":"Text 4","ctx":"No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: w","note":"依靠，倚赖。","forms":["lean on"]},{"w":"to hear sb. tell it","pos":"phr.","cn":"照某人的说法听来。","sec":"text4","sec_label":"Text 4","ctx":"No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: w","note":"照某人的说法听来。","forms":["to hear sb. tell it"]},{"w":"a piece of cake","pos":"phr.","cn":"轻而易举的事。","sec":"text4","sec_label":"Text 4","ctx":"No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: w","note":"轻而易举的事。","forms":["a piece of cake"]},{"w":"read:","pos":"词","cn":"此处相当于“其实应理解为……”，用来戳破前面引号中的说法。","sec":"text4","sec_label":"Text 4","ctx":"No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: w","note":"此处相当于“其实应理解为……”，用来戳破前面引号中的说法。","forms":["read:"]},{"w":"make it look glamorous","pos":"phr.","cn":"把某事表现得光鲜迷人。","sec":"text4","sec_label":"Text 4","ctx":"It's hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is no","note":"把某事表现得光鲜迷人。","forms":["make it look glamorous"]},{"w":"a baby is not a haircut","pos":"phr.","cn":"以发型作类比，强调生育不是轻率模仿明星潮流、随时可改变的选择。","sec":"text4","sec_label":"Text 4","ctx":"It's hard to imagine that many people are dumb enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is no","note":"以发型作类比，强调生育不是轻率模仿明星潮流、随时可改变的选择。","forms":["a baby is not a haircut"]},{"w":"contribute to","pos":"phr.","cn":"促成，导致；此处指理想化形象是现实不满的一个潜在来源。","sec":"text4","sec_label":"Text 4","ctx":"But it's interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren't in some small, subconscious way contributing to our o","note":"促成，导致；此处指理想化形象是现实不满的一个潜在来源。","forms":["contribute to"]},{"w":"the Rachel","pos":"phr.","cn":"电视剧角色瑞秋带火的一款发型。","sec":"text4","sec_label":"Text 4","ctx":"But it's interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren't in some small, subconscious way contributing to our o","note":"电视剧角色瑞秋带火的一款发型。","forms":["the Rachel"]}],"sentences":[{"id":"2011-T1-P1-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"The decision of the New York Philharmonic to hire Alan Gilbert as its next music director has been the talk of the classical-music world ever since the sudden announcement of his appointment in 2009.","core":"The decision has been the talk of the classical-music world。","structure":"to hire... 修饰 decision，说明决定的内容；ever since... 表示从 2009 年宣布任命起一直持续到现在。","key":"be the talk of...：成为……议论的焦点。；appointment：此处指“任命”，而非“约会”。","zh":"自 2009 年突然宣布任命艾伦·吉尔伯特以来，纽约爱乐乐团聘请他担任下一任音乐总监的决定就一直是古典音乐界的热门话题。","tip":"his appointment 指吉尔伯特获任命一事，不是他作出的任命。"},{"id":"2011-T1-P2-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Even Tommasini, who had advocated Gilbert's appointment in the *Times*, calls him “an unpretentious musician with no air of the formidable conductor about him.”","core":"Even Tommasini calls him an unpretentious musician。","structure":"who... 是非限制性定语从句，补充托马西尼曾支持这项任命；with no air... 修饰 musician，说明吉尔伯特没有名指挥家的威严派头。","key":"air：常见义为“空气”；此处指一个人表现出来的“神态、派头”。；advocate one's appointment：主张任命某人。；unpretentious：谦逊朴实的，不炫耀的。；formidable：令人敬畏的，气势强大的。","zh":"就连曾在《纽约时报》上主张任命吉尔伯特的托马西尼，也称他是“一位不事张扬的音乐家，身上没有那种令人望而生畏的大指挥家派头”。","tip":"unpretentious 对应题目中的 modest，不是说他“不够优秀”。"},{"id":"2011-T1-P2-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"As a description of the next music director of an orchestra that has hitherto been led by musicians like Gustav Mahler and Pierre Boulez, that seems likely to have struck at least some *Times* readers as faint praise.","core":"that seems likely to have struck some readers as faint praise。","structure":"句首 As a description... 表示“作为对……的描述”；that has hitherto been led... 修饰 orchestra；that 回指上一句托马西尼对吉尔伯特的评价。","key":"hitherto：迄今为止，在此以前。；strike A as B：使 A 觉得是 B。；faint praise：力度很弱、近乎敷衍的赞美。","zh":"这支乐团此前一直由古斯塔夫·马勒、皮埃尔·布列兹等音乐家执掌；用刚才那番话描述它的下一任音乐总监，似乎很可能让至少一些《纽约时报》读者觉得赞美得有些勉强。","tip":"这里不是作者直接否定吉尔伯特，而是说明在名家前任的映衬下，这一评价可能显得不够有力。"},{"id":"2011-T1-P3-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"To be sure, he performs an impressive variety of interesting compositions, but it is not necessary for me to visit Avery Fisher Hall, or anywhere else, to hear interesting orchestral music.","core":"he performs compositions, but it is not necessary for me to visit...。","structure":"见原句","key":"to be sure：诚然，固然；常用于先承认一点，再引出转折。；composition：此处指“音乐作品、曲目”。","zh":"诚然，他演出的曲目丰富多样，颇为引人注目；但我若想听有趣的管弦乐，并没有必要去艾弗里·费舍尔音乐厅或任何其他现场。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T1-P4-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with opera houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century.","core":"classical instrumentalists must compete not only with A, but also with B。","structure":"句首 For the time, attention, and money... 说明竞争的对象；not only... but also... 连接现场艺术机构与大师录音两类竞争者。","key":"见下方词汇笔记","zh":"为了争夺艺术爱好者的时间、注意力和金钱，古典器乐演奏者不仅要同歌剧院、舞蹈团、剧团和博物馆竞争，还要同 20 世纪古典音乐大师留下的录音竞争。","tip":"作者讨论的不是录音能否完全替代现场，而是现场演出必须在有限的时间、注意力和消费预算中与录音竞争。"},{"id":"2011-T1-P4-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"These recordings are cheap, available everywhere, and very often much higher in artistic quality than today's live performances; moreover, they can be “consumed” at a time and place of the listener's choosing.","core":"These recordings are cheap, available, and higher in quality; they can be consumed...。","structure":"三个并列表语概括录音的价格、可获得性和质量优势；分号后的 moreover 再补充时间、地点可自由选择的便利。","key":"consume：常见义为“消耗、消费”；加引号后指“欣赏、使用”文化产品。","zh":"这些录音价格低廉，随处可得，而且艺术质量往往远高于当今的现场演出；此外，听众还可以自行选择欣赏它们的时间和地点。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T1-P5-S05","sec":"text1","sec_label":"Text 1","level":3,"en":"If Gilbert and the Philharmonic are to succeed, they must first change the relationship between America's oldest orchestra and the new audience it hopes to attract.","core":"they must change the relationship。","structure":"If... are to succeed 表示实现目标所需的条件；it hopes to attract 是省略关系代词的定语从句，修饰 the new audience。","key":"be the talk of...：成为……议论的焦点；come as a surprise：使人感到意外；strike A as B：使 A 觉得是 B；be no substitute for：无法替代……","zh":"如果吉尔伯特和纽约爱乐乐团想要成功，就必须首先改变这支美国历史最悠久的乐团与其希望吸引的新观众之间的关系。","tip":"it 指 America's oldest orchestra，即纽约爱乐乐团。"},{"id":"2011-T2-P1-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving “to pursue my goal of running a company.”","core":"he came right out and said...。","structure":"Rather than cloaking... 表示取舍，“没有掩饰，而是直说”；he was leaving... 是 said 的宾语从句；引语中的 my 保留麦吉原话的人称。","key":"cloak A in B：用 B 掩饰 A。；come right out and say...：直截了当地说……。；run a company：经营、执掌一家公司。","zh":"他没有像往常那样用含糊的借口掩饰离职，而是开门见山地说，自己离开是“为了追求执掌一家公司的目标”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T2-P1-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"Within two weeks, he was talking for the first time with the board of Hartford Financial Services Group, which named him CEO and chairman on September 29.","core":"he was talking with the board; the group named him CEO and chairman。","structure":"which 引导非限制性定语从句，指代 Hartford Financial Services Group，并交代最终任命结果。","key":"见下方词汇笔记","zh":"不到两周，他便首次与哈特福德金融服务集团董事会展开洽谈；该集团于 9 月 29 日任命他为首席执行官兼董事长。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T2-P2-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"McGee says leaving without a position lined up gave him time to reflect on what kind of company he wanted to run.","core":"leaving... gave him time。","structure":"动名词短语 leaving without... 作主语；lined up 是后置修饰；what kind of company... 作 reflect on 的宾语。","key":"have a position lined up：事先安排好一个职位。；reflect on：认真思考，反思。","zh":"麦吉说，在没有预先落实下一份工作的情况下离职，让他有时间思考自己想经营什么样的公司。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T2-P2-S05","sec":"text2","sec_label":"Text 2","level":3,"en":"As boards scrutinize succession plans in response to shareholder pressure, executives who don't get the nod also may wish to move on.","core":"executives may wish to move on。","structure":"As... 表示伴随背景；who don't get the nod 修饰 executives；in response to... 说明董事会审查计划的原因。","key":"nod：常见义为“点头”；get the nod 指“获得认可或选中”。；move on：此处指离开现职、转向新的职业机会。","zh":"在股东压力下，董事会会仔细审查接班计划；那些未获首肯、不能成为继任者的高管也可能想另谋出路。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T2-P4-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"For years executives and headhunters have adhered to the rule that the most attractive CEO candidates are the ones who must be poached.","core":"executives and headhunters have adhered to the rule。","structure":"that... 是 rule 的同位语从句；who must be poached 修饰 the ones。","key":"poach：常见义为“偷猎”或“水煮”；此处指从其他公司“挖走、猎取”人才。","zh":"多年来，高管和猎头一直奉行一条规则：最具吸引力的首席执行官候选人，是那些必须从别处挖来的人。","tip":"能被 poached 的人本来在职，需要猎头主动寻找并说服，因此对应 hunted for。"},{"id":"2011-T2-P4-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Says Korn/Ferry senior partner Dennis Carey: “I can't think of a single search I've done where a board has not instructed me to look at sitting CEOs first.”","core":"I can't think of a single search。","structure":"I've done 是省略关系词的定语从句；where... 修饰 search；instructed me to... 表示要求猎头先看在职 CEO。","key":"sitting CEO：在任的首席执行官。；search：此处指为企业寻找高管的“猎聘项目”。","zh":"光辉国际资深合伙人丹尼斯·凯里说：“在我做过的猎聘项目中，我想不出哪一次董事会没有要求我先考察现任首席执行官。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T2-P6-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"“The people who've been hurt the worst are those who've stayed too long.”","core":"The people are those。","structure":"who've been hurt the worst 修饰 The people；who've stayed too long 修饰 those。","key":"come right out and say：直截了当地说；have a position lined up：预先安排好职位；get the nod：获得认可或选中；make the jump without a net：在没有退路保障时冒险跳出","zh":"“受伤最重的，反而是那些在原职位上待得太久的人。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"No longer.","core":"完整表达是 That is no longer the case。","structure":"见原句","key":"见下方词汇笔记","zh":"如今已不再如此。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T3-P1-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"While traditional “paid” media - such as television commercials and print advertisements - still play a major role, companies today can exploit many alternative forms of media.","core":"companies can exploit many alternative forms of media。","structure":"While... 引导让步状语从句；破折号之间列举传统付费媒体的例子。","key":"exploit：常见义为“剥削”；此处意为“充分利用”。","zh":"尽管电视广告、平面广告等传统“付费”媒体仍发挥重要作用，如今的公司却可以利用许多其他形式的媒体。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T3-P1-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"Consumers passionate about a product may create “earned” media by willingly promoting it to friends, and a company may leverage “owned” media by sending e-mail alerts about products and sales to customers registered with its Web site.","core":"Consumers may create earned media, and a company may leverage owned media。","structure":"两个 by doing 分别说明创造和利用媒介的方式；passionate about a product 修饰 Consumers；registered with its Web site 修饰 customers。","key":"earned：此处不是一般的“挣得”，而是指品牌凭消费者自发传播“赢得”的曝光。；leverage：本义为“杠杆”；此处作动词，意为“借力利用、发挥……的效用”。","zh":"热衷于某种产品的消费者可能会自愿向朋友推荐，从而创造“赢得媒体”；公司则可以向在其网站注册的客户发送产品和促销邮件，以发挥“自有媒体”的作用。","tip":"消费者推荐的是自己喜爱的产品，不是帮助朋友推广朋友的产品；it 指该产品。"},{"id":"2011-T3-P1-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"The way consumers now approach the process of making purchase decisions means that marketing's impact stems from a broad range of factors beyond conventional paid media.","core":"The way means that marketing's impact stems from...。","structure":"consumers now approach... 是省略关系副词的定语从句，修饰 The way；of making purchase decisions 修饰 process；that 引导 means 的宾语从句。","key":"stem from：源于，来自。；a broad range of：范围广泛的，多种多样的。","zh":"消费者如今作出购买决策的方式意味着，营销影响力来自传统付费媒体之外的广泛因素。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T3-P2-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"But in some cases, one marketer's owned media become another marketer's paid media - for instance, when an e-commerce retailer sells ad space on its Web site.","core":"one marketer's owned media become another marketer's paid media。","structure":"破折号后的 for instance 说明转换场景：网站对零售商是自有媒介，对购买广告位的企业则是付费媒介。","key":"见下方词汇笔记","zh":"但在某些情况下，一家营销者的自有媒体会变成另一家营销者的付费媒体，例如电商零售商出售自己网站上的广告位时便是如此。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T3-P2-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce engines within that environment.","core":"We define sold media as owned media。","structure":"whose traffic... 修饰 owned media；其中 so... that... 表示流量足够强，因而吸引其他机构入驻。","key":"define A as B：把 A 定义为 B。；traffic：此处指网站或平台的用户访问流量。；e-commerce engine：支撑线上交易的电子商务系统或入口。","zh":"我们把这种“出售媒体”定义为一类自有媒体：它的流量十分强大，以至于其他机构愿意把自己的内容或电子商务引擎放进这个媒介环境。","tip":"出售媒体的定义性特征是 strong traffic，不是环境安全或组织灵活。"},{"id":"2011-T3-P2-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"This trend, which we believe is still in its infancy, effectively began with retailers and travel providers such as airlines and hotels and will no doubt go further.","core":"This trend began with... and will go further。","structure":"which we believe is still in its infancy 是非限制性定语从句，插入说明作者对发展阶段的判断。","key":"in its infancy：处于早期、萌芽阶段，并非真的指婴儿期。","zh":"我们认为这一趋势仍处于萌芽阶段；它实际上始于零售商以及航空公司、酒店等旅行服务商，而且无疑还会继续发展。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T3-P2-S07","sec":"text3","sec_label":"Text 3","level":3,"en":"Besides generating income, the presence of other marketers makes the site seem objective, gives companies opportunities to learn valuable information about the appeal of other companies' marketing, and may help expand user traffic for all companies concerned.","core":"the presence makes the site seem objective, gives companies opportunities, and may help expand user traffic。","structure":"三个谓语 makes、gives、may help 并列；Besides generating income 补充首项收益；concerned 后置修饰 companies，意为“有关的”。","key":"见下方词汇笔记","zh":"除创造收入外，其他营销者的存在还能让该网站显得客观，为企业提供机会去了解其他公司营销活动的吸引力，并可能帮助所有相关企业扩大用户流量。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T3-P3-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"The same dramatic technological changes that have provided marketers with more (and more diverse) communications choices have also increased the risk that passionate consumers will voice their opinions in quicker, more visible, and much more damaging ways.","core":"The changes have also increased the risk。","structure":"that have provided... 修饰 changes；that passionate consumers... 是 risk 的同位语从句，说明风险的具体内容；三个比较级并列修饰 ways。","key":"provide sb. with sth.：向某人提供某物。；voice one's opinion：表达意见。","zh":"同样是这些翻天覆地的技术变化，它们在为营销者提供更多、更丰富传播选择的同时，也增大了风险：充满热情的消费者可能以更快、更显眼、破坏性也强得多的方式表达意见。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T3-P3-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Such hijacked media are the opposite of earned media: an asset or campaign becomes hostage to consumers, other stakeholders, or activists who make negative allegations about a brand or product.","core":"hijacked media are the opposite; an asset or campaign becomes hostage to...。","structure":"冒号后解释“被劫持”的含义；who make... 修饰前面三类主体。","key":"hijack：本义为“劫持交通工具”；此处指用户夺走品牌对媒体内容和话语方向的控制。；hostage：本义为“人质”；become hostage to 比喻“受制于……”。","zh":"这种“被劫持媒体”正是赢得媒体的反面：某项媒体资产或营销活动受制于消费者、其他利益相关者或活动人士，而这些人会对某个品牌或产品作出负面指控。","tip":"题目中的负面效果不是说“赢得媒体本身必然负面”，而是说同样由消费者参与的媒体或营销活动可能被劫持并转为负面传播。"},{"id":"2011-T3-P4-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the target company at risk.","core":"consumers would try to persuade others。","structure":"If that happens 中 that 指媒体被劫持；putting... 是结果状语，说明抵制行动带来的声誉后果。","key":"boycott：抵制，拒绝购买或参与。；put... at risk：使……面临风险。","zh":"如果媒体遭到劫持，态度强烈的消费者就会试图说服他人抵制产品，使目标公司的声誉陷入风险。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T3-P4-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to engage with consumers directly on sites such as Twitter and the social-news site Digg.","core":"Toyota Motor alleviated some of the damage with a campaign。","structure":"from its recall crisis 修饰 damage；with... campaign 表示手段；which included... 修饰回应行动并说明具体措施。","key":"alleviate damage：减轻损害。；well-orchestrated：组织周密、协调得当的。；engage with consumers：与消费者直接互动、沟通。；get what one pays for：一分钱一分货","zh":"例如，今年早些时候，丰田汽车通过一场相对迅速且组织周密的社交媒体回应行动，减轻了召回危机造成的部分损害；其中包括在 Twitter 和社交新闻网站 Digg 等平台上直接与消费者沟通。","tip":"丰田不是利用负面劫持媒体获利，而是对危机中的负面舆情作出有效回应。"},{"id":"2011-T4-P1-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"It's no surprise that Jennifer Senior's insightful, provocative magazine cover story, “I love My Children, I Hate My Life,” is arousing much chatter - nothing gets people talking like the suggestion that child rearing is anything less than a completely fulfilling, life-enriching experience.","core":"It's no surprise that the story is arousing much chatter; nothing gets people talking like the suggestion。","structure":"前半句的 that 从句是真正主语；破折号后解释为何不意外；第二个 that 引导 suggestion 的同位语从句。","key":"provocative：此处指“引发争议和思考的”，不宜机械译作“挑衅的”。；anything less than：并非完全……、达不到……；本句嵌在 the suggestion that 后，表示对完美育儿体验的质疑。","zh":"珍妮弗·西尼尔那篇见解深刻、颇具争议的杂志封面文章《我爱我的孩子，我讨厌我的生活》引发大量议论，这并不奇怪：只要有人暗示养育孩子并非一种完全令人满足、丰富人生的体验，就最能激起公众讨论。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T4-P1-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Rather than concluding that children make parents either happy or miserable, Senior suggests we need to redefine happiness: instead of thinking of it as something that can be measured by moment-to-moment joy, we should consider being happy as a past-tense condition.","core":"Senior suggests (that) we need to redefine happiness; we should consider being happy as...。","structure":"句首 Rather than concluding... 排除简单的幸福/痛苦二分；冒号后以 instead of... 与主句构成取舍；that can be measured... 修饰 something。","key":"rather than doing：不是做……，而是采取另一种理解。；moment-to-moment joy：每时每刻、即时感受到的快乐。；past-tense condition：字面为“过去时状态”，此处指事后回顾时才体会到的幸福。","zh":"西尼尔并未断言孩子会让父母变得幸福或痛苦，而是主张我们需要重新定义幸福：不应把幸福看成可用每时每刻的快乐来衡量的东西，而应把它理解为一种回头看时才能确认的状态。","tip":"past-tense 不是说幸福已经消失，而是说育儿价值常在事后回顾时显现，即题目中的 in retrospect。"},{"id":"2011-T4-P1-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that “the very things that in the moment dampen our moods can later be sources of intense gratification and delight.”","core":"Senior writes that the things can later be sources of gratification and delight。","structure":"Even though... 引导让步从句；引语中 that in the moment dampen our moods 修饰 the very things；later 与 in the moment 构成时间对比。","key":"day-to-day：日常的，日复一日的。；soul-crushingly hard：艰难到令人精神受挫、心力交瘁。；dampen one's mood：压低情绪，使人扫兴。；gratification：满足感，成就感。","zh":"西尼尔写道，尽管日复一日的育儿体验可能艰难得令人心力交瘁，但“恰恰是那些当下让我们情绪低落的事情，日后可能成为强烈满足感与喜悦的来源”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T4-P2-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Practically every week features at least one celebrity mom, or mom-to-be, smiling on the newsstands.","core":"Practically every week features at least one celebrity mom。","structure":"smiling on the newsstands 是现在分词短语，描写明星母亲以幸福形象出现在杂志封面上。","key":"feature：此处作动词，意为“以……为重点刊载、让……亮相”。","zh":"几乎每周，报刊摊上都会出现至少一位面带笑容的明星妈妈或准妈妈。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T4-P3-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is equivalent to admitting you support kitten-killing?","core":"Is it any wonder that admitting A is equivalent to admitting B?","structure":"that so persistently celebrates procreation 修饰 society；两个 admitting... 动名词短语分别作从句主语和介词宾语。","key":"procreation：生育，繁衍后代。；Is it any wonder that...?：……又有什么可奇怪的呢？实际表示结果完全可以预料。；be equivalent to：等同于……。","zh":"在一个如此持续颂扬生育的社会里，承认自己后悔生孩子竟等同于承认自己支持残害幼小生命，这又有什么可奇怪的呢？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T4-P3-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Unhappy parents rarely are provoked to wonder if they shouldn't have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives.","core":"parents rarely are provoked..., but childless folks are bothered with the message...。","structure":"if... 是 wonder 的宾语从句；that children are... 是 message 的同位语从句；冒号后以反讽口吻推演这种社会信息的结论。","key":"provoke sb. to wonder：促使、刺激某人开始怀疑或思考。；gaping：张大的、豁开的；此处夸张地形容被社会想象出来的巨大人生缺口。","zh":"不幸福的父母很少会受到外界刺激，进而怀疑自己当初是否不该生孩子；但不幸福的无子女者却不断被一种说法所困扰：孩子是世上唯一最重要的东西，因此，他们的痛苦显然一定直接源自生活中那个婴儿大小、空空如也的缺口。","tip":"obviously 带反讽，并非作者真心认定无子女者的不幸一定源于没有孩子。"},{"id":"2011-T4-P4-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"According to several studies concluding that parents are less happy than childless couples, single parents are the least happy of all.","core":"single parents are the least happy of all。","structure":"According to... 引出研究依据；concluding that... 修饰 studies；其中 that 从句说明研究的结论。","key":"见下方词汇笔记","zh":"多项研究得出结论，有子女的父母不如无子女的夫妇幸福，而单亲父母又是所有群体中最不幸福的。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2011-T4-P4-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their “own” (read: with round-the-clock help) is a piece of cake.","core":"No shock there; yet raising a kid is a piece of cake。","structure":"considering... 说明不意外的原因；how much work it is... 是 considering 的宾语；分号后的 yet 引出明星叙述与现实研究的反差。","key":"lean on：依靠，倚赖。；to hear sb. tell it：照某人的说法听来。；a piece of cake：轻而易举的事。；read:：此处相当于“其实应理解为……”，用来戳破前面引号中的说法。","zh":"这毫不意外，因为没有伴侣可以依靠时，养孩子需要付出极大精力；然而，照桑德拉和布兰妮的说法，靠她们“自己”（实际是有全天候帮助）养孩子却轻而易举。","tip":"引号中的 own 带讽刺意味，明星并非真正独自育儿，而有全天候帮助。"},{"id":"2011-T4-P5-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"But it's interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren't in some small, subconscious way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting “the Rachel” might make us look just a little bit like Jennifer Aniston.","core":"it's interesting to wonder if the images aren't contributing to our dissatisfactions。","structure":"we see every week 修饰 the images；of stress-free, happiness-enhancing parenthood 说明形象内容；in the same way that... 引出发型类比；getting “the Rachel” 是后一个从句的主语。","key":"contribute to：促成，导致；此处指理想化形象是现实不满的一个潜在来源。；the Rachel：电视剧角色瑞秋带火的一款发型。；anything less than：并非完全……、达不到……；a past-tense condition：事后回顾时才能确认的状态","zh":"但有一点值得思考：我们每周看到的那些毫无压力、增进幸福的育儿形象，会不会正在以某种细微而潜意识的方式，加重我们对真实育儿体验的不满？这就像我们内心曾有一小部分希望，剪一个“瑞秋同款”发型也许能让自己看起来稍微像珍妮弗·安妮斯顿一点。","tip":"if... aren't contributing 是委婉探问，实际关注“是否正在造成影响”，不能按表面否定理解成“没有影响”。"}]};</script>

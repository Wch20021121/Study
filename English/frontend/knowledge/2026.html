y of Florida, says in a statement.","core":"引语的主干是 the animals are telling their history；整句的叙述主干是 Samantha Brooks says in a statement。","structure":"Through their DNA 是方式状语；an equine researcher at the University of Florida 是同位语，补充说明 Samantha Brooks；引语置于主句前，逗号后接说话者和谓语。","key":"tell their history themselves：不是字面上的“动物自己开口讲述”，而是说基因信息能够直接提供动物历史的证据。；statement：此处指机构或研究人员发布的声明，而不是普通的“陈述句”。；co-author：共同作者。；equine：马科动物的；范围包括马、驴等马科动物。","zh":"佛罗里达大学的马科动物研究员、共同作者萨曼莎·布鲁克斯在一份声明中说：“通过它们的 DNA，这些动物正在亲自讲述自己的历史。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T1-P2-S07","sec":"text1","sec_label":"Text 1","level":3,"en":"“We usually only get the human’s side of history through written accounts, but of course written history does not always record exactly how something happened.","core":"前半句为 We get the human’s side of history；后半句为 written history does not record exactly ...。","structure":"through written accounts 是方式状语；but 连接前后两个分句；how something happened 是 record 的宾语从句，说明被记录的具体内容。","key":"the human’s side of history：指从人类视角记录的历史，而不是“人类历史的一边”。；account：常见义为“账户”，此处指记载、叙述或史料。","zh":"我们通常只能通过文字记载获得人类一方的历史；但当然，文字历史并不总能准确记录某件事究竟是如何发生的。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T1-P2-S08","sec":"text1","sec_label":"Text 1","level":3,"en":"Looking at these DNA sequences, we get a biological testimony to the environment these animals lived in and the experiences they survived.”","core":"we get a biological testimony。","structure":"Looking at these DNA sequences 是现在分词短语作方式或条件背景状语，逻辑主语是 we；to the environment ... and the experiences ... 说明证据指向什么；两个关系从句分别修饰 environment 和 experiences。","key":"testimony：常见义为“证词、证言”；此处指 DNA 提供的生物学证据，并非人在法庭上的证词。；survive：此处作及物动词，意为“经历……并幸存下来”，不是简单的“活着”。；look at：分析、考察；在科研语境中不只是“看一眼”。；the environment ... lived in：它们生活于其中的环境；介词 in 置于关系从句末尾。","zh":"通过观察这些 DNA 序列，我们能够获得关于这些动物所处环境以及它们经历并挺过的种种遭遇的生物学证据。","tip":"these animals lived in 中 in 与 lived 搭配，不能把 in 误接到后面的 and；they survived 修饰 experiences，表示经历过并挺过的遭遇。"},{"id":"2026-T1-P3-S09","sec":"text1","sec_label":"Text 1","level":3,"en":"The researchers examined 207 genomes from modern donkeys living in 31 countries across the globe.","core":"The researchers examined 207 genomes.","structure":"from modern donkeys 说明基因组的来源；living in 31 countries 是现在分词短语，修饰 modern donkeys；across the globe 强调这些国家的分布范围。","key":"examine：研究、分析；在科研语境中比普通的“检查”更正式。；across the globe：遍布全球、来自世界各地。","zh":"研究人员研究了来自全球 31 个国家、现今生活着的驴的 207 个基因组。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T1-P3-S10","sec":"text1","sec_label":"Text 1","level":3,"en":"They also looked at genomes from 15 wild equids and 31 earlier donkeys that lived between about 4,000 and 100 years ago.","core":"They looked at genomes from 15 wild equids and 31 earlier donkeys.","structure":"that lived between about 4,000 and 100 years ago 修饰前面的这些动物，说明样本年代；also 表示研究对象在现代驴之外还有两类历史样本。","key":"earlier donkeys：指年代更早的驴或古代驴样本，不是“较早到达的驴”。；wild equid：野生马科动物；equid 是马、驴、斑马等动物所属的科名。","zh":"他们还研究了 15 个野生马科动物和 31 个早期驴的基因组；这些动物生活在大约 4000 年前至 100 年前之间。","tip":"between about 4,000 and 100 years ago 表示从约 4000 年前到约 100 年前这一时间跨度，不是“生活了 3900 年”。"},{"id":"2026-T1-P3-S11","sec":"text1","sec_label":"Text 1","level":3,"en":"The team reconstructed the animals’ evolutionary tree and used computer models to pinpoint the domestication event when herders in Kenya and the Horn of Africa tamed wild asses.","core":"The team reconstructed the evolutionary tree and used computer models to pinpoint the domestication event.","structure":"reconstructed 和 used 是并列谓语；to pinpoint ... 是 used computer models 的目的；when herders ... tamed wild asses 是关系副词 when 引导的定语从句，修饰 event。","key":"pinpoint：常见义为“指出准确位置”；此处指通过模型精确确定某一历史事件的时间和起点。；ass：此处是“驴、野驴”，不是骂人的粗俗用语。；evolutionary tree：进化树，用来表示物种或样本之间的演化关系。；the Horn of Africa：非洲之角，指非洲东北部的区域。","zh":"研究团队重建了这些动物的进化树，并利用计算机模型精确确定了那次驯化事件：当时肯尼亚和非洲之角的牧民驯服了野驴。","tip":"when 不是单纯的时间状语从句，而是具体说明这次事件中发生了什么；in Kenya and the Horn of Africa 修饰 herders 的所在地。"},{"id":"2026-T1-P3-S12","sec":"text1","sec_label":"Text 1","level":3,"en":"They then traced how the animals spread across the rest of the continent into Europe and Asia about 2,500 years later.","core":"They traced how the animals spread ...。","structure":"how the animals spread ... 是 traced 的宾语从句；across the rest of the continent 和 into Europe and Asia 依次说明扩散范围和跨洲方向；about 2,500 years later 表示相对于最初驯化事件的时间。","key":"trace how ...：追踪、还原……的过程。；spread across ... into ...：扩散到……各处并进入……。","zh":"随后，他们追踪了这些动物如何在约 2500 年后扩散到非洲大陆的其他地区，并进入欧洲和亚洲。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T1-P4-S13","sec":"text1","sec_label":"Text 1","level":3,"en":"Though it’s still unclear why the original domestication happened, *Science News*’ Freda Kreier reports that the event coincided with the Sahara growing larger and drier.","core":"主句为 Freda Kreier reports that the event coincided with ...。","structure":"Though it’s still unclear why ... happened 是让步状语从句，其中 why ... happened 作 unclear 的主语；that 引导 reports 的宾语从句；the Sahara growing larger and drier 是动名词复合结构，作 with 的宾语。","key":"coincide with：与……同时发生、恰好相合；这里说明时间上的吻合，并不直接证明撒哈拉变干是驯化的唯一原因。；the original domestication：最初的驯化事件。；grow larger and drier：变得更大、更干燥；growing 后接形容词作状态变化的补语。","zh":"尽管最初的驯化为何发生仍不清楚，《科学新闻》的弗雷达·克雷尔报道说，这一事件恰逢撒哈拉变得更大、更干旱。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T1-P4-S14","sec":"text1","sec_label":"Text 1","level":3,"en":"“Donkeys are champions when it comes to carrying stuff and are good at going at deserts,” co-author Ludovic Orlando, an evolutionary biologist at Paul Sabin University in France, tells the publication.","core":"引语中为 Donkeys are champions ... and are good at ...；全句的引述主干是 Ludovic Orlando tells the publication。","structure":"when it comes to carrying stuff 是介词短语，说明讨论范围；an evolutionary biologist ... 是 Orlando 的同位语；说话者和谓语置于引语之后。","key":"champion：常见义为“冠军”，此处作名词比喻“佼佼者、能手”。；stuff：非正式用语，指东西、物品；这里突出驴适合承担搬运任务。；go at deserts：原文中的非正式表达，结合上下文指在沙漠环境中行进、活动。；when it comes to：说到、涉及……时。","zh":"共同作者、法国保罗·萨宾大学的进化生物学家卢多维克·奥兰多对该刊物说：“说到搬运东西，驴可是佼佼者，而且很适合在沙漠中行动。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T1-P5-S19","sec":"text1","sec_label":"Text 1","level":3,"en":"But understanding where the animals were first domesticated could guide archaeologists to a narrow region to search for insights about the original tamed donkeys.","core":"understanding ... could guide archaeologists to a narrow region。","structure":"where the animals were first domesticated 是 understanding 的宾语从句；to a narrow region 是 guide 的方向补语；第二个 to search ... 是目的状语，说明考古学家前往该区域做什么；where 引导的从句为被动结构。","key":"insight：此处指有助于理解过去情况的线索或认识，不是“洞察力”这一抽象能力本身。","zh":"但弄清这些动物最初在哪里被驯化，可能会引导考古学家把搜索范围缩小到一个较小的区域，从而寻找有关最初被驯化的驴的线索。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T1-P6-S20","sec":"text1","sec_label":"Text 1","level":3,"en":"Not only does understanding the equines’ genetic makeup help reveal their contribution to human history, but it also might improve their management in the future, as climate change alters the planet’s environment, write the authors.","core":"understanding the equines’ genetic makeup helps reveal their contribution ... and might improve their management ...。","structure":"Not only 置于句首引起部分倒装，正常语序是 understanding ... does help；but it also 引出第二个并列效果；as climate change alters ... 是背景状语从句；write the authors 是句末倒装的引述语。","key":"makeup：常见义为“化妆品、化妆”，此处指构成、组成，genetic makeup 即遗传构成。；management：此处指对动物的照料、养护和管理，不是企业管理。；genetic makeup：遗传构成、基因组成。；reveal one’s contribution to：揭示某物对……所作的贡献。","zh":"作者写道，了解马科动物的遗传构成不仅有助于揭示它们对人类历史的贡献，而且随着气候变化改变地球环境，这种了解也可能改善人们未来对它们的管理。","tip":"does ... help 中的 does 是强调并参与倒装，不要把 not only 后的 does 误当成实义动词；it 指代前面的 understanding ...，而 their 指马科动物。"},{"id":"2026-T2-P1-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"There’s no business like show business — but in Los Angeles, it feels like there’s no business at all.","core":"前半句是 There’s no business like show business；后半句是 it feels like there’s no business at all。","structure":"破折号连接一个广为人知的判断和对洛杉矶现状的转折；like show business 表示“像演艺业一样”；there’s no business at all 是 feels like 后的表语从句。","key":"business：前一个 business 指行业，show business 指演艺业；后一个 business 指实际的商业活动或制作业务，不能都机械译成“生意”。；show business：演艺业、娱乐业。；at all：用于否定句，加强语气，意为“根本、丝毫”。","zh":"没有哪个行业像演艺业这样独特——但在洛杉矶，演艺业却让人感觉几乎已经没有生意可做了。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T2-P2-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"If that sounds melodramatic, consider this: The Art Directors Guild, a labor union representing about 3,000 film workers, has suspended a training program and issued a statement explaining that “we cannot in good conscience encourage you to pursue our profession”","core":"The Art Directors Guild has suspended a training program and issued a statement。","structure":"a labor union representing about 3,000 film workers 是工会的同位语，其中 representing ... 修饰 union；explaining that ... 是现在分词短语，说明声明的内容；引号内是 explaining 的宾语从句。","key":"melodramatic：本义与“情节剧”有关，此处指言辞过于煽情、夸张。；in good conscience：凭良心、问心无愧地；不是“在良好的意识中”。；pursue：此处指从事、追求某种职业道路，不只是“追赶”。；labor union：劳工工会。","zh":"如果这听起来有些戏剧化，请看这样的事实：代表约 3000 名电影从业者的艺术指导工会暂停了一项培训项目，并发表声明说：“凭良心，我们无法鼓励你从事我们的职业。”","tip":"representing 修饰工会，不是修饰电影从业者；we 指工会及其成员，而非文章作者本人。"},{"id":"2026-T2-P2-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"This is a reaction to Hollywood’s decline, which is reaching a critical point for the industry and Southern California.","core":"This is a reaction to Hollywood’s decline。","structure":"which is reaching a critical point ... 是非限制性定语从句，补充说明 Hollywood’s decline；for the industry and Southern California 说明衰退影响的对象。","key":"reaction：此处指针对某种局势采取的回应行动，不是生理上的“反应”。；critical point：危急关头、关键节点；这里强调形势严重，而不是“批评的观点”。；a reaction to：对……的反应或回应。；reach a critical point：达到危急或关键阶段。","zh":"这反映的是好莱坞的衰退，而这种衰退正对整个影视业和南加州造成越来越严重的影响，已经到了关键阶段。","tip":"which 指 Hollywood’s decline，不是指前面的培训项目或声明；for 表示“对……而言”，不是原因。"},{"id":"2026-T2-P3-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"Production has been slipping away from Hollywood since the 1950s, but the effects have never been more apparent than at present.","core":"前半句 Production has been slipping away from Hollywood；后半句 the effects have never been more apparent than at present。","structure":"since the 1950s 与现在完成进行时搭配，强调从过去持续到现在的变化；but 连接制作外流这一过程和其当前后果。","key":"slip away from：逐渐离开、慢慢流失；不是突然“滑走”。；apparent：明显的、显而易见的；此处不是“表面上的”。；at present：目前、现在。；have never been more ... than ...：从未像……时这样……，是强调最高程度的比较结构。","zh":"自 20 世纪 50 年代以来，影视制作一直在逐渐离开好莱坞，但其影响从未像现在这样明显。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T2-P3-S05","sec":"text2","sec_label":"Text 2","level":3,"en":"Other regions in the United States, Canada and Europe have steadily increased incentives to attract TV shows and movies, leaving California in the dust.","core":"Other regions ... have increased incentives。","structure":"in the United States, Canada and Europe 说明地区范围；to attract ... 是目的状语；leaving California in the dust 是现在分词短语，表示前一行动造成的结果。","key":"leave somebody in the dust：把某人远远甩在后面；这里是比喻其他地区在争夺影视制作方面超过了加州。；steadily increase：持续、稳步增加。；incentive：激励措施、优惠政策，常指税收或补贴等吸引投资的手段。；attract TV shows and movies：吸引电视节目和电影项目来本地制作。","zh":"美国其他地区、加拿大和欧洲一直在稳步增加吸引电视节目和电影制作的优惠措施，使加州逐渐落在了后面。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T2-P3-S06","sec":"text2","sec_label":"Text 2","level":3,"en":"Georgia offers up to 30% in transferable tax credits on film and TV production costs, plus an additional 10% increase on the base tax credit if the project includes a Georgia promotional logo.","core":"Georgia offers tax credits ... plus an additional increase ...。","structure":"on film and TV production costs 说明税收抵免针对的成本；if the project includes ... 是条件状语从句，限定额外 10% 增加的适用条件；promotional logo 是州政府宣传标识。","key":"credit：此处是税收抵免额，不是“信用”或“学分”。；base tax credit：基础税收抵免额，即未计算额外优惠前的基准额度。；up to：最高达，表示上限而非固定比例。；transferable tax credit：可转让的税收抵免。","zh":"乔治亚州为电影和电视制作成本提供最高 30% 的可转让税收抵免；如果项目包含乔治亚州的宣传标识，还会在基础税收抵免上额外增加 10%。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T2-P4-S07","sec":"text2","sec_label":"Text 2","level":3,"en":"Even as California lost a huge volume of production to other locations, there was still plenty of film production taking place in Los Angeles before this year.","core":"主句为 there was still plenty of film production taking place in Los Angeles。","structure":"Even as California lost ... 是让步或伴随背景从句；to other locations 说明制作流向；taking place in Los Angeles 是现在分词短语修饰 film production。","key":"volume：此处指数量或规模，不是“音量”。；take place：发生、进行；production taking place 指制作活动正在开展。","zh":"尽管加州有大量影视制作流失到其他地方，但在今年之前，洛杉矶仍然有大量电影制作在进行。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T2-P4-S08","sec":"text2","sec_label":"Text 2","level":3,"en":"We were kept afloat by “peak TV” the glut of content that was required by the explosion of streaming services.","core":"We were kept afloat by “peak TV”.","structure":"the glut of content ... 与 peak TV 构成同位解释，说明这里所说的电视高峰具体是大量内容；that was required by ... 修饰 content。","key":"keep afloat：使……维持运转、避免陷入困境；本义是让东西漂浮在水面上。；glut：过量、过剩，此处指流媒体平台为争夺用户而制造的大量内容。；peak TV：电视内容产量异常高的时期，文中指流媒体推动的剧集制作热潮。；the explosion of：……的爆发式增长。","zh":"流媒体服务爆发式增长所必需的大量内容（即“剧集巅峰潮”），让我们得以勉强维持下去。","tip":"required by 表示流媒体服务爆发带来了对大量内容的需求，不是说内容“被要求必须爆炸”。原文该处标点未加逗号，阅读时应按同位语理解。"},{"id":"2026-T2-P5-S10","sec":"text2","sec_label":"Text 2","level":3,"en":"Back then platforms such as Netflix, Amazon and Apple TV hemorrhaged billions of dollars to generate content to attract new subscribers, resulting in 633 scripted series being released that year.","core":"platforms ... hemorrhaged billions of dollars。","structure":"such as ... 举例说明平台；两个 to generate 和 to attract 不定式依次表示投入资金的目的；resulting in ... 是现在分词短语，说明结果；being released 是动名词的被动形式。","key":"hemorrhage：本义为“大出血”，此处作夸张用法，指资金大量流出、烧掉巨额资金。；scripted series：有预先编写剧本的系列剧，通常指剧情类剧集，不是“被操纵的系列”。；generate content：制作、生产内容。；subscriber：订阅者、付费用户。","zh":"当时，Netflix、亚马逊和 Apple TV 等平台为了制作内容、吸引新订阅者，烧掉了数十亿美元，结果当年共有 633 部剧本类电视剧上线。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T2-P5-S11","sec":"text2","sec_label":"Text 2","level":3,"en":"As the streamers’ emphasis changed from subscriber growth to profitability, prices for the services went up and the number of new shows went down to 481 released in 2023, with the number expected to dip into the 300s within a few years.","core":"prices ... went up and the number of new shows went down to 481。","structure":"As ... changed ... 是原因或时间背景从句；from subscriber growth to profitability 说明战略重点的转变；released in 2023 修饰 481 所指的剧集；with the number expected ... 是独立主格结构，补充未来预测。","key":"profitability：盈利能力、获利状况，不只是一次性的“利润”。；dip into the 300s：下降到 300 多的区间；dip 表示下探、下降，不是“蘸入”。；change from A to B：从 A 转向 B。；subscriber growth：订阅用户增长。","zh":"随着流媒体平台的重点从增加订阅者转向实现盈利，这些服务的价格上涨了，新剧数量则下降到 2023 年发布的 481 部；预计几年内这一数字还会降至 300 多部。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T2-P6-S12","sec":"text2","sec_label":"Text 2","level":3,"en":"If productions in Southern California dip below a critical level for too long, the industry’s essential talent will drift away along with enormous sums of revenue.","core":"条件成立时，主句为 the industry’s essential talent will drift away along with enormous sums of revenue。","structure":"If productions ... dip below ... 是条件状语从句；in Southern California 修饰 productions；for too long 修饰 dip 所表示的状态持续时间；along with ... 表示人才流失和收入流失同步发生。","key":"drift away：逐渐流失、离开；强调人才并非一夜之间消失，而是随着机会减少慢慢转移。；essential talent：关键人才、不可或缺的专业人才，不是“有天赋的人才”这一泛泛概念。；dip below：下降到……以下。；for too long：持续太久。","zh":"如果南加州的制作量长时间低于临界水平，影视业不可或缺的人才就会流失，大量收入也会随之流走。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T2-P6-S13","sec":"text2","sec_label":"Text 2","level":3,"en":"Persuading studios to film here would become much more challenging if we couldn’t offer a deep bench of local film workers, on-screen talent and local businesses that support the entertainment industry.","core":"Persuading studios to film here would become much more challenging。","structure":"Persuading studios ... 是动名词短语作主语；if we couldn’t offer ... 是条件状语从句；that support the entertainment industry 修饰 local businesses，不是修饰前面的全部名词。","key":"a deep bench：本义指板凳阵容，体育语境中指替补力量充足；此处比喻某领域拥有数量充足、经验丰富的人才和配套力量。；on-screen talent：出现在镜头前的演员或主持等人才，不是幕后技术人员。；persuade somebody to do：说服某人做某事。；film here：在这里拍摄。","zh":"如果我们无法提供一支实力雄厚的本地电影工作者、银幕人才以及支持娱乐业的本地企业队伍，说服制片厂来这里拍摄就会困难得多。","tip":"deep bench 不是实际的长凳，而是“人才储备充足”；local 分别修饰电影工作者、银幕人才和企业。"},{"id":"2026-T2-P7-S15","sec":"text2","sec_label":"Text 2","level":3,"en":"These agencies and other government bodies should dramatically improve incentives to keep our current shows and attract new productions to Los Angeles.","core":"These agencies and other government bodies should improve incentives。","structure":"to keep ... and attract ... 是目的状语，其中 keep 与 attract 并列；our current shows 和 new productions 分别是两个动词的宾语；to Los Angeles 表示新项目的目的地。","key":"government body：政府机构或政府部门。；keep current shows：留住正在本地制作的影视项目。；attract new productions：吸引新的影视制作项目。","zh":"这些机构和其他政府部门应大幅改善激励措施，以留住当前的影视项目，并吸引新的制作项目来到洛杉矶。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T2-P7-S16","sec":"text2","sec_label":"Text 2","level":3,"en":"Let’s go on with the show...and make sure the show doesn’t go on without us.","core":"Let’s go on with the show and make sure ...。","structure":"Let’s 引出号召；make sure 与 go on 并列；the show doesn’t go on without us 是 make sure 的宾语从句。","key":"go on with：继续进行；这里既指继续影视制作，也呼应 show business 的修辞。；keep somebody afloat：使某人或某事维持下去。；a glut of content：内容过剩、大量内容。；change the emphasis from A to B：把重点从 A 转向 B。","zh":"让演出继续下去……并确保这场演出不会在没有我们的情况下继续。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Sir John Reith said that it would end “isolation of the spirit” and rejoiced: “It does not matter how many thousands may be listening, there is always enough for others...the genius and the fool, the wealthy and the poor listen simultaneously.”","core":"外层主干为 Sir John Reith said ... and rejoiced；said 后的宾语从句为 it would end isolation。","structure":"冒号后的直接引语解释 Reith 为什么欣喜；引语中 It does not matter ... 是让步式表达，后面的 the genius and the fool, the wealthy and the poor listen simultaneously 说明不同人群可以共享同一广播。","key":"isolation of the spirit：精神上的隔绝或孤独，不是物理意义上的隔离。；rejoice：欣喜、欢庆；比普通的 be happy 语气更强。；the genius and the fool：用两类极端人物代表所有不同社会群体，突出无线电的普及范围。；it does not matter how ...：无论……都无关紧要，后面强调真正重要的结果。","zh":"约翰·里思爵士说，无线电将终结“精神上的孤独”，并欣喜地表示：“无论有成千上万的人在收听，都总有足够的内容留给其他人……天才和愚者、富人和穷人都能同时收听。”","tip":"there is always enough for others 指广播内容可以被所有人共同接收，不是说听众越多资源越少。"},{"id":"2026-T3-P2-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"Opening this week, a book and exhibition curated by Beatty Rubens at the Bodleian in Oxford records how radio changed everyday life from 1922 to 1939.","core":"a book and exhibition records how radio changed everyday life。","structure":"Opening this week 是现在分词短语，说明展览开幕时间；curated by Beatty Rubens 是过去分词短语，修饰 a book and exhibition；at the Bodleian in Oxford 说明地点；how radio changed ... 是 records 的宾语从句。","key":"opening：此处作现在分词，意为“开幕、开始展出”，不是“打开”。；curate：策划、编选展览或资料，不只是“照料”。；everyday life：日常生活。；from 1922 to 1939：从 1922 年到 1939 年这一历史时期。","zh":"本周在牛津大学博德利图书馆开幕的一场展览及其配套书籍，由贝蒂·鲁本斯策划，记录了 1922 年至 1939 年间无线电如何改变日常生活。","tip":"句首 Opening 的逻辑主语是展览，而不是贝蒂·鲁本斯；a book and exhibition 是并列的两项成果。"},{"id":"2026-T3-P2-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"She draws on letters, diaries and fiction, and a 1939 field notebook of verbatim audience research by Winifred Gill.","core":"She draws on letters, diaries and fiction, and a field notebook。","structure":"and 连接两组资料：前三项书信、日记和小说，以及一本田野笔记；of verbatim audience research 说明笔记记录的内容；by Winifred Gill 说明调查或笔记的记录者。","key":"draw on：利用、参考；不是“画在……上”。；verbatim：逐字的、原话记录的，强调没有改写或概括。；field notebook：田野笔记、实地记录本。；audience research：观众调查、受众研究。","zh":"她参考了书信、日记和小说，以及温妮弗雷德·吉尔在 1939 年记录的一本逐字呈现观众调查的田野笔记。","tip":"verbatim 修饰 audience research 的记录方式，表示原话调查资料，不是某人的姓名或地名。"},{"id":"2026-T3-P3-S07","sec":"text3","sec_label":"Text 3","level":3,"en":"A cartoon mocks a group failing to converse because they’re all in headphones.","core":"A cartoon mocks a group。","structure":"failing to converse 是现在分词短语，补充说明这群人的状态；because they’re all in headphones 是原因状语从句，解释无法交谈的原因。","key":"mock：嘲弄、讽刺；不只是中性的“模仿”。；converse：交谈、对话；此处作动词，不是“相反的”。","zh":"一幅漫画嘲弄了一群无法交谈的人，因为他们都戴着耳机。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T3-P3-S09","sec":"text3","sec_label":"Text 3","level":3,"en":"A woman says there have been fewer street fights since the arrival of the wireless but also less stopping and “talking on the brush handle”.","core":"A woman says there have been fewer street fights but also less stopping and talking ...。","structure":"there have been ... 是 says 后的宾语从句；since the arrival of the wireless 是时间状语；but also 连接两个并列结果，分别是街头打架减少和邻里停留聊天减少。","key":"the arrival of：……的到来或出现。；talking on the brush handle：字面是“靠着扫帚柄聊天”，实际指邻里间停下来进行随意闲聊；后文再次用这个表达对比智能手机时代的人际交往。","zh":"一位女士说，自从无线电出现后，街头打架少了，但人们停下来“靠着扫帚柄聊天”的情况也少了。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T3-P4-S11","sec":"text3","sec_label":"Text 3","level":3,"en":"I loved the man from the Thirties research who found that wireless suddenly offered “a lot of variety...things I thought I’d never be interested in...ice hockey perhaps”.","core":"I loved the man ... who found that wireless offered variety。","structure":"who found ... 是定语从句，修饰 the man；that wireless ... offered 是 found 的宾语从句；引语中的两个省略号表示说话者举例和思考时的停顿。","key":"variety：此处指内容的多样性和选择范围，不是“品种”这一具体分类。；interest：此处作动词，意为“使……感兴趣”。；the Thirties：20 世纪 30 年代。；a lot of variety：丰富多样的内容。","zh":"我很喜欢三十年代那项调查中一位男子的说法；他发现，无线电突然提供了“丰富得多的选择……一些我原以为自己永远不会感兴趣的东西……比如冰球”。","tip":"the Thirties research 指三十年代的调查，不是“来自三十年代的研究人员”；things I thought I’d never be interested in 中 I 是说话者本人。"},{"id":"2026-T3-P4-S12","sec":"text3","sec_label":"Text 3","level":3,"en":"True: for more than 80 pre-digital years, linear speech broadcasting brought the gift of serendipity, random enlivening of a car journey or dull manual task.","core":"linear speech broadcasting brought the gift of serendipity。","structure":"for more than 80 pre-digital years 是时间范围状语；random enlivening of a car journey or dull manual task 是对 the gift of serendipity 的同位解释，说明这种礼物具体带来的效果。","key":"serendipity：意外发现有价值或有趣事物的幸运；此处指听众没有主动寻找，却偶然听到有用或有趣的内容。；enliven：使变得有趣、使增添活力；不是简单的“点亮”。；linear broadcasting：按固定编排顺序连续播出的广播。；a dull manual task：枯燥的体力劳动。","zh":"的确，在长达 80 多年的数字化时代之前，线性语音广播带来了“意外发现”的礼物，让驾车旅程或枯燥的体力劳动不时随机变得有趣起来。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T3-P4-S13","sec":"text3","sec_label":"Text 3","level":3,"en":"In my own book about radio I recorded how, on one drive: “I caught up with the news, learnt some 17th-century history, and was startlingly educated by an unpretentious programme on the history of the stethoscope.”","core":"主句为 I recorded how ...；引语内部三个并列谓语是 caught up、learnt 和 was educated。","structure":"on one drive 是具体经历的时间背景；how 引导 recorded 的宾语从句；by an unpretentious programme 是被动结构中的施动者。","key":"catch up with the news：了解最新新闻，而不是“追上新闻”。；startlingly：出人意料地、令人吃惊地。；unpretentious：朴实的、不矫饰的；此处形容节目内容平实却很有教育意义。；17th-century history：17 世纪历史；复合形容词中的连字符不能省略。","zh":"在我自己那本关于无线电的书中，我记录过一次驾车经历：“我了解了新闻，学到了一些 17 世纪的历史，还被一档朴实无华的听诊器历史节目意外地上了一课。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T3-P5-S15","sec":"text3","sec_label":"Text 3","level":3,"en":"With multiple networks and countless podcasts, a smartphone user selects what to hear and when.","core":"a smartphone user selects what to hear and when。","structure":"With multiple networks and countless podcasts 是介词短语，说明选择增多的背景；what to hear 是“听什么”，when 省略了与前文相同的 to hear。","key":"countless：数不清的、无数的。；select what to hear and when：选择听什么以及在什么时候听；what 和 when 分别引导选择内容和时间。","zh":"面对多个广播网络和数不清的播客，智能手机用户可以自行选择听什么以及什么时候听。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T3-P5-S16","sec":"text3","sec_label":"Text 3","level":3,"en":"And while it is wonderful to take a walk with anything in your headphones, infinite choice encourages us to shrink into niche interests and sympathetic beliefs.","core":"infinite choice encourages us to shrink into niche interests and sympathetic beliefs。","structure":"while it is wonderful to take a walk ... 是让步状语从句，其中 to take a walk 是真正主语；主句中 encourage somebody to do 后接 to shrink；in your headphones 说明散步时通过耳机听内容。","key":"shrink into：缩进、退缩到某个狭小范围中；此处是比喻用法。；sympathetic beliefs：与自己同调、相互支持的信念，不是“富有同情心的信仰”。；niche interest：小众、狭窄而专门的兴趣。；infinite choice：无限的选择；这里暗含选择过多也可能造成封闭。","zh":"尽管戴着耳机听任何内容去散步很美好，但无穷无尽的选择会促使我们缩进狭窄的兴趣和与自己相投的信念之中。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T3-P6-S18","sec":"text3","sec_label":"Text 3","level":3,"en":"Some will say the audiobook boom revives it, though I suppose you can then worry about the decline of reading.","core":"主句为 Some will say ...，其中宾语从句是 the audiobook boom revives it。","structure":"though I suppose ... 是让步插入，作者用略带调侃的方式提出另一种担忧；then 表示如果转向有声书，新的问题可能随之出现。","key":"boom：迅速发展、繁荣；这里指有声书市场或使用的兴盛。；revive：使恢复、重新焕发生机。","zh":"有人会说，有声书的兴起正在让这种能力复苏，不过我想，这样一来人们又可以担心阅读的衰落了。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T3-P6-S19","sec":"text3","sec_label":"Text 3","level":3,"en":"But inventions shape all of us and it is worth noticing when techno-social habits do change, and asking whether to control them a bit or shield the youngest.","core":"前半句为 inventions shape all of us；后半句为 it is worth noticing ... and asking ...。","structure":"when techno-social habits do change 是 noticing 的时间背景从句，do 用于强调；whether to control them a bit or shield the youngest 是 asking 的宾语，包含二选一的思考。","key":"shield：保护、使……免受影响；此处不是“盾牌”。；the youngest：年龄最小的人，语境中主要指儿童和青少年。；techno-social habits：由技术塑造、又影响社会交往的习惯。；it is worth doing：做某事是值得的。","zh":"但发明会塑造我们所有人；当技术与社会习惯确实发生变化时，值得注意这种变化，并思考是否应稍加控制这些习惯，或保护年纪最小的人。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T3-P6-S21","sec":"text3","sec_label":"Text 3","level":3,"en":"Today we fret about the isolating culture of smartphone-staring and selfie-vanity, but already in 1939 there was that lady regretting how, when all her street got wirelesses, it lost the neighbourly habit of “talking on the brush handle”.","core":"转折前为 we fret about ...；转折后为 there was that lady regretting ...。","structure":"regretting how ... 是现在分词短语，说明女士在惋惜什么；when all her street got wirelesses 是时间状语从句；it lost ... 中 it 指她所在的街区，lost 的宾语是邻里聊天习惯。","key":"fret about：为……烦恼、忧虑；不是“用 fret 品格演奏”。；smartphone-staring：长时间盯着智能手机的行为。；selfie-vanity：沉溺自拍、以自拍满足自我关注的状态。；wirelesses：wireless 的复数，指收音机或无线电设备。","zh":"如今，我们为盯着智能手机和沉溺自拍所造成的隔绝文化而烦恼；但早在 1939 年，就有一位女士在惋惜：当她所在街区的人家都装上收音机后，邻里间“靠着扫帚柄聊天”的习惯就消失了。","tip":"all her street 指整条街上的居民或家庭，不是街道这个物体安装了收音机；talking on the brush handle 与第三段同义，都是邻里随意聊天。"},{"id":"2026-T3-P6-S22","sec":"text3","sec_label":"Text 3","level":3,"en":"It’s enough to make a person put down the smartphone and go out front with a yard broom.","core":"It’s enough to make a person put down the smartphone and go out front。","structure":"to make ... 是结果或程度补充；put down 和 go out 是 make 后并列的无 to 不定式；with a yard broom 说明拿着什么。","key":"It’s enough to make somebody do：足以使某人做某事；这里是带有幽默色彩的感叹。；put down：放下；不是“批评、贬低”。；the art of mere listening：单纯倾听的能力或习惯。；the audiobook boom：有声书热潮。","zh":"这足以让人放下智能手机，拿着院子里的扫帚走到门前去。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P1-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"When Tom Swetnam joined the U.S. Forest Service in the 1970s, his mandate was to “put everything out,” he recalled.","core":"his mandate was to “put everything out”。","structure":"When Tom Swetnam joined ... 是时间状语从句；to put everything out 是系动词 was 后的不定式表语；he recalled 是句末引述语。","key":"mandate：常见义为“任期、授权”，此处指上级规定的任务或政策要求。；put everything out：此处 put out 指扑灭火灾，everything 指所有火情，而不是把所有东西拿出去。；join the U.S. Forest Service：加入美国林务局。；recall：回忆、回想；比 remember 更正式。","zh":"汤姆·斯韦特南回忆说，20 世纪 70 年代他加入美国林务局时，自己的任务是“把所有火都扑灭”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P1-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"But when Swetnam enrolled in graduate school at the University of Arizona’s Laboratory of Tree-Ring Research, he was surprised to find a record of repeated blazes dating back hundreds of years before European colonists arrived on the continent.","core":"he was surprised to find a record of repeated blazes。","structure":"when Swetnam enrolled ... 是时间状语从句；to find ... 是 was surprised 的结果或具体内容；dating back ... 是现在分词短语，修饰 repeated blazes；before European colonists arrived ... 说明火灾记录早于殖民者到来。","key":"enroll in：注册进入、入学；不是“登记某个项目”这么简单。；blaze：猛烈的火焰或火灾；此处是森林火灾。；date back：追溯到、始于某一时间。；tree-ring research：树轮研究，通过年轮等信息研究树木和历史环境。","zh":"但当斯韦特南进入亚利桑那大学树轮研究实验室读研究生时，他惊讶地发现，在欧洲殖民者抵达这片大陆之前数百年，这里就有反复发生火灾的记录。","tip":"dating back 修饰火灾发生的年代，不是树轮研究“追溯”了几百年；before 的参照点是欧洲殖民者抵达大陆。"},{"id":"2026-T4-P2-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"The fact that fires happened so often meant they couldn’t have been severe enough to kill most trees.","core":"The fact ... meant they couldn’t have been severe enough to kill most trees。","structure":"that fires happened so often 是 The fact 的同位语从句；severe enough to kill ... 是“足够严重以至于……”的结构；they 指反复发生的火灾。","key":"severe：严重的、猛烈的；此处描述火灾强度，而不是人的严厉态度。；couldn’t have been：对过去情况的否定推断，意为“不可能曾经是……”。","zh":"火灾如此频繁这一事实意味着，它们不可能严重到足以杀死大多数树木。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P2-S05","sec":"text4","sec_label":"Text 4","level":3,"en":"Instead, a growing body of research showed that frequent, low-severity fires made many ecosystems healthier.","core":"a growing body of research showed that frequent, low-severity fires made many ecosystems healthier。","structure":"that 引导 showed 的宾语从句；frequent, low-severity 并列修饰 fires；make + 宾语 + 形容词 表示“使……变得……”；Instead 与上一句构成转折。","key":"a growing body of research：不断增加的研究成果或研究证据，不是“正在生长的研究身体”。；low-severity：低强度的，指火灾造成的破坏程度较低。；instead：相反、反而，用于推翻前面可能的直觉。；make ecosystems healthier：使生态系统更健康。","zh":"相反，越来越多的研究表明，频繁但低强度的火灾反而让许多生态系统更加健康。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P2-S06","sec":"text4","sec_label":"Text 4","level":3,"en":"They rid the forest of dead and sick trees, reducing competition and curbing the spread of disease.","core":"They rid the forest of dead and sick trees。","structure":"reducing competition 和 curbing the spread of disease 是两个现在分词短语，说明清除枯病树木产生的结果；三个动词短语共同解释低强度火灾的生态益处。","key":"rid ... of：使……摆脱、清除……；不是普通的 remove 的机械替换。；curb：抑制、遏制；此处不是“路缘石”。；dead and sick trees：枯死树木和患病树木。；reduce competition：减少竞争；这里指树木之间对资源的竞争。","zh":"这些火灾清除了森林中的枯树和病树，减少了树木之间的竞争，并遏制了疾病的传播。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P2-S07","sec":"text4","sec_label":"Text 4","level":3,"en":"Because flammable material couldn’t build up on the landscape, blazes tended to move Slowly and peter out when they reached the footprints of previous burns.","core":"主句为 blazes tended to move Slowly and peter out。","structure":"Because flammable material couldn’t build up ... 是原因状语从句；move Slowly 和 peter out 是并列谓语；when they reached ... 是时间状语从句，they 指火势或火灾。","key":"build up：积累、逐渐增多；不是“建立起来”。；peter out：逐渐减弱并最终停止；此处指火势慢慢熄灭。；footprint：本义为“脚印”，此处指此前火灾留下的范围或痕迹。；flammable material：易燃物。","zh":"由于易燃物无法在地表不断积累，火势往往蔓延得较慢，并在到达此前火灾留下的区域时逐渐熄灭。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P3-S10","sec":"text4","sec_label":"Text 4","level":3,"en":"In the study, the researchers compared the historical fire cadence with the wildfires recorded over the past few decades, and uncovered a striking shortfall.","core":"the researchers compared ... and uncovered ...。","structure":"In the study 是范围状语；with the wildfires recorded ... 中 recorded 是过去分词，修饰 wildfires；compared 和 uncovered 是并列谓语。","key":"cadence：本义可指节奏、韵律，此处指火灾发生的频率或周期。；shortfall：不足、缺口；这里指实际火灾数量比历史预期少很多。；over the past few decades：在过去几十年中。；a striking shortfall：明显而惊人的缺口。","zh":"在这项研究中，研究人员将历史上的火灾频率与过去几十年记录的野火进行比较，发现火灾数量出现了惊人的短缺。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P3-S11","sec":"text4","sec_label":"Text 4","level":3,"en":"The NAFSN sites experienced less than a quarter of the number of fires that would have been expected without fire suppression.","core":"The NAFSN sites experienced less than a quarter of the number of fires。","structure":"that would have been expected without fire suppression 是定语从句，修饰 the number of fires；without fire suppression 构成反事实条件背景，说明预期数量是在没有人为压火的情况下计算的。","key":"experience fires：经历、发生火灾；不是“体验火灾”这一主观体验。；fire suppression：人为灭火、压制火灾的措施。；less than a quarter of：不到……的四分之一。；would have been expected：本来预计会发生，带有与现实情况比较的假设意味。","zh":"如果没有人为扑火，NAFSN 这些地点本应发生的火灾数量，实际发生的还不到其四分之一。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P4-S12","sec":"text4","sec_label":"Text 4","level":3,"en":"This deficit is a testament to the effectiveness of modern firefighting, said Kelly Martin, a past president of the International Association of Wildland Fire.","core":"This deficit is a testament to the effectiveness of modern firefighting。","structure":"said Kelly Martin ... 是句末引述语；a past president ... 是 Kelly Martin 的同位语。","key":"deficit：不足、缺口；此处指实际火灾数与原本预期数量之间的差额。；testament：证明、明证；不是宗教意义上的“圣经旧约”。；a testament to：……的证明、明证。；modern firefighting：现代消防或现代灭火工作。","zh":"国际野地火灾协会前主席凯莉·马丁说，这一缺口证明了现代消防工作的有效性。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P4-S13","sec":"text4","sec_label":"Text 4","level":3,"en":"“Yet the combined consequences of suppression and climate change have eroded humanity’s ability to suppress fires, particularly those that ignite under the most dangerous weather conditions.”","core":"the combined consequences ... have eroded humanity’s ability to suppress fires。","structure":"of suppression and climate change 修饰 consequences；particularly those that ignite ... 对 fires 作进一步限定；that ignite ... 是定语从句。","key":"erode：逐渐削弱、侵蚀；不是只表示物理表面的磨损。；ignite：点燃、着火；此处是不及物意义“燃起”。；combined consequences of：……共同造成的后果。；particularly those that ...：尤其是那些……的火灾；those 指 fires。","zh":"然而，灭火措施与气候变化叠加产生的后果已经削弱了人类扑灭火灾的能力，尤其是扑灭那些在最危险天气条件下燃起的火灾的能力。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P5-S14","sec":"text4","sec_label":"Text 4","level":3,"en":"To prevent entire ecosystems from going up in smoke, Martin said, people must bring healthy fire back to places that need it.","core":"people must bring healthy fire back to places。","structure":"To prevent ... 是目的状语；from going up in smoke 是 prevent 后的介词结构；that need it 修饰 places，it 指 healthy fire。","key":"go up in smoke：化为乌有、被大火毁掉；这里是形象表达，不是字面上的“升入烟雾”。；healthy fire：有益于生态系统的、可控制的火，而不是任何一场自然野火。；prevent ... from doing：防止……做某事。；bring ... back to：把……重新带回……。","zh":"马丁说，为了防止整个生态系统毁于大火，人们必须把有益的火重新带回那些需要它的地方。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P5-S15","sec":"text4","sec_label":"Text 4","level":3,"en":"At Yosemite National Park, Martin oversaw the use of what is known as prescribed burns to make the landscape more resilient.","core":"Martin oversaw the use of prescribed burns to make the landscape more resilient。","structure":"what is known as prescribed burns 是 the use of 的宾语，what 引导名词性从句；to make ... 是目的状语；地点短语置于句首。","key":"prescribed burn：计划性燃烧、处方性燃烧，指由专业人员在可控条件下有意点燃的火。；resilient：有韧性的、恢复力强的；此处指景观更能承受和恢复火灾影响。；oversee the use of：监督……的使用或实施。；what is known as：所谓的、被称为……的。","zh":"在约塞米蒂国家公园，马丁负责监督使用所谓的计划性燃烧，以增强景观抵御火灾的能力。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P5-S16","sec":"text4","sec_label":"Text 4","level":3,"en":"These fires were carefully planned and intentionally ignited during periods when weather kept the blazes easy to control, and helped eliminate some of the fuel that had built up around the important park’s facilities.","core":"These fires were carefully planned and intentionally ignited ... and helped eliminate some of the fuel ...。","structure":"were planned、were ignited 与 helped eliminate 共同描述这些计划性燃烧；during periods when ... 说明点火时机；that had built up ... 修饰 fuel，过去完成时表示可燃物在计划性燃烧前已经积累。","key":"fuel：此处指可供火灾燃烧的枯枝、灌木等可燃物，不是交通工具使用的燃料。；facilities：设施、建筑等配套设施，不是“能力”。；be intentionally ignited：被有意点燃。；keep the blazes easy to control：使火势保持在易于控制的状态。","zh":"这些火灾经过周密计划，并在天气条件使火势易于控制的时期被有意点燃；它们还帮助清除了重要公园设施周围积累的一部分可燃物。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P5-S17","sec":"text4","sec_label":"Text 4","level":3,"en":"Research shows that these prescribed burns make subsequent wildfires less severe, even if later fires happen under the most dangerous weather conditions.","core":"Research shows that these prescribed burns make subsequent wildfires less severe。","structure":"that 引导 shows 的宾语从句；even if later fires happen ... 是让步状语从句，说明即便未来火灾条件恶劣，计划性燃烧的减灾效果仍然存在。","key":"subsequent：随后发生的、后续的；不是“次要的”。；make wildfires less severe：使野火的严重程度降低。；even if：即使、哪怕，引导让步条件。；later fires：之后发生的火灾。","zh":"研究表明，即使后来的火灾发生在最危险的天气条件下，这些计划性燃烧也会使随后发生的野火不那么猛烈。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P6-S18","sec":"text4","sec_label":"Text 4","level":3,"en":"Yet even as scientists and public officials increasingly agree on the need for more fires in our forests, climate change is making this tactic more challenging, experts said.","core":"climate change is making this tactic more challenging。","structure":"even as scientists and public officials ... 是让步或伴随背景从句；on the need for more fires 说明达成共识的内容；this tactic 指前文的计划性燃烧或恢复有益火灾的策略。","key":"tactic：此处指通过计划性燃烧恢复有益火灾的策略，不是军事战术。；challenging：困难的、棘手的；不是单纯的“具有挑战性”口号。；agree on the need for：就需要……达成共识。；public official：政府官员。","zh":"然而，尽管科学家和政府官员越来越认同森林需要更多火灾，气候变化却让这种做法变得更具挑战性，专家们说。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2026-T4-P6-S19","sec":"text4","sec_label":"Text 4","level":3,"en":"“It’s a double-edged sword because wildfires are getting more severe and larger under climate change and we need this work even more, but then the work gets more challenging,” said Susan Prichard, a fire ecologist at the University of Washington.","core":"引语的核心结构是 wildfires are getting more severe and larger ... and we need this work even more, but then the work gets more challenging。","structure":"because 引出解释；其中 and 连接野火变化与工作需求增加，but 再转出实施难度上升；said Susan Prichard ... 是句末引述语。","key":"double-edged sword：双刃剑，指同一情况同时带来必要性和风险、好处和困难。；this work：指前文通过计划性燃烧等方式恢复有益火灾、降低燃料负荷的工作。；get more severe and larger：变得更猛烈、规模更大。；under climate change：在气候变化影响下。","zh":"华盛顿大学火灾生态学家苏珊·普里查德说：“这是一把双刃剑，因为在气候变化影响下，野火正变得更猛烈、规模更大，我们比以前更需要这项工作，但与此同时，这项工作也变得更困难。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"}]};</script>

展出吗？我非常想亲眼看看。谢谢。\n你的朋友\n保罗\n\n请在答题卡上写约 100 词。不要在邮件中使用自己的真实姓名，用“李明”代替。","structure":[["称呼与回应感动","Dear Paul, / I'm delighted that the handwritten letters moved you."],["介绍手写信的来源与内容","They were written by ordinary Chinese family members — parents, grandparents and children — to one another, and each one preserves a small piece of daily life that phones and chat apps rarely capture."],["回答“是否公开展出”","The letters are indeed on public display. Since last Friday they have formed part of a small exhibition at the city library, and the show runs until the end of the month."],["提出陪同参观并介绍策展人","I'd be happy to take you there this weekend and introduce you to the curator, who can tell you how the letters were collected."],["结尾期待见面","Looking forward to seeing you."],["署名","Yours, / Li Ming"]],"expressions":["I'm delighted that...","be moved by...","They were written by... to one another.","preserve a small piece of daily life","phones and chat apps rarely capture","be on public display","form part of a small exhibition","The show runs until the end of the month.","I'd be happy to take you there.","introduce you to the curator","Looking forward to seeing you."],"traps":["回信对象是朋友 Paul，语气应亲切自然，但仍是书面邮件，不要通篇使用口语缩写或网络用语。","必须回答邮件中的两个问题：手写信“更多的情况”和“是否公开展出”；只写“我很感动”或只谈展览，都会造成要点不全。","开头要回应 moved，结尾要有期待见面或回复的收束；署名必须用 Li Ming，不能写真实姓名。","约 100 词，展览的时间、地点、展期给出一两项具体信息即可，不要展开成展览介绍或文化评论。","注意时态：信是“昨天”发布的、展览“从上周五”开始并“持续到月底”，现在完成时与一般现在时要用准确。"]},"partB":{"title":"Part B · 图表作文","score":20,"words":"160–200词","prompt":"Write an essay based on the charts below. In your essay, you should 1) describe the charts briefly, 2) interpret the charts, and 3) give your comments. Write your answer in 160-200 words on the ANSWER SHEET. (20 points)","prompt_zh":"根据下面的图表写一篇 160—200 词的短文。文中应：1）简要描述图表；2）解读图表；3）给出你的评论。请把答案写在答题卡上。","structure":[["第一段·描述图表","The two charts survey consumers' attitudes towards elderly-care robots... 39.3% fully accept, 32.8% partly accept, 27.9% reject; safety 46.30%, price 24.90%, convenience 10.70%."],["第二段·解读原因","The acceptance rate of over 70% reflects an aging population and heavier care burdens... robots can monitor health, remind users to take medicine or summon help... safety involves privacy, reliability and life-and-death decisions... price must remain affordable."],["第三段·发表评论","Elderly-care robots are a promising supplement, not a substitute for human company... safety data should be transparent and products easy for older users... only reliable and affordable technology can serve the elderly with dignity."]],"expressions":["The two charts survey consumers' attitudes towards...","The pie chart shows that...","...while 27.9% reject the idea.","The bar chart ranks users' concerns.","Safety comes first at 46.30%, followed by price at 24.90%.","Several factors lie behind this pattern.","reflect a pressing reality","shoulder heavier burdens","struggle to care for elderly relatives around the clock","fill this gap","place safety above all else","remain affordable for ordinary households","a promising supplement, not a substitute for human company","make safety data transparent","Only when... can it..."],"traps":["图表作文要准确引用数据：三个接受度比例和三个关注点比例至少各引两项，不能只写“大多数人接受”“大家最关心安全”。","饼图与柱状图要分别描述，不能混为一谈：“接受度”是态度，“关注点”是顾虑，二者是不同维度。","解读要落到“人口老龄化与照护缺口”和“安全、价格是普及障碍”，不要偏成“机器人会取代子女”或“科技让人变懒”。","160–200 词，三段为宜；数据描述不要超过全文三分之一，重点应放在原因解读和评论上。","评论要客观平衡：肯定养老机器人的前景，也指出安全、价格与人文关怀的局限，不要写成产品广告或纯技术赞美。"]}},"vocab":[{"w":"propel","pos":"词","cn":"常见义为“推进、推动”；此处是比喻用法，指驴为人类运输和生产提供动力，推动文明发展。","sec":"text1","sec_label":"Text 1","ctx":"For thousands of years, donkeys have been critical for propelling human civilizations forward.","note":"常见义为“推进、推动”；此处是比喻用法，指驴为人类运输和生产提供动力，推动文明发展。","forms":["propel"]},{"w":"be critical for","pos":"phr.","cn":"对……至关重要。","sec":"text1","sec_label":"Text 1","ctx":"For thousands of years, donkeys have been critical for propelling human civilizations forward.","note":"对……至关重要。","forms":["be critical for"]},{"w":"propel ... forward","pos":"phr.","cn":"推动……向 "sec_label":"Text 1","ctx":"The team published their findings in the journal *Science* this month.","note":"发表研究发现或研究结果。","forms":["publish findings"]},{"w":"tell their history themselves","pos":"phr.","cn":"不是字面上的“动物自己开口讲述”，而是说基因信息能够直接提供动物历史的证据。","sec":"text1","sec_label":"Text 1","ctx":"“Through their DNA, the animals are telling their history themselves,” co-author Samantha Brooks, an equine researcher at the University of Florida, says in a statement.","note":"不是字面上的“动物自己开口讲述”，而是说基因信息能够直接提供动物历史的证据。","forms":["tell their history themselves"]},{"w":"statement","pos":"n.","cn":"此处指机构或研究人员发布的声明，而不是普通的“陈述句”。","sec":"text1","sec_label":"Text 1","ctx":"“Through their DNA, the animals are telling their history themselves,” co-author Samantha Brooks, an equine researcher at the University of Florida, says in a statement.","note":"此处指机构或研究人员发布的声明，而不是普通的“陈述句”。","forms":["statement"]},{"w":"co-author","pos":"词","cn":"共同作者。","sec":"text1","sec_label":"Text 1","ctx":"“Through their DNA, the animals are telling their history themselves,” co-author Samantha Brooks, an equine researcher at the University of Florida, says in a statement.","note":"共同作者。","forms":["co-author"]},{"w":"equine","pos":"词","cn":"马科动物的；范围包括马、驴等马科动物。","sec":"text1","sec_label":"Text 1","ctx":"“Through their DNA, the animals are telling their history themselves,” co-author Samantha Brooks, an equine researcher at the University of Florida, says in a statement.","note":"马科动物的；范围包括马、驴等马科动物。","forms":["equine"]},{"w":"the human’s side of history","pos":"phr.","cn":"指从人类视角记录的历史，而不是“人类历史的一边”。","sec":"text1","sec_label":"Text 1","ctx":"“We usually only get the human’s side of history through written accounts, but of course written history does not always record exactly how something happened.","note":"指从人类视角记录的历史，而不是“人类历史的一边”。","forms":["the human’s side of history"]},{"w":"account","pos":"词","cn":"常见义为“账户”，此处指记载、叙述或史料。","sec":"text1","sec_label":"Text 1","ctx":"“We usually only get the human’s side of history through written accounts, but of course written history does not always record exactly how something happened.","note":"常见义为“账户”，此处指记载、叙述或史料。","forms":["account"]},{"w":"testimony","pos":"词","cn":"常见义为“证词、证言”；此处指 DNA 提供的生物学证据，并非人在法庭上的证词。","sec":"text1","sec_label":"Text 1","ctx":"Looking at these DNA sequences, we get a biological testimony to the environment these animals lived in and the experiences they survived.”","note":"常见义为“证词、证言”；此处指 DNA 提供的生物学证据，并非人在法庭上的证词。","forms":["testimony"]},{"w":"survive","pos":"adj.","cn":"此处作及物动词，意为“经历……并幸存下来”，不是简单的“活着”。","sec":"text1","sec_label":"Text 1","ctx":"Looking at these DNA sequences, we get a biological testimony to the environment these animals lived in and the experiences they survived.”","note":"此处作及物动词，意为“经历……并幸存下来”，不是简单的“活着”。","forms":["survive"]},{"w":"look at","pos":"phr.","cn":"分析、考察；在科研语境中不只是“看一眼”。","sec":"text1","sec_label":"Text 1","ctx":"Looking at these DNA sequences, we get a biological testimony to the environment these animals lived in and the experiences they survived.”","note":"分析、考察；在科研语境中不只是“看一眼”。","forms":["look at"]},{"w":"the environment ... lived in","pos":"phr.","cn":"它们生活于其中的环境；介词 in 置于关系从句末尾。","sec":"text1","sec_label":"Text 1","ctx":"Looking at these DNA sequences, we get a biological testimony to the environment these animals lived in and the experiences they survived.”","note":"它们生活于其中的环境；介词 in 置于关系从句末尾。","forms":["the environment ... lived in"]},{"w":"examine","pos":"词","cn":"研究、分析；在科研语境中比普通的“检查”更正式。","sec":"text1","sec_label":"Text 1","ctx":"The researchers examined 207 genomes from modern donkeys living in 31 countries across the globe.","note":"研究、分析；在科研语境中比普通的“检查”更正式。","forms":["examine"]},{"w":"across the globe","pos":"phr.","cn":"遍布全球、来自世界各地。","sec":"text1","sec_label":"Text 1","ctx":"The researchers examined 207 genomes from modern donkeys living in 31 countries across the globe.","note":"遍布全球、来自世界各地。","forms":["across the globe"]},{"w":"earlier donkeys","pos":"phr.","cn":"指年代更早的驴或古代驴样本，不是“较早到达的驴”。","sec":"text1","sec_label":"Text 1","ctx":"They also looked at genomes from 15 wild equids and 31 earlier donkeys that lived between about 4,000 and 100 years ago.","note":"指年代更早的驴或古代驴样本，不是“较早到达的驴”。","forms":["earlier donkeys"]},{"w":"wild equid","pos":"phr.","cn":"野生马科动物；equid 是马、驴、斑马等动物所属的科名。","sec":"text1","sec_label":"Text 1","ctx":"They also looked at genomes from 15 wild equids and 31 earlier donkeys that lived between about 4,000 and 100 years ago.","note":"野生马科动物；equid 是马、驴、斑马等动物所属的科名。","forms":["wild equid"]},{"w":"pinpoint","pos":"词","cn":"常见义为“指出准确位置”；此处指通过模型精确确定某一历史事件的时间和起点。","sec":"text1","sec_label":"Text 1","ctx":"The team reconstructed the animals’ evolutionary tree and used computer models to pinpoint the domestication event when herders in Kenya and the Horn of Africa tamed wild","note":"常见义为“指出准确位置”；此处指通过模型精确确定某一历史事件的时间和起点。","forms":["pinpoint"]},{"w":"ass","pos":"词","cn":"此处是“驴、野驴”，不是骂人的粗俗用语。","sec":"text1","sec_label":"Text 1","ctx":"The team reconstructed the animals’ evolutionary tree and used computer models to pinpoint the domestication event when herders in Kenya and the Horn of Africa tamed wild","note":"此处是“驴、野驴”，不是骂人的粗俗用语。","forms":["ass"]},{"w":"evolutionary tree","pos":"phr.","cn":"进化树，用来表示物种或样本之间的演化关系。","sec":"text1","sec_label":"Text 1","ctx":"The team reconstructed the animals’ evolutionary tree and used computer models to pinpoint the domestication event when herders in Kenya and the Horn of Africa tamed wild","note":"进化树，用来表示物种或样本之间的演化关系。","forms":["evolutionary tree"]},{"w":"the Horn of Africa","pos":"phr.","cn":"非洲之角，指非洲东北部的区域。","sec":"text1","sec_label":"Text 1","ctx":"The team reconstructed the animals’ evolutionary tree and used computer models to pinpoint the domestication event when herders in Kenya and the Horn of Africa tamed wild","note":"非洲之角，指非洲东北部的区域。","forms":["the Horn of Africa"]},{"w":"tame wild asses","pos":"phr.","cn":"驯服野驴。","sec":"text1","sec_label":"Text 1","ctx":"The team reconstructed the animals’ evolutionary tree and used computer models to pinpoint the domestication event when herders in Kenya and the Horn of Africa tamed wild","note":"驯服野驴。","forms":["tame wild asses"]},{"w":"trace how ...","pos":"phr.","cn":"追踪、还原……的过程。","sec":"text1","sec_label":"Text 1","ctx":"They then traced how the animals spread across the rest of the continent into Europe and Asia about 2,500 years later.","note":"追踪、还原……的过程。","forms":["trace how ..."]},{"w":"spread across ... into ...","pos":"phr.","cn":"扩散到……各处并进入……。","sec":"text1","sec_label":"Text 1","ctx":"They then traced how the animals spread across the rest of the continent into Europe and Asia about 2,500 years later.","note":"扩散到……各处并进入……。","forms":["spread across ... into ..."]},{"w":"coincide with","pos":"phr.","cn":"与……同时发生、恰好相合；这里说明时间上的吻合，并不直接证明撒哈拉变干是驯化的唯一原因。","sec":"text1","sec_label":"Text 1","ctx":"Though it’s still unclear why the original domestication happened, *Science News*’ Freda Kreier reports that the event coincided with the Sahara growing larger and drier.","note":"与……同时发生、恰好相合；这里说明时间上的吻合，并不直接证明撒哈拉变干是驯化的唯一原因。","forms":["coincide with"]},{"w":"the original domestication","pos":"phr.","cn":"最初的驯化事件。","sec":"text1","sec_label":"Text 1","ctx":"Though it’s still unclear why the original domestication happened, *Science News*’ Freda Kreier reports that the event coincided with the Sahara growing larger and drier.","note":"最初的驯化事件。","forms":["the original domestication"]},{"w":"grow larger and drier","pos":"phr.","cn":"变得更大、更干燥；growing 后接形容词作状态变化的补语。","sec":"text1","sec_label":"Text 1","ctx":"Though it’s still unclear why the original domestication happened, *Science News*’ Freda Kreier reports that the event coincided with the Sahara growing larger and drier.","note":"变得更大、更干燥；growing 后接形容词作状态变化的补语。","forms":["grow larger and drier"]},{"w":"champion","pos":"词","cn":"常见义为“冠军”，此处作名词比喻“佼佼者、能手”。","sec":"text1","sec_label":"Text 1","ctx":"“Donkeys are champions when it comes to carrying stuff and are good at going at deserts,” co-author Ludovic Orlando, an evolutionary biologist at Paul Sabin University in","note":"常见义为“冠军”，此处作名词比喻“佼佼者、能手”。","forms":["champion"]},{"w":"stuff","pos":"词","cn":"非正式用语，指东西、物品；这里突出驴适合承担搬运任务。","sec":"text1","sec_label":"Text 1","ctx":"“Donkeys are champions when it comes to carrying stuff and are good at going at deserts,” co-author Ludovic Orlando, an evolutionary biologist at Paul Sabin University in","note":"非正式用语，指东西、物品；这里突出驴适合承担搬运任务。","forms":["stuff"]},{"w":"go at deserts","pos":"phr.","cn":"原文中的非正式表达，结合上下文指在沙漠环境中行进、活动。","sec":"text1","sec_label":"Text 1","ctx":"“Donkeys are champions when it comes to carrying stuff and are good at going at deserts,” co-author Ludovic Orlando, an evolutionary biologist at Paul Sabin University in","note":"原文中的非正式表达，结合上下文指在沙漠环境中行进、活动。","forms":["go at deserts"]},{"w":"when it comes to","pos":"phr.","cn":"说到、涉及……时。","sec":"text1","sec_label":"Text 1","ctx":"“Donkeys are champions when it comes to carrying stuff and are good at going at deserts,” co-author Ludovic Orlando, an evolutionary biologist at Paul Sabin University in","note":"说到、涉及……时。","forms":["when it comes to"]},{"w":"be good at doing","pos":"phr.","cn":"擅长或适合做某事。","sec":"text1","sec_label":"Text 1","ctx":"“Donkeys are champions when it comes to carrying stuff and are good at going at deserts,” co-author Ludovic Orlando, an evolutionary biologist at Paul Sabin University in","note":"擅长或适合做某事。","forms":["be good at doing"]},{"w":"tell the publication","pos":"phr.","cn":"向该刊物表示、对该刊物说。","sec":"text1","sec_label":"Text 1","ctx":"“Donkeys are champions when it comes to carrying stuff and are good at going at deserts,” co-author Ludovic Orlando, an evolutionary biologist at Paul Sabin University in","note":"向该刊物表示、对该刊物说。","forms":["tell the publication"]},{"w":"navigate","pos":"v.","cn":"常见义为“导航”；此处指在复杂或陌生的地域中行进、穿越，并非一定使用导航设备。","sec":"text1","sec_label":"Text 1","ctx":"Prehistoric humans may have tamed donkeys to help navigate the expanding Sahara.","note":"常见义为“导航”；此处指在复杂或陌生的地域中行进、穿越，并非一定使用导航设备。","forms":["navigate"]},{"w":"may have done","pos":"phr.","cn":"可能已经做过某事，表示对过去情况的推测。","sec":"text1","sec_label":"Text 1","ctx":"Prehistoric humans may have tamed donkeys to help navigate the expanding Sahara.","note":"可能已经做过某事，表示对过去情况的推测。","forms":["may have done"]},{"w":"the expanding Sahara","pos":"phr.","cn":"不断扩大的撒哈拉沙漠；现在分词强调变化过程。","sec":"text1","sec_label":"Text 1","ctx":"Prehistoric humans may have tamed donkeys to help navigate the expanding Sahara.","note":"不断扩大的撒哈拉沙漠；现在分词强调变化过程。","forms":["the expanding Sahara"]},{"w":"put ... in the spotlight","pos":"phr.","cn":"使……成为关注焦点。","sec":"text1","sec_label":"Text 1","ctx":"Researchers say these findings could help put donkeys in the spotlight.","note":"使……成为关注焦点。","forms":["put ... in the spotlight"]},{"w":"benefit from","pos":"phr.","cn":"从……中获益；这里的受益主体是驴，而不是研究人员。","sec":"text1","sec_label":"Text 1","ctx":"The animals could benefit from more research:","note":"从……中获益；这里的受益主体是驴，而不是研究人员。","forms":["benefit from"]},{"w":"located south of the Equator","pos":"phr.","cn":"位于赤道以南；过去分词短语修饰 donkeys。","sec":"text1","sec_label":"Text 1","ctx":"Currently, there are no published genomes from donkeys located south of the Equator in Africa.","note":"位于赤道以南；过去分词短语修饰 donkeys。","forms":["located south of the Equator"]},{"w":"published genome","pos":"phr.","cn":"已发表的基因组数据或研究结果。","sec":"text1","sec_label":"Text 1","ctx":"Currently, there are no published genomes from donkeys located south of the Equator in Africa.","note":"已发表的基因组数据或研究结果。","forms":["published genome"]},{"w":"insight","pos":"词","cn":"此处指有助于理解过去情况的线索或认识，不是“洞察力”这一抽象能力本身。","sec":"text1","sec_label":"Text 1","ctx":"But understanding where the animals were first domesticated could guide archaeologists to a narrow region to search for insights about the original tamed donkeys.","note":"此处指有助于理解过去情况的线索或认识，不是“洞察力”这一抽象能力本身。","forms":["insight"]},{"w":"makeup","pos":"词","cn":"常见义为“化妆品、化妆”，此处指构成、组成，genetic makeup 即遗传构成。","sec":"te  representing about 3,000 film workers, has suspended a training program and issued a st","note":"暂停培训项目。","forms":["suspend a training program"]},{"w":"issue a statement","pos":"phr.","cn":"发表声明。","sec":"text2","sec_label":"Text 2","ctx":"If that sounds melodramatic, consider this: The Art Directors Guild, a labor union representing about 3,000 film workers, has suspended a training program and issued a st","note":"发表声明。","forms":["issue a statement"]},{"w":"reaction","pos":"n.","cn":"此处指针对某种局势采取的回应行动，不是生理上的“反应”。","sec":"text2","sec_label":"Text 2","ctx":"This is a reaction to Hollywood’s decline, which is reaching a critical point for the industry and Southern California.","note":"此处指针对某种局势采取的回应行动，不是生理上的“反应”。","forms":["reaction"]},{"w":"critical point","pos":"phr.","cn":"危急关头、关键节点；这里强调形势严重，而不是“批评的观点”。","sec":"text2","sec_label":"Text 2","ctx":"This is a reaction to Hollywood’s decline, which is reaching a critical point for the industry and Southern California.","note":"危急关头、关键节点；这里强调形势严重，而不是“批评的观点”。","forms":["critical point"]},{"w":"a reaction to","pos":"phr.","cn":"对……的反应或回应。","sec":"text2","sec_label":"Text 2","ctx":"This is a reaction to Hollywood’s decline, which is reaching a critical point for the industry and Southern California.","note":"对……的反应或回应。","forms":["a reaction to"]},{"w":"reach a critical point","pos":"phr.","cn":"达到危急或关键阶段。","sec":"text2","sec_label":"Text 2","ctx":"This is a reaction to Hollywood’s decline, which is reaching a critical point for the industry and Southern California.","note":"达到危急或关键阶段。","forms":["reach a critical point"]},{"w":"slip away from","pos":"phr.","cn":"逐渐离开、慢慢流失；不是突然“滑走”。","sec":"text2","sec_label":"Text 2","ctx":"Production has been slipping away from Hollywood since the 1950s, but the effects have never been more apparent than at present.","note":"逐渐离开、慢慢流失；不是突然“滑走”。","forms":["slip away from"]},{"w":"apparent","pos":"词","cn":"明显的、显而易见的；此处不是“表面上的”。","sec":"text2","sec_label":"Text 2","ctx":"Production has been slipping away from Hollywood since the 1950s, but the effects have never been more apparent than at present.","note":"明显的、显而易见的；此处不是“表面上的”。","forms":["apparent"]},{"w":"at present","pos":"phr.","cn":"目前、现在。","sec":"text2","sec_label":"Text 2","ctx":"Production has been slipping away from Hollywood since the 1950s, but the effects have never been more apparent than at present.","note":"目前、现在。","forms":["at present"]},{"w":"have never been more ... than ...","pos":"phr.","cn":"从未像……时这样……，是强调最高程度的比较结构。","sec":"text2","sec_label":"Text 2","ctx":"Production has been slipping away from Hollywood since the 1950s, but the effects have never been more apparent than at present.","note":"从未像……时这样……，是强调最高程度的比较结构。","forms":["have never been more ... than ..."]},{"w":"leave somebody in the dust","pos":"phr.","cn":"把某人远远甩在后面；这里是比喻其他地区在争夺影视制作方面超过了加州。","sec":"text2","sec_label":"Text 2","ctx":"Other regions in the United States, Canada and Europe have steadily increased incentives to attract TV shows and movies, leaving California in the dust.","note":"把某人远远甩在后面；这里是比喻其他地区在争夺影视制作方面超过了加州。","forms":["leave somebody in the dust"]},{"w":"steadily increase","pos":"phr.","cn":"持续、稳步增加。","sec":"text2","sec_label":"Text 2","ctx":"Other regions in the United States, Canada and Europe have steadily increased incentives to attract TV shows and movies, leaving California in the dust.","note":"持续、稳步增加。","forms":["steadily increase"]},{"w":"incentive","pos":"adj.","cn":"激励措施、优惠政策，常指税收或补贴等吸引投资的手段。","sec":"text2","sec_label":"Text 2","ctx":"Other regions in the United States, Canada and Europe have steadily increased incentives to attract TV shows and movies, leaving California in the dust.","note":"激励措施、优惠政策，常指税收或补贴等吸引投资的手段。","forms":["incentive"]},{"w":"attract TV shows and movies","pos":"phr.","cn":"吸引电视节目和电影项目来本地制作。","sec":"text2","sec_label":"Text 2","ctx":"Other regions in the United States, Canada and Europe have steadily increased incentives to attract TV shows and movies, leaving California in the dust.","note":"吸引电视节目和电影项目来本地制作。","forms":["attract TV shows and movies"]},{"w":"credit","pos":"词","cn":"此处是税收抵免额，不是“信用”或“学分”。","sec":"text2","sec_label":"Text 2","ctx":"Georgia offers up to 30% in transferable tax credits on film and TV production costs, plus an additional 10% increase on the base tax credit if the project includes a Geo","note":"此处是税收抵免额，不是“信用”或“学分”。","forms":["credit"]},{"w":"base tax credit","pos":"phr.","cn":"基础税收抵免额，即未计算额外优惠前的基准额度。","sec":"text2","sec_label":"Text 2","ctx":"Georgia offers up to 30% in transferable tax credits on film and TV production costs, plus an additional 10% increase on the base tax credit if the project includes a Geo","note":"基础税收抵免额，即未计算额外优惠前的基准额度。","forms":["base tax credit"]},{"w":"up to","pos":"phr.","cn":"最高达，表示上限而非固定比例。","sec":"text2","sec_label":"Text 2","ctx":"Georgia offers up to 30% in transferable tax credits on film and TV production costs, plus an additional 10% increase on the base tax credit if the project includes a Geo","note":"最高达，表示上限而非固定比例。","forms":["up to"]},{"w":"transferable tax credit","pos":"phr.","cn":"可转让的税收抵免。","sec":"text2","sec_label":"Text 2","ctx":"Georgia offers up to 30% in transferable tax credits on film and TV production costs, plus an additional 10% increase on the base tax credit if the project includes a Geo","note":"可转让的税收抵免。","forms":["transferable tax credit"]},{"w":"volume","pos":"词","cn":"此处指数量或规模，不是“音量”。","sec":"text2","sec_label":"Text 2","ctx":"Even as California lost a huge volume of production to other locations, there was still plenty of film production taking place in Los Angeles before this year.","note":"此处指数量或规模，不是“音量”。","forms":["volume"]},{"w":"take place","pos":"phr.","cn":"发生、进行；production taking place 指制作活动正在开展。","sec":"text2","sec_label":"Text 2","ctx":"Even as California lost a huge volume of production to other locations, there was still plenty of film production taking place in Los Angeles before this year.","note":"发生、进行；production taking place 指制作活动正在开展。","forms":["take place"]},{"w":"keep afloat","pos":"phr.","cn":"使……维持运转、避免陷入困境；本义是让东西漂浮在水面上。","sec":"text2","sec_label":"Text 2","ctx":"We were kept afloat by “peak TV” the glut of content that was required by the explosion of streaming services.","note":"使……维持运转、避免陷入困境；本义是让东西漂浮在水面上。","forms":["keep afloat"]},{"w":"glut","pos":"词","cn":"过量、过剩，此处指流媒体平台为争夺用户而制造的大量内容。","sec":"text2","sec_label":"Text 2","ctx":"We were kept afloat by “peak TV” the glut of content that was required by the explosion of streaming services.","note":"过量、过剩，此处指流媒体平台为争夺用户而制造的大量内容。","forms":["glut"]},{"w":"peak TV","pos":"phr.","cn":"电视内容产量异常高的时期，文中指流媒体推动的剧集制作热潮。","sec":"text2","sec_label":"Text 2","ctx":"We were kept afloat by “peak TV” the glut of content that was required by the explosion of streaming services.","note":"电视内容产量异常高的时期，文中指流媒体推动的剧集制作热潮。","forms":["peak TV"]},{"w":"the explosion of","pos":"phr.","cn":"……的爆发式增长。","sec":"text2","sec_label":"Text 2","ctx":"We were kept afloat by “peak TV” the glut of content that was required by the explosion of streaming services.","note":"……的爆发式增长。","forms":["the explosion of"]},{"w":"the peak of ...","pos":"phr.","cn":"……的最高峰。","sec":"text2","sec_label":"Text 2","ctx":"But 2022 was the peak of peak TV.","note":"……的最高峰。","forms":["the peak of ..."]},{"w":"hemorrhage","pos":"n.","cn":"本义为“大出血”，此处作夸张用法，指资金大量流出、烧掉巨额资金。","sec":"text2","sec_label":"Text 2","ctx":"Back then platforms such as Netflix, Amazon and Apple TV hemorrhaged billions of dollars to generate content to attract new subscribers, resulting in 633 scripted series ","note":"本义为“大出血”，此处作夸张用法，指资金大量流出、烧掉巨额资金。","forms":["hemorrhage"]},{"w":"scripted series","pos":"phr.","cn":"有预先编写剧本的系列剧，通常指剧情类剧集，不是“被操纵的系列”。","sec":"text2","sec_label":"Text 2","ctx":"Back then platforms such as Netflix, Amazon and Apple TV hemorrhaged billions of dollars to generate content to attract new subscribers, resulting in 633 scripted series ","note":"有预先编写剧本的系列剧，通常指剧情类剧集，不是“被操纵的系列”。","forms":["scripted series"]},{"w":"generate content","pos":"phr.","cn":"制作、生产内容。","sec":"text2","sec_label":"Text 2","ctx":"Back then platforms such as Netflix, Amazon and Apple TV hemorrhaged billions of dollars to generate content to attract new subscribers, resulting in 633 scripted series ","note":"制作、生产内容。","forms":["generate content"]},{"w":"subscriber","pos":"词","cn":"订阅者、付费用户。","sec":"text2","sec_label":"Text 2","ctx":"Back then platforms such as Netflix, Amazon and Apple TV hemorrhaged billions of dollars to generate content to attract new subscribers, resulting in 633 scripted series ","note":"订阅者、付费用户。","forms":["subscriber"]},{"w":"result in","pos":"phr.","cn":"导致、结果是。","sec":"text2","sec_label":"Text 2","ctx":"Back then platforms such as Netflix, Amazon and Apple TV hemorrhaged billions of dollars to generate content to attract new subscribers, resulting in 633 scripted series ","note":"导致、结果是。","forms":["result in"]},{"w":"profitability","pos":"n.","cn":"盈利能力、获利状况，不只是一次性的“利润”。","sec":"text2","sec_label":"Text 2","ctx":"As the streamers’ emphasis changed from subscriber growth to profitability, prices for the services went up and the number of new shows went down to 481 released in 2023,","note":"盈利能力、获利状况，不只是一次性的“利润”。","forms":["profitability"]},{"w":"dip into the 300s","pos":"phr.","cn":"下降到 300 多的区间；dip 表示下探、下降，不是“蘸入”。","sec":"text2","sec_label":"Text 2","ctx":"As the streamers’ emphasis changed from subscriber growth to profitability, prices for the services went up and the number of new shows went down to 481 released in 2023,","note":"下降到 300 多的区间；dip 表示下探、下降，不是“蘸入”。","forms":["dip into the 300s"]},{"w":"change from A to B","pos":"phr.","cn":"从 A 转向 B。","sec":"text2","sec_label":"Text 2","ctx":"As the streamers’ emphasis changed from subscriber growth to profitability, prices for the services went up and the number of new shows went down to 481 released in 2023,","note":"从 A 转向 B。","forms":["change from A to B"]},{"w":"subscriber growth","pos":"phr.","cn":"订阅用户增长。","sec":"text2","sec_label":"Text 2","ctx":"As the streamers’ emphasis changed from subscriber growth to profitability, prices for the services went up and the number of new shows went down to 481 released in 2023,","note":"订阅用户增长。","forms":["subscriber growth"]},{"w":"with ... expected to ...","pos":"phr.","cn":"独立主格结构，表示附带的预期情况。","sec":"text2","sec_label":"Text 2","ctx":"As the streamers’ emphasis changed from subscriber growth to profitability, prices for the services went up and the number of new shows went down to 481 released in 2023,","note":"独立主格结构，表示附带的预期情况。","forms":["with ... expected to ..."]},{"w":"drift away","pos":"phr.","cn":"逐渐流失、离开；强调人才并非一夜之间消失，而是随着机会减少慢慢转移。","sec":"text2","sec_label":"Text 2","ctx":"If productions in Southern California dip below a critical level for too long, the industry’s essential talent will drift away along with enormous sums of revenue.","note":"逐渐流失、离开；强调人才并非一夜之间消失，而是随着机会减少慢慢转移。","forms":["drift away"]},{"w":"essential talent","pos":"phr.","cn":"关键人才、不可或缺的专业人才，不是“有天赋的人才”这一泛泛概念。","sec":"text2","sec_label":"Text 2","ctx":"If productions in Southern California dip below a critical level for too long, the industry’s essential talent will drift away along with enormous sums of revenue.","note":"关键人才、不可或缺的专业人才，不是“有天赋的人才”这一泛泛概念。","forms":["essential talent"]},{"w":"dip below","pos":"phr.","cn":"下降到……以下。","sec":"text2","sec_label":"Text 2","ctx":"If productions in Southern California dip below a critical level for too long, the industry’s essential talent will drift away along with enormous sums of revenue.","note":"下降到……以下。","forms":["dip below"]},{"w":"for too long","pos":"phr.","cn":"持续太久。","sec":"text2","sec_label":"Text 2","ctx":"If productions in Southern California dip below a critical level for too long, the industry’s essential talent will drift away along with enormous sums of revenue.","note":"持续太久。","forms":["for too long"]},{"w":"along with","pos":"phr.","cn":"连同……一起、随着……一同。","sec":"text2","sec_label":"Text 2","ctx":"If productions in Southern California dip below a critical level for too long, the industry’s essential talent will drift away along with enormous sums of revenue.","note":"连同……一起、随着……一同。","forms":["along with"]},{"w":"a deep bench","pos":"phr.","cn":"本义指板凳阵容，体育语境中指替补力量充足；此处比喻某领域拥有数量充足、经验丰富的人才和配套力量。","sec":"text2","sec_label":"Text 2","ctx":"Persuading studios to film here would become much more challenging if we couldn’t offer a deep bench of local film workers, on-screen talent and local businesses that sup","note":"本义指板凳阵容，体育语境中指替补力量充足；此处比喻某领域拥有数量充足、经验丰富的人才和配套力量。","forms":["a deep bench"]},{"w":"on-screen talent","pos":"phr.","cn":"出现在镜头前的演员或主持等人才，不是幕后技术人员。","sec":"text2","sec_label":"Text 2","ctx":"Persuading studios to film here would become much more challenging if we couldn’t offer a deep bench of local film workers, on-screen talent and local businesses that sup","note":"出现在镜头前的演员或主持等人才，不是幕后技术人员。","forms":["on-screen talent"]},{"w":"persuade somebody to do","pos":"phr.","cn":"说服某人做某事。","sec":"text2","sec_label":"Text 2","ctx":"Persuading studios to film here would become much more challenging if we couldn’t offer a deep bench of local film workers, on-screen talent and local businesses that sup","note":"说服某人做某事。","forms":["persuade somebody to do"]},{"w":"film here","pos":"phr.","cn":"在这里拍摄。","sec":"text2","sec_label":"Text 2","ctx":"Persuading studios to film here would become much more challenging if we couldn’t offer a deep bench of local film workers, on-screen talent and local businesses that sup","note":"在这里拍摄。","forms":["film here"]},{"w":"support the entertainment industry","pos":"phr.","cn":"为娱乐业提供支持。","sec":"text2","sec_label":"Text 2","ctx":"Persuading studios to film here would become much more challenging if we couldn’t offer a deep bench of local film workers, on-screen talent and local businesses that sup","note":"为娱乐业提供支持。","forms":["support the entertainment industry"]},{"w":"counterpart","pos":"词","cn":"对应机构、相应的 counterpart；不是“相反的一方”。","sec":"text2","sec_label":"Text 2","ctx":"That’s why the California Film Commission and its Los Angeles counterpart, Film LA, now should act, before it’s too late.","note":"对应机构、相应的 counterpart；不是“相反的一方”。","forms":["counterpart"]},{"w":"act","pos":"词","cn":"此处指采取行动，而不是出演或扮演。","sec":"text2","sec_label":"Text 2","ctx":"That’s why the California Film Commission and its Los Angeles counterpart, Film LA, now should act, before it’s too late.","note":"此处指采取行动，而不是出演或扮演。","forms":["act"]},{"w":"That’s why","pos":"phr.","cn":"这就是……的原因，因此。","sec":"text2","sec_label":"Text 2","ctx":"That’s why the California Film Commission and its Los Angeles counterpart, Film LA, now should act, before it’s too late.","note":"这就是……的原因，因此。","forms":["That’s why"]},{"w":"before it’s too late","pos":"phr.","cn":"趁还来得及、在为时已晚之前。","sec":"text2","sec_label":"Text 2","ctx":"That’s why the California Film Commission and its Los Angeles counterpart, Film LA, now should act, before it’s too late.","note":"趁还来得及、在为时已晚之前。","forms":["before it’s too late"]},{"w":"government body","pos":"phr.","cn":"政府机构或政府部门。","sec":"text2","sec_label":"Text 2","ctx":"These agencies and other government bodies should dramatically improve incentives to keep our current shows and attract new productions to Los Angeles.","note":"政府机构或政府部门。","forms":["government body"]},{"w":"keep current shows","pos":"phr.","cn":"留住正在本地制作的影视项目。","sec":"text2","sec_label":"Text 2","ctx":"These agencies and other government bodies should dramatically improve incentives to keep our current shows and attract new productions to Los Angeles.","note":"留住正在本地制作的影视项目。","forms":["keep current shows"]},{"w":"attract new productions","pos":"phr.","cn":"吸引新的影视制作项目。","sec":"text2","sec_label":"Text 2","ctx":"These agencies and other government bodies should dramatically improve incentives to keep our current shows and attract new productions to Los Angeles.","note":"吸引新的影视制作项目。","forms":["attract new productions"]},{"w":"go on with","pos":"phr.","cn":"继续进行；这里既指继续影视制作，也呼应 show business 的修辞。","sec":"text2","sec_label":"Text 2","ctx":"Let’s go on with the show...and make sure the show doesn’t go on without us.","note":"继续进行；这里既指继续影视制作，也呼应 show business 的修辞。","forms":["go on with"]},{"w":"wireless","pos":"adj.","cn":"本文中指早期的无线电广播或收音机技术，不是泛指所有“无线”技术。","sec":"text3","sec_label":"Text 3","ctx":"The pioneers of wireless saw it as a gift to all the people.","note":"本文中指早期的无线电广播或收音机技术，不是泛指所有“无线”技术。","forms":["wireless"]},{"w":"pioneer","pos":"词","cn":"先驱者、开创者。","sec":"text3","sec_label":"Text 3","ctx":"The pioneers of wireless saw it as a gift to all the people.","note":"先驱者、开创者。","forms":["pioneer"]},{"w":"a gift to all the people","pos":"phr.","cn":"给所有人的礼物，强调技术的公共性和普惠性。","sec":"text3","sec_label":"Text 3","ctx":"The pioneers of wireless saw it as a gift to all the people.","note":"给所有人的礼物，强调技术的公共性和普惠性。","forms":["a gift to all the people"]},{"w":"isolation of the spirit","pos":"phr.","cn":"精神上的隔绝或孤独，不是物理意义上的隔离。","sec":"text3","sec_label":"Text 3","ctx":"Sir John Reith said that it would end “isolation of the spirit” and rejoiced: “It does not matter how many thousands may be listening, there is always enough for others..","note":"精神上的隔绝或孤独，不是物理意义上的隔离。","forms":["isolation of the spirit"]},{"w":"rejoice","pos":"词","cn":"欣喜、欢庆；比普通的 be happy 语气更强。","sec":"text3","sec_label":"Text 3","ctx":"Sir John Reith said that it would end “isolation of the spirit” and rejoiced: “It does not matter how many thousands may be listening, there is always enough for others..","note":"欣喜、欢庆；比普通的 be happy 语气更强。","forms":["rejoice"]},{"w":"the genius and the fool","pos":"phr.","cn":"用两类极端人物代表所有不同社会群体，突出无线电的普及范围。","sec":"text3","sec_label":"Text 3","ctx":"Sir John Reith said that it would end “isolation of the spirit” and rejoiced: “It does not matter how many thousands may be listening, there is always enough for others..","note":"用两类极端人物代表所有不同社会群体，突出无线电的普及范围。","forms":["the genius and the fool"]},{"w":"it does not matter how ...","pos":"phr.","cn":"无论……都无关紧要，后面强调真正重要的结果。","sec":"text3","sec_label":"Text 3","ctx":"Sir John Reith said that it would end “isolation of the spirit” and rejoiced: “It does not matter how many thousands may be listening, there is always enough for others..","note":"无论……都无关紧要，后面强调真正重要的结果。","forms":["it does not matter how ..."]},{"w":"listen simultaneously","pos":"phr.","cn":"同时收听。","sec":"text3","sec_label":"Text 3","ctx":"Sir John Reith said that it would end “isolation of the spirit” and rejoiced: “It does not matter how many thousands may be listening, there is always enough for others..","note":"同时收听。","forms":["listen simultaneously"]},{"w":"consciousness","pos":"n.","cn":"此处指共同意识、认同感，不是“清醒状态”。","sec":"text3","sec_label":"Text 3","ctx":"Between two great wars this technological innovation built a new kind of national consciousness.","note":"此处指共同意识、认同感，不是“清醒状态”。","forms":["consciousness"]},{"w":"between two great wars","pos":"phr.","cn":"在两次世界大战之间，特指两次世界大战之间的时期。","sec":"text3","sec_label":"Text 3","ctx":"Between two great wars this technological innovation built a new kind of national consciousness.","note":"在两次世界大战之间，特指两次世界大战之间的时期。","forms":["between two great wars"]},{"w":"national consciousness","pos":"phr.","cn":"民族或国家共同意识。","sec":"text3","sec_label":"Text 3","ctx":"Between two great wars this technological innovation built a new kind of national consciousness.","note":"民族或国家共同意识。","forms":["national consciousness"]},{"w":"opening","pos":"v./n.","cn":"此处作现在分词，意为“开幕、开始展出”，不是“打开”。","sec":"text3","sec_label":"Text 3","ctx":"Opening this week, a book and exhibition curated by Beatty Rubens at the Bodleian in Oxford records how radio changed everyday life from 1922 to 1939.","note":"此处作现在分词，意为“开幕、开始展出”，不是“打开”。","forms":["opening"]},{"w":"curate","pos":"v.","cn":"策划、编选展览或资料，不只是“照料”。","sec":"text3","sec_label":"Text 3","ctx":"Opening this week, a book and exhibition curated by Beatty Rubens at the Bodleian in Oxford records how radio changed everyday life from 1922 to 1939.","note":"策划、编选展览或资料，不只是“照料”。","forms":["curate"]},{"w":"everyday life","pos":"phr.","cn":"日常生活。","sec":"text3","sec_label":"Text 3","ctx":"Opening this week, a book and exhibition curated by Beatty Rubens at the Bodleian in Oxford records how radio changed everyday life from 1922 to 1939.","note":"日常生活。","forms":["everyday life"]},{"w":"from 1922 to 1939","pos":"phr.","cn":"从 1922 年到 1939 年这一历史时期。","sec":"text3","sec_label":"Text 3","ctx":"Opening this week, a book and exhibition curated by Beatty Rubens at the Bodleian in Oxford records how radio changed everyday life from 1922 to 1939.","note":"从 1922 年到 1939 年这一历史时期。","forms":["from 1922 to 1939"]},{"w":"draw on","pos":"phr.","cn":"利用、参考；不是“画在……上”。","sec":"text3","sec_label":"Text 3","ctx":"She draws on letters, diaries and fiction, and a 1939 field notebook of verbatim audience research by Winifred Gill.","note":"利用、参考；不是“画在……上”。","forms":["draw on"]},{"w":"verbatim","pos":"词","cn":"逐字的、原话记录的，强调没有改写或概括。","sec":"text3","sec_label":"Text 3","ctx":"She draws on letters, diaries and fiction, and a 1939 field notebook of verbatim audience research by Winifred Gill.","note":"逐字的、原话记录的，强调没有改写或概括。","forms":["verbatim"]},{"w":"field notebook","pos":"phr.","cn":"田野笔记、实地记录本。","sec":"text3","sec_label":"Text 3","ctx":"She draws on letters, diaries and fiction, and a 1939 field notebook of verbatim audience research by Winifred Gill.","note":"田野笔记、实地记录本。","forms":["field notebook"]},{"w":"audience research","pos":"phr.","cn":"观众调查、受众研究。","sec":"text3","sec_label":"Text 3","ctx":"She draws on letters, diaries and fiction, and a 1939 field notebook of verbatim audience research by Winifred Gill.","note":"观众调查、受众研究。","forms":["audience research"]},{"w":"sheer","pos":"词","cn":"此处意为“纯粹的、完全的”，用来加强 newness，不是“陡峭的”。","sec":"text3","sec_label":"Text 3","ctx":"There’s fun in testimonies of people enjoying the sheer newness.","note":"此处意为“纯粹的、完全的”，用来加强 newness，不是“陡峭的”。","forms":["sheer"]},{"w":"enjoy the newness","pos":"phr.","cn":"享受新鲜感。","sec":"text3","sec_label":"Text 3","ctx":"There’s fun in testimonies of people enjoying the sheer newness.","note":"享受新鲜感。","forms":["enjoy the newness"]},{"w":"testimonies of people","pos":"phr.","cn":"人们的亲身讲述或见证。","sec":"text3","sec_label":"Text 3","ctx":"There’s fun in testimonies of people enjoying the sheer newness.","note":"人们的亲身讲述或见证。","forms":["testimonies of people"]},{"w":"mock","pos":"词","cn":"嘲弄、讽刺；不只是中性的“模仿”。","sec":"text3","sec_label":"Text 3","ctx":"A cartoon mocks a group failing to converse because they’re all in headphones.","note":"嘲弄、讽刺；不只是中性的“模仿”。","forms":["mock"]},{"w":"converse","pos":"词","cn":"交谈、对话；此处作动词，不是“相反的”。","sec":"text3","sec_label":"Text 3","ctx":"A cartoon mocks a group failing to converse because they’re all in headphones.","note":"交谈、对话；此处作动词，不是“相反的”。","forms":["converse"]},{"w":"report that ...","pos":"phr.","cn":"报告、讲述……情况。","sec":"text3","sec_label":"Text 3","ctx":"People report that broadcast music made workmen whistle new tunes.","note":"报告、讲述……情况。","forms":["report that ..."]},{"w":"make somebody do","pos":"phr.","cn":"使某人做某事；made 后接不带 to 的不定式 whistle。","sec":"text3","sec_label":"Text 3","ctx":"People report that broadcast music made workmen whistle new tunes.","note":"使某人做某事；made 后接不带 to 的不定式 whistle。","forms":["make somebody do"]},{"w":"whistle a tune","pos":"phr.","cn":"吹口哨或哼唱一支曲调。","sec":"text3","sec_label":"Text 3","ctx":"People report that broadcast music made workmen whistle new tunes.","note":"吹口哨或哼唱一支曲调。","forms":["whistle a tune"]},{"w":"the arrival of","pos":"phr.","cn":"……的到来或出现。","sec":"text3","sec_label":"Text 3","ctx":"A woman says there have been fewer street fights since the arrival of the wireless but also less stopping and “talking on the brush handle”.","note":"……的到来或出现。","forms":["the arrival of"]},{"w":"talking on the brush handle","pos":"phr.","cn":"字面是“靠着扫帚柄聊天”，实际指邻里间停下来进行随意闲聊；后文再次用这个表达对比智能手机时代的人际交往。","sec":"text3","sec_label":"Text 3","ctx":"A woman says there have been fewer street fights since the arrival of the wireless but also less stopping and “talking on the brush handle”.","note":"字面是“靠着扫帚柄聊天”，实际指邻里间停下来进行随意闲聊；后文再次用这个表达对比智能手机时代的人际交往。","forms":["talking on the brush handle"]},{"w":"by and large","pos":"phr.","cn":"总的来说、大体上。","sec":"text3","sec_label":"Text 3","ctx":"By and large the wireless was welcome.","note":"总的来说、大体上。","forms":["by and large"]},{"w":"be welcome","pos":"phr.","cn":"受到欢迎；这里是评价无线电整体社会反响。","sec":"text3","sec_label":"Text 3","ctx":"By and large the wireless was welcome.","note":"受到欢迎；这里是评价无线电整体社会反响。","forms":["be welcome"]},{"w":"variety","pos":"词","cn":"此处指内容的多样性和选择范围，不是“品种”这一具体分类。","sec":"text3","sec_label":"Text 3","ctx":"I loved the man from the Thirties research who found that wireless suddenly offered “a lot of variety...things I thought I’d never be interested in...ice hockey perhaps”.","note":"此处指内容的多样性和选择范围，不是“品种”这一具体分类。","forms":["variety"]},{"w":"interest","pos":"词","cn":"此处作动词，意为“使……感兴趣”。","sec":"text3","sec_label":"Text 3","ctx":"I loved the man from the Thirties research who found that wireless suddenly offered “a lot of variety...things I thought I’d never be interested in...ice hockey perhaps”.","note":"此处作动词，意为“使……感兴趣”。","forms":["interest"]},{"w":"the Thirties","pos":"phr.","cn":"20 世纪 30 年代。","sec":"text3","sec_label":"Text 3","ctx":"I loved the man from the Thirties research who found that wireless suddenly offered “a lot of variety...things I thought I’d never be interested in...ice hockey perhaps”.","note":"20 世纪 30 年代。","forms":["the Thirties"]},{"w":"a lot of variety","pos":"phr.","cn":"丰富多样的内容。","sec":"text3","sec_label":"Text 3","ctx":"I loved the man from the Thirties research who found that wireless suddenly offered “a lot of variety...things I thought I’d never be interested in...ice hockey perhaps”.","note":"丰富多样的内容。","forms":["a lot of variety"]},{"w":"be interested in","pos":"phr.","cn":"对……感兴趣。","sec":"text3","sec_label":"Text 3","ctx":"I loved the man from the Thirties research who found that wireless suddenly offered “a lot of variety...things I thought I’d never be interested in...ice hockey perhaps”.","note":"对……感兴趣。","forms":["be interested in"]},{"w":"serendipity","pos":"n.","cn":"意外发现有价值或有趣事物的幸运；此处指听众没有主动寻找，却偶然听到有用或有趣的内容。","sec":"text3","sec_label":"Text 3","ctx":"True: for more than 80 pre-digital years, linear speech broadcasting brought the gift of serendipity, random enlivening of a car journey or dull manual task.","note":"意外发现有价值或有趣事物的幸运；此处指听众没有主动寻找，却偶然听到有用或有趣的内容。","forms":["serendipity"]},{"w":"enliven","pos":"词","cn":"使变得有趣、使增添活力；不是简单的“点亮”。","sec":"text3","sec_label":"Text 3","ctx":"True: for more than 80 pre-digital years, linear speech broadcasting brought the gift of serendipity, random enlivening of a car journey or dull manual task.","note":"使变得有趣、使增添活力；不是简单的“点亮”。","forms":["enliven"]},{"w":"linear broadcasting","pos":"phr.","cn":"按固定编排顺序连续播出的广播。","sec":"text3","sec_label":"Text 3","ctx":"True: for more than 80 pre-digital years, linear speech broadcasting brought the gift of serendipity, random enlivening of a car journey or dull manual task.","note":"按固定编排顺序连续播出的广播。","forms":["linear broadcasting"]},{"w":"a dull manual task","pos":"phr.","cn":"枯燥的体力劳动。","sec":"text3","sec_label":"Text 3","ctx":"True: for more than 80 pre-digital years, linear speech broadcasting brought the gift of serendipity, random enlivening of a car journey or dull manual task.","note":"枯燥的体力劳动。","forms":["a dull manual task"]},{"w":"random enlivening of","pos":"phr.","cn":"偶然使……变得有趣或生动。","sec":"text3","sec_label":"Text 3","ctx":"True: for more than 80 pre-digital years, linear speech broadcasting brought the gift of serendipity, random enlivening of a car journey or dull manual task.","note":"偶然使……变得有趣或生动。","forms":["random enlivening of"]},{"w":"catch up with the news","pos":"phr.","cn":"了解最新新闻，而不是“追上新闻”。","sec":"text3","sec_label":"Text 3","ctx":"In my own book about radio I recorded how, on one drive: “I caught up with the news, learnt some 17th-century history, and was startlingly educated by an unpretentious pr","note":"了解最新新闻，而不是“追上新闻”。","forms":["catch up with the news"]},{"w":"startlingly","pos":"adv.","cn":"出人意料地、令人吃惊地。","sec":"text3","sec_label":"Text 3","ctx":"In my own book about radio I recorded how, on one drive: “I caught up with the news, learnt some 17th-century history, and was startlingly educated by an unpretentious pr","note":"出人意料地、令人吃惊地。","forms":["startlingly"]},{"w":"unpretentious","pos":"adj.","cn":"朴实的、不矫饰的；此处形容节目内容平实却很有教育意义。","sec":"text3","sec_label":"Text 3","ctx":"In my own book about radio I recorded how, on one drive: “I caught up with the news, learnt some 17th-century history, and was startlingly educated by an unpretentious pr","note":"朴实的、不矫饰的；此处形容节目内容平实却很有教育意义。","forms":["unpretentious"]},{"w":"17th-century history","pos":"phr.","cn":"17 世纪历史；复合形容词中的连字符不能省略。","sec":"text3","sec_label":"Text 3","ctx":"In my own book about radio I recorded how, on one drive: “I caught up with the news, learnt some 17th-century history, and was startlingly educated by an unpretentious pr","note":"17 世纪历史；复合形容词中的连字符不能省略。","forms":["17th-century history"]},{"w":"a programme on","pos":"phr.","cn":"一档关于……的节目。","sec":"text3","sec_label":"Text 3","ctx":"In my own book about radio I recorded how, on one drive: “I caught up with the news, learnt some 17th-century history, and was startlingly educated by an unpretentious pr","note":"一档关于……的节目。","forms":["a programme on"]},{"w":"the history of the stethoscope","pos":"phr.","cn":"听诊器的历史。","sec":"text3","sec_label":"Text 3","ctx":"In my own book about radio I recorded how, on one drive: “I caught up with the news, learnt some 17th-century history, and was startlingly educated by an unpretentious pr","note":"听诊器的历史。","forms":["the history of the stethoscope"]},{"w":"ebb","pos":"词","cn":"本义指潮水退去，此处指某种影响力或现象逐渐减弱、衰退。","sec":"text3","sec_label":"Text 3","ctx":"But radio’s enriching serendipity is ebbing.","note":"本义指潮水退去，此处指某种影响力或现象逐渐减弱、衰退。","forms":["ebb"]},{"w":"enriching serendipity","pos":"phr.","cn":"能够丰富生活的意外发现或偶然收获。","sec":"text3","sec_label":"Text 3","ctx":"But radio’s enriching serendipity is ebbing.","note":"能够丰富生活的意外发现或偶然收获。","forms":["enriching serendipity"]},{"w":"be ebbing","pos":"phr.","cn":"正在减弱、消退。","sec":"text3","sec_label":"Text 3","ctx":"But radio’s enriching serendipity is ebbing.","note":"正在减弱、消退。","forms":["be ebbing"]},{"w":"countless","pos":"adj.","cn":"数不清的、无数的。","sec":"text3","sec_label":"Text 3","ctx":"With multiple networks and countless podcasts, a smartphone user selects what to hear and when.","note":"数不清的、无数的。","forms":["countless"]},{"w":"select what to hear and when","pos":"phr.","cn":"选择听什么以及在什么时候听；what 和 when 分别引导选择内容和时间。","sec":"text3","sec_label":"Text 3","ctx":"With multiple networks and countless podcasts, a smartphone user selects what to hear and when.","note":"选择听什么以及在什么时候听；what 和 when 分别引导选择内容和时间。","forms":["select what to hear and when"]},{"w":"shrink into","pos":"phr.","cn":"缩进、退缩到某个狭小范围中；此处是比喻用法。","sec":"text3","sec_label":"Text 3","ctx":"And while it is wonderful to take a walk with anything in your headphones, infinite choice encourages us to shrink into niche interests and sympathetic beliefs.","note":"缩进、退缩到某个狭小范围中；此处是比喻用法。","forms":["shrink into"]},{"w":"sympathetic beliefs","pos":"phr.","cn":"与自己同调、相互支持的信念，不是“富有同情心的信仰”。","sec":"text3","sec_label":"Text 3","ctx":"And while it is wonderful to take a walk with anything in your headphones, infinite choice encourages us to shrink into niche interests and sympathetic beliefs.","note":"与自己同调、相互支持的信念，不是“富有同情心的信仰”。","forms":["sympathetic beliefs"]},{"w":"niche interest","pos":"phr.","cn":"小众、狭窄而专门的兴趣。","sec":"text3","sec_label":"Text 3","ctx":"And while it is wonderful to take a walk with anything in your headphones, infinite choice encourages us to shrink into niche interests and sympathetic beliefs.","note":"小众、狭窄而专门的兴趣。","forms":["niche interest"]},{"w":"infinite choice","pos":"phr.","cn":"无限的选择；这里暗含选择过多也可能造成封闭。","sec":"text3","sec_label":"Text 3","ctx":"And while it is wonderful to take a walk with anything in your headphones, infinite choice encourages us to shrink into niche interests and sympathetic beliefs.","note":"无限的选择；这里暗含选择过多也可能造成封闭。","forms":["infinite choice"]},{"w":"a hundred years on from","pos":"phr.","cn":"从……算起一百年后；不是“在……上方一百年”。","sec":"text3","sec_label":"Text 3","ctx":"A hundred years on from Marconi and Reith, is the art of mere listening endangered?","note":"从……算起一百年后；不是“在……上方一百年”。","forms":["a hundred years on from"]},{"w":"mere","pos":"词","cn":"仅仅的、单纯的，强调不伴随主动筛选或其他操作。","sec":"text3","sec_label":"Text 3","ctx":"A hundred years on from Marconi and Reith, is the art of mere listening endangered?","note":"仅仅的、单纯的，强调不伴随主动筛选或其他操作。","forms":["mere"]},{"w":"the art of listening","pos":"phr.","cn":"倾听的能力或习惯。","sec":"text3","sec_label":"Text 3","ctx":"A hundred years on from Marconi and Reith, is the art of mere listening endangered?","note":"倾听的能力或习惯。","forms":["the art of listening"]},{"w":"be endangered","pos":"phr.","cn":"受到威胁、面临消失风险。","sec":"text3","sec_label":"Text 3","ctx":"A hundred years on from Marconi and Reith, is the art of mere listening endangered?","note":"受到威胁、面临消失风险。","forms":["be endangered"]},{"w":"boom","pos":"词","cn":"迅速发展、繁荣；这里指有声书市场或使用的兴盛。","sec":"text3","sec_label":"Text 3","ctx":"Some will say the audiobook boom revives it, though I suppose you can then worry about the decline of reading.","note":"迅速发展、繁荣；这里指有声书市场或使用的兴盛。","forms":["boom"]},{"w":"revive","pos":"adj.","cn":"使恢复、重新焕发生机。","sec":"text3","sec_label":"Text 3","ctx":"Some will say the audiobook boom revives it, though I suppose you can then worry about the decline of reading.","note":"使恢复、重新焕发生机。","forms":["revive"]},{"w":"shield","pos":"词","cn":"保护、使……免受影响；此处不是“盾牌”。","sec":"text3","sec_label":"Text 3","ctx":"But inventions shape all of us and it is worth noticing when techno-social habits do change, and asking whether to control them a bit or shield the youngest.","note":"保护、使……免受影响；此处不是“盾牌”。","forms":["shield"]},{"w":"the youngest","pos":"phr.","cn":"年龄最小的人，语境中主要指儿童和青少年。","sec":"text3","sec_label":"Text 3","ctx":"But inventions shape all of us and it is worth noticing when techno-social habits do change, and asking whether to control them a bit or shield the youngest.","note":"年龄最小的人，语境中主要指儿童和青少年。","forms":["the youngest"]},{"w":"techno-social habits","pos":"phr.","cn":"由技术塑造、又影响社会交往的习惯。","sec":"text3","sec_label":"Text 3","ctx":"But inventions shape all of us and it is worth noticing when techno-social habits do change, and asking whether to control them a bit or shield the youngest.","note":"由技术塑造、又影响社会交往的习惯。","forms":["techno-social habits"]},{"w":"it is worth doing","pos":"phr.","cn":"做某事是值得的。","sec":"text3","sec_label":"Text 3","ctx":"But inventions shape all of us and it is worth noticing when techno-social habits do change, and asking whether to control them a bit or shield the youngest.","note":"做某事是值得的。","forms":["it is worth doing"]},{"w":"control ... a bit","pos":"phr.","cn":"稍加控制，语气比完全禁止温和。","sec":"text3","sec_label":"Text 3","ctx":"But inventions shape all of us and it is worth noticing when techno-social habits do change, and asking whether to control them a bit or shield the youngest.","note":"稍加控制，语气比完全禁止温和。","forms":["control ... a bit"]},{"w":"whatever we do","pos":"phr.","cn":"无论我们做什么；whatever 引导让步状语从句。","sec":"text3","sec_label":"Text 3","ctx":"Whatever we do, innovation will happen.","note":"无论我们做什么；whatever 引导让步状语从句。","forms":["whatever we do"]},{"w":"fret about","pos":"phr.","cn":"为……烦恼、忧虑；不是“用 fret 品格演奏”。","sec":"text3","sec_label":"Text 3","ctx":"Today we fret about the isolating culture of smartphone-staring and selfie-vanity, but already in 1939 there was that lady regretting how, when all her street got wireles","note":"为……烦恼、忧虑；不是“用 fret 品格演奏”。","forms":["fret about"]},{"w":"smartphone-staring","pos":"adj.","cn":"长时间盯着智能手机的行为。","sec":"text3","sec_label":"Text 3","ctx":"Today we fret about the isolating culture of smartphone-staring and selfie-vanity, but already in 1939 there was that lady regretting how, when all her street got wireles","note":"长时间盯着智能手机的行为。","forms":["smartphone-staring"]},{"w":"selfie-vanity","pos":"n.","cn":"沉溺自拍、以自拍满足自我关注的状态。","sec":"text3","sec_label":"Text 3","ctx":"Today we fret about the isolating culture of smartphone-staring and selfie-vanity, but already in 1939 there was that lady regretting how, when all her street got wireles","note":"沉溺自拍、以自拍满足自我关注的状态。","forms":["selfie-vanity"]},{"w":"wirelesses","pos":"词","cn":"wireless 的复数，指收音机或无线电设备。","sec":"text3","sec_label":"Text 3","ctx":"Today we fret about the isolating culture of smartphone-staring and selfie-vanity, but already in 1939 there was that lady regretting how, when all her street got wireles","note":"wireless 的复数，指收音机或无线电设备。","forms":["wirelesses"]},{"w":"It’s enough to make somebody do","pos":"phr.","cn":"足以使某人做某事；这里是带有幽默色彩的感叹。","sec":"text3","sec_label":"Text 3","ctx":"It’s enough to make a person put down the smartphone and go out front with a yard broom.","note":"足以使某人做某事；这里是带有幽默色彩的感叹。","forms":["It’s enough to make somebody do"]},{"w":"put down","pos":"phr.","cn":"放下；不是“批评、贬低”。","sec":"text3","sec_label":"Text 3","ctx":"It’s enough to make a person put down the smartphone and go out front with a yard broom.","note":"放下；不是“批评、贬低”。","forms":["put down"]},{"w":"mandate","pos":"v.","cn":"常见义为“任期、授权”，此处指上级规定的任务或政策要求。","sec":"text4","sec_label":"Text 4","ctx":"When Tom Swetnam joined the U.S. Forest Service in the 1970s, his mandate was to “put everything out,” he recalled.","note":"常见义为“任期、授权”，此处指上级规定的任务或政策要求。","forms":["mandate"]},{"w":"put everything out","pos":"phr.","cn":"此处 put out 指扑灭火灾，everything 指所有火情，而不是把所有东西拿出去。","sec":"text4","sec_label":"Text 4","ctx":"When Tom Swetnam joined the U.S. Forest Service in the 1970s, his mandate was to “put everything out,” he recalled.","note":"此处 put out 指扑灭火灾，everything 指所有火情，而不是把所有东西拿出去。","forms":["put everything out"]},{"w":"join the U.S. Forest Service","pos":"phr.","cn":"加入美国林务局。","sec":"text4","sec_label":"Text 4","ctx":"When Tom Swetnam joined the U.S. Forest Service in the 1970s, his mandate was to “put everything out,” he recalled.","note":"加入美国林务局。","forms":["join the U.S. Forest Service"]},{"w":"recall","pos":"词","cn":"回忆、回想；比 remember 更正式。","sec":"text4","sec_label":"Text 4","ctx":"When Tom Swetnam joined the U.S. Forest Service in the 1970s, his mandate was to “put everything out,” he recalled.","note":"回忆、回想；比 remember 更正式。","forms":["recall"]},{"w":"enroll in","pos":"phr.","cn":"注册进入、入学；不是“登记某个项目”这么简单。","sec":"text4","sec_label":"Text 4","ctx":"But when Swetnam enrolled in graduate school at the University of Arizona’s Laboratory of Tree-Ring Research, he was surprised to find a record of repeated blazes dating ","note":"注册进入、入学；不是“登记某个项目”这么简单。","forms":["enroll in"]},{"w":"blaze","pos":"词","cn":"猛烈的火焰或火灾；此处是森林火灾。","sec":"text4","sec_label":"Text 4","ctx":"But when Swetnam enrolled in graduate school at the University of Arizona’s Laboratory of Tree-Ring Research, he was surprised to find a record of repeated blazes dating ","note":"猛烈的火焰或火灾；此处是森林火灾。","forms":["blaze"]},{"w":"date back","pos":"phr.","cn":"追溯到、始于某一时间。","sec":"text4","sec_label":"Text 4","ctx":"But when Swetnam enrolled in graduate school at the University of Arizona’s Laboratory of Tree-Ring Research, he was surprised to find a record of repeated blazes dating ","note":"追溯到、始于某一时间。","forms":["date back"]},{"w":"tree-ring research","pos":"phr.","cn":"树轮研究，通过年轮等信息研究树木和历史环境。","sec":"text4","sec_label":"Text 4","ctx":"But when Swetnam enrolled in graduate school at the University of Arizona’s Laboratory of Tree-Ring Research, he was surprised to find a record of repeated blazes dating ","note":"树轮研究，通过年轮等信息研究树木和历史环境。","forms":["tree-ring research"]},{"w":"European colonist","pos":"phr.","cn":"欧洲殖民者。","sec":"text4","sec_label":"Text 4","ctx":"But when Swetnam enrolled in graduate school at the University of Arizona’s Laboratory of Tree-Ring Research, he was surprised to find a record of repeated blazes dating ","note":"欧洲殖民者。","forms":["European colonist"]},{"w":"arrive on the continent","pos":"phr.","cn":"抵达这片大陆。","sec":"text4","sec_label":"Text 4","ctx":"But when Swetnam enrolled in graduate school at the University of Arizona’s Laboratory of Tree-Ring Research, he was surprised to find a record of repeated blazes dating ","note":"抵达这片大陆。","forms":["arrive on the continent"]},{"w":"bear","pos":"词","cn":"常见义为“熊”或“忍受”，此处意为“带有、留下（痕迹）”。","sec":"text4","sec_label":"Text 4","ctx":"Some of the trees he analyzed bore more than 20 fire scars among their rings.","note":"常见义为“熊”或“忍受”，此处意为“带有、留下（痕迹）”。","forms":["bear"]},{"w":"fire scar","pos":"phr.","cn":"火灾疤痕，指树木经历火灾后在年轮上留下的痕迹。","sec":"text4","sec_label":"Text 4","ctx":"Some of the trees he analyzed bore more than 20 fire scars among their rings.","note":"火灾疤痕，指树木经历火灾后在年轮上留下的痕迹。","forms":["fire scar"]},{"w":"among their rings","pos":"phr.","cn":"在它们的年轮之间或年轮中。","sec":"text4","sec_label":"Text 4","ctx":"Some of the trees he analyzed bore more than 20 fire scars among their rings.","note":"在它们的年轮之间或年轮中。","forms":["among their rings"]},{"w":"more than 20","pos":"phr.","cn":"超过 20 个，表示树木反复经历过火灾。","sec":"text4","sec_label":"Text 4","ctx":"Some of the trees he analyzed bore more than 20 fire scars among their rings.","note":"超过 20 个，表示树木反复经历过火灾。","forms":["more than 20"]},{"w":"severe","pos":"词","cn":"严重的、猛烈的；此处描述火灾强度，而不是人的严厉态度。","sec":"text4","sec_label":"Text 4","ctx":"The fact that fires happened so often meant they couldn’t have been severe enough to kill most trees.","note":"严重的、猛烈的；此处描述火灾强度，而不是人的严厉态度。","forms":["severe"]},{"w":"couldn’t have been","pos":"phr.","cn":"对过去情况的否定推断，意为“不可能曾经是……”。","sec":"text4","sec_label":"Text 4","ctx":"The fact that fires happened so often meant they couldn’t have been severe enough to kill most trees.","note":"对过去情况的否定推断，意为“不可能曾经是……”。","forms":["couldn’t have been"]},{"w":"a growing body of research","pos":"phr.","cn":"不断增加的研究成果或研究证据，不是“正在生长的研究身体”。","sec":"text4","sec_label":"Text 4","ctx":"Instead, a growing body of research showed that frequent, low-severity fires made many ecosystems healthier.","note":"不断增加的研究成果或研究证据，不是“正在生长的研究身体”。","forms":["a growing body of research"]},{"w":"low-severity","pos":"n.","cn":"低强度的，指火灾造成的破坏程度较低。","sec":"text4","sec_label":"Text 4","ctx":"Instead, a growing body of research showed that frequent, low-severity fires made many ecosystems healthier.","note":"低强度的，指火灾造成的破坏程度较低。","forms":["low-severity"]},{"w":"instead","pos":"词","cn":"相反、反而，用于推翻前面可能的直觉。","sec":"text4","sec_label":"Text 4","ctx":"Instead, a growing body of research showed that frequent, low-severity fires made many ecosystems healthier.","note":"相反、反而，用于推翻前面可能的直觉。","forms":["instead"]},{"w":"make ecosystems healthier","pos":"phr.","cn":"使生态系统更健康。","sec":"text4","sec_label":"Text 4","ctx":"Instead, a growing body of research showed that frequent, low-severity fires made many ecosystems healthier.","note":"使生态系统更健康。","forms":["make ecosystems healthier"]},{"w":"rid ... of","pos":"phr.","cn":"使……摆脱、清除……；不是普通的 remove 的机械替换。","sec":"text4","sec_label":"Text 4","ctx":"They rid the forest of dead and sick trees, reducing competition and curbing the spread of disease.","note":"使……摆脱、清除……；不是普通的 remove 的机械替换。","forms":["rid ... of"]},{"w":"curb","pos":"词","cn":"抑制、遏制；此处不是“路缘石”。","sec":"text4","sec_label":"Text 4","ctx":"They rid the forest of dead and sick trees, reducing competition and curbing the spread of disease.","note":"抑制、遏制；此处不是“路缘石”。","forms":["curb"]},{"w":"dead and sick trees","pos":"phr.","cn":"枯死树木和患病树木。","sec":"text4","sec_label":"Text 4","ctx":"They rid the forest of dead and sick trees, reducing competition and curbing the spread of disease.","note":"枯死树木和患病树木。","forms":["dead and sick trees"]},{"w":"reduce competition","pos":"phr.","cn":"减少竞争；这里指树木之间对资源的竞争。","sec":"text4","sec_label":"Text 4","ctx":"They rid the forest of dead and sick trees, reducing competition and curbing the spread of disease.","note":"减少竞争；这里指树木之间对资源的竞争。","forms":["reduce competition"]},{"w":"the spread of disease","pos":"phr.","cn":"疾病传播。","sec":"text4","sec_label":"Text 4","ctx":"They rid the forest of dead and sick trees, reducing competition and curbing the spread of disease.","note":"疾病传播。","forms":["the spread of disease"]},{"w":"build up","pos":"phr.","cn":"积累、逐渐增多；不是“建立起来”。","sec":"text4","sec_label":"Text 4","ctx":"Because flammable material couldn’t build up on the landscape, blazes tended to move Slowly and peter out when they reached the footprints of previous burns.","note":"积累、逐渐增多；不是“建立起来”。","forms":["build up"]},{"w":"peter out","pos":"phr.","cn":"逐渐减弱并最终停止；此处指火势慢慢熄灭。","sec":"text4","sec_label":"Text 4","ctx":"Because flammable material couldn’t build up on the landscape, blazes tended to move Slowly and peter out when they reached the footprints of previous burns.","note":"逐渐减弱并最终停止；此处指火势慢慢熄灭。","forms":["peter out"]},{"w":"footprint","pos":"词","cn":"本义为“脚印”，此处指此前火灾留下的范围或痕迹。","sec":"text4","sec_label":"Text 4","ctx":"Because flammable material couldn’t build up on the landscape, blazes tended to move Slowly and peter out when they reached the footprints of previous burns.","note":"本义为“脚印”，此处指此前火灾留下的范围或痕迹。","forms":["footprint"]},{"w":"flammable material","pos":"phr.","cn":"易燃物。","sec":"text4","sec_label":"Text 4","ctx":"Because flammable material couldn’t build up on the landscape, blazes tended to move Slowly and peter out when they reached the footprints of previous burns.","note":"易燃物。","forms":["flammable material"]},{"w":"on the landscape","pos":"phr.","cn":"在地表环境中。","sec":"text4","sec_label":"Text 4","ctx":"Because flammable material couldn’t build up on the landscape, blazes tended to move Slowly and peter out when they reached the footprints of previous burns.","note":"在地表环境中。","forms":["on the landscape"]},{"w":"previous burns","pos":"phr.","cn":"此前发生的火灾或烧过的区域。","sec":"text4","sec_label":"Text 4","ctx":"Because flammable material couldn’t build up on the landscape, blazes tended to move Slowly and peter out when they reached the footprints of previous burns.","note":"此前发生的火灾或烧过的区域。","forms":["previous burns"]},{"w":"team up","pos":"phr.","cn":"合作、联手。","sec":"text4","sec_label":"Text 4","ctx":"In 2022, Swetnam and other scientists teamed up to compile a database of fire-scarred trees from across the continent.","note":"合作、联手。","forms":["team up"]},{"w":"compile a database","pos":"phr.","cn":"汇编、建立数据库。","sec":"text4","sec_label":"Text 4","ctx":"In 2022, Swetnam and other scientists teamed up to compile a database of fire-scarred trees from across the continent.","note":"汇编、建立数据库。","forms":["compile a database"]},{"w":"fire-scarred tree","pos":"phr.","cn":"带有火灾痕迹的树木。","sec":"text4","sec_label":"Text 4","ctx":"In 2022, Swetnam and other scientists teamed up to compile a database of fire-scarred trees from across the continent.","note":"带有火灾痕迹的树木。","forms":["fire-scarred tree"]},{"w":"basis","pos":"词","cn":"基础、依据；不是抽象的“基底”。","sec":"text4","sec_label":"Text 4","ctx":"Their North American tree-ring fire-scar network (NAFSN) provided the basis for a study published last month.","note":"基础、依据；不是抽象的“基底”。","forms":["basis"]},{"w":"provide the basis for","pos":"phr.","cn":"为……提供基础。","sec":"text4","sec_label":"Text 4","ctx":"Their North American tree-ring fire-scar network (NAFSN) provided the basis for a study published last month.","note":"为……提供基础。","forms":["provide the basis for"]},{"w":"tree-ring fire-scar network","pos":"phr.","cn":"树轮火灾痕迹网络。","sec":"text4","sec_label":"Text 4","ctx":"Their North American tree-ring fire-scar network (NAFSN) provided the basis for a study published last month.","note":"树轮火灾痕迹网络。","forms":["tree-ring fire-scar network"]},{"w":"cadence","pos":"n.","cn":"本义可指节奏、韵律，此处指火灾发生的频率或周期。","sec":"text4","sec_label":"Text 4","ctx":"In the study, the researchers compared the historical fire cadence with the wildfires recorded over the past few decades, and uncovered a striking shortfall.","note":"本义可指节奏、韵律，此处指火灾发生的频率或周期。","forms":["cadence"]},{"w":"shortfall","pos":"词","cn":"不足、缺口；这里指实际火灾数量比历史预期少很多。","sec":"text4","sec_label":"Text 4","ctx":"In the study, the researchers compared the historical fire cadence with the wildfires recorded over the past few decades, and uncovered a striking shortfall.","note":"不足、缺口；这里指实际火灾数量比历史预期少很多。","forms":["shortfall"]},{"w":"over the past few decades","pos":"phr.","cn":"在过去几十年中。","sec":"text4","sec_label":"Text 4","ctx":"In the study, the researchers compared the historical fire cadence with the wildfires recorded over the past few decades, and uncovered a striking shortfall.","note":"在过去几十年中。","forms":["over the past few decades"]},{"w":"a striking shortfall","pos":"phr.","cn":"明显而惊人的缺口。","sec":"text4","sec_label":"Text 4","ctx":"In the study, the researchers compared the historical fire cadence with the wildfires recorded over the past few decades, and uncovered a striking shortfall.","note":"明显而惊人的缺口。","forms":["a striking shortfall"]},{"w":"experience fires","pos":"phr.","cn":"经历、发生火灾；不是“体验火灾”这一主观体验。","sec":"text4","sec_label":"Text 4","ctx":"The NAFSN sites experienced less than a quarter of the number of fires that would have been expected without fire suppression.","note":"经历、发生火灾；不是“体验火灾”这一主观体验。","forms":["experience fires"]},{"w":"fire suppression","pos":"phr.","cn":"人为灭火、压制火灾的措施。","sec":"text4","sec_label":"Text 4","ctx":"The NAFSN sites experienced less than a quarter of the number of fires that would have been expected without fire suppression.","note":"人为灭火、压制火灾的措施。","forms":["fire suppression"]},{"w":"less than a quarter of","pos":"phr.","cn":"不到……的四分之一。","sec":"text4","sec_label":"Text 4","ctx":"The NAFSN sites experienced less than a quarter of the number of fires that would have been expected without fire suppression.","note":"不到……的四分之一。","forms":["less than a quarter of"]},{"w":"would have been expected","pos":"phr.","cn":"本来预计会发生，带有与现实情况比较的假设意味。","sec":"text4","sec_label":"Text 4","ctx":"The NAFSN sites experienced less than a quarter of the number of fires that would have been expected without fire suppression.","note":"本来预计会发生，带有与现实情况比较的假设意味。","forms":["would have been expected"]},{"w":"deficit","pos":"词","cn":"不足、缺口；此处指实际火灾数与原本预期数量之间的差额。","sec":"text4","sec_label":"Text 4","ctx":"This deficit is a testament to the effectiveness of modern firefighting, said Kelly Martin, a past president of the International Association of Wildland Fire.","note":"不足、缺口；此处指实际火灾数与原本预期数量之间的差额。","forms":["deficit"]},{"w":"testament","pos":"n.","cn":"证明、明证；不是宗教意义上的“圣经旧约”。","sec":"text4","sec_label":"Text 4","ctx":"This deficit is a testament to the effectiveness of modern firefighting, said Kelly Martin, a past president of the International Association of Wildland Fire.","note":"证明、明证；不是宗教意义上的“圣经旧约”。","forms":["testament"]},{"w":"a testament to","pos":"phr.","cn":"……的证明、明证。","sec":"text4","sec_label":"Text 4","ctx":"This deficit is a testament to the effectiveness of modern firefighting, said Kelly Martin, a past president of the International Association of Wildland Fire.","note":"……的证明、明证。","forms":["a testament to"]},{"w":"modern firefighting","pos":"phr.","cn":"现代消防或现代灭火工作。","sec":"text4","sec_label":"Text 4","ctx":"This deficit is a testament to the effectiveness of modern firefighting, said Kelly Martin, a past president of the International Association of Wildland Fire.","note":"现代消防或现代灭火工作。","forms":["modern firefighting"]},{"w":"past president","pos":"phr.","cn":"前任主席。","sec":"text4","sec_label":"Text 4","ctx":"This deficit is a testament to the effectiveness of modern firefighting, said Kelly Martin, a past president of the International Association of Wildland Fire.","note":"前任主席。","forms":["past president"]},{"w":"erode","pos":"词","cn":"逐渐削弱、侵蚀；不是只表示物理表面的磨损。","sec":"text4","sec_label":"Text 4","ctx":"“Yet the combined consequences of suppression and climate change have eroded humanity’s ability to suppress fires, particularly those that ignite under the most dangerous","note":"逐渐削弱、侵蚀；不是只表示物理表面的磨损。","forms":["erode"]},{"w":"ignite","pos":"词","cn":"点燃、着火；此处是不及物意义“燃起”。","sec":"text4","sec_label":"Text 4","ctx":"“Yet the combined consequences of suppression and climate change have eroded humanity’s ability to suppress fires, particularly those that ignite under the most dangerous","note":"点燃、着火；此处是不及物意义“燃起”。","forms":["ignite"]},{"w":"combined consequences of","pos":"phr.","cn":"……共同造成的后果。","sec":"text4","sec_label":"Text 4","ctx":"“Yet the combined consequences of suppression and climate change have eroded humanity’s ability to suppress fires, particularly those that ignite under the most dangerous","note":"……共同造成的后果。","forms":["combined consequences of"]},{"w":"particularly those that ...","pos":"phr.","cn":"尤其是那些……的火灾；those 指 fires。","sec":"text4","sec_label":"Text 4","ctx":"“Yet the combined consequences of suppression and climate change have eroded humanity’s ability to suppress fires, particularly those that ignite under the most dangerous","note":"尤其是那些……的火灾；those 指 fires。","forms":["particularly those that ..."]},{"w":"under dangerous weather conditions","pos":"phr.","cn":"在危险的天气条件下。","sec":"text4","sec_label":"Text 4","ctx":"“Yet the combined consequences of suppression and climate change have eroded humanity’s ability to suppress fires, particularly those that ignite under the most dangerous","note":"在危险的天气条件下。","forms":["under dangerous weather conditions"]},{"w":"go up in smoke","pos":"phr.","cn":"化为乌有、被大火毁掉；这里是形象表达，不是字面上的“升入烟雾”。","sec":"text4","sec_label":"Text 4","ctx":"To prevent entire ecosystems from going up in smoke, Martin said, people must bring healthy fire back to places that need it.","note":"化为乌有、被大火毁掉；这里是形象表达，不是字面上的“升入烟雾”。","forms":["go up in smoke"]},{"w":"healthy fire","pos":"phr.","cn":"有益于生态系统的、可控制的火，而不是任何一场自然野火。","sec":"text4","sec_label":"Text 4","ctx":"To prevent entire ecosystems from going up in smoke, Martin said, people must bring healthy fire back to places that need it.","note":"有益于生态系统的、可控制的火，而不是任何一场自然野火。","forms":["healthy fire"]},{"w":"prevent ... from doing","pos":"phr.","cn":"防止……做某事。","sec":"text4","sec_label":"Text 4","ctx":"To prevent entire ecosystems from going up in smoke, Martin said, people must bring healthy fire back to places that need it.","note":"防止……做某事。","forms":["prevent ... from doing"]},{"w":"bring ... back to","pos":"phr.","cn":"把……重新带回……。","sec":"text4","sec_label":"Text 4","ctx":"To prevent entire ecosystems from going up in smoke, Martin said, people must bring healthy fire back to places that need it.","note":"把……重新带回……。","forms":["bring ... back to"]},{"w":"places that need it","pos":"phr.","cn":"需要这种生态性火灾的地方。","sec":"text4","sec_label":"Text 4","ctx":"To prevent entire ecosystems from going up in smoke, Martin said, people must bring healthy fire back to places that need it.","note":"需要这种生态性火灾的地方。","forms":["places that need it"]},{"w":"prescribed burn","pos":"phr.","cn":"计划性燃烧、处方性燃烧，指由专业人员在可控条件下有意点燃的火。","sec":"text4","sec_label":"Text 4","ctx":"At Yosemite National Park, Martin oversaw the use of what is known as prescribed burns to make the landscape more resilient.","note":"计划性燃烧、处方性燃烧，指由专业人员在可控条件下有意点燃的火。","forms":["prescribed burn"]},{"w":"resilient","pos":"词","cn":"有韧性的、恢复力强的；此处指景观更能承受和恢复火灾影响。","sec":"text4","sec_label":"Text 4","ctx":"At Yosemite National Park, Martin oversaw the use of what is known as prescribed burns to make the landscape more resilient.","note":"有韧性的、恢复力强的；此处指景观更能承受和恢复火灾影响。","forms":["resilient"]},{"w":"oversee the use of","pos":"phr.","cn":"监督……的使用或实施。","sec":"text4","sec_label":"Text 4","ctx":"At Yosemite National Park, Martin oversaw the use of what is known as prescribed burns to make the landscape more resilient.","note":"监督……的使用或实施。","forms":["oversee the use of"]},{"w":"what is known as","pos":"phr.","cn":"所谓的、被称为……的。","sec":"text4","sec_label":"Text 4","ctx":"At Yosemite National Park, Martin oversaw the use of what is known as prescribed burns to make the landscape more resilient.","note":"所谓的、被称为……的。","forms":["what is known as"]},{"w":"make ... more resilient","pos":"phr.","cn":"使……更有韧性、更能抵抗冲击。","sec":"text4","sec_label":"Text 4","ctx":"At Yosemite National Park, Martin oversaw the use of what is known as prescribed burns to make the landscape more resilient.","note":"使……更有韧性、更能抵抗冲击。","forms":["make ... more resilient"]},{"w":"fuel","pos":"词","cn":"此处指可供火灾燃烧的枯枝、灌木等可燃物，不是交通工具使用的燃料。","sec":"text4","sec_label":"Text 4","ctx":"These fires were carefully planned and intentionally ignited during periods when weather kept the blazes easy to control, and helped eliminate some of the fuel that had b","note":"此处指可供火灾燃烧的枯枝、灌木等可燃物，不是交通工具使用的燃料。","forms":["fuel"]},{"w":"facilities","pos":"词","cn":"设施、建筑等配套设施，不是“能力”。","sec":"text4","sec_label":"Text 4","ctx":"These fires were carefully planned and intentionally ignited during periods when weather kept the blazes easy to control, and helped eliminate some of the fuel that had b","note":"设施、建筑等配套设施，不是“能力”。","forms":["facilities"]},{"w":"be intentionally ignited","pos":"phr.","cn":"被有意点燃。","sec":"text4","sec_label":"Text 4","ctx":"These fires were carefully planned and intentionally ignited during periods when weather kept the blazes easy to control, and helped eliminate some of the fuel that had b","note":"被有意点燃。","forms":["be intentionally ignited"]},{"w":"keep the blazes easy to control","pos":"phr.","cn":"使火势保持在易于控制的状态。","sec":"text4","sec_label":"Text 4","ctx":"These fires were carefully planned and intentionally ignited during periods when weather kept the blazes easy to control, and helped eliminate some of the fuel that had b","note":"使火势保持在易于控制的状态。","forms":["keep the blazes easy to control"]},{"w":"build up around","pos":"phr.","cn":"在……周围逐渐积累。","sec":"text4","sec_label":"Text 4","ctx":"These fires were carefully planned and intentionally ignited during periods when weather kept the blazes easy to control, and helped eliminate some of the fuel that had b","note":"在……周围逐渐积累。","forms":["build up around"]},{"w":"subsequent","pos":"词","cn":"随后发生的、后续的；不是“次要的”。","sec":"text4","sec_label":"Text 4","ctx":"Research shows that these prescribed burns make subsequent wildfires less severe, even if later fires happen under the most dangerous weather conditions.","note":"随后发生的、后续的；不是“次要的”。","forms":["subsequent"]},{"w":"make wildfires less severe","pos":"phr.","cn":"使野火的严重程度降低。","sec":"text4","sec_label":"Text 4","ctx":"Research shows that these prescribed burns make subsequent wildfires less severe, even if later fires happen under the most dangerous weather conditions.","note":"使野火的严重程度降低。","forms":["make wildfires less severe"]},{"w":"even if","pos":"phr.","cn":"即使、哪怕，引导让步条件。","sec":"text4","sec_label":"Text 4","ctx":"Research shows that these prescribed burns make subsequent wildfires less severe, even if later fires happen under the most dangerous weather conditions.","note":"即使、哪怕，引导让步条件。","forms":["even if"]},{"w":"later fires","pos":"phr.","cn":"之后发生的火灾。","sec":"text4","sec_label":"Text 4","ctx":"Research shows that these prescribed burns make subsequent wildfires less severe, even if later fires happen under the most dangerous weather conditions.","note":"之后发生的火灾。","forms":["later fires"]},{"w":"tactic","pos":"adj.","cn":"此处指通过计划性燃烧恢复有益火灾的策略，不是军事战术。","sec":"text4","sec_label":"Text 4","ctx":"Yet even as scientists and public officials increasingly agree on the need for more fires in our forests, climate change is making this tactic more challenging, experts s","note":"此处指通过计划性燃烧恢复有益火灾的策略，不是军事战术。","forms":["tactic"]},{"w":"challenging","pos":"v./n.","cn":"困难的、棘手的；不是单纯的“具有挑战性”口号。","sec":"text4","sec_label":"Text 4","ctx":"Yet even as scientists and public officials increasingly agree on the need for more fires in our forests, climate change is making this tactic more challenging, experts s","note":"困难的、棘手的；不是单纯的“具有挑战性”口号。","forms":["challenging"]},{"w":"agree on the need for","pos":"phr.","cn":"就需要……达成共识。","sec":"text4","sec_label":"Text 4","ctx":"Yet even as scientists and public officials increasingly agree on the need for more fires in our forests, climate change is making this tactic more challenging, experts s","note":"就需要……达成共识。","forms":["agree on the need for"]},{"w":"public official","pos":"phr.","cn":"政府官员。","sec":"text4","sec_label":"Text 4","ctx":"Yet even as scientists and public officials increasingly agree on the need for more fires in our forests, climate change is making this tactic more challenging, experts s","note":"政府官员。","forms":["public official"]},{"w":"make ... more challenging","pos":"phr.","cn":"使……变得更困难。","sec":"text4","sec_label":"Text 4","ctx":"Yet even as scientists and public officials increasingly agree on the need for more fires in our forests, climate change is making this tactic more challenging, experts s","note":"使……变得更困难。","forms":["make ... more challenging"]},{"w":"double-edged sword","pos":"phr.","cn":"双刃剑，指同一情况同时带来必要性和风险、好处和困难。","sec":"text4","sec_label":"Text 4","ctx":"“It’s a double-edged sword because wildfires are getting more severe and larger under climate change and we need this work even more, but then the work gets more challeng","note":"双刃剑，指同一情况同时带来必要性和风险、好处和困难。","forms":["double-edged sword"]},{"w":"this work","pos":"phr.","cn":"指前文通过计划性燃烧等方式恢复有益火灾、降低燃料负荷的工作。","sec":"text4","sec_label":"Text 4","ctx":"“It’s a double-edged sword because wildfires are getting more severe and larger under climate change and we need this work even more, but then the work gets more challeng","note":"指前文通过计划性燃烧等方式恢复有益火灾、降低燃料负荷的工作。","forms":["this work"]},{"w":"get more severe and larger","pos":"phr.","cn":"变得更猛烈、规模更大。","sec":"text4","sec_label":"Text 4","ctx":"“It’s a double-edged sword because wildfires are getting more severe and larger under climate change and we need this work even more, but then the work gets more challeng","note":"变得更猛烈、规模更大。","forms":["get more severe and larger"]},{"w":"under climate change","pos":"phr.","cn":"在气候变化影响下。","sec":"text4","sec_label":"Text 4","ctx":"“It’s a double-edged sword because wildfires are getting more severe and larger under climate change and we need this work even more, but then the work gets more challeng","note":"在气候变化影响下。","forms":["under climate change"]},{"w":"even more","pos":"phr.","cn":"更加、比以前更需要。","sec":"text4","sec_label":"Text 4","ctx":"“It’s a double-edged sword because wildfires are getting more severe and larger under climate change and we need this work even more, but then the work gets more challeng","note":"更加、比以前更需要。","forms":["even more"]}],"sentences":[{"id":"2026-T1-P1-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"But where and when these animals first became intertwined with humans has been a mystery.","core":"where and when ... has been a mystery，即“何时何地发生这件事一直是个谜”。","structure":"where and when these animals first became intertwined with humans 是由两个疑问副词引导的主语从句；从句内部的 these animals 作主语，became intertwined 作系动结构。","key":"intertwined with：本义为“缠绕在一起”，此处指驴与人类生活、历史形成了密切联系。","zh":"但这些动物最初在何地、何时与人类交织在一起，始终是个谜。","tip":"where and when 整体作主语，谓语用单数 has；不能把 where 误看成地点状语而漏掉主句主语。"},{"id":"2026-T1-P1-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"Now, researchers have used genomes of over 200 donkeys to trace their domestication back to a single event around 7,000 years ago in East Africa — about 3,000 years before humans tamed horses.","core":"researchers have used genomes ... to trace their domestication back to a single event。","structure":"of over 200 donkeys 修饰 genomes；to trace ... 是目的状语；破折号后的 about 3,000 years before humans tamed horses 补充说明该事件相对于人类驯马的时间。","key":"genome：基因组，指一个生物体全部的遗传物质。；trace ... back to ...：把……追溯到……。；domestication：驯化，指野生动物逐渐被人类驯养和利用的过程。","zh":"如今，研究人员利用 200 多头驴的基因组，将它们的驯化史追溯到大约 7000 年前东非发生的一次事件，这比人类驯服马早了约 3000 年。","tip":"their 指 donkeys；before humans tamed horses 的比较基准是驴的驯化事件，而不是研究人员使用基因组的时间。"},{"id":"2026-T1-P2-S06","sec":"text1","sec_label":"Text 1","level":3,"en":"“Through their DNA, the animals are telling their history themselves,” co-author Samantha Brooks, an equine researcher at the Universit

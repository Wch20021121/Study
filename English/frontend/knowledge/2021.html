ther agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-str","note":"以牺牲……的利益为代价。","forms":["at the expense of"]},{"w":"protect against anti-competitive behavior","pos":"phr.","cn":"防止反竞争行为。","sec":"text4","sec_label":"Text 4","ctx":"The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-str","note":"防止反竞争行为。","forms":["protect against anti-competitive behavior"]},{"w":"broadband-providing","pos":"adj.","cn":"提供宽带服务的。","sec":"text4","sec_label":"Text 4","ctx":"The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-str","note":"提供宽带服务的。","forms":["broadband-providing"]},{"w":"favor one's own service","pos":"phr.","cn":"偏袒自家服务。","sec":"text4","sec_label":"Text 4","ctx":"The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-str","note":"偏袒自家服务。","forms":["favor one's own service"]},{"w":"video-streaming service","pos":"phr.","cn":"视频流媒体服务。","sec":"text4","sec_label":"Text 4","ctx":"The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-str","note":"视频流媒体服务。","forms":["video-streaming service"]},{"w":"end an investigation of","pos":"phr.","cn":"终止对……的调查。","sec":"text4","sec_label":"Text 4","ctx":"Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals' streaming services but not their own.","note":"终止对……的调查。","forms":["end an investigation of"]},{"w":"impose a data cap on","pos":"phr.","cn":"对……设置数据使用上限。","sec":"text4","sec_label":"Text 4","ctx":"Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals' streaming services but not their own.","note":"对……设置数据使用上限。","forms":["impose a data cap on"]},{"w":"their rivals' services but not their own","pos":"phr.","cn":"限制竞争对手的服务，却不限制自家服务。","sec":"text4","sec_label":"Text 4","ctx":"Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals' streaming services but not their own.","note":"限制竞争对手的服务，却不限制自家服务。","forms":["their rivals' services but not their own"]},{"w":"uphold","pos":"词","cn":"法院“维持、确认”原裁决或命令有效。","sec":"text4","sec_label":"Text 4","ctx":"On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregula","note":"法院“维持、确认”原裁决或命令有效。","forms":["uphold"]},{"w":"deregulatory","pos":"词","cn":"放松或取消监管的。","sec":"text4","sec_label":"Text 4","ctx":"On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregula","note":"放松或取消监管的。","forms":["deregulatory"]},{"w":"unanimously uphold","pos":"phr.","cn":"一致裁定维持。","sec":"text4","sec_label":"Text 4","ctx":"On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregula","note":"一致裁定维持。","forms":["unanimously uphold"]},{"w":"cite a ruling","pos":"phr.","cn":"援引一项裁决。","sec":"text4","sec_label":"Text 4","ctx":"On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregula","note":"援引一项裁决。","forms":["cite a ruling"]},{"w":"a similarly deregulatory move","pos":"phr.","cn":"一项类似的放松监管举措。","sec":"text4","sec_label":"Text 4","ctx":"On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregula","note":"一项类似的放松监管举措。","forms":["a similarly deregulatory move"]},{"w":"unhinged from","pos":"phr.","cn":"字面有“脱离铰链”之意；","sec":"text4","sec_label":"Text 4","ctx":"But Judge Patricia Millett rightly argued in a concurring opinion that \"the result is unhinged from the realities of modern broadband service,\" and said Congress or the S","note":"字面有“脱离铰链”之意；","forms":["unhinged from"]},{"w":"anachronism","pos":"词","cn":"时代错置、与当前时代不相称的陈旧事物。","sec":"text4","sec_label":"Text 4","ctx":"But Judge Patricia Millett rightly argued in a concurring opinion that \"the result is unhinged from the realities of modern broadband service,\" and said Congress or the S","note":"时代错置、与当前时代不相称的陈旧事物。","forms":["anachronism"]},{"w":"a concurring opinion","pos":"phr.","cn":"协同意见，","sec":"text4","sec_label":"Text 4","ctx":"But Judge Patricia Millett rightly argued in a concurring opinion that \"the result is unhinged from the realities of modern broadband service,\" and said Congress or the S","note":"协同意见，","forms":["a concurring opinion"]},{"w":"be unhinged from reality","pos":"phr.","cn":"脱离现实。","sec":"text4","sec_label":"Text 4","ctx":"But Judge Patricia Millett rightly argued in a concurring opinion that \"the result is unhinged from the realities of modern broadband service,\" and said Congress or the S","note":"脱离现实。","forms":["be unhinged from reality"]},{"w":"intervene to do sth.","pos":"phr.","cn":"介入以做某事。","sec":"text4","sec_label":"Text 4","ctx":"But Judge Patricia Millett rightly argued in a concurring opinion that \"the result is unhinged from the realities of modern broadband service,\" and said Congress or the S","note":"介入以做某事。","forms":["intervene to do sth."]},{"w":"trap regulation in technological anachronism","pos":"phr.","cn":"使监管困在过时技术框架中。","sec":"text4","sec_label":"Text 4","ctx":"But Judge Patricia Millett rightly argued in a concurring opinion that \"the result is unhinged from the realities of modern broadband service,\" and said Congress or the S","note":"使监管困在过时技术框架中。","forms":["trap regulation in technological anachronism"]},{"w":"throw out","pos":"phr.","cn":"此处是法律语境中的“驳回、判定无效”。","sec":"text4","sec_label":"Text 4","ctx":"In the meantime, the court threw out the FCC's attempt to block all state rules on net neutrality, while preserving the commission's power to preempt individual state law","note":"此处是法律语境中的“驳回、判定无效”。","forms":["throw out"]},{"w":"preempt","pos":"词","cn":"以更高层级权力排除、先行取代某项法律。","sec":"text4","sec_label":"Text 4","ctx":"In the meantime, the court threw out the FCC's attempt to block all state rules on net neutrality, while preserving the commission's power to preempt individual state law","note":"以更高层级权力排除、先行取代某项法律。","forms":["preempt"]},{"w":"undermine","pos":"词","cn":"削弱……的效力或权威。","sec":"text4","sec_label":"Text 4","ctx":"In the meantime, the court threw out the FCC's attempt to block all state rules on net neutrality, while preserving the commission's power to preempt individual state law","note":"削弱……的效力或权威。","forms":["undermine"]},{"w":"block all state rules","pos":"phr.","cn":"阻止所有州级规则。","sec":"text4","sec_label":"Text 4","ctx":"In the meantime, the court threw out the FCC's attempt to block all state rules on net neutrality, while preserving the commission's power to preempt individual state law","note":"阻止所有州级规则。","forms":["block all state rules"]},{"w":"preserve the commission's power","pos":"phr.","cn":"保留委员会的权力。","sec":"text4","sec_label":"Text 4","ctx":"In the meantime, the court threw out the FCC's attempt to block all state rules on net neutrality, while preserving the commission's power to preempt individual state law","note":"保留委员会的权力。","forms":["preserve the commission's power"]},{"w":"individual state laws","pos":"phr.","cn":"个别州的法律。","sec":"text4","sec_label":"Text 4","ctx":"In the meantime, the court threw out the FCC's attempt to block all state rules on net neutrality, while preserving the commission's power to preempt individual state law","note":"个别州的法律。","forms":["individual state laws"]},{"w":"abdication","pos":"n.","cn":"本义为君主“退位”；","sec":"text4","sec_label":"Text 4","ctx":"That means more battles like the one now going on between the Justice Department and California, which enacted a tough net neutrality law in the wake of the FCC's abdicat","note":"本义为君主“退位”；","forms":["abdication"]},{"w":"the Justice Department","pos":"phr.","cn":"美国司法部。","sec":"text4","sec_label":"Text 4","ctx":"That means more battles like the one now going on between the Justice Department and California, which enacted a tough net neutrality law in the wake of the FCC's abdicat","note":"美国司法部。","forms":["the Justice Department"]},{"w":"enact a tough law","pos":"phr.","cn":"制定一部严格的法律。","sec":"text4","sec_label":"Text 4","ctx":"That means more battles like the one now going on between the Justice Department and California, which enacted a tough net neutrality law in the wake of the FCC's abdicat","note":"制定一部严格的法律。","forms":["enact a tough law"]},{"w":"in the wake of","pos":"phr.","cn":"紧随……之后；作为……的后果。","sec":"text4","sec_label":"Text 4","ctx":"That means more battles like the one now going on between the Justice Department and California, which enacted a tough net neutrality law in the wake of the FCC's abdicat","note":"紧随……之后；作为……的后果。","forms":["in the wake of"]},{"w":"back-and-forth","pos":"词","cn":"来回反复、政策摇摆或拉锯。","sec":"text4","sec_label":"Text 4","ctx":"The endless legal battles and back-and-forth at the FCC cry out for Congress to act.","note":"来回反复、政策摇摆或拉锯。","forms":["back-and-forth"]},{"w":"cry out for","pos":"phr.","cn":"迫切需要、强烈要求，并非字面“哭喊”。","sec":"text4","sec_label":"Text 4","ctx":"The endless legal battles and back-and-forth at the FCC cry out for Congress to act.","note":"迫切需要、强烈要求，并非字面“哭喊”。","forms":["cry out for"]},{"w":"endless legal battles","pos":"phr.","cn":"没完没了的法律争斗。","sec":"text4","sec_label":"Text 4","ctx":"The endless legal battles and back-and-forth at the FCC cry out for Congress to act.","note":"没完没了的法律争斗。","forms":["endless legal battles"]},{"w":"Congress to act","pos":"phr.","cn":"由国会采取行动。","sec":"text4","sec_label":"Text 4","ctx":"The endless legal battles and back-and-forth at the FCC cry out for Congress to act.","note":"由国会采取行动。","forms":["Congress to act"]},{"w":"meddle in","pos":"phr.","cn":"不当地干预、插手。","sec":"text4","sec_label":"Text 4","ctx":"It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules pro","note":"不当地干预、插手。","forms":["meddle in"]},{"w":"traffic","pos":"adj.","cn":"此处指网络数据流量，不是道路交通。","sec":"text4","sec_label":"Text 4","ctx":"It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules pro","note":"此处指网络数据流量，不是道路交通。","forms":["traffic"]},{"w":"explicit authority","pos":"phr.","cn":"明确的法定权力。","sec":"text4","sec_label":"Text 4","ctx":"It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules pro","note":"明确的法定权力。","forms":["explicit authority"]},{"w":"once and for all","pos":"phr.","cn":"一劳永逸地、彻底地。","sec":"text4","sec_label":"Text 4","ctx":"It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules pro","note":"一劳永逸地、彻底地。","forms":["once and for all"]},{"w":"bar sb. from doing sth.","pos":"phr.","cn":"禁止某人做某事。","sec":"text4","sec_label":"Text 4","ctx":"It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules pro","note":"禁止某人做某事。","forms":["bar sb. from doing sth."]},{"w":"openness and innovation online","pos":"phr.","cn":"网络开放与创新。","sec":"text4","sec_label":"Text 4","ctx":"It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules pro","note":"网络开放与创新。","forms":["openness and innovation online"]}],"sentences":[{"id":"2021-T1-P1-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"It has become a grimly reliable annual ritual: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.","core":"the cost of travelling by train rises。","structure":"冒号后解释 annual ritual 的具体内容；","key":"grimly reliable：reliable 通常含褒义；；ritual：常见义为“仪式”；此处比喻年年重复、近乎固定的惯例。；impose a burden on：给……强加负担。；have no option but to do sth.：除了做某事外别无选择。","zh":"这已经成了一项令人沮丧却年年准时上演的惯例：每到一月，火车出行成本就会上涨，给那些除了搭乘铁路通勤或出行外别无选择的人增加一笔不小的额外负担。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T1-P1-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"This year's rise, an average of 2.7 per cent, may be a fraction lower than last year's, but it is still well above the official Consumer Price Index (CPI) measure of inflation.","core":"This year's rise may be lower ..., but it is still well above ... inflation.","structure":"an average of 2.7 per cent 是同位语，说明本次平均涨幅；","key":"a fraction lower than：比……略低一点。；well above：远高于、明显高于。；Consumer Price Index (CPI)：消费者价格指数。","zh":"今年票价平均上涨 2.7%，或许比去年的涨幅略低，但仍明显高于官方消费者价格指数（CPI）所衡量的通胀水平。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T1-P2-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer.","core":"Successive governments have permitted such increases.","structure":"that 引导原因说明；","key":"bear：常见义为“熊、忍受”；be borne by 中是 bear 的过去分词，；successive governments：历届政府、连续多届政府。；on the grounds that：以……为理由，that 后接具体依据。；invest in and run the rail network：投资并运营铁路网络。","zh":"历届政府一直允许这种涨价，理由是铁路网络的投资和运营成本应由铁路使用者承担，而不应由全体纳税人承担。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T1-P2-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily commute of a stockbroker from Surrey?","core":"Why should a pensioner have to subsidise the commute of a stockbroker?","structure":"the argument goes 是插入语；","key":"subsidise：为……提供补贴；此处指通过税收替他人的铁路通勤分担成本。；the argument goes：这种说法认为、按这一论点的逻辑。；daily commute：日常通勤。；stockbroker：股票经纪人。","zh":"按照这种说法，为什么一个住在林肯郡、开车出行的退休老人，非得补贴一名来自萨里郡的股票经纪人的日常通勤呢？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T1-P2-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Equally, there is a sense that the travails of commuters in the South East, many of whom will face among the biggest rises, have received too much attention compared to those who must endure the relatively poor infrastructure of the Midlands and the North.","core":"there is a sense that the travails ... have received too much attention。","structure":"that 引导同位语从句，解释 a sense；","key":"travails：艰难处境、痛苦和麻烦，语气比普通的 problems 更重。；face a rise：此处 face 作动词，意为“面临（涨价）”。；receive too much attention compared to：与……相比受到过多关注。；endure poor infrastructure：忍受落后的基础设施。","zh":"同样，还有一种看法认为，英格兰东南部通勤者的困境受到了过多关注；他们中许多人将面临幅度最大的几档涨价，相比之下，那些不得不忍受英格兰中部和北部相对落后基础设施的人反而没有得到同等重视。","tip":"compared to those 实际比较的是两地人群受到的关注程度，"},{"id":"2021-T1-P3-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"It is all very well train operators trumpeting the improvements they are making to the network, but passengers should be able to expect a basic level of service for the substantial sums they are now paying to travel.","core":"It is all very well ..., but passengers should be able to expect ... service.","structure":"train operators 是 trumpeting 的逻辑主语；","key":"trumpet：常见义为“小号”；此处作动词，；substantial：此处不是“实质性的”，而是“数额可观的、相当多的”。；It is all very well ... but ...：……固然不错，但……；；a basic level of service：基本服务水准。","zh":"铁路运营商大肆宣扬自己正对铁路网络进行的改善，话虽如此，乘客既然如今花费不菲来乘车，就理应获得基本水准的服务。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T1-P3-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"However, there is a strong case that those who have been worst affected by industrial action should receive compensation for the disruption they have suffered.","core":"there is a strong case that ... should receive compensation。","structure":"that 引导同位语从句，解释 case 的具体内容；","key":"industrial action：劳资关系语境中的“工业行动”，；case：常见义为“案件、情况”；a strong case 此处指“充分理由、有力论据”。；there is a strong case that ...：有充分理由认为……。；be affected by：受到……影响。","zh":"不过，完全有充分理由认为，受罢工行动影响最严重的人应当就其遭受的出行中断获得补偿。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T1-P4-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"The Government has pledged to change the law to introduce a minimum service requirement so that, even when strikes occur, services can continue to operate.","core":"The Government has pledged to change the law.","structure":"to introduce ... 说明修法目的；","key":"pledge to do sth.：承诺做某事。；a minimum service requirement：最低服务要求。；continue to operate：继续运行。","zh":"政府已承诺修改法律，引入最低服务要求，以便即使发生罢工，铁路服务也能继续运行。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T1-P4-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"This should form part of a wider package of measures to address the long-running problems on Britain's railways.","core":"This should form part of a wider package of measures.","structure":"to address ... 作目的状语，说明整套措施要解决什么。","key":"form part of：构成……的一部分。；a package of measures：一揽子措施。；long-running problems：长期存在的问题。","zh":"这项要求应当成为一套更广泛措施的一部分，用来解决英国铁路长期存在的问题。","tip":"This 指前句的最低服务要求，"},{"id":"2021-T1-P4-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also endure cramped, unreliable services, punctuated by regular chaos when timetables are changed, or planned maintenance is managed incompetently.","core":"more investment is needed, but passengers will not be willing to pay more indefinitely。","structure":"if 引导条件从句；","key":"punctuate：常见义为“给文字加标点”；；indefinitely：无限期地、没有止境地。；be willing to pay more：愿意支付更多。；cramped, unreliable services：拥挤且不可靠的服务。","zh":"没错，铁路需要更多投资；但如果乘客还必须忍受拥挤而不可靠的服务，并在时刻表变更或计划检修管理不善时一再遭遇混乱，他们就不会愿意无休止地支付更高票价。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T1-P4-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"The threat of nationalisation may have been seen off for now, but it will return with a vengeance if the justified anger of passengers is not addressed in short order.","core":"The threat ... may have been seen off, but it will return.","structure":"may have been seen off 表示对过去情况的保留推测；","key":"see off：常见义为“送行”；此处意为“击退、暂时消除（威胁）”。；address：常见义为“地址、致辞”；此处作动词，；the threat of nationalisation：国有化的可能或压力。；return with a vengeance：猛烈卷土重来、以更强势头重新出现。","zh":"国有化的威胁眼下或许已被暂时化解，但如果乘客合情合理的愤怒得不到迅速处理，它必将猛烈卷土重来。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P2-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care.","core":"Indonesia started phasing in a program.","structure":"that gives money ... 修饰 program；","key":"phase in：不是“一次性启动”，而是“分阶段、逐步引入”。；under certain conditions：在特定条件下。；keep kids in school：让孩子继续接受学校教育，避免辍学。；get regular medical care：定期获得医疗照护。","zh":"2007 年，印度尼西亚开始逐步推行一个项目：在满足特定条件的前提下向最贫困居民发放现金，例如要求家长让孩子继续上学或定期接受医疗照护。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P2-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty.","core":"these social assistance programs are designed to reduce inequality and break the cycle of poverty。","structure":"Called ... 是过去分词短语，补充项目名称；","key":"conditional cash transfers (CCTs)：附条件现金转移，；social assistance program：社会援助项目。；break the cycle of poverty：打破贫困循环。","zh":"这类社会援助项目被称为“附条件现金转移”（CCT），旨在减少不平等并打破贫困循环。","tip":"Called 的逻辑主语是 these social assistance programs，"},{"id":"2021-T2-P2-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"In Indonesia, the program has provided enough food and medicine to substantially reduce severe growth problems among children.","core":"the program has provided enough food and medicine。","structure":"enough ... to reduce ... 表示所提供的资源足以产生后面的结果。","key":"growth problems：此处指儿童因营养或健康问题造成的生长发育障碍，；substantially reduce：大幅减少、显著缓解。；severe growth problems among children：儿童严重的生长发育问题。","zh":"在印度尼西亚，该项目提供的食品和药品已经足以大幅减少儿童严重的生长发育问题。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P3-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"In fact, poverty alleviation and environmental protection are often viewed as conflicting goals, says Paul Ferraro, an economist at Johns Hopkins University.","core":"poverty alleviation and environmental protection are often viewed as conflicting goals。","structure":"says Paul Ferraro 是后置报道语；","key":"poverty alleviation：减贫、扶贫。；view A as B：把 A 视为 B。；conflicting goals：相互冲突的目标。","zh":"事实上，约翰斯·霍普金斯大学经济学家保罗·费拉罗指出，扶贫与环境保护往往被视为相互冲突的目标。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P4-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"That's because economic growth can be correlated with environmental degradation, while protecting the environment is sometimes correlated with greater poverty.","core":"economic growth can be correlated with degradation,","structure":"while 连接两种并列而相互映照的相关关系；","key":"be correlated with：与……存在相关性。；environmental degradation：环境恶化、环境退化。","zh":"这是因为经济增长可能与环境恶化相关，而保护环境有时又与更严重的贫困相关。","tip":"be correlated with 只表示变量共同变化，"},{"id":"2021-T2-P4-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"However, those correlations don't prove cause and effect.","core":"those correlations don't prove cause and effect。","structure":"见原句","key":"prove cause and effect：证明因果关系。","zh":"然而，这些相关性并不能证明因果关系。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P4-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"The only previous study analyzing causality, based on an area in Mexico that had instituted CCTs, supported the traditional view.","core":"The only previous study supported the traditional view.","structure":"analyzing causality 修饰 study；","key":"institute：常见义为“机构”；此处作动词，意为“建立、实施（制度或项目）”。；analyze causality：分析因果关系。；be based on an area：以某一地区为研究基础。；support the traditional view：支持传统观点。","zh":"此前唯一一项分析因果关系的研究以墨西哥一个已实施 CCT 的地区为基础，其结果支持了上述传统观点。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P4-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"There, as people got more money, some of them may have more cleared land for cattle to raise for meat, Ferraro says.","core":"some of them may have more cleared land。","structure":"as people got more money 表示伴随变化或原因背景；","key":"clear land：清除土地上的森林或植被，以便改作农业或牧业用途。；raise cattle for meat：饲养肉牛。","zh":"费拉罗说，在那里，随着人们获得更多资金，其中一些人可能清理了更多土地，用来饲养肉牛。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P5-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Such programs do not have to negatively affect the environment, though.","core":"Such programs do not have to negatively affect the environment.","structure":"见原句","key":"do not have to：不一定、并非必然，不是“不必”这么简单。；negatively affect：对……产生负面影响。","zh":"不过，这类项目并非一定会对环境产生负面影响。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P5-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Ferraro wanted to see if Indonesia's poverty-alleviation program was affecting deforestation.","core":"Ferraro wanted to see ...。","structure":"if 引导宾语从句，意为“是否”，","key":"poverty-alleviation program：扶贫项目。；affect deforestation：影响森林砍伐。","zh":"费拉罗希望查明，印度尼西亚的扶贫项目是否正在影响森林砍伐。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P5-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Indonesia has the third-largest area of tropical forest in the world and one of the highest deforestation rates.","core":"Indonesia has the third-largest area ... and one of the highest rates.","structure":"见原句","key":"the third-largest area of tropical forest：第三大的热带森林面积。；one of the highest deforestation rates：最高的森林砍伐率之一。","zh":"印度尼西亚拥有世界第三大热带森林面积，其森林砍伐率也位居全球最高之列。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P6-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Ferraro analyzed satellite data showing annual forest loss from 2008 to 2012—including during Indonesia's phase-in of the antipoverty program—in 7,468 forested villages across 15 provinces.","core":"Ferraro analyzed satellite data.","structure":"showing annual forest loss 修饰 data；","key":"satellite data：卫星数据。；annual forest loss：年度森林损失。；phase-in：逐步推行、分阶段实施的时期。；forested village：位于森林地区或拥有森林覆盖的村庄。","zh":"费拉罗分析了 2008 至 2012 年的卫星数据，数据覆盖 15 个省的 7,468 个森林村庄，其中也包括印度尼西亚逐步推行扶贫项目的时期，用以显示年度森林损失。","tip":"from 2008 to 2012 修饰森林损失数据的时间跨度，"},{"id":"2021-T2-P6-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"\"We see that the program is associated with a 30 percent reduction in deforestation,\" Ferraro says.","core":"the program is associated with a 30 percent reduction。","structure":"in deforestation 说明减少的对象；","key":"be associated with：与……相关联。；a 30 percent reduction in：……减少 30%。","zh":"费拉罗说：“我们发现，该项目与森林砍伐量减少 30% 存在关联。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P7-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"That's likely because the rural poor are using the money as makeshift insurance policies against inclement weather, Ferraro says.","core":"the rural poor are using the money as makeshift insurance policies。","structure":"That's likely because ... 解释上一段“砍伐减少 30%”的原因；","key":"makeshift：临时凑合的、权宜的；；inclement：尤指天气恶劣的、严酷的。；the rural poor：农村贫困人口，the + 形容词 表示一类人。；use A as B：把 A 当作 B 使用。","zh":"费拉罗说，这很可能是因为农村贫困人口把这笔钱当作一种临时保险，用来抵御恶劣天气带来的风险。","tip":"That 指项目与森林砍伐减少之间的关联，"},{"id":"2021-T2-P7-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Typically, if rains are delayed, people may clear land to plant more rice to supplement their harvests.","core":"people may clear land。","structure":"if 引导条件从句；","key":"rains are delayed：降雨或雨季推迟。；clear land to plant：清理土地用于种植。；supplement one's harvest：补充收成、弥补产量不足。","zh":"通常，如果雨季推迟，人们可能会清理土地、种植更多水稻，以补充原有收成。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P8-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Whether this research translates elsewhere is anybody's guess.","core":"Whether ... translates elsewhere is anybody's guess.","structure":"Whether 引导主语从句；","key":"translate：常见义为“翻译”；此处意为研究结论；be anybody's guess：谁也说不准、尚无定论。","zh":"这项研究的结论能否适用于其他地方，谁也说不准。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P8-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Ferraro suggests the results may transfer to other parts of Asia, due to commonalities such as the importance of growing rice and market access.","core":"Ferraro suggests the results may transfer to other parts of Asia.","structure":"due to ... 说明可能迁移的依据；","key":"transfer：此处指研究结果“可迁移、可推广”，不是转账或调职。；commonality：共同特征、共通点。；due to：由于。；the importance of growing rice：水稻种植的重要性。","zh":"费拉罗认为，由于其他亚洲地区也具有一些共同点，例如水稻种植的重要性和市场准入条件，这些结果或许可以推广过去。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P8-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"And regardless of transferability, the study shows that what's good for people may also be good for the environment.","core":"the study shows that ...。","structure":"regardless of transferability 是让步性介词短语；","key":"regardless of：不论、不受……影响。；transferability：可迁移性、研究结果推广到其他情境的能力。；what's good for people：对人有益的事物；what 从句作主语。","zh":"而且，无论研究结果能否推广，这项研究都表明，有益于民生的事情也可能有益于环境。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T2-P8-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"Even if this program didn't reduce poverty, Ferraro says, \"the value of the avoided deforestation just for carbon dioxide emissions alone is more than the program costs.\"","core":"引语主干为 the value ... is more than the program costs。","structure":"Even if 引导让步状语从句；","key":"avoided deforestation：因项目而避免的森林砍伐。；carbon dioxide emissions：二氧化碳排放。；be more than the program costs：超过项目成本。；phase in a program：逐步推行一个项目。","zh":"费拉罗说：“即便这个项目没有减少贫困，仅从二氧化碳排放这一项来看，避免森林砍伐所产生的价值也超过了项目成本。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T3-P1-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"As a historian who's always searching for the text or the image that makes us re-evaluate the past, I've become preoccupied with looking for photographs that show our Victorian ancestors smiling (what better way to shatter the image of 19th-century prudery?).","core":"I've become preoccupied with looking for photographs.","structure":"As a historian 说明身份；","key":"prudery：对礼仪、性或情感表达过度拘谨的态度，；re-evaluate the past：重新评价过去。；become preoccupied with：开始全神贯注于、满脑子想着。；shatter the image of：彻底打破关于……的固有印象。","zh":"身为一名历史学家，我总在寻找能促使我们重新评价过去的文字或图像；如今我开始一门心思搜寻那些展现维多利亚时代祖先面带笑容的照片（还有什么比这更能打破人们对 19 世纪拘谨保守风气的印象呢？）。","tip":"makes 使用单数，"},{"id":"2021-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"I've found quite a few, and—since I started posting them on Twitter—they have been causing quite a stir.","core":"I've found quite a few, and they have been causing quite a stir.","structure":"两个破折号夹住 since 时间从句；","key":"quite a few：相当多，数量并不少。；cause quite a stir：引起不小的轰动或议论。","zh":"我找到了相当多这样的照片；自从开始把它们发到推特上后，这些照片便引起了不小的轰动。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T3-P1-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"People have been surprised to see evidence that Victorians had fun and could, and did, laugh.","core":"People have been surprised to see evidence.","structure":"that 引导同位语从句，说明 evidence 的内容；","key":"be surprised to see evidence that ...：惊讶地看到证据表明……。；could, and did, laugh：不仅会笑，而且的确笑过；","zh":"人们惊讶地看到证据表明，维多利亚人也会享受生活，他们不仅能笑，而且确实会笑。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T3-P1-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that separate us fade away through our common experience of laughter.","core":"They are noting that the Victorians seem to become more human.","structure":"that 引导宾语从句；","key":"human：此处不是生物学意义上的“人类”，；a hundred or so years：一百年左右。；fade away：逐渐消退、淡去。；a common experience of laughter：共同的欢笑体验。","zh":"人们注意到，随着横亘在我们与维多利亚人之间的一百来年在共同的欢笑体验中逐渐淡去，维多利亚人突然显得更有人情味了。","tip":"They 指前句的 People；"},{"id":"2021-T3-P2-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Of course, I need to concede that my collection of 'Smiling Victorians' makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance.","core":"I need to concede that my collection makes up only a tiny percentage.","structure":"that 引导宾语从句；","key":"concede：承认一个对己方论点不利或需要限定的事实。；sitter：此处不是“坐着的人”的普通描述，；middle distance：画面或视野中的中景。；make up a tiny percentage of：只占……很小比例。","zh":"当然，我必须承认，我收集的“微笑的维多利亚人”只占 1840 至 1900 年间庞大肖像摄影作品目录中的极小一部分；其中绝大多数照片里，被摄者不是在绘制的背景幕前痛苦而僵硬地摆姿势，就是茫然地望向中景。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T3-P3-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"During the 1840s and 1850s, in the early days of photography, exposure times were notoriously long: the daguerreotype photographic method (producing an image on a silvered copper plate) could take several minutes to complete, resulting in blurred images as sitters shifted position or adjusted their limbs.","core":"exposure times were notoriously long:","structure":"冒号后解释曝光为何漫长；","key":"exposure：常见义为“暴露”；摄影语境中指感光材料接受光线的“曝光”。；notoriously：因某种负面特征而出名地，此处强调曝光时间长是公认问题。；daguerreotype：银版摄影法，早期把图像记录在镀银铜板上的摄影工艺。；a silvered copper plate：镀银铜板。","zh":"在 19 世纪 40 和 50 年代摄影术发展的早期，曝光时间长得出了名：银版摄影法把图像制作在镀银铜板上，完成一次拍摄可能需要数分钟；被摄者只要移动身体或调整四肢，最终图像就会模糊。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T3-P3-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"The thought of holding a fixed grin as the camera performed its magical duties was too much to contemplate, and so a non-committal blank stare became the norm.","core":"The thought ... was too much to contemplate,","structure":"of holding ... 修饰 The thought；","key":"non-committal：不明确表态或不流露态度的；；the norm：常态、通行做法。；hold a fixed grin：长时间保持固定笑容。；be too much to contemplate：难以设想、让人不敢想象。","zh":"在相机施展“魔法”的漫长过程中始终保持固定笑容，实在令人难以想象，于是，不表露明确情绪的空洞凝视成了常态。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T3-P4-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other portable cameras meant that, though slow by today's digital standards, the exposure was almost instantaneous.","core":"exposure times were quicker, and the introduction ... meant that the exposure was instantaneous.","structure":"though slow by ... 是让步省略结构，","key":"instantaneous：几乎在瞬间完成的、即时的。；portable camera：便携式相机。；by today's digital standards：按照今天的数码技术标准。；the introduction of：……的引入、问世。","zh":"但到了 19 世纪 80 年代，曝光时间已经大幅缩短；盒式布朗尼相机和其他便携相机的出现意味着，尽管按今天的数码标准仍显缓慢，当时的曝光已近乎瞬间完成。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T3-P4-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Spontaneous smiles were relatively easy to capture by the 1890s, so we must look elsewhere for an explanation of why Victorians still hesitated to smile.","core":"Smiles were easy to capture, so we must look elsewhere.","structure":"why Victorians still hesitated to smile","key":"spontaneous smile：自然流露、未经刻意保持的笑容。；be easy to capture：容易被相机捕捉。；look elsewhere for an explanation：到别处寻找解释。；hesitate to do sth.：迟疑、不愿做某事。","zh":"到了 19 世纪 90 年代，自然流露的笑容已经比较容易捕捉，因此，我们必须从别处寻找维多利亚人仍不愿微笑的原因。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T3-P5-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"\"Nature gave us lips to conceal our teeth,\" ran one popular Victorian maxim, alluding to the fact that before the birth of proper dentistry, mouths were often in a shocking state of hygiene.","core":"倒装还原为 one popular Victorian maxim ran, “...”。","structure":"直接引语前置；","key":"run：常见义为“跑”；在 a maxim runs ... 中意为；the birth of：此处指一种技术或制度的“诞生、出现”。；conceal one's teeth：遮住牙齿。；allude to the fact that：暗指……这一事实。","zh":"维多利亚时代有一句流行格言：“大自然赐予我们双唇，是为了遮住牙齿。”这句话暗指，在正规的牙科医学出现以前，人们口腔的卫生状况往往糟糕得惊人。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T3-P5-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"A flashing set of healthy and clean, regular 'pearly whites' was a rare sight in Victorian society, the preserve of the super-rich (and even then, dental hygiene was not guaranteed).","core":"A flashing set of ... teeth was a rare sight.","structure":"the preserve of the super-rich 是同位语，","key":"pearly whites：对白而整齐牙齿的非正式称呼。；preserve：常见义为“保护、保存”；；a rare sight：罕见景象。；the super-rich：超级富豪群体。","zh":"在维多利亚社会，一口健康洁净、整齐闪亮的“珍珠白牙”非常罕见，几乎是超级富豪的专属（即便对他们而言，良好的牙齿卫生也并无保证）。","tip":"regular 在这里指牙齿“整齐的、排列匀称的”，"},{"id":"2021-T3-P6-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"A toothy grin (especially when there were gaps or blackened gnashers) lacked class: drunks, tramps, and music hall performers might gurn and grin with a smile as wide as Lewis Carroll's gum-exposing Cheshire Cat, but it was not a becoming look for properly bred persons.","core":"A toothy grin lacked class:","structure":"括号说明牙齿不佳时情况更明显；","key":"gnashers：口语中的“牙齿”，此处带戏谑色彩。；gurn：做夸张难看的鬼脸、扭曲面部。；becoming：常见义为“正在成为”；此处作形容词，；a toothy grin：露出很多牙齿的咧嘴笑。","zh":"露齿而笑显得没有格调，尤其当牙齿有缺口或已经发黑时：醉汉、流浪汉和音乐厅演员或许会挤眉弄眼、咧嘴大笑，笑得像刘易斯·卡罗尔笔下露着牙龈的柴郡猫一样夸张；但对教养良好的人而言，这并不是得体的表情。","tip":"it 指前述露齿咧嘴笑这一表情，"},{"id":"2021-T3-P6-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Even Mark Twain, a man who enjoyed a hearty laugh, said that when it came to photographic portraits there could be \"nothing more damning than a silly, foolish smile fixed forever\".","core":"Mark Twain said that there could be nothing more damning than ...","structure":"a man who ... 是同位语；","key":"damning：具有强烈负面评价、严重损害名声或形象的。；fixed：此处指表情被照片“定格”，不是“修理好的”。；a hearty laugh：开怀大笑。；when it comes to：谈到、涉及……时。","zh":"就连爱开怀大笑的马克·吐温也说，谈到肖像照片，“没有什么比一个愚蠢可笑的笑容被永久定格更有损形象了”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P1-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"From the early days of broadband, advocates for consumers and web-based companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals'.","core":"advocates worried that the cable and phone companies had the power and incentive。","structure":"selling broadband connections 修饰 companies；","key":"advocate：此处作名词，指“倡导者、权益维护者”。；affiliated：有关联的、隶属同一集团的。；favor A over B：偏袒 A 而不利于 B。；web-based company：以互联网为基础开展业务的公司。","zh":"从宽带发展的早期开始，消费者和互联网企业的权益倡导者就担心，销售宽带连接的有线电视和电话公司既有能力也有动机偏袒与自己有关联的网站，压过竞争对手的网站。","tip":"their rivals' 省略了 websites，"},{"id":"2021-T4-P1-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"That's why there has been such a strong demand for rules that would prevent broadband providers from picking winners and losers online, preserving the freedom and innovation that have been the lifeblood of the Internet.","core":"there has been a strong demand for rules。","structure":"that would prevent ... 修饰 rules；","key":"pick winners and losers：不是字面“选择比赛胜负者”，；lifeblood：维持某事物活力和生存的关键，即“命脉”。；a strong demand for rules：对制定规则的强烈诉求。；prevent sb. from doing sth.：阻止某人做某事。","zh":"正因如此，人们强烈要求制定规则，阻止宽带服务商在网络上挑选赢家和输家，从而维护一直作为互联网命脉的自由与创新。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P2-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Yet that demand has been almost impossible to fill—in part because of pushback from broadband providers, anti-regulatory conservatives and the courts.","core":"that demand has been almost impossible to fill。","structure":"破折号后说明部分原因；","key":"fill a demand：满足一项诉求；不是“填满需求”的字面动作。；pushback：抵制、反弹。；anti-regulatory：反对或削弱监管的。；in part because of：部分因为……。","zh":"然而，这一诉求几乎不可能实现，部分原因在于宽带服务商、反监管保守派和法院的抵制。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P2-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"A federal appeals court weighed in again Tuesday, but instead of providing a badly needed resolution, it only prolonged the fight.","core":"A federal appeals court weighed in again, but it only prolonged the fight.","structure":"instead of providing ... 作介词短语，说明法院没有实现的预期；","key":"weigh in：介入争论并发表意见或作出裁决。；resolution：此处指争议的解决方案，不是普通的“决心”。；prolong the fight：延长争斗或争议。；instead of doing sth.：没有做某事，反而……。","zh":"一家联邦上诉法院周二再次介入，但它没有提供急需的解决方案，反而只是让这场斗争拖得更久。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P2-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"At issue before the U.S. Court of Appeals for the District of Columbia Circuit was the latest take of the Federal Communications Commission (FCC) on net neutrality, adopted on a party-line vote in 2017.","core":"the latest take of the FCC on net neutrality was at issue。","structure":"句首 At issue ... 前置造成倒装；","key":"take：常见义为“拿、取”；the latest take on 此处指“最新立场或处理方式”。；party-line：按党派立场的，而非跨党派共识。；at issue：争议焦点、待裁决的问题。；on a party-line vote：按党派立场投票。","zh":"摆在美国哥伦比亚特区联邦上诉法院面前的，是联邦通信委员会（FCC）对网络中立的最新立场；该立场于 2017 年按党派立场投票通过。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P2-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a Democratic majority in 2015, but rejected the commission's authority to require broadband providers to do much of anything.","core":"The order not only eliminated ..., but rejected the commission's authority.","structure":"the FCC had adopted ... 修饰 rules；","key":"penned：常见义为“用笔写”；Republican-penned 指“由共和党人起草的”。；authority：此处指法定权限、监管权力。；not only ... but ...：不仅……而且……。；do much of anything：采取多少实质行动；常带否定语气。","zh":"这份由共和党人起草的命令不仅取消了 FCC 在 2015 年民主党占多数时制定的严格网络中立规则，还否定了委员会要求宽带服务商采取实质行动的权力。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P2-S05","sec":"text4","sec_label":"Text 4","level":3,"en":"The order also declared that state and local governments couldn't regulate broadband providers either.","core":"The order declared that governments couldn't regulate providers.","structure":"that 引导宾语从句；either 与否定词 couldn't 呼应。","key":"state and local governments：州政府和地方政府。；either：用于否定句中表示“也、同样”。","zh":"该命令还宣布，州和地方政府同样不能监管宽带服务商。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P3-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&T favoring its own video-streaming service at the expense of Netflix and Apple TV.","core":"The commission argued that other agencies would protect against behavior.","structure":"that 引导宾语从句；","key":"conglomerate：由多种业务或多家公司组成的“大型企业集团”。；at the expense of：以牺牲……的利益为代价。；protect against anti-competitive behavior：防止反竞争行为。；broadband-providing：提供宽带服务的。","zh":"委员会辩称，其他机构会防止反竞争行为；例如，像 AT&T 这样提供宽带的企业集团可能偏袒自家视频流媒体服务，以牺牲 Netflix 和 Apple TV 的利益为代价。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P3-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Yet the FCC also ended the investigations of broadband providers that imposed data caps on their rivals' streaming services but not their own.","core":"the FCC ended the investigations of broadband providers。","structure":"that 引导定语从句，说明被调查服务商的具体行为；","key":"end an investigation of：终止对……的调查。；impose a data cap on：对……设置数据使用上限。；their rivals' services but not their own：限制竞争对手的服务，却不限制自家服务。","zh":"然而，FCC 同时终止了对一些宽带服务商的调查；这些服务商给竞争对手的流媒体服务设置数据上限，却不给自家服务设置同样限制。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P4-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"On Tuesday, the appeals court unanimously upheld the 2017 order deregulating broadband providers, citing a Supreme Court ruling from 2005 that upheld a similarly deregulatory move.","core":"the appeals court upheld the 2017 order。","structure":"deregulating broadband providers 修饰 order；","key":"uphold：法院“维持、确认”原裁决或命令有效。；deregulatory：放松或取消监管的。；unanimously uphold：一致裁定维持。；cite a ruling：援引一项裁决。","zh":"周二，上诉法院一致维持了 2017 年解除宽带服务商监管的命令，并援引最高法院 2005 年的一项裁决；该裁决曾支持一项类似的放松监管举措。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P4-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"But Judge Patricia Millett rightly argued in a concurring opinion that \"the result is unhinged from the realities of modern broadband service,\" and said Congress or the Supreme Court could intervene to \"avoid trapping Internet regulation in technological anachronism.\"","core":"Judge Millett argued that ..., and said Congress or the Supreme Court could intervene.","structure":"argued 和 said 并列；","key":"unhinged from：字面有“脱离铰链”之意；；anachronism：时代错置、与当前时代不相称的陈旧事物。；a concurring opinion：协同意见，；be unhinged from reality：脱离现实。","zh":"但帕特里夏·米利特法官在协同意见中正确地指出，“这一结果脱离了现代宽带服务的现实”；她还说，国会或最高法院可以介入，“避免让互联网监管困在技术时代错位之中”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P5-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"In the meantime, the court threw out the FCC's attempt to block all state rules on net neutrality, while preserving the commission's power to preempt individual state laws that undermine its order.","core":"the court threw out the attempt, while preserving the power。","structure":"to block ... 修饰 attempt；","key":"throw out：此处是法律语境中的“驳回、判定无效”。；preempt：以更高层级权力排除、先行取代某项法律。；undermine：削弱……的效力或权威。；block all state rules：阻止所有州级规则。","zh":"与此同时，法院驳回了 FCC 试图封堵所有州级网络中立规则的做法，但保留了委员会排除个别州法律的权力，前提是这些州法会削弱其命令。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P5-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"That means more battles like the one now going on between the Justice Department and California, which enacted a tough net neutrality law in the wake of the FCC's abdication.","core":"That means more battles like the one.","structure":"now going on ... 修饰 the one，即当前争斗；","key":"abdication：本义为君主“退位”；；the Justice Department：美国司法部。；enact a tough law：制定一部严格的法律。；in the wake of：紧随……之后；作为……的后果。","zh":"这意味着还会出现更多类似当前司法部与加利福尼亚州之间的争斗；在 FCC 放弃监管职责后，加州制定了一部严格的网络中立法。","tip":"That 指前句法院留下的联邦与州监管并存格局，"},{"id":"2021-T4-P6-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The endless legal battles and back-and-forth at the FCC cry out for Congress to act.","core":"The battles and back-and-forth cry out for Congress to act.","structure":"并列主语 battles and back-and-forth","key":"back-and-forth：来回反复、政策摇摆或拉锯。；cry out for：迫切需要、强烈要求，并非字面“哭喊”。；endless legal battles：没完没了的法律争斗。；Congress to act：由国会采取行动。","zh":"没完没了的法律争斗和 FCC 内部反复摇摆的政策，迫切要求国会采取行动。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2021-T4-P6-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting openness and innovation online.","core":"It needs to give the commission authority and to create clear rules.","structure":"It 指 Congress；","key":"meddle in：不当地干预、插手。；traffic：此处指网络数据流量，不是道路交通。；explicit authority：明确的法定权力。；once and for all：一劳永逸地、彻底地。","zh":"国会需要一劳永逸地赋予委员会明确权力，禁止宽带服务商干预其网络上的数据流量，并制定保护网络开放与创新的清晰规则。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"}]};</script>

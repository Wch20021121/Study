。","forms":["be based on file uploads"]},{"w":"lost revenue","pos":"phr.","cn":"损失的收入。","sec":"text3","sec_label":"Text 3","ctx":"But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates","note":"损失的收入。","forms":["lost revenue"]},{"w":"global impact","pos":"phr.","cn":"结合上句语境，具体指全球经济损失，而不是笼统的社会影响。","sec":"text3","sec_label":"Text 3","ctx":"The global impact is about $71 billion annually.","note":"结合上句语境，具体指全球经济损失，而不是笼统的社会影响。","forms":["global impact"]},{"w":"mom and pop operations","pos":"phr.","cn":"夫妻或家庭经营的小型企业，此处泛指零散、规模很小的盗版者。","sec":"text3","sec_label":"Text 3","ctx":"“The people who are stealing our movies and our television shows and operating piracy sites are not mom and pop operations,” says Charlie Rivkin, chief executive officer ","note":"夫妻或家庭经营的小型企业，此处泛指零散、规模很小的盗版者。","forms":["mom and pop operations"]},{"w":"organized crime","pos":"phr.","cn":"有组织犯罪，强调盗版网站背后存在规模化、协同化运作。","sec":"text3","sec_label":"Text 3","ctx":"“This is organized crime.”","note":"有组织犯罪，强调盗版网站背后存在规模化、协同化运作。","forms":["organized crime"]},{"w":"build consensus","pos":"phr.","cn":"凝聚共识、促成各方达成一致。","sec":"text3","sec_label":"Text 3","ctx":"Rivkin joined the MPA in 2017 after the organization failed five years earlier to build consensus between Hollywood and Silicon Valley to win passage of legislation in Co","note":"凝聚共识、促成各方达成一致。","forms":["build consensus"]},{"w":"win passage of legislation","pos":"phr.","cn":"争取使一项法案获得通过；passage 此处不是“文章段落”。","sec":"text3","sec_label":"Text 3","ctx":"Rivkin joined the MPA in 2017 after the organization failed five years earlier to build consensus between Hollywood and Silicon Valley to win passage of legislation in Co","note":"争取使一项法案获得通过；passage 此处不是“文章段落”。","forms":["win passage of legislation"]},{"w":"enforcement task force","pos":"phr.","cn":"专门负责执法行动的工作组。","sec":"text3","sec_label":"Text 3","ctx":"In 2017 the association formed the Alliance for Creativity and Entertainment (ACE), an enforcement task force of about 100 detectives circling the globe to help local aut","note":"专门负责执法行动的工作组。","forms":["enforcement task force"]},{"w":"circle the globe","pos":"phr.","cn":"在世界各地奔走、开展行动。","sec":"text3","sec_label":"Text 3","ctx":"In 2017 the association formed the Alliance for Creativity and Entertainment (ACE), an enforcement task force of about 100 detectives circling the globe to help local aut","note":"在世界各地奔走、开展行动。","forms":["circle the globe"]},{"w":"local authorities","pos":"phr.","cn":"当地执法或政府部门。","sec":"text3","sec_label":"Text 3","ctx":"In 2017 the association formed the Alliance for Creativity and Entertainment (ACE), an enforcement task force of about 100 detectives circling the globe to help local aut","note":"当地执法或政府部门。","forms":["local authorities"]},{"w":"shrink ... to ..., from ...","pos":"phr.","cn":"把……从某一数量减少到另一数量。","sec":"text3","sec_label":"Text 3","ctx":"ACE says it’s helped shrink the number of illegal streaming services in North America to 126, from more than 1,400 in 2018, aided in part by the MPA’s support for a 2020 ","note":"把……从某一数量减少到另一数量。","forms":["shrink ... to ..., from ..."]},{"w":"copyright material","pos":"phr.","cn":"受版权保护的内容。","sec":"text3","sec_label":"Text 3","ctx":"ACE says it’s helped shrink the number of illegal streaming services in North America to 126, from more than 1,400 in 2018, aided in part by the MPA’s support for a 2020 ","note":"受版权保护的内容。","forms":["copyright material"]},{"w":"a serious crime","pos":"phr.","cn":"严重犯罪。","sec":"text3","sec_label":"Text 3","ctx":"ACE says it’s helped shrink the number of illegal streaming services in North America to 126, from more than 1,400 in 2018, aided in part by the MPA’s support for a 2020 ","note":"严重犯罪。","forms":["a serious crime"]},{"w":"cumulative loss","pos":"phr.","cn":"累计损失。","sec":"text3","sec_label":"Text 3","ctx":"Consulting firm Parks Associates predicts that legitimate US streaming services’ cumulative loss from piracy since 2022 will reach $113 billion in the next two years.","note":"累计损失。","forms":["cumulative loss"]},{"w":"loss from piracy","pos":"phr.","cn":"盗版造成的损失。","sec":"text3","sec_label":"Text 3","ctx":"Consulting firm Parks Associates predicts that legitimate US streaming services’ cumulative loss from piracy since 2022 will reach $113 billion in the next two years.","note":"盗版造成的损失。","forms":["loss from piracy"]},{"w":"plateau","pos":"词","cn":"作动词意为“进入平台期、停止增长”，不等于“开始下降”。","sec":"text3","sec_label":"Text 3","ctx":"“While there is some optimism that emerging countermeasures and best practices may see piracy begin to plateau by 2027, there is no consensus among stakeholders as to whe","note":"作动词意为“进入平台期、停止增长”，不等于“开始下降”。","forms":["plateau"]},{"w":"see piracy begin to plateau","pos":"phr.","cn":"这里的 see 表示“促成、见证某种结果出现”，主语是应对措施和最佳实践。","sec":"text3","sec_label":"Text 3","ctx":"“While there is some optimism that emerging countermeasures and best practices may see piracy begin to plateau by 2027, there is no consensus among stakeholders as to whe","note":"这里的 see 表示“促成、见证某种结果出现”，主语是应对措施和最佳实践。","forms":["see piracy begin to plateau"]},{"w":"countermeasure","pos":"词","cn":"应对措施、反制手段。","sec":"text3","sec_label":"Text 3","ctx":"“While there is some optimism that emerging countermeasures and best practices may see piracy begin to plateau by 2027, there is no consensus among stakeholders as to whe","note":"应对措施、反制手段。","forms":["countermeasure"]},{"w":"stakeholder","pos":"词","cn":"利益相关方。","sec":"text3","sec_label":"Text 3","ctx":"“While there is some optimism that emerging countermeasures and best practices may see piracy begin to plateau by 2027, there is no consensus among stakeholders as to whe","note":"利益相关方。","forms":["stakeholder"]},{"w":"as to when","pos":"phr.","cn":"至于何时、关于何时。","sec":"text3","sec_label":"Text 3","ctx":"“While there is some optimism that emerging countermeasures and best practices may see piracy begin to plateau by 2027, there is no consensus among stakeholders as to whe","note":"至于何时、关于何时。","forms":["as to when"]},{"w":"artifact","pos":"词","cn":"人工制品；在历史与档案语境中指承载过去信息的实物资料。","sec":"text4","sec_label":"Text 4","ctx":"Visit any antiques store and you’ll encounter artifacts from the past: photographs, letters, a brochure detailing the Sinclair dinosaur exhibit from the 1964-1965 World’s","note":"人工制品；在历史与档案语境中指承载过去信息的实物资料。","forms":["artifact"]},{"w":"ephemera","pos":"词","cn":"原本只供短期使用、不打算长期保存的印刷品或物件，如传单、票据和宣传册。","sec":"text4","sec_label":"Text 4","ctx":"Visit any antiques store and you’ll encounter artifacts from the past: photographs, letters, a brochure detailing the Sinclair dinosaur exhibit from the 1964-1965 World’s","note":"原本只供短期使用、不打算长期保存的印刷品或物件，如传单、票据和宣传册。","forms":["ephemera"]},{"w":"ephemeral","pos":"adj.","cn":"短暂的、转瞬即逝的；与上句名词 ephemera 构成词形复现和语义反转。","sec":"text4","sec_label":"Text 4","ctx":"Yet these objects aren’t truly ephemeral, because they’re still here, decades, even centuries later.","note":"短暂的、转瞬即逝的；与上句名词 ephemera 构成词形复现和语义反转。","forms":["ephemeral"]},{"w":"tangible","pos":"adj.","cn":"可触摸的、有实体形态的；此处与下段的 intangible formats 相对。","sec":"text4","sec_label":"Text 4","ctx":"Because they’re tangible.","note":"可触摸的、有实体形态的；此处与下段的 intangible formats 相对。","forms":["tangible"]},{"w":"life cycle","pos":"phr.","cn":"此处指数字格式从产生、使用到过时失效的完整周期。","sec":"text4","sec_label":"Text 4","ctx":"Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preser","note":"此处指数字格式从产生、使用到过时失效的完整周期。","forms":["life cycle"]},{"w":"make provision for","pos":"phr.","cn":"为……预先安排或采取准备措施。","sec":"text4","sec_label":"Text 4","ctx":"Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preser","note":"为……预先安排或采取准备措施。","forms":["make provision for"]},{"w":"we’ve known what we’ve known","pos":"phr.","cn":"并非无意义重复，而是强调人类既有的历史知识依赖幸存实物。","sec":"text4","sec_label":"Text 4","ctx":"For millennia, we’ve known what we’ve known due to artifacts that have survived, often despite their original creators’ neglect.","note":"并非无意义重复，而是强调人类既有的历史知识依赖幸存实物。","forms":["we’ve known what we’ve known"]},{"w":"medium","pos":"词","cn":"信息的载体、媒介；media 是其复数形式之一。","sec":"text4","sec_label":"Text 4","ctx":"The thing itself is the medium that delivers the information.","note":"信息的载体、媒介；media 是其复数形式之一。","forms":["medium"]},{"w":"intentional preservation","pos":"phr.","cn":"有意识、有计划的保存。","sec":"text4","sec_label":"Text 4","ctx":"At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biog","note":"有意识、有计划的保存。","forms":["intentional preservation"]},{"w":"analog materials","pos":"phr.","cn":"模拟材料，指纸张、胶片等以实体形式连续记录信息的材料。","sec":"text4","sec_label":"Text 4","ctx":"At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biog","note":"模拟材料，指纸张、胶片等以实体形式连续记录信息的材料。","forms":["analog materials"]},{"w":"serve as","pos":"phr.","cn":"充当、用作。","sec":"text4","sec_label":"Text 4","ctx":"At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biog","note":"充当、用作。","forms":["serve as"]},{"w":"shoulder","pos":"词","cn":"常见义为“肩膀”，此处作动词，意为“承担、肩负”。","sec":"text4","sec_label":"Text 4","ctx":"Libraries and archives have traditionally shouldered the responsibility of organization, preservation, and access to information.","note":"常见义为“肩膀”，此处作动词，意为“承担、肩负”。","forms":["shoulder"]},{"w":"access to information","pos":"phr.","cn":"信息的获取与利用；access 在这里是名词。","sec":"text4","sec_label":"Text 4","ctx":"Libraries and archives have traditionally shouldered the responsibility of organization, preservation, and access to information.","note":"信息的获取与利用；access 在这里是名词。","forms":["access to information"]},{"w":"holdings","pos":"词","cn":"图书馆、档案馆或博物馆所收藏的资料，即“馆藏”。","sec":"text4","sec_label":"Text 4","ctx":"Thus, librarians digitize the tangible so that researchers the world over can quickly search and access their holdings.","note":"图书馆、档案馆或博物馆所收藏的资料，即“馆藏”。","forms":["holdings"]},{"w":"the world over","pos":"phr.","cn":"遍及全世界、世界各地。","sec":"text4","sec_label":"Text 4","ctx":"Thus, librarians digitize the tangible so that researchers the world over can quickly search and access their holdings.","note":"遍及全世界、世界各地。","forms":["the world over"]},{"w":"an embarrassment of riches","pos":"phr.","cn":"好东西多到难以选择，即“多得令人应接不暇”，不是“财富带来的羞耻”。","sec":"text4","sec_label":"Text 4","ctx":"The result is an embarrassment of historical riches, which brings its own needle-and-haystack problems.","note":"好东西多到难以选择，即“多得令人应接不暇”，不是“财富带来的羞耻”。","forms":["an embarrassment of riches"]},{"w":"needle-and-haystack problems","pos":"phr.","cn":"在海量信息中寻找特定资料的“大海捞针”难题。","sec":"text4","sec_label":"Text 4","ctx":"The result is an embarrassment of historical riches, which brings its own needle-and-haystack problems.","note":"在海量信息中寻找特定资料的“大海捞针”难题。","forms":["needle-and-haystack problems"]},{"w":"act against us","pos":"phr.","cn":"产生对我们不利的效果；us 指作者所属的图书馆员群体。","sec":"text4","sec_label":"Text 4","ctx":"Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libr","note":"产生对我们不利的效果；us 指作者所属的图书馆员群体。","forms":["act against us"]},{"w":"universality of access","pos":"phr.","cn":"信息获取的普遍可达性，即人们似乎随时随地都能取得信息。","sec":"text4","sec_label":"Text 4","ctx":"Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libr","note":"信息获取的普遍可达性，即人们似乎随时随地都能取得信息。","forms":["universality of access"]},{"w":"vital","pos":"adj.","cn":"至关重要的、不可或缺的。","sec":"text4","sec_label":"Text 4","ctx":"Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libr","note":"至关重要的、不可或缺的。","forms":["vital"]},{"w":"curate","pos":"v.","cn":"在档案语境中指依照专业标准选择、组织和管理资料，不只是策划展览。","sec":"text4","sec_label":"Text 4","ctx":"Who curates what is preserved?","note":"在档案语境中指依照专业标准选择、组织和管理资料，不只是策划展览。","forms":["curate"]},{"w":"when it comes to","pos":"phr.","cn":"说到、谈及。","sec":"text4","sec_label":"Text 4","ctx":"When it comes to born-digital information, the terrifying answer can be: if not librarians and archivists, then no one.","note":"说到、谈及。","forms":["when it comes to"]},{"w":"born-digital information","pos":"phr.","cn":"从产生之初就以数字形式存在的信息，而非由实体资料扫描转换而来。","sec":"text4","sec_label":"Text 4","ctx":"When it comes to born-digital information, the terrifying answer can be: if not librarians and archivists, then no one.","note":"从产生之初就以数字形式存在的信息，而非由实体资料扫描转换而来。","forms":["born-digital information"]},{"w":"if not A, then no one","pos":"phr.","cn":"如果不是 A 来做，就无人会做。","sec":"text4","sec_label":"Text 4","ctx":"When it comes to born-digital information, the terrifying answer can be: if not librarians and archivists, then no one.","note":"如果不是 A 来做，就无人会做。","forms":["if not A, then no one"]},{"w":"care","pos":"词","cn":"此处不是“关心”，而是为确保信息持续可读而进行的维护、迁移和管理。","sec":"text4","sec_label":"Text 4","ctx":"Digital information requires a great deal more care than analog.","note":"此处不是“关心”，而是为确保信息持续可读而进行的维护、迁移和管理。","forms":["care"]},{"w":"carrier","pos":"词","cn":"承载数字信息的物理介质，如磁盘或磁带。","sec":"text4","sec_label":"Text 4","ctx":"Even when a digital object is preserved, it may only be the carrier that’s saved, not the information itself.","note":"承载数字信息的物理介质，如磁盘或磁带。","forms":["carrier"]},{"w":"saved","pos":"v./adj.","cn":"此处既有“保存下来”之意，也呼应计算机中的“存储”；载体仍在不等于其中的信息仍可读取。","sec":"text4","sec_label":"Text 4","ctx":"Even when a digital object is preserved, it may only be the carrier that’s saved, not the information itself.","note":"此处既有“保存下来”之意，也呼应计算机中的“存储”；载体仍在不等于其中的信息仍可读取。","forms":["saved"]},{"w":"become obsolete","pos":"phr.","cn":"变得过时、被淘汰。","sec":"text4","sec_label":"Text 4","ctx":"As technology advances and a format becomes obsolete, the object is useless.","note":"变得过时、被淘汰。","forms":["become obsolete"]},{"w":"get the files off","pos":"phr.","cn":"把文件从旧介质中读取、导出，而不是把文件“从上面拿下来”。","sec":"text4","sec_label":"Text 4","ctx":"Have you ever stared helplessly at a ZIP disk, thinking: how do I get the files off this?","note":"把文件从旧介质中读取、导出，而不是把文件“从上面拿下来”。","forms":["get the files off"]},{"w":"ZIP disk","pos":"phr.","cn":"20 世纪 90 年代流行的可移动磁盘，需要专用 ZIP 驱动器读取，后来随硬件和格式淘汰而难以使用。","sec":"text4","sec_label":"Text 4","ctx":"Have you ever stared helplessly at a ZIP disk, thinking: how do I get the files off this?","note":"20 世纪 90 年代流行的可移动磁盘，需要专用 ZIP 驱动器读取，后来随硬件和格式淘汰而难以使用。","forms":["ZIP disk"]},{"w":"migration of digital assets","pos":"phr.","cn":"把数字资料持续转移到新的格式、介质或系统中，以保持其可读取性。","sec":"text4","sec_label":"Text 4","ctx":"Without constant migration of digital assets, a nightmare about the foreseeable future is what keeps historians up at night: a historical record that abruptly stops when ","note":"把数字资料持续转移到新的格式、介质或系统中，以保持其可读取性。","forms":["migration of digital assets"]},{"w":"keep someone up at night","pos":"phr.","cn":"让某人忧心忡忡、夜不能寐。","sec":"text4","sec_label":"Text 4","ctx":"Without constant migration of digital assets, a nightmare about the foreseeable future is what keeps historians up at night: a historical record that abruptly stops when ","note":"让某人忧心忡忡、夜不能寐。","forms":["keep someone up at night"]},{"w":"revolve around","pos":"phr.","cn":"以……为中心、主要围绕……展开。","sec":"text4","sec_label":"Text 4","ctx":"As a librarian whose day job revolves around special collections and digital assets, I share the night terrors of historians, and I’d be lying if I said a comprehensive p","note":"以……为中心、主要围绕……展开。","forms":["revolve around"]},{"w":"I’d be lying if I said ...","pos":"phr.","cn":"委婉而有力地承认某事并不成立，即“要说……存在，那并不真实”。","sec":"text4","sec_label":"Text 4","ctx":"As a librarian whose day job revolves around special collections and digital assets, I share the night terrors of historians, and I’d be lying if I said a comprehensive p","note":"委婉而有力地承认某事并不成立，即“要说……存在，那并不真实”。","forms":["I’d be lying if I said ..."]},{"w":"special collections","pos":"phr.","cn":"图书馆中具有稀缺性、历史价值或特殊载体形式的特藏资料。","sec":"text4","sec_label":"Text 4","ctx":"As a librarian whose day job revolves around special collections and digital assets, I share the night terrors of historians, and I’d be lying if I said a comprehensive p","note":"图书馆中具有稀缺性、历史价值或特殊载体形式的特藏资料。","forms":["special collections"]},{"w":"comprehensive preservation solution","pos":"phr.","cn":"覆盖各种数字格式与长期需求的全面保存方案。","sec":"text4","sec_label":"Text 4","ctx":"As a librarian whose day job revolves around special collections and digital assets, I share the night terrors of historians, and I’d be lying if I said a comprehensive p","note":"覆盖各种数字格式与长期需求的全面保存方案。","forms":["comprehensive preservation solution"]},{"w":"take comfort in","pos":"phr.","cn":"从……中得到安慰。","sec":"text4","sec_label":"Text 4","ctx":"Yet researchers can take some comfort in the fact that there are a multitude of librarians devoted to discovering, organizing, and preserving digital information for rese","note":"从……中得到安慰。","forms":["take comfort in"]},{"w":"a multitude of","pos":"phr.","cn":"大量、众多。","sec":"text4","sec_label":"Text 4","ctx":"Yet researchers can take some comfort in the fact that there are a multitude of librarians devoted to discovering, organizing, and preserving digital information for rese","note":"大量、众多。","forms":["a multitude of"]},{"w":"be devoted to doing","pos":"phr.","cn":"致力于做某事，to 为介词。","sec":"text4","sec_label":"Text 4","ctx":"Yet researchers can take some comfort in the fact that there are a multitude of librarians devoted to discovering, organizing, and preserving digital information for rese","note":"致力于做某事，to 为介词。","forms":["be devoted to doing"]},{"w":"be uniquely positioned to do","pos":"phr.","cn":"因自身角色、经验或资源而特别适合做某事，并非指物理位置。","sec":"text4","sec_label":"Text 4","ctx":"Librarians are uniquely positioned to understand how end users seek and use information.","note":"因自身角色、经验或资源而特别适合做某事，并非指物理位置。","forms":["be uniquely positioned to do"]},{"w":"end users","pos":"phr.","cn":"信息系统或服务的最终使用者。","sec":"text4","sec_label":"Text 4","ctx":"Librarians are uniquely positioned to understand how end users seek and use information.","note":"信息系统或服务的最终使用者。","forms":["end users"]},{"w":"integral","pos":"adj.","cn":"不可或缺的、构成整体所必需的，不是“完整的”。","sec":"text4","sec_label":"Text 4","ctx":"Thus we play an integral role in identifying, preserving, and providing accessibility to digital artifacts so that, while future researchers may find the digital realm a ","note":"不可或缺的、构成整体所必需的，不是“完整的”。","forms":["integral"]},{"w":"ply one’s trade","pos":"phr.","cn":"从事本职工作；此处指研究者开展研究。","sec":"text4","sec_label":"Text 4","ctx":"Thus we play an integral role in identifying, preserving, and providing accessibility to digital artifacts so that, while future researchers may find the digital realm a ","note":"从事本职工作；此处指研究者开展研究。","forms":["ply one’s trade"]},{"w":"provide accessibility to","pos":"phr.","cn":"使……可被获取和利用。","sec":"text4","sec_label":"Text 4","ctx":"Thus we play an integral role in identifying, preserving, and providing accessibility to digital artifacts so that, while future researchers may find the digital realm a ","note":"使……可被获取和利用。","forms":["provide accessibility to"]},{"w":"digital realm","pos":"phr.","cn":"数字领域、数字信息环境。","sec":"text4","sec_label":"Text 4","ctx":"Thus we play an integral role in identifying, preserving, and providing accessibility to digital artifacts so that, while future researchers may find the digital realm a ","note":"数字领域、数字信息环境。","forms":["digital realm"]}],"sentences":[{"id":"2025-T1-P1-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children’s literacy and emotional development.","core":"The grammar school boy ... has landed a scholarly punch.","structure":"from Stratford-upon-Avon 修饰 boy；after 引出原因兼时间背景；research showed that ... 中 that 引导宾语从句。","key":"land a punch：本指“成功击中一拳”，此处借喻莎士比亚的教育价值获得了有力的学术证明。；grammar school boy from Stratford-upon-Avon：以莎士比亚的故乡和少年经历代指莎士比亚本人。；groundbreaking research：开创性的研究。；does benefit：助动词 does 强调“确实有益”，回应人们对莎士比亚教育价值的疑问。","zh":"一项开创性研究表明，莎士比亚确实有助于提升儿童的读写能力和情感发展，这让这位来自埃文河畔斯特拉特福的文法学校少年在学术上“打出了一记重拳”。","tip":"句中真正受益的是 children，而获得学术支持的是被戏称为“文法学校少年”的莎士比亚。"},{"id":"2025-T1-P1-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"But only if you act him out.","core":"这是省略句，完整逻辑为 Shakespeare benefits children only if you act him out.","structure":"见原句","key":"act him out：此处不是单纯“模仿莎士比亚本人”，而是通过扮演其作品中的角色、排演其戏剧来学习。","zh":"但前提是，你得把莎士比亚的作品真正表演出来。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T1-P2-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"A study found that a “rehearsal room” approach to teaching Shakespeare broadened children’s vocabulary and the complexity of their writing as well as their emotional literacy.","core":"A study found that an approach broadened ...","structure":"that 引导宾语从句；to teaching Shakespeare 修饰 approach；children’s vocabulary、the complexity of their writing 与 their emotional literacy 是教学法产生的三方面效果。","key":"rehearsal room approach：借鉴演员排练过程、让学生亲身表演和体验角色的教学法。；emotional literacy：识别、理解并恰当表达情绪的能力，即“情感素养”。；as well as：连接并列成分，此处表示“除了……之外还……”。","zh":"一项研究发现，以“排练室”方式教授莎士比亚，不仅拓展了儿童的词汇量，提升了其写作的复杂程度，也增强了他们的情感素养。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T1-P2-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"“The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,” Jacqui O’Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study, said.","core":"直接引语的主干是 The research shows that ...；全句的引述结构是 Jacqui O’Hanlon ... said.","structure":"第一个 that 引导 shows 的宾语从句；the way actors work 是主语，其中省略关系词 that/in which；the way children use language 与 how they think about themselves 并列作介词 to 的宾语；which commissioned the study 补充说明 RSC。","key":"commission：常见义为“委员会；佣金”，此处作动词，意为“委托开展”。；make a big difference to：对……产生显著影响，并非只表示两者“存在差别”。","zh":"委托开展这项研究的皇家莎士比亚剧团（RSC）的杰姬·奥汉隆说：“研究表明，演员的工作方式会显著影响儿童运用语言的方式，也会影响他们如何看待自己。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T1-P3-S05","sec":"text1","sec_label":"Text 1","level":3,"en":"The randomised control trial involved hundreds of year 5 pupils — aged nine and ten — at 45 state primary schools that had not been “previously exposed to RSC pedagogy.”","core":"The randomised control trial involved hundreds of year 5 pupils.","structure":"破折号间的 aged nine and ten 补充学生年龄；at 45 state primary schools 说明样本来源；that had not been ... 修饰 schools，实际说明这些学校此前未采用 RSC 教学法。","key":"randomised control trial：随机对照试验，通过随机分组比较干预效果。；be exposed to：接触、经历；此处不含“暴露于危险”的负面意味。；pedagogy：教学法、教育方法。","zh":"这项随机对照试验涉及 45 所公立小学的数百名五年级学生，他们年龄为九至十岁，此前从未接触过皇家莎士比亚剧团的教学法。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T1-P3-S06","sec":"text1","sec_label":"Text 1","level":3,"en":"They were split into target and control groups and asked to write, for example, a message in a bottle as Ferdinand following the shipwreck in *The Tempest*.","core":"They were split ... and (were) asked to write ...","structure":"两个被动谓语由 and 并列；for example 是插入语；as Ferdinand 说明写作者所扮演的身份；following the shipwreck 意为“在海难之后”，修饰写信情境。","key":"target group：此处指接受教学干预的“实验组”，不是市场营销中的“目标群体”。；as Ferdinand：表示“以费迪南德的身份”，体现角色代入，而非“像费迪南德一样”。","zh":"学生被分为实验组和对照组，并被要求完成写作任务，例如以《暴风雨》中遭遇海难后的费迪南德的身份，写一封装在瓶中的信。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T1-P3-S07","sec":"text1","sec_label":"Text 1","level":3,"en":"The target group were given a 30-minute drama-based activity to accompany the passage.","core":"The target group were given an activity.","structure":"to accompany the passage 是不定式短语，说明活动与阅读材料配套；该项额外活动构成实验组与对照组之间的教学变量。","key":"drama-based activity：以戏剧表演为基础的活动。；accompany the passage：与该文本配套进行；这里不是“陪伴文章”。","zh":"实验组还围绕这段文本参加了一项 30 分钟的戏剧活动。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T1-P4-S08","sec":"text1","sec_label":"Text 1","level":3,"en":"The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words “classed as more sophisticated or rarer”, and wrote at greater length.","core":"The results showed that ...","structure":"that 从句中，drew on、used 和 wrote 是以 the target group of pupils 为共同主语的三个并列谓语，依次呈现词汇范围、用词难度和写作长度三项结果。","key":"peer-reviewed：经过同行评审的。；draw on a wider vocabulary：调动、运用更广泛的词汇。；at greater length：以更长篇幅、更充分地。","zh":"经同行评审的结果显示，实验组学生使用的词汇范围更广，会采用“被归为更复杂或更少见”的词语，而且写作篇幅也更长。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T1-P4-S09","sec":"text1","sec_label":"Text 1","level":3,"en":"They also “appear to be more comfortable writing in role...while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character’s emotion”.","core":"外层为 They appear to be more comfortable ...；while 从句内是 control pupils imagine ... 与 target children put ... and express ... 的对比。","structure":"how they themselves would react 是 imagine 的宾语从句；to being shipwrecked 中 to 是介词；put 与 express 共用主语 target children。","key":"write in role：以所扮演角色的身份和视角写作。；put oneself in the shoes of：设身处地站在……的立场上。","zh":"实验组学生似乎也“更能自如地以角色身份写作……对照组学生想象的是自己遭遇海难时会作何反应，而实验组儿童则设身处地代入某个文学人物，并表达该人物的情感”。","tip":"they themselves 指对照组学生本人；实验组表达的是文学人物的情绪，而不是只写自己的反应。"},{"id":"2025-T1-P4-S10","sec":"text1","sec_label":"Text 1","level":3,"en":"The *Time to Act* study, which is published by the RSC this week, also found that while control pupils relied on “desert island clichés” such as palm trees, target pupils were “more expansive [giving] a broader picture of the sky, the sea and the atmospheric conditions”.","core":"The study also found that ...","structure":"which is published ... 补充说明研究的发布方与时间；that 从句中，while 对照两组学生：对照组依赖套话，实验组能描绘更广泛的环境信息。","key":"expansive：常见义为“广阔的；健谈的”，此处形容描写内容“铺陈更充分、范围更广”。；desert island clichés：关于荒岛的陈词滥调或刻板意象，并非指“荒漠岛屿”。","zh":"皇家莎士比亚剧团于本周发布的《行动时刻》研究还发现，对照组学生依赖棕榈树之类的“荒岛套话”，而实验组学生的描写则“更加铺陈开阔，[呈现出]天空、海洋和天气状况的更完整画面”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T1-P5-S11","sec":"text1","sec_label":"Text 1","level":3,"en":"O’Hanlon said she had been most surprised by the “emotional literacy that was evident in the [target] children’s writing” and that they were “more resilient in their writing, more hopeful”.","core":"O’Hanlon said (that) ... and that ...","structure":"said 后并列两个宾语从句：一是 she had been most surprised by ...，二是 they were ...；that was evident ... 修饰 emotional literacy。","key":"be evident in：在……中清楚地体现出来。；resilient：有韧性的、能从困境中恢复的；此处形容学生笔下人物面对困境的状态。","zh":"奥汉隆说，最令她惊讶的是“实验组儿童写作中明显体现出的情感素养”，以及他们的文字表现得“更坚韧、更有希望”。","tip":"第二个 that 与前面省略的宾语从句引导词并列，不是修饰 writing 的定语从句。"},{"id":"2025-T1-P5-S12","sec":"text1","sec_label":"Text 1","level":3,"en":"She added “The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way through.","core":"引语内是 The emotional understanding was evident and it is related to the process.","structure":"两个分句由 and 并列；where 引导定语从句，修饰抽象地点式先行词 process；be used to trying 中 to 是介词，后接动名词。","key":"imagine your way through：不是简单“想象出一条路”，而是通过想象进入人物处境，并在头脑中经历整个情境。","zh":"她补充说：“这种情感理解表现得非常明显，它很可能与‘排练室过程’有关；在这一过程中，学生习惯于凭借想象进入并经历整个情境。","tip":"it 指前面的 emotional understanding，不是指研究本身。"},{"id":"2025-T1-P5-S13","sec":"text1","sec_label":"Text 1","level":3,"en":"They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.”","core":"They were comfortable ... and part ... is ...","structure":"and 连接“能够描述情绪”与“戏剧要求角色代入”两层意思；what you do in drama 是 of 的宾语从句；表语位置的 put 与口语表达一致，可理解为 to put。","key":"be comfortable in doing：能够自如、从容地做某事。；put yourself in different shoes：代入不同人物的处境和视角。","zh":"他们能够自如地描述不同的情绪状态，而戏剧活动的一部分，正是让自己站到不同人物的立场上。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T1-P6-S16","sec":"text1","sec_label":"Text 1","level":3,"en":"O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words, gave a “massive expansion of language into children’s lives”, which was combined with children “using their whole bodies to bring words to life”.","core":"O’Hanlon said ... but suggested that Shakespeare’s use ... gave an expansion ...","structure":"said 与 suggested 由 but 连接，既承认仍需研究，又提出判断依据；compared with ... 是插入的比较结构；which was combined with ... 补充说明语言输入与全身参与相结合。","key":"compared with：与……相比；插入句中突出莎士比亚词汇量的优势。；bring words to life：通过动作和表演让词语变得鲜活、可感。；land a scholarly punch：取得有力的学术胜利或获得强有力的研究支持。；make a big difference to：对……产生显著影响。","zh":"奥汉隆说，这还需要更多研究，但她指出，莎士比亚使用约 20,000 个词，而日常用词仅约 2,000 个，这能让儿童生活中的语言得到“大幅拓展”；与此同时，儿童还会“调动整个身体，让词语鲜活起来”。","tip":"which 回指前面的语言大幅拓展这一效果；它与身体参与相结合，而不是说“20,000 个词”本身在使用身体。"},{"id":"2025-T2-P1-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"I was shocked to learn recently that some scientists want to scale back their research in an effort to decrease carbon emissions.","core":"I was shocked to learn that ...","structure":"to learn 说明震惊的原因；that 引导 learn 的宾语从句；in an effort to decrease ... 是目的状语，说明一些科学家缩减研究的动机。","key":"scale back：缩减规模、减少投入，不是按某种比例“放大或缩小”。","zh":"最近得知有些科学家为了减少碳排放而打算缩减研究规模，我深感震惊。","tip":"作者震惊的是科学家“打算减少研究”，并非他们不愿减少碳排放。"},{"id":"2025-T2-P1-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The crisis is here, they said, and we need to cut back on our energy-intensive modelling.","core":"转述内容是 The crisis is here, and we need to cut back ...","structure":"they said 插在两个并列分句之间，表明这是部分科学家的观点，并非作者立场。","key":"cut back on：削减、减少；与上句的 scale back 同义复现。；energy-intensive modelling：需要消耗大量能源的建模运算。","zh":"他们说，危机已经来临，我们必须减少高耗能的建模工作。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T2-P2-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"It is unarguable that our laboratories, scientific instruments, rockets and satellites — the tools we scientists need to measure the planet’s pulse — demand significant amounts of energy both in their construction and operation.","core":"It is unarguable that our laboratories ... demand significant amounts of energy.","structure":"It 是形式主语，that 从句是真正主语；破折号之间的名词短语同位解释前列各类科研工具，其中 we scientists need 是省略关系词的定语从句；both ... and ... 并列两个耗能阶段。","key":"measure the planet’s pulse：字面为“测量地球的脉搏”，此处比喻持续监测地球环境和气候状态。；unarguable：无可争辩的、不容否认的。；both in their construction and operation：在建造和运行两个阶段都……。","zh":"无可争辩的是，我们的实验室、科学仪器、火箭和卫星——这些是科学家监测地球“脉搏”所必需的工具——无论在建造阶段还是运行阶段，都需要消耗大量能源。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T2-P2-S05","sec":"text2","sec_label":"Text 2","level":3,"en":"And it is equally true that science’s unrelenting appetite for information has caused a mushrooming of energy-intensive data centres around the world.","core":"It is equally true that ...","structure":"形式主语结构中，science’s unrelenting appetite for information 是 that 从句的主语；has caused a mushrooming of ... 表示这一需求导致数据中心激增。","key":"appetite：常见义为“食欲”，此处比喻对信息的强烈需求。；mushrooming：像蘑菇般迅速增多，即“激增、涌现”。","zh":"同样不可否认的是，科学对信息永无止境的需求，导致高耗能数据中心在世界各地迅速涌现。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T2-P3-S07","sec":"text2","sec_label":"Text 2","level":3,"en":"However, this is a price we must pay for understanding the world.","core":"This is a price.","structure":"we must pay 是省略关系代词 that/which 的定语从句，修饰 price；for understanding the world 说明付出代价所换取的目标。","key":"price：此处并非货币价格，而是为获得科研认识而承担的能源和碳排放成本。","zh":"然而，这是我们为了认识世界而必须付出的代价。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T2-P3-S08","sec":"text2","sec_label":"Text 2","level":3,"en":"How can we inform decision makers about the best ways to bring down carbon emissions if we can’t track the amount of carbon dioxide in the atmosphere, where it’s coming from and who’s producing it?","core":"How can we inform decision makers ...?","structure":"if 引导条件从句；the amount ...、where ... 和 who ... 并列作 track 的宾语，分别对应排放量、排放来源和排放主体。","key":"inform decision makers about：向决策者提供有关……的信息。；bring down carbon emissions：降低碳排放。；track：持续追踪、监测。","zh":"如果我们无法追踪大气中二氧化碳的总量、来源以及排放者，又怎能向决策者说明减少碳排放的最佳方式呢？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T2-P3-S09","sec":"text2","sec_label":"Text 2","level":3,"en":"The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.","core":"冒号前为 The carbon emissions ... are well spent，冒号后为 this research will safeguard ...。","structure":"见原句","key":"well spent：通常修饰时间或金钱，表示“花得值得”；此处把碳排放视为换取长期收益的一项成本。","zh":"技术研究产生的这些碳排放是值得付出的：归根结底，这类研究将守护我们星球的未来。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T2-P4-S10","sec":"text2","sec_label":"Text 2","level":3,"en":"It can be hard for scientists to make the case because our work is complex, often takes place behind closed doors and does not always lend itself to easy interpretation or explanation.","core":"It can be hard for scientists to make the case.","structure":"It 是形式主语，to make the case 是真正主语；because 从句中，is complex、takes place 和 does not lend itself 是以 our work 为共同主语的三个并列谓语。","key":"make the case：提出充分理由、令人信服地论证，此处指向公众说明科研的价值。；behind closed doors：字面为“在紧闭的门后”，此处指不为公众所见、缺少公开可见性。；lend itself to：适合于、易于接受某种处理。","zh":"科学家有时很难把这一道理讲清楚，因为我们的工作十分复杂，往往在公众视野之外进行，也并不总是容易理解或解释。","tip":"interpretation or explanation 不是科学工作本身不可靠，而是其复杂性使公众不容易理解，也使科学家不容易说明。"},{"id":"2025-T2-P4-S11","sec":"text2","sec_label":"Text 2","level":3,"en":"But demonstrating the efficacy of science will be crucial if we are to solve humanity’s greatest challenges.","core":"Demonstrating the efficacy of science will be crucial.","structure":"动名词短语作主语；if 从句给出目标和必要条件。","key":"efficacy：功效、实际效力，强调能否产生预期结果。；if we are to do：如果我们要做到……；常含“这是实现目标所必需的”意味。","zh":"但如果人类要解决最重大的难题，证明科学确有成效将至关重要。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T2-P4-S12","sec":"text2","sec_label":"Text 2","level":3,"en":"It is all too easy to feel paralysed in the face of daunting problems such as climate change and to do nothing.","core":"It is all too easy to feel ... and to do nothing.","structure":"It 为形式主语，两个并列不定式 to feel 和 to do 是真正主语；in the face of 引出造成无力感的困境。","key":"all too easy：实在太容易发生，常暗示某种令人遗憾的倾向。；paralysed：本义为“瘫痪的”，此处指因恐惧或问题艰巨而无法行动。","zh":"面对气候变化等令人生畏的难题，人很容易陷入无力感，最终什么也不做。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T2-P4-S13","sec":"text2","sec_label":"Text 2","level":3,"en":"But then I think of a friend’s daughter who turned her fears into action: she became a wind energy engineer and now thrives on delivering renewable energy, limiting emissions.","core":"冒号前为 I think of a friend’s daughter，冒号后为 she became ... and now thrives ...。","structure":"who turned ... 修饰 daughter；冒号后的事例说明她采取了什么行动；limiting emissions 补充说明输送可再生能源所产生的结果。","key":"turn one’s fears into action：把恐惧转化为行动。；thrive on doing：因做某事而充满活力、获得成长与满足。","zh":"但这时，我会想到一位朋友的女儿。她把恐惧转化成了行动：她成为一名风能工程师，如今投身于输送可再生能源、限制碳排放，并从中获得成长与满足。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T2-P5-S14","sec":"text2","sec_label":"Text 2","level":3,"en":"Recognising the hope that science and engineering can bring was the impetus behind the creation of the Millennium Technology Prize, which is now entering its 20th year as a celebration of human ingenuity.","core":"Recognising the hope ... was the impetus ...","structure":"动名词 Recognising 引出的短语作主语；that science and engineering can bring 修饰 hope；which 引导非限制性定语从句，修饰 the Millennium Technology Prize。","key":"impetus：推动力、促成某事发生的动力。；enter its 20th year：进入第 20 个年头，并非已经满 20 周年。","zh":"认识到科学与工程能够带来希望，正是设立“千年技术奖”的推动力；如今，该奖项即将迈入第 20 个年头，持续礼赞人类的创造才智。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T2-P5-S15","sec":"text2","sec_label":"Text 2","level":3,"en":"One of the past winners, Professor Martin Green from the University of New South Wales, Australia, is the inventor of the Passivated Emitter and Rear Cell technology which is now found in most of the world’s solar panels.","core":"One of the past winners is the inventor of the technology.","structure":"两个逗号之间是 One of the past winners 的同位语；which is now found ... 修饰 PERC 技术，而不是修饰发明者。","key":"past winner：往届获奖者。；be found in：存在于、应用于；此处表示该技术得到广泛采用。","zh":"该奖项往届得主之一、澳大利亚新南威尔士大学的马丁·格林教授，是“钝化发射极和背面电池”（PERC）技术的发明者；如今，全球大多数太阳能电池板都采用了这项技术。","tip":"格林获奖只是人物背景，例子的论证重点在其发明被广泛应用并产生减排价值。"},{"id":"2025-T2-P6-S17","sec":"text2","sec_label":"Text 2","level":3,"en":"Every day, scientists, technologists and engineers are discovering new ways to exploit renewable energy sources and develop techniques not just to use power more intelligently but to power our intelligence.","core":"Scientists, technologists and engineers are discovering new ways and develop techniques.","structure":"to exploit ... 修饰 ways；not just to use ... but to power ... 是并列不定式，说明所开发技术的双重用途。","key":"exploit：常见义为“剥削”，此处意为“开发、利用（资源）”，不含贬义。；power our intelligence：利用电力驱动承载人类智力活动的计算系统，与前面的 use power more intelligently 构成文字游戏。","zh":"科学家、技术专家和工程师每天都在探索利用可再生能源的新方式，并开发各种技术，不仅让我们更聪明地使用电力，也用电力驱动人类的智能运算。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T2-P6-S18","sec":"text2","sec_label":"Text 2","level":3,"en":"A great example of this is Europe’s largest supercomputer, LUMI in Finland, which is astonishingly carbon-negative.","core":"A great example of this is ... LUMI.","structure":"LUMI in Finland 是 Europe’s largest supercomputer 的同位语；which 引导非限制性定语从句，补充其负碳特征。","key":"carbon-negative：负碳的，即其运行及相关安排所减少或抵消的碳排放超过自身产生的排放。","zh":"这方面的杰出范例是位于芬兰、欧洲规模最大的超级计算机 LUMI；令人惊叹的是，它实现了“负碳排放”。","tip":"this 回指上一句所说的可再生能源利用与可持续计算技术，而不是单指“人类智能”。"},{"id":"2025-T2-P6-S19","sec":"text2","sec_label":"Text 2","level":3,"en":"Established in an old paper mill, it is powered by a nearby river and its remote heat warms the people who live in the surrounding town of Kajaani.","core":"It is powered by a nearby river and its remote heat warms the people.","structure":"Established in an old paper mill 是过去分词短语，补充 LUMI 的设置地点；who live ... 修饰 the people。","key":"be powered by：由……提供动力或电力。；surrounding town：周边城镇。","zh":"LUMI 建在一座旧造纸厂内，由附近河流提供电力，其远程供热还为周边卡亚尼镇的居民送去温暖。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T2-P7-S20","sec":"text2","sec_label":"Text 2","level":3,"en":"If the world is to meet its net-zero ambitions, we must think hard about how we can deliver sustainable computing and deliver more LUMIs.","core":"We must think hard about how ...","structure":"If the world is to ... 给出实现净零目标的条件；how 引导介词 about 的宾语从句；两个 deliver 并列，分别指实现可持续计算和推广 LUMI 模式。","key":"meet its net-zero ambitions：实现其净零排放目标。；deliver sustainable computing：落实、实现可持续计算。；deliver more LUMIs：建设、复制更多 LUMI 式系统，不是“运送更多计算机”。；scale back research：缩减研究规模。","zh":"如果世界要实现净零排放目标，我们就必须认真思考如何推动可持续计算，并建设更多像 LUMI 这样的超级计算机。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T3-P1-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns that the services will never be as profitable as cable once was.","core":"Old Hollywood has struggled to turn a profit in streaming.","structure":"Ever since taking on ... 是时间状语；with + 名词 + 现在分词 构成伴随结构，说明多个平台持续亏损；sparking ... 是结果状语；that 引导 concerns 的同位语从句。","key":"take on ... at its own game：在对方擅长的领域与之竞争或较量。；old Hollywood：不是“古老的好莱坞”，而是相对于科技流媒体平台而言的传统影视制片业。；turn a profit：实现盈利、开始赚取利润。；the likes of：诸如……之类的人或事物。","zh":"自从传统好莱坞在网飞擅长的流媒体领域与之正面竞争以来，它始终难以从流媒体业务中获利；迪士尼+、Peacock 和 Paramount+ 等平台每年亏损数十亿美元，由此引发担忧：这些服务可能永远无法达到传统有线电视昔日的盈利水平。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.","core":"The age of streaming has been a boon for some unintended winners.","structure":"冒号后的 pirates 解释“意外赢家”；that use ... and host ... 包含两个并列谓语；which rake in ... 修饰离它最近的 illegitimate services。","key":"boon：带来便利或利益的事物、福音。；rip：此处指从数字平台快速抓取、复制影音内容，不是普通的“撕裂”。；title：此处指一部电影或电视节目，而不是“标题”。；host the titles：托管、上线这些影视内容。","zh":"然而，流媒体时代却让一群意料之外的赢家获益匪浅：盗版者用软件在数秒内从正规在线视频平台抓取电影或电视剧，再把这些作品放到自己的非法服务平台上；这些平台每年通过广告和订阅收入约 20 亿美元。","tip":"年入 20 亿美元的是盗版服务，不是被窃取内容的正规视频平台。"},{"id":"2025-T3-P2-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"With no video production costs, illegal streaming sites have achieved profit margins approaching 90%, according to the Motion Picture Association (MPA), a trade group representing Hollywood studios that’s working to crack down on the thousands of illegal platforms that have cropped up in recent years.","core":"Illegal streaming sites have achieved profit margins approaching 90%.","structure":"With no video production costs 是原因背景；according to ... 引出信息来源；a trade group ... 是 MPA 的同位语，其中 representing ... 修饰 group，that’s working ... 进一步说明该协会的行动，末尾 that have cropped up ... 修饰 platforms。","key":"margin：此处指“利润率”，不是页面边距或差距。；crop up：突然出现、大量涌现。；crack down on：严厉打击、制裁。；trade group：行业协会。","zh":"美国电影协会（MPA）表示，由于无需承担视频制作成本，非法流媒体网站的利润率已接近 90%。该协会是代表好莱坞制片公司的行业组织，正努力打击近年来涌现的数千个非法平台。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T3-P3-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"Initially the rise of legitimate online businesses such as Netflix actually helped curb digital piracy, which had largely been based on file uploads.","core":"The rise of legitimate online businesses helped curb digital piracy.","structure":"such as Netflix 举例说明正规在线业务；which had ... been based on file uploads 补充说明当时盗版的主要形式。","key":"curb：作动词意为“遏制、抑制”，不是路边的“马路牙子”。；be based on file uploads：以文件上传和分享为主要传播方式。","zh":"起初，网飞等正规在线业务的兴起实际上帮助遏制了数字盗版；此前，数字盗版主要依赖文件上传。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T3-P3-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"But now piracy involving illegal streaming services as well as file-sharing costs the US economy about $30 billion in lost revenue a year and some 250,000 jobs, estimates the US Chamber of Commerce’s Global Innovation Policy Center.","core":"Piracy costs the US economy about $30 billion ... and some 250,000 jobs.","structure":"involving ... 修饰 piracy；cost + 对象 + 损失 表示“使某方损失……”；句末 estimates ... 是倒装式引述语，说明数据来源。","key":"as well as：除……之外还……，此处连接非法流媒体和文件分享两种盗版形式。；lost revenue：损失的收入。","zh":"但美国商会全球创新政策中心估计，如今涉及非法流媒体服务和文件分享的盗版行为，每年使美国经济损失约 300 亿美元收入和约 25 万个就业岗位。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T3-P4-S07","sec":"text3","sec_label":"Text 3","level":3,"en":"“The people who are stealing our movies and our television shows and operating piracy sites are not mom and pop operations,” says Charlie Rivkin, chief executive officer of the MPA.","core":"引语内为 The people ... are not mom and pop operations.","structure":"who 引导定语从句，其中 are stealing 与 operating 并列，说明这些人的两类行为；逗号后的 chief executive officer ... 是 Rivkin 的同位语。","key":"mom and pop operations：夫妻或家庭经营的小型企业，此处泛指零散、规模很小的盗版者。","zh":"美国电影协会首席执行官查理·里夫金说：“那些盗取我们的电影和电视节目、经营盗版网站的人，并不是什么家庭式小作坊。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T3-P4-S09","sec":"text3","sec_label":"Text 3","level":3,"en":"Rivkin joined the MPA in 2017 after the organization failed five years earlier to build consensus between Hollywood and Silicon Valley to win passage of legislation in Congress aimed at stopping online piracy.","core":"Rivkin joined the MPA in 2017 after the organization failed ...","structure":"five years earlier 以 2017 年为参照，指五年前；to build consensus between ... 接在 failed 后说明失败事项；后一个 to win passage ... 表示凝聚共识的目的；aimed at stopping ... 修饰 legislation。","key":"build consensus：凝聚共识、促成各方达成一致。；win passage of legislation：争取使一项法案获得通过；passage 此处不是“文章段落”。","zh":"里夫金于 2017 年加入美国电影协会；五年前，该协会曾试图在好莱坞与硅谷之间凝聚共识，以推动国会通过打击网络盗版的立法，但最终未能成功。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T3-P4-S10","sec":"text3","sec_label":"Text 3","level":3,"en":"In 2017 the association formed the Alliance for Creativity and Entertainment (ACE), an enforcement task force of about 100 detectives circling the globe to help local authorities arrest streaming pirates.","core":"The association formed ACE.","structure":"an enforcement task force ... 是 ACE 的同位语；circling the globe 修饰 detectives；to help ... arrest ... 说明调查人员全球行动的目的。","key":"enforcement task force：专门负责执法行动的工作组。；circle the globe：在世界各地奔走、开展行动。；local authorities：当地执法或政府部门。","zh":"2017 年，该协会成立了“创意与娱乐联盟”（ACE）。这是一支执法工作组，约有 100 名调查人员在全球开展行动，协助当地执法部门逮捕流媒体盗版者。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T3-P5-S11","sec":"text3","sec_label":"Text 3","level":3,"en":"ACE says it’s helped shrink the number of illegal streaming services in North America to 126, from more than 1,400 in 2018, aided in part by the MPA’s support for a 2020 federal law that made large-scale streaming of copyright material a serious crime.","core":"ACE says (that) it has helped shrink the number ...","structure":"to 126 表示减少后的数量，from more than 1,400 表示起点；aided in part by ... 是过去分词短语，补充说明这一降幅的助力；that made ... 修饰 a 2020 federal law。","key":"shrink ... to ..., from ...：把……从某一数量减少到另一数量。；copyright material：受版权保护的内容。；a serious crime：严重犯罪。","zh":"ACE 表示，它已帮助把北美非法流媒体服务的数量从 2018 年的 1,400 多个压缩至 126 个；这一成果也部分得益于美国电影协会对 2020 年一项联邦法律的支持，该法律把大规模传播版权内容的流媒体盗版行为列为严重犯罪。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T3-P6-S12","sec":"text3","sec_label":"Text 3","level":3,"en":"Consulting firm Parks Associates predicts that legitimate US streaming services’ cumulative loss from piracy since 2022 will reach $113 billion in the next two years.","core":"Parks Associates predicts that the cumulative loss ... will reach $113 billion.","structure":"that 引导宾语从句；legitimate US streaming services’ 是所有格，说明损失承担者；from piracy 说明损失来源；since 2022 是累计起点。","key":"cumulative loss：累计损失。；loss from piracy：盗版造成的损失。","zh":"咨询公司 Parks Associates 预测，从 2022 年开始累计计算，未来两年美国正规流媒体服务因盗版造成的损失将达到 1,130 亿美元。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T3-P6-S13","sec":"text3","sec_label":"Text 3","level":3,"en":"“While there is some optimism that emerging countermeasures and best practices may see piracy begin to plateau by 2027, there is no consensus among stakeholders as to when it may begin to decline,” says analyst Steve Hawley.","core":"让步从句为 While there is some optimism ...，主句为 there is no consensus ...。","structure":"第一个 that 说明乐观预期的内容；as to when ... 说明各方缺乏共识的问题；it 回指 piracy。","key":"plateau：作动词意为“进入平台期、停止增长”，不等于“开始下降”。；see piracy begin to plateau：这里的 see 表示“促成、见证某种结果出现”，主语是应对措施和最佳实践。；countermeasure：应对措施、反制手段。；stakeholder：利益相关方。","zh":"分析师史蒂夫·霍利说：“尽管有人乐观地认为，新出现的应对措施和最佳实践或许能让盗版活动到 2027 年开始趋于平稳，但利益相关方对于它究竟何时才会开始下降，并没有一致看法。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P1-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Visit any antiques store and you’ll encounter artifacts from the past: photographs, letters, a brochure detailing the Sinclair dinosaur exhibit from the 1964-1965 World’s Fair, the ephemera of history.","core":"Visit any antiques store and you’ll encounter artifacts from the past.","structure":"祈使句 + and + 陈述句 表示“只要……就……”；冒号后的照片、书信和宣传册列举 artifacts；detailing ... 修饰 a brochure；末尾 the ephemera of history 概括前述物件。","key":"artifact：人工制品；在历史与档案语境中指承载过去信息的实物资料。；ephemera：原本只供短期使用、不打算长期保存的印刷品或物件，如传单、票据和宣传册。","zh":"走进任何一家古董店，你都会遇见来自过去的物件：照片、书信、一份介绍 1964-1965 年世界博览会辛克莱恐龙展的宣传册——这些都是历史上原本短暂易逝的资料。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P1-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Yet these objects aren’t truly ephemeral, because they’re still here, decades, even centuries later.","core":"These objects aren’t truly ephemeral.","structure":"because 引导原因从句；decades, even centuries later 是时间状语，even 递进强调保存时间之长。","key":"ephemeral：短暂的、转瞬即逝的；与上句名词 ephemera 构成词形复现和语义反转。","zh":"然而，这些物件其实并非真正转瞬即逝，因为几十年、甚至几百年后，它们依然存在。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P2-S05","sec":"text4","sec_label":"Text 4","level":3,"en":"Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make provision for their long-term preservation?","core":"Have you pondered the life cycle of intangible formats?","structure":"digital information 是 intangible formats 的同位解释；given that 意为“考虑到、鉴于”，引导原因背景；who produce these artifacts 修饰 those。","key":"life cycle：此处指数字格式从产生、使用到过时失效的完整周期。；make provision for：为……预先安排或采取准备措施。","zh":"既然数字资料的制作者很少为其长期保存预作安排，你是否思考过这类无形格式，也就是数字信息，究竟有怎样的生命周期？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P2-S06","sec":"text4","sec_label":"Text 4","level":3,"en":"For millennia, we’ve known what we’ve known due to artifacts that have survived, often despite their original creators’ neglect.","core":"We’ve known what we’ve known due to artifacts.","structure":"what we’ve known 是 known 的宾语从句；that have survived 修饰 artifacts；despite their original creators’ neglect 表示让步。","key":"we’ve known what we’ve known：并非无意义重复，而是强调人类既有的历史知识依赖幸存实物。","zh":"数千年来，我们之所以能够了解过去，靠的是那些留存至今的实物；它们往往是在最初制作者疏于保存的情况下仍然幸存下来的。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P2-S07","sec":"text4","sec_label":"Text 4","level":3,"en":"The thing itself is the medium that delivers the information.","core":"The thing itself is the medium.","structure":"that delivers the information 修饰 medium；itself 强调实物和信息载体合而为一。","key":"medium：信息的载体、媒介；media 是其复数形式之一。","zh":"实体物本身就是传递信息的媒介。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P2-S08","sec":"text4","sec_label":"Text 4","level":3,"en":"At the time of creation, no attempts were made at intentional preservation, yet analog materials have a chance of surviving and serving as the historical record that biographers, historians, and novelists rely on.","core":"No attempts were made ..., yet analog materials have a chance of surviving and serving as ...","structure":"yet 连接转折；surviving 与 serving 并列作介词 of 的宾语；that ... rely on 修饰 historical record，关系代词在从句中作 on 的宾语。","key":"intentional preservation：有意识、有计划的保存。；analog materials：模拟材料，指纸张、胶片等以实体形式连续记录信息的材料。；serve as：充当、用作。","zh":"这些资料产生之初，人们并未尝试有意保存它们；然而，模拟材料仍有机会留存下来，成为传记作者、历史学家和小说家所依赖的历史记录。","tip":"their original creators’ neglect 并不意味着实体资料不会损坏，只表示它们即使缺乏主动保存也仍有自然幸存的可能。"},{"id":"2025-T4-P2-S10","sec":"text4","sec_label":"Text 4","level":3,"en":"Thus, librarians digitize the tangible so that researchers the world over can quickly search and access their holdings.","core":"Librarians digitize the tangible.","structure":"the tangible 是“the + 形容词”结构，泛指有形资料；so that 引导目的兼结果从句；search 与 access 并列。","key":"holdings：图书馆、档案馆或博物馆所收藏的资料，即“馆藏”。；the world over：遍及全世界、世界各地。","zh":"因此，图书馆员把实体资料数字化，使世界各地的研究者都能快速检索并获取馆藏内容。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P2-S11","sec":"text4","sec_label":"Text 4","level":3,"en":"The result is an embarrassment of historical riches, which brings its own needle-and-haystack problems.","core":"The result is an embarrassment of historical riches.","structure":"which 引导非限制性定语从句，回指资料异常丰富这一结果；its own 强调丰富资源也会产生新的检索问题。","key":"an embarrassment of riches：好东西多到难以选择，即“多得令人应接不暇”，不是“财富带来的羞耻”。；needle-and-haystack problems：在海量信息中寻找特定资料的“大海捞针”难题。","zh":"其结果是历史资料丰富得令人不知如何取舍，而这种富足也带来了大海捞针般的检索难题。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P3-S12","sec":"text4","sec_label":"Text 4","level":3,"en":"Librarians’ selfless devotion can act against us when users point to universality of access by holding up a cellphone and saying, “it’s all in here” as evidence that libraries are less vital for researchers today.","core":"Librarians’ selfless devotion can act against us.","structure":"when 引导出现负面效果的情境；by holding up ... and saying ... 说明用户如何表达看法；as evidence that ... 中 that 从句说明这一“证据”被用来证明什么。","key":"act against us：产生对我们不利的效果；us 指作者所属的图书馆员群体。；universality of access：信息获取的普遍可达性，即人们似乎随时随地都能取得信息。；vital：至关重要的、不可或缺的。","zh":"图书馆员无私投入所创造的便利有时反而会对我们不利：用户举起手机说“这里面什么都有”，用普遍可获取的信息作为证据，认为今天的研究者已经不再那么需要图书馆。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P3-S13","sec":"text4","sec_label":"Text 4","level":3,"en":"Yet how was that universality of access made possible and, perhaps more importantly, how is it maintained?","core":"两个并列疑问是 How was that universality made possible? 和 How is it maintained?","structure":"perhaps more importantly 是插入语；it 回指 that universality of access。","key":"见下方词汇笔记","zh":"然而，这种普遍可获取性究竟是如何实现的？也许更重要的是，它又是如何维持的？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P3-S14","sec":"text4","sec_label":"Text 4","level":3,"en":"Who curates what is preserved?","core":"见结构","structure":"what is preserved 是 curates 的宾语从句，意为“被保存的内容”。","key":"curate：在档案语境中指依照专业标准选择、组织和管理资料，不只是策划展览。","zh":"又是谁在筛选和整理那些被保存下来的内容？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P3-S16","sec":"text4","sec_label":"Text 4","level":3,"en":"Digital information requires a great deal more care than analog.","core":"见结构","structure":"a great deal 修饰比较级 more；analog 省略了上文已有的 information/materials。","key":"care：此处不是“关心”，而是为确保信息持续可读而进行的维护、迁移和管理。","zh":"数字信息需要投入的维护远多于模拟资料。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P4-S17","sec":"text4","sec_label":"Text 4","level":3,"en":"Even when a digital object is preserved, it may only be the carrier that’s saved, not the information itself.","core":"It may only be the carrier that’s saved, not the information itself.","structure":"Even when 引导让步从句；主句使用近似强调结构，that’s saved 强调实际留下的可能只是载体；not 引出被排除的信息本身。","key":"carrier：承载数字信息的物理介质，如磁盘或磁带。；saved：此处既有“保存下来”之意，也呼应计算机中的“存储”；载体仍在不等于其中的信息仍可读取。","zh":"即便一个数字对象被保存下来，留存的也可能只是存储载体，而不是信息本身。","tip":"it 指 a digital object；“保存了数字对象”在表面上成立，却可能没有保存其可访问的信息内容。"},{"id":"2025-T4-P4-S18","sec":"text4","sec_label":"Text 4","level":3,"en":"As technology advances and a format becomes obsolete, the object is useless.","core":"见结构","structure":"As 表示“随着”；从句中 technology advances 与 a format becomes obsolete 并列，主句给出结果。","key":"become obsolete：变得过时、被淘汰。","zh":"随着技术发展、某种格式遭到淘汰，这个数字对象也就失去了用处。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P4-S19","sec":"text4","sec_label":"Text 4","level":3,"en":"Have you ever stared helplessly at a ZIP disk, thinking: how do I get the files off this?","core":"Have you ever stared helplessly at a ZIP disk?","structure":"thinking 是伴随状语；冒号后的直接疑问说明看到旧磁盘时的具体困境。","key":"get the files off：把文件从旧介质中读取、导出，而不是把文件“从上面拿下来”。；ZIP disk：20 世纪 90 年代流行的可移动磁盘，需要专用 ZIP 驱动器读取，后来随硬件和格式淘汰而难以使用。","zh":"你是否曾无助地盯着一张 ZIP 磁盘，心里想着：我怎样才能把里面的文件取出来？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P4-S20","sec":"text4","sec_label":"Text 4","level":3,"en":"Without constant migration of digital assets, a nightmare about the foreseeable future is what keeps historians up at night: a historical record that abruptly stops when digital replace analog.","core":"A nightmare ... is what keeps historians up at night.","structure":"Without ... 给出否定条件；what keeps historians up at night 是表语从句；冒号后的 a historical record ... 同位解释噩梦的具体内容；that abruptly stops ... 修饰 record。","key":"migration of digital assets：把数字资料持续转移到新的格式、介质或系统中，以保持其可读取性。；keep someone up at night：让某人忧心忡忡、夜不能寐。","zh":"如果不持续迁移数字资料，历史学家就会被一种关于可见未来的噩梦搅得夜不能寐：当数字资料取代模拟资料后，历史记录会突然中断。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P5-S21","sec":"text4","sec_label":"Text 4","level":3,"en":"As a librarian whose day job revolves around special collections and digital assets, I share the night terrors of historians, and I’d be lying if I said a comprehensive preservation solution currently exists.","core":"I share the night terrors ..., and I’d be lying ...","structure":"句首 As a librarian ... 说明作者身份；whose day job ... 修饰 librarian；if I said ... 是条件从句，以虚拟式表达对“已有全面方案”的否定。","key":"revolve around：以……为中心、主要围绕……展开。；I’d be lying if I said ...：委婉而有力地承认某事并不成立，即“要说……存在，那并不真实”。；special collections：图书馆中具有稀缺性、历史价值或特殊载体形式的特藏资料。；comprehensive preservation solution：覆盖各种数字格式与长期需求的全面保存方案。","zh":"作为一名日常工作围绕特藏资料与数字资产展开的图书馆员，我同样承受着历史学家的这种夜间恐惧；如果我说目前已经存在一套全面的保存方案，那就是在撒谎。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P5-S22","sec":"text4","sec_label":"Text 4","level":3,"en":"Yet researchers can take some comfort in the fact that there are a multitude of librarians devoted to discovering, organizing, and preserving digital information for researchers current and future.","core":"Researchers can take some comfort in the fact.","structure":"that 引导同位语从句，解释 the fact；devoted to ... 修饰 librarians；discovering、organizing 和 preserving 并列；current and future 后置修饰 researchers。","key":"take comfort in：从……中得到安慰。；a multitude of：大量、众多。；be devoted to doing：致力于做某事，to 为介词。","zh":"不过，研究者仍可从一个事实中得到些许安慰：众多图书馆员正致力于发现、整理和保存数字信息，为当下及未来的研究者服务。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P5-S23","sec":"text4","sec_label":"Text 4","level":3,"en":"Librarians are uniquely positioned to understand how end users seek and use information.","core":"见结构","structure":"how end users seek and use information 是 understand 的宾语从句，其中 seek 与 use 并列。","key":"be uniquely positioned to do：因自身角色、经验或资源而特别适合做某事，并非指物理位置。；end users：信息系统或服务的最终使用者。","zh":"图书馆员处在独特而有利的位置，能够理解终端用户如何查找并使用信息。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2025-T4-P5-S24","sec":"text4","sec_label":"Text 4","level":3,"en":"Thus we play an integral role in identifying, preserving, and providing accessibility to digital artifacts so that, while future researchers may find the digital realm a challenging place to ply their trade, they won’t find it an impossible one.","core":"We play an integral role ... so that ... they won’t find it an impossible one.","structure":"三个动名词 identifying、preserving、providing 并列作介词 in 的宾语；so that 引导结果从句，其中嵌入 while 让步从句；find + 宾语 + 宾补 在两处分別为 find the digital realm a challenging place 与 find it an impossible one。","key":"integral：不可或缺的、构成整体所必需的，不是“完整的”。；ply one’s trade：从事本职工作；此处指研究者开展研究。；provide accessibility to：使……可被获取和利用。；digital realm：数字领域、数字信息环境。","zh":"因此，我们在识别、保存数字资料并使其可供利用方面发挥着不可或缺的作用；这样一来，未来的研究者即使会觉得数字世界是一个颇具挑战的研究场域，也不至于发现它根本无法开展工作。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"}]};</script>

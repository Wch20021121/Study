  <script>window.__PAPER__ = {"meta":{"year":2025,"exam":"2025 年全国硕士研究生招生考试","subject":"英语（一）","topics":["戏剧化教学对儿童语言与情感发展的促进作用","科研活动的碳排放与绿色转型","流媒体时代的数字盗版治理","数字资料长期保存所面临的技术与制度难题"],"overview":"- 主题：四篇文章依次讨论戏剧化教学对儿童语言与情感发展的促进作用、科研活动的碳排放与绿色转型、流媒体时代的数字盗版治理，以及数字资料长期保存所面临的技术与制度难题。\n- 行文逻辑：各篇分别从教学实验、科研能耗争议、盗版产业的高利润和实体史料的耐久性切入，通过对照研究、案例与数据分析问题成因，再引出对教学方法、清洁能源、执法协作或数字保存机制的进一步思考。","full":true,"stats":{"sentences":62,"vocab":154}},"sections":[{"id":"cloze","label":"完形填空","kind":"Use of English","score":10,"count":20,"focus":"逻辑关系 · 词义辨析 · 固定搭配"},{"id":"reading","label":"阅读理解","kind":"Part A","score":40,"count":20,"focus":"定位 · 同义替换 · 段落功能 · 主旨态度"},{"id":"partb","label":"新题型","kind":"Part B","score":10,"count":5,"focus":"衔接 · 指代 · 段落顺序 / 匹配"},{"id":"partc","label":"翻译","kind":"Part C","score":10,"count":5,"focus":"长句拆分 · 语序 · 术语准确"},{"id":"writing","label":"写作","kind":"Part A + B","score":30,"count":2,"focus":"任务覆盖 · 结构 · 句式 · 准确度"}],"cloze":{"title":"完形填空","score":10,"count":20},"reading":[{"id":"text1","title":"Text 1","questions":[{"n":21,"stem":"The “rehearsal room” approach requires pupils to ____"},{"n":22,"stem":"The study divided the pupils into two groups to find whether ____"},{"n":23,"stem":"Control pupils’ reliance on “desert island clichés” shows their ____"},{"n":24,"stem":"What can promote children’s emotional literacy according to O’Hanlon?"},{"n":25,"stem":"It can be inferred from the last paragraph that ____"}]},{"id":"text2","title":"Text 2","questions":[{"n":26,"stem":"The author expressed great surprise at some scientists’ ____"},{"n":27,"stem":"The author believes that carbon emissions from research ____"},{"n":28,"stem":"The example of Green in Paragraph 5 is used to illustrate ____"},{"n":29,"stem":"It can be learned from the last two paragraphs that LUMI ____"},{"n":30,"stem":"Which of the following statements would the author agree with?"}]},{"id":"text3","title":"Text 3","questions":[{"n":31,"stem":"According to Paragraph 1, legitimate streaming services ____"},{"n":32,"stem":"It can be learned that streamers like Netflix ____"},{"n":33,"stem":"It can be inferred from Paragraph 4 that the MPA ____"},{"n":34,"stem":"According to Hawley, digital piracy ____"},{"n":35,"stem":"Which of the following is emphasized in the text?"}]},{"id":"text4","title":"Text 4","questions":[{"n":36,"stem":"The author mentions the artifacts from the past to ____"},{"n":37,"stem":"Compared with digital objects, tangible artifacts ____"},{"n":38,"stem":"According to Paragraph 3, librarians’ work may result in ____"},{"n":39,"stem":"The “ZIP disk” is cited as an example to show ____"},{"n":40,"stem":"Which of the following statements best summarizes the text?"}]}],"partb":{"type":"ordering","title":"新题型 · 排序","cn_title":"追拍蝴蝶起飞的人","directions":"The following paragraphs are given in a wrong order. For questions 41-45, you are required to reorganize these paragraphs into a coherent text by choosing from the list A-H and filling them into the numbered boxes. Paragraphs A, C, and H have been correctly placed. Mark your answers on the ANSWER SHEET. (10 points)"},"partc":{"title":"翻译","cn_title":"公民科学：让科学走出机构","directions":"Read the following text carefully and then translate the underlined segments into Chinese. Write your answers on the ANSWER SHEET. (10 points)"},"writing":{"partA":{"title":"Part A · 电子邮件（回复）","score":10,"words":"约100词","prompt":"Read the following email from your classmate Paul and write him a reply.\n\nDear Li Ming,\nI was really excited to hear that you'd invite some young craftsmen to demonstrate their innovative craft-making on campus. May I know more about what they'll show? Also, I'd like to help with your preparation work. Please let me know what I can do.\n\nYours,\nPaul\n\nWrite your answer in about 100 words on the ANSWER SHEET. Do not use your own name in your email; use \"Li Ming\" instead. (10 points)","prompt_zh":"阅读你同学保罗发来的以下邮件，并给他写一封回信。\n\n亲爱的李明：\n听说你要邀请一些年轻手艺人到校园里展示他们的创新手工艺，我特别兴奋。能多告诉我一些他们将展示什么吗？另外，我也想为你的准备工作出一份力。请告诉我能做些什么。\n\n你的\n保罗\n\n请在答题卡上写约 100 词。不要在邮件中使用自己的真实姓名，用“Li Ming”代替。","structure":[["称呼","Dear Paul,"],["回应来信、交代活动时间地点","Great to hear from you! The young craftsmen will give live demonstrations in the art centre next Wednesday afternoon."],["说明展示内容（创新手工艺）","They will show how traditional skills can be reinvented: bamboo weaving turned into lamp shades, hand-dyed cloth printed with digital patterns, and clay figurines modelled with 3D-printed moulds."],["补充活动安排","Each session lasts about 30 minutes, and visitors can try a simple piece themselves."],["回应“愿意帮忙”，提出具体任务","Your help would be a big plus. Could you design the posters and take photos during the event? We also need two people at the sign-in desk."],["询问意愿、致谢与落款","Let me know which part you prefer. Thanks a lot! Li Ming"]],"expressions":["Great to hear from you!","The young craftsmen will give live demonstrations of...","They will show how traditional skills can be reinvented.","bamboo weaving turned into lamp shades","hand-dyed cloth printed with digital patterns","Each session lasts about 30 minutes.","Visitors can try a simple piece themselves.","Your help would be a big plus.","Could you design the posters and take photos during the event?","Let me know which part you prefer."],"traps":["这是回信，不是另起一封信：开头要回应 Paul 的来信（Great to hear from you），并逐一回答他的两个问题——展示什么、他能帮什么，缺一不可。","展示内容要具体：至少写出两三项手工艺项目，并体现“创新”（传统技艺 + 新设计或新技术），不能只写 some traditional crafts 一带而过。","约100词，两个问题都要答，但每项一两句即可；不要写成活动策划书，也不必介绍手艺人的生平。","语气应友好、口语化，符合同学之间的邮件；署名必须是 Li Ming，结尾可用 Thanks a lot / Best wishes。"]},"partB":{"title":"Part B · 表格作文","score":20,"words":"160–200词","prompt":"Write an essay of 160-200 words based on the following table. In your essay, you should 1) describe the table briefly, 2) explain its intended meaning, and 3) give your comments. You should write neatly on the ANSWER SHEET. (20 points)","prompt_zh":"根据下面的表格写一篇 160—200 词的短文。文中应：1）简要描述表格；2）解释其寓意；3）给出你的评论。请工整地写在答题卡上。","structure":[["第一段·描述表格","The table shows the average number of major durable consumer goods owned by every 100 households in China at the end of 2014, 2017, 2020 and 2023. Air conditioners increased most dramatically, from 75.2 to 145.9, while washing machines and refrigerators rose more steadily..."],["第二段·解释寓意","These figures reflect the steady improvement of living standards... a luxury that an ordinary family might save for years to buy... The surge in air conditioners shows higher incomes and a growing demand for comfort... Behind the numbers lie urbanisation, a reliable power supply and a mature home-appliance industry."],["第三段·发表评论","Consumption upgrading means more than spending more money... families devote a larger share of their income to convenience, health and experience... favour energy-efficient models, so that a better life does not come at the expense of the environment."]],"expressions":["The table shows / presents...","rose sharply / increased most dramatically from... to...","rose more steadily / climbed modestly","These figures reflect the steady improvement of living standards.","a luxury that an ordinary family might save for years to buy","The surge in... is particularly telling.","Behind the numbers lie...","consumption upgrading","devote a larger share of income to...","come at the expense of..."],"traps":["这是表格作文，不是图画作文：开头应点明表格的主题、统计口径（每百户年末拥有量）和年份，不要虚构图中人物或对话。","描述数据要“简要”：不必把 12 个数字全部罗列，抓住空调增幅最大、洗衣机与电冰箱稳步上升这两条主线，用 from... to... 概括即可。","第二段要解释“意味着什么”，不能只是把数字再抄一遍；应落到生活水平提高、消费升级以及家电普及的原因（收入、城镇化、供给）上。","第三段要有自己的评论，可辩证：肯定消费升级，同时提醒节能环保，避免只写“生活越来越好”。","160–200 词，注意三段比例：描述约 50 词，分析约 80 词，评论约 50 词；不要写成数据报告。"]}},"vocab":[{"w":"land a punch","pos":"phr.","cn":"本指“成功击中一拳”，此处借喻莎士比亚的教育价值获得了有力的学术证明。","sec":"text1","sec_label":"Text 1","ctx":"The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children’s literacy and em","note":"本指“成功击中一拳”，此处借喻莎士比亚的教育价值获得了有力的学术证明。","forms":["land a punch"]},{"w":"grammar school boy from Stratford-upon-Avon","pos":"phr.","cn":"以莎士比亚的故乡和少年经历代指莎士比亚本人。","sec":"text1","sec_label":"Text 1","ctx":"The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children’s literacy and em","note":"以莎士比亚的故乡和少年经历代指莎士比亚本人。","forms":["grammar school boy from Stratford-upon-Avon"]},{"w":"groundbreaking research","pos":"phr.","cn":"开创性的研究。","sec":"text1","sec_label":"Text 1","ctx":"The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children’s literacy and em","note":"开创性的研究。","forms":["groundbreaking research"]},{"w":"does benefit","pos":"phr.","cn":"助动词 does 强调“确实有益”，回应人们对莎士比亚教育价值的疑问。","sec":"text1","sec_label":"Text 1","ctx":"The grammar school boy from Stratford-upon-Avon has landed a scholarly punch after groundbreaking research showed that Shakespeare does benefit children’s literacy and em","note":"助动词 does 强调“确实有益”，回应人们对莎士比亚教育价值的疑问。","forms":["does benefit"]},{"w":"act him out","pos":"phr.","cn":"此处不是单纯“模仿莎士比亚本人”，而是通过扮演其作品中的角色、排演其戏剧来学习。","sec":"text1","sec_label":"Text 1","ctx":"But only if you act him out.","note":"此处不是单纯“模仿莎士比亚本人”，而是通过扮演其作品中的角色、排演其戏剧来学习。","forms":["act him out"]},{"w":"rehearsal room approach","pos":"phr.","cn":"借鉴演员排练过程、让学生亲身表演和体验角色的教学法。","sec":"text1","sec_label":"Text 1","ctx":"A study found that a “rehearsal room” approach to teaching Shakespeare broadened children’s vocabulary and the complexity of their writing as well as their emotional lite","note":"借鉴演员排练过程、让学生亲身表演和体验角色的教学法。","forms":["rehearsal room approach"]},{"w":"emotional literacy","pos":"phr.","cn":"识别、理解并恰当表达情绪的能力，即“情感素养”。","sec":"text1","sec_label":"Text 1","ctx":"A study found that a “rehearsal room” approach to teaching Shakespeare broadened children’s vocabulary and the complexity of their writing as well as their emotional lite","note":"识别、理解并恰当表达情绪的能力，即“情感素养”。","forms":["emotional literacy"]},{"w":"as well as","pos":"phr.","cn":"连接并列成分，此处表示“除了……之外还……”。","sec":"text1","sec_label":"Text 1","ctx":"A study found that a “rehearsal room” approach to teaching Shakespeare broadened children’s vocabulary and the complexity of their writing as well as their emotional lite","note":"连接并列成分，此处表示“除了……之外还……”。","forms":["as well as"]},{"w":"commission","pos":"n.","cn":"常见义为“委员会；佣金”，此处作动词，意为“委托开展”。","sec":"text1","sec_label":"Text 1","ctx":"“The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,” Jacqui O’Hanlon of the Roy","note":"常见义为“委员会；佣金”，此处作动词，意为“委托开展”。","forms":["commission"]},{"w":"make a big difference to","pos":"phr.","cn":"对……产生显著影响，并非只表示两者“存在差别”。","sec":"text1","sec_label":"Text 1","ctx":"“The research shows that the way actors work makes a big difference to the way children use language and also how they think about themselves,” Jacqui O’Hanlon of the Roy","note":"对……产生显著影响，并非只表示两者“存在差别”。","forms":["make a big difference to"]},{"w":"randomised control trial","pos":"phr.","cn":"随机对照试验，通过随机分组比较干预效果。","sec":"text1","sec_label":"Text 1","ctx":"The randomised control trial involved hundreds of year 5 pupils — aged nine and ten — at 45 state primary schools that had not been “previously exposed to RSC pedagogy.”","note":"随机对照试验，通过随机分组比较干预效果。","forms":["randomised control trial"]},{"w":"be exposed to","pos":"phr.","cn":"接触、经历；此处不含“暴露于危险”的负面意味。","sec":"text1","sec_label":"Text 1","ctx":"The randomised control trial involved hundreds of year 5 pupils — aged nine and ten — at 45 state primary schools that had not been “previously exposed to RSC pedagogy.”","note":"接触、经历；此处不含“暴露于危险”的负面意味。","forms":["be exposed to"]},{"w":"pedagogy","pos":"词","cn":"教学法、教育方法。","sec":"text1","sec_label":"Text 1","ctx":"The randomised control trial involved hundreds of year 5 pupils — aged nine and ten — at 45 state primary schools that had not been “previously exposed to RSC pedagogy.”","note results showed that the target group of pupils drew on a wider vocabulary, used words “classed as more sophisticated or rarer”, and wrote at greater len","note":"以更长篇幅、更充分地。","forms":["at greater length"]},{"w":"write in role","pos":"phr.","cn":"以所扮演角色的身份和视角写作。","sec":"text1","sec_label":"Text 1","ctx":"They also “appear to be more comfortable writing in role...while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put them","note":"以所扮演角色的身份和视角写作。","forms":["write in role"]},{"w":"put oneself in the shoes of","pos":"phr.","cn":"设身处地站在……的立场上。","sec":"text1","sec_label":"Text 1","ctx":"They also “appear to be more comfortable writing in role...while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put them","note":"设身处地站在……的立场上。","forms":["put oneself in the shoes of"]},{"w":"expansive","pos":"adj.","cn":"常见义为“广阔的；健谈的”，此处形容描写内容“铺陈更充分、范围更广”。","sec":"text1","sec_label":"Text 1","ctx":"The *Time to Act* study, which is published by the RSC this week, also found that while control pupils relied on “desert island clichés” such as palm trees, target pupils","note":"常见义为“广阔的；健谈的”，此处形容描写内容“铺陈更充分、范围更广”。","forms":["expansive"]},{"w":"desert island clichés","pos":"phr.","cn":"关于荒岛的陈词滥调或刻板意象，并非指“荒漠岛屿”。","sec":"text1","sec_label":"Text 1","ctx":"The *Time to Act* study, which is published by the RSC this week, also found that while control pupils relied on “desert island clichés” such as palm trees, target pupils","note":"关于荒岛的陈词滥调或刻板意象，并非指“荒漠岛屿”。","forms":["desert island clichés"]},{"w":"be evident in","pos":"phr.","cn":"在……中清楚地体现出来。","sec":"text1","sec_label":"Text 1","ctx":"O’Hanlon said she had been most surprised by the “emotional literacy that was evident in the [target] children’s writing” and that they were “more resilient in their writ","note":"在……中清楚地体现出来。","forms":["be evident in"]},{"w":"resilient","pos":"词","cn":"有韧性的、能从困境中恢复的；此处形容学生笔下人物面对困境的状态。","sec":"text1","sec_label":"Text 1","ctx":"O’Hanlon said she had been most surprised by the “emotional literacy that was evident in the [target] children’s writing” and that they were “more resilient in their writ","note":"有韧性的、能从困境中恢复的；此处形容学生笔下人物面对困境的状态。","forms":["resilient"]},{"w":"imagine your way through","pos":"phr.","cn":"不是简单“想象出一条路”，而是通过想象进入人物处境，并在头脑中经历整个情境。","sec":"text1","sec_label":"Text 1","ctx":"She added “The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to imagine your way throug","note":"不是简单“想象出一条路”，而是通过想象进入人物处境，并在头脑中经历整个情境。","forms":["imagine your way through"]},{"w":"be comfortable in doing","pos":"phr.","cn":"能够自如、从容地做某事。","sec":"text1","sec_label":"Text 1","ctx":"They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.”","note":"能够自如、从容地做某事。","forms":["be comfortable in doing"]},{"w":"put yourself in different shoes","pos":"phr.","cn":"代入不同人物的处境和视角。","sec":"text1","sec_label":"Text 1","ctx":"They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different shoes.”","note":"代入不同人物的处境和视角。","forms":["put yourself in different shoes"]},{"w":"embed arts in education","pos":"phr.","cn":"把艺术系统地纳入教育过程，而非只安排一次性的艺术活动。","sec":"text1","sec_label":"Text 1","ctx":"The study showed the importance of embedding arts in education, she said.","note":"把艺术系统地纳入教育过程，而非只安排一次性的艺术活动。","forms":["embed arts in education"]},{"w":"any old","pos":"phr.","cn":"口语中意为“随便哪个、任意一个”，重点不在剧作家“年老”。","sec":"text1","sec_label":"Text 1","ctx":"But could the results be replicated with any old dramatist?","note":"口语中意为“随便哪个、任意一个”，重点不在剧作家“年老”。","forms":["any old"]},{"w":"replicate","pos":"v.","cn":"使研究结果重复出现、复现。","sec":"text1","sec_label":"Text 1","ctx":"But could the results be replicated with any old dramatist?","note":"使研究结果重复出现、复现。","forms":["replicate"]},{"w":"compared with","pos":"phr.","cn":"与……相比；插入句中突出莎士比亚词汇量的优势。","sec":"text1","sec_label":"Text 1","ctx":"O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words, gave a “massive expansion of lan","note":"与……相比；插入句中突出莎士比亚词汇量的优势。","forms":["compared with"]},{"w":"bring words to life","pos":"phr.","cn":"通过动作和表演让词语变得鲜活、可感。","sec":"text1","sec_label":"Text 1","ctx":"O’Hanlon said more research would be needed but suggested that Shakespeare’s use of 20,000 words, compared with the everyday 2,000 words, gave a “massive expansion of lan","note":"通过动作和表演让词语变得鲜活、可感。","forms":["bring words to life"]},{"w":"scale back","pos":"phr.","cn":"缩减规模、减少投入，不是按某种比例“放大或缩小”。","sec":"text2","sec_label":"Text 2","ctx":"I was shocked to learn recently that some scientists want to scale back their research in an effort to decrease carbon emissions.","note":"缩减规模、减少投入，不是按某种比例“放大或缩小”。","forms":["scale back"]},{"w":"cut back on","pos":"phr.","cn":"削减、减少；与上句的 scale back 同义复现。","sec":"text2","sec_label":"Text 2","ctx":"The crisis is here, they said, and we need to cut back on our energy-intensive modelling.","note":"削减、减少；与上句的 scale back 同义复现。","forms":["cut back on"]},{"w":"energy-intensive modelling","pos":"phr.","cn":"需要消耗大量能源的建模运算。","sec":"text2","sec_label":"Text 2","ctx":"The crisis is here, they said, and we need to cut back on our energy-intensive modelling.","note":"需要消耗大量能源的建模运算。","forms":["energy-intensive modelling"]},{"w":"at the very least","pos":"phr.","cn":"退一步说、至少。","sec":"text2","sec_label":"Text 2","ctx":"At the very least, we need to make our energy use far more sustainable.","note":"退一步说、至少。","forms":["at the very least"]},{"w":"far more sustainable","pos":"phr.","cn":"far 修饰比较级，表示“可持续得多”。","sec":"text2","sec_label":"Text 2","ctx":"At the very least, we need to make our energy use far more sustainable.","note":"far 修饰比较级，表示“可持续得多”。","forms":["far more sustainable"]},{"w":"measure the planet’s pulse","pos":"phr.","cn":"字面为“测量地球的脉搏”，此处比喻持续监测地球环境和气候状态。","sec":"text2","sec_label":"Text 2","ctx":"It is unarguable that our laboratories, scientific instruments, rockets and satellites — the tools we scientists need to measure the planet’s pulse — demand significant a","note":"字面为“测量地球的脉搏”，此处比喻持续监测地球环境和气候状态。","forms":["measure the planet’s pulse"]},{"w":"unarguable","pos":"adj.","cn":"无可争辩的、不容否认的。","sec":"text2","sec_label":"Text 2","ctx":"It is unarguable that our laboratories, scientific instruments, rockets and satellites — the tools we scientists need to measure the planet’s pulse — demand significant a","note":"无可争辩的、不容否认的。","forms":["unarguable"]},{"w":"both in their construction and operation","pos":"phr.","cn":"在建造和运行两个阶段都……。","sec":"text2","sec_label":"Text 2","ctx":"It is unarguable that our laboratories, scientific instruments, rockets and satellites — the tools we scientists need to measure the planet’s pulse — demand significant a","note":"在建造和运行两个阶段都……。","forms":["both in their construction and operation"]},{"w":"appetite","pos":"词","cn":"常见义为“食欲”，此处比喻对信息的强烈需求。","sec":"text2","sec_label":"Text 2","ctx":"And it is equally true that science’s unrelenting appetite for information has caused a mushrooming of energy-intensive data centres around the world.","note":"常见义为“食欲”，此处比喻对信息的强烈需求。","forms":["appetite"]},{"w":"mushrooming","pos":"v./n.","cn":"像蘑菇般迅速增多，即“激增、涌现”。","sec":"text2","sec_label":"Text 2","ctx":"And it is equally true that science’s unrelenting appetite for information has caused a mushrooming of energy-intensive data centres around the world.","note":"像蘑菇般迅速增多，即“激增、涌现”。","forms":["mushrooming"]},{"w":"these buildings","pos":"phr.","cn":"回指上一句的 energy-intensive data centres。","sec":"text2","sec_label":"Text 2","ctx":"According to the International Energy Agency, these buildings now consume about 1 percent of the world’s electricity.","note":"回指上一句的 energy-intensive data centres。","forms":["these buildings"]},{"w":"consume about 1 percent of","pos":"phr.","cn":"消耗……的大约百分之一。","sec":"text2","sec_label":"Text 2","ctx":"According to the International Energy Agency, these buildings now consume about 1 percent of the world’s electricity.","note":"消耗……的大约百分之一。","forms":["consume about 1 percent of"]},{"w":"price","pos":"词","cn":"此处并非货币价格，而是为获得科研认识而承担的能源和碳排放成本。","sec":"text2","sec_label":"Text 2","ctx":"However, this is a price we must pay for understanding the world.","note":"此处并非货币价格，而是为获得科研认识而承担的能源和碳排放成本。","forms":["price"]},{"w":"inform decision makers about","pos":"phr.","cn":"向决策者提供有关……的信息。","sec":"text2","sec_label":"Text 2","ctx":"How can we inform decision makers about the best ways to bring down carbon emissions if we can’t track the amount of carbon dioxide in the atmosphere, where it’s coming f","note":"向决策者提供有关……的信息。","forms":["inform decision makers about"]},{"w":"bring down carbon emissions","pos":"phr.","cn":"降低碳排放。","sec":"text2","sec_label":"Text 2","ctx":"How can we inform decision makers about the best ways to bring down carbon emissions if we can’t track the amount of carbon dioxide in the atmosphere, where it’s coming f","note":"降低碳排放。","forms":["bring down carbon emissions"]},{"w":"track","pos":"词","cn":"持续追踪、监测。","sec":"text2","sec_label":"Text 2","ctx":"How can we inform decision makers about the best ways to bring down carbon emissions if we can’t track the amount of carbon dioxide in the atmosphere, where it’s coming f","note":"持续追踪、监测。","forms":["track"]},{"w":"well spent","pos":"phr.","cn":"通常修饰时间或金钱，表示“花得值得”；此处把碳排放视为换取长期收益的一项成本。","sec":"text2","sec_label":"Text 2","ctx":"The carbon emissions from technological research are well spent: ultimately this research will safeguard the future of our planet.","note":"通常修饰时间或金钱，表示“花得值得”；此处把碳排放视为换取长期收益的一项成本。","forms":["well spent"]},{"w":"make the case","pos":"phr.","cn":"提出充分理由、令人信服地论证，此处指向公众说明科研的价值。","sec":"text2","sec_label":"Text 2","ctx":"It can be hard for scientists to make the case because our work is complex, often takes place behind closed doors and does not always lend itself to easy interpretation o","note":"提出充分理由、令人信服地论证，此处指向公众说明科研的价值。","forms":["make the case"]},{"w":"behind closed doors","pos":"phr.","cn":"字面为“在紧闭的门后”，此处指不为公众所见、缺少公开可见性。","sec":"text2","sec_label":"Text 2","ctx":"It can be hard for scientists to make the case because our work is complex, often takes place behind closed doors and does not always lend itself to easy interpretation o","note":"字面为“在紧闭的门后”，此处指不为公众所见、缺少公开可见性。","forms":["behind closed doors"]},{"w":"lend itself to","pos":"phr.","cn":"适合于、易于接受某种处理。","sec":"text2","sec_label":"Text 2","ctx":"It can be hard for scientists to make the case because our work is complex, often takes place behind closed doors and does not always lend itself to easy interpretation o","note":"适合于、易于接受某种处理。","forms":["lend itself to"]},{"w":"efficacy","pos":"词","cn":"功效、实际效力，强调能否产生预期结果。","sec":"text2","sec_label":"Text 2","ctx":"But demonstrating the efficacy of science will be crucial if we are to solve humanity’s greatest challenges.","note":"功效、实际效力，强调能否产生预期结果。","forms":["efficacy"]},{"w":"if we are to do","pos":"phr.","cn":"如果我们要做到……；常含“这是实现目标所必需的”意味。","sec":"text2","sec_label":"Text 2","ctx":"But demonstrating the efficacy of science will be crucial if we are to solve humanity’s greatest challenges.","note":"如果我们要做到……；常含“这是实现目标所必需的”意味。","forms":["if we are to do"]},{"w":"all too easy","pos":"phr.","cn":"实在太容易发生，常暗示某种令人遗憾的倾向。","sec":"text2","sec_label":"Text 2","ctx":"It is all too easy to feel paralysed in the face of daunting problems such as climate change and to do nothing.","note":"实在太容易发生，常暗示某种令人遗憾的倾向。","forms":["all too easy"]},{"w":"paralysed","pos":"v./adj.","cn":"本义为“瘫痪的”，此处指因恐惧或问题艰巨而无法行动。","sec":"text2","sec_label":"Text 2","ctx":"It is all too easy to feel paralysed in the face of daunting problems such as climate change and to do nothing.","note":"本义为“瘫痪的”，此处指因恐惧或问题艰巨而无法行动。","forms":["paralysed"]},{"w":"turn one’s fears into action","pos":"phr.","cn":"把恐惧转化为行动。","sec":"text2","sec_label":"Text 2","ctx":"But then I think of a friend’s daughter who turned her fears into action: she became a wind energy engineer and now thrives on delivering renewable energy, limiting emiss","note":"把恐惧转化为行动。","forms":["turn one’s fears into action"]},{"w":"thrive on doing","pos":"phr.","cn":"因做某事而充满活力、获得成长与满足。","sec":"text2","sec_label":"Text 2","ctx":"But then I think of a friend’s daughter who turned her fears into action: she became a wind energy engineer and now thrives on delivering renewable energy, limiting emiss","note":"因做某事而充满活力、获得成长与满足。","forms":["thrive on doing"]},{"w":"impetus","pos":"词","cn":"推动力、促成某事发生的动力。","sec":"text2","sec_label":"Text 2","ctx":"Recognising the hope that science and engineering can bring was the impetus behind the creation of the Millennium Technology Prize, which is now entering its 20th year as","note":"推动力、促成某事发生的动力。","forms":["impetus"]},{"w":"enter its 20th year","pos":"phr.","cn":"进入第 20 个年头，并非已经满 20 周年。","sec":"text2","sec_label":"Text 2","ctx":"Recognising the hope that science and engineering can bring was the impetus behind the creation of the Millennium Technology Prize, which is now entering its 20th year as","note":"进入第 20 个年头，并非已经满 20 周年。","forms":["enter its 20th year"]},{"w":"past winner","pos":"phr.","cn":"往届获奖者。","sec":"text2","sec_label":"Text 2","ctx":"One of the past winners, Professor Martin Green from the University of New South Wales, Australia, is the inventor of the Passivated Emitter and Rear Cell technology whic","note":"往届获奖者。","forms":["past winner"]},{"w":"be found in","pos":"phr.","cn":"存在于、应用于；此处表示该技术得到广泛采用。","sec":"text2","sec_label":"Text 2","ctx":"One of the past winners, Professor Martin Green from the University of New South Wales, Australia, is the inventor of the Passivated Emitter and Rear Cell technology whic","note":"存在于、应用于；此处表示该技术得到广泛采用。","forms":["be found in"]},{"w":"thanks to","pos":"phr.","cn":"多亏、由于；此处明确表达积极因果关系。","sec":"text2","sec_label":"Text 2","ctx":"Thanks to his invention, we have a real chance to decrease meet its net-zero ambitions","pos":"phr.","cn":"实现其净零排放目标。","sec":"text2","sec_label":"Text 2","ctx":"If the world is to meet its net-zero ambitions, we must think hard about how we can deliver sustainable computing and deliver more LUMIs.","note":"实现其净零排放目标。","forms":["meet its net-zero ambitions"]},{"w":"deliver sustainable computing","pos":"phr.","cn":"落实、实现可持续计算。","sec":"text2","sec_label":"Text 2","ctx":"If the world is to meet its net-zero ambitions, we must think hard about how we can deliver sustainable computing and deliver more LUMIs.","note":"落实、实现可持续计算。","forms":["deliver sustainable computing"]},{"w":"deliver more LUMIs","pos":"phr.","cn":"建设、复制更多 LUMI 式系统，不是“运送更多计算机”。","sec":"text2","sec_label":"Text 2","ctx":"If the world is to meet its net-zero ambitions, we must think hard about how we can deliver sustainable computing and deliver more LUMIs.","note":"建设、复制更多 LUMI 式系统，不是“运送更多计算机”。","forms":["deliver more LUMIs"]},{"w":"take on ... at its own game","pos":"phr.","cn":"在对方擅长的领域与之竞争或较量。","sec":"text3","sec_label":"Text 3","ctx":"Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing bil","note":"在对方擅长的领域与之竞争或较量。","forms":["take on ... at its own game"]},{"w":"old Hollywood","pos":"phr.","cn":"不是“古老的好莱坞”，而是相对于科技流媒体平台而言的传统影视制片业。","sec":"text3","sec_label":"Text 3","ctx":"Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing bil","note":"不是“古老的好莱坞”，而是相对于科技流媒体平台而言的传统影视制片业。","forms":["old Hollywood"]},{"w":"turn a profit","pos":"phr.","cn":"实现盈利、开始赚取利润。","sec":"text3","sec_label":"Text 3","ctx":"Ever since taking on Netflix Inc. at its own game, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing bil","note":"实现盈利、开始赚取利润。","forms":["turn a profit"]},{"w":"the likes of","pos"

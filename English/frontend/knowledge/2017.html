abel":"Text 1","ctx":"And it should: Wasted time is a drag on Americans' economic and private lives, not to mention infuriating.","note":"更不用说；在已有负面影响上补充更明显的后果。","forms":["not to mention"]},{"w":"undercover investigator","pos":"phr.","cn":"秘密调查员、卧底调查人员。","sec":"text1","sec_label":"Text 1","ctx":"Last year, the Transportation Security Administration (TSA) found in a secret check that undercover investigators were able to sneak weapons - both fake and real - past a","note":"秘密调查员、卧底调查人员。","forms":["undercover investigator"]},{"w":"sneak sth. past security","pos":"phr.","cn":"将某物偷偷带过安检。","sec":"text1","sec_label":"Text 1","ctx":"Last year, the Transportation Security Administration (TSA) found in a secret check that undercover investigators were able to sneak weapons - both fake and real - past a","note":"将某物偷偷带过安检。","forms":["sneak sth. past security"]},{"w":"enhanced security measures","pos":"phr.","cn":"加强后的安保措施。","sec":"text1","sec_label":"Text 1","ctx":"Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airpor","note":"加强后的安保措施。","forms":["enhanced security measures"]},{"w":"a rise in airline travel","pos":"phr.","cn":"航空出行量增加。","sec":"text1","sec_label":"Text 1","ctx":"Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airpor","note":"航空出行量增加。","forms":["a rise in airline travel"]},{"w":"result in","pos":"phr.","cn":"导致、造成。","sec":"text1","sec_label":"Text 1","ctx":"Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airpor","note":"导致、造成。","forms":["result in"]},{"w":"line","pos":"词","cn":"此处指排队等候的人群或队伍，而不是线条。","sec":"text1","sec_label":"Text 1","ctx":"It is not yet clear how much more effective airline security has become - but the lines are obvious.","note":"此处指排队等候的人群或队伍，而不是线条。","forms":["line"]},{"w":"screener","pos":"词","cn":"此处不是影视“审片人”，而是负责检查旅客与行李的“安检员”。","sec":"text1","sec_label":"Text 1","ctx":"Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line.","note":"此处不是影视“审片人”，而是负责检查旅客与行李的“安检员”。","forms":["screener"]},{"w":"on the line","pos":"phr.","cn":"此处结合机场语境，指“投入一线、上岗工作”。","sec":"text1","sec_label":"Text 1","ctx":"Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line.","note":"此处结合机场语境，指“投入一线、上岗工作”。","forms":["on the line"]},{"w":"only so much","pos":"phr.","cn":"表示“只有这么多、数量有限”，不是“如此之多”。","sec":"text1","sec_label":"Text 1","ctx":"Part of the issue is that airports have only so much room for screening lanes.","note":"表示“只有这么多、数量有限”，不是“如此之多”。","forms":["only so much"]},{"w":"overpack","pos":"词","cn":"装入过多物品、过度打包。","sec":"text1","sec_label":"Text 1","ctx":"Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.","note":"装入过多物品、过度打包。","forms":["overpack"]},{"w":"carry-on bag","pos":"phr.","cn":"随身携带上飞机的行李。","sec":"text1","sec_label":"Text 1","ctx":"Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.","note":"随身携带上飞机的行李。","forms":["carry-on bag"]},{"w":"checked-baggage fee","pos":"phr.","cn":"托运行李费。","sec":"text1","sec_label":"Text 1","ctx":"Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.","note":"托运行李费。","forms":["checked-baggage fee"]},{"w":"dispute a claim","pos":"phr.","cn":"对某种说法提出异议、否认其真实性。","sec":"text1","sec_label":"Text 1","ctx":"Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.","note":"对某种说法提出异议、否认其真实性。","forms":["dispute a claim"]},{"w":"rush to hire","pos":"phr.","cn":"匆忙招聘。","sec":"text1","sec_label":"Text 1","ctx":"There is one step the TSA could take that would not require remodeling airports or rushing to hire: Enroll more people in the PreCheck program.","note":"匆忙招聘。","forms":["rush to hire"]},{"w":"enroll sb. in a program","pos":"phr.","cn":"使某人加入某项计划、为某人办理登记。","sec":"text1","sec_label":"Text 1","ctx":"There is one step the TSA could take that would not require remodeling airports or rushing to hire: Enroll more people in the PreCheck program.","note":"使某人加入某项计划、为某人办理登记。","forms":["enroll sb. in a program"]},{"w":"be supposed to","pos":"phr.","cn":"此处不是单纯的“应该做某事”，而是“按设计本应达到某种效果”，暗含现实尚未完全实现。","sec":"text1","sec_label":"Text 1","ctx":"PreCheck is supposed to be a win-win for travelers and the TSA.","note":"此处不是单纯的“应该做某事”，而是“按设计本应达到某种效果”，暗含现实尚未完全实现。","forms":["be supposed to"]},{"w":"expedited","pos":"v./adj.","cn":"由 expedite 变来，核心是“加快办理的、快速处理的”；结合通道分流语境，也体现队伍更顺畅、拥堵更少。","sec":"text1","sec_label":"Text 1","ctx":"Passengers who pass a background check are eligible to use expedited screening lanes.","note":"由 expedite 变来，核心是“加快办理的、快速处理的”；结合通道分流语境，也体现队伍更顺畅、拥堵更少。","forms":["expedited"]},{"w":"pass a background check","pos":"phr.","cn":"通过背景审查。","sec":"text1","sec_label":"Text 1","ctx":"Passengers who pass a background check are eligible to use expedited screening lanes.","note":"通过背景审查。","forms":["pass a background check"]},{"w":"be eligible to do","pos":"phr.","cn":"有资格做某事。","sec":"text1","sec_label":"Text 1","ctx":"Passengers who pass a background check are eligible to use expedited screening lanes.","note":"有资格做某事。","forms":["be eligible to do"]},{"w":"sticker shock","pos":"phr.","cn":"看到标价后因价格过高而震惊，即“价格冲击”，不是贴纸本身带来的惊吓。","sec":"text1","sec_label":"Text 1","ctx":"It has not gotten anywhere close to that, and one big reason is sticker shock: Passengers must pay $85 every five years to process their background checks.","note":"看到标价后因价格过高而震惊，即“价格冲击”，不是贴纸本身带来的惊吓。","forms":["sticker shock"]},{"w":"process","pos":"词","cn":"此处作动词，指受理、办理背景审查手续。","sec":"text1","sec_label":"Text 1","ctx":"It has not gotten anywhere close to that, and one big reason is sticker shock: Passengers must pay $85 every five years to process their background checks.","note":"此处作动词，指受理、办理背景审查手续。","forms":["process"]},{"w":"price tag","pos":"phr.","cn":"字面为“价签”；此处指参加项目所需支付的费用。","sec":"text1","sec_label":"Text 1","ctx":"Since the beginning, this price tag has been PreCheck's fatal flaw.","note":"字面为“价签”；此处指参加项目所需支付的费用。","forms":["price tag"]},{"w":"fatal flaw","pos":"phr.","cn":"足以导致方案失败的致命缺陷，并非字面上的“致死”。","sec":"text1","sec_label":"Text 1","ctx":"Since the beginning, this price tag has been PreCheck's fatal flaw.","note":"足以导致方案失败的致命缺陷，并非字面上的“致死”。","forms":["fatal flaw"]},{"w":"look into","pos":"phr.","cn":"调查并研究可行办法，不是字面上的“向里面看”。","sec":"text1","sec_label":"Text 1","ctx":"But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.","note":"调查并研究可行办法，不是字面上的“向里面看”。","forms":["look into"]},{"w":"divert resources into","pos":"phr.","cn":"把资源转用于某处。","sec":"text1","sec_label":"Text 1","ctx":"The TSA cannot continue diverting resources into underused PreCheck lanes while most of the traveling public suffers in unnecessary lines.","note":"把资源转用于某处。","forms":["divert resources into"]},{"w":"the traveling public","pos":"phr.","cn":"有出行需求的公众、广大旅客。","sec":"text1","sec_label":"Text 1","ctx":"The TSA cannot continue diverting resources into underused PreCheck lanes while most of the traveling public suffers in unnecessary lines.","note":"有出行需求的公众、广大旅客。","forms":["the traveling public"]},{"w":"long past time","pos":"phr.","cn":"早已超过应该行动的时间，语气比 it is time 更强，带有催促与批评。","sec":"text1","sec_label":"Text 1","ctx":"It is long past time to make the program work.","note":"早已超过应该行动的时间，语气比 it is time 更强，带有催促与批评。","forms":["long past time"]},{"w":"reigning monarch","pos":"phr.","cn":"在位君主；last reigning monarch 指君主制终结前最后实际统治的君主。","sec":"text2","sec_label":"Text 2","ctx":"\"The ancient Hawaiians were astronomers,\" wrote Queen Liliuokalani, Hawaii's last reigning monarch, in 1897.","note":"在位君主；last reigning monarch 指君主制终结前最后实际统治的君主。","forms":["reigning monarch"]},{"w":"esteemed","pos":"v./adj.","cn":"受尊敬、受敬重的，强调其社会地位而非个人喜爱。","sec":"text2","sec_label":"Text 2","ctx":"Star watchers were among the most esteemed members of Hawaiian society.","note":"受尊敬、受敬重的，强调其社会地位而非个人喜爱。","forms":["esteemed"]},{"w":"all is not well","pos":"phr.","cn":"表示“情况并不顺利、存在问题”，不能机械译为“所有事情都不好”。","sec":"text2","sec_label":"Text 2","ctx":"Sadly, all is not well with astronomy in Hawaii today.","note":"表示“情况并不顺利、存在问题”，不能机械译为“所有事情都不好”。","forms":["all is not well"]},{"w":"promise to do","pos":"phr.","cn":"此处不是“承诺做某事”，而是“有望、很可能产生某种结果”。","sec":"text2","sec_label":"Text 2","ctx":"Protests have erupted over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity's view of the cosmos.","note":"此处不是“承诺做某事”，而是“有望、很可能产生某种结果”。","forms":["promise to do"]},{"w":"erupt over","pos":"phr.","cn":"因某事突然爆发。","sec":"text2","sec_label":"Text 2","ctx":"Protests have erupted over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity's view of the cosmos.","note":"因某事突然爆发。","forms":["erupt over"]},{"w":"observatory","pos":"词","cn":"天文台、观测站。","sec":"text2","sec_label":"Text 2","ctx":"Protests have erupted over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity's view of the cosmos.","note":"天文台、观测站。","forms":["observatory"]},{"w":"revolutionize humanity's view of","pos":"phr.","cn":"彻底改变人类看待某事物的方式。","sec":"text2","sec_label":"Text 2","ctx":"Protests have erupted over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity's view of the cosmos.","note":"彻底改变人类看待某事物的方式。","forms":["revolutionize humanity's view of"]},{"w":"at issue","pos":"phr.","cn":"处于争议中心、构成问题焦点。","sec":"text2","sec_label":"Text 2","ctx":"At issue is the TMT's planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens.","note":"处于争议中心、构成问题焦点。","forms":["at issue"]},{"w":"piko","pos":"词","cn":"夏威夷文化中的“中心、脐带式连接点”，此处指连接岛屿与天界的神圣纽带。","sec":"text2","sec_label":"Text 2","ctx":"At issue is the TMT's planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens.","note":"夏威夷文化中的“中心、脐带式连接点”，此处指连接岛屿与天界的神圣纽带。","forms":["piko"]},{"w":"dormant volcano","pos":"phr.","cn":"休眠火山。","sec":"text2","sec_label":"Text 2","ctx":"At issue is the TMT's planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens.","note":"休眠火山。","forms":["dormant volcano"]},{"w":"worship ... as ...","pos":"phr.","cn":"把……奉为……。","sec":"text2","sec_label":"Text 2","ctx":"At issue is the TMT's planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens.","note":"把……奉为……。","forms":["worship ... as ..."]},{"w":"be home to","pos":"phr.","cn":"是……的所在地、栖息地。","sec":"text2","sec_label":"Text 2","ctx":"But Mauna Kea is also home to some of the world's most powerful telescopes.","note":"是……的所在地、栖息地。","forms":["be home to"]},{"w":"the bulk of","pos":"phr.","cn":"……的大部分、主体，不指物体的“大体积”。","sec":"text2","sec_label":"Text 2","ctx":"Rested in the Pacific Ocean, Mauna Kea's peak rises above the bulk of our planet's dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed cla","note":"……的大部分、主体，不指物体的“大体积”。","forms":["the bulk of"]},{"w":"unsurpassed","pos":"v./adj.","cn":"未被超越的、无与伦比的。","sec":"text2","sec_label":"Text 2","ctx":"Rested in the Pacific Ocean, Mauna Kea's peak rises above the bulk of our planet's dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed cla","note":"未被超越的、无与伦比的。","forms":["unsurpassed"]},{"w":"vocal","pos":"adj.","cn":"常见义为“声音的”；此处指公开而强烈地表达意见的、敢于发声的。","sec":"text2","sec_label":"Text 2","ctx":"A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what ","note":"常见义为“声音的”；此处指公开而强烈地表达意见的、敢于发声的。","forms":["vocal"]},{"w":"occupation","pos":"n.","cn":"此处指对国家或领土的“占领”，不是职业。","sec":"text2","sec_label":"Text 2","ctx":"A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what ","note":"此处指对国家或领土的“占领”，不是职业。","forms":["occupation"]},{"w":"belong to","pos":"phr.","cn":"常见义为“属于”；此处表示责任“应归于、应由……承担”。","sec":"text2","sec_label":"Text 2","ctx":"Some blame for the current controversy belongs to astronomers.","note":"常见义为“属于”；此处表示责任“应归于、应由……承担”。","forms":["belong to"]},{"w":"in one's eagerness to do","pos":"phr.","cn":"由于急于做某事；常暗示急切使人忽略其他因素。","sec":"text2","sec_label":"Text 2","ctx":"In their eagerness to build bigger telescopes, they forgot that science is not the only way of understanding the world.","note":"由于急于做某事；常暗示急切使人忽略其他因素。","forms":["in one's eagerness to do"]},{"w":"prioritize","pos":"v.","cn":"确定优先次序；此处指把生态和神圣性置于首要位置。","sec":"text2","sec_label":"Text 2","ctx":"They did not always prioritize the protection of Mauna Kea's fragile ecosystems or its holiness to the island's inhabitants.","note":"确定优先次序；此处指把生态和神圣性置于首要位置。","forms":["prioritize"]},{"w":"holiness to sb.","pos":"phr.","cn":"对某人而言具有的神圣意义。","sec":"text2","sec_label":"Text 2","ctx":"They did not always prioritize the protection of Mauna Kea's fragile ecosystems or its holiness to the island's inhabitants.","note":"对某人而言具有的神圣意义。","forms":["holiness to sb."]},{"w":"relic","pos":"adj.","cn":"旧时代遗留下来的物件；此处比喻僵化、失去现实生命力的文化遗存。","sec":"text2","sec_label":"Text 2","ctx":"Hawaiian culture is not a relic of the past; it is a living culture undergoing a renaissance today.","note":"旧时代遗留下来的物件；此处比喻僵化、失去现实生命力的文化遗存。","forms":["relic"]},{"w":"undergo a renaissance","pos":"phr.","cn":"经历复兴、重新焕发生机。","sec":"text2","sec_label":"Text 2","ctx":"Hawaiian culture is not a relic of the past; it is a living culture undergoing a renaissance today.","note":"经历复兴、重新焕发生机。","forms":["undergo a renaissance"]},{"w":"the dawn of civilization","pos":"phr.","cn":"文明的开端；dawn 在此比喻某一历史阶段的初现。","sec":"text2","sec_label":"Text 2","ctx":"Yet science has a cultural history, too, with roots going back to the dawn of civilization.","note":"文明的开端；dawn 在此比喻某一历史阶段的初现。","forms":["the dawn of civilization"]},{"w":"the heavens","pos":"phr.","cn":"此处指天空、宇宙，而不是宗教意义上的天堂。","sec":"text2","sec_label":"Text 2","ctx":"The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii's shores inspires astronomers today to explore the heavens.","note":"此处指天空、宇宙，而不是宗教意义上的天堂。","forms":["the heavens"]},{"w":"calls to do","pos":"phr.","cn":"要求、呼吁做某事。","sec":"text2","sec_label":"Text 2","ctx":"Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questio","note":"要求、呼吁做某事。","forms":["calls to do"]},{"w":"disassemble","pos":"词","cn":"拆卸、拆除由多个部件组成的设施。","sec":"text2","sec_label":"Text 2","ctx":"Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questio","note":"拆卸、拆除由多个部件组成的设施。","forms":["disassemble"]},{"w":"seek to answer","pos":"phr.","cn":"试图回答、力求解答。","sec":"text2","sec_label":"Text 2","ctx":"Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questio","note":"试图回答、力求解答。","forms":["seek to answer"]},{"w":"calling","pos":"v./n.","cn":"常见义为“打电话、呼叫”；此处指内在而强烈的使命召唤。","sec":"text2","sec_label":"Text 2","ctx":"Perhaps that is why we explore the starry skies, as if answering a primal calling to know ourselves and our true ancestral homes.","note":"常见义为“打电话、呼叫”；此处指内在而强烈的使命召唤。","forms":["calling"]},{"w":"primal","pos":"adj.","cn":"原始的、本能深处的。","sec":"text2","sec_label":"Text 2","ctx":"Perhaps that is why we explore the starry skies, as if answering a primal calling to know ourselves and our true ancestral homes.","note":"原始的、本能深处的。","forms":["primal"]},{"w":"make compromises","pos":"phr.","cn":"作出让步、寻求折中。","sec":"text2","sec_label":"Text 2","ctx":"The astronomy community is making compromises to change its use of Mauna Kea.","note":"作出让步、寻求折中。","forms":["make compromises"]},{"w":"visibility","pos":"n.","cn":"此处不是天气意义上的“能见度”，而是设施从岛上其他地方被看见的程度。","sec":"text2","sec_label":"Text 2","ctx":"The TMT site was chosen to minimize the telescope's visibility around the island and to avoid archaeological and environmental impact.","note":"此处不是天气意义上的“能见度”，而是设施从岛上其他地方被看见的程度。","forms":["visibility"]},{"w":"lifetime","pos":"词","cn":"此处指设备的使用寿命，不指人的一生。","sec":"text2","sec_label":"Text 2","ctx":"To limit the number of telescopes on Mauna Kea, old ones will be removed at the end of their lifetimes and their sites returned to a natural state.","note":"此处指设备的使用寿命，不指人的一生。","forms":["lifetime"]},{"w":"return a site to a natural state","pos":"phr.","cn":"使场地恢复原本的自然状态。","sec":"text2","sec_label":"Text 2","ctx":"To limit the number of telescopes on Mauna Kea, old ones will be removed at the end of their lifetimes and their sites returned to a natural state.","note":"使场地恢复原本的自然状态。","forms":["return a site to a natural state"]},{"w":"that which","pos":"phr.","cn":"正式用法，相当于 what，指“……的事物”。","sec":"text3","sec_label":"Text 3","ctx":"Robert F. Kennedy once said that a country's GDP measures \"everything except that which makes life worthwhile.\"","note":"正式用法，相当于 what，指“……的事物”。","forms":["that which"]},{"w":"worthwhile","pos":"词","cn":"值得花费时间或精力的；make life worthwhile 指赋予生活价值与意义。","sec":"text3","sec_label":"Text 3","ctx":"Robert F. Kennedy once said that a country's GDP measures \"everything except that which makes life worthwhile.\"","note":"值得花费时间或精力的；make life worthwhile 指赋予生活价值与意义。","forms":["worthwhile"]},{"w":"timely","pos":"adv.","cn":"适时的、正合时宜的，不是“及时完成”的简单含义。","sec":"text3","sec_label":"Text 3","ctx":"With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.","note":"适时的、正合时宜的，不是“及时完成”的简单含义。","forms":["timely"]},{"w":"refer to","pos":"phr.","cn":"此处指言论具体表达、指向的含义。","sec":"text3","sec_label":"Text 3","ctx":"With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.","note":"此处指言论具体表达、指向的含义。","forms":["refer to"]},{"w":"annoy","pos":"词","cn":"常见义为“使恼怒”；此处更接近“长期困扰、令人为难”。","sec":"text3","sec_label":"Text 3","ctx":"The question of GDP and its usefulness has annoyed policymakers for over half a century.","note":"常见义为“使恼怒”；此处更接近“长期困扰、令人为难”。","forms":["annoy"]},{"w":"flawed","pos":"v./adj.","cn":"有根本缺陷的、不完善的。","sec":"text3","sec_label":"Text 3","ctx":"Many argue that it is a flawed concept.","note":"有根本缺陷的、不完善的。","forms":["flawed"]},{"w":"it","pos":"词","cn":"指前句的 GDP，而不是 GDP 的效用问题。","sec":"text3","sec_label":"Text 3","ctx":"Many argue that it is a flawed concept.","note":"指前句的 GDP，而不是 GDP 的效用问题。","forms":["it"]},{"w":"the envy of","pos":"phr.","cn":"令人羡慕的人或事物，并非“对……的嫉妒”。","sec":"text3","sec_label":"Text 3","ctx":"By most recent measures, the UK's GDP has been the envy of the Western world, with record low unemployment and high growth figures.","note":"令人羡慕的人或事物，并非“对……的嫉妒”。","forms":["the envy of"]},{"w":"figure","pos":"词","cn":"此处指统计数字、数据。","sec":"text3","sec_label":"Text 3","ctx":"By most recent measures, the UK's GDP has been the envy of the Western world, with record low unemployment and high growth figures.","note":"此处指统计数字、数据。","forms":["figure"]},{"w":"prospect","pos":"词","cn":"此处用复数，指未来的发展前景，而不是潜在客户或景色。","sec":"text3","sec_label":"Text 3","ctx":"If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country's economic prospects?","note":"此处用复数，指未来的发展前景，而不是潜在客户或景色。","forms":["prospect"]},{"w":"shed light on","pos":"phr.","cn":"阐明、帮助解释，不是字面上的“把光照在……上”。","sec":"text3","sec_label":"Text 3","ctx":"A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question.","note":"阐明、帮助解释，不是字面上的“把光照在……上”。","forms":["shed light on"]},{"w":"well-being","pos":"adj.","cn":"身心健康、生活质量与总体福祉，范围大于收入或快乐感。","sec":"text3","sec_label":"Text 3","ctx":"A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question.","note":"身心健康、生活质量与总体福祉，范围大于收入或快乐感。","forms":["well-being"]},{"w":"convert growth into well-being","pos":"phr.","cn":"把经济增长转化为民众福祉。","sec":"text3","sec_label":"Text 3","ctx":"A recent annual study of countries and their ability to convert growth into well-being sheds some light on that question.","note":"把经济增长转化为民众福祉。","forms":["convert growth into well-being"]},{"w":"performer","pos":"词","cn":"此处不是舞台上的“表演者”，而是按某项指标衡量的表现主体。","sec":"text3","sec_label":"Text 3","ctx":"Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens.","note":"此处不是舞台上的“表演者”，而是按某项指标衡量的表现主体。","forms":["performer"]},{"w":"meaningful","pos":"adj.","cn":"此处意为实质性的、真正产生影响的。","sec":"text3","sec_label":"Text 3","ctx":"Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens.","note":"此处意为实质性的、真正产生影响的。","forms":["meaningful"]},{"w":"rounded","pos":"v./adj.","cn":"常见义为“圆形的”；此处意为“全面的、兼顾多方面的”。","sec":"text3","sec_label":"Text 3","ctx":"Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessme","note":"常见义为“圆形的”；此处意为“全面的、兼顾多方面的”。","forms":["rounded"]},{"w":"theme","pos":"词","cn":"常见义为“主题”；此处指从跨国数据中反复出现的共同模式或趋势。","sec":"text3","sec_label":"Text 3","ctx":"While all of these countries face their own challenges, there are a number of consistent themes.","note":"常见义为“主题”；此处指从跨国数据中反复出现的共同模式或趋势。","forms":["theme"]},{"w":"budding","pos":"v./n.","cn":"本义为“正在发芽的”；此处比喻刚刚出现、尚处早期的。","sec":"text3","sec_label":"Text 3","ctx":"Yes, there has been a budding economic recovery since the 2008 global crash, but in key indicators in areas such as health and education, major economies have continued t","note":"本义为“正在发芽的”；此处比喻刚刚出现、尚处早期的。","forms":["budding"]},{"w":"crash","pos":"词","cn":"此处指严重的经济或金融危机，而非车辆碰撞。","sec":"text3","sec_label":"Text 3","ctx":"Yes, there has been a budding economic recovery since the 2008 global crash, but in key indicators in areas such as health and education, major economies have continued t","note":"此处指严重的经济或金融危机，而非车辆碰撞。","forms":["crash"]},{"w":"this","pos":"词","cn":"指前一句所说主要经济体在健康、教育等指标上持续下降。","sec":"text3","sec_label":"Text 3","ctx":"Yet this isn't the case with all countries.","note":"指前一句所说主要经济体在健康、教育等指标上持续下降。","forms":["this"]},{"w":"see improvements","pos":"phr.","cn":"此处以国家作主语，意为“经历、出现改善”，不是用眼睛看见。","sec":"text3","sec_label":"Text 3","ctx":"Some relatively poor European countries have seen huge improvements across measures including civil society, income equality and the environment.","note":"此处以国家作主语，意为“经历、出现改善”，不是用眼睛看见。","forms":["see improvements"]},{"w":"sole","pos":"词","cn":"唯一的、仅有的，强调排他性。","sec":"text3","sec_label":"Text 3","ctx":"This is a lesson that rich countries can learn: When GDP is no longer regarded as the sole measure of a country's success, the world looks very different.","note":"唯一的、仅有的，强调排他性。","forms":["sole"]},{"w":"look","pos":"词","cn":"此处是系动词，意为“呈现出某种样貌”。","sec":"text3","sec_label":"Text 3","ctx":"This is a lesson that rich countries can learn: When GDP is no longer regarded as the sole measure of a country's success, the world looks very different.","note":"此处是系动词，意为“呈现出某种样貌”。","forms":["look"]},{"w":"enough","pos":"词","cn":"此处不是指数量“足够”，而是说 GDP 作为国家成功的衡量尺度“不够全面”。","sec":"text3","sec_label":"Text 3","ctx":"So, what Kennedy was referring to was that while GDP has been the most common method for measuring the economic activity of nations, as a measure, it is no longer enough.","note":"此处不是指数量“足够”，而是说 GDP 作为国家成功的衡量尺度“不够全面”。","forms":["enough"]},{"w":"outcome","pos":"词","cn":"某一过程产生的结果或成效；education outcomes 指教育成效，而非单纯的考试成绩。","sec":"text3","sec_label":"Text 3","ctx":"It does not include important factors such as environmental quality or education outcomes - all things that contribute to a person's sense of well-being.","note":"某一过程产生的结果或成效；education outcomes 指教育成效，而非单纯的考试成绩。","forms":["outcome"]},{"w":"sense of well-being","pos":"phr.","cn":"个人对健康、安稳与生活质量的总体感受。","sec":"text3","sec_label":"Text 3","ctx":"It does not include important factors such as environmental quality or education outcomes - all things that contribute to a person's sense of well-being.","note":"个人对健康、安稳与生活质量的总体感受。","forms":["sense of well-being"]},{"w":"hit","pos":"词","cn":"此处作名词，指严重打击或负面冲击。","sec":"text3","sec_label":"Text 3","ctx":"The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.","note":"此处作名词，指严重打击或负面冲击。","forms":["hit"]},{"w":"doom","pos":"词","cn":"灾难性结局、厄运；这里指经济放缓所预示的严重后果。","sec":"text3","sec_label":"Text 3","ctx":"But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.","note":"灾难性结局、厄运；这里指经济放缓所预示的严重后果。","forms":["doom"]},{"w":"see progress","pos":"phr.","cn":"取得、见到实质进展。","sec":"text3","sec_label":"Text 3","ctx":"But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.","note":"取得、见到实质进展。","forms":["see progress"]},{"w":"refocus efforts on","pos":"phr.","cn":"重新把努力集中于……。","sec":"text3","sec_label":"Text 3","ctx":"But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.","note":"重新把努力集中于……。","forms":["refocus efforts on"]},{"w":"rather than","pos":"phr.","cn":"而不是；突出政策重心的重新排序。","sec":"text3","sec_label":"Text 3","ctx":"But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.","note":"而不是；突出政策重心的重新排序。","forms":["rather than"]},{"w":"overturn","pos":"词","cn":"此处是法律用语，指撤销、推翻原有判决。","sec":"text4","sec_label":"Text 4","ctx":"In a rare unanimous ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell.","note":"此处是法律用语，指撤销、推翻原有判决。","forms":["overturn"]},{"w":"conviction","pos":"n.","cn":"此处指法院作出的有罪判决，不是“坚定信念”。","sec":"text4","sec_label":"Text 4","ctx":"In a rare unanimous ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell.","note":"此处指法院作出的有罪判决，不是“坚定信念”。","forms":["conviction"]},{"w":"a unanimous ruling","pos":"phr.","cn":"全体法官一致作出的裁决。","sec":"text4","sec_label":"Text 4","ctx":"In a rare unanimous ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell.","note":"全体法官一致作出的裁决。","forms":["a unanimous ruling"]},{"w":"hold one's nose at","pos":"phr.","cn":"字面是“捏着鼻子面对”，此处比喻对某事感到厌恶、鄙夷。","sec":"text4","sec_label":"Text 4","ctx":"But it did so while holding its nose at the ethics of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking ac","note":"字面是“捏着鼻子面对”，此处比喻对某事感到厌恶、鄙夷。","forms":["hold one's nose at"]},{"w":"conduct","pos":"词","cn":"此处作名词，指人的行为、操守。","sec":"text4","sec_label":"Text 4","ctx":"But it did so while holding its nose at the ethics of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking ac","note":"此处作名词，指人的行为、操守。","forms":["conduct"]},{"w":"access to government","pos":"phr.","cn":"接近政府官员并影响政府流程的机会，不是进入政府大楼的物理权限。","sec":"text4","sec_label":"Text 4","ctx":"But it did so while holding its nose at the ethics of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking ac","note":"接近政府官员并影响政府流程的机会，不是进入政府大楼的物理权限。","forms":["access to government"]},{"w":"high court","pos":"phr.","cn":"此处特指前文的美国最高法院。","sec":"text4","sec_label":"Text 4","ctx":"The high court's decision said the judge in Mr. McDonnell's trial failed to tell a jury that it must look only at his \"official acts,\" or the former governor's decisions ","note":"此处特指前文的美国最高法院。","forms":["high court"]},{"w":"unsettled issue","pos":"phr.","cn":"尚未解决、仍待决定的事项，不是让人心神不宁的问题。","sec":"text4","sec_label":"Text 4","ctx":"The high court's decision said the judge in Mr. McDonnell's trial failed to tell a jury that it must look only at his \"official acts,\" or the former governor's decisions ","note":"尚未解决、仍待决定的事项，不是让人心神不宁的问题。","forms":["unsettled issue"]},{"w":"find","pos":"词","cn":"此处是司法语境中的“认定、裁定”，不是“发现”。","sec":"text4","sec_label":"Text 4","ctx":"Merely helping a gift-giver gain access to other officials, unless done with clear intent to pressure those officials, is not corruption, the justices found.","note":"此处是司法语境中的“认定、裁定”，不是“发现”。","forms":["find"]},{"w":"gift-giver","pos":"词","cn":"送礼者；文中指向官员赠送利益、希望获得政府渠道的一方。","sec":"text4","sec_label":"Text 4","ctx":"Merely helping a gift-giver gain access to other officials, unless done with clear intent to pressure those officials, is not corruption, the justices found.","note":"送礼者；文中指向官员赠送利益、希望获得政府渠道的一方。","forms":["gift-giver"]},{"w":"did suggest","pos":"phr.","cn":"助动词 did 用于强调，意为“确实指出”。","sec":"text4","sec_label":"Text 4","ctx":"The court did suggest that accepting favors in return for opening doors is \"distasteful\" and \"nasty.\"","note":"助动词 did 用于强调，意为“确实指出”。","forms":["did suggest"]},{"w":"open doors","pos":"phr.","cn":"为他人提供渠道、引荐关系，不是实际开门。","sec":"text4","sec_label":"Text 4","ctx":"The court did suggest that accepting favors in return for opening doors is \"distasteful\" and \"nasty.\"","note":"为他人提供渠道、引荐关系，不是实际开门。","forms":["open doors"]},{"w":"concrete","pos":"词","cn":"常见义为“混凝土”；此处意为明确、实在而可证实的。","sec":"text4","sec_label":"Text 4","ctx":"But under anti-bribery laws, proof must be made of concrete benefits, such as approval of a contract or regulation.","note":"常见义为“混凝土”；此处意为明确、实在而可证实的。","forms":["concrete"]},{"w":"benefit","pos":"词","cn":"此处指对送礼方作出的实际利益回报。","sec":"text4","sec_label":"Text 4","ctx":"But under anti-bribery laws, proof must be made of concrete benefits, such as approval of a contract or regulation.","note":"此处指对送礼方作出的实际利益回报。","forms":["benefit"]},{"w":"sound","pos":"词","cn":"常见义为“声音”；此处作形容词，意为论证充分、稳妥可靠的。","sec":"text4","sec_label":"Text 4","ctx":"The court's ruling is legally sound in defining a kind of favoritism that is not criminal.","note":"常见义为“声音”；此处作形容词，意为论证充分、稳妥可靠的。","forms":["sound"]},{"w":"favoritism","pos":"词","cn":"偏袒、徇私，指给予特定人不公平的优待。","sec":"text4","sec_label":"Text 4","ctx":"The court's ruling is legally sound in defining a kind of favoritism that is not criminal.","note":"偏袒、徇私，指给予特定人不公平的优待。","forms":["favoritism"]},{"w":"bureaucratic problems","pos":"phr.","cn":"行政官僚体系中的办事障碍。","sec":"text4","sec_label":"Text 4","ctx":"Elected leaders must be allowed to help supporters deal with bureaucratic problems without fear of prosecution for bribery.","note":"行政官僚体系中的办事障碍。","forms":["bureaucratic problems"]},{"w":"prosecution for bribery","pos":"phr.","cn":"因贿赂罪受到起诉。","sec":"text4","sec_label":"Text 4","ctx":"Elected leaders must be allowed to help supporters deal with bureaucratic problems without fear of prosecution for bribery.","note":"因贿赂罪受到起诉。","forms":["prosecution for bribery"]},{"w":"compact","pos":"词","cn":"常见义为“紧凑的”；此处作名词，意为构成政治制度基础的契约或约定。","sec":"text4","sec_label":"Text 4","ctx":"\"The basic compact underlying representative government,\" wrote Chief Justice John Roberts for the court, \"assumes that public officials will hear from their constituents","note":"常见义为“紧凑的”；此处作名词，意为构成政治制度基础的契约或约定。","forms":["compact"]},{"w":"constituent","pos":"词","cn":"选区选民，而非一般意义上的组成部分。","sec":"text4","sec_label":"Text 4","ctx":"\"The basic compact underlying representative government,\" wrote Chief Justice John Roberts for the court, \"assumes that public officials will hear from their constituents","note":"选区选民，而非一般意义上的组成部分。","forms":["constituent"]},{"w":"act on","pos":"phr.","cn":"根据某信息采取行动、着手处理。","sec":"text4","sec_label":"Text 4","ctx":"\"The basic compact underlying representative government,\" wrote Chief Justice John Roberts for the court, \"assumes that public officials will hear from their constituents","note":"根据某信息采取行动、着手处理。","forms":["act on"]},{"w":"reinforce","pos":"词","cn":"强化、进一步证实。","sec":"text4","sec_label":"Text 4","ctx":"But the ruling reinforces the need for citizens and their elected representatives, not the courts, to ensure equality of access to government.","note":"强化、进一步证实。","forms":["reinforce"]},{"w":"play favorites","pos":"phr.","cn":"偏袒某些人、厚此薄彼。","sec":"text4","sec_label":"Text 4","ctx":"Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a ","note":"偏袒某些人、厚此薄彼。","forms":["play favorites"]},{"w":"integrity","pos":"n.","cn":"此处指公共治理中的廉正、公平操守。","sec":"text4","sec_label":"Text 4","ctx":"This type of integrity requires well-enforced laws in government transparency, such as records of official meetings, rules on lobbying, and information about each elected","note":"此处指公共治理中的廉正、公平操守。","forms":["integrity"]},{"w":"well-enforced","pos":"v./adj.","cn":"得到有力执行的；法律存在并不等于实际落实。","sec":"text4","sec_label":"Text 4","ctx":"This type of integrity requires well-enforced laws in government transparency, such as records of official meetings, rules on lobbying, and information about each elected","note":"得到有力执行的；法律存在并不等于实际落实。","forms":["well-enforced"]},{"w":"fan","pos":"词","cn":"本义为“扇风”；此处作动词，意为煽动、助长。","sec":"text4","sec_label":"Text 4","ctx":"Favoritism in official access can fan public perceptions of corruption.","note":"本义为“扇风”；此处作动词，意为煽动、助长。","forms":["fan"]},{"w":"perception","pos":"n.","cn":"公众形成的看法或印象，不一定等于已经证实的事实。","sec":"text4","sec_label":"Text 4","ctx":"Favoritism in official access can fan public perceptions of corruption.","note":"公众形成的看法或印象，不一定等于已经证实的事实。","forms":["perception"]},{"w":"rather","pos":"词","cn":"此处用于纠正并精确表述，意为“更确切地说”，不是比较级的“更”。","sec":"text4","sec_label":"Text 4","ctx":"Rather officials must avoid double standards, or different types of access for average people and the wealthy.","note":"此处用于纠正并精确表述，意为“更确切地说”，不是比较级的“更”。","forms":["rather"]},{"w":"double standard","pos":"phr.","cn":"针对不同群体采用不一致的标准。","sec":"text4","sec_label":"Text 4","ctx":"Rather officials must avoid double standards, or different types of access for average people and the wealthy.","note":"针对不同群体采用不一致的标准。","forms":["double standard"]},{"w":"connection","pos":"n.","cn":"此处指能接近权力、获得特殊渠道的人脉关系。","sec":"text4","sec_label":"Text 4","ctx":"If connections can be bought, a basic premise of democratic society - that all are equal in treatment by government - is undermined.","note":"此处指能接近权力、获得特殊渠道的人脉关系。","forms":["connection"]},{"w":"premise","pos":"v.","cn":"制度赖以成立的基本前提。","sec":"text4","sec_label":"Text 4","ctx":"If connections can be bought, a basic premise of democratic society - that all are equal in treatment by government - is undermined.","note":"制度赖以成立的基本前提。","forms":["premise"]},{"w":"rest on","pos":"phr.","cn":"以……为基础、依赖于……。","sec":"text4","sec_label":"Text 4","ctx":"Good governance rests on an understanding of the inherent worth of each individual.","note":"以……为基础、依赖于……。","forms":["rest on"]},{"w":"inherent worth","pos":"phr.","cn":"与生俱来、不因财富或地位而改变的价值。","sec":"text4","sec_label":"Text 4","ctx":"Good governance rests on an understanding of the inherent worth of each individual.","note":"与生俱来、不因财富或地位而改变的价值。","forms":["inherent worth"]},{"w":"a step forward in the struggle against","pos":"phr.","cn":"在反对某事的斗争中取得的进展。","sec":"text4","sec_label":"Text 4","ctx":"The court's ruling is a step forward in the struggle against both corruption and official favoritism.","note":"在反对某事的斗争中取得的进展。","forms":["a step forward in the struggle against"]}],"sentences":[{"id":"2017-T1-P1-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"First two hours, now three hours - this is how far in advance authorities are recommending people show up to catch a domestic flight, at least at some major U.S. airports with increasingly massive security lines.","core":"This is how far in advance authorities are recommending people show up.","structure":"First two hours, now three hours 先用省略结构对比时间变化；how far in advance 引导表语从句；recommend people show up 为省略了连词 that 与情态动词 should 的宾语从句（虚拟语气用法，即 recommend [that] people [should] show up）；to catch ... 表目的；句末 at least ... 限定这一情况主要出现在部分大型机场。","key":"show up：常见义为“出现”；此处指按要求“到达机场、现身办理登机”。；massive：此处不是单纯形容体积“巨大”，而是指安检队伍规模庞大、拥堵严重。；how far in advance：提前多长时间。；catch a domestic flight：赶上国内航班。","zh":"起初要提前两小时，如今要提前三小时——这就是当局建议人们为赶上国内航班而提前到达的时间，至少在美国一些安检队伍日益庞大的主要机场是如此。","tip":"this 指前面的“先两小时、现三小时”这一提前量，不指安检队伍本身。"},{"id":"2017-T1-P2-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"The crash of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why.","core":"The crash provides another tragic reminder of why.","structure":"which terrorists may have downed ... 是非限制性定语从句，修饰 EgyptAir Flight 804；may have downed 表示对过去事件的推测。","key":"down：常见义为“向下”；此处作动词，意为“击落（飞机）”。；why：此处作名词性用法，概括前句所说“人们为何愿意忍受安检程序”。","zh":"埃及航空 804 号航班在地中海上空坠毁——该客机可能是被恐怖分子击落的——这一悲剧再次提醒人们为何愿意接受安检。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P2-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"But demanding too much of air travelers or providing too little security in return undermines public support for the process.","core":"Demanding ... or providing ... undermines public support.","structure":"两个并列的动名词短语共同作主语；in return 与前文呼应，强调旅客付出与安全回报失衡；for the process 修饰 support，其中 process 指机场安检流程。","key":"demand too much of sb.：对某人要求过多，不是“向某人索要某物”的普通含义。","zh":"但是，如果向航空旅客索取过多时间和精力，却只换来过少的安全保障，就会削弱公众对这一安检过程的支持。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P2-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"And it should: Wasted time is a drag on Americans' economic and private lives, not to mention infuriating.","core":"It should (undermine public support): Wasted time is a drag ...","structure":"冒号后解释公众理应不满的原因；not to mention infuriating 是省略结构，完整含义为“更不用说浪费时间还令人恼火”。","key":"drag：常见义为“拖拽”；此处作名词，意为“拖累、负担”。；it should：其中 it 指上一句的 demanding ... or providing ... 这一失衡做法，should 后省略 undermine public support。；not to mention：更不用说；在已有负面影响上补充更明显的后果。","zh":"而公众理应降低支持：被浪费的时间会拖累美国人的经济生活和私人生活，更不用说还会令人恼火。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P3-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Last year, the Transportation Security Administration (TSA) found in a secret check that undercover investigators were able to sneak weapons - both fake and real - past airport security nearly every time they tried.","core":"The TSA found that investigators were able to sneak weapons past security.","structure":"in a secret check 说明发现发生的场景；both fake and real 是插入成分，补充武器种类；nearly every time they tried 是时间状语，其中 tried 后省略了重复的 to sneak weapons past security。","key":"undercover investigator：秘密调查员、卧底调查人员。；sneak sth. past security：将某物偷偷带过安检。","zh":"去年，美国运输安全管理局（TSA）在一次秘密检查中发现，卧底调查人员几乎每次尝试都能把武器——无论仿制品还是真品——偷偷带过机场安检。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P3-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Enhanced security measures since then, combined with a rise in airline travel due to the improving economy and low oil prices, have resulted in long waits at major airports such as Chicago's O'Hare International.","core":"Enhanced security measures have resulted in long waits.","structure":"since then 修饰 enhanced；combined with ... 是过去分词短语，补充另一项共同因素；due to ... 说明航空出行增长的原因；such as ... 举例说明大型机场。","key":"enhanced security measures：加强后的安保措施。；a rise in airline travel：航空出行量增加。；result in：导致、造成。","zh":"自那以后加强的安检措施，再加上经济好转和低油价所推动的航空出行增长，已经导致芝加哥奥黑尔国际机场等大型机场出现长时间等候。","tip":"谓语 have 与复数中心词 Enhanced security measures 保持一致；combined with a rise ... 是插入的补充成分，不改变主谓一致关系，也不能把其中的 a rise 误认成主语。"},{"id":"2017-T1-P3-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"It is not yet clear how much more effective airline security has become - but the lines are obvious.","core":"It is not clear ... but the lines are obvious.","structure":"It 是形式主语，how much more effective airline security has become 是真正主语；破折号后的 but 把“不确定的安检成效”与“确定可见的拥堵成本”对照起来。","key":"line：此处指排队等候的人群或队伍，而不是线条。","zh":"航空安检究竟变得有效了多少尚不清楚——但排起的长队却显而易见。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P4-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Part of the issue is that the government did not anticipate the steep increase in airline travel, so the TSA is now rushing to get new screeners on the line.","core":"Part of the issue is that ... , so the TSA is rushing ...","structure":"that 引导表语从句，说明问题的具体内容；so 连接结果；to get new screeners on the line 是目的状语。","key":"screener：此处不是影视“审片人”，而是负责检查旅客与行李的“安检员”。；on the line：此处结合机场语境，指“投入一线、上岗工作”。","zh":"问题的一部分在于，政府没有预料到航空出行量会急剧增长，因此运输安全管理局如今正匆忙安排新的安检员上岗。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P4-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-baggage fees, though the airlines strongly dispute this.","core":"Another factor may be that more people are trying to overpack their bags.","structure":"that 引导表语从句；to avoid ... 表目的；though 引导让步状语从句，说明该原因仍有争议。","key":"overpack：装入过多物品、过度打包。；carry-on bag：随身携带上飞机的行李。；checked-baggage fee：托运行李费。；dispute a claim：对某种说法提出异议、否认其真实性。","zh":"另一个因素可能是，更多人为了避免托运行李费而设法往随身行李中塞入过多物品，尽管航空公司强烈否认这一说法。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P5-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"There is one step the TSA could take that would not require remodeling airports or rushing to hire: Enroll more people in the PreCheck program.","core":"There is one step: Enroll more people ...","structure":"the TSA could take 是省略关系代词的定语从句，修饰 step；that would not require ... 是第二个定语从句；冒号后给出这一步骤的具体内容。","key":"rush to hire：匆忙招聘。；enroll sb. in a program：使某人加入某项计划、为某人办理登记。","zh":"运输安全管理局可以采取一项既不需要改造机场、也不需要仓促招人的措施：让更多人加入 PreCheck 预检计划。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P5-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Passengers who pass a background check are eligible to use expedited screening lanes.","core":"Passengers are eligible to use screening lanes.","structure":"who pass a background check 是定语从句，限定哪些旅客可以进入专用通道；expedited 修饰 screening lanes，强调流程得到加速。","key":"expedited：由 expedite 变来，核心是“加快办理的、快速处理的”；结合通道分流语境，也体现队伍更顺畅、拥堵更少。；pass a background check：通过背景审查。；be eligible to do：有资格做某事。","zh":"通过背景审查的旅客有资格使用快捷安检通道。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P5-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"This allows the TSA to focus on travelers who are higher risk, saving time for everyone involved.","core":"This allows the TSA to focus on travelers.","structure":"This 指低风险旅客进入 PreCheck 通道的分流安排；who are higher risk 修饰 travelers；saving time ... 是现在分词短语，说明由此产生的结果。","key":"见下方词汇笔记","zh":"这样一来，运输安全管理局便可集中检查风险更高的旅客，从而为所有相关人员节省时间。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P6-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"It has not gotten anywhere close to that, and one big reason is sticker shock: Passengers must pay $85 every five years to process their background checks.","core":"It has not gotten close to that, and one reason is sticker shock.","structure":"第一个 It 指 PreCheck 计划；that 指招募 2,500 万人的目标；冒号后用具体费用解释 sticker shock。","key":"sticker shock：看到标价后因价格过高而震惊，即“价格冲击”，不是贴纸本身带来的惊吓。；process：此处作动词，指受理、办理背景审查手续。","zh":"该计划的实际参与人数远未接近这一目标，其中一个重要原因就是价格令人咋舌：旅客每五年必须支付 85 美元来办理背景审查。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P6-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"But Congress should look into doing so directly, by helping to finance PreCheck enrollment or to cut costs in other ways.","core":"Congress should look into doing so directly.","structure":"doing so 指把价格降到更合理水平；by helping ... or to cut ... 说明实现降价的两种方式，其中两个不定式均受 helping 的语义支配。","key":"look into：调查并研究可行办法，不是字面上的“向里面看”。","zh":"但国会应当研究如何直接促成降价，例如资助 PreCheck 登记，或以其他方式削减成本。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P7-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"The TSA cannot continue diverting resources into underused PreCheck lanes while most of the traveling public suffers in unnecessary lines.","core":"The TSA cannot continue diverting resources.","structure":"while 引导时间兼对比状语从句，把专用通道利用不足与普通旅客排长队并置。","key":"divert resources into：把资源转用于某处。；the traveling public：有出行需求的公众、广大旅客。","zh":"当绝大多数出行公众还在不必要的队伍中受苦时，运输安全管理局不能继续把资源转移到利用不足的 PreCheck 通道上。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T1-P7-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"It is long past time to make the program work.","core":"It is long past time to make the program work.","structure":"It 是形式主语，真正内容是 to make the program work；make ... work 指让制度在现实中有效运转，而非机械意义上的“工作”。","key":"long past time：早已超过应该行动的时间，语气比 it is time 更强，带有催促与批评。；in return for increased safety：以付出时间为代价换取更高安全保障。；undermine public support：削弱公众支持。；sneak weapons past security：把武器偷偷带过安检。","zh":"早就该让这一计划真正发挥作用了。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T2-P1-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"\"The ancient Hawaiians were astronomers,\" wrote Queen Liliuokalani, Hawaii's last reigning monarch, in 1897.","core":"Queen Liliuokalani wrote, \"...\"","structure":"引语被前置以突出主题；Hawaii's last reigning monarch 是同位语，补充女王身份；in 1897 说明写作时间。","key":"reigning monarch：在位君主；last reigning monarch 指君主制终结前最后实际统治的君主。","zh":"夏威夷最后一位在位君主莉莉乌卡拉尼女王于 1897 年写道：“古代夏威夷人就是天文学家。”","tip":"引语用 were 是因为谈论古代夏威夷人，并非说这种身份只存在于过去。"},{"id":"2017-T2-P1-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"Protests have erupted over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity's view of the cosmos.","core":"Protests have erupted over construction of the TMT.","structure":"a giant observatory 是 TMT 的同位语；that promises ... 是定语从句，说明这座天文台的科研潜力。","key":"promise to do：此处不是“承诺做某事”，而是“有望、很可能产生某种结果”。；erupt over：因某事突然爆发。；observatory：天文台、观测站。；revolutionize humanity's view of：彻底改变人类看待某事物的方式。","zh":"围绕三十米望远镜（TMT）的建设，抗议活动已经爆发；这座巨型天文台有望彻底改变人类观察宇宙的方式。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T2-P2-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"At issue is the TMT's planned location on Mauna Kea, a dormant volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens.","core":"At issue is the TMT's planned location on Mauna Kea.","structure":"表语 At issue 前置形成倒装；a dormant volcano 是 Mauna Kea 的同位语；worshiped ... 是过去分词短语；that connects ... 说明 piko 所具有的连接功能。","key":"at issue：处于争议中心、构成问题焦点。；piko：夏威夷文化中的“中心、脐带式连接点”，此处指连接岛屿与天界的神圣纽带。；dormant volcano：休眠火山。；worship ... as ...：把……奉为……。","zh":"争议的焦点是 TMT 计划选址于莫纳克亚山；这是一座休眠火山，被一些夏威夷人奉为连接夏威夷群岛与天界的 piko，即神圣中心。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T2-P2-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Rested in the Pacific Ocean, Mauna Kea's peak rises above the bulk of our planet's dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity.","core":"Mauna Kea's peak rises above the bulk of the atmosphere.","structure":"Rested in the Pacific Ocean 是置于句首的地点状态说明；where 引导非限制性定语从句，指山峰高处的观测环境；allow telescopes to obtain ... 为 allow + 宾语 + 不定式 结构。","key":"the bulk of：……的大部分、主体，不指物体的“大体积”。；unsurpassed：未被超越的、无与伦比的。","zh":"莫纳克亚山坐落于太平洋中，其山峰高出地球浓密大气层的主体部分；那里的观测条件使望远镜能够获得清晰度无与伦比的图像。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T2-P3-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the occupation of what was once a sovereign nation.","core":"A group have viewed their presence as disrespect and a reminder.","structure":"small but vocal 用转折说明群体人数少但声音大；their presence 指山上的望远镜；what was once a sovereign nation 是 of 后的宾语从句，指曾经作为主权国家存在的夏威夷。","key":"vocal：常见义为“声音的”；此处指公开而强烈地表达意见的、敢于发声的。；occupation：此处指对国家或领土的“占领”，不是职业。","zh":"一小群人数不多但敢于发声的夏威夷人与环保人士，长期以来一直把这些望远镜的存在视为对圣地的不敬，也视为一段痛苦往事的提醒——他们曾经拥有主权的国家遭到了占领。","tip":"a painful reminder 提醒的是夏威夷被占领的屈辱历史，不是天文学衰落或生态破坏本身。"},{"id":"2017-T2-P4-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"In their eagerness to build bigger telescopes, they forgot that science is not the only way of understanding the world.","core":"They forgot that science is not the only way.","structure":"In their eagerness ... 是原因兼状态状语；that 引导宾语从句；of understanding the world 修饰 way。","key":"in one's eagerness to do：由于急于做某事；常暗示急切使人忽略其他因素。","zh":"他们一心急于建造更大的望远镜，却忘记了科学并不是理解世界的唯一方式。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T2-P5-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Yet science has a cultural history, too, with roots going back to the dawn of civilization.","core":"Science has a cultural history, too.","structure":"with roots going back ... 是 with + 名词 + 现在分词 的伴随结构，说明科学文化史源远流长。","key":"the dawn of civilization：文明的开端；dawn 在此比喻某一历史阶段的初现。","zh":"然而，科学同样拥有自身的文化史，其根源可以追溯到文明初现之时。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T2-P5-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii's shores inspires astronomers today to explore the heavens.","core":"The same curiosity inspires astronomers to explore the heavens.","structure":"to find what lies beyond the horizon 说明 curiosity 的具体内容，其中 what 引导宾语从句；that first brought ... 是定语从句，也修饰 curiosity；主语很长，真正谓语直到 inspires 才出现。","key":"the heavens：此处指天空、宇宙，而不是宗教意义上的天堂。","zh":"正是那种想要发现地平线之外有何事物的好奇心，最初把早期波利尼西亚人带到了夏威夷海岸；如今，同样的好奇心又激励着天文学家探索苍穹。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T2-P5-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Calls to disassemble all telescopes on Mauna Kea or to ban future development there ignore the reality that astronomy and Hawaiian culture both seek to answer big questions about who we are, where we come from and where we are going.","core":"Calls ignore the reality.","structure":"两个 to 不定式并列修饰 Calls；that 引导同位语从句，解释 reality；三个 who/where/where 从句并列作 about 的宾语。","key":"calls to do：要求、呼吁做某事。；disassemble：拆卸、拆除由多个部件组成的设施。；seek to answer：试图回答、力求解答。","zh":"要求拆除莫纳克亚山上所有望远镜，或禁止今后在那里继续开发的呼声，忽视了一个事实：天文学与夏威夷文化都试图回答有关我们是谁、从何而来以及将去往何方的重大问题。","tip":"作者不是说两种文化给出的答案相同，而是说二者都追问人类身份、起源与未来。"},{"id":"2017-T2-P5-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"Perhaps that is why we explore the starry skies, as if answering a primal calling to know ourselves and our true ancestral homes.","core":"That is why we explore the starry skies.","structure":"that 指科学与夏威夷文化共同追问人类身份和起源；why 引导表语从句；as if answering ... 是省略了主语和 were 的方式状语。","key":"calling：常见义为“打电话、呼叫”；此处指内在而强烈的使命召唤。；primal：原始的、本能深处的。","zh":"或许，这正是我们探索星空的原因，仿佛是在回应一种原始召唤：去认识我们自己，也去寻找我们真正的祖先家园。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T2-P6-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The TMT site was chosen to minimize the telescope's visibility around the island and to avoid archaeological and environmental impact.","core":"The TMT site was chosen.","structure":"两个并列不定式 to minimize ... and to avoid ... 都表选址目的；around the island 指从岛上不同位置观察时。","key":"visibility：此处不是天气意义上的“能见度”，而是设施从岛上其他地方被看见的程度。","zh":"TMT 的具体地点经过选择，目的是尽量降低望远镜在岛上各处的可见度，并避免对考古遗存和环境造成影响。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T2-P6-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"To limit the number of telescopes on Mauna Kea, old ones will be removed at the end of their lifetimes and their sites returned to a natural state.","core":"Old ones will be removed and their sites (will be) returned.","structure":"句首不定式表目的；ones 代替 telescopes；第二个并列分句省略与前面相同的 will be。","key":"lifetime：此处指设备的使用寿命，不指人的一生。；return a site to a natural state：使场地恢复原本的自然状态。","zh":"为限制莫纳克亚山上的望远镜数量，旧望远镜将在使用寿命结束时被拆除，其原址也将恢复自然状态。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T2-P6-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"There is no reason why everyone cannot be welcomed on Mauna Kea to embrace their cultural heritage and to study the stars.","core":"There is no reason why everyone cannot be welcomed.","structure":"why 引导定语从句，修饰 reason；两个 to 不定式并列表示来到山上的目的。","key":"all is not well with：某事并非一切顺利。；be home to：是……的所在地。；a small but vocal group：人数少但敢于公开发声的群体。；in one's eagerness to do：由于急于做某事。","zh":"完全没有理由不能欢迎所有人来到莫纳克亚山，既拥抱自己的文化遗产，也研究群星。","tip":"no reason ... cannot 是双重否定，实际表达肯定立场：文化传承与科学研究可以在此共存。"},{"id":"2017-T3-P1-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Robert F. Kennedy once said that a country's GDP measures \"everything except that which makes life worthwhile.\"","core":"Robert F. Kennedy said that GDP measures everything except ...","structure":"that 引导宾语从句；except 排除 GDP 无法衡量的部分；which makes life worthwhile 是定语从句，修饰第二个 that 所指的事物。","key":"that which：正式用法，相当于 what，指“……的事物”。；worthwhile：值得花费时间或精力的；make life worthwhile 指赋予生活价值与意义。","zh":"罗伯特·F·肯尼迪曾说，一个国家的国内生产总值衡量了“一切，却唯独没有衡量那些让生活值得一过的事物”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was referring to.","core":"It is now a timely moment to assess ...","structure":"With Britain voting ... and GDP ... predicted ... 是 with 复合结构，给出时代背景；it 是形式主语；真正主语是 to assess ...；what 引导宾语从句。","key":"timely：适时的、正合时宜的，不是“及时完成”的简单含义。；refer to：此处指言论具体表达、指向的含义。","zh":"如今，英国已经投票决定退出欧盟，而且据预测 GDP 将因此放缓，正是重新审视肯尼迪所指问题的恰当时机。","tip":"as a result 指 GDP 因英国脱欧而被预测放缓，并非因为作者开展评估而放缓。"},{"id":"2017-T3-P2-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"It measures things that do not matter and misses things that do.","core":"It measures things and misses things.","structure":"两个 that 分别引导定语从句；句末 do 替代 matter，完整含义为 things that do matter。","key":"见下方词汇笔记","zh":"它衡量了一些无关紧要的事物，却漏掉了真正重要的事物。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T3-P2-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"By most recent measures, the UK's GDP has been the envy of the Western world, with record low unemployment and high growth figures.","core":"The UK's GDP has been the envy of the Western world.","structure":"By most recent measures 表示依据；with record low unemployment and high growth figures 是伴随结构，列举 GDP 表现优异的证据。","key":"the envy of：令人羡慕的人或事物，并非“对……的嫉妒”。；figure：此处指统计数字、数据。","zh":"按照最新的大多数衡量结果，英国的 GDP 一直令西方世界羡慕，其失业率创下历史低点，增长数据也很高。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T3-P2-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"If everything was going so well, then why did over 17 million people vote for Brexit, despite the warnings about what it could do to their country's economic prospects?","core":"If everything was going well, why did people vote for Brexit?","structure":"If 引导条件状语从句；despite 引出让步成分；what it could do ... 是介词 about 后的宾语从句，其中 it 指 Brexit。","key":"prospect：此处用复数，指未来的发展前景，而不是潜在客户或景色。","zh":"如果一切真的如此顺利，那么为什么有超过 1,700 万人不顾脱欧可能损害本国经济前景的警告，仍投票支持英国脱欧？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T3-P3-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is translated into meaningful improvements for its citizens.","core":"The UK is one of the poorest performers.","structure":"Across the 163 countries measured 给出比较范围，measured 是过去分词修饰 countries；in ensuring ... 说明表现差的具体方面；that 引导 ensuring 的宾语从句。","key":"performer：此处不是舞台上的“表演者”，而是按某项指标衡量的表现主体。；meaningful：此处意为实质性的、真正产生影响的。","zh":"在接受衡量的 163 个国家中，英国在确保经济增长转化为公民切实的生活改善方面，是表现最差的国家之一。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T3-P3-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"Rather than just focusing on GDP, over 40 different sets of criteria from health, education and civil society engagement have been measured to get a more rounded assessment of how countries are performing.","core":"Over 40 different sets of criteria have been measured.","structure":"Rather than ... 表示取舍；from health, education and ... 举例说明标准来源；to get ... 表目的；how countries are performing 是介词 of 后的宾语从句。","key":"rounded：常见义为“圆形的”；此处意为“全面的、兼顾多方面的”。","zh":"该研究并非只关注 GDP，而是衡量了健康、教育和公民社会参与等 40 多组不同标准，以便更全面地评估各国表现。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T3-P4-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Yes, there has been a budding economic recovery since the 2008 global crash, but in key indicators in areas such as health and education, major economies have continued to decline.","core":"There has been a recovery, but major economies have continued to decline.","structure":"Yes 表示先承认经济复苏；but 引出与之相反的社会指标；两个 in 短语层层限定“在哪些领域的哪些指标上”。","key":"budding：本义为“正在发芽的”；此处比喻刚刚出现、尚处早期的。；crash：此处指严重的经济或金融危机，而非车辆碰撞。","zh":"诚然，自 2008 年全球经济崩溃以来，经济复苏已初露萌芽；但在健康和教育等领域的关键指标上，主要经济体却持续下滑。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T3-P5-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"This is a lesson that rich countries can learn: When GDP is no longer regarded as the sole measure of a country's success, the world looks very different.","core":"This is a lesson: the world looks very different.","structure":"that rich countries can learn 是定语从句，修饰 lesson；冒号后说明教训内容；When 引导条件兼时间状语从句。","key":"sole：唯一的、仅有的，强调排他性。；look：此处是系动词，意为“呈现出某种样貌”。","zh":"这是富裕国家可以吸取的一课：当 GDP 不再被视为衡量一个国家成功与否的唯一标准时，世界会呈现出截然不同的面貌。","tip":"This 指相对贫穷国家在多项福祉指标上进步、主要经济体反而下滑这一跨国对比。"},{"id":"2017-T3-P6-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"So, what Kennedy was referring to was that while GDP has been the most common method for measuring the economic activity of nations, as a measure, it is no longer enough.","core":"What Kennedy was referring to was that ... it is no longer enough.","structure":"what 引导主语从句；that 引导表语从句；其中 while 引导让步状语从句；插入语 as a measure 重新限定 it 的评价角度。","key":"enough：此处不是指数量“足够”，而是说 GDP 作为国家成功的衡量尺度“不够全面”。","zh":"因此，肯尼迪的意思是：尽管 GDP 一直是衡量各国经济活动最常用的方法，但作为一种评价尺度，它已经不再充分。","tip":"表语从句中的 it 指 GDP；作者否定的是 GDP 的充分性，不是否定其衡量经济活动的全部价值。"},{"id":"2017-T3-P6-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"It does not include important factors such as environmental quality or education outcomes - all things that contribute to a person's sense of well-being.","core":"It does not include important factors.","structure":"such as ... 举例；破折号后的 all things 是前述因素的同位概括；that contribute ... 是定语从句。","key":"outcome：某一过程产生的结果或成效；education outcomes 指教育成效，而非单纯的考试成绩。；sense of well-being：个人对健康、安稳与生活质量的总体感受。","zh":"它没有纳入环境质量、教育成果等重要因素，而这些都会影响一个人的幸福感与生活福祉。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T3-P7-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"The sharp hit to growth predicted around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth.","core":"The sharp hit could lead to a decline in the everyday services.","structure":"to growth 说明冲击对象；predicted ... 是过去分词短语，修饰 hit；we depend on ... 是省略关系代词的定语从句，修饰 services。","key":"hit：此处作名词，指严重打击或负面冲击。","zh":"据预测，全球和英国的经济增长都将遭受猛烈冲击，这可能导致我们赖以维持福祉并支撑增长的日常公共服务出现衰退。","tip":"句末两个 for 分别表示这些服务对“福祉”和“增长”都不可或缺。"},{"id":"2017-T3-P7-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"But policymakers who refocus efforts on improving well-being rather than simply worrying about GDP figures could avoid the forecasted doom and may even see progress.","core":"Policymakers could avoid the doom and may even see progress.","structure":"who refocus ... 是定语从句，限定能够扭转局势的政策制定者；improving ... rather than ... worrying ... 对比两种政策关注点。","key":"doom：灾难性结局、厄运；这里指经济放缓所预示的严重后果。；see progress：取得、见到实质进展。；refocus efforts on：重新把努力集中于……。；rather than：而不是；突出政策重心的重新排序。","zh":"但是，如果政策制定者重新把精力集中在改善民众福祉上，而非只是担忧 GDP 数字，就可能避免预测中的灾难，甚至看到进步。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T4-P1-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"In a rare unanimous ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell.","core":"The US Supreme Court has overturned the corruption conviction.","structure":"In a rare unanimous ruling 说明方式与裁决特征；of a former Virginia governor 指明被定罪者；Robert McDonnell 是同位语。","key":"overturn：此处是法律用语，指撤销、推翻原有判决。；conviction：此处指法院作出的有罪判决，不是“坚定信念”。；a unanimous ruling：全体法官一致作出的裁决。","zh":"美国最高法院罕见地作出全体一致裁决，推翻了对弗吉尼亚州前州长罗伯特·麦克唐奈的腐败定罪。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T4-P1-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"But it did so while holding its nose at the ethics of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government.","core":"It did so while holding its nose at the ethics of his conduct.","structure":"it 指最高法院；did so 替代前句的 overturned the conviction；while 引导伴随状语；which included ... 是非限制性定语从句，修饰 conduct；seeking access ... 修饰 company。","key":"hold one's nose at：字面是“捏着鼻子面对”，此处比喻对某事感到厌恶、鄙夷。；conduct：此处作名词，指人的行为、操守。；access to government：接近政府官员并影响政府流程的机会，不是进入政府大楼的物理权限。","zh":"但最高法院在这样做时，对其行为的道德性却明显表现出厌恶；他的行为包括收受一家谋求接触政府的公司所赠送的劳力士手表和法拉利汽车等礼物。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T4-P2-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The high court's decision said the judge in Mr. McDonnell's trial failed to tell a jury that it must look only at his \"official acts,\" or the former governor's decisions on \"specific\" and \"unsettled\" issues related to his duties.","core":"The decision said (that) the judge failed to tell a jury ...","structure":"said 后省略宾语从句连接词 that；that it must look ... 是 tell 的宾语从句，it 指陪审团；or 后是对 official acts 的同位解释；related to his duties 修饰 issues。","key":"high court：此处特指前文的美国最高法院。；unsettled issue：尚未解决、仍待决定的事项，不是让人心神不宁的问题。","zh":"最高法院的判决指出，麦克唐奈案的审判法官未能告知陪审团：陪审团只能审查他的“公务行为”，也就是这位前州长就与其职责相关的“具体”且“尚未解决”的事项所作决定。","tip":"official acts 并非官员任期内所做的一切，而被限定为处理职责范围内具体、悬而未决事项的决定。"},{"id":"2017-T4-P3-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Merely helping a gift-giver gain access to other officials, unless done with clear intent to pressure those officials, is not corruption, the justices found.","core":"Merely helping a gift-giver gain access is not corruption.","structure":"动名词短语作主语；help + 宾语 + 动词原形 中 gain 不带 to；unless done ... 是省略结构，完整为 unless it is done ...；the justices found 是后置的引述语。","key":"find：此处是司法语境中的“认定、裁定”，不是“发现”。；gift-giver：送礼者；文中指向官员赠送利益、希望获得政府渠道的一方。","zh":"大法官们认定，仅仅帮助送礼者接触其他官员并不构成腐败，除非这样做时带有向那些官员施压的明确意图。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T4-P4-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"But under anti-bribery laws, proof must be made of concrete benefits, such as approval of a contract or regulation.","core":"Proof must be made of concrete benefits.","structure":"under anti-bribery laws 给出法律框架；such as ... 举例说明何为具体回报。","key":"concrete：常见义为“混凝土”；此处意为明确、实在而可证实的。；benefit：此处指对送礼方作出的实际利益回报。","zh":"但是，依照反贿赂法，必须证明送礼者获得了合同获批或法规获准等具体利益回报。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T4-P4-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Simply arranging a meeting, making a phone call, or hosting an event is not an \"official act\".","core":"Arranging ..., making ..., or hosting ... is not an official act.","structure":"三个并列动名词短语共同构成一个列举性主语，因此谓语使用单数 is。","key":"见下方词汇笔记","zh":"仅仅安排会面、拨打一通电话或主办一场活动，并不属于“公务行为”。","tip":"法院不是说这些行为在道德上没有问题，而是说它们单独存在时不满足反贿赂法中 official act 的刑事门槛。"},{"id":"2017-T4-P5-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The court's ruling is legally sound in defining a kind of favoritism that is not criminal.","core":"The court's ruling is legally sound.","structure":"in defining ... 说明裁决合理之处；that is not criminal 是定语从句，修饰 favoritism。","key":"sound：常见义为“声音”；此处作形容词，意为论证充分、稳妥可靠的。；favoritism：偏袒、徇私，指给予特定人不公平的优待。","zh":"法院的裁决在法律上是合理的，因为它界定了一类虽属偏袒却不构成犯罪的行为。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T4-P5-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Elected leaders must be allowed to help supporters deal with bureaucratic problems without fear of prosecution for bribery.","core":"Elected leaders must be allowed to help supporters.","structure":"help supporters deal with ... 使用 help + 宾语 + 动词原形；without fear of ... 表示不应承受的法律顾虑。","key":"bureaucratic problems：行政官僚体系中的办事障碍。；prosecution for bribery：因贿赂罪受到起诉。","zh":"必须允许民选领导人帮助支持者处理官僚体系中的问题，而不必担心仅因此就受到贿赂罪起诉。","tip":"作者允许的是代表回应选民、解决行政问题，不是允许官员以收礼为条件提供特殊回报。"},{"id":"2017-T4-P5-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"\"The basic compact underlying representative government,\" wrote Chief Justice John Roberts for the court, \"assumes that public officials will hear from their constituents and act on their concerns.\"","core":"The basic compact assumes that public officials will hear ... and act ...","structure":"引语被 wrote Chief Justice ... 分隔；underlying representative government 是现在分词短语，修饰 compact；that 引导宾语从句，其中两个谓语 hear 与 act 并列。","key":"compact：常见义为“紧凑的”；此处作名词，意为构成政治制度基础的契约或约定。；constituent：选区选民，而非一般意义上的组成部分。；act on：根据某信息采取行动、着手处理。","zh":"首席大法官约翰·罗伯茨代表法院写道：“代议制政府赖以建立的基本契约，预设了公职人员会听取选民意见并回应他们关切的问题。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T4-P6-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"But the ruling reinforces the need for citizens and their elected representatives, not the courts, to ensure equality of access to government.","core":"The ruling reinforces the need.","structure":"for citizens and their elected representatives ... to ensure ... 是 for + 名词 + 不定式 结构，说明由谁满足这一需要；not the courts 是插入的对比成分。","key":"reinforce：强化、进一步证实。；access to government：向政府反映诉求、接触公职人员和进入决策沟通渠道的机会。","zh":"但是，这项裁决进一步表明：确保人们享有平等的政府接触渠道，需要依靠公民及其民选代表，而不是法院。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T4-P6-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign donation or a personal gift.","core":"Officials must not be allowed to play favorites.","structure":"两个 in 短语并列说明偏袒发生的场景；because 引导原因状语从句，揭示不得作为优待依据的金钱或礼物关系。","key":"play favorites：偏袒某些人、厚此薄彼。","zh":"不得允许官员仅仅因为某个个人或团体提供了竞选捐款或私人礼物，就在提供信息或安排会面时偏袒对方。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T4-P6-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"This type of integrity requires well-enforced laws in government transparency, such as records of official meetings, rules on lobbying, and information about each elected leader's source of wealth.","core":"This type of integrity requires well-enforced laws.","structure":"in government transparency 限定法律领域；such as 后列出三类制度工具。","key":"integrity：此处指公共治理中的廉正、公平操守。；well-enforced：得到有力执行的；法律存在并不等于实际落实。","zh":"要维护这种廉正，就需要有执行有力的政府透明度法律，例如公开公务会面记录、制定游说规则，以及披露每位民选领导人的财富来源。","tip":"records、rules 和 information 是透明度法律所要求公开或规范的内容，不是三部具体法律的名称。"},{"id":"2017-T4-P7-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"If connections can be bought, a basic premise of democratic society - that all are equal in treatment by government - is undermined.","core":"If connections can be bought, a basic premise is undermined.","structure":"If 引导条件状语从句；两个破折号之间的 that 从句是 premise 的同位语，解释民主社会的基本前提。","key":"connection：此处指能接近权力、获得特殊渠道的人脉关系。；premise：制度赖以成立的基本前提。","zh":"如果人脉渠道可以买到，那么民主社会的一项基本前提——所有人都应受到政府平等对待——就会遭到破坏。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2017-T4-P8-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The court's ruling is a step forward in the struggle against both corruption and official favoritism.","core":"The court's ruling is a step forward.","structure":"in the struggle against ... 修饰 step forward；both ... and ... 并列作者认为该裁决有助于遏制的两类问题。","key":"a step forward in the struggle against：在反对某事的斗争中取得的进展。；overturn a conviction：推翻有罪判决。；hold one's nose at：对……表现出厌恶或鄙夷。；in return for opening doors：以打通关系渠道作为交换。","zh":"法院的这项裁决，是同时反对腐败与官员偏袒的斗争向前迈出的一步。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"}]};</script>

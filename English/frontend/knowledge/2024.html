  <script>window.__PAPER__ = {"meta":{"year":2024,"exam":"2024 年全国硕士研究生招生考试","subject":"英语（一）","topics":["低成本技术的变革力量","从狩猎采集社会借鉴共同养育","艺术家对生成式 AI 版权与隐私风险的回应","美国最高法院裁决后切萨皮克湾湿地保护面临的跨州治理问题"],"overview":"- 主题：四篇文章依次讨论低成本技术的变革力量、从狩猎采集社会借鉴共同养育、艺术家对生成式 AI 版权与隐私风险的回应，以及美国最高法院裁决后切萨皮克湾湿地保护面临的跨州治理问题。\n- 行文逻辑：各篇分别以钉子价格史、非洲共同养育实践、艺术家姓名被用作 AI 提示词和切萨皮克湾生态价值切入，通过历史比较、研究数据、人物经历或法律影响分析揭示问题，最终提出具有现实指向的判断或行动建议。","full":true,"stats":{"sentences":64,"vocab":191}},"sections":[{"id":"cloze","label":"完形填空","kind":"Use of English","score":10,"count":20,"focus":"逻辑关系 · 词义辨析 · 固定搭配"},{"id":"reading","label":"阅读理解","kind":"Part A","score":40,"count":20,"focus":"定位 · 同义替换 · 段落功能 · 主旨态度"},{"id":"partb","label":"新题型","kind":"Part B","score":10,"count":5,"focus":"衔接 · 指代 · 段落顺序 / 匹配"},{"id":"partc","label":"翻译","kind":"Part C","score":10,"count":5,"focus":"长句拆分 · 语序 · 术语准确"},{"id":"writing","label":"写作","kind":"Part A + B","score":30,"count":2,"focus":"任务覆盖 · 结构 · 句式 · 准确度"}],"cloze":{"title":"完形填空","score":10,"count":20},"reading":[{"id":"text1","title":"Text 1","questions":[{"n":21,"stem":"The Romans buried the nails probably for the sake of ____"},{"n":22,"stem":"The example of early 17th-century Virginians is used to ____"},{"n":23,"stem":"What played the major role in lowering the price of nails after the late 1700s?"},{"n":24,"stem":"It can be learned from Paragraph 5 that nails ____"},{"n":25,"stem":"Which of the following best summarises the last two paragraphs?"}]},{"id":"text2","title":"Text 2","questions":[{"n":26,"stem":"According to the first two paragraphs, alloparenting refers to the practice of ____"},{"n":27,"stem":"The scheme in Germany is mentioned to illustrate ____"},{"n":28,"stem":"According to Paragraph 4, the “intensive mothering narrative” ____"},{"n":29,"stem":"According to Paragraph 6, what can we learn about the nurseries in the UK?"},{"n":30,"stem":"Which of the following would be the best title for the text?"}]},{"id":"text3","title":"Text 3","questions":[{"n":31,"stem":"What can be learned about Rutkowski from the first two paragraphs?"},{"n":32,"stem":"The problem with open-source AI art generators is that they ____"},{"n":33,"stem":"After searching online, Rutkowski found ____"},{"n":34,"stem":"According to Ortiz, AI companies are advised to ____"},{"n":35,"stem":"What is the text mainly about?"}]},{"id":"text4","title":"Text 4","questions":[{"n":36,"stem":"The Chesapeake Bay is described in Paragraph 1 as ____"},{"n":37,"stem":"The U.S. Supreme Court’s ruling in the Idaho case ____"},{"n":38,"stem":"How does the author feel about future of the Chesapeake Bay?"},{"n":39,"stem":"What can be inferred about the EPA’s involvement in the Chesapeake Bay Program?"},{"n":40,"stem":"The author holds that the state lawmakers should ____"}]}],"partb":{"type":"matching","title":"新题型 · 观点匹配","cn_title":"关于美国博物馆归还文物的五种声音","directions":"Read the following comments on a report about American museums returning artifacts to their countries of origin and a list of statements summarizing the comments. Choose the best statement from the list A-G for each numbered name (41-45). There are two extra choices which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)"},"partc":{"title":"翻译","cn_title":"大象的记忆、嗅觉与觅食智慧","directions":"Read the following text carefully and then translate the underlined segments into Chinese. Write your answers on the ANSWER SHEET. (10 points)"},"writing":{"partA":{"title":"Part A · 电子邮件","score":10,"words":"约100词","prompt":"Read the following email from an international student and write a reply.\n\nDear Li Ming,\nI've got a class assignment to make an oral report on an ancient Chinese scientist, but I'm not sure how to prepare for it. Can you give me some advice? Thank you for your help.\nYours,\nPaul\n\nWrite your answer in about 100 words on the ANSWER SHEET. Do not use your own name in your email; use “Li Ming” instead. (10 points)","prompt_zh":"阅读下面这封来自国际学生的邮件，并写一封回信。\n\n亲爱的李明：\n我有一项课堂作业，要做一场关于中国古代科学家的口头报告，但我不太确定该如何准备。你能给我一些建议吗？谢谢你的帮助。\n你的\n保罗\n\n请在答题卡上写约 100 词。不要在邮件中使用自己的真实姓名，用“李明”代替。","structure":[["称呼","Dear Paul,"],["回应来信、表明愿意帮忙","I'm glad to hear about your oral report, and I'd be happy to help."],["建议一：选题聚焦一项成就","First, choose a scientist with one clear achievement. Zhang Heng and his seismoscope, or Li Shizhen and the Compendium of Materia Medica, would both work well."],["建议二：按“人物—成就—意义”三段式组织","Then organize the talk in three parts: who the person was, what he did, and why it still matters today."],["建议三：语言浅显、配图辅助","Keep your language simple, explain technical terms in plain words, and put a picture or a short timeline on your slide."],["建议四：出声演练并计时","Finally, rehearse aloud twice and time yourself, since ten minutes passes quickly."],["提供后续帮助与落款","If you send me your draft, I can check the English for you. Good luck! Yours, Li Ming"]],"expressions":["I'm glad to hear about... and I'd be happy to help.","Here are a few suggestions.","choose a scientist with one clear achievement","organize the talk in three parts: who..., what..., and why...","keep your language simple","explain technical terms in plain words","put a picture or a short timeline on your slide","rehearse aloud twice and time yourself","If you send me your draft, I can check the English for you.","Good luck with your report!"],"traps":["题目要求“回复国际学生 Paul 的邮件”，称呼用 Dear Paul、结尾署名 Li Ming，语气友好平等；不能写成给教授或机构的正式申请信，也不能使用自己的真实姓名。","核心任务是“就如何准备中国古代科学家口头报告给建议”，必须落到选题、结构、语言、幻灯片、演练等可操作的做法上；只写“加油，你一定行”或大段介绍某位科学家的生平，都不解决问题。","约 100 词，建议三到四条即可，每条一句话说清；不必面面俱到写成演讲稿指南，也不要展开成说明文。","可用 First / Then / Finally 等标记使建议层次分明；时态以一般现在时和祈使句为主，回信开头要回应来信，结尾可主动提供进一步帮助。","署名只能是 Li Ming，且要保留电子邮件的基本格式（称呼、正文、结束语、署名），不要漏掉落款。"]},"partB":{"title":"Part B · 图画+图表作文","score":20,"words":"160–200词","prompt":"Write an essay based on the picture and the chart below. In your essay, you should 1) describe the picture and the chart briefly, 2) interpret the implied meaning, and 3) give your comments. Write your answer in 160-200 words on the ANSWER SHEET. (20 points)","prompt_zh":"根据下面的图画和图表写一篇短文。文中应：1）简要描述图画和图表；2）解释其隐含意义；3）给出你的评论。请在答题卡上写 160—200 词。","structure":[["第一段·描述图画与图表","In the left picture, a newly built small park has become part of daily life ... The bar chart shows the number of parks in a certain city rising from 406 in 2020 to 532 in 2021, and then to 670 in 2022."],["第二段·揭示寓意","These figures reflect a shift in urban philosophy. Parks were once treated as ornamental extras, but they are now valued as basic public facilities that safeguard health, bring neighbours together and make a city liveable... the local government has been directing resources toward people's wellbeing."],["第三段·发表评论","In my view, this trend deserves support, yet building parks is only the first step. They must be maintained, kept free and distributed fairly... A city's quality is measured not by its tallest towers, but by how comfortably ordinary people can live in it."]],"expressions":["In the left picture, a newly built small park has become part of daily life.","Beside the sign reading “Fitness Area for Citizens”...","The bar chart shows the number of parks rising year by year.","The number of parks rose from 406 in 2020 to 532 in 2021, and then to 670 in 2022.","These figures reflect a shift in urban philosophy.","Parks were once treated as ornamental extras.","They are now valued as basic public facilities that safeguard health and make a city liveable.","direct resources toward people's wellbeing","Building parks is only the first step; they must be maintained and distributed fairly.","A city's quality is measured not by its tallest towers, but by how comfortably ordinary people can live in it."],"traps":["题目要求“描述图画和图表”，两部分都要写：左图要交代“市民健身区”、市民锻炼的场景和男孩的话，右图要给出 2020—2022 年 406、532、670 三个数据，不能只写图或只写表。","寓意应落在“公共设施建设改善民生、提升居民幸福感、体现以人民为中心的发展理念”，不要偏成“要保护环境”“要锻炼身体”“城市建设速度惊人”等单一角度。","数据描述要准确：三年是逐年上升而非下降，单位是“座”，不要编造其他年份或数字，也不要把 670 说成“增长了 670 座”。","第二段分析原因或意义，第三段给出评价与建议（如维护、免费开放、均衡分布），两段不要重复同一层意思。","160–200 词，三段为宜；描述用一般现在时，数据用一般过去时；避免逐字照抄图中中文，也不要只列数据不作分析。"]}},"vocab":[{"w":"pull out of","pos":"phr.","cn":"此处不是“拔出”，而是“撤离、退出（某地）”。","sec":"text1","sec_label":"Text 1","ctx":"Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things.","note":"此处不是“拔出”，而是“撤离、退出（某地）”。","forms":["pull out of"]},{"w":"leave behind","pos":"phr.","cn":"离开时留下。","sec":"text1","sec_label":"Text 1","ctx":"Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things.","note":"离开时留下。","forms":["leave behind"]},{"w":"nearly a million of the things","pos":"phr.","cn":"这里的 the things 回指 nails，是略带口语色彩的补充说明。","sec":"text1","sec_label":"Text 1","ctx":"Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things.","note":"这里的 the things 回指 nails，是略带口语色彩的补充说明。","forms":["nearly a million of the things"]},{"w":"hoard","pos":"词","cn":"贮藏起来的一批物品，此处指集中埋藏的钉子。","sec":"text1","sec_label":"Text 1","ctx":"The nail hoard was discovered in 1960 in a four-metre-deep pit covered by two metres of gravel.","note":"贮藏起来的一批物品，此处指集中埋藏的钉子。","forms":["hoard"]},{"w":"a four-metre-deep pit","pos":"phr.","cn":"一个 4 米深的坑；复合形容词中的名词 metre 用单数。","sec":"text1","sec_label":"Text 1","ctx":"The nail hoard was discovered in 1960 in a four-metre-deep pit covered by two metres of gravel.","note":"一个 4 米深的坑；复合形容词中的名词 metre 用单数。","forms":["a four-metre-deep pit"]},{"w":"rushed","pos":"v./adj.","cn":"此处意为“仓促的、匆忙完成的”，不是“冲过去的”。","sec":"text1","sec_label":"Text 1","ctx":"The likely explanation is that the withdrawal was rushed, and they didn’t want the local Caledonians getting their hands on 10 tons of weapon-grade iron.","note":"此处意为“仓促的、匆忙完成的”，不是“冲过去的”。","forms":["rushed"]},{"w":"get one's hands on","pos":"phr.","cn":"设法得到、弄到手，而非字面上的“把手放在……上”。","sec":"text1","sec_label":"Text 1","ctx":"The likely explanation is that the withdrawal was rushed, and they didn’t want the local Caledonians getting their hands on 10 tons of weapon-grade iron.","note":"设法得到、弄到手，而非字面上的“把手放在……上”。","forms":["get one's hands on"]},{"w":"withdrawal","pos":"adj.","cn":"撤退、撤离，对应上一段的 pull out of Scotland。","sec":"text1","sec_label":"Text 1","ctx":"The likely explanation is that the withdrawal was rushed, and they didn’t want the local Caledonians getting their hands on 10 tons of weapon-grade iron.","note":"撤退、撤离，对应上一段的 pull out of Scotland。","forms":["withdrawal"]},{"w":"weapon-grade iron","pos":"phr.","cn":"质量足以用于制造武器的铁。","sec":"text1","sec_label":"Text 1","ctx":"The likely explanation is that the withdrawal was rushed, and they didn’t want the local Caledonians getting their hands on 10 tons of weapon-grade iron.","note":"质量足以用于制造武器的铁。","forms":["weapon-grade iron"]},{"w":"so ... that ...","pos":"phr.","cn":"如此……以至于……，引出结果。","sec":"text1","sec_label":"Text 1","ctx":"The Romans buried the nails so deep that they would not be discovered for almost two millennia.","note":"如此……以至于……，引出结果。","forms":["so ... that ..."]},{"w":"millennium","pos":"词","cn":"一千年；millennia 是其复数形式。","sec":"text1","sec_label":"Text 1","ctx":"The Romans buried the nails so deep that they would not be discovered for almost two millennia.","note":"一千年；millennia 是其复数形式。","forms":["millennium"]},{"w":"labour in a nail","pos":"phr.","cn":"不是“钉子里的劳动力”，而是指制造一枚钉子所投入的熟练劳动及其价值。","sec":"text1","sec_label":"Text 1","ctx":"Later civilisations would value the skilled blacksmith’s labour in a nail even more than the raw material.","note":"不是“钉子里的劳动力”，而是指制造一枚钉子所投入的熟练劳动及其价值。","forms":["labour in a nail"]},{"w":"burn down","pos":"phr.","cn":"将建筑物烧毁。","sec":"text1","sec_label":"Text 1","ctx":"As Roma Agrawal explains in her new delightful book Nuts and Bolts, early 17th-century Virginians would sometimes burn down their homes if they were planning to relocate.","note":"将建筑物烧毁。","forms":["burn down"]},{"w":"relocate","pos":"v.","cn":"迁居、搬迁。","sec":"text1","sec_label":"Text 1","ctx":"As Roma Agrawal explains in her new delightful book Nuts and Bolts, early 17th-century Virginians would sometimes burn down their homes if they were planning to relocate.","note":"迁居、搬迁。","forms":["relocate"]},{"w":"recover","pos":"词","cn":"此处指“找回、回收”，不是“康复”。","sec":"text1","sec_label":"Text 1","ctx":"This was an attempt to recover the valuable nails, which could be reused after sifting the ashes.","note":"此处指“找回、回收”，不是“康复”。","forms":["recover"]},{"w":"sift the ashes","pos":"phr.","cn":"筛查灰烬，从中分离出钉子。","sec":"text1","sec_label":"Text 1","ctx":"This was an attempt to recover the valuable nails, which could be reused after sifting the ashes.","note":"筛查灰烬，从中分离出钉子。","forms":["sift the ashes"]},{"w":"underline","pos":"词","cn":"此处作动词，意为“突出、强调”，不是“在文字下画线”。","sec":"text1","sec_label":"Text 1","ctx":"The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.","note":"此处作动词，意为“突出、强调”，不是“在文字下画线”。","forms":["underline"]},{"w":"technology","pos":"词","cn":"此处具体指制钉技术及其产品价值，并非笼统的现代高科技。","sec":"text1","sec_label":"Text 1","ctx":"The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.","note":"此处具体指制钉技术及其产品价值，并非笼统的现代高科技。","forms":["technology"]},{"w":"fall by 90%","pos":"phr.","cn":"下降了 90%；若为 fall to 90% 才是“降至原来的 90%”。","sec":"text1","sec_label":"Text 1","ctx":"The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper.","note":"下降了 90%；若为 fall to 90% 才是“降至原来的 90%”。","forms":["fall by 90%"]},{"w":"point out","pos":"phr.","cn":"指出、说明。","sec":"text1","sec_label":"Text 1","ctx":"The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper.","note":"指出、说明。","forms":["point out"]},{"w":"credit","pos":"词","cn":"此处不是“信用”或“学分”，而是“功劳、贡献”。","sec":"text1","sec_label":"Text 1","ctx":"According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply fo","note":"此处不是“信用”或“学分”，而是“功劳、贡献”。","forms":["credit"]},{"w":"be driven partly by","pos":"phr.","cn":"部分由……推动或造成。","sec":"text1","sec_label":"Text 1","ctx":"According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply fo","note":"部分由……推动或造成。","forms":["be driven partly by"]},{"w":"most of the credit goes to","pos":"phr.","cn":"主要功劳归于……。","sec":"text1","sec_label":"Text 1","ctx":"According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply fo","note":"主要功劳归于……。","forms":["most of the credit goes to"]},{"w":"turn A into B","pos":"phr.","cn":"把 A 转化、加工成 B。","sec":"text1","sec_label":"Text 1","ctx":"According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply fo","note":"把 A 转化、加工成 B。","forms":["turn A into B"]},{"w":"be different from","pos":"phr.","cn":"与……不同。","sec":"text1","sec_label":"Text 1","ctx":"Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails.","note":"与……不同。","forms":["be different from"]},{"w":"LED strips","pos":"phr.","cn":"LED 灯带。","sec":"text1","sec_label":"Text 1","ctx":"Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails.","note":"LED 灯带。","forms":["LED strips"]},{"w":"make sense","pos":"phr.","cn":"此处意为“合理、说得通”，不是“制造意义”。","sec":"text1","sec_label":"Text 1","ctx":"It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.","note":"此处意为“合理、说得通”，不是“制造意义”。","forms":["make sense"]},{"w":"ask the same question of nails","pos":"phr.","cn":"意为“针对钉子提出同样的问题”，这里的问题是长期价格如何变化。","sec":"text1","sec_label":"Text 1","ctx":"It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.","note":"意为“针对钉子提出同样的问题”，这里的问题是长期价格如何变化。","forms":["ask the same question of nails"]},{"w":"make no apology for","pos":"phr.","cn":"并非真的在讨论“道歉”，而是表示“毫不歉疚、毫不掩饰地坚持……”。","sec":"text1","sec_label":"Text 1","ctx":"I make no apology for being obsessed by a particular feature of these objects: their price.","note":"并非真的在讨论“道歉”，而是表示“毫不歉疚、毫不掩饰地坚持……”。","forms":["make no apology for"]},{"w":"be obsessed by","pos":"phr.","cn":"对……着迷、念念不忘。","sec":"text1","sec_label":"Text 1","ctx":"I make no apology for being obsessed by a particular feature of these objects: their price.","note":"对……着迷、念念不忘。","forms":["be obsessed by"]},{"w":"after all","pos":"phr.","cn":"毕竟，用来补充一个显而易见的解释。","sec":"text1","sec_label":"Text 1","ctx":"I am an economist, after all.","note":"毕竟，用来补充一个显而易见的解释。","forms":["after all"]},{"w":"hype","pos":"词","cn":"大肆宣传、热炒与由此带来的关注，常含“言过其实”的意味。","sec":"text1","sec_label":"Text 1","ctx":"After writing two books about the history of inventions, one thing I’ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it’s","note":"大肆宣传、热炒与由此带来的关注，常含“言过其实”的意味。","forms":["hype"]},{"w":"cheap technologies","pos":"phr.","cn":"此处强调低成本、可广泛采用的技术，不是“质量低劣的技术”。","sec":"text1","sec_label":"Text 1","ctx":"After writing two books about the history of inventions, one thing I’ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it’s","note":"此处强调低成本、可广泛采用的技术，不是“质量低劣的技术”。","forms":["cheap technologies"]},{"w":"enchantingly sophisticated","pos":"phr.","cn":"精妙得令人着迷的、极为复杂先进的。","sec":"text1","sec_label":"Text 1","ctx":"After writing two books about the history of inventions, one thing I’ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it’s","note":"精妙得令人着迷的、极为复杂先进的。","forms":["enchantingly sophisticated"]},{"w":"get all the hype","pos":"phr.","cn":"获得所有宣传和热度。","sec":"text1","sec_label":"Text 1","ctx":"After writing two books about the history of inventions, one thing I’ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it’s","note":"获得所有宣传和热度。","forms":["get all the hype"]},{"w":"surface","pos":"词","cn":"此处不是抽象的“表面”，而是指纸张等可供书写的载体。","sec":"text1","sec_label":"Text 1","ctx":"The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost — and it would have achieved little without a paralle","note":"此处不是抽象的“表面”，而是指纸张等可供书写的载体。","forms":["surface"]},{"w":"collapse","pos":"词","cn":"此处指价格“暴跌、大幅下降”，不是实体建筑倒塌。","sec":"text1","sec_label":"Text 1","ctx":"The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost — and it would have achieved little without a paralle","note":"此处指价格“暴跌、大幅下降”，不是实体建筑倒塌。","forms":["collapse"]},{"w":"not by ... but by ...","pos":"phr.","cn":"不是通过……而是通过……。","sec":"text1","sec_label":"Text 1","ctx":"The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost — and it would have achieved little without a paralle","note":"不是通过……而是通过……。","forms":["not by ... but by ..."]},{"w":"achieve little without","pos":"phr.","cn":"若没有……便难有多少成效。","sec":"text1","sec_label":"Text 1","ctx":"The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost — and it would have achieved little without a paralle","note":"若没有……便难有多少成效。","forms":["achieve little without"]},{"w":"thanks to","pos":"phr.","cn":"由于、得益于。","sec":"text1","sec_label":"Text 1","ctx":"The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost — and it would have achieved little without a paralle","note":"由于、得益于。","forms":["thanks to"]},{"w":"often-overlooked","pos":"v./adj.","cn":"常被忽视的。","sec":"text1","sec_label":"Text 1","ctx":"The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost — and it would have achieved little without a paralle","note":"常被忽视的。","forms":["often-overlooked"]},{"w":"niche","pos":"词","cn":"此处作定语，意为“小众的、只适用于特定领域的”。","sec":"text1","sec_label":"Text 1","ctx":"Solar panels had few niche uses until they became cheap; now they are transforming the global energy system.","note":"此处作定语，意为“小众的、只适用于特定领域的”。","forms":["niche"]},{"w":"contented","pos":"v./adj.","cn":"此处指“感到满足、幸福的”，不是“有内容的”。","sec":"text2","sec_label":"Text 2","ctx":"Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more contented children, researchers have suggested.","note":"此处指“感到满足、幸福的”，不是“有内容的”。","forms":["contented"]},{"w":"bring up","pos":"phr.","cn":"此处指“抚养、教育（孩子）”，不是“提出话题”。","sec":"text2","sec_label":"Text 2","ctx":"Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more contented children, researchers have suggested.","note":"此处指“抚养、教育（孩子）”，不是“提出话题”。","forms":["bring up"]},{"w":"parenting tips","pos":"phr.","cn":"育儿经验、建议。","sec":"text2","sec_label":"Text 2","ctx":"Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more contented children, researchers have suggested.","note":"育儿经验、建议。","forms":["parenting tips"]},{"w":"hunter-gatherers","pos":"词","cn":"以狩猎和采集为主要生计方式的人群。","sec":"text2","sec_label":"Text 2","ctx":"Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more contented children, researchers have suggested.","note":"以狩猎和采集为主要生计方式的人群。","forms":["hunter-gatherers"]},{"w":"the key to doing","pos":"phr.","cn":"做某事的关键，to 是介词，后接动名词。","sec":"text2","sec_label":"Text 2","ctx":"Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more contented children, researchers have suggested.","note":"做某事的关键，to 是介词，后接动名词。","forms":["the key to doing"]},{"w":"be based on","pos":"phr.","cn":"以……为基础。","sec":"text2","sec_label":"Text 2","ctx":"The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.","note":"以……为基础。","forms":["be based on"]},{"w":"be cared for by","pos":"phr.","cn":"由……照料。","sec":"text2","sec_label":"Text 2","ctx":"The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.","note":"由……照料。","forms":["be cared for by"]},{"w":"as young as four","pos":"phr.","cn":"强调年龄低至 4 岁，而非“像 4 岁一样年轻”。","sec":"text2","sec_label":"Text 2","ctx":"Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in slings, is considered the norm.","note":"强调年龄低至 4 岁，而非“像 4 岁一样年轻”。","forms":["as young as four"]},{"w":"the norm","pos":"phr.","cn":"常态、通行做法，不是数学意义上的“范数”。","sec":"text2","sec_label":"Text 2","ctx":"Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in slings, is considered the norm.","note":"常态、通行做法，不是数学意义上的“范数”。","forms":["the norm"]},{"w":"look after","pos":"phr.","cn":"照看、照料。","sec":"text2","sec_label":"Text 2","ctx":"Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in slings, is considered the norm.","note":"照看、照料。","forms":["look after"]},{"w":"baby-wearing","pos":"adj.","cn":"用背巾等工具将婴儿贴身携带的育儿方式。","sec":"text2","sec_label":"Text 2","ctx":"Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in slings, is considered the norm.","note":"用背巾等工具将婴儿贴身携带的育儿方式。","forms":["baby-wearing"]},{"w":"sling","pos":"v./n.","cn":"此处指婴儿背巾、吊带。","sec":"text2","sec_label":"Text 2","ctx":"Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in slings, is considered the norm.","note":"此处指婴儿背巾、吊带。","forms":["sling"]},{"w":"evolutionary anthropologist","pos":"phr.","cn":"进化人类学家。","sec":"text2","sec_label":"Text 2","ctx":"According to Dr Nikhil Chaudhary, an evolutionary anthropologist at Cambridge University, these practices, known as alloparenting, could lead to less anxiety for children","note":"进化人类学家。","forms":["evolutionary anthropologist"]},{"w":"alloparenting","pos":"v./n.","cn":"共同养育，特指由亲生父母之外的群体成员参与照护儿童。","sec":"text2","sec_label":"Text 2","ctx":"According to Dr Nikhil Chaudhary, an evolutionary anthropologist at Cambridge University, these practices, known as alloparenting, could lead to less anxiety for children","note":"共同养育，特指由亲生父母之外的群体成员参与照护儿童。","forms":["alloparenting"]},{"w":"lead to less anxiety","pos":"phr.","cn":"减少焦虑、使焦虑程度降低。","sec":"text2","sec_label":"Text 2","ctx":"According to Dr Nikhil Chaudhary, an evolutionary anthropologist at Cambridge University, these practices, known as alloparenting, could lead to less anxiety for children","note":"减少焦虑、使焦虑程度降低。","forms":["lead to less anxiety"]},{"w":"child psychiatrist","pos":"phr.","cn":"儿童精神科医生。","sec":"text2","sec_label":"Text 2","ctx":"Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life.","note":"儿童精神科医生。","forms":["child psychiatrist"]},{"w":"incorporate A into B","pos":"phr.","cn":"将 A 纳入或融入 B。","sec":"text2","sec_label":"Text 2","ctx":"Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life.","note":"将 A 纳入或融入 B。","forms":["incorporate A into B"]},{"w":"pair A with B","pos":"phr.","cn":"使 A 与 B 配对、合作，此处不是简单把两栋建筑放在一起。","sec":"text2","sec_label":"Text 2","ctx":"In Germany, one scheme has paired an old people’s home with a nursery.","note":"使 A 与 B 配对、合作，此处不是简单把两栋建筑放在一起。","forms":["pair A with B"]},{"w":"nursery","pos":"词","cn":"此处指托儿所，而非“苗圃”。","sec":"text2","sec_label":"Text 2","ctx":"In Germany, one scheme has paired an old people’s home with a nursery.","note":"此处指托儿所，而非“苗圃”。","forms":["nursery"]},{"w":"resident","pos":"词","cn":"住户、居住者，此处指养老院中的老人。","sec":"text2","sec_label":"Text 2","ctx":"The residents help to look after the children, an arrangement akin to alloparenting.","note":"住户、居住者，此处指养老院中的老人。","forms":["resident"]},{"w":"akin to","pos":"phr.","cn":"与……相似、类似于……。","sec":"text2","sec_label":"Text 2","ctx":"The residents help to look after the children, an arrangement akin to alloparenting.","note":"与……相似、类似于……。","forms":["akin to"]},{"w":"school year","pos":"phr.","cn":"此处指学生所在年级，而非一整个“学年”时段。","sec":"text2","sec_label":"Text 2","ctx":"Another measure could be encouraging friendships between children in different school years, to mirror the unsupervised mixed-age playgroups in hunter-gatherer communitie","note":"此处指学生所在年级，而非一整个“学年”时段。","forms":["school year"]},{"w":"mirror","pos":"词","cn":"此处作动词，意为“仿照、反映”，不是名词“镜子”。","sec":"text2","sec_label":"Text 2","ctx":"Another measure could be encouraging friendships between children in different school years, to mirror the unsupervised mixed-age playgroups in hunter-gatherer communitie","note":"此处作动词，意为“仿照、反映”，不是名词“镜子”。","forms":["mirror"]},{"w":"mixed-age playgroups","pos":"phr.","cn":"混龄游戏小组。","sec":"text2","sec_label":"Text 2","ctx":"Another measure could be encouraging friendships between children in different school years, to mirror the unsupervised mixed-age playgroups in hunter-gatherer communitie","note":"混龄游戏小组。","forms":["mixed-age playgroups"]},{"w":"unsupervised","pos":"v./adj.","cn":"没有成年人直接监督的。","sec":"text2","sec_label":"Text 2","ctx":"Another measure could be encouraging friendships between children in different school years, to mirror the unsupervised mixed-age playgroups in hunter-gatherer communitie","note":"没有成年人直接监督的。","forms":["unsupervised"]},{"w":"nu armers, to use one telling example, aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their","note":"此处意为“很能说明问题的、有说服力的”，不是“讲述的”。","forms":["telling"]},{"w":"animal waste","pos":"phr.","cn":"此处主要指农业中的动物粪便、粪肥。","sec":"text4","sec_label":"Text 4","ctx":"Pennsylvania farmers, to use one telling example, aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their","note":"此处主要指农业中的动物粪便、粪肥。","forms":["animal waste"]},{"w":"runoff","pos":"词","cn":"地表径流，雨水冲刷农田后流入河溪的水体。","sec":"text4","sec_label":"Text 4","ctx":"Pennsylvania farmers, to use one telling example, aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their","note":"地表径流，雨水冲刷农田后流入河溪的水体。","forms":["runoff"]},{"w":"whether to do","pos":"phr.","cn":"是否做某事。","sec":"text4","sec_label":"Text 4","ctx":"Pennsylvania farmers, to use one telling example, aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their","note":"是否做某事。","forms":["whether to do"]},{"w":"have enormous impact downstream","pos":"phr.","cn":"对下游产生巨大影响。","sec":"text4","sec_label":"Text 4","ctx":"Pennsylvania farmers, to use one telling example, aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their","note":"对下游产生巨大影响。","forms":["have enormous impact downstream"]},{"w":"call on sb to do","pos":"phr.","cn":"呼吁、敦促某人做某事。","sec":"text4","sec_label":"Text 4","ctx":"And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved.","note":"呼吁、敦促某人做某事。","forms":["call on sb to do"]},{"w":"stakes","pos":"词","cn":"此处指成败所牵涉的重大利益与风险，不是“木桩”。","sec":"text4","sec_label":"Text 4","ctx":"And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved.","note":"此处指成败所牵涉的重大利益与风险，不是“木桩”。","forms":["stakes"]},{"w":"consider reviewing","pos":"phr.","cn":"考虑重新审查。","sec":"text4","sec_label":"Text 4","ctx":"And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved.","note":"考虑重新审查。","forms":["consider reviewing"]},{"w":"see for oneself","pos":"phr.","cn":"亲自了解、亲眼确认。","sec":"text4","sec_label":"Text 4","ctx":"And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved.","note":"亲自了解、亲眼确认。","forms":["see for oneself"]},{"w":"tidal marshes","pos":"phr.","cn":"受潮汐周期性淹没的湿地、潮汐沼泽。","sec":"text4","sec_label":"Text 4","ctx":"We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat acro","note":"受潮汐周期性淹没的湿地、潮汐沼泽。","forms":["tidal marshes"]},{"w":"aquatic life","pos":"phr.","cn":"水生生物。","sec":"text4","sec_label":"Text 4","ctx":"We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat acro","note":"水生生物。","forms":["aquatic life"]},{"w":"teaming with aquatic life","pos":"phr.","cn":"原文如此拼写，按语境意为“水生生物繁盛”；常见固定搭配写作 teeming with。","sec":"text4","sec_label":"Text 4","ctx":"We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat acro","note":"原文如此拼写，按语境意为“水生生物繁盛”；常见固定搭配写作 teeming with。","forms":["teaming with aquatic life"]},{"w":"be worth the drive","pos":"phr.","cn":"值得驱车前往。","sec":"text4","sec_label":"Text 4","ctx":"It’s worth the scenic drive.","note":"值得驱车前往。","forms":["be worth the drive"]}],"sentences":[{"id":"2024-T1-P1-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Nearly 2,000 years ago, as the Romans began to pull out of Scotland, they left behind a curious treasure: 10 tons of nails, nearly a million of the things.","core":"they left behind a curious treasure。","structure":"Nearly 2,000 years ago 是时间状语；as the Romans began to pull out of Scotland 是时间从句；冒号后的 10 tons of nails 解释 a curious treasure，nearly a million of the things 再补充其数量。","key":"pull out of：此处不是“拔出”，而是“撤离、退出（某地）”。；leave behind：离开时留下。；nearly a million of the things：这里的 the things 回指 nails，是略带口语色彩的补充说明。","zh":"近 2,000 年前，当罗马人开始撤离苏格兰时，他们留下了一批奇特的宝藏：10 吨钉子，数量接近 100 万枚。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T1-P1-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"The nail hoard was discovered in 1960 in a four-metre-deep pit covered by two metres of gravel.","core":"The nail hoard was discovered.","structure":"第一个 in 引出时间，第二个 in 引出发现地点；covered by two metres of gravel 是过去分词短语，修饰 pit。","key":"hoard：贮藏起来的一批物品，此处指集中埋藏的钉子。；a four-metre-deep pit：一个 4 米深的坑；复合形容词中的名词 metre 用单数。","zh":"这批钉子于 1960 年在一个深 4 米、上覆 2 米厚砾石的坑中被发现。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T1-P2-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"The likely explanation is that the withdrawal was rushed, and they didn’t want the local Caledonians getting their hands on 10 tons of weapon-grade iron.","core":"The likely explanation is that ...。","structure":"that 引导表语从句，其中 the withdrawal was rushed 与 they didn't want ... 由 and 并列；want the local Caledonians getting ... 是 want + 宾语 + 现在分词 结构，表示不希望这种情况发生。","key":"rushed：此处意为“仓促的、匆忙完成的”，不是“冲过去的”。；get one's hands on：设法得到、弄到手，而非字面上的“把手放在……上”。；withdrawal：撤退、撤离，对应上一段的 pull out of Scotland。；weapon-grade iron：质量足以用于制造武器的铁。","zh":"较为可信的解释是，这次撤退十分仓促，而且罗马人不想让当地的喀里多尼亚人得到这 10 吨可用于制造武器的铁。","tip":"they 指罗马人；the local Caledonians 才是罗马人要防范的当地居民。"},{"id":"2024-T1-P2-S05","sec":"text1","sec_label":"Text 1","level":3,"en":"The Romans buried the nails so deep that they would not be discovered for almost two millennia.","core":"The Romans buried the nails so deep.","structure":"that they would not be discovered ... 是结果从句；they 指 the nails。","key":"so ... that ...：如此……以至于……，引出结果。；millennium：一千年；millennia 是其复数形式。","zh":"罗马人把这些钉子埋得如此之深，以至于它们在将近两千年里都未被发现。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T1-P3-S06","sec":"text1","sec_label":"Text 1","level":3,"en":"Later civilisations would value the skilled blacksmith’s labour in a nail even more than the raw material.","core":"Later civilisations would value the ... labour ... more than the raw material.","structure":"in a nail 修饰 labour，表示体现在钉子中的劳动；even more than 构成比较。","key":"labour in a nail：不是“钉子里的劳动力”，而是指制造一枚钉子所投入的熟练劳动及其价值。","zh":"后来的文明对一枚钉子中所凝结的熟练铁匠劳动，甚至比对其原材料本身更为看重。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T1-P3-S07","sec":"text1","sec_label":"Text 1","level":3,"en":"As Roma Agrawal explains in her new delightful book Nuts and Bolts, early 17th-century Virginians would sometimes burn down their homes if they were planning to relocate.","core":"early 17th-century Virginians would sometimes burn down their homes.","structure":"As Roma Agrawal explains ... 是方式状语从句，引出资料来源；if they were planning to relocate 是条件从句。","key":"burn down：将建筑物烧毁。；relocate：迁居、搬迁。","zh":"正如罗马·阿格拉瓦尔在她那本令人愉快的新书《螺母与螺栓》中所述，17 世纪早期的弗吉尼亚人如果打算搬迁，有时会烧掉自己的房屋。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T1-P3-S08","sec":"text1","sec_label":"Text 1","level":3,"en":"This was an attempt to recover the valuable nails, which could be reused after sifting the ashes.","core":"This was an attempt to recover the valuable nails.","structure":"This 指烧掉房屋这一做法；which could be reused ... 是非限制性定语从句，修饰 nails；after sifting the ashes 中省略了与主句一致的逻辑主语。","key":"recover：此处指“找回、回收”，不是“康复”。；sift the ashes：筛查灰烬，从中分离出钉子。","zh":"这样做是为了找回那些珍贵的钉子；筛过灰烬后，这些钉子还可以再次使用。","tip":"可被重复使用的是钉子，不是灰烬。"},{"id":"2024-T1-P3-S09","sec":"text1","sec_label":"Text 1","level":3,"en":"The idea that one might burn down an entire house just to reclaim the nails underlines how scarce, costly and valuable the simple-seeming technology was.","core":"The idea ... underlines how ... the technology was.","structure":"that one might burn down ... 是 idea 的同位语从句，说明“想法”的具体内容；just to reclaim the nails 是目的状语；how scarce, costly and valuable ... was 是感叹式宾语从句，作 underlines 的宾语。","key":"underline：此处作动词，意为“突出、强调”，不是“在文字下画线”。；technology：此处具体指制钉技术及其产品价值，并非笼统的现代高科技。","zh":"有人竟可能为了取回钉子而烧掉整栋房屋，这一事实凸显了这种看似简单的技术当时多么稀缺、昂贵而珍贵。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T1-P4-S10","sec":"text1","sec_label":"Text 1","level":3,"en":"The price of nails fell by 90% between the late 1700s and mid-1900s, as economist Daniel Sichel points out in a research paper.","core":"The price of nails fell by 90%.","structure":"between ... and ... 给出时间跨度；as economist Daniel Sichel points out ... 是方式状语从句，表示“正如……所指出的”。","key":"fall by 90%：下降了 90%；若为 fall to 90% 才是“降至原来的 90%”。；point out：指出、说明。","zh":"正如经济学家丹尼尔·西切尔在一篇研究论文中指出的那样，从 18 世纪晚期到 20 世纪中期，钉子的价格下降了 90%。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T1-P4-S11","sec":"text1","sec_label":"Text 1","level":3,"en":"According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more efficient ways to turn steel into nails.","core":"most of the credit goes to nail manufacturers.","structure":"According to Sichel 交代观点来源；although ... 引导让步从句，承认廉价铁材和能源的部分作用；who ... found ... 是定语从句，修饰 nail manufacturers；to turn steel into nails 修饰 ways。","key":"credit：此处不是“信用”或“学分”，而是“功劳、贡献”。；be driven partly by：部分由……推动或造成。；most of the credit goes to：主要功劳归于……。；turn A into B：把 A 转化、加工成 B。","zh":"西切尔认为，尽管钉子降价在一定程度上是由铁和能源成本下降推动的，但主要功劳应归于制钉商，因为他们找到了把钢材制成钉子的更高效方法。","tip":"题目问 major role，应抓住 most of the credit，不能把让步从句中的次要原因当成主因。"},{"id":"2024-T1-P5-S12","sec":"text1","sec_label":"Text 1","level":3,"en":"Nails themselves have changed over the years, but Sichel studied them because they haven’t changed much.","core":"Nails ... have changed, but Sichel studied them.","structure":"but 形成转折；because they haven't changed much 是原因从句，解释钉子适合作为长期价格研究对象的原因。","key":"见下方词汇笔记","zh":"这些年来，钉子本身确实有所变化，但西切尔之所以研究它们，恰恰是因为它们变化不大。","tip":"have changed 与 haven't changed much 并不矛盾，后者限定变化幅度不大。"},{"id":"2024-T1-P5-S13","sec":"text1","sec_label":"Text 1","level":3,"en":"Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still clearly nails.","core":"前半句为 Roman lamps and Roman chariots are different from ...；后半句为 Roman nails are still clearly nails.","structure":"见原句","key":"be different from：与……不同。；LED strips：LED 灯带。","zh":"罗马时代的灯和战车与如今的 LED 灯带和跑车已大不相同，但罗马时代的钉子显然仍然是我们所熟悉的钉子。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T1-P5-S14","sec":"text1","sec_label":"Text 1","level":3,"en":"It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense.","core":"It would be absurd to try ... , but to ask ... makes perfect sense.","structure":"前半句 It 是形式主语，真正主语是 to try to track ...；but 后由不定式短语 to ask the same question of nails 直接作主语。","key":"make sense：此处意为“合理、说得通”，不是“制造意义”。；ask the same question of nails：意为“针对钉子提出同样的问题”，这里的问题是长期价格如何变化。","zh":"试图追踪自 1695 年以来跑车价格的变化会十分荒谬，但对钉子提出同样的问题却完全合理。","tip":"比较的不是跑车与钉子的价格高低，而是二者是否具有足够稳定、可跨数百年比较的产品形态。"},{"id":"2024-T1-P6-S17","sec":"text1","sec_label":"Text 1","level":3,"en":"After writing two books about the history of inventions, one thing I’ve learnt is that while it is the enchantingly sophisticated technologies that get all the hype, it’s the cheap technologies that change the world.","core":"one thing ... is that ...。","structure":"After writing two books ... 是时间状语；I've learnt 是省略关系代词的定语从句，修饰 one thing；that 引导表语从句；其中 while 引导让步从句；it is ... that ... 与 it's ... that ... 都是强调结构，分别突出复杂技术和廉价技术。","key":"hype：大肆宣传、热炒与由此带来的关注，常含“言过其实”的意味。；cheap technologies：此处强调低成本、可广泛采用的技术，不是“质量低劣的技术”。；enchantingly sophisticated：精妙得令人着迷的、极为复杂先进的。；get all the hype：获得所有宣传和热度。","zh":"在写完两本有关发明史的书后，我明白了一件事：尽管那些精妙复杂的技术吸引了所有宣传与关注，真正改变世界的却是廉价技术。","tip":"两个 it 都是强调结构中的形式成分；不是具体指代某项技术。"},{"id":"2024-T1-P7-S18","sec":"text1","sec_label":"Text 1","level":3,"en":"The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost — and it would have achieved little without a parallel collapse in the price of surfaces to write on, thanks to an often-overlooked technology called paper.","core":"The Gutenberg printing press transformed civilisation ... , and it would have achieved little ...。","structure":"not by changing ... but by changing ... 是并列方式状语；its 指 writing；破折号后的 and 连接第二个分句；without ... 构成与过去事实相反的含蓄虚拟条件；to write on 修饰 surfaces；called paper 修饰 technology。","key":"surface：此处不是抽象的“表面”，而是指纸张等可供书写的载体。；collapse：此处指价格“暴跌、大幅下降”，不是实体建筑倒塌。；not by ... but by ...：不是通过……而是通过……。；achieve little without：若没有……便难有多少成效。","zh":"古腾堡印刷机改变文明，并非因为它改变了书写的本质，而是因为它改变了书写的成本；而若不是得益于一种常被忽视的技术——纸张，使可供书写的载体价格同步大幅下降，印刷机也不会取得多少成效。","tip":"it 指古腾堡印刷机；a parallel collapse 表示纸张价格与书写成本同步下降。"},{"id":"2024-T1-P7-S19","sec":"text1","sec_label":"Text 1","level":3,"en":"Solar panels had few niche uses until they became cheap; now they are transforming the global energy system.","core":"分号前为 Solar panels had few niche uses；分号后为 they are transforming the global energy system.","structure":"until they became cheap 是时间从句，同时标明发生转折的条件节点。","key":"niche：此处作定语，意为“小众的、只适用于特定领域的”。；pull out of：撤离、退出某地。；get one's hands on：设法得到、弄到手。；most of the credit goes to：主要功劳归于……。","zh":"太阳能板在变得廉价之前只有少数小众用途；如今，它们正在改变全球能源体系。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T2-P1-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Parenting tips obtained from hunter-gatherers in Africa may be the key to bringing up more contented children, researchers have suggested.","core":"Parenting tips ... may be the key ...；句末 researchers have suggested 是引述语。","structure":"obtained from hunter-gatherers in Africa 是过去分词短语，修饰 Parenting tips；to bringing up ... 修饰 the key。","key":"contented：此处指“感到满足、幸福的”，不是“有内容的”。；bring up：此处指“抚养、教育（孩子）”，不是“提出话题”。；parenting tips：育儿经验、建议。；hunter-gatherers：以狩猎和采集为主要生计方式的人群。","zh":"研究人员指出，从非洲狩猎采集者那里获得的育儿经验，或许是培养出更快乐、更知足的孩子的关键。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T2-P1-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The idea is based on studies of communities such as the Kung of Botswana, where each child is cared for by many adults.","core":"The idea is based on studies of communities.","structure":"such as the Kung of Botswana 举例说明 communities；where ... 是非限制性定语从句，修饰这一社群，并说明其共同育儿特征。","key":"be based on：以……为基础。；be cared for by：由……照料。","zh":"这一观点以对多个社群的研究为基础，例如博茨瓦纳的 Kung 人；在那里，每个孩子都由许多成年人共同照料。","tip":"where 指 Kung 人所在的社群环境，不是泛指整个博茨瓦纳的所有家庭。"},{"id":"2024-T2-P1-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Kung children as young as four will help to look after younger ones and “baby-wearing”, in which infants are carried in slings, is considered the norm.","core":"Kung children ... will help ... and “baby-wearing” ... is considered the norm.","structure":"and 连接两个并列分句；as young as four 修饰 children；in which infants are carried in slings 是非限制性定语从句，解释 baby-wearing。","key":"as young as four：强调年龄低至 4 岁，而非“像 4 岁一样年轻”。；the norm：常态、通行做法，不是数学意义上的“范数”。；look after：照看、照料。；baby-wearing：用背巾等工具将婴儿贴身携带的育儿方式。","zh":"Kung 人的孩子年仅 4 岁就会帮忙照看年龄更小的孩子；用背巾把婴儿带在身上的“背婴”做法也被视为常态。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T2-P2-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"According to Dr Nikhil Chaudhary, an evolutionary anthropologist at Cambridge University, these practices, known as alloparenting, could lead to less anxiety for children and parents.","core":"these practices ... could lead to less anxiety.","structure":"According to ... 交代观点来源；an evolutionary anthropologist ... 是 Dr Nikhil Chaudhary 的同位语；known as alloparenting 是过去分词短语，补充说明 these practices 的名称。","key":"evolutionary anthropologist：进化人类学家。；alloparenting：共同养育，特指由亲生父母之外的群体成员参与照护儿童。；lead to less anxiety：减少焦虑、使焦虑程度降低。","zh":"剑桥大学进化人类学家尼基尔·乔杜里博士表示，这些做法被称为“共同养育”，可以减少儿童和父母的焦虑。","tip":"alloparenting 概括的是前文多名成年人和较年长儿童共同照护的整套做法，不等同于其中单一的“背婴”。"},{"id":"2024-T2-P3-S05","sec":"text2","sec_label":"Text 2","level":3,"en":"Dr Annie Swanepoel, a child psychiatrist, believes that there are ways to incorporate them into western life.","core":"Dr Annie Swanepoel believes that ...。","structure":"a child psychiatrist 是主语的同位语；that 引导宾语从句；to incorporate them into western life 修饰 ways；them 指前文的共同养育做法。","key":"child psychiatrist：儿童精神科医生。；incorporate A into B：将 A 纳入或融入 B。","zh":"儿童精神科医生安妮·斯瓦内普尔博士认为，可以找到办法将这些做法融入西方生活。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T2-P3-S07","sec":"text2","sec_label":"Text 2","level":3,"en":"The residents help to look after the children, an arrangement akin to alloparenting.","core":"The residents help to look after the children.","structure":"an arrangement akin to alloparenting 是前面整个分句的同位语式补充；akin to alloparenting 修饰 arrangement。","key":"resident：住户、居住者，此处指养老院中的老人。；akin to：与……相似、类似于……。","zh":"养老院的居民帮忙照看孩子，这种安排与共同养育相似。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T2-P3-S08","sec":"text2","sec_label":"Text 2","level":3,"en":"Another measure could be encouraging friendships between children in different school years, to mirror the unsupervised mixed-age playgroups in hunter-gatherer communities.","core":"Another measure could be encouraging friendships.","structure":"动名词短语 encouraging ... 作表语；between children in different school years 修饰 friendships；to mirror ... 是目的状语。","key":"school year：此处指学生所在年级，而非一整个“学年”时段。；mirror：此处作动词，意为“仿照、反映”，不是名词“镜子”。；mixed-age playgroups：混龄游戏小组。；unsupervised：没有成年人直接监督的。","zh":"另一项措施可以是鼓励不同年级的孩子建立友谊，以仿照狩猎采集社群中无人监督的混龄游戏小组。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T2-P4-S09","sec":"text2","sec_label":"Text 2","level":3,"en":"In a paper published in the Journal of Child Psychology and Psychiatry, researchers said that the western nuclear family was a recent invention which broke with evolutionary history.","core":"researchers said that ...。","structure":"published in ... 是过去分词短语，修饰 paper；that 引导宾语从句；which broke with evolutionary history 是定语从句，修饰 a recent invention，语义上说明西方核心家庭这种新型安排背离进化历史。","key":"nuclear family：核心家庭，即主要由父母及其未婚子女组成的小家庭，并非“核家庭”。；break with：背离、不再遵循，而不是“与……一起打破”。","zh":"研究人员在发表于《儿童心理学与精神病学杂志》的一篇论文中指出，西方核心家庭是近代才出现的产物，它背离了人类的进化历史。","tip":"recent invention 不是说某个人发明了核心家庭，而是强调这种家庭结构在人类历史上出现得很晚。"},{"id":"2024-T2-P4-S10","sec":"text2","sec_label":"Text 2","level":3,"en":"This abrupt shift to an “intensive mothering narrative”, which suggests that mothers should manage childcare alone, was likely to have been harmful.","core":"This abrupt shift ... was likely to have been harmful.","structure":"which suggests ... 是非限制性定语从句，修饰 narrative；其中 that mothers should manage childcare alone 作 suggests 的宾语。","key":"abrupt shift to：突然转向……。；intensive mothering narrative：密集母职叙事，即把高强度、全方位育儿责任主要压在母亲身上的观念。；be likely to have done：很可能已经做过某事，是对过去情况的推断。","zh":"这种突然转向“密集母职叙事”的变化很可能已经造成了伤害；该叙事主张母亲应独自承担儿童照护。","tip":"which 就近指 intensive mothering narrative，而不是泛指整个西方核心家庭。"},{"id":"2024-T2-P4-S11","sec":"text2","sec_label":"Text 2","level":3,"en":"“Such narratives can lead to maternal exhaustion and have dangerous consequences,” they wrote.","core":"引语内部为 Such narratives can lead to ... and have ...。","structure":"lead to maternal exhaustion 与 have dangerous consequences 是共享情态动词 can 的并列谓语；Such narratives 回指把照护责任集中于母亲的叙事。","key":"maternal exhaustion：母亲因育儿压力产生的身心耗竭。；lead to：导致、带来。","zh":"他们写道：“此类叙事可能导致母亲精疲力竭，并带来危险后果。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T2-P5-S14","sec":"text2","sec_label":"Text 2","level":3,"en":"It found that infants had an average of 14 alloparents a day by the time they were 18 weeks old, and were passed between caregivers eight times an hour.","core":"It found that infants had ... and were passed ...。","structure":"It 指上一句的研究；that 引导宾语从句，其中 had 与 were passed 是并列谓语；by the time they were 18 weeks old 说明达到这一照护模式时婴儿的年龄。","key":"an average of：平均数量为……。；by the time：到……的时候。；be passed between caregivers：被不同照护者轮流抱持、传递。","zh":"研究发现，婴儿到 18 周大时，平均每天会得到 14 名共同养育者的照护，而且每小时会在不同照护者之间被传递 8 次。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T2-P6-S15","sec":"text2","sec_label":"Text 2","level":3,"en":"Chaudhary said that parents now have less childcare support from family and social networks than during most of humans’ evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a “knock-on” benefit to a child’s wellbeing.","core":"Chaudhary said that parents ... have less support ..., but introducing additional caregivers could reduce ...。","structure":"that 引导宾语从句；从句内部由 but 对比当前支持不足与增加照护者的潜在作用；introducing additional caregivers 是动名词短语作主语；which ... 补充说明减轻压力和母亲抑郁所产生的连锁益处。","key":"knock-on：由某事进一步引发的、连锁的，此处强调间接的后续益处。；childcare support from family and social networks：来自家庭与社会关系网络的育儿支持。；maternal depression：母亲抑郁。；a benefit to a child’s wellbeing：对儿童身心健康的益处。","zh":"乔杜里说，与人类进化史上的大部分时期相比，如今父母从家庭和社会网络获得的育儿支持更少；但增加照护者可以减轻压力和母亲抑郁，进而为儿童福祉带来连锁益处。","tip":"than during most of ... history 比较的是“如今”与“进化史上的大部分时期”所获得的支持多少。"},{"id":"2024-T2-P6-S16","sec":"text2","sec_label":"Text 2","level":3,"en":"An infant born to a hunter-gatherer society could have more than ten caregivers — this contrasts starkly to nursery settings in the UK where regulations call for a ratio of one carer to four children aged two to three.","core":"An infant ... could have more than ten caregivers; this contrasts ... to nursery settings.","structure":"born to a hunter-gatherer society 是过去分词短语，修饰 infant；破折号连接对比说明；where ... 是定语从句，修饰 nursery settings in the UK；aged two to three 修饰 children。","key":"call for：此处意为“要求、规定”，不是“呼喊”。；contrast starkly to：与……形成鲜明对比。；a ratio of one carer to four children：一名照护者对应四名儿童的比例。","zh":"出生在狩猎采集社会的婴儿可能拥有 10 多名照护者；这与英国托儿所形成鲜明对比，英国法规要求 2 至 3 岁儿童按一名照护者照看四名儿童的比例配置人员。","tip":"one carer to four children 是法规规定的现行比例，不是英国托儿所未达标；问题在于该比例与共同养育模式相比照护者较少。"},{"id":"2024-T2-P7-S17","sec":"text2","sec_label":"Text 2","level":3,"en":"While hunter-gatherer children learnt from observation and imitation in mixed-age playgroups, researchers said that western “instructive teaching”, where pupils are asked to sit still, may contribute to conditions such as attention deficit hyperactivity disorder.","core":"researchers said that western “instructive teaching” ... may contribute to conditions ...。","structure":"句首 While ... 引导对比从句；where pupils are asked to sit still 是非限制性定语从句，具体说明这种教学的课堂要求；such as ... 举例说明 conditions。","key":"condition：此处指健康或行为方面的病症、问题，不是一般的“条件”。；instructive teaching：此处指由成人明确讲授、要求儿童按指令学习的教学方式。；learn from observation and imitation：通过观察和模仿学习。；contribute to：促成、成为……的部分原因。","zh":"狩猎采集社会的儿童会在混龄游戏小组中通过观察和模仿来学习；与之相对，研究人员表示，西方那种要求学生静坐的“讲授式教学”可能会促成注意缺陷多动障碍等问题。","tip":"may contribute to 只表示可能成为部分诱因，不等于这种教学必然或单独导致 ADHD。"},{"id":"2024-T2-P7-S18","sec":"text2","sec_label":"Text 2","level":3,"en":"Chaudhary said that Britain should explore the possibility that older siblings helping their parents “might also enhance their own social development.”","core":"Chaudhary said that Britain should explore the possibility.","structure":"第一个 that 引导 said 的宾语从句；第二个 that 引导 possibility 的同位语从句；older siblings helping their parents 是动名词复合结构，作同位语从句的主语；their own 指年长的兄姐自身。","key":"explore the possibility that：探讨……的可能性。；enhance social development：促进社会性发展、提升社会交往能力。；bring up children：抚养、教育孩子。；be cared for by many adults：由多名成年人共同照护。","zh":"乔杜里说，英国应当探讨这样一种可能性：年龄较大的兄姐帮助父母照看孩子，也可能促进他们自身的社会性发展。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T3-P1-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"A Polish digital artist who uses classical painting styles to create dreamy fantasy landscapes, Greg Rutkowski has made illustrations for games such as Dungeons & Dragons and Magic: The Gathering.","core":"Greg Rutkowski has made illustrations for games.","structure":"句首 A Polish digital artist ... 是 Greg Rutkowski 的同位语；who uses ... 是定语从句，修饰 artist；to create ... 是目的状语；such as ... 举例说明 games。","key":"digital artist：使用数字工具进行创作的艺术家。；dreamy fantasy landscapes：如梦似幻的奇幻风景。；make illustrations for：为……创作插画。","zh":"波兰数字艺术家格雷格·鲁特科夫斯基运用古典绘画风格创作梦幻般的奇幻风景，并曾为《龙与地下城》和《万智牌》等游戏绘制插画。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T3-P2-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"His distinctive style is now one of the most commonly used prompts in the new open-source AI art generator Stable Diffusion.","core":"His distinctive style is ... one of the ... prompts.","structure":"used 是过去分词，修饰 prompts；Stable Diffusion 是 the ... generator 的同位语。","key":"prompt：在生成式 AI 语境中指输入给模型、用来规定生成内容的“提示词”，不是一般的“提示”或动词“促使”。；distinctive style：鲜明独特的风格。；one of the most commonly used prompts：最常用的提示词之一。","zh":"如今，在新型开源 AI 艺术生成器 Stable Diffusion 中，他那独特的风格已成为最常用的提示词之一。","tip":"这里的 style 被转化为提示词使用，准确说是用户输入他的姓名以调用类似风格，并非风格本身是一段固定文字。"},{"id":"2024-T3-P2-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"The tool, along with other popular image-generation AI models, allows anyone to create impressive images based on text prompts.","core":"The tool allows anyone to create impressive images.","structure":"along with ... 是插入式介词短语，不改变主语 The tool 的单数；based on text prompts 是过去分词短语，修饰 images。","key":"along with：连同、以及；谓语的数通常与前面的中心主语保持一致。；allow sb to do：使某人能够做某事。；based on text prompts：以文字提示为依据。","zh":"这一工具与其他流行的图像生成 AI 模型一样，让任何人都能依据文字提示创作出令人印象深刻的图像。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T3-P2-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"For example, type in “Wizard with sword and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,” and the system will produce something that looks not a million miles away from works in Rutkowski’s style.","core":"祈使句 type in ... 与陈述句 the system will produce something ... 由 and 连接，构成“做……就会……”的条件结果关系。","structure":"that looks ... 是定语从句，修饰 something；works in Rutkowski’s style 指具有鲁特科夫斯基风格的作品。","key":"not a million miles away from：字面是“相距不到一百万英里”，实际是弱化式表达，意为“与……相当接近、很相似”。；type in：键入、输入。；a glowing orb of magic fire：一团闪耀的球状魔法火焰。","zh":"例如，输入“手持宝剑和一团闪耀魔法火球的巫师与凶猛巨龙战斗，格雷格·鲁特科夫斯基”，系统就会生成与鲁特科夫斯基风格作品十分相似的图像。","tip":"提示词末尾直接加入艺术家姓名，作用是要求系统模仿或逼近其风格。"},{"id":"2024-T3-P3-S06","sec":"text3","sec_label":"Text 3","level":3,"en":"But these open-source programs are built by scraping images from the internet, often without permission and proper attribution to artists.","core":"these open-source programs are built by scraping images.","structure":"by scraping ... 说明程序或模型的构建方式；often without ... 补充抓取行为常见的合规缺陷。","key":"scrape：此处是技术用语，指用程序从网站大规模抓取、收集数据或图像，不是“刮擦”。；attribution：作品署名及来源标注，不是一般的“属性”。；without permission：未经许可。；proper attribution to artists：对艺术家作恰当署名或来源说明。","zh":"然而，这些开源程序是通过从互联网上抓取图像构建的，而这种抓取往往未经许可，也没有恰当地注明艺术家身份与作品来源。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T3-P4-S09","sec":"text3","sec_label":"Text 3","level":3,"en":"According to the website Lexica, which tracks over 10 million images and prompts generated by Stable Diffusion, Rutkowski’s name has been used as a prompt around 93,000 times.","core":"Rutkowski’s name has been used as a prompt around 93,000 times.","structure":"According to ... 交代数据来源；which tracks ... 是非限制性定语从句，修饰 the website Lexica；generated by Stable Diffusion 修饰 images and prompts。","key":"track：持续追踪、记录。；be used as a prompt：被用作提示词。","zh":"据 Lexica 网站统计，该网站追踪了 Stable Diffusion 生成的 1,000 多万张图像及其提示词；鲁特科夫斯基的名字被用作提示词约 9.3 万次。","tip":"9.3 万次指他的姓名被输入为提示词的次数，不代表他本人创作了 9.3 万幅作品。"},{"id":"2024-T3-P4-S10","sec":"text3","sec_label":"Text 3","level":3,"en":"Rutkowski was initially surprised but thought it might be a good way to reach new audiences.","core":"Rutkowski was ... surprised but thought ...。","structure":"but 连接主语相同的两个谓语；it 指其姓名或风格在 AI 生成器中受到关注这件事；to reach new audiences 修饰 way。","key":"initially：起初、一开始。；reach new audiences：触达新的受众群体。","zh":"鲁特科夫斯基起初感到惊讶，但也认为这或许是接触新受众的好办法。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T3-P4-S11","sec":"text3","sec_label":"Text 3","level":3,"en":"Then he tried searching for his name to see if a piece he had worked on had been published.","core":"he tried searching for his name.","structure":"to see ... 是目的状语；if ... had been published 是 see 的宾语从句；he had worked on 是省略关系代词的定语从句，修饰 a piece。","key":"try doing：尝试做某事，强调试用一种办法。；a piece：此处指一件艺术作品。","zh":"后来，他尝试搜索自己的名字，想看看自己参与创作的某件作品是否已经发表。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T3-P4-S12","sec":"text3","sec_label":"Text 3","level":3,"en":"The online search brought back work that had his name attached to it but wasn’t his.","core":"The online search brought back work.","structure":"that had ... but wasn’t ... 是定语从句，修饰集合意义的 work；it 指这些作品，his 后省略了 work，意为“不是他的作品”。","key":"bring back：此处指搜索“返回、呈现”结果，不是“带回来”或“使回忆起”。；have one’s name attached to：被附上某人的名字、以某人的名义标注。","zh":"网上搜索返回了一些标有他名字、却并非由他创作的作品。","tip":"搜索结果是带有其姓名的 AI 风格作品，并非他找到自己发表过的真作。"},{"id":"2024-T3-P5-S15","sec":"text3","sec_label":"Text 3","level":3,"en":"I probably won’t be able to find my work out there because the internet will be flooded with AI art,” Rutkowski says.","core":"I probably won’t be able to find my work.","structure":"because ... 引导原因从句；将来时 will be flooded 表达他对一年后网络环境的担忧。","key":"out there：此处指互联网上可公开搜索到的空间。；be flooded with：充斥着、被大量……淹没。","zh":"到那时，我恐怕会无法在网上找到自己的作品，因为互联网将充斥着 AI 艺术作品。”鲁特科夫斯基说。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T3-P6-S17","sec":"text3","sec_label":"Text 3","level":3,"en":"Other artists besides Rutkowski have been surprised by the apparent popularity of their work in text-to-image generators — and some are now fighting back.","core":"Other artists ... have been surprised ... , and some are now fighting back.","structure":"besides Rutkowski 修饰 Other artists；of their work ... 修饰 popularity；破折号后的 and 推进到艺术家的实际反应。","key":"apparent popularity：表面上或看起来很受欢迎；这里并非真正的艺术市场人气，而是作品被纳入数据集、姓名或风格被模型用户调用。；fight back：反击、采取行动维护自身权益。","zh":"除了鲁特科夫斯基，其他艺术家也惊讶地发现自己的作品似乎在文生图生成器中大受欢迎，而其中一些人如今正开始反击。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T3-P6-S18","sec":"text3","sec_label":"Text 3","level":3,"en":"Karla Ortiz, an illustrator based in San Francisco who found her work in Stable Diffusion’s data set, has been raising awareness about the issues around AI art and copyright.","core":"Karla Ortiz ... has been raising awareness ...。","structure":"an illustrator ... 是主语的同位语；based in San Francisco 修饰 illustrator；who found ... 是定语从句，继续说明她采取行动的背景。","key":"be based in：常驻于、以……为工作地点。；data set：数据集。；raise awareness about：提升人们对……的认识，使……受到关注。","zh":"卡拉·奥尔蒂斯是一位常驻旧金山的插画家，她发现自己的作品出现在 Stable Diffusion 的数据集中，此后一直在推动人们关注 AI 艺术与版权相关的问题。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T3-P7-S19","sec":"text3","sec_label":"Text 3","level":3,"en":"Artists say they risk losing income as people start using AI-generated images based on copyrighted material for commercial purposes.","core":"Artists say (that) they risk losing income.","structure":"as ... 引导时间兼原因背景；using ... for commercial purposes 是 start 的宾语；AI-generated 与 based on ... 都修饰 images。","key":"risk doing：面临做某事或遭受某种后果的风险。；copyrighted material：受版权保护的材料。；for commercial purposes：用于商业目的。","zh":"艺术家们表示，随着人们开始把基于受版权保护材料生成的 AI 图像用于商业目的，他们面临收入损失的风险。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T3-P7-S20","sec":"text3","sec_label":"Text 3","level":3,"en":"But it’s also a lot more personal, Ortiz says, arguing that because art is so closely linked to a person, it could raise data protection and privacy problems.","core":"it’s also a lot more personal, Ortiz says.","structure":"arguing that ... 是现在分词短语，补充奥尔蒂斯的理由；that 引导宾语从句；其中 because ... 解释为何会出现数据保护和隐私问题。","key":"personal：此处不只是“个人的”，还强调艺术风格与创作者身份、人格表达密切相关。；raise ... problems：引发……问题。","zh":"但奥尔蒂斯说，这个问题也具有更强的个人属性；她认为，由于艺术与创作者本人紧密相连，这种做法还可能引发数据保护和隐私问题。","tip":"宾语从句中的 it 指 AI 使用与个人紧密相连的艺术作品或风格这件事，不是泛指“艺术”本身会造成隐私问题。"},{"id":"2024-T3-P8-S21","sec":"text3","sec_label":"Text 3","level":3,"en":"“There is a coalition growing within artist industries to figure out how to tackle or mitigate this,” says Ortiz.","core":"引语内部为 There is a coalition growing ...。","structure":"growing within artist industries 是现在分词短语，修饰 coalition；to figure out ... 是目的状语；this 回指 AI 抓取和模仿艺术作品所带来的版权、收入与隐私问题。","key":"coalition：为共同目标组成的联盟。；tackle or mitigate：处理或减轻；tackle 强调着手解决，mitigate 强调降低危害。；figure out how to do：设法弄清如何做某事。","zh":"奥尔蒂斯说：“艺术行业内部正在形成并壮大一个联盟，以研究如何应对或减轻这一问题。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T3-P8-S22","sec":"text3","sec_label":"Text 3","level":3,"en":"The group is in its early days of mobilization, which could involve pushing for new policies or regulation.","core":"The group is in its early days of mobilization.","structure":"which ... 是非限制性定语从句，补充说明这种动员可能采取的形式；pushing for ... 作 involve 的宾语。","key":"push for：积极争取、推动实现，而非字面“推”。；in its early days：尚处于早期阶段。；mobilization：为集体行动而组织、动员。","zh":"这一团体的动员尚处于早期阶段，后续行动可能包括推动出台新的政策或监管规定。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T3-P8-S23","sec":"text3","sec_label":"Text 3","level":3,"en":"One suggestion is that AI models could be trained on images in the public domain, and AI companies could forge partnerships with museums and artists, Ortiz says.","core":"One suggestion is that ...；句末 Ortiz says 标明说话者。","structure":"that 引导表语从句；从句内 AI models could be trained ... 与 AI companies could forge ... 由 and 并列，构成两项建议。","key":"public domain：公有领域，指不受版权限制、公众可依法使用的作品范围；不是“公共机构”。；forge partnerships：建立、缔结合作关系，forge 此处不是“伪造”。；be trained on images：使用图像作为训练材料。；forge partnerships with：与……建立合作关系。","zh":"奥尔蒂斯说，一项建议是，AI 模型可以改用公有领域中的图像进行训练，同时 AI 公司可以与博物馆和艺术家建立合作关系。","tip":"images in the public domain 对应改变模型训练策略；与博物馆合作不等于向公共机构提供 AI 服务。"},{"id":"2024-T4-P1-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water.","core":"The miracle ... lies not in its depths, but in ...。","structure":"not in ... but in ... 构成对照；第二个 in 后有三个并列宾语：the complexity ...、the interaction ... 和 the mix ...。","key":"construction：此处不是人工“建筑、施工”，而是海湾天然形成的构造与组成。；lie in：此处意为“存在于、在于”，不是“躺在”或“说谎”。；saline waters：咸水水体。；the interaction of：……之间的相互作用、交汇。","zh":"切萨皮克湾的奇妙之处不在于水有多深，而在于其自然构造的复杂性、淡水与咸水的交汇，以及陆地与水域的交融。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P1-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.","core":"The shallows provide homes for hundreds of species.","structure":"while 后接三个并列的现在分词 storing、filtering 和 protecting，说明浅水区同时发挥的生态功能。","key":"the shallows：浅水区，是形容词名词化用法，不是泛指“肤浅之处”。；store floodwaters：蓄纳、暂存洪水，从而缓解洪峰。；filter pollutants from water：从水中过滤污染物。；protect A from B：保护 A 免受 B 影响。","zh":"这些浅水区为数百种生物提供栖息地，同时还能蓄纳洪水、滤除水中污染物，并保护附近社区免受可能造成破坏的风暴潮侵袭。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P2-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"All this was put at great risk late last month, when the U.S. Supreme Court issued a ruling in an Idaho case that provides the U.S. Environmental Protection Agency (EPA) far less authority to regulate wetlands and waterways.","core":"All this was put at great risk.","structure":"when ... 是时间从句；that provides ... far less authority ... 是定语从句，修饰 a ruling；to regulate ... 说明 authority 的内容。","key":"put ... at risk：使……处于危险之中。；authority：此处指依法监管的权限、职权，不是“权威人士”。；issue a ruling：作出、发布裁决。；regulate wetlands and waterways：依法监管湿地和水道。","zh":"上月底，美国最高法院就爱达荷州的一起案件作出裁决，使美国环境保护署（EPA）监管湿地和水道的权限大幅缩减，前述一切生态价值因此面临巨大风险。","tip":"All this 回指第一段列举的海湾生态构造和功能；法院裁决不是加强而是明显削弱 EPA 权限。"},{"id":"2024-T4-P2-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a “continuous surface connection” to bodies of water.","core":"a 5-4 majority decided that wetlands ... must have ...。","structure":"that 引导宾语从句；protected by the EPA 是过去分词短语，修饰 wetlands；under its Clean Water Act authority 说明 EPA 保护湿地的法律依据。","key":"a 5-4 majority：以 5 票对 4 票形成的多数意见。；under its ... authority：依据其由……赋予的权限。；continuous surface connection：连续的地表水连接。","zh":"具体而言，最高法院以 5 比 4 的多数意见裁定，EPA 依据《清洁水法》权限所保护的湿地，必须与水体之间存在“连续的地表连接”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P2-S05","sec":"text4","sec_label":"Text 4","level":3,"en":"This narrowing of the regulatory scope was a victory for builders, mining operators and other commercial interests often at odds with environmental rules.","core":"This narrowing ... was a victory for ...。","structure":"of the regulatory scope 修饰 narrowing；often at odds with environmental rules 修饰并列的商业利益方。","key":"interest：此处指具有共同利益的商业集团或利益方，不是“兴趣”。；at odds with：与……不一致、相冲突。","zh":"监管范围的这次收窄，对建筑商、采矿经营者以及其他经常与环境法规利益相冲突的商业集团来说，是一场胜利。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P2-S06","sec":"text4","sec_label":"Text 4","level":3,"en":"And it carries “significant repercussions for water quality and flood control throughout the United States,” as Justice Brett Kavanaugh observed.","core":"it carries significant repercussions for ...。","structure":"it 指最高法院裁决或监管范围收窄；as Justice Brett Kavanaugh observed 表示“正如……所指出的”。","key":"carry repercussions for：给……带来后续影响或严重后果，repercussion 常含负面意味。","zh":"正如布雷特·卡瓦诺大法官所指出的，这项裁决“将对全美国的水质和防洪产生重大影响”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P3-S07","sec":"text4","sec_label":"Text 4","level":3,"en":"In Maryland, the good news is that there are many state laws in place that provide wetlands protections.","core":"the good news is that there are many state laws in place.","structure":"第一个 that 引导表语从句；第二个 that 引导定语从句，修饰 state laws。","key":"be in place：已经建立、正在实施或生效。；provide wetlands protections：为湿地提供法律保护。","zh":"好消息是，马里兰州已经施行多项州法律，为湿地提供保护。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P3-S09","sec":"text4","sec_label":"Text 4","level":3,"en":"The reality is that water, and the pollutants that so often come with it, don’t respect state boundaries.","core":"The reality is that water ... don’t respect state boundaries.","structure":"that 引导表语从句；and the pollutants ... 是插入的并列主语；that so often come with it 是定语从句，修饰 pollutants；it 指水。","key":"respect state boundaries：这里是拟人表达，意为“受州界限制、止步于州界”，不是“尊重州界”。","zh":"现实是，水以及常随水而来的污染物并不受州界约束。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P3-S10","sec":"text4","sec_label":"Text 4","level":3,"en":"The Chesapeake draws from a 64,000-square-mile watershed that extends into Virginia, Pennsylvania, New York, West Virginia, the District of Columbia and Delaware.","core":"The Chesapeake draws from a ... watershed.","structure":"64,000-square-mile 是复合形容词，修饰 watershed；that extends into ... 是定语从句，列出流域跨越的六个司法辖区。","key":"draw from：此处指从某一流域汇入、获得水源，而非“从……得出结论”。；watershed：流域、集水区，即降水最终汇向同一水体的区域。","zh":"切萨皮克湾汇集了一个面积达 6.4 万平方英里的流域来水，该流域延伸至弗吉尼亚州、宾夕法尼亚州、纽约州、西弗吉尼亚州、哥伦比亚特区和特拉华州。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P3-S11","sec":"text4","sec_label":"Text 4","level":3,"en":"Will those jurisdictions extend the same protections now denied under Sackett v. EPA?","core":"Will those jurisdictions extend the same protections?","structure":"now denied under Sackett v. EPA 是过去分词短语，修饰 protections，说明这些保护因该案裁决而不再由联邦法规覆盖。","key":"jurisdiction：拥有自身立法或行政权限的辖区，此处指前句列举的各州及哥伦比亚特区。；Sackett v. EPA：“萨克特诉美国环保署案”；v. 表示诉讼双方之间的“诉”。","zh":"在“萨克特诉美国环保署案”裁决导致联邦层面的这些保护不再适用后，上述各司法辖区会自行提供同等保护吗？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P3-S12","sec":"text4","sec_label":"Text 4","level":3,"en":"Perhaps some, but all?","core":"见结构","structure":"这是承接上一问的省略句，完整意思是 Perhaps some jurisdictions will, but will all jurisdictions do so?","key":"见下方词汇笔记","zh":"也许有些辖区会，但所有辖区都会吗？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P4-S14","sec":"text4","sec_label":"Text 4","level":3,"en":"It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their neighbors.","core":"It is too easy, and misleading, to see such court rulings as ...。","structure":"It 是形式主语，真正主语是 to see ...；see A as B 表示“把 A 看作 B”；when ... 引导背景或原因情境，指出这种看法忽略了严重的外部后果。","key":"stand up for：支持、捍卫某人或某事物。；dire：极其严重的、可怕的。","zh":"把这类法院裁决仅仅视为维护土地所有者权利，实在过于简单，也会造成误导，因为其后果对土地所有者的邻近地区和居民可能极其严重。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P4-S15","sec":"text4","sec_label":"Text 4","level":3,"en":"And it’s a reminder that the EPA’s involvement in the Chesapeake Bay Program has long been crucial as the means to transcend the influence of deep-pocketed special interests in neighboring states.","core":"it’s a reminder that the EPA’s involvement ... has long been crucial.","structure":"that 引导 reminder 的同位语从句；从句主语是 the EPA’s involvement ...；as the means to transcend ... 说明这种参与为何关键；to transcend ... 修饰 means。","key":"deep-pocketed：财力雄厚的，尤指有能力影响政策的利益方。；special interests：特殊利益集团，指推动自身利益而可能损害公共利益的组织或行业力量。；transcend：超越、突破……的限制或影响。","zh":"这也提醒人们，长期以来，EPA 参与切萨皮克湾计划一直至关重要，因为它使流域保护能够超越邻近各州财力雄厚的特殊利益集团的影响。","tip":"作者不是赞扬 EPA “尊重各州各自为政”，而是强调它能克服各州特殊利益造成的分散与阻碍。"},{"id":"2024-T4-P4-S16","sec":"text4","sec_label":"Text 4","level":3,"en":"Pennsylvania farmers, to use one telling example, aren’t thinking about next year’s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream.","core":"Pennsylvania farmers aren’t thinking about ... , yet the runoff ... can have enormous impact downstream.","structure":"to use one telling example 是插入语；when ... 是时间从句；whether to spread ... 作 decide 的宾语；yet 连接转折分句，揭示上游行为对下游的真实影响。","key":"telling：此处意为“很能说明问题的、有说服力的”，不是“讲述的”。；animal waste：此处主要指农业中的动物粪便、粪肥。；runoff：地表径流，雨水冲刷农田后流入河溪的水体。；whether to do：是否做某事。","zh":"举一个很能说明问题的例子：宾夕法尼亚州的农民决定是否把动物粪肥撒在田里时，并不会考虑马里兰州下一年的蓝蟹收成；然而，流入附近溪流的地表径流却可能对下游造成巨大影响。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P5-S17","sec":"text4","sec_label":"Text 4","level":3,"en":"And so we would call on state lawmakers from Richmond to Albany to consider reviewing their own wetlands protections and see for themselves the enormous stakes involved.","core":"we would call on state lawmakers ... to consider ... and see ...。","structure":"from Richmond to Albany 以州府代指流域内从弗吉尼亚州到纽约州的立法者；to consider ... and see ... 是两个并列的不定式补语；involved 修饰 stakes。","key":"call on sb to do：呼吁、敦促某人做某事。；stakes：此处指成败所牵涉的重大利益与风险，不是“木桩”。；consider reviewing：考虑重新审查。；see for oneself：亲自了解、亲眼确认。","zh":"因此，我们呼吁从里士满到奥尔巴尼的各州立法者重新审视本州的湿地保护措施，并亲自认清其中牵涉的巨大利害关系。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2024-T4-P5-S18","sec":"text4","sec_label":"Text 4","level":3,"en":"We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a boat across them but teaming with aquatic life.","core":"We can offer them a visit to ...。","structure":"where ... 是定语从句，修饰保护区；从句中 so shallow (that) ... 省略 that，表示“浅到无法划船通过”；but teaming with aquatic life 与 so shallow ... 形成转折描述。","key":"tidal marshes：受潮汐周期性淹没的湿地、潮汐沼泽。；aquatic life：水生生物。；teaming with aquatic life：原文如此拼写，按语境意为“水生生物繁盛”；常见固定搭配写作 teeming with。","zh":"我们可以邀请他们到多切斯特县的黑水国家野生动物保护区走一趟；在那里，白头海雕翱翔于潮汐沼泽之上，沼泽浅得无法划船通过，却有着繁盛的水生生物。","tip":"them 指各州立法者；“无法划船”源于水太浅，不是水域危险。"}]};</script>

nd collect questionnaires, and help organize interviews with team members."],["工作时间","The work requires about five hours a week, mostly on weekday afternoons."],["要求一","Applicants should be second- or third-year students with good communication skills and a basic knowledge of statistics."],["要求二","Familiarity with Excel is required, and experience in organizing campus events is preferred."],["报名方式与截止时间","Those interested should send a brief application to the Student Union office before May 20."],["落款","Li Ming / The Student Union"]],"expressions":["Notice","... is recruiting one student assistant for ...","The assistant will be responsible for ...","The work requires about ... hours a week, mostly on ...","Applicants should be ... with ...","Familiarity with ... is required, and ... is preferred.","Those interested should ... before ...","Li Ming, The Student Union"],"traps":["必须写成 notice（通知），首行居中写 Notice，结尾署名 Li Ming，不能写成书信、电子邮件或海报。","招募对象只有一名学生，职责要具体（收集数据、发放回收问卷、协助访谈等），不能只写“帮忙做研究”。","题目要求 specify the duties and requirements，职责与要求两部分都要写全，不能只写其中一项。","通知面向全校学生，语气正式简洁，多用被动语态和情态动词；约100词，不要写成大段议论。","不要出现真实姓名、地址或与题目无关的社团介绍；署名处写 Li Ming，不写 Prof. Smith。"]},"partB":{"title":"Part B · 图画作文","score":20,"words":"160–200词","prompt":"Write an essay of 160-200 words based on the picture below. In your essay, you should 1) describe the picture briefly, 2) interpret the implied meaning, and 3) give your comments. You should write neatly on the ANSWER SHEET. (20 points)","prompt_zh":"根据所给图画写一篇160—200词的短文。要求：1）简要描述图画；2）解释其寓意；3）给出你的评论。","structure":[["第一段·描述图画","The picture shows a dragon boat race on a river in a Chinese village; two dragon-headed boats race while a crowd cheers on the bank and the stone bridge, and an elderly couple in the foreground smile and remark that the village race is livelier every year."],["第二段·解释寓意","The scene reflects the revival of rural cultural life: as villages prosper, traditional folk activities are returning, bringing neighbours together, attracting visitors and giving the elderly a sense of a community that is alive and growing."],["第三段·发表评论","Such activities deserve support; governments should protect the venues and pass on traditional skills, for a village that can still make its old people smile has found a prosperity that GDP cannot fully measure."]],"expressions":["The picture shows ... on a river in a Chinese village.","Two dragon-headed boats cut through the water as rowers pull in unison.","A crowd has gathered along the bank and on the stone bridge, waving flags and cheering.","In the foreground, an elderly couple watch with happy smiles.","The scene reflects the quiet revival of rural cultural life.","... is more than a competition: it brings neighbours together and gives young people a reason to come home.","For the elderly, ... are proof that their community is alive and growing.","In my view, such activities deserve support.","... has found a form of prosperity that GDP cannot fully measure."],"traps":["描述要覆盖龙舟竞渡、桥上与岸边的观众、近景老年夫妇及其引语，缺一不可；只写“赛龙舟很热闹”会失分。","寓意要落在乡村文化生活活跃、传统民俗传承、老年人幸福感与获得感，不要偏题成“体育锻炼”“旅游开发”或“代际冲突”。","引语“真好啊，咱们村的龙舟赛越来越热闹了”要译成英文并融入描述，描述部分用一般现在时。","160–200词，三段为宜；描述用现在时，分析可用现在时或现在完成时，评论用现在时。","不要褒贬颠倒，也不要把龙舟赛写成商业比赛或只分析竞技胜负；重点在文化传承与情感温度。"]}},"vocab":[{"w":"temperature will be high","pos":"phr.","cn":"字面义是“温度会很高”，此处借天气作双关，实际指会议气氛紧张、争论激烈。","sec":"text1","sec_label":"Text 1","ctx":"The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as offic","note":"字面义是“温度会很高”，此处借天气作双关，实际指会议气氛紧张、争论激烈。","forms":["temperature will be high"]},{"w":"cool since the recent extreme heat","pos":"phr.","cn":"自最近的极端高温天气以来转凉。","sec":"text1","sec_label":"Text 1","ctx":"The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as offic","note":"自最近的极端高温天气以来转凉。","forms":["cool since the recent extreme heat"]},{"w":"debate how ... is taught","pos":"phr.","cn":"就“如何教授……”展开辩论；how 引导宾语从句。","sec":"text1","sec_label":"Text 1","ctx":"The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as offic","note":"就“如何教授……”展开辩论；how 引导宾语从句。","forms":["debate how ... is taught"]},{"w":"sympathise with the views of","pos":"phr.","cn":"赞同、支持……的观点；此处并非“同情能源行业”。","sec":"text1","sec_label":"Text 1","ctx":"Pat Hardy, who sympathises with the views of the energy sector, is resisting proposed changes to science standards for pre-teen pupils.","note":"赞同、支持……的观点；此处并非“同情能源行业”。","forms":["sympathise with the views of"]},{"w":"resist proposed changes to","pos":"phr.","cn":"抵制对……拟议中的修改。","sec":"text1","sec_label":"Text 1","ctx":"Pat Hardy, who sympathises with the views of the energy sector, is resisting proposed changes to science standards for pre-teen pupils.","note":"抵制对……拟议中的修改。","forms":["resist proposed changes to"]},{"w":"pre-teen pupils","pos":"phr.","cn":"尚未进入青春期的学生，通常指 12 岁以下的儿童。","sec":"text1","sec_label":"Text 1","ctx":"Pat Hardy, who sympathises with the views of the energy sector, is resisting proposed changes to science standards for pre-teen pupils.","note":"尚未进入青春期的学生，通常指 12 岁以下的儿童。","forms":["pre-teen pupils"]},{"w":"as many ... as ...","pos":"phr.","cn":"与……数量一样多。","sec":"text1","sec_label":"Text 1","ctx":"“There are as many scientists working against all the panic of global climate change as there are those who are pushing it,” she claims.","note":"与……数量一样多。","forms":["as many ... as ..."]},{"w":"work against","pos":"phr.","cn":"反对并设法抵制。","sec":"text1","sec_label":"Text 1","ctx":"“There are as many scientists working against all the panic of global climate change as there are those who are pushing it,” she claims.","note":"反对并设法抵制。","forms":["work against"]},{"w":"push it","pos":"phr.","cn":"此处指推动、渲染关于全球气候变化的恐慌论调。","sec":"text1","sec_label":"Text 1","ctx":"“There are as many  as not a hotel, be treated and taxed and regulated like a hotel?” Horn sa","note":"把 A 伪装成 B。","forms":["disguise A as B"]},{"w":"be treated, taxed and regulated like","pos":"phr.","cn":"像……一样被对待、征税和监管。","sec":"text2","sec_label":"Text 2","ctx":"“I think the question is, shouldn’t a developer who’s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?” Horn sa","note":"像……一样被对待、征税和监管。","forms":["be treated, taxed and regulated like"]},{"w":"rein in","pos":"phr.","cn":"原指“勒紧缰绳使马停下”，此处意为“控制、约束”。","sec":"text2","sec_label":"Text 2","ctx":"At the end of 2018, Governor Charlie Baker of Massachusetts signed a bill to rein in those potential investor-buyers.","note":"原指“勒紧缰绳使马停下”，此处意为“控制、约束”。","forms":["rein in"]},{"w":"investor-buyers","pos":"词","cn":"以投资获利为目的的购房者。","sec":"text2","sec_label":"Text 2","ctx":"At the end of 2018, Governor Charlie Baker of Massachusetts signed a bill to rein in those potential investor-buyers.","note":"以投资获利为目的的购房者。","forms":["investor-buyers"]},{"w":"sign a bill","pos":"phr.","cn":"签署法案，使其进入生效程序。","sec":"text2","sec_label":"Text 2","ctx":"At the end of 2018, Governor Charlie Baker of Massachusetts signed a bill to rein in those potential investor-buyers.","note":"签署法案，使其进入生效程序。","forms":["sign a bill"]},{"w":"rental host","pos":"phr.","cn":"提供短租房源的房东或经营者。","sec":"text2","sec_label":"Text 2","ctx":"The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy.","note":"提供短租房源的房东或经营者。","forms":["rental host"]},{"w":"carry insurance","pos":"phr.","cn":"持有、购买保险。","sec":"text2","sec_label":"Text 2","ctx":"The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy.","note":"持有、购买保险。","forms":["carry insurance"]},{"w":"on top of","pos":"phr.","cn":"在……之外再加上。","sec":"text2","sec_label":"Text 2"," e consultancies that provide language and other editorial support to individu","note":"利用学术发表需求牟利或操纵评价的掠夺性行为。","forms":["predatory behavior"]},{"w":"support service consultancies","pos":"phr.","cn":"提供语言和编辑等支持服务的咨询机构。","sec":"text4","sec_label":"Text 4","ctx":"Recently, another expression of this predatory behavior has emerged: so-called support service consultancies that provide language and other editorial support to individu","note":"提供语言和编辑等支持服务的咨询机构。","forms":["support service consultancies"]},{"w":"advise sb. to do","pos":"phr.","cn":"建议某人做……。","sec":"text4","sec_label":"Text 4","ctx":"Recently, another expression of this predatory behavior has emerged: so-called support service consultancies that provide language and other editorial support to individu","note":"建议某人做……。","forms":["advise sb. to do"]},{"w":"add citations to articles","pos":"phr.","cn":"在文章中添加引用。","sec":"text4","sec_label":"Text 4","ctx":"Recently, another expression of this predatory behavior has emerged: so-called support service consultancies that provide language and other editorial support to individu","note":"在文章中添加引用。","forms":["add citations to articles"]},{"w":"outlets","pos":"词","cn":"常见义为“出口、商店”；此处指论文发表的渠道或平台。","sec":"text4","sec_label":"Text 4","ctx":"The advent of electronic publishing and authors’ need to find outlets for their papers resulted in thousands of new journals.","note":"常见义为“出口、商店”；此处指论文发表的渠道或平台。","forms":["outlets"]},{"w":"the advent of","pos":"phr.","cn":"……的出现、到来。","sec":"text4","sec_label":"Text 4","ctx":"The advent of electronic publishing and authors’ need to find outlets for their papers resulted in thousands of new journals.","note":"……的出现、到来。","forms":["the advent of"]},{"w":"result in","pos":"phr.","cn":"导致、产生。","sec":"text4","sec_label":"Text 4","ctx":"The advent of electronic publishing and authors’ need to find outlets for their papers resulted in thousands of new journals.","note":"导致、产生。","forms":["result in"]},{"w":"not be far behind","pos":"phr.","cn":"紧随其后、很快出现。","sec":"text4","sec_label":"Text 4","ctx":"The birth of predatory journals wasn’t far behind.","note":"紧随其后、很快出现。","forms":["not be far behind"]},{"w":"predatory journals","pos":"phr.","cn":"以收取费用为主、缺乏规范审稿并可能参与学术操纵的掠夺性期刊。","sec":"text4","sec_label":"Text 4","ctx":"The birth of predatory journals wasn’t far behind.","note":"以收取费用为主、缺乏规范审稿并可能参与学术操纵的掠夺性期刊。","forms":["predatory journals"]},{"w":"milk cows","pos":"phr.","cn":"字面为“奶牛”；此处比喻能被反复利用、持续产出利益的工具，具体指为特定论文批量制造引用的期刊。","sec":"text4","sec_label":"Text 4","ctx":"These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers.","note":"字面为“奶牛”；此处比喻能被反复利用、持续产出利益的工具，具体指为特定论文批量制造引用的期刊。","forms":["milk cows"]},{"w":"issue","pos":"词","cn":"常见义为“问题”；此处指期刊的某一期。","sec":"text4","sec_label":"Text 4","ctx":"These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers.","note":"常见义为“问题”；此处指期刊的某一期。","forms":["issue"]},{"w":"act as","pos":"phr.","cn":"充当、起……作用。","sec":"text4","sec_label":"Text 4","ctx":"These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers.","note":"充当、起……作用。","forms":["act as"]},{"w":"a specific paper or a series of papers","pos":"phr.","cn":"某篇特定论文或一组特定论文。","sec":"text4","sec_label":"Text 4","ctx":"These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers.","note":"某篇特定论文或一组特定论文。","forms":["a specific paper or a series of papers"]},{"w":"in some instances","pos":"phr.","cn":"在某些情况下。","sec":"text4","sec_label":"Text 4","ctx":"In some instances, there is absolutely no relationship between the content of the article and the citations.","note":"在某些情况下。","forms":["in some instances"]},{"w":"have no relationship with/between","pos":"phr.","cn":"与……毫无关系。","sec":"text4","sec_label":"Text 4","ctx":"In some instances, there is absolutely no relationship between the content of the article and the citations.","note":"与……毫无关系。","forms":["have no relationship with/between"]},{"w":"supposedly","pos":"adv.","cn":"据称、按说、名义上；此处带有对编辑真实角色或动机的怀疑。","sec":"text4","sec_label":"Text 4","ctx":"The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals.","note":"据称、按说、名义上；此处带有对编辑真实角色或动机的怀疑。","forms":["supposedly"]},{"w":"profit","pos":"词","cn":"此处作动词，意为“获益、得到好处”，不只指直接金钱利润。","sec":"text4","sec_label":"Text 4","ctx":"The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals.","note":"此处作动词，意为“获益、得到好处”，不只指直接金钱利润。","forms":["profit"]},{"w":"lead sb./sth. to do","pos":"phr.","cn":"使某人或某物产生某种结果。","sec":"text4","sec_label":"Text 4","ctx":"Such practices can lead an article to accrue more than 150 citations in the same year that it was published.","note":"使某人或某物产生某种结果。","forms":["lead sb./sth. to do"]},{"w":"accrue citations","pos":"phr.","cn":"逐渐累积引用次数。","sec":"text4","sec_label":"Text 4","ctx":"Such practices can lead an article to accrue more than 150 citations in the same year that it was published.","note":"逐渐累积引用次数。","forms":["accrue citations"]},{"w":"in the same year that","pos":"phr.","cn":"就在……的同一年。","sec":"text4","sec_label":"Text 4","ctx":"Such practices can lead an article to accrue more than 150 citations in the same year that it was published.","note":"就在……的同一年。","forms":["in the same year that"]},{"w":"insidious","pos":"adj.","cn":"暗中发展的、隐蔽而有害的，强调问题不易察觉却会逐步造成严重影响。","sec":"text4","sec_label":"Text 4","ctx":"How insidious is this type of citation manipulation?","note":"暗中发展的、隐蔽而有害的，强调问题不易察觉却会逐步造成严重影响。","forms":["insidious"]},{"w":"act as author, editor, and consultant","pos":"phr.","cn":"同时充当作者、编辑和顾问。","sec":"text4","sec_label":"Text 4","ctx":"In one example, an individual — acting as author, editor, and consultant — was able to use at least 15 journals as citation providers to articles published by five scient","note":"同时充当作者、编辑和顾问。","forms":["act as author, editor, and consultant"]},{"w":"use ... as citation providers","pos":"phr.","cn":"利用……作为引用提供者。","sec":"text4","sec_label":"Text 4","ctx":"In one example, an individual — acting as author, editor, and consultant — was able to use at least 15 journals as citation providers to articles published by five scient","note":"利用……作为引用提供者。","forms":["use ... as citation providers"]},{"w":"rampant","pos":"词","cn":"泛滥的、猖獗的，指问题广泛存在且难以控制。","sec":"text4","sec_label":"Text 4","ctx":"The problem is rampant in Scopus, a citation database, which includes a high number of the new “international” journals.","note":"泛滥的、猖獗的，指问题广泛存在且难以控制。","forms":["rampant"]},{"w":"citation database","pos":"phr.","cn":"引文数据库。","sec":"text4","sec_label":"Text 4","ctx":"The problem is rampant in Scopus, a citation database, which includes a high number of the new “international” journals.","note":"引文数据库。","forms":["citation database"]},{"w":"a high number of","pos":"phr.","cn":"大量的。","sec":"text4","sec_label":"Text 4","ctx":"The problem is rampant in Scopus, a citation database, which includes a high number of the new “international” journals.","note":"大量的。","forms":["a high number of"]},{"w":"a listing in Scopus","pos":"phr.","cn":"被 Scopus 数据库收录、列入其索引。","sec":"text4","sec_label":"Text 4","ctx":"In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.","note":"被 Scopus 数据库收录、列入其索引。","forms":["a listing in Scopus"]},{"w":"be targeted","pos":"phr.","cn":"被选作操纵对象、成为目标。","sec":"text4","sec_label":"Text 4","ctx":"In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.","note":"被选作操纵对象、成为目标。","forms":["be targeted"]},{"w":"malpractice","pos":"词","cn":"不当行为、违规操作；此处具体指引用操纵，而不只是医疗事故。","sec":"text4","sec_label":"Text 4","ctx":"Scopus itself has all the data necessary to detect this malpractice.","note":"不当行为、违规操作；此处具体指引用操纵，而不只是医疗事故。","forms":["malpractice"]},{"w":"red flags","pos":"phr.","cn":"字面为“红旗”；此处指提示异常或风险的警示信号。","sec":"text4","sec_label":"Text 4","ctx":"Red flags include a large number of citations to an article within the first year.","note":"字面为“红旗”；此处指提示异常或风险的警示信号。","forms":["red flags"]},{"w":"citations to an article","pos":"phr.","cn":"某篇论文获得的引用。","sec":"text4","sec_label":"Text 4","ctx":"Red flags include a large number of citations to an article within the first year.","note":"某篇论文获得的引用。","forms":["citations to an article"]},{"w":"within the first year","pos":"phr.","cn":"在第一年之内。","sec":"text4","sec_label":"Text 4","ctx":"Red flags include a large number of citations to an article within the first year.","note":"在第一年之内。","forms":["within the first year"]},{"w":"oblige","pos":"词","cn":"常见义为“使感激、帮忙”；do not oblige 在此意为“不要顺从、不要照办”。","sec":"text4","sec_label":"Text 4","ctx":"And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not o","note":"常见义为“使感激、帮忙”；do not oblige 在此意为“不要顺从、不要照办”。","forms":["oblige"]},{"w":"do report","pos":"phr.","cn":"助动词 do 用于加强祈使语气，意为“务必举报”。","sec":"text4","sec_label":"Text 4","ctx":"And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not o","note":"助动词 do 用于加强祈使语气，意为“务必举报”。","forms":["do report"]},{"w":"steer clear of","pos":"phr.","cn":"避开、远离。","sec":"text4","sec_label":"Text 4","ctx":"And for authors who wish to steer clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not o","note":"避开、远离。","forms":["steer clear of"]}],"sentences":[{"id":"2023-T1-P1-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"The weather in Texas may have cooled since the recent extreme heat, but the temperature will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools.","core":"The weather ... may have cooled, but the temperature will be high ...。","structure":"but 连接两个并列分句；at the State Board of Education meeting ... 说明“高温”出现的场合；as officials debate ... 交代会议气氛火热的背景；how climate change is taught 作 debate 的宾语。","key":"temperature will be high：字面义是“温度会很高”，此处借天气作双关，实际指会议气氛紧张、争论激烈。；cool since the recent extreme heat：自最近的极端高温天气以来转凉。；debate how ... is taught：就“如何教授……”展开辩论；how 引导宾语从句。","zh":"得克萨斯州的天气在最近的极端高温之后或许已经转凉，但本月在奥斯汀举行的州教育委员会会议上，气氛仍将十分“火热”，届时官员们将就得州学校如何教授气候变化展开辩论。","tip":"后半句的 temperature 不是在预测天气，而是在形容州教育委员会会议上的对立气氛。"},{"id":"2023-T1-P2-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Pat Hardy, who sympathises with the views of the energy sector, is resisting proposed changes to science standards for pre-teen pupils.","core":"Pat Hardy is resisting proposed changes to science standards.","structure":"who sympathises with the views of the energy sector 是非限制性定语从句，补充哈迪的立场；for pre-teen pupils 修饰 science standards，说明课程标准适用的学生群体。","key":"sympathise with the views of：赞同、支持……的观点；此处并非“同情能源行业”。；resist proposed changes to：抵制对……拟议中的修改。；pre-teen pupils：尚未进入青春期的学生，通常指 12 岁以下的儿童。","zh":"帕特·哈迪认同能源行业的立场，目前正抵制针对青春期前学生的科学课程标准修改提案。","tip":"the energy sector 指能源产业及其利益相关方，不是“能量部门”。"},{"id":"2023-T1-P2-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"“There are as many scientists working against all the panic of global climate change as there are those who are pushing it,” she claims.","core":"There are as many scientists ... as there are those ...。","structure":"第一个 scientists 后的 working against ... 是现在分词短语作后置定语；those who are pushing it 中，those 指另一批科学家，who ... 是定语从句。","key":"as many ... as ...：与……数量一样多。；work against：反对并设法抵制。；push it：此处指推动、渲染关于全球气候变化的恐慌论调。","zh":"她声称：“反对这种全球气候变化恐慌情绪的科学家，与那些极力渲染这种恐慌的科学家一样多。”","tip":"it 承接前文所说的气候变化恐慌论调，而不是泛指能源行业；整句是哈迪本人的主张，并非作者认可的科学结论。"},{"id":"2023-T1-P2-S05","sec":"text1","sec_label":"Text 1","level":3,"en":"You need to remember where your bread is buttered.”","core":"You need to remember ...","structure":"where your bread is buttered 是 remember 的宾语从句，形式上是被动语态，实际使用习语义。","key":"know/remember where one's bread is buttered：知道自己的利益或生计来自何处，因而不应得罪利益提供者。","zh":"你得记住是谁给了你饭碗。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T1-P3-S07","sec":"text1","sec_label":"Text 1","level":3,"en":"Board members like her “casually dismiss the career work of scholars and scientists as just another misguided opinion,” says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that monitors public education.","core":"引语内部为 Board members like her dismiss the career work ... as ...；引语之后以倒装式引述语 says Dan Quinn 标明说话者。","structure":"senior communications strategist ... 是 Dan Quinn 的同位语；a non-profit group ... 是 the Texas Freedom Network 的同位语；that monitors public education 修饰 group。","key":"career work：不是“职业工作”这一泛称，而是指一个人在整个专业生涯中积累的研究成果。；dismiss ... as ...：此处不是“解雇”，而是“不予认真考虑，把……贬作……”。；misguided opinion：错误的、受误导的观点。；communications strategist：传播战略主管，负责机构对外传播与沟通策略。","zh":"得克萨斯自由网络负责传播战略的高级主管丹·奎因说，像她这样的委员会成员“随随便便就把学者和科学家毕生的专业研究贬作又一种错误观点”；得克萨斯自由网络是一家监督公共教育的非营利组织。","tip":"as just another misguided opinion 是哈迪等人强加给科学研究的标签，并非奎因认同科学研究只是错误意见。"},{"id":"2023-T1-P4-S08","sec":"text1","sec_label":"Text 1","level":3,"en":"Such debates reflect fierce discussions across the US, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.","core":"Such debates reflect fierce discussions across the US.","structure":"as 引导伴随背景，说明全美各方正在加强诉求；for a greater focus ... 修饰 demands；teaching about the facts ... 作介词 on 的宾语。","key":"reflect fierce discussions：反映出激烈的讨论或争论。；step up demands for：加大对……的呼声，更强烈地要求……。；a greater focus on：对……给予更多关注。","zh":"此类争论反映出全美范围内的激烈讨论；研究人员、政策制定者、教师和学生都在进一步呼吁，学校教育应更加重视讲授气候变化的科学事实。","tip":"Such debates 指得州围绕气候变化教学标准的争论；the facts of climate change 强调有科学依据的事实，不是泛泛的环保话题。"},{"id":"2023-T1-P5-S09","sec":"text1","sec_label":"Text 1","level":3,"en":"A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country address climate change in science classes, gave barely half of US states a grade B+ or higher.","core":"A study ... gave barely half of US states a grade B+ or higher.","structure":"by the National Center for Science Education 说明研究的实施者；a non-profit group of scientists and teachers 是该中心的同位语；looking at how ... 修饰 A study，说明研究内容；how state public schools ... address ... 是 looking at 的宾语从句。","key":"address climate change：此处不是“解决气候变化”，而是指在课程中涉及、讲授气候变化这一议题。；give ... a grade：不是“给……一个年级”，而是“给……评定等级、打分”。；barely half：仅勉强达到一半，隐含总体表现不足。；a grade B+ or higher：B+ 或更高的评级。","zh":"美国国家科学教育中心是一个由科学家和教师组成的非营利组织；该中心去年的一项研究考察了全美各州公立学校如何在科学课上讲授气候变化，结果只有勉强一半的州获得了 B+ 或更高的评级。","tip":"looking at ... 描述的是这项研究考察什么，并非修饰紧邻的 scientists and teachers；barely half ... B+ or higher 意味着约半数州连 B+ 都未达到。"},{"id":"2023-T1-P5-S10","sec":"text1","sec_label":"Text 1","level":3,"en":"Among the 10 worst performers were some of the most populous states, including Texas, which was given the lowest grade (F) and has a disproportionate influence because its textbooks are widely sold elsewhere.","core":"正常语序为 Some of the most populous states were among the 10 worst performers.","structure":"句首介词短语 Among the 10 worst performers 引发完全倒装；including Texas 举例；which ... 是非限制性定语从句，两个并列谓语 was given 与 has 都描述 Texas；because ... 解释其影响格外大的原因。","key":"the worst performers：表现最差者，此处指评级最低的州。；the most populous states：人口最多的州；populous 不等于 popular。；a disproportionate influence：与其自身范围不成比例的巨大影响。；elsewhere：在其他地方，此处指得州以外的其他州或地区。","zh":"表现最差的 10 个州中包括一些人口最多的州，其中就有得克萨斯州；得州得到最低的 F 级，而且由于其教科书被广泛销售到其他地区，它产生了不成比例的巨大影响。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T1-P6-S11","sec":"text1","sec_label":"Text 1","level":3,"en":"Glenn Branch, the center’s deputy director, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards.","core":"Glenn Branch cautions that ...","structure":"the center’s deputy director 是 Glenn Branch 的同位语；that 引导宾语从句，其中动名词短语 setting state-level science standards 作主语；that decentralises ... 修饰 a country。","key":"benchmark：常见义为“基准”，此处指衡量气候变化教育状况的一项指标，而非具有强制落实力的制度本身。；state-level science standards：州级科学课程标准。；decentralise decisions to：把决策权下放、分散给……。；local school boards：地方学区委员会，负责当地学校治理和教育决策。","zh":"该中心副主任格伦·布兰奇提醒说，在一个把决策权下放给地方学区委员会的国家，制定州级科学课程标准只是一个作用有限的衡量指标。","tip":"原文不是说州级标准会“迎合地方需求”，而是说地方握有决策权，削弱了州级标准作为衡量依据和执行工具的效力。"},{"id":"2023-T1-P6-S12","sec":"text1","sec_label":"Text 1","level":3,"en":"Even if a state is considered a high performer in its science standards, “that does not mean it will be taught”, he says.","core":"That does not mean it will be taught.","structure":"Even if ... 引导让步状语从句；that 回指“某州的科学课程标准评级很高”这一情况；it 结合全文语境指气候变化相关内容。","key":"be considered a high performer：被认为表现出色、评级较高。；that does not mean ...：这并不意味着……，用于否定从标准到实施的必然推论。","zh":"他说：“即使某个州的科学课程标准被认为表现优秀，也不意味着气候变化就会真正进入课堂教学。”","tip":"不能把 it 理解成“州级标准本身被教授”；真正可能没有进入课堂的是气候变化内容。"},{"id":"2023-T1-P7-S13","sec":"text1","sec_label":"Text 1","level":3,"en":"Another issue is that, while climate change is well integrated into some subjects and at some ages — such as earth and space sciences in high schools — it is not as well represented in curricula for younger children and in subjects that are more widely taught, such as biology and chemistry.","core":"Another issue is that ... it is not as well represented ...","structure":"that 引导表语从句；其中 while ... 引导让步状语从句，先承认气候变化在部分学科和年龄段融合较好；两个破折号之间的 such as ... 给出例子；主句中的 it 指 climate change；第二个 such as ... 举例说明 subjects that are more widely taught。","key":"represented in curricula：此处不是“代表课程”，而是指某一内容在课程体系中得到呈现、占有相应分量。；be integrated into：被纳入、融入……。；earth and space sciences：地球与空间科学。；curricula：curriculum 的复数形式，意为“课程体系”。","zh":"另一个问题是，尽管气候变化已经较好地融入某些学科和某些年龄阶段的教学之中——例如高中的地球与空间科学课程——但在低龄儿童的课程体系以及生物、化学等开设更广泛的学科中，它并没有得到同等充分的体现。","tip":"at some ages 指某些年龄阶段；more widely taught 修饰的是生物、化学这类学科，并不是说气候变化本身已经得到广泛教授。"},{"id":"2023-T1-P8-S15","sec":"text1","sec_label":"Text 1","level":3,"en":"Branch points out that, even if a growing number of official guidelines and textbooks reflect scientific consensus on climate change, unofficial educational materials that convey more slanted perspectives are being distributed to teachers.","core":"Branch points out that unofficial educational materials ... are being distributed to teachers.","structure":"that 引导宾语从句；其中 even if ... 引导让步状语从句；that convey more slanted perspectives 是定语从句，修饰 unofficial educational materials；are being distributed 使用现在进行时的被动语态，强调这些材料正在进入教学端。","key":"slanted：常见义为“倾斜的”，此处作形容词，指观点带有偏向、选择性呈现事实。；reflect scientific consensus on：体现科学界对……的共识。；convey ... perspectives：传达……观点。；be distributed to teachers：被分发给教师。","zh":"布兰奇指出，即使越来越多的官方指南和教科书体现了科学界对气候变化的共识，传达更具倾向性观点的非官方教育材料仍在被分发给教师。","tip":"句子并未说教师本人形成了偏见；slanted 描述的是被分发的非官方材料所传达的观点。"},{"id":"2023-T1-P8-S16","sec":"text1","sec_label":"Text 1","level":3,"en":"They include materials sponsored by libertarian think-tanks and energy industry associations.","core":"They include materials.","structure":"They 回指上一句的 unofficial educational materials；过去分词短语 sponsored by ... 后置修饰 materials，点明材料背后的外部资助者。","key":"sponsored by：由……资助或支持。；libertarian think-tanks：自由意志主义智库。；energy industry associations：能源行业协会。；sympathise with the views of：赞同、支持……的观点。","zh":"其中包括由自由意志主义智库和能源行业协会资助的材料。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T2-P1-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Now, with record-high home prices and historically low inventory, there’s an increased urgency in such regulation, particularly among those who worry that developers will come in and buy up swaths of housing to flip for a fortune on the short-term rental market.","core":"There is an increased urgency in such regulation.","structure":"句首 with 复合结构交代监管愈发紧迫的背景；particularly among those 限定这种紧迫感在哪类人中尤为明显；who worry that ... 修饰 those，其中 that 从句说明担忧的具体内容；to flip ... 表示开发商买房的目的。","key":"inventory：常见义为“存货清单”；此处指市场上可供出售或出租的住房库存、房源量。；flip：常见义为“翻转”；此处作动词，指买入房产后迅速转售或转作短租以获利。；record-high home prices：创纪录的高房价。；historically low inventory：处于历史低位的住房供应量。","zh":"如今，房价创下历史新高，住房库存又处于历史低位，因此加强此类监管变得更加紧迫；尤其是一些人担心，开发商会进入当地，大量收购住房，再投放到短租市场上转手牟取暴利。","tip":"inventory 与下文 supply 都指住房供给；原文不是说房价受到严格控制，而是说房价创下新高。"},{"id":"2023-T2-P2-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"In New Hampshire, where the rental vacancy rate has dropped below 1 percent, housing advocates fear unchecked short-term rentals will put further pressure on an already strained market.","core":"Housing advocates fear (that) unchecked short-term rentals will put further pressure on an already strained market.","structure":"where ... 是非限制性定语从句，补充新罕布什尔州的空置率背景；fear 后省略 that 的宾语从句说明倡导者的担忧。","key":"rental vacancy rate：出租房空置率，即空置出租房占全部出租房的比例。；unchecked short-term rentals：未受有效约束的短期租赁。；a strained market：供需紧张、承压的市场。","zh":"在新罕布什尔州，出租房空置率已经降到 1% 以下；住房权益倡导者担心，不受约束的短租会给本就紧张的住房市场带来更大压力。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T2-P2-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"The State Legislature recently voted against a bill that would’ve made it illegal for towns to create legislation restricting short-term rentals.","core":"The State Legislature voted against a bill.","structure":"that would’ve made ... 是定语从句，说明该法案本来会产生的效果；it 是形式宾语，真正的宾语是 for towns to create legislation ...；restricting ... 修饰 legislation。","key":"vote against a bill：投票反对、否决一项法案。；make it illegal for sb. to do sth.：规定某人做某事为违法。；legislation restricting short-term rentals：限制短期租赁的法规。","zh":"州议会最近投票否决了一项法案；该法案原本会规定，各城镇制定限制短租的法规属于违法行为。","tip":"题目问的是该法案的意图，而不是投票结果；voted against 不能改变法案本身原拟“放开短租”的内容。"},{"id":"2023-T2-P3-S05","sec":"text2","sec_label":"Text 2","level":3,"en":"“We are at a crisis level on the supply of rental housing,” said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast.","core":"引语为 We are at a crisis level on the supply of rental housing.","structure":"executive director ... 是 Nick Taylor 的同位语，说明其身份；介词短语 on the supply of rental housing 限定危机出现的方面。","key":"be at a crisis level：达到危机程度。；the supply of rental housing：出租住房的供应量。；workforce housing：面向当地劳动者、价格与其收入相匹配的住房。","zh":"大海岸地区劳动力住房联盟执行主任尼克·泰勒说：“我们的出租住房供应已经到了危机水平。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T2-P3-S06","sec":"text2","sec_label":"Text 2","level":3,"en":"Without enough affordable housing in southern New Hampshire towns, “employers are having a hard time attracting employees, and workers are having a hard time finding a place to live,” Taylor said.","core":"引语内两个并列分句为 Employers are having a hard time ..., and workers are having a hard time ...。","structure":"句首 Without enough affordable housing ... 表示原因或条件背景；两个 have a hard time doing 分别说明住房短缺对雇主和劳动者的影响。","key":"affordable housing：价格在普通居民或劳动者承受范围内的可负担住房。；have a hard time doing：做某事很困难。；attract employees：吸引雇员前来工作。","zh":"泰勒说，由于新罕布什尔州南部各城镇缺乏足够的可负担住房，“雇主很难吸引到员工，劳动者也很难找到住处”。","tip":"workers 是需要长期居所的劳动者，并不等同于选项中的 short-term workers。"},{"id":"2023-T2-P4-S07","sec":"text2","sec_label":"Text 2","level":3,"en":"However, short-term rentals also provide housing for tourists, pointed out Ryan Castle, CEO of a local association of realtors.","core":"正常引述语序为 Ryan Castle pointed out that short-term rentals also provide housing for tourists.","structure":"作者把观点置于句首，再用 pointed out Ryan Castle 标明说话者；CEO ... 是 Ryan Castle 的同位语。","key":"provide housing for tourists：为游客提供住宿。；a local association of realtors：当地房地产经纪人协会。","zh":"不过，当地一家房地产经纪人协会的首席执行官瑞安·卡斯尔指出，短租也为游客提供了住宿。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T2-P4-S08","sec":"text2","sec_label":"Text 2","level":3,"en":"“A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people coming in short term,” Castle said, “and so it’s a cyclical effect.”","core":"A lot of workers are servicing the tourist industry, and the tourism industry is serviced by those people ...; it is a cyclical effect.","structure":"前两个分句以主动和被动两种表达呈现劳动者、旅游业与短期访客之间的相互依存；coming in short term 是现在分词短语，修饰 those people。","key":"service：常见义为“服务”这一名词；此处作动词，意为“为……提供服务、满足……的需要”。；the tourist industry：旅游业。；people coming in short term：短期到访当地的人，主要指游客。；a cyclical effect：循环效应、相互依赖的循环关系。","zh":"卡斯尔说：“许多劳动者在为旅游业提供服务，而旅游业又服务于那些短期到访的人，因此这是一种循环效应。”","tip":"卡斯尔是在强调短租与旅游业的作用；泰勒则强调可负担住房不足，两人的关注重点不同。"},{"id":"2023-T2-P5-S09","sec":"text2","sec_label":"Text 2","level":3,"en":"Short-term rentals themselves are not the crux of the issue, said Keren Horn, an expert on affordable housing policy.","core":"正常语序为 Keren Horn said short-term rentals themselves are not the crux of the issue.","structure":"an expert on affordable housing policy 是 Keren Horn 的同位语；themselves 强调不能把所有短租一概视为问题。","key":"the crux of the issue：问题的核心、症结；crux 强调最关键、最难处理的部分。","zh":"可负担住房政策专家凯伦·霍恩说，短租本身并不是问题的核心。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T2-P5-S10","sec":"text2","sec_label":"Text 2","level":3,"en":"“I think individuals being able to rent out their second home is a good thing.","core":"I think (that) ... is a good thing.","structure":"individuals being able to rent out their second home 是动名词复合结构，在省略 that 的宾语从句中作主语；individuals 是 being able to 的逻辑主语。","key":"rent out：把房屋、房间等出租给他人。；second home：第二套住房，常指度假住宅。","zh":"“我认为，个人能够把自己的第二套住房出租是一件好事。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T2-P5-S11","sec":"text2","sec_label":"Text 2","level":3,"en":"If it’s their vacation home anyway, and it’s just empty, why can’t you make money off it?” Horn said.","core":"疑问主句为 Why can’t you make money off it?","structure":"If ... 引导条件从句，其中两个并列分句说明房屋本来就是度假住宅且处于空置状态；it 均回指个人的第二套住房或度假住宅。","key":"vacation home：度假住宅。；make money off：利用……赚钱、从……获利。","zh":"反正那是他们的度假住宅，而且空着也是空着，为什么不能用它赚点钱呢？”霍恩说。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T2-P5-S12","sec":"text2","sec_label":"Text 2","level":3,"en":"Issues arise, however, when developers attempt to create large-scale short-term rental facilities — de facto hotels — to bypass taxes and regulations.","core":"Issues arise when developers attempt to create ... facilities.","structure":"however 是插入式转折副词；when 引导时间兼条件关系的状语从句；破折号之间的 de facto hotels 是对短租设施实质的补充说明；to bypass ... 表示开发商如此经营的目的。","key":"de facto：事实上的、实际存在的，与法律名义或表面形式相对。；bypass：常见义为“绕过”；此处指通过变换经营名义来“规避”税收和监管。；large-scale short-term rental facilities：大规模短租设施。；bypass taxes and regulations：规避税收和监管规定。","zh":"然而，当开发商试图建设大规模短租设施——实际上就是酒店——以规避税收和监管时，问题便出现了。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T2-P5-S13","sec":"text2","sec_label":"Text 2","level":3,"en":"“I think the question is, shouldn’t a developer who’s really building a hotel, but disguising it as not a hotel, be treated and taxed and regulated like a hotel?” Horn said.","core":"I think the question is: shouldn’t a developer be treated and taxed and regulated like a hotel?","structure":"who’s really building a hotel, but disguising it as not a hotel 是定语从句，修饰 a developer，其中两个谓语由 but 连接；三个过去分词 treated, taxed and regulated 构成并列被动谓语。","key":"disguise A as B：把 A 伪装成 B。；be treated, taxed and regulated like：像……一样被对待、征税和监管。","zh":"霍恩说：“我认为问题在于：一个实际上建造酒店、却把它伪装成非酒店的开发商，难道不应当像酒店经营者一样受到对待、征税和监管吗？”","tip":"选项 C 的 stop developers from evading taxes 是对 bypass taxes 及本句反问立场的概括，不是说所有个人房东都在逃税。"},{"id":"2023-T2-P6-S14","sec":"text2","sec_label":"Text 2","level":3,"en":"At the end of 2018, Governor Charlie Baker of Massachusetts signed a bill to rein in those potential investor-buyers.","core":"Governor Charlie Baker signed a bill.","structure":"of Massachusetts 说明州长所属州；to rein in ... 是目的状语；those potential investor-buyers 回指前文可能大量买房并转作短租的投资者或开发商。","key":"rein in：原指“勒紧缰绳使马停下”，此处意为“控制、约束”。；investor-buyers：以投资获利为目的的购房者。；sign a bill：签署法案，使其进入生效程序。","zh":"2018 年年底，马萨诸塞州州长查理·贝克签署了一项法案，以约束那些潜在的投资型购房者。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T2-P6-S15","sec":"text2","sec_label":"Text 2","level":3,"en":"The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy.","core":"The bill requires ..., mandates ..., and opens ...","structure":"三个并列谓语概括法案措施；requires every rental host to register 使用 require sb. to do；mandates (that) they carry insurance 省略宾语从句连接词 that；on top of ... 说明地方税是在州级税费之外叠加。","key":"rental host：提供短租房源的房东或经营者。；carry insurance：持有、购买保险。；on top of：在……之外再加上。；state levy：州政府征收的税费。","zh":"该法案要求每一位出租房东向州政府登记，强制他们购买保险，并且除新增的州级税费外，还为地方加征税费提供了可能。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T2-P6-S16","sec":"text2","sec_label":"Text 2","level":3,"en":"Boston took things even further, requiring renters to register with the city’s Inspectional Services Department.","core":"Boston took things even further.","structure":"现在分词短语 requiring ... 作伴随或结果状语，具体说明波士顿“更进一步”的措施；the city’s Inspectional Services Department 是登记主管部门。","key":"take things further：不是把“东西”拿得更远，而是“采取更进一步的措施”。","zh":"波士顿更进一步，要求出租者向市检查服务部门登记。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T2-P7-S17","sec":"text2","sec_label":"Text 2","level":3,"en":"Horn said similar registration requirements could benefit struggling cities and towns, but “if we want to make a change in the housing market, the main one is we have to build a lot more.”","core":"Horn said (that) registration requirements could benefit ..., but the main one is (that) we have to build a lot more.","structure":"but 连接让步认可与核心判断；引语内部 if ... 引导条件从句；the main one 回指能改变住房市场的主要办法；we have to build a lot more 是省略 that 的表语从句。","key":"struggling cities and towns：此处指住房、财政或治理方面承受压力的城市和城镇，并非单指“努力奋斗的城镇”。；the main one：此处指改变住房市场的主要措施，即后面的“大量增建住房”。；registration requirements：登记要求、注册制度。；make a change in the housing market：对住房市场产生实质改变。","zh":"霍恩说，类似的登记要求可能有益于处境艰难的城市和城镇，但是“如果我们想真正改变住房市场，最主要的办法是必须大幅增加住房建设”。","tip":"霍恩没有否定登记制度的合理性或可行性；她认为其作用有限，正确概括是 an inadequate solution。"},{"id":"2023-T3-P1-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"If you’re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex’s new children’s book The Bench, you might have to be prepared to hunt around a bit; the same may be true of The President’s Daughter, the new thriller by Bill Clinton and James Patterson.","core":"If you’re heading for ..., you might have to be prepared to hunt around; the same may be true of ...","structure":"If 引导条件从句；the biggest book retailer in the UK 是 Waterstones 的同位语；in search of ... 说明去书店的目的；分号连接两个并列情况；the new thriller ... 是书名的同位语。","key":"branch：常见义为“树枝”；此处指连锁书店的“分店、门店”。；hunt around：此处不是“狩猎”，而是“到处寻找、费力搜寻”。；head for：前往、朝……去。；in search of：寻找……。","zh":"如果你正要去附近的 Waterstones 门店寻找苏塞克斯公爵夫人的新儿童读物《长椅》，那你可能得做好四处找一找的准备；比尔·克林顿与詹姆斯·帕特森合著的新惊悚小说《总统的女儿》或许也是如此。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Both of these books are published next week by Penguin Random House (PRH), a company currently involved in a stand-off with Waterstones.","core":"Both of these books are published next week by Penguin Random House.","structure":"a company ... 是 PRH 的同位语；currently involved in ... 是过去分词短语，修饰 company。","key":"Penguin Random House (PRH)：企鹅兰登书屋，后文简称 PRH。；be involved in a stand-off with：与……陷入僵持或对峙。","zh":"这两本书都将于下周由企鹅兰登书屋（PRH）出版，而这家公司目前正与 Waterstones 陷入对峙。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T3-P2-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"The problem began late last year, when PRH confirmed that it had introduced a credit limit with Waterstones “at a very significant level”.","core":"The problem began late last year.","structure":"when ... 是非限制性关系副词从句，说明问题开始时发生的事件；that 引导 confirmed 的宾语从句；过去完成时 had introduced 表明设置额度早于“证实”这一动作。","key":"credit limit：此处指供应商给予零售商赊购或延期付款的额度上限，不是消费者信用卡额度。；with Waterstones：结合商业语境，指 PRH 对与 Waterstones 的交易设置额度限制。；confirm that：证实……。；introduce a credit limit：开始实行信用额度限制。","zh":"问题始于去年年底，当时 PRH 证实，它已对 Waterstones 设置了“幅度非常显著”的信用额度限制。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T3-P2-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"The trade magazine The Bookseller reported that Waterstones branch managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were “quietly retiring them to their relevant sections”.","core":"The Bookseller reported that Waterstones branch managers were being told ... and were retiring ...","structure":"that 引导宾语从句；其中 were being told 是过去进行时的被动语态；to remove ... 是宾语补足语；were ... retiring 与前一谓语并列；such as ... 列举显眼位置。","key":"retire：常见义为“退休”；此处作及物动词，意为把图书“撤下、移出重点位置”。；relevant sections：与图书类别相应的普通分类书架，而非更“系统化”的排列方式。；trade magazine：行业杂志。；prominent areas：显眼位置、重点陈列区域。","zh":"行业杂志《书商》报道称，Waterstones 各门店经理接到指示，要把 PRH 图书从书桌、展示区和橱窗等显眼位置撤下，并“悄悄地将它们放回各自所属的分类区域”。","tip":"把书移到普通分类区会降低可见度，并非为了让它们更容易被发现，也不是 PRH 要求书店如此陈列。"},{"id":"2023-T3-P3-S05","sec":"text3","sec_label":"Text 3","level":3,"en":"PRH declined to comment on the issue, but a spokesperson for Waterstones told me: “Waterstones are currently operating with reduced credit terms from PRH, the only publisher in the UK to place any limitations on our ability to trade.","core":"PRH declined to comment, but a spokesperson told me: ...","structure":"but 连接 PRH 的沉默与 Waterstones 的回应；引语中 the only publisher ... 是 PRH 的同位语；to place ... 修饰 publisher，说明其独特之处。","key":"credit terms：赊购、付款期限与额度等商业信用条件，并非泛指“信用条款”。；ability to trade：此处指书店正常采购并销售图书的能力。；decline to comment on：拒绝就……发表评论。；operate with reduced credit terms：在收紧的商业信用条件下经营。","zh":"PRH 拒绝就此事置评，但 Waterstones 的一位发言人告诉我：“Waterstones 目前只能按 PRH 缩减后的信用条件经营；PRH 是英国唯一一家对我们的交易能力施加任何限制的出版商。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T3-P3-S06","sec":"text3","sec_label":"Text 3","level":3,"en":"We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock.”","core":"We are not boycotting ... but we are doing our utmost ...","structure":"but 对比“并非抵制”与“仍在努力供货”；that 引导 ensure 的宾语从句；despite ... 引导让步背景。","key":"boycott PRH titles：抵制 PRH 出版的书目；titles 在出版语境中指图书品种或书名。；do one’s utmost to：竭尽全力做……。；availability for customers：顾客能够获得或买到商品的程度。","zh":"我们并没有抵制 PRH 的图书；尽管总体库存水平较低，我们仍在竭尽全力确保顾客能够买到这些书。”","tip":"lower overall levels of stock 是信用条件收紧造成的库存受限，不等于书店低估了自己的库存。"},{"id":"2023-T3-P3-S07","sec":"text3","sec_label":"Text 3","level":3,"en":"“We are hopeful with our shops now open again that normality will return and that we will be allowed to buy appropriately.","core":"We are hopeful that normality will return and that we will be allowed to buy appropriately.","structure":"with our shops now open again 是 with 复合结构，交代希望产生的背景；两个并列 that 从句共同作 hopeful 的内容。","key":"be hopeful that：希望……、对……抱有希望。；normality will return：恢复正常状态。；be allowed to buy appropriately：获准按实际需要适量采购。","zh":"“如今我们的门店已经重新营业，我们希望一切能够恢复正常，也希望我们可以获准进行适当采购。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T3-P3-S09","sec":"text3","sec_label":"Text 3","level":3,"en":"The sales for our May Books of the Month surpassed any month since 2018.”","core":"The sales ... surpassed any month since 2018.","structure":"见原句","key":"Books of the Month：书店评选并重点推广的“月度图书”。；surpass any month since 2018：超过 2018 年以来任何一个月的水平。","zh":"我们 5 月“月度图书”的销量超过了 2018 年以来的任何一个月。”","tip":"严格说被比较的是“本月销量”与“此前各月销量”；原文采用省略式比较。销量创新高说明市场并不冷清，但不能直接证明顾客对 Waterstones 的忠诚度。"},{"id":"2023-T3-P4-S11","sec":"text3","sec_label":"Text 3","level":3,"en":"Big-name PRH authors may suffer a bit, but it’s those mid-list authors, who normally rely on Waterstones staff’s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.","core":"Big-name authors may suffer a bit, but it is those mid-list authors who will be praying for an end to the dispute.","structure":"but 后是 it is ... who ... 强调句，突出受影响更大的中间梯队作者；插入的非限制性定语从句 who normally rely on ... 补充其依赖书店员工推广的原因；by lesser-known writers 修饰 books。","key":"mid-list authors：出版名单中销量和知名度居中的作者，既非畅销头部作者，也非完全新人。；pray for：此处不一定指宗教意义上的祈祷，而是“迫切盼望”。；big-name authors：知名作者、大牌作家。；rely on sb.’s passion for doing：依赖某人做某事的热情。","zh":"PRH 的知名作者或许会受到一点影响，但真正会迫切盼望争端结束的是那些处于中间梯队的作者；他们平时依赖 Waterstones 员工热情推广知名度较低的作家及其作品。","tip":"员工原本热衷推广的是较不知名作家的书，并非犹豫是否推广大牌作者；作者是销量受损者，不是批评对象。"},{"id":"2023-T3-P5-S12","sec":"text3","sec_label":"Text 3","level":3,"en":"It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon & Schuster — the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published.","core":"It comes at a time when authors are worried about the consequences ... — the reduction ... is likely to lead to ...","structure":"It 指当前 PRH 与 Waterstones 的争端；when 引导定语从句，修饰 a time；破折号后解释作者担忧的具体后果；主语 the reduction in ... 后接 lead to 的三个并列宾语 fewer ..., lower ..., and more ...；what is published 是 of 的宾语从句。","key":"unaligned publishers：此处指未归入相关大型出版集团、保持独立的出版商，并非政治意义上的“不结盟”。；advances：常见义为“进步、前进”；此处是出版商预先支付给作者的“预付版税”。；conformity：一致化、趋同；此处含多样性下降的负面意味。；the proposed merger between A and B：A 与 B 之间拟议中的合并。","zh":"这场争端发生之际，作者们已经在担忧 PRH 与另一家大型出版商西蒙与舒斯特拟议合并所带来的后果——英国独立于大型集团之外的出版商数量减少，很可能导致出版社之间争相出价的情况减少、预付版税降低，并使出版内容更加趋同。","tip":"It 不是拟议合并本身；合并尚未完成，但其可能导致的结构性后果已经引发作者担忧。"},{"id":"2023-T3-P6-S13","sec":"text3","sec_label":"Text 3","level":3,"en":"“This is all part of a wider change towards concentration of power,” says literary agent Andrew Lownie.","core":"This is all part of a wider change.","structure":"This 概括当前出版商与零售商的权力博弈及大型出版商并购趋势；towards concentration of power 说明变化的方向。","key":"a wider change towards：朝着……发展的更广泛变化。；concentration of power：权力集中。；literary agent：文学经纪人，代表作者处理出版与版权事务。","zh":"文学经纪人安德鲁·劳尼说：“这一切都是权力走向集中这一更广泛变化的一部分。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T3-P6-S14","sec":"text3","sec_label":"Text 3","level":3,"en":"“The publishing industry talks about diversity in terms of authors and staff but it also needs a plurality of ways of delivering intellectual contact, choice and different voices.","core":"The publishing industry talks about diversity, but it also needs a plurality of ways.","structure":"but 转折指出，仅关注作者和员工构成还不够；of delivering ... 修饰 ways；intellectual contact, choice and different voices 是 delivering 的三个并列宾语。","key":"plurality：此处不是简单的“多数票”，而是多元并存、多种主体和渠道共存。；voices：常见义为“声音”；此处指不同立场、观念与创作表达。；in terms of：就……而言、从……角度看。；ways of delivering：传递……的途径或渠道。","zh":"“出版业常从作者和员工构成的角度谈论多样性，但它同样需要多种渠道来传递思想交流、选择空间和不同声音。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T3-P7-S16","sec":"text3","sec_label":"Text 3","level":3,"en":"We shall see whether that plurality is a casualty of the current need among publishers to be big enough to take on all-comers.","core":"We shall see whether that plurality is a casualty of the current need.","structure":"whether 引导宾语从句；that plurality 回指多种出版主体、渠道和声音并存；among publishers 修饰 need；to be big enough ... 说明需求内容；to take on ... 表示做大规模的目的。","key":"a casualty of：常见义为战争中的“伤亡者”；此处比喻“……的牺牲品、受害者”。；take on all-comers：迎战任何对手、应对所有竞争者。；be involved in a stand-off with：与……陷入对峙。；introduce a credit limit：实行信用额度限制。","zh":"出版商眼下都需要把规模做得足够大，才能应对所有竞争者；这种多元性是否会因此沦为牺牲品，我们将拭目以待。","tip":"that plurality 不是作者和员工数量，而是上一段所说的思想传播渠道、选择与声音的多元并存。"},{"id":"2023-T4-P1-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title’s impact factor) and the number of citations a specific paper accumulates.","core":"The scientific community measures the quality of those papers in a number of ways.","structure":"including 引出两项衡量方式：期刊的公认质量和单篇论文的引用数；括号内 as reflected by ... 补充期刊质量如何体现；a specific paper accumulates 是省略关系代词的定语从句，修饰 the number of citations。","key":"title：常见义为“标题”；此处在出版语境中指一种具体期刊。；accumulate citations：不是论文主动“收集引文”，而是论文逐渐获得他人引用。；the perceived quality：人们所认定、感知到的质量。；impact factor：期刊影响因子。","zh":"科学界会用多种方式衡量这些论文的质量，其中包括期刊被认为具有的质量——这体现在该刊的影响因子上——以及某篇具体论文累积的被引用次数。","tip":"期刊影响因子与单篇论文引用数是两项相关但不同的评价指标。"},{"id":"2023-T4-P1-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"The careers of scientists and the reputation of their institutions depend on the number and prestige of the papers they produce, but even more so on the citations attracted by these papers.","core":"The careers ... and the reputation ... depend on ..., but even more so on ...","structure":"两个并列主语共同支配 depend on；they produce 是省略关系代词的定语从句，修饰 papers；but even more so on 省略了重复的 depend，突出后一因素；attracted by these papers 后置修饰 citations。","key":"prestige of the papers：指论文因发表载体、影响力等获得的学术声望，不是合作者本人的声望。；citations attracted by：论文“获得的引用”，而不是论文内部列出了多少参考文献。","zh":"科学家的职业发展及其所在机构的声誉，取决于他们发表论文的数量与声望，但更大程度上取决于这些论文获得的引用次数。","tip":"题目中的 how many times their papers are cited 对应“论文被引次数”；选项 A 的“论文包含多少引文”把被引与参考文献数量倒置了。"},{"id":"2023-T4-P2-S05","sec":"text4","sec_label":"Text 4","level":3,"en":"Citation cartels, where journals, authors, and institutions conspire to inflate citation numbers, have existed for a long time.","core":"Citation cartels have existed for a long time.","structure":"where ... 是非限制性定语从句，把 Citation cartels 视为一种活动场域并说明其运作方式；三个并列主语 journals, authors, and institutions 共同执行 conspire。","key":"cartel：常指操纵市场的垄断联盟；此处指参与者串通操纵引用数据的“引用联盟”。；inflate：常见义为“充气”；此处指人为“抬高、虚增”数字。；conspire to do：共谋、串通做……。；citation numbers：引用数量。","zh":"引用联盟早已存在；在这种联盟中，期刊、作者和机构相互串通，蓄意抬高引用数量。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T4-P2-S06","sec":"text4","sec_label":"Text 4","level":3,"en":"In 2016, researchers developed an algorithm to recognize suspicious citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications.","core":"Researchers developed an algorithm.","structure":"to recognize ... 表示算法用途；including 引出两类可疑群体；两个 that 定语从句分别修饰作者群体与期刊群体；第二个从句中的 to increase ... 表示频繁互引的目的。","key":"suspicious citation patterns：可疑的引用模式。；disproportionately cite one another：不成比例地相互引用。；increase the impact factors：提高影响因子。","zh":"2016 年，研究人员开发出一种识别可疑引用模式的算法；这些模式包括作者群体之间不成比例地相互引用，以及期刊群体频繁互引，从而提高各自出版物的影响因子。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T4-P2-S07","sec":"text4","sec_label":"Text 4","level":3,"en":"Recently, another expression of this predatory behavior has emerged: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.","core":"冒号前为 Another expression ... has emerged；冒号后核心为 Consultancies sometimes advise contributors to add citations.","structure":"冒号后解释新表现形式；so-called 表示“所谓的”；that provide ... 是定语从句，修饰 consultancies；to individual authors and to journals 是两个并列服务对象；to add ... 作 advise 的宾语补足语。","key":"expression：常见义为“表达、表情”；此处指某种行为的“表现形式”。；contributors：此处不是一般意义上的“贡献者”，而是向期刊投稿的作者。；a number of citations：若干条、额外的一批引用，不是笼统的“引用数量”。；predatory behavior：利用学术发表需求牟利或操纵评价的掠夺性行为。","zh":"最近，这种掠夺性行为又出现了一种表现形式：所谓的支持服务咨询机构一面为作者个人和期刊提供语言及其他编辑支持，一面有时会建议投稿者在文章中添加若干条引用。","tip":"原文是咨询机构要求作者添加额外引用，并未说它建议客户选择期刊，也未明确要求投稿者彼此引用。"},{"id":"2023-T4-P3-S08","sec":"text4","sec_label":"Text 4","level":3,"en":"The advent of electronic publishing and authors’ need to find outlets for their papers resulted in thousands of new journals.","core":"The advent ... and authors’ need ... resulted in thousands of new journals.","structure":"两个并列名词短语作主语；to find outlets ... 是不定式短语，修饰 need；for their papers 修饰 outlets。","key":"outlets：常见义为“出口、商店”；此处指论文发表的渠道或平台。；the advent of：……的出现、到来。；result in：导致、产生。","zh":"电子出版的出现，加上作者需要为论文寻找发表渠道，催生了数以千计的新期刊。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T4-P3-S10","sec":"text4","sec_label":"Text 4","level":3,"en":"These journals can act as milk cows where every single article in an issue may cite a specific paper or a series of papers.","core":"These journals can act as milk cows.","structure":"where 引导定语从句，说明这类“奶牛”期刊如何运作；every single 强调一期中的每一篇文章；cite A or B 连接两类被集中引用的对象。","key":"milk cows：字面为“奶牛”；此处比喻能被反复利用、持续产出利益的工具，具体指为特定论文批量制造引用的期刊。；issue：常见义为“问题”；此处指期刊的某一期。；act as：充当、起……作用。；a specific paper or a series of papers：某篇特定论文或一组特定论文。","zh":"这些期刊可以充当“奶牛”，让某一期中的每一篇文章都去引用某一篇特定论文或某一组论文，从而持续为其输送引用。","tip":"这些期刊不是帮助学者低成本发表，也不是增加自身读者；它们在为其他论文提供引用。"},{"id":"2023-T4-P3-S12","sec":"text4","sec_label":"Text 4","level":3,"en":"The peculiar part is that the journal that the editor is supposedly working for is not profiting at all — it is just providing citations to other journals.","core":"The peculiar part is that the journal is not profiting at all — it is just providing citations.","structure":"that 引导表语从句；表语从句中第二个 that 是关系代词，修饰 the journal，the editor 是从句主语；破折号后的分句解释所谓反常之处。","key":"supposedly：据称、按说、名义上；此处带有对编辑真实角色或动机的怀疑。；profit：此处作动词，意为“获益、得到好处”，不只指直接金钱利润。","zh":"反常之处在于，编辑名义上所供职的期刊根本没有获益——它只是在为其他期刊提供引用。","tip":"两个 that 功能不同：第一个引导表语从句，第二个在定语从句中作 for 的宾语。"},{"id":"2023-T4-P3-S13","sec":"text4","sec_label":"Text 4","level":3,"en":"Such practices can lead an article to accrue more than 150 citations in the same year that it was published.","core":"Such practices can lead an article to accrue more than 150 citations.","structure":"lead + 宾语 + to do 构成复合宾语；that it was published 是定语从句，修饰 the same year。","key":"lead sb./sth. to do：使某人或某物产生某种结果。；accrue citations：逐渐累积引用次数。；in the same year that：就在……的同一年。","zh":"这种做法可以使一篇论文在发表当年就累积 150 次以上的引用。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T4-P4-S15","sec":"text4","sec_label":"Text 4","level":3,"en":"In one example, an individual — acting as author, editor, and consultant — was able to use at least 15 journals as citation providers to articles published by five scientists at three universities.","core":"An individual was able to use at least 15 journals as citation providers.","structure":"破折号之间的现在分词短语补充此人的多重身份；to articles ... 说明引用被提供给哪些论文；published by ... 是过去分词短语，修饰 articles；at three universities 修饰五名科学家。","key":"act as author, editor, and consultant：同时充当作者、编辑和顾问。；use ... as citation providers：利用……作为引用提供者。","zh":"在一个案例中，某个人同时充当作者、编辑和顾问，竟能利用至少 15 种期刊，为三所大学五名科学家发表的论文提供引用。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T4-P4-S16","sec":"text4","sec_label":"Text 4","level":3,"en":"The problem is rampant in Scopus, a citation database, which includes a high number of the new “international” journals.","core":"The problem is rampant in Scopus.","structure":"a citation database 是 Scopus 的同位语；which ... 是非限制性定语从句，补充该数据库收录大量新“国际”期刊的特点。","key":"rampant：泛滥的、猖獗的，指问题广泛存在且难以控制。；citation database：引文数据库。；a high number of：大量的。","zh":"这一问题在引文数据库 Scopus 中十分猖獗；该数据库收录了大量新出现的所谓“国际”期刊。","tip":"引号中的 international 带有质疑意味；Scopus 收录这类期刊，不等于它阻碍其发展，也不等于它创立之初就是为了防止操纵。"},{"id":"2023-T4-P4-S17","sec":"text4","sec_label":"Text 4","level":3,"en":"In fact, a listing in Scopus seems to be a criterion to be targeted in this type of citation manipulation.","core":"A listing in Scopus seems to be a criterion.","structure":"to be targeted ... 是不定式被动结构，说明“条件”所对应的结果；in this type of ... 限定被选中的活动语境。","key":"a listing in Scopus：被 Scopus 数据库收录、列入其索引。；be targeted：被选作操纵对象、成为目标。","zh":"事实上，被 Scopus 收录似乎反而成了期刊被此类引用操纵活动选中的一个条件。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T4-P5-S18","sec":"text4","sec_label":"Text 4","level":3,"en":"Scopus itself has all the data necessary to detect this malpractice.","core":"Scopus itself has all the data.","structure":"itself 强调数据就在 Scopus 自身；necessary to detect this malpractice 后置修饰 data，其中不定式说明数据用途。","key":"malpractice：不当行为、违规操作；此处具体指引用操纵，而不只是医疗事故。","zh":"Scopus 本身掌握着识别这种不当行为所需的全部数据。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2023-T4-P5-S19","sec":"text4","sec_label":"Text 4","level":3,"en":"Red flags include a large number of citations to an article within the first year.","core":"Red flags include a large number of citations.","structure":"to an article 指明被引用对象；within the first year 限定异常引用集中出现的时间窗口。","key":"red flags：字面为“红旗”；此处指提示异常或风险的警示信号。；citations to an article：某篇论文获得的引用。；within the first year：在第一年之内。","zh":"危险信号之一，是一篇论文在发表后的第一年内就获得大量引用。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"}]};</script>

ge for..."],["比赛的时间、地点与形式","The contest will be held in the main lecture hall on Saturday, May 18, from 2:00 to 5:00 p.m."],["评委职责","As a judge, you would score the speeches and offer brief comments at the end."],["请求回复与致谢","Please let me know whether you are available. We would be honored to have you with us."],["落款","Yours sincerely, Li Ming"]],"expressions":["I am writing on behalf of..., to invite you to...","We would be grateful if you could...","The contest will be held in... on..., from... to...","As a judge, you would score the speeches and offer brief comments.","Please let me know whether you are available.","We would be honored to have you with us."],"traps":["题目要求写给学院里的外教，称呼可用 Dear Mr. Smith 一类；结尾署 Li Ming，不要写自己的真实姓名，也不要写地址。","邀请必须落到具体细节：比赛时间、地点、演讲题目、每位选手的时长、评委要做的事，只写“诚挚邀请”会显得空洞。","约100词，注意邮件格式（主题行、称呼、正文、结束语、署名），不要写成通知或议论文。"]},"partB":{"title":"Part B · 图画作文","score":20,"words":"160–200词","prompt":"Write an essay of 160–200 words based on the following drawing. In your essay, you should 1) describe the drawing briefly, 2) interpret its intended meaning, and 3) give your comments. You should write neatly on ANSWER SHEET. (20 points)","prompt_zh":"根据所给图画写一篇160—200词的短文。要求：1）简要描述图画；2）解释其寓意；3）给出你的评论。","structure":[["第一段·描述图画","The drawing presents graduates at a fork in the road... sign reading \"Graduates\"... paths marked job hunting, postgraduate study, going abroad and starting a business."],["第二段·解释寓意","The picture captures a dilemma... multiple choices are a privilege, yet too many options can be paralysing... some follow the crowd, others drift."],["第三段·给出评论","In my view, there is no single best road... the choice should be made consciously... a clear direction is better than standing still."]],"expressions":["The drawing presents a group of graduates standing at a fork in the road.","each marked with a different destination","Faced with so many possibilities, ... seem to pause, unsure which way to take.","The picture captures a dilemma that almost every graduate experiences.","On the one hand... On the other hand...","What matters is that the choice is made consciously.","A clear direction, even a temporary one, is far better than standing still."],"traps":["描述要抓住“学士服 + 岔路口 + 四块路牌（求职、考研、出国、创业）”，不要漏掉“毕业生”的身份提示，也不要逐字罗列路牌而写成清单。","寓意应落在“毕业时的人生选择与道路”，不要偏成“就业难”“考研热”或单纯“要多读书”；四条路本身没有优劣，重点是选择时的清醒与担当。","评论段要给出自己的判断（如“没有唯一正确的路，重要的是有意识地选择”），避免只喊“祝大家前程似锦”一类空话。"]}},"vocab":[{"w":"scold sb. for doing sth.","pos":"phr.","cn":"因某人做了某事而斥责某人。","sec":"text1","sec_label":"Text 1","ctx":"In the 2006 film version of *The Devil Wears Prada*, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn't a","note":"因某人做了某事而斥责某人。","forms":["scold sb. for doing sth."]},{"w":"high fashion","pos":"phr.","cn":"高级时装，尤指由顶尖设计师引领的时装潮流。","sec":"text1","sec_label":"Text 1","ctx":"In the 2006 film version of *The Devil Wears Prada*, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn't a","note":"高级时装，尤指由顶尖设计师引领的时装潮流。","forms":["high fashion"]},{"w":"descend","pos":"词","cn":"常见义为“下降”；此处作动词，形象地表示某种时尚元素从高端秀场逐级传播到大众零售市场。","sec":"text1","sec_label":"Text 1","ctx":"Priestly explains how the deep blue color of the assistant's sweater descended over the years from fashion shows to department stores and to the bargain bin in which the ","note":"常见义为“下降”；此处作动词，形象地表示某种时尚元素从高端秀场逐级传播到大众零售市场。","forms":["descend"]},{"w":"bargain bin","pos":"phr.","cn":"商店中放置大幅折价商品的货筐或货区。","sec":"text1","sec_label":"Text 1","ctx":"Priestly explains how the deep blue color of the assistant's sweater descended over the years from fashion shows to department stores and to the bargain bin in which the ","note":"商店中放置大幅折价商品的货筐或货区。","forms":["bargain bin"]},{"w":"doubtless","pos":"adj.","cn":"无疑地，想必。","sec":"text1","sec_label":"Text 1","ctx":"Priestly explains how the deep blue color of the assistant's sweater descended over the years from fashion shows to department stores and to the bargain bin in which the ","note":"无疑地，想必。","forms":["doubtless"]},{"w":"indictment","pos":"n.","cn":"常见于法律语境，意为“起诉书”；此处引申为对快时尚的“严厉控诉、谴责”。","sec":"text1","sec_label":"Text 1","ctx":"This top-down conception of the fashion business couldn't be more out of date or at odds with the feverish world described in *Overdressed*, Elizabeth Cline's three-year ","note":"常见于法律语境，意为“起诉书”；此处引申为对快时尚的“严厉控诉、谴责”。","forms":["indictment"]},{"w":"top-down","pos":"词","cn":"自上而下的。","sec":"text1","sec_label":"Text 1","ctx":"This top-down conception of the fashion business couldn't be more out of date or at odds with the feverish world described in *Overdressed*, Elizabeth Cline's three-year ","note":"自上而下的。","forms":["top-down"]},{"w":"couldn't be more...","pos":"phr.","cn":"不可能更……，即“极其……”。","sec":"text1","sec_label":"Text 1","ctx":"This top-down conception of the fashion business couldn't be more out of date or at odds with the feverish world described in *Overdressed*, Elizabeth Cline's three-year ","note":"不可能更……，即“极其……”。","forms":["couldn't be more..."]},{"w":"be at odds with","pos":"phr.","cn":"与……不一致、相冲突。","sec":"text1","sec_label":"Text 1","ctx":"This top-down conception of the fashion business couldn't be more out of date or at odds with the feverish world described in *Overdressed*, Elizabeth Cline's three-year ","note":"与……不一致、相冲突。","forms":["be at odds with"]},{"w":"mass-market label","pos":"phr.","cn":"面向大众市场的服装品牌。","sec":"text1","sec_label":"Text 1","ctx":"In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&M, and Uniqlo to react to trends more quickly and anticipate demand more ","note":"面向大众市场的服装品牌。","forms":["mass-market label"]},{"w":"react to trends","pos":"phr.","cn":"对潮流变化作出反应。","sec":"text1","sec_label":"Text 1","ctx":"In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&M, and Uniqlo to react to trends more quickly and anticipate demand more ","note":"对潮流变化作出反应。","forms":["react to trends"]},{"w":"anticipate demand","pos":"phr.","cn":"预判市场需求。","sec":"text1","sec_label":"Text 1","ctx":"In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&M, and Uniqlo to react to trends more quickly and anticipate demand more ","note":"预判市场需求。","forms":["anticipate demand"]},{"w":"turnaround","pos":"词","cn":"常见义为“转变、好转”；此处指从设计、生产到上架销售的“周转周期”。","sec":"text1","sec_label":"Text 1","ctx":"Quicker turnarounds mean less wasted inventory, more frequent releases, and more profit.","note":"常见义为“转变、好转”；此处指从设计、生产到上架销售的“周转周期”。","forms":["turnaround"]},{"w":"style-conscious","pos":"adj.","cn":"注重穿衣风格、追逐时尚的。","sec":"text1","sec_label":"Text 1","ctx":"These labels encourage style-conscious consumers to see clothes as disposable - meant to last only a wash or two, although they don't advertise that - and to renew their ","note":"注重穿衣风格、追逐时尚的。","forms":["style-conscious"]},{"w":"see A as B","pos":"phr.","cn":"把 A 视为 B。","sec":"text1","sec_label":"Text 1","ctx":"These labels encourage style-conscious consumers to see clothes as disposable - meant to last only a wash or two, although they don't advertise that - and to renew their ","note":"把 A 视为 B。","forms":["see A as B"]},{"w":"renew one's wardrobe","pos":"phr.","cn":"更新某人的衣橱，即频繁购买新衣。","sec":"text1","sec_label":"Text 1","ctx":"These labels encourage style-conscious consumers to see clothes as disposable - meant to last only a wash or two, although they don't advertise that - and to renew their ","note":"更新某人的衣橱，即频繁购买新衣。","forms":["renew one's wardrobe"]},{"w":"hijack","pos":"词","cn":"常见义为“劫持交通工具”；此处比喻快时尚品牌夺取并操控了时尚周期。","sec":"text1","sec_label":"Text 1","ctx":"By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.","note":"常见义为“劫持交通工具”；此处比喻快时尚品牌夺取并操控了时尚周期。","forms":["hijack"]},{"w":"on-trend","pos":"词","cn":"符合当下潮流的。","sec":"text1","sec_label":"Text 1","ctx":"By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.","note":"符合当下潮流的。","forms":["on-trend"]},{"w":"dirt-cheap","pos":"词","cn":"极其便宜的。","sec":"text1","sec_label":"Text 1","ctx":"By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.","note":"极其便宜的。","forms":["dirt-cheap"]},{"w":"be accustomed to","pos":"phr.","cn":"习惯于……。","sec":"text1","sec_label":"Text 1","ctx":"By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.","note":"习惯于……。","forms":["be accustomed to"]},{"w":"be limited to","pos":"phr.","cn":"局限于……；not limited to 表示影响范围不止于此。","sec":"text1","sec_label":"Text 1","ctx":"The victims of this revolution, of course, are not limited to designers.","note":"局限于……；not limited to 表示影响范围不止于此。","forms":["be limited to"]},{"w":"strain","pos":"词","cn":"常见义为“拉紧、扭伤”；此处作动词，意为“使资源不堪重负”。","sec":"text1","sec_label":"Text 1","ctx":"For H&M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resou","note":"常见义为“拉紧、扭伤”；此处作动词，意为“使资源不堪重负”。","forms":["strain"]},{"w":"answer","pos":"词","cn":"常见义为“回答”；A is the...answer to B 在此表示 A 是与 B 相对应、可与之比肩的事物。","sec":"text1","sec_label":"Text 1","ctx":"*Overdressed* is the fashion world's answer to consumer-activist bestsellers like Michael Pollan's *The Omnivore's Dilemma*.","note":"常见义为“回答”；A is the...answer to B 在此表示 A 是与 B 相对应、可与之比肩的事物。","forms":["answer"]},{"w":"consumer activist","pos":"phr.","cn":"消费者权益倡导者；consumer-activist bestseller 指从消费者行动主义角度批判产业问题的畅销书。","sec":"text1","sec_label":"Text 1","ctx":"*Overdressed* is the fashion world's answer to consumer-activist bestsellers like Michael Pollan's *The Omnivore's Dilemma*.","note":"消费者权益倡导者；consumer-activist bestseller 指从消费者行动主义角度批判产业问题的畅销书。","forms":["consumer activist"]},{"w":"hunger","pos":"词","cn":"常见义为“饥饿”；此处也包含消费者对新衣和时尚的强烈欲望。","sec":"text1","sec_label":"Text 1","ctx":"\"Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,\" Cline argues.","note":"常见义为“饥饿”；此处也包含消费者对新衣和时尚的强烈欲望。","forms":["hunger"]},{"w":"give away","pos":"phr.","cn":"赠送，捐出。","sec":"text1","sec_label":"Text 1","ctx":"Americans, she finds, buy roughly 20 billion garments a year - about 64 items per person - and no matter how much they give away, this excess leads to waste.","note":"赠送，捐出。","forms":["give away"]},{"w":"no matter how much...","pos":"phr.","cn":"无论……多少，引导让步状语从句。","sec":"text1","sec_label":"Text 1","ctx":"Americans, she finds, buy roughly 20 billion garments a year - about 64 items per person - and no matter how much they give away, this excess leads to waste.","note":"无论……多少，引导让步状语从句。","forms":["no matter how much..."]},{"w":"ideal","pos":"adj.","cn":"常见义为形容词“理想的”；此处作名词，意为“理想典范、榜样”。","sec":"text1","sec_label":"Text 1","ctx":"Towards the end of *Overdressed*, Cline introduced her ideal, a Brooklyn woman named Sarah Kate Beaumont, who since 2008 has made all of her own clothes - and beautifully","note":"常见义为形容词“理想的”；此处作名词，意为“理想典范、榜样”。","forms":["ideal"]},{"w":"knock off","pos":"phr.","cn":"常见义包括“停止工作、匆匆完成”；此处结合服装语境，意为“仿制、复制”。","sec":"text1","sec_label":"Text 1","ctx":"But as Cline is the first to note, it took Beaumont decades to perfect her craft; her example can't be knocked off.","note":"常见义包括“停止工作、匆匆完成”；此处结合服装语境，意为“仿制、复制”。","forms":["knock off"]},{"w":"perfect one's craft","pos":"phr.","cn":"使技艺臻于完善，把手艺练到纯熟。","sec":"text1","sec_label":"Text 1","ctx":"But as Cline is the first to note, it took Beaumont decades to perfect her craft; her example can't be knocked off.","note":"使技艺臻于完善，把手艺练到纯熟。","forms":["perfect one's craft"]},{"w":"It takes sb. time to do sth.","pos":"phr.","cn":"某人花费多长时间做某事。","sec":"text1","sec_label":"Text 1","ctx":"But as Cline is the first to note, it took Beaumont decades to perfect her craft; her example can't be knocked off.","note":"某人花费多长时间做某事。","forms":["It takes sb. time to do sth."]},{"w":"effect","pos":"词","cn":"此处不是名词“影响”，而是动词“使发生、实现”；be effected by 意为“由……促成”。","sec":"text1","sec_label":"Text 1","ctx":"Though several fast-fashion companies have made efforts to curb their impact on labor and the environment - including H&M, with its green Conscious Collection line - Clin","note":"此处不是名词“影响”，而是动词“使发生、实现”；be effected by 意为“由……促成”。","forms":["effect"]},{"w":"curb","pos":"词","cn":"常见义为名词“路缘”；此处作动词，意为“控制、抑制”。","sec":"text1","sec_label":"Text 1","ctx":"Though several fast-fashion companies have made efforts to curb their impact on labor and the environment - including H&M, with its green Conscious Collection line - Clin","note":"常见义为名词“路缘”；此处作动词，意为“控制、抑制”。","forms":["curb"]},{"w":"advocate of sustainability","pos":"phr.","cn":"可持续发展理念的倡导者。","sec":"text1","sec_label":"Text 1","ctx":"She exhibits the idealism common to many advocates of sustainability, be it in food or in energy.","note":"可持续发展理念的倡导者。","forms":["advocate of sustainability"]},{"w":"be it A or B","pos":"phr.","cn":"无论是 A 还是 B，是带有让步意味的倒装表达。","sec":"text1","sec_label":"Text 1","ctx":"She exhibits the idealism common to many advocates of sustainability, be it in food or in energy.","note":"无论是 A 还是 B，是带有让步意味的倒装表达。","forms":["be it A or B"]},{"w":"constant","pos":"词","cn":"常见义为形容词“持续的”；此处作名词，意为“恒常不变的因素”。","sec":"text1","sec_label":"Text 1","ctx":"Vanity is a constant; people will only start shopping more sustainably when they can't afford not to.","note":"常见义为形容词“持续的”；此处作名词，意为“恒常不变的因素”。","forms":["constant"]},{"w":"can't afford not to do","pos":"phr.","cn":"承担不起不做某事的后果，即“不得不做”。","sec":"text1","sec_label":"Text 1","ctx":"Vanity is a constant; people will only start shopping more sustainably when they can't afford not to.","note":"承担不起不做某事的后果，即“不得不做”。","forms":["can't afford not to do"]},{"w":"shop sustainably","pos":"phr.","cn":"以兼顾资源、环境和劳工影响的可持续方式购物。","sec":"text1","sec_label":"Text 1","ctx":"Vanity is a constant; people will only start shopping more sustainably when they can't afford not to.","note":"以兼顾资源、环境和劳工影响的可持续方式购物。","forms":["shop sustainably"]},{"w":"an old saying has it that...","pos":"phr.","cn":"有句老话说……。","sec":"text2","sec_label":"Text 2","ctx":"An old saying has it that half of all advertising budgets are wasted - the trouble is, no one knows which half.","note":"有句老话说……。","forms":["an old saying has it that..."]},{"w":"advertising budget","pos":"phr.","cn":"广告预算。","sec":"text2","sec_label":"Text 2","ctx":"An old saying has it that half of all advertising budgets are wasted - the trouble is, no one knows which half.","note":"广告预算。","forms":["advertising budget"]},{"w":"fraction","pos":"n.","cn":"常见义为数学中的“分数”；此处指前文所说广告预算中被浪费的“比例”。","sec":"text2","sec_label":"Text 2","ctx":"In the internet age, at least in theory, this fraction can be much reduced.","note":"常见义为数学中的“分数”；此处指前文所说广告预算中被浪费的“比例”。","forms":["fraction"]},{"w":"aim","pos":"词","cn":"常见义为“瞄准”；aim ads at sb. 指把广告定向投放给某类人。","sec":"text2","sec_label":"Text 2","ctx":"By watching what people search for, click on and say online, companies can aim \"behavioural\" ads at those most likely to buy.","note":"常见义为“瞄准”；aim ads at sb. 指把广告定向投放给某类人。","forms":["aim"]},{"w":"fine-grained information","pos":"phr.","cn":"粒度很细、非常详尽的信息。","sec":"text2","sec_label":"Text 2","ctx":"In the past couple of weeks a quarrel has illustrated the value to advertisers of such fine-grained information: Should advertisers assume that people are happy to be tra","note":"粒度很细、非常详尽的信息。","forms":["fine-grained information"]},{"w":"assume that...","pos":"phr.","cn":"假定、想当然地认为……。","sec":"text2","sec_label":"Text 2","ctx":"In the past couple of weeks a quarrel has illustrated the value to advertisers of such fine-grained information: Should advertisers assume that people are happy to be tra","note":"假定、想当然地认为……。","forms":["assume that..."]},{"w":"explicit","pos":"词","cn":"明确表达的、毫不含糊的；此处与默认同意相对。","sec":"text2","sec_label":"Text 2","ctx":"Or should they have explicit permission?","note":"明确表达的、毫不含糊的；此处与默认同意相对。","forms":["explicit"]},{"w":"propose doing sth.","pos":"phr.","cn":"提议做某事。","sec":"text2","sec_label":"Text 2","ctx":"In December 2010 America's Federal Trade Commission (FTC) proposed adding a \"do not track\" (DNT) option to internet browsers, so that users could tell advertisers that th","note":"提议做某事。","forms":["propose doing sth."]},{"w":"do not track (DNT)","pos":"phr.","cn":"禁止跟踪，用于表达用户不希望网站追踪其网络行为的偏好设置。","sec":"text2","sec_label":"Text 2","ctx":"In December 2010 America's Federal Trade Commission (FTC) proposed adding a \"do not track\" (DNT) option to internet browsers, so that users could tell advertisers that th","note":"禁止跟踪，用于表达用户不希望网站追踪其网络行为的偏好设置。","forms":["do not track (DNT)"]},{"w":"be due to do sth.","pos":"phr.","cn":"预定、预计做某事。","sec":"text2","sec_label":"Text 2","ctx":"Microsoft's Internet Explorer and Apple's Safari both offer DNT; Google's Chrome is due to do so this year.","note":"预定、预计做某事。","forms":["be due to do sth."]},{"w":"do so","pos":"phr.","cn":"替代前面的 offer DNT，避免重复。","sec":"text2","sec_label":"Text 2","ctx":"Microsoft's Internet Explorer and Apple's Safari both offer DNT; Google's Chrome is due to do so this year.","note":"替代前面的 offer DNT，避免重复。","forms":["do so"]},{"w":"get cracking on","pos":"phr.","cn":"立即着手、赶紧开始做。","sec":"text2","sec_label":"Text 2","ctx":"In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.","note":"立即着手、赶紧开始做。","forms":["get cracking on"]},{"w":"respond to a request","pos":"phr.","cn":"响应请求。","sec":"text2","sec_label":"Text 2","ctx":"In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.","note":"响应请求。","forms":["respond to a request"]},{"w":"row","pos":"词","cn":"常见义为“一排、一行”；此处读作 /raʊ/，意为“争吵、争论”。","sec":"text2","sec_label":"Text 2","ctx":"On May 31st Microsoft set off the row.","note":"常见义为“一排、一行”；此处读作 /raʊ/，意为“争吵、争论”。","forms":["row"]},{"w":"set off","pos":"phr.","cn":"引发、触发。","sec":"text2","sec_label":"Text 2","ctx":"On May 31st Microsoft set off the row.","note":"引发、触发。","forms":["set off"]},{"w":"stick with","pos":"phr.","cn":"此处不是“用……粘住”，而是“继续采用、坚持使用”。","sec":"text2","sec_label":"Text 2","ctx":"Human nature being what it is, most people stick with default settings.","note":"此处不是“用……粘住”，而是“继续采用、坚持使用”。","forms":["stick with"]},{"w":"switch sth. on","pos":"phr.","cn":"开启某项功能。","sec":"text2","sec_label":"Text 2","ctx":"Few switch DNT on now, but if tracking is off it will stay off.","note":"开启某项功能。","forms":["switch sth. on"]},{"w":"stay off","pos":"phr.","cn":"保持关闭状态。","sec":"text2","sec_label":"Text 2","ctx":"Few switch DNT on now, but if tracking is off it will stay off.","note":"保持关闭状态。","forms":["stay off"]},{"w":"be worse off","pos":"phr.","cn":"处境更差、状况更糟，并非简单比较“更远”。","sec":"text2","sec_label":"Text 2","ctx":"Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their prefe","note":"处境更差、状况更糟，并非简单比较“更远”。","forms":["be worse off"]},{"w":"targeted ad","pos":"phr.","cn":"面向特定受众精准投放的广告。","sec":"text2","sec_label":"Text 2","ctx":"\"They'll get less meaningful, less targeted ads.\"","note":"面向特定受众精准投放的广告。","forms":["targeted ad"]},{"w":"oblige sb. to do sth.","pos":"phr.","cn":"迫使或要求某人做某事。","sec":"text2","sec_label":"Text 2","ctx":"Getting a DNT signal does not oblige anyone to stop tracking, although some companies have promised to do so.","note":"迫使或要求某人做某事。","forms":["oblige sb. to do sth."]},{"w":"press on","pos":"phr.","cn":"此处不是“按压”，而是“不顾困难继续进行”。","sec":"text2","sec_label":"Text 2","ctx":"Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft's default, some may ignore a DNT signal and press on anyway.","note":"此处不是“按压”，而是“不顾困难继续进行”。","forms":["press on"]},{"w":"go it alone","pos":"phr.","cn":"单独行动，独自去做。","sec":"text2","sec_label":"Text 2","ctx":"Also unclear is why Microsoft has gone it alone.","note":"单独行动，独自去做。","forms":["go it alone"]},{"w":"work out","pos":"phr.","cn":"常见义为“锻炼”；此处意为“想出、研究出解决办法”。","sec":"text2","sec_label":"Text 2","ctx":"After all, it has an ad business too, which it says will comply with DNT requests, though it is still working out how.","note":"常见义为“锻炼”；此处意为“想出、研究出解决办法”。","forms":["work out"]},{"w":"upset","pos":"词","cn":"常见义为“使难过”；此处意为“扰乱、打击”。","sec":"text2","sec_label":"Text 2","ctx":"If it is trying to upset Google, which relies almost wholly on advertising, it has chosen an indirect method: there is no guarantee that DNT by default will become the no","note":"常见义为“使难过”；此处意为“扰乱、打击”。","forms":["upset"]},{"w":"the norm","pos":"phr.","cn":"常态，通行标准。","sec":"text2","sec_label":"Text 2","ctx":"If it is trying to upset Google, which relies almost wholly on advertising, it has chosen an indirect method: there is no guarantee that DNT by default will become the no","note":"常态，通行标准。","forms":["the norm"]},{"w":"selling point","pos":"phr.","cn":"卖点，能够吸引消费者购买的优势。","sec":"text2","sec_label":"Text 2","ctx":"DNT does not seem an obviously huge selling point for windows 8 - though the firm has compared some of its other products favourably with Google's on that count before.","note":"卖点，能够吸引消费者购买的优势。","forms":["selling point"]},{"w":"on that count","pos":"phr.","cn":"在那一点上、就那一方面而言。","sec":"text2","sec_label":"Text 2","ctx":"DNT does not seem an obviously huge selling point for windows 8 - though the firm has compared some of its other products favourably with Google's on that count before.","note":"在那一点上、就那一方面而言。","forms":["on that count"]},{"w":"up until","pos":"phr.","cn":"一直到……为止。","sec":"text3","sec_label":"Text 3","ctx":"Up until a few decades ago, our visions of the future were largely - though by no means uniformly - glowingly positive.","note":"一直到……为止。","forms":["up until"]},{"w":"by no means","pos":"phr.","cn":"绝不，一点也不。","sec":"text3","sec_label":"Text 3","ctx":"Up until a few decades ago, our visions of the future were largely - though by no means uniformly - glowingly positive.","note":"绝不，一点也不。","forms":["by no means"]},{"w":"glowingly positive","pos":"phr.","cn":"极其乐观的、充满光明前景的。","sec":"text3","sec_label":"Text 3","ctx":"Up until a few decades ago, our visions of the future were largely - though by no means uniformly - glowingly positive.","note":"极其乐观的、充满光明前景的。","forms":["glowingly positive"]},{"w":"ill","pos":"词","cn":"常见作形容词，意为“生病的”；此处作名词，意为“弊病、祸患”。","sec":"text3","sec_label":"Text 3","ctx":"Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.","note":"常见作形容词，意为“生病的”；此处作名词，意为“弊病、祸患”。","forms":["ill"]},{"w":"appreciation","pos":"n.","cn":"常见义为“欣赏、感激”；此处意为“充分认识、深刻理解”。","sec":"text3","sec_label":"Text 3","ctx":"Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.","note":"常见义为“欣赏、感激”；此处意为“充分认识、深刻理解”。","forms":["appreciation"]},{"w":"unfashionable","pos":"adj.","cn":"此处不是衣着“不时髦”，而是某种观念“不再流行”。","sec":"text3","sec_label":"Text 3","ctx":"Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.","note":"此处不是衣着“不时髦”，而是某种观念“不再流行”。","forms":["unfashionable"]},{"w":"be tempted to do","pos":"phr.","cn":"很想做、忍不住想做。","sec":"text3","sec_label":"Text 3","ctx":"You might even be tempted to assume that humanity has little future to look forward to.","note":"很想做、忍不住想做。","forms":["be tempted to do"]},{"w":"look forward to","pos":"phr.","cn":"期待；此处介词 to 的宾语是前面的 future。","sec":"text3","sec_label":"Text 3","ctx":"You might even be tempted to assume that humanity has little future to look forward to.","note":"期待；此处介词 to 的宾语是前面的 future。","forms":["look forward to"]},{"w":"misplaced","pos":"v./adj.","cn":"常见义为“放错地方的”；此处意为“不合适的、没有根据的”。","sec":"text3","sec_label":"Text 3","ctx":"But such gloominess is misplaced.","note":"常见义为“放错地方的”；此处意为“不合适的、没有根据的”。","forms":["misplaced"]},{"w":"endure","pos":"词","cn":"常见义为“忍受”；此处意为“持续存在、存续”。","sec":"text3","sec_label":"Text 3","ctx":"The fossil record shows that many species have endured for millions of years - so why shouldn't we?","note":"常见义为“忍受”；此处意为“持续存在、存续”。","forms":["endure"]},{"w":"have an excellent chance of doing","pos":"phr.","cn":"极有可能做某事。","sec":"text3","sec_label":"Text 3","ctx":"Take a broader look at our species' place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of y","note":"极有可能做某事。","forms":["have an excellent chance of doing"]},{"w":"tens, if not hundreds, of thousands","pos":"phr.","cn":"数万，甚至数十万。","sec":"text3","sec_label":"Text 3","ctx":"Take a broader look at our species' place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of y","note":"数万，甚至数十万。","forms":["tens, if not hundreds, of thousands"]},{"w":"look up","pos":"phr.","cn":"查找、查阅。","sec":"text3","sec_label":"Text 3","ctx":"Look up *Homo sapiens* in the \"Red List\" of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: \"Listed as Least Concer","note":"查找、查阅。","forms":["look up"]},{"w":"Least Concern","pos":"phr.","cn":"IUCN 红色名录中的“无危”等级，表示目前灭绝风险很低。","sec":"text3","sec_label":"Text 3","ctx":"Look up *Homo sapiens* in the \"Red List\" of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: \"Listed as Least Concer","note":"IUCN 红色名录中的“无危”等级，表示目前灭绝风险很低。","forms":["Least Concern"]},{"w":"overall population decline","pos":"phr.","cn":"种群总量下降。","sec":"text3","sec_label":"Text 3","ctx":"Look up *Homo sapiens* in the \"Red List\" of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: \"Listed as Least Concer","note":"种群总量下降。","forms":["overall population decline"]},{"w":"hold","pos":"词","cn":"常见义为“拿着、容纳”；what does the future hold 表示“未来会带来什么、未来将会怎样”。","sec":"text3","sec_label":"Text 3","ctx":"So what does our deep future hold?","note":"常见义为“拿着、容纳”；what does the future hold 表示“未来会带来什么、未来将会怎样”。","forms":["hold"]},{"w":"a growing number of","pos":"phr.","cn":"越来越多的。","sec":"text3","sec_label":"Text 3","ctx":"A growing number of researchers and organisations are now thinking seriously about that question.","note":"越来越多的。","forms":["a growing number of"]},{"w":"flagship","pos":"n.","cn":"本义为“旗舰”；此处作定语，意为“最重要、最具代表性的”。","sec":"text3","sec_label":"Text 3","ctx":"For example, the Long Now Foundation has as its flagship project a mechanical clock that is designed to still be marking time thousands of years hence.","note":"本义为“旗舰”；此处作定语，意为“最重要、最具代表性的”。","forms":["flagship"]},{"w":"hence","pos":"n.","cn":"从现在起、此后；thousands of years hence 即“数千年以后”。","sec":"text3","sec_label":"Text 3","ctx":"For example, the Long Now Foundation has as its flagship project a mechanical clock that is designed to still be marking time thousands of years hence.","note":"从现在起、此后；thousands of years hence 即“数千年以后”。","forms":["hence"]},{"w":"immediate","pos":"v.","cn":"常见义为“立即的”；此处指时间上“较近的、眼前的”。","sec":"text3","sec_label":"Text 3","ctx":"Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future.","note":"常见义为“立即的”；此处指时间上“较近的、眼前的”。","forms":["immediate"]},{"w":"lengthy timescale","pos":"phr.","cn":"很长的时间尺度。","sec":"text3","sec_label":"Text 3","ctx":"Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future.","note":"很长的时间尺度。","forms":["lengthy timescale"]},{"w":"leave sth. to sb.","pos":"phr.","cn":"把某事留给某人处理或研究。","sec":"text3","sec_label":"Text 3","ctx":"The potential evolution of today's technology, and its social consequences, is dazzlingly complicated, and it's perhaps best left to science fiction writers and futurolog","note":"把某事留给某人处理或研究。","forms":["leave sth. to sb."]},{"w":"envisage","pos":"n.","cn":"设想、展望。","sec":"text3","sec_label":"Text 3","ctx":"The potential evolution of today's technology, and its social consequences, is dazzlingly complicated, and it's perhaps best left to science fiction writers and futurolog","note":"设想、展望。","forms":["envisage"]},{"w":"be dedicated to","pos":"phr.","cn":"专注于、致力于；其中 to 是介词。","sec":"text3","sec_label":"Text 3","ctx":"That's one reason why we have launched *Arc*, a new publication dedicated to the near future.","note":"专注于、致力于；其中 to 是介词。","forms":["be dedicated to"]},{"w":"take a longer view","pos":"phr.","cn":"从更长远的角度看。","sec":"text3","sec_label":"Text 3","ctx":"But take a longer view and there is a surprising amount that we can say with considerable assurance.","note":"从更长远的角度看。","forms":["take a longer view"]},{"w":"with considerable assurance","pos":"phr.","cn":"相当有把握地。","sec":"text3","sec_label":"Text 3","ctx":"But take a longer view and there is a surprising amount that we can say with considerable assurance.","note":"相当有把握地。","forms":["with considerable assurance"]},{"w":"hold the key to","pos":"phr.","cn":"是理解或解决……的关键。","sec":"text3","sec_label":"Text 3","ctx":"As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evi","note":"是理解或解决……的关键。","forms":["hold the key to"]},{"w":"evidence-based forecast","pos":"phr.","cn":"以证据为基础的预测。","sec":"text3","sec_label":"Text 3","ctx":"As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evi","note":"以证据为基础的预测。","forms":["evidence-based forecast"]},{"w":"find oneself in a situation","pos":"phr.","cn":"发现自己身处某种境况。","sec":"text3","sec_label":"Text 3","ctx":"As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evi","note":"发现自己身处某种境况。","forms":["find oneself in a situation"]},{"w":"prospects","pos":"词","cn":"此处指人类未来的“前景”，不是单指就业机会。","sec":"text3","sec_label":"Text 3","ctx":"This long perspective makes the pessimistic view of our prospects seem more likely to be a passing fad.","note":"此处指人类未来的“前景”，不是单指就业机会。","forms":["prospects"]},{"w":"a passing fad","pos":"phr.","cn":"一时的风潮、短暂流行的观念。","sec":"text3","sec_label":"Text 3","ctx":"This long perspective makes the pessimistic view of our prospects seem more likely to be a passing fad.","note":"一时的风潮、短暂流行的观念。","forms":["a passing fad"]},{"w":"to be sure","pos":"phr.","cn":"诚然，固然，用于先承认一个事实再推进主张。","sec":"text3","sec_label":"Text 3","ctx":"To be sure, the future is not all rosy.","note":"诚然，固然，用于先承认一个事实再推进主张。","forms":["to be sure"]},{"w":"not all rosy","pos":"phr.","cn":"并非事事美好，并非一片光明。","sec":"text3","sec_label":"Text 3","ctx":"To be sure, the future is not all rosy.","note":"并非事事美好，并非一片光明。","forms":["not all rosy"]},{"w":"lot","pos":"词","cn":"常见义为“许多、一批”；improve the lot of sb. 中意为“改善某人的境遇或命运”。","sec":"text3","sec_label":"Text 3","ctx":"But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.","note":"常见义为“许多、一批”；improve the lot of sb. 中意为“改善某人的境遇或命运”。","forms":["lot"]},{"w":"knowledgeable enough to do","pos":"phr.","cn":"拥有足够知识去做某事。","sec":"text3","sec_label":"Text 3","ctx":"But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.","note":"拥有足够知识去做某事。","forms":["knowledgeable enough to do"]},{"w":"those to come","pos":"phr.","cn":"后来的人、后代。","sec":"text3","sec_label":"Text 3","ctx":"But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.","note":"后来的人、后代。","forms":["those to come"]},{"w":"knock out","pos":"phr.","cn":"常见义为“击昏、淘汰”；此处为司法语境，意为“使法律条款失效、推翻”。","sec":"text4","sec_label":"Text 4","ctx":"On a five to three vote, the Supreme Court knocked out much of Arizona's immigration law Monday - a modest policy victory for the Obama Administration.","note":"常见义为“击昏、淘汰”；此处为司法语境，意为“使法律条款失效、推翻”。","forms":["knock out"]},{"w":"on a five to three vote","pos":"phr.","cn":"以五票对三票的表决结果。","sec":"text4","sec_label":"Text 4","ctx":"On a five to three vote, the Supreme Court knocked out much of Arizona's immigration law Monday - a modest policy victory for the Obama Administration.","note":"以五票对三票的表决结果。","forms":["on a five to three vote"]},{"w":"a modest policy victory","pos":"phr.","cn":"一次有限的政策胜利。","sec":"text4","sec_label":"Text 4","ctx":"On a five to three vote, the Supreme Court knocked out much of Arizona's immigration law Monday - a modest policy victory for the Obama Administration.","note":"一次有限的政策胜利。","forms":["a modest policy victory"]},{"w":"contested provision","pos":"phr.","cn":"受到争议或诉讼挑战的法律条款。","sec":"text4","sec_label":"Text 4","ctx":"In *Arizona v. United States*, the majority overturned three of the four contested provisions of Arizona's controversial plan to have state and local police enforce feder","note":"受到争议或诉讼挑战的法律条款。","forms":["contested provision"]},{"w":"have sb. do sth.","pos":"phr.","cn":"让某人做某事。","sec":"text4","sec_label":"Text 4","ctx":"In *Arizona v. United States*, the majority overturned three of the four contested provisions of Arizona's controversial plan to have state and local police enforce feder","note":"让某人做某事。","forms":["have sb. do sth."]},{"w":"enforce a law","pos":"phr.","cn":"执行法律。","sec":"text4","sec_label":"Text 4","ctx":"In *Arizona v. United States*, the majority overturned three of the four contested provisions of Arizona's controversial plan to have state and local police enforce feder","note":"执行法律。","forms":["enforce a law"]},{"w":"Washington","pos":"词","cn":"此处借美国首都指代联邦政府，并非单指这座城市。","sec":"text4","sec_label":"Text 4","ctx":"The Constitutional principles that Washington alone has the power to \"establish a uniform Rule of Naturalization\" and that federal laws precede state laws are noncontrove","note":"此处借美国首都指代联邦政府，并非单指这座城市。","forms":["Washington"]},{"w":"precede","pos":"词","cn":"常见义为“在时间或顺序上先于”；此处指联邦法在法律效力上优先于州法。","sec":"text4","sec_label":"Text 4","ctx":"The Constitutional principles that Washington alone has the power to \"establish a uniform Rule of Naturalization\" and that federal laws precede state laws are noncontrove","note":"常见义为“在时间或顺序上先于”；此处指联邦法在法律效力上优先于州法。","forms":["precede"]},{"w":"fashion","pos":"词","cn":"常见义为名词“时尚”；此处作动词，意为“制定、塑造”。","sec":"text4","sec_label":"Text 4","ctx":"Arizona had attempted to fashion state policies that ran parallel to the existing federal ones.","note":"常见义为名词“时尚”；此处作动词，意为“制定、塑造”。","forms":["fashion"]},{"w":"ones","pos":"词","cn":"替代前面的复数名词 policies，即联邦政策。","sec":"text4","sec_label":"Text 4","ctx":"Arizona had attempted to fashion state policies that ran parallel to the existing federal ones.","note":"替代前面的复数名词 policies，即联邦政策。","forms":["ones"]},{"w":"run parallel to","pos":"phr.","cn":"与……并行、平行存在。","sec":"text4","sec_label":"Text 4","ctx":"Arizona had attempted to fashion state policies that ran parallel to the existing federal ones.","note":"与……并行、平行存在。","forms":["run parallel to"]},{"w":"fly too close to the sun","pos":"phr.","cn":"源自伊卡洛斯神话，比喻冒险越界、挑战远超自身权限的力量。","sec":"text4","sec_label":"Text 4","ctx":"Justice Anthony Kennedy, joined by Chief Justice John Roberts and the Court's liberals, ruled that the state flew too close to the federal sun.","note":"源自伊卡洛斯神话，比喻冒险越界、挑战远超自身权限的力量。","forms":["fly too close to the sun"]},{"w":"hold (that)...","pos":"phr.","cn":"在司法语境中意为“裁定、认定……”。","sec":"text4","sec_label":"Text 4","ctx":"On the overturned provisions the majority held Congress had deliberately \"occupied the field\" and Arizona had thus intruded on the federal's privileged powers.","note":"在司法语境中意为“裁定、认定……”。","forms":["hold (that)..."]},{"w":"occupy the field","pos":"phr.","cn":"法律术语，指联邦立法已对某一领域作出全面规定，从而排除州立法介入。","sec":"text4","sec_label":"Text 4","ctx":"On the overturned provisions the majority held Congress had deliberately \"occupied the field\" and Arizona had thus intruded on the federal's privileged powers.","note":"法律术语，指联邦立法已对某一领域作出全面规定，从而排除州立法介入。","forms":["occupy the field"]},{"w":"intrude on","pos":"phr.","cn":"侵犯、侵入……的范围。","sec":"text4","sec_label":"Text 4","ctx":"On the overturned provisions the majority held Congress had deliberately \"occupied the field\" and Arizona had thus intruded on the federal's privileged powers.","note":"侵犯、侵入……的范围。","forms":["intrude on"]},{"w":"verify the legal status of","pos":"phr.","cn":"核查……的合法身份或居留状态。","sec":"text4","sec_label":"Text 4","ctx":"However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.","note":"核查……的合法身份或居留状态。","forms":["verify the legal status of"]},{"w":"come in contact with law enforcement","pos":"phr.","cn":"与执法部门发生接触。","sec":"text4","sec_label":"Text 4","ctx":"However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.","note":"与执法部门发生接触。","forms":["come in contact with law enforcement"]},{"w":"envision","pos":"n.","cn":"设想、构想；此处指国会在制度设计上认可联合执法。","sec":"text4","sec_label":"Text 4","ctx":"That's because Congress has always envisioned joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with","note":"设想、构想；此处指国会在制度设计上认可联合执法。","forms":["envision"]},{"w":"objecting","pos":"v./n.","cn":"此处指在裁决中“持异议的”，不是泛指日常反对。","sec":"text4","sec_label":"Text 4","ctx":"Two of the three objecting Justices - Samuel Alito and Clarence Thomas - agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the","note":"此处指在裁决中“持异议的”，不是泛指日常反对。","forms":["objecting"]},{"w":"statute","pos":"词","cn":"由立法机关制定的成文法。","sec":"text4","sec_label":"Text 4","ctx":"Two of the three objecting Justices - Samuel Alito and Clarence Thomas - agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the","note":"由立法机关制定的成文法。","forms":["statute"]},{"w":"robust","pos":"词","cn":"常见义为“强健的”；此处形容论证，意为“有力的、坚定的”。","sec":"text4","sec_label":"Text 4","ctx":"The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.","note":"常见义为“强健的”；此处形容论证，意为“有力的、坚定的”。","forms":["robust"]},{"w":"go back to","pos":"phr.","cn":"追溯到、始于。","sec":"text4","sec_label":"Text 4","ctx":"The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.","note":"追溯到、始于。","forms":["go back to"]},{"w":"turn on","pos":"phr.","cn":"此处不是“打开”，而是“取决于、以……为关键”。","sec":"text4","sec_label":"Text 4","ctx":"The 8-0 objection to President Obama turns on what Justice Samuel Alito describes in his objection as \"a shocking assertion of federal executive power\".","note":"此处不是“打开”，而是“取决于、以……为关键”。","forms":["turn on"]},{"w":"assertion","pos":"n.","cn":"主张、断言；结合语境指对权力的强势宣称。","sec":"text4","sec_label":"Text 4","ctx":"The 8-0 objection to President Obama turns on what Justice Samuel Alito describes in his objection as \"a shocking assertion of federal executive power\".","note":"主张、断言；结合语境指对权力的强势宣称。","forms":["assertion"]},{"w":"enforcement priorities","pos":"phr.","cn":"执法优先事项，即行政部门决定优先执行哪些政策目标。","sec":"text4","sec_label":"Text 4","ctx":"The White House argued that Arizona's laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter.","note":"执法优先事项，即行政部门决定优先执行哪些政策目标。","forms":["enforcement priorities"]},{"w":"comply with...to the letter","pos":"phr.","cn":"严格按照……的字面规定执行，丝毫不差。","sec":"text4","sec_label":"Text 4","ctx":"The White House argued that Arizona's laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter.","note":"严格按照……的字面规定执行，丝毫不差。","forms":["comply with...to the letter"]},{"w":"otherwise","pos":"v.","cn":"此处意为“在其他方面”，不是“否则”。","sec":"text4","sec_label":"Text 4","ctx":"In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.","note":"此处意为“在其他方面”，不是“否则”。","forms":["otherwise"]},{"w":"invalidate","pos":"v.","cn":"使失效，宣布无效。","sec":"text4","sec_label":"Text 4","ctx":"In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.","note":"使失效，宣布无效。","forms":["invalidate"]},{"w":"do belong","pos":"phr.","cn":"助动词 do 强调“确实属于”。","sec":"text4","sec_label":"Text 4","ctx":"Some powers do belong exclusively to the federal government, and control of citizenship and the borders is among them.","note":"助动词 do 强调“确实属于”。","forms":["do belong"]},{"w":"be among them","pos":"phr.","cn":"是其中之一。","sec":"text4","sec_label":"Text 4","ctx":"Some powers do belong exclusively to the federal government, and control of citizenship and the borders is among them.","note":"是其中之一。","forms":["be among them"]},{"w":"in essence","pos":"phr.","cn":"实质上，本质上。","sec":"text4","sec_label":"Text 4","ctx":"The Administration was in essence asserting that because it didn't want to carry out Congress's immigration wishes, no state should be allowed to do so either.","note":"实质上，本质上。","forms":["in essence"]},{"w":"carry out one's wishes","pos":"phr.","cn":"执行、落实某人的意图。","sec":"text4","sec_label":"Text 4","ctx":"The Administration was in essence asserting that because it didn't want to carry out Congress's immigration wishes, no state should be allowed to do so either.","note":"执行、落实某人的意图。","forms":["carry out one's wishes"]},{"w":"remarkable","pos":"adj.","cn":"常见义为“杰出的”；此处带批评意味，意为“非同寻常、令人侧目”。","sec":"text4","sec_label":"Text 4","ctx":"Every Justice rightly rejected this remarkable claim.","note":"常见义为“杰出的”；此处带批评意味，意为“非同寻常、令人侧目”。","forms":["remarkable"]}],"sentences":[{"id":"2013-T1-P1-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"In the 2006 film version of *The Devil Wears Prada*, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for imagining that high fashion doesn't affect her.","core":"Miranda Priestly scolds her assistant。","structure":"played by Meryl Streep 是过去分词短语，补充说明人物由谁饰演；for imagining... 说明斥责的原因；that high fashion doesn't affect her 是 imagining 的宾语从句。","key":"scold sb. for doing sth.：因某人做了某事而斥责某人。；high fashion：高级时装，尤指由顶尖设计师引领的时装潮流。","zh":"在 2006 年电影版《穿普拉达的女王》中，梅丽尔·斯特里普饰演的米兰达·普里斯特利斥责她那位其貌不扬的助理，因为助理竟以为高级时装与自己毫无关系。","tip":"her 指那位助理；助理误以为自己不受高级时装影响，并非沉迷高级时装。"},{"id":"2013-T1-P1-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Priestly explains how the deep blue color of the assistant's sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment.","core":"Priestly explains how the color descended from fashion shows to department stores and to the bargain bin。","structure":"how... 是 explains 的宾语从句；in which... 是定语从句，修饰 the bargain bin。","key":"descend：常见义为“下降”；此处作动词，形象地表示某种时尚元素从高端秀场逐级传播到大众零售市场。；bargain bin：商店中放置大幅折价商品的货筐或货区。；doubtless：无疑地，想必。","zh":"普里斯特利解释了助理毛衣的深蓝色如何经年累月地从时装秀传到百货商店，最后又流入折价货筐，而这个可怜的姑娘无疑正是在那里淘到了这件衣服。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T1-P2-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"This top-down conception of the fashion business couldn't be more out of date or at odds with the feverish world described in *Overdressed*, Elizabeth Cline's three-year indictment of \"fast fashion\".","core":"This conception couldn't be more out of date or at odds with the world。","structure":"described in Overdressed 是过去分词短语，修饰 the world；Elizabeth Cline's three-year indictment... 与书名构成同位关系，解释该书的性质。","key":"indictment：常见于法律语境，意为“起诉书”；此处引申为对快时尚的“严厉控诉、谴责”。；top-down：自上而下的。；couldn't be more...：不可能更……，即“极其……”。；be at odds with：与……不一致、相冲突。","zh":"这种认为时尚自上而下传播的行业观念已经过时到了极点，也与伊丽莎白·克莱因在《过度着装》中描绘的狂热世界格格不入；这本书是她历时三年对“快时尚”提出的一纸控诉。","tip":"indictment 在这里明确带有批评色彩，不表示宽容、冷漠或热情。"},{"id":"2013-T1-P2-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"These labels encourage style-conscious consumers to see clothes as disposable - meant to last only a wash or two, although they don't advertise that - and to renew their wardrobe every few weeks.","core":"These labels encourage consumers to see clothes as disposable and to renew their wardrobe。","structure":"两个并列不定式 to see... 和 to renew... 都作 encourage 的宾补；两个破折号之间解释 disposable；although... 是让步从句。","key":"style-conscious：注重穿衣风格、追逐时尚的。；see A as B：把 A 视为 B。；renew one's wardrobe：更新某人的衣橱，即频繁购买新衣。","zh":"这些品牌诱导追逐时尚的消费者把衣服视为一次性用品，也就是洗一两次便可淘汰，尽管品牌不会公开这样宣传，并让消费者每隔几周就更新一次衣橱。","tip":"品牌鼓励的是更频繁地购买和更换衣服，并非让消费者远离时尚市场。"},{"id":"2013-T1-P2-S05","sec":"text1","sec_label":"Text 1","level":3,"en":"By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long accustomed to a seasonal pace.","core":"These brands have hijacked fashion cycles。","structure":"By offering... 表示手段；Cline argues 是插入语；shaking... 是现在分词短语，说明前述行为造成的结果；long accustomed... 修饰 an industry。","key":"hijack：常见义为“劫持交通工具”；此处比喻快时尚品牌夺取并操控了时尚周期。；on-trend：符合当下潮流的。；dirt-cheap：极其便宜的。；be accustomed to：习惯于……。","zh":"克莱因认为，这些品牌以低得惊人的价格提供紧跟潮流的商品，从而劫持了时尚周期，撼动了一个长期习惯于季节性节奏的行业。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T1-P3-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"For H&M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on low-wage overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals.","core":"It must rely on labor, order in volumes, and use chemicals。","structure":"句首 For H&M to offer... 表示实现低价全球销售这一目标所需的条件；三个谓语成分 rely on、order、use 并列；that strain natural resources 修饰 volumes。","key":"strain：常见义为“拉紧、扭伤”；此处作动词，意为“使资源不堪重负”。","zh":"H&M 若想在全球 2300 多家门店都以 5.95 美元出售针织迷你裙，就必须依赖低工资的海外劳动力，以足以给自然资源造成重压的规模下单，并使用大量有害化学品。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T1-P4-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"\"Mass-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,\" Cline argues.","core":"Mass-produced clothing fills a hunger and need, yet is non-durable and wasteful。","structure":"like fast food 是插入的比较成分；fills 与 is 共享主语；yet 连接满足需求与不耐用、浪费之间的转折。","key":"hunger：常见义为“饥饿”；此处也包含消费者对新衣和时尚的强烈欲望。","zh":"克莱因指出：“批量生产的服装和快餐一样，虽能满足人们的欲望和需要，却不耐用，而且造成浪费。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T1-P4-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Americans, she finds, buy roughly 20 billion garments a year - about 64 items per person - and no matter how much they give away, this excess leads to waste.","core":"Americans buy garments, and this excess leads to waste。","structure":"she finds 是插入语；两个破折号之间把总量换算成人均数量；no matter how much they give away 是让步从句。","key":"give away：赠送，捐出。；no matter how much...：无论……多少，引导让步状语从句。","zh":"她发现，美国人每年购买约 200 亿件衣服，人均约 64 件；无论他们送出去多少，这种过量消费终究会造成浪费。","tip":"this excess 指每年购买数量过多这一事实，而不是单指捐赠行为。"},{"id":"2013-T1-P5-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Towards the end of *Overdressed*, Cline introduced her ideal, a Brooklyn woman named Sarah Kate Beaumont, who since 2008 has made all of her own clothes - and beautifully.","core":"Cline introduced her ideal。","structure":"a Brooklyn woman... 是 her ideal 的同位语；named... 修饰 woman；who... 是非限制性定语从句；破折号后的 and beautifully 补充说明她不仅亲手制作，而且成品美观。","key":"ideal：常见义为形容词“理想的”；此处作名词，意为“理想典范、榜样”。","zh":"在《过度着装》接近结尾处，克莱因介绍了她心目中的典范：住在布鲁克林的萨拉·凯特·博蒙特。自 2008 年以来，她所有的衣服都由自己制作，而且做得十分漂亮。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T1-P5-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"But as Cline is the first to note, it took Beaumont decades to perfect her craft; her example can't be knocked off.","core":"It took Beaumont decades; her example can't be knocked off。","structure":"as Cline is the first to note 是方式状语从句，可译为“正如克莱因首先指出的”；分号连接原因事实与结论。","key":"knock off：常见义包括“停止工作、匆匆完成”；此处结合服装语境，意为“仿制、复制”。；perfect one's craft：使技艺臻于完善，把手艺练到纯熟。；It takes sb. time to do sth.：某人花费多长时间做某事。","zh":"不过，正如克莱因自己最先指出的那样，博蒙特用了几十年才把手艺练到纯熟；她的做法无法被轻易仿制。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T1-P6-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Though several fast-fashion companies have made efforts to curb their impact on labor and the environment - including H&M, with its green Conscious Collection line - Cline believes lasting change can only be effected by the customer.","core":"Cline believes lasting change can only be effected by the customer。","structure":"Though... 是让步状语从句；两个破折号之间以 H&M 的环保系列补充举例；believes 后接省略 that 的宾语从句。","key":"effect：此处不是名词“影响”，而是动词“使发生、实现”；be effected by 意为“由……促成”。；curb：常见义为名词“路缘”；此处作动词，意为“控制、抑制”。","zh":"尽管多家快时尚企业已经努力控制其对劳工和环境的影响，其中包括推出绿色环保系列 Conscious Collection 的 H&M，但克莱因认为，持久的改变只能由消费者促成。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T1-P6-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"She exhibits the idealism common to many advocates of sustainability, be it in food or in energy.","core":"She exhibits the idealism。","structure":"common to... 是形容词短语，后置修饰 idealism；be it... 是省略并倒装的让步结构，相当于 whether it is...。","key":"advocate of sustainability：可持续发展理念的倡导者。；be it A or B：无论是 A 还是 B，是带有让步意味的倒装表达。","zh":"她表现出许多可持续发展倡导者共有的理想主义，无论这种主张针对的是食品领域还是能源领域。","tip":"it 指可持续发展理念所涉及的领域，而非专指前面的 idealism。"},{"id":"2013-T1-P6-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Vanity is a constant; people will only start shopping more sustainably when they can't afford not to.","core":"Vanity is a constant; people will start shopping sustainably。","structure":"分号连接作者对人性的判断及其消费结论；only...when... 表明必要条件；not to 省略了 shop more sustainably。","key":"constant：常见义为形容词“持续的”；此处作名词，意为“恒常不变的因素”。；can't afford not to do：承担不起不做某事的后果，即“不得不做”。；shop sustainably：以兼顾资源、环境和劳工影响的可持续方式购物。；be at odds with：与……不一致、相冲突。","zh":"爱慕虚荣是不会改变的；只有当人们承担不起“不进行可持续消费”的代价时，他们才会开始以更可持续的方式购物。","tip":"双重否定 can't afford not to 不是“买不起环保商品”，而是“不环保的代价已承受不起”。"},{"id":"2013-T2-P1-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"An old saying has it that half of all advertising budgets are wasted - the trouble is, no one knows which half.","core":"An old saying has it that half of the budgets are wasted - the trouble is...。","structure":"it 是形式宾语，that... 是真正宾语；破折号后补充说明传统广告浪费问题为何难以解决；which half 是 knows 的宾语从句。","key":"an old saying has it that...：有句老话说……。；advertising budget：广告预算。","zh":"有句老话说，所有广告预算中有一半都被浪费了，麻烦在于没人知道被浪费的是哪一半。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T2-P1-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"By watching what people search for, click on and say online, companies can aim \"behavioural\" ads at those most likely to buy.","core":"Companies can aim ads at those。","structure":"By watching... 表示手段；what... 同时作 search for、click on 和 say 的宾语；most likely to buy 后置修饰 those。","key":"aim：常见义为“瞄准”；aim ads at sb. 指把广告定向投放给某类人。","zh":"企业可以通过观察人们在网上搜索什么、点击什么以及说些什么，把“行为定向”广告精准投向最有可能购买的人。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T2-P2-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"In the past couple of weeks a quarrel has illustrated the value to advertisers of such fine-grained information: Should advertisers assume that people are happy to be tracked and sent behavioural ads?","core":"A quarrel has illustrated the value: Should advertisers assume...?","structure":"to advertisers 说明信息对谁有价值；冒号后的问句具体呈现争议；to be tracked and sent... 是两个并列的被动不定式。","key":"fine-grained information：粒度很细、非常详尽的信息。；assume that...：假定、想当然地认为……。","zh":"过去几周的一场争论凸显了这类精细信息对广告主的价值：广告主是否可以默认人们乐于受到追踪并接收行为定向广告？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T2-P3-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"In December 2010 America's Federal Trade Commission (FTC) proposed adding a \"do not track\" (DNT) option to internet browsers, so that users could tell advertisers that they did not want to be followed.","core":"The FTC proposed adding a DNT option。","structure":"so that... 引导目的状语从句；其中 that they did not want... 是 tell advertisers 的宾语从句。","key":"propose doing sth.：提议做某事。；do not track (DNT)：禁止跟踪，用于表达用户不希望网站追踪其网络行为的偏好设置。","zh":"2010 年 12 月，美国联邦贸易委员会（FTC）提议在互联网浏览器中加入“禁止跟踪”（DNT）选项，让用户可以告知广告主自己不愿受到跟踪。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T2-P3-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"In February the FTC and the Digital Advertising Alliance (DAA) agreed that the industry would get cracking on responding to DNT requests.","core":"The FTC and the DAA agreed that the industry would get cracking。","structure":"that... 是 agreed 的宾语从句；the industry 要结合与 FTC 达成协议的 Digital Advertising Alliance 及全文广告业务语境确定所指。","key":"get cracking on：立即着手、赶紧开始做。；respond to a request：响应请求。","zh":"2 月，FTC 与数字广告联盟（DAA）达成一致，相关行业将立即着手响应 DNT 请求。","tip":"代词指代应先寻找同一语境中能够执行 responding to DNT requests 的行业主体，不能只因 DNT 位于浏览器中就机械指向浏览器开发者。"},{"id":"2013-T2-P4-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"It said that Internet Explorer 10, the version due to appear with Windows 8, would have DNT as a default.","core":"It said that Internet Explorer 10 would have DNT as a default。","structure":"the version due to appear with Windows 8 是 Internet Explorer 10 的同位语；due to appear... 后置修饰 the version。","key":"见下方词汇笔记","zh":"微软表示，计划与 Windows 8 一同发布的 Internet Explorer 10 将把 DNT 设为默认选项。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T2-P5-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Human nature being what it is, most people stick with default settings.","core":"Most people stick with default settings。","structure":"Human nature being what it is 是独立主格结构，说明原因，相当于“考虑到人性本来如此”。","key":"stick with：此处不是“用……粘住”，而是“继续采用、坚持使用”。","zh":"人性使然，大多数人都会沿用默认设置。","tip":"what it is 表示“人性现有的样子”，不是疑问结构。"},{"id":"2013-T2-P5-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot collect information about their preferences.","core":"Bob Liodice says consumers will be worse off。","structure":"两个逗号之间是说明其身份的同位语；says 后是省略 that 的宾语从句；if... 提出消费者处境变差的条件。","key":"be worse off：处境更差、状况更糟，并非简单比较“更远”。","zh":"美国全国广告商协会首席执行官鲍勃·利奥迪斯表示，如果广告业无法收集消费者的偏好信息，消费者的处境反而会变得更糟。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T2-P6-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"It is not yet clear how advertisers will respond.","core":"It is not yet clear。","structure":"It 是形式主语，how advertisers will respond 是真正主语。","key":"见下方词汇笔记","zh":"广告主将如何应对，目前尚不明确。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T2-P6-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Unable to tell whether someone really objects to behavioural ads or whether they are sticking with Microsoft's default, some may ignore a DNT signal and press on anyway.","core":"Some may ignore a DNT signal and press on。","structure":"句首 Unable to tell... 是形容词短语作原因状语；两个 whether 引导并列的宾语从句，表示两种无法区分的情况。","key":"press on：此处不是“按压”，而是“不顾困难继续进行”。","zh":"由于无法判断某人是真的反对行为定向广告，还是仅仅沿用了微软的默认设置，一些广告主可能会无视 DNT 信号，照样继续跟踪。","tip":"some 承接本段开头的 advertisers；they 用作性别中性的单数代词，指 someone。"},{"id":"2013-T2-P7-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Also unclear is why Microsoft has gone it alone.","core":"Why Microsoft has gone it alone is also unclear。","structure":"原句为表语前置形成的完全倒装；why... 是主语从句。","key":"go it alone：单独行动，独自去做。","zh":"同样不清楚的是，微软为何要独自采取这一行动。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T2-P7-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"After all, it has an ad business too, which it says will comply with DNT requests, though it is still working out how.","core":"It has an ad business。","structure":"which... 是非限制性定语从句，修饰 an ad business；it says 是插入语；though... 表示让步；how 后省略了如何遵从 DNT 请求的具体内容。","key":"work out：常见义为“锻炼”；此处意为“想出、研究出解决办法”。","zh":"毕竟，微软自己也经营广告业务；它称这项业务会遵从 DNT 请求，尽管具体如何执行仍在研究之中。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T2-P7-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"If it is trying to upset Google, which relies almost wholly on advertising, it has chosen an indirect method: there is no guarantee that DNT by default will become the norm.","core":"If it is trying to upset Google, it has chosen an indirect method。","structure":"which... 是非限制性定语从句，修饰 Google；冒号后解释这种方法为何间接；that... 是 guarantee 的同位语从句。","key":"upset：常见义为“使难过”；此处意为“扰乱、打击”。；the norm：常态，通行标准。","zh":"如果微软是想打乱几乎完全依赖广告业务的谷歌的阵脚，那么它选择了一种间接手段：没有任何保证表明默认启用 DNT 会成为行业常态。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T2-P7-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"DNT does not seem an obviously huge selling point for windows 8 - though the firm has compared some of its other products favourably with Google's on that count before.","core":"DNT does not seem a huge selling point。","structure":"破折号后 though... 补充让步信息；Google's 后省略了 products；favourably 表示比较结果对微软有利。","key":"selling point：卖点，能够吸引消费者购买的优势。；on that count：在那一点上、就那一方面而言。","zh":"DNT 看起来并不是 windows 8 一个显而易见的巨大卖点，尽管微软以前曾在这一点上把自己的其他产品与谷歌产品作过有利于己方的比较。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T2-P7-S06","sec":"text2","sec_label":"Text 2","level":3,"en":"Could it really be that simple?","core":"Could it be that simple?","structure":"见原句","key":"aim ads at：把广告定向投放给……。；fine-grained information：非常详尽的信息。；get cracking on：立即着手做……。；stick with default settings：沿用默认设置。","zh":"事情真的会这么简单吗？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T3-P1-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Up until a few decades ago, our visions of the future were largely - though by no means uniformly - glowingly positive.","core":"Our visions of the future were largely positive。","structure":"两个破折号之间的 though by no means uniformly 是让步性插入语，说明这种乐观并非人人一致；glowingly 加强 positive 的程度。","key":"up until：一直到……为止。；by no means：绝不，一点也不。；glowingly positive：极其乐观的、充满光明前景的。","zh":"直到几十年前，我们对未来的想象总体上仍是一片光明，尽管这种乐观绝非毫无例外。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Science and technology would cure all the ills of humanity, leading to lives of fulfilment and opportunity for all.","core":"Science and technology would cure all the ills。","structure":"leading to... 是现在分词短语，表示科学技术治愈弊病所带来的结果。","key":"ill：常见作形容词，意为“生病的”；此处作名词，意为“弊病、祸患”。","zh":"人们相信，科学技术将治愈人类的一切弊病，让所有人都能过上充实而又充满机遇的生活。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T3-P2-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to epidemic flu and to climate change.","core":"Utopia has grown unfashionable。","structure":"as... 引导原因状语从句；facing us 后置修饰 threats；from...to...and to... 列举威胁范围。","key":"appreciation：常见义为“欣赏、感激”；此处意为“充分认识、深刻理解”。；unfashionable：此处不是衣着“不时髦”，而是某种观念“不再流行”。","zh":"如今，乌托邦式的未来图景已经不再流行，因为我们更加深刻地认识到人类面临的种种威胁，从小行星撞击、流行性感冒到气候变化，不一而足。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T3-P2-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"You might even be tempted to assume that humanity has little future to look forward to.","core":"You might be tempted to assume that humanity has little future。","structure":"that... 是 assume 的宾语从句；to look forward to 是不定式短语，后置修饰 future。","key":"be tempted to do：很想做、忍不住想做。；look forward to：期待；此处介词 to 的宾语是前面的 future。","zh":"你甚至可能忍不住认为，人类几乎没有什么值得期待的未来。","tip":"little future 表示“几乎没有未来”，语气比 a little future 消极。"},{"id":"2013-T3-P3-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"The fossil record shows that many species have endured for millions of years - so why shouldn't we?","core":"The fossil record shows that many species have endured。","structure":"that... 是宾语从句；破折号后的反问省略了 endure for millions of years。","key":"endure：常见义为“忍受”；此处意为“持续存在、存续”。","zh":"化石记录表明，许多物种已经延续了数百万年，那么人类为什么不能呢？","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T3-P3-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"Take a broader look at our species' place in the universe, and it becomes clear that we have an excellent chance of surviving for tens, if not hundreds, of thousands of years.","core":"Take a broader look, and it becomes clear that we have a chance。","structure":"祈使句 + and + 陈述句 表示条件与结果，相当于“如果……，就……”；it 是形式主语，that... 是真正主语；if not hundreds 是插入成分，表示递进。","key":"have an excellent chance of doing：极有可能做某事。；tens, if not hundreds, of thousands：数万，甚至数十万。","zh":"从更宏大的尺度审视人类在宇宙中的位置，就会清楚地看到：我们极有可能再生存数万年，甚至数十万年。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T3-P3-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"Look up *Homo sapiens* in the \"Red List\" of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: \"Listed as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.\"","core":"Look up Homo sapiens and you will read: Listed as Least Concern。","structure":"再次使用 祈使句 + and + 陈述句；引文中第一个 as 表示原因；resulting in... 修饰 threats；widely distributed、adaptable 和 currently increasing 并列说明人类物种的状态。","key":"look up：查找、查阅。；Least Concern：IUCN 红色名录中的“无危”等级，表示目前灭绝风险很低。；overall population decline：种群总量下降。","zh":"在国际自然保护联盟（IUCN）的受威胁物种“红色名录”中查找智人，你会读到：“鉴于该物种分布极广、适应性强且数量目前仍在增长，同时不存在会导致种群总量下降的重大威胁，因此被列为‘无危’。”","tip":"Least Concern 不表示人类“最不关心”其他物种，而是一个保护状况等级，说明人类作为物种能够持续存续。"},{"id":"2013-T3-P4-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"For example, the Long Now Foundation has as its flagship project a mechanical clock that is designed to still be marking time thousands of years hence.","core":"The Long Now Foundation has a mechanical clock as its flagship project。","structure":"原文把 as its flagship project 提到宾语前；that... 是定语从句，修饰 a mechanical clock；be marking time 强调届时仍处于持续计时状态。","key":"flagship：本义为“旗舰”；此处作定语，意为“最重要、最具代表性的”。；hence：从现在起、此后；thousands of years hence 即“数千年以后”。","zh":"例如，恒今基金会的旗舰项目是一座机械钟，其设计目标是在数千年后仍能持续计时。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T3-P5-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Perhaps willfully, it may be easier to think about such lengthy timescales than about the more immediate future.","core":"It may be easier to think about lengthy timescales than about the immediate future。","structure":"It 是形式主语，真正主语是两个比较的不定式概念；than 后承前省略 to think。","key":"immediate：常见义为“立即的”；此处指时间上“较近的、眼前的”。；lengthy timescale：很长的时间尺度。","zh":"也许颇有些出人意料的是，思考如此漫长的时间尺度，反而可能比思考更近的未来容易。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T3-P5-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"The potential evolution of today's technology, and its social consequences, is dazzlingly complicated, and it's perhaps best left to science fiction writers and futurologists to explore the many possibilities we can envisage.","core":"The evolution and its consequences is complicated, and it is best left to writers and futurologists。","structure":"主语中心是 evolution，and its social consequences 为插入式并列补充，因此原文谓语用 is；第二个 it 指探索近未来这一任务；we can envisage 是省略关系代词的定语从句，修饰 possibilities。","key":"leave sth. to sb.：把某事留给某人处理或研究。；envisage：设想、展望。","zh":"当今技术可能如何演进、又会产生怎样的社会后果，这些问题复杂得令人眼花缭乱；也许最好留给科幻作家和未来学家去探索我们能够设想的种种可能。","tip":"left to 不是“被遗忘”，而是“交由……去处理”；本句直接说明近期未来难以构想。"},{"id":"2013-T3-P5-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"That's one reason why we have launched *Arc*, a new publication dedicated to the near future.","core":"That is one reason。","structure":"why... 是定语从句，修饰 reason；a new publication... 是 Arc 的同位语；dedicated to... 后置修饰 publication。","key":"be dedicated to：专注于、致力于；其中 to 是介词。","zh":"这正是我们创办新刊物 *Arc* 的原因之一；该刊专门关注不久的将来。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T3-P6-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"But take a longer view and there is a surprising amount that we can say with considerable assurance.","core":"Take a longer view and there is a surprising amount。","structure":"祈使句 + and + 陈述句 表示条件与结果；that we can say... 是定语从句，修饰 amount。","key":"take a longer view：从更长远的角度看。；with considerable assurance：相当有把握地。","zh":"但如果把眼光放得更长远，我们就会发现，有相当多的事情可以颇有把握地加以判断，其数量甚至令人惊讶。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T3-P6-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our descendants will find themselves.","core":"The past holds the key: we have identified enough patterns to make forecasts。","structure":"冒号后解释过去为何能帮助预测未来；shaping... 修饰 patterns；enough...to make... 表示数量足以达到某结果；in which... 修饰 situations。","key":"hold the key to：是理解或解决……的关键。；evidence-based forecast：以证据为基础的预测。；find oneself in a situation：发现自己身处某种境况。","zh":"正如常见的情形一样，过去掌握着通往未来的钥匙：如今，我们已经识别出足够多塑造地球与人类历史的长期规律，因而能够依据证据预测我们的后代将会身处怎样的境况。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T3-P7-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"This long perspective makes the pessimistic view of our prospects seem more likely to be a passing fad.","core":"This perspective makes the view seem likely to be a passing fad。","structure":"make + 宾语 + 动词原形 构成使役结构；of our prospects 修饰 the pessimistic view；to be... 补足 likely 的内容。","key":"prospects：此处指人类未来的“前景”，不是单指就业机会。；a passing fad：一时的风潮、短暂流行的观念。","zh":"这种长远视角使那种对人类前景的悲观看法显得更像是一阵短暂的风潮。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T3-P7-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"But we are now knowledgeable enough to reduce many of the risks that threatened the existence of earlier humans, and to improve the lot of those to come.","core":"We are knowledgeable enough to reduce risks and to improve the lot。","structure":"两个并列不定式 to reduce... 和 to improve... 说明知识足以实现的两件事；that... 修饰 risks；to come 后置修饰 those。","key":"lot：常见义为“许多、一批”；improve the lot of sb. 中意为“改善某人的境遇或命运”。；knowledgeable enough to do：拥有足够知识去做某事。；those to come：后来的人、后代。；by no means：绝不，一点也不。","zh":"但是，我们如今掌握的知识已经足以降低许多曾威胁早期人类生存的风险，并改善后来者的命运。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T4-P1-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"On a five to three vote, the Supreme Court knocked out much of Arizona's immigration law Monday - a modest policy victory for the Obama Administration.","core":"The Supreme Court knocked out much of the law。","structure":"句首介词短语交代表决票数；破折号后的名词短语评价这一裁决对奥巴马政府的政策意义。","key":"knock out：常见义为“击昏、淘汰”；此处为司法语境，意为“使法律条款失效、推翻”。；on a five to three vote：以五票对三票的表决结果。；a modest policy victory：一次有限的政策胜利。","zh":"周一，最高法院以五票对三票裁定亚利桑那州移民法的大部分内容无效，这对奥巴马政府而言是一次有限的政策胜利。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T4-P1-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"But on the more important matter of the Constitution, the decision was an 8-0 defeat for the Administration's effort to upset the balance of power between the federal government and the states.","core":"The decision was an 8-0 defeat for the effort。","structure":"on the...matter 限定评价裁决的宪法维度；to upset... 修饰 effort；between...and... 说明权力平衡存在于哪两方之间。","key":"upset：常见义为“使难过”；此处意为“打乱、破坏”。","zh":"但是，在更为重要的宪法问题上，这项裁决却以八票对零票彻底否定了奥巴马政府试图打破联邦政府与各州之间权力平衡的做法。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T4-P2-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"In *Arizona v. United States*, the majority overturned three of the four contested provisions of Arizona's controversial plan to have state and local police enforce federal immigration law.","core":"The majority overturned three provisions。","structure":"of the four contested provisions 说明三项条款所属的整体；of Arizona's...plan 修饰 provisions；to have... 修饰 plan，说明方案的目的或内容。","key":"contested provision：受到争议或诉讼挑战的法律条款。；have sb. do sth.：让某人做某事。；enforce a law：执行法律。","zh":"在“亚利桑那州诉美国”一案中，多数大法官推翻了亚利桑那州争议性方案中四项受质疑条款里的三项；该方案原本试图让州警察和地方警察执行联邦移民法。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T4-P2-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"The Constitutional principles that Washington alone has the power to \"establish a uniform Rule of Naturalization\" and that federal laws precede state laws are noncontroversial.","core":"The Constitutional principles are noncontroversial。","structure":"两个并列的 that 从句都是 principles 的同位语从句，分别说明联邦归化权和联邦法优先原则的具体内容。","key":"Washington：此处借美国首都指代联邦政府，并非单指这座城市。；precede：常见义为“在时间或顺序上先于”；此处指联邦法在法律效力上优先于州法。","zh":"以下宪法原则并无争议：只有联邦政府有权“制定统一的归化规则”，并且联邦法律的效力优先于州法律。","tip":"句中两个 that 地位并列，不能把第二个误接到引文内部；主语中心词是复数 principles，所以谓语为 are。"},{"id":"2013-T4-P3-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Justice Anthony Kennedy, joined by Chief Justice John Roberts and the Court's liberals, ruled that the state flew too close to the federal sun.","core":"Justice Anthony Kennedy ruled that the state flew too close。","structure":"joined by... 是过去分词短语，说明哪些大法官支持肯尼迪；that... 是 ruled 的宾语从句。","key":"fly too close to the sun：源自伊卡洛斯神话，比喻冒险越界、挑战远超自身权限的力量。","zh":"安东尼·肯尼迪大法官在首席大法官约翰·罗伯茨和最高法院自由派大法官的支持下裁定，该州过于接近联邦权力这轮“太阳”，已经有越界之虞。","tip":"the federal sun 是对联邦专属权力的比喻，不是自然意义上的太阳。"},{"id":"2013-T4-P3-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"On the overturned provisions the majority held Congress had deliberately \"occupied the field\" and Arizona had thus intruded on the federal's privileged powers.","core":"The majority held (that) Congress had occupied the field and (that) Arizona had intruded on powers。","structure":"held 后接两个省略 that 的并列宾语从句；thus 标明后一事实是前一事实的结果。","key":"hold (that)...：在司法语境中意为“裁定、认定……”。；occupy the field：法律术语，指联邦立法已对某一领域作出全面规定，从而排除州立法介入。；intrude on：侵犯、侵入……的范围。","zh":"对于被推翻的那些条款，多数大法官认为，国会已经有意对该领域实行全面规制，因此亚利桑那州侵犯了联邦政府的专属权力。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T4-P4-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law enforcement.","core":"The Justices said that Arizona police would be allowed to verify the status。","structure":"that... 是 said 的宾语从句；who... 是定语从句，修饰 people。","key":"verify the legal status of：核查……的合法身份或居留状态。；come in contact with law enforcement：与执法部门发生接触。","zh":"不过，大法官们表示，亚利桑那州警方仍可核查与执法部门发生接触的人员是否合法居留。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T4-P4-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"That's because Congress has always envisioned joint federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues.","core":"That is because Congress has envisioned enforcement and encourages officers。","structure":"because... 是表语从句，解释州警为何仍可核查身份；to share...and cooperate... 是两个并列宾补，均由 encourages 支配。","key":"envision：设想、构想；此处指国会在制度设计上认可联合执法。","zh":"这是因为，国会始终设想由联邦与州共同执行移民法，并明确鼓励州执法人员共享信息、与联邦同僚合作。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T4-P5-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Two of the three objecting Justices - Samuel Alito and Clarence Thomas - agreed with this Constitutional logic but disagreed about which Arizona rules conflicted with the federal statute.","core":"Two Justices agreed with the logic but disagreed about which rules conflicted。","structure":"两个破折号之间是对两位大法官的具体列举；which... 是 about 的宾语从句。","key":"objecting：此处指在裁决中“持异议的”，不是泛指日常反对。；statute：由立法机关制定的成文法。","zh":"三位持异议的大法官中有两位，即塞缪尔·阿利托和克拉伦斯·托马斯，赞同这一宪法逻辑，但对亚利桑那州哪些规定与联邦成文法相冲突持不同意见。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T4-P5-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"The only major objection came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and SeditionActs.","core":"The objection came from Justice Scalia。","structure":"who... 是非限制性定语从句，补充其反对意见；going back to... 修饰 state privileges，说明州权主张的历史源头。","key":"robust：常见义为“强健的”；此处形容论证，意为“有力的、坚定的”。；go back to：追溯到、始于。","zh":"唯一重大的反对意见来自安东宁·斯卡利亚大法官；他对州权作出了更加强有力的辩护，并把这种权利追溯到《客籍法和惩治叛乱法》时期。","tip":"PDF 原文将 SeditionActs 连写，笔记按原文保留；理解时应视为法案名称 *Alien and Sedition Acts*。"},{"id":"2013-T4-P6-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The 8-0 objection to President Obama turns on what Justice Samuel Alito describes in his objection as \"a shocking assertion of federal executive power\".","core":"The objection turns on what Justice Alito describes as an assertion。","structure":"what... 是介词 on 的宾语从句；describe A as B 表示“把 A 描述为 B”；两个 objection 分别指全体大法官的反对与阿利托的反对意见。","key":"turn on：此处不是“打开”，而是“取决于、以……为关键”。；assertion：主张、断言；结合语境指对权力的强势宣称。","zh":"大法官们以八票对零票反对奥巴马总统，其症结在于塞缪尔·阿利托大法官在反对意见中所谓的“对联邦行政权力令人震惊的扩张主张”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T4-P6-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"The White House argued that Arizona's laws conflicted with its enforcement priorities, even if state laws complied with federal statutes to the letter.","core":"The White House argued that Arizona's laws conflicted with its priorities。","structure":"that... 是宾语从句；even if... 引导让步状语从句；its 指白宫所代表的联邦行政部门。","key":"enforcement priorities：执法优先事项，即行政部门决定优先执行哪些政策目标。；comply with...to the letter：严格按照……的字面规定执行，丝毫不差。","zh":"白宫声称，即便州法一字不差地遵守联邦成文法，只要亚利桑那州的法律与联邦政府的执法优先事项相冲突，州法仍有问题。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T4-P6-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it disagrees with.","core":"The White House claimed that it could invalidate any state law。","structure":"that it disagrees with 是定语从句，修饰 state law，介词 with 留在句末；otherwise legitimate 表示该州法除与行政部门意见不合之外本来合法。","key":"otherwise：此处意为“在其他方面”，不是“否则”。；invalidate：使失效，宣布无效。","zh":"实际上，白宫声称，它可以宣布任何一项自己不赞同、但在其他方面合法的州法无效。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T4-P7-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"But if Congress wanted to prevent states from using their own resources to check immigration status, it could.","core":"If Congress wanted to prevent states, it could。","structure":"prevent sb. from doing 表示阻止某人做某事；句末 could 后省略 prevent states from...，避免重复。","key":"见下方词汇笔记","zh":"但是，如果国会想禁止各州动用自身资源核查移民身份，它本可以这样规定。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2013-T4-P7-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"The Administration was in essence asserting that because it didn't want to carry out Congress's immigration wishes, no state should be allowed to do so either.","core":"The Administration was asserting that no state should be allowed to do so。","structure":"that... 是 asserting 的宾语从句；其中 because... 是原因状语从句；第一个 it 指联邦行政部门；do so 指执行国会的移民政策意图。","key":"in essence：实质上，本质上。；carry out one's wishes：执行、落实某人的意图。","zh":"奥巴马政府实质上是在主张：因为它自己不愿执行国会的移民政策意图，所以任何州也都不应获准这样做。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"}]};</script>

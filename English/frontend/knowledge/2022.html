 is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.","note":"先锋派的、前卫的。","forms":["avant-garde"]},{"w":"celluloid","pos":"词","cn":"赛璐珞，一种早期塑料，也曾用于制作电影胶片。","sec":"text1","sec_label":"Text 1","ctx":"The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.","note":"赛璐珞，一种早期塑料，也曾用于制作电影胶片。","forms":["celluloid"]},{"w":"vulnerable","pos":"adj.","cn":"常见义为“易受伤的”；此处指材料“容易受损、容易劣化”。","sec":"text1","sec_label":"Text 1","ctx":"Certain artifacts are especially vulnerable because some pioneers in plastic art didn't always know how to mix ingredients properly, says Thea van Oosten, a polymer chemi","note":"常见义为“易受伤的”；此处指材料“容易受损、容易劣化”。","forms":["vulnerable"]},{"w":"ingredient","pos":"词","cn":"常用于指“烹饪原料”；此处指制作塑料艺术品所用的“配料、组分”。","sec":"text1","sec_label":"Text 1","ctx":"Certain artifacts are especially vulnerable because some pioneers in plastic art didn't always know how to mix ingredients properly, says Thea van Oosten, a polymer chemi","note":"常用于指“烹饪原料”；此处指制作塑料艺术品所用的“配料、组分”。","forms":["ingredient"]},{"w":"amount","pos":"词","cn":"此处不是笼统的“数量”，而是各种原料各自准确的“用量、配比”。","sec":"text1","sec_label":"Text 1","ctx":"\"It's like baking a cake: If you don't have exact amounts, it goes wrong,\" she says.","note":"此处不是笼统的“数量”，而是各种原料各自准确的“用量、配比”。","forms":["amount"]},{"w":"go wrong","pos":"phr.","cn":"出差错、出现问题。","sec":"text1","sec_label":"Text 1","ctx":"\"It's like baking a cake: If you don't have exact amounts, it goes wrong,\" she says.","note":"出差错、出现问题。","forms":["go wrong"]},{"w":"time bomb","pos":"phr.","cn":"本义为“定时炸弹”；此处比喻作品内部的材料缺陷迟早会引发劣化。","sec":"text1","sec_label":"Text 1","ctx":"\"The object you make is already a time bomb.\"","note":"本义为“定时炸弹”；此处比喻作品内部的材料缺陷迟早会引发劣化。","forms":["time bomb"]},{"w":"bed","pos":"v./adj.","cn":"常见义为“床”；a bed of roses 在此指种有玫瑰的“花坛、花圃”，不是习语“安逸的处境”。","sec":"text1","sec_label":"Text 1","ctx":"Those pieces included small beds of roses and other items as well as a few dozen \"nature carpets\"—large rectangles decorated with foam pumpkins, cabbages, and watermelons","note":"常见义为“床”；a bed of roses 在此指种有玫瑰的“花坛、花圃”，不是习语“安逸的处境”。","forms":["bed"]},{"w":"polyurethane foam","pos":"phr.","cn":"聚氨酯泡沫。","sec":"text1","sec_label":"Text 1","ctx":"Unfortunately, the polyurethane foam he used is inherently unstable.","note":"聚氨酯泡沫。","forms":["polyurethane foam"]},{"w":"inherently unstable","pos":"phr.","cn":"本质上不稳定、具有内在的不稳定性。","sec":"text1","sec_label":"Text 1","ctx":"Unfortunately, the polyurethane foam he used is inherently unstable.","note":"本质上不稳定、具有内在的不稳定性。","forms":["inherently unstable"]},{"w":"figure","pos":"词","cn":"常见义为“数字、人物”；此处指艺术品中塑造出的“形体、造型”。","sec":"text1","sec_label":"Text 1","ctx":"It's especially vulnerable to light damage, and by the mid-1990s, Gilardi's pumpkins, roses, and other figures were splitting and crumbling.","note":"常见义为“数字、人物”；此处指艺术品中塑造出的“形体、造型”。","forms":["figure"]},{"w":"be vulnerable to","pos":"phr.","cn":"易受……损害。","sec":"text1","sec_label":"Text 1","ctx":"It's especially vulnerable to light damage, and by the mid-1990s, Gilardi's pumpkins, roses, and other figures were splitting and crumbling.","note":"易受……损害。","forms":["be vulnerable to"]},{"w":"split and crumble","pos":"phr.","cn":"开裂并碎裂。","sec":"text1","sec_label":"Text 1","ctx":"It's especially vulnerable to light damage, and by the mid-1990s, Gilardi's pumpkins, roses, and other figures were splitting and crumbling.","note":"开裂并碎裂。","forms":["split and crumble"]},{"w":"lock sth. away","pos":"phr.","cn":"把某物锁藏起来，使其不再被使用或展示。","sec":"text1","sec_label":"Text 1","ctx":"Museums locked some of them away in the dark.","note":"把某物锁藏起来，使其不再被使用或展示。","forms":["lock sth. away"]},{"w":"infuse","pos":"词","cn":"常见义为“泡制、灌输”；此处指将保护性化学物质“注入、渗入”作品材料。","sec":"text1","sec_label":"Text 1","ctx":"They infused some with stabilizing and consolidating chemicals.","note":"常见义为“泡制、灌输”；此处指将保护性化学物质“注入、渗入”作品材料。","forms":["infuse"]},{"w":"stabilizing and consolidating chemicals","pos":"phr.","cn":"起稳定和加固作用的化学制剂。","sec":"text1","sec_label":"Text 1","ctx":"They infused some with stabilizing and consolidating chemicals.","note":"起稳定和加固作用的化学制剂。","forms":["stabilizing and consolidating chemicals"]},{"w":"sunscreen","pos":"词","cn":"通常指涂在人皮肤上的“防晒霜”；此处是比喻，指为塑料作品抵御光损害的化学制剂。","sec":"text1","sec_label":"Text 1","ctx":"Van Oosten calls those chemicals \"sunscreens\" because their goal was to prevent further light damage and rebuild worn polymer fibers.","note":"通常指涂在人皮肤上的“防晒霜”；此处是比喻，指为塑料作品抵御光损害的化学制剂。","forms":["sunscreen"]},{"w":"worn","pos":"词","cn":"常见义为“穿旧的”；此处指材料纤维“受损、耗损的”。","sec":"text1","sec_label":"Text 1","ctx":"Van Oosten calls those chemicals \"sunscreens\" because their goal was to prevent further light damage and rebuild worn polymer fibers.","note":"常见义为“穿旧的”；此处指材料纤维“受损、耗损的”。","forms":["worn"]},{"w":"go on display","pos":"phr.","cn":"被展出、公开陈列。","sec":"text1","sec_label":"Text 1","ctx":"She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.","note":"被展出、公开陈列。","forms":["go on display"]},{"w":"albeit","pos":"词","cn":"尽管、虽然，相当于 although，但其后常直接接短语而非完整从句。","sec":"text1","sec_label":"Text 1","ctx":"She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.","note":"尽管、虽然，相当于 although，但其后常直接接短语而非完整从句。","forms":["albeit"]},{"w":"story","pos":"词","cn":"常见义为“故事”；success story 指“成功案例”。","sec":"text1","sec_label":"Text 1","ctx":"Despite success stories like van Oosten's, preservation of plastics will likely get harder.","note":"常见义为“故事”；success story 指“成功案例”。","forms":["story"]},{"w":"biodegradable","pos":"adj.","cn":"可生物降解的。","sec":"text1","sec_label":"Text 1","ctx":"Worse, biodegradable plastics, designed to disintegrate, are increasingly common.","note":"可生物降解的。","forms":["biodegradable"]},{"w":"disintegrate","pos":"v.","cn":"瓦解、分解成碎片。","sec":"text1","sec_label":"Text 1","ctx":"Worse, biodegradable plastics, designed to disintegrate, are increasingly common.","note":"瓦解、分解成碎片。","forms":["disintegrate"]},{"w":"at stake","pos":"phr.","cn":"处于成败攸关的境地；more is at stake than... 表示“牵涉的重要问题不止……”。","sec":"text1","sec_label":"Text 1","ctx":"And more is at stake here than individual objects.","note":"处于成败攸关的境地；more is at stake than... 表示“牵涉的重要问题不止……”。","forms":["at stake"]},{"w":"age","pos":"n.","cn":"常见义为“年龄”；此处指具有特定历史文化特征的“时代”。","sec":"text1","sec_label":"Text 1","ctx":"Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great","note":"常见义为“年龄”；此处指具有特定历史文化特征的“时代”。","forms":["age"]},{"w":"see","pos":"词","cn":"常见义为“看见”；此处是“看待、认识、评价”。","sec":"text1","sec_label":"Text 1","ctx":"We now live in an age of plastic, she says, \"and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we'll be see","note":"常见义为“看见”；此处是“看待、认识、评价”。","forms":["see"]},{"w":"crop","pos":"词","cn":"常见义为“庄稼、收成”；此处指同一时期出现的“一批”学生。","sec":"text2","sec_label":"Text 2","ctx":"As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a","note":"常见义为“庄稼、收成”；此处指同一时期出现的“一批”学生。","forms":["crop"]},{"w":"pen","pos":"词","cn":"常见义为“钢笔”；此处作动词，意为“书写、填写”。","sec":"text2","sec_label":"Text 2","ctx":"As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a","note":"常见义为“钢笔”；此处作动词，意为“书写、填写”。","forms":["pen"]},{"w":"point","pos":"词","cn":"常见义为“点、分数”；此处指做某事的“意义、用处”。","sec":"text2","sec_label":"Text 2","ctx":"As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a","note":"常见义为“点、分数”；此处指做某事的“意义、用处”。","forms":["point"]},{"w":"weigh up one's options","pos":"phr.","cn":"权衡某人可以作出的各种选择。","sec":"text2","sec_label":"Text 2","ctx":"As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a","note":"权衡某人可以作出的各种选择。","forms":["weigh up one's options"]},{"w":"undergraduate application form","pos":"phr.","cn":"本科申请表。","sec":"text2","sec_label":"Text 2","ctx":"As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a","note":"本科申请表。","forms":["undergraduate application form"]},{"w":"educational journey","pos":"phr.","cn":"教育历程。","sec":"text2","sec_label":"Text 2","ctx":"As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a","note":"教育历程。","forms":["educational journey"]},{"w":"decent","pos":"词","cn":"常见义为“体面的”；此处指质量或水平“相当不错的、过得去的”。","sec":"text2","sec_label":"Text 2","ctx":"Millennials were told that if you did well in school, got a decent degree, you would be set up for life.","note":"常见义为“体面的”；此处指质量或水平“相当不错的、过得去的”。","forms":["decent"]},{"w":"be set up for life","pos":"phr.","cn":"不是“为生活作好一般准备”，而是指经济或事业基础已经稳固，因而“一生有保障”。","sec":"text2","sec_label":"Text 2","ctx":"Millennials were told that if you did well in school, got a decent degree, you would be set up for life.","note":"不是“为生活作好一般准备”，而是指经济或事业基础已经稳固，因而“一生有保障”。","forms":["be set up for life"]},{"w":"wanting","pos":"v./n.","cn":"常见的 want 表示“想要”；be found wanting 是固定表达，意为“经检验发现有缺陷、不足以达到预期”。","sec":"text2","sec_label":"Text 2","ctx":"But that promise has been found wanting.","note":"常见的 want 表示“想要”；be found wanting 是固定表达，意为“经检验发现有缺陷、不足以达到预期”。","forms":["wanting"]},{"w":"universal","pos":"adj.","cn":"此处不是绝对意义上的“人人都有”，而是“极为普遍、普及”。","sec":"text2","sec_label":"Text 2","ctx":"As degrees became universal, they became devalued.","note":"此处不是绝对意义上的“人人都有”，而是“极为普遍、普及”。","forms":["universal"]},{"w":"devalue","pos":"词","cn":"使贬值、降低……的价值。","sec":"text2","sec_label":"Text 2","ctx":"As degrees became universal, they became devalued.","note":"使贬值、降低……的价值。","forms":["devalue"]},{"w":"social mobility","pos":"phr.","cn":"社会流动，尤指个人或群体在社会阶层中的上升或下降。","sec":"text2","sec_label":"Text 2","ctx":"Education was no longer a secure route of social mobility.","note":"社会流动，尤指个人或群体在社会阶层中的上升或下降。","forms":["social mobility"]},{"w":"a secure route of...","pos":"phr.","cn":"实现……的可靠途径。","sec":"text2","sec_label":"Text 2","ctx":"Education was no longer a secure route of social mobility.","note":"实现……的可靠途径。","forms":["a secure route of..."]},{"w":"non-graduate role","pos":"phr.","cn":"不是“非毕业生的身份”，而是“不要求大学学历的岗位”。","sec":"text2","sec_label":"Text 2","ctx":"Today, 28 per cent of graduates in the UK are in non-graduate roles, a percentage which is double the average among the OECD countries.","note":"不是“非毕业生的身份”，而是“不要求大学学历的岗位”。","forms":["non-graduate role"]},{"w":"switch","pos":"词","cn":"此处作名词，指从中学到大学的“转变、转换”。","sec":"text2","sec_label":"Text 2","ctx":"This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not ","note":"此处作名词，指从中学到大学的“转变、转换”。","forms":["switch"]},{"w":"lecture hall","pos":"phr.","cn":"大学讲堂；这里借指大学教育。","sec":"text2","sec_label":"Text 2","ctx":"This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not ","note":"大学讲堂；这里借指大学教育。","forms":["lecture hall"]},{"w":"predecessor","pos":"词","cn":"前任、前辈；此处指年龄较长、先经历大学教育与就业的千禧一代。","sec":"text2","sec_label":"Text 2","ctx":"Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be","note":"前任、前辈；此处指年龄较长、先经历大学教育与就业的千禧一代。","forms":["predecessor"]},{"w":"be set in","pos":"phr.","cn":"固定于、固守于某种想法或做法。","sec":"text2","sec_label":"Text 2","ctx":"Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be","note":"固定于、固守于某种想法或做法。","forms":["be set in"]},{"w":"school leaver","pos":"phr.","cn":"完成中学教育后离校的人；在此特指没有继续上大学、直接进入职场者。","sec":"text2","sec_label":"Text 2","ctx":"Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and loyal employees than graduates.","note":"完成中学教育后离校的人；在此特指没有继续上大学、直接进入职场者。","forms":["school leaver"]},{"w":"committed","pos":"v./adj.","cn":"此处指对工作“尽心尽力的、投入的”。","sec":"text2","sec_label":"Text 2","ctx":"Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and loyal employees than graduates.","note":"此处指对工作“尽心尽力的、投入的”。","forms":["committed"]},{"w":"prove oneself to be...","pos":"phr.","cn":"以实际表现证明自己是……","sec":"text2","sec_label":"Text 2","ctx":"Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and loyal employees than graduates.","note":"以实际表现证明自己是……","forms":["prove oneself to be..."]},{"w":"scrap","pos":"词","cn":"常见义为“碎片、废料”；此处作动词，意为“取消、废除”。","sec":"text2","sec_label":"Text 2","ctx":"Many too are seeing the advantages of scrapping a degree requirement for certain roles.","note":"常见义为“碎片、废料”；此处作动词，意为“取消、废除”。","forms":["scrap"]},{"w":"pay","pos":"词","cn":"常见义为“付款”；it pays to do sth. 表示“做某事是有利的、值得的”。","sec":"text2","sec_label":"Text 2","ctx":"In this age of generalists, it pays to have specific knowledge or skills.","note":"常见义为“付款”；it pays to do sth. 表示“做某事是有利的、值得的”。","forms":["pay"]},{"w":"generalist","pos":"词","cn":"知识或能力覆盖多个领域的通才，与 specialist 相对。","sec":"text2","sec_label":"Text 2","ctx":"In this age of generalists, it pays to have specific knowledge or skills.","note":"知识或能力覆盖多个领域的通才，与 specialist 相对。","forms":["generalist"]},{"w":"postgraduate","pos":"v.","cn":"此处作名词，指拥有或正在接受研究生教育的人；graduate 在该语境下指本科毕业生。","sec":"text2","sec_label":"Text 2","ctx":"Postgraduates now earn 40 per cent more than graduates.","note":"此处作名词，指拥有或正在接受研究生教育的人；graduate 在该语境下指本科毕业生。","forms":["postgraduate"]},{"w":"it makes sense to do sth.","pos":"phr.","cn":"做某事是合理的、明智的。","sec":"text2","sec_label":"Text 2","ctx":"When more and more of us have a degree, it makes sense to have two.","note":"做某事是合理的、明智的。","forms":["it makes sense to do sth."]},{"w":"be done with","pos":"phr.","cn":"结束、不再继续做某事。","sec":"text2","sec_label":"Text 2","ctx":"It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly upskilling throughout their career to stay employable.","note":"结束、不再继续做某事。","forms":["be done with"]},{"w":"upskill","pos":"词","cn":"提升技能、学习更高级或更新的职业技能。","sec":"text2","sec_label":"Text 2","ctx":"It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly upskilling throughout their career to stay employable.","note":"提升技能、学习更高级或更新的职业技能。","forms":["upskill"]},{"w":"employable","pos":"adj.","cn":"具备受雇条件的、有就业竞争力的。","sec":"text2","sec_label":"Text 2","ctx":"It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly upskilling throughout their career to stay employable.","note":"具备受雇条件的、有就业竞争力的。","forms":["employable"]},{"w":"personal fulfilment","pos":"phr.","cn":"个人价值的实现、个人成就感。","sec":"text2","sec_label":"Text 2","ctx":"It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different empl","note":"个人价值的实现、个人成就感。","forms":["personal fulfilment"]},{"w":"over the course of","pos":"phr.","cn":"在……的整个过程中。","sec":"text2","sec_label":"Text 2","ctx":"It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different empl","note":"在……的整个过程中。","forms":["over the course of"]},{"w":"trajectory","pos":"词","cn":"本义为物体运动的“轨迹”；此处指职业生涯的“发展路径、走向”。","sec":"text2","sec_label":"Text 2","ctx":"Education, and not just knowledge gained on campus, will be a core part of Generation Z's career trajectory.","note":"本义为物体运动的“轨迹”；此处指职业生涯的“发展路径、走向”。","forms":["trajectory"]},{"w":"tense","pos":"词","cn":"常见义为“紧张的”；此处作名词，意为语法上的“时态”。","sec":"text2","sec_label":"Text 2","ctx":"Older generations often talk about their degree in the present and personal tense: \"I am a geographer\" or \"I am a classicist.\"","note":"常见义为“紧张的”；此处作名词，意为语法上的“时态”。","forms":["tense"]},{"w":"classicist","pos":"词","cn":"古典学者，研究古希腊、古罗马语言与文化等古典学问的人。","sec":"text2","sec_label":"Text 2","ctx":"Older generations often talk about their degree in the present and personal tense: \"I am a geographer\" or \"I am a classicist.\"","note":"古典学者，研究古希腊、古罗马语言与文化等古典学问的人。","forms":["classicist"]},{"w":"define","pos":"词","cn":"常见义为“下定义”；此处指“界定一个人的身份和人生”。","sec":"text2","sec_label":"Text 2","ctx":"Their sons or daughters would never say such a thing; it's as if they already know that their degree won't define them in the same way.","note":"常见义为“下定义”；此处指“界定一个人的身份和人生”。","forms":["define"]},{"w":"enlightening","pos":"v./n.","cn":"启发人的、使人增长见识的。","sec":"text3","sec_label":"Text 3","ctx":"Enlightening, challenging, stimulating, fun.","note":"启发人的、使人增长见识的。","forms":["enlightening"]},{"w":"stimulating","pos":"v./n.","cn":"激发兴趣或思考的、振奋人心的。","sec":"text3","sec_label":"Text 3","ctx":"Enlightening, challenging, stimulating, fun.","note":"激发兴趣或思考的、振奋人心的。","forms":["stimulating"]},{"w":"accompanying","pos":"v./n.","cn":"此处指与系列文章一同发布、作为配套内容的。","sec":"text3","sec_label":"Text 3","ctx":"Nearly 40% of the roughly 350 people who responded to an accompanying poll said they had collaborated with artists; and almost all said they would consider doing so in fu","note":"此处指与系列文章一同发布、作为配套内容的。","forms":["accompanying"]},{"w":"do so","pos":"phr.","cn":"代替前面的 collaborate with artists，意为“与艺术家合作”。","sec":"text3","sec_label":"Text 3","ctx":"Nearly 40% of the roughly 350 people who responded to an accompanying poll said they had collaborated with artists; and almost all said they would consider doing so in fu","note":"代替前面的 collaborate with artists，意为“与艺术家合作”。","forms":["do so"]},{"w":"seek out","pos":"phr.","cn":"不是一般的“寻找”，而是“主动找出、物色到”。","sec":"text3","sec_label":"Text 3","ctx":"Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences.","note":"不是一般的“寻找”，而是“主动找出、物色到”。","forms":["seek out"]},{"w":"communicate","pos":"v.","cn":"此处指把科研内容“传达、传播”给公众。","sec":"text3","sec_label":"Text 3","ctx":"Scientists are increasingly seeking out visual artists to help them communicate their work to new audiences.","note":"此处指把科研内容“传达、传播”给公众。","forms":["communicate"]},{"w":"rock the scene","pos":"phr.","cn":"此处不是字面上的“摇动场景”，而是指“震撼现场、带来轰动”。","sec":"text3","sec_label":"Text 3","ctx":"One example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vival","note":"此处不是字面上的“摇动场景”，而是指“震撼现场、带来轰动”。","forms":["rock the scene"]},{"w":"reworked","pos":"v./adj.","cn":"重新加工或改编的。","sec":"text3","sec_label":"Text 3","ctx":"One example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vival","note":"重新加工或改编的。","forms":["reworked"]},{"w":"score","pos":"词","cn":"常见义为“分数”；此处作名词，指音乐作品的“总谱、乐谱”。","sec":"text3","sec_label":"Text 3","ctx":"They reimagined the 300-year-old score by injecting the latest climate prediction data for each season—provided by Monash University's Climate Change Communication Resear","note":"常见义为“分数”；此处作名词，指音乐作品的“总谱、乐谱”。","forms":["score"]},{"w":"inject","pos":"词","cn":"常见义为“注射”；此处指把气候数据“注入、融入”艺术作品。","sec":"text3","sec_label":"Text 3","ctx":"They reimagined the 300-year-old score by injecting the latest climate prediction data for each season—provided by Monash University's Climate Change Communication Resear","note":"常见义为“注射”；此处指把气候数据“注入、融入”艺术作品。","forms":["inject"]},{"w":"reimagine","pos":"词","cn":"以新的方式重新构想、重新诠释。","sec":"text3","sec_label":"Text 3","ctx":"They reimagined the 300-year-old score by injecting the latest climate prediction data for each season—provided by Monash University's Climate Change Communication Resear","note":"以新的方式重新构想、重新诠释。","forms":["reimagine"]},{"w":"call to action","pos":"phr.","cn":"行动号召，指促使受众关注问题并采取行动的信息或活动。","sec":"text3","sec_label":"Text 3","ctx":"The performance was a creative call to action ahead of November's United Nations Climate Change Conference in Glasgow, UK.","note":"行动号召，指促使受众关注问题并采取行动的信息或活动。","forms":["call to action"]},{"w":"ahead of","pos":"phr.","cn":"在……之前。","sec":"text3","sec_label":"Text 3","ctx":"The performance was a creative call to action ahead of November's United Nations Climate Change Conference in Glasgow, UK.","note":"在……之前。","forms":["ahead of"]},{"w":"a two-way street","pos":"phr.","cn":"本义为“双向通行的道路”；此处比喻双方都应投入并获益的“双向关系”。","sec":"text3","sec_label":"Text 3","ctx":"But a genuine partnership must be a two-way street.","note":"本义为“双向通行的道路”；此处比喻双方都应投入并获益的“双向关系”。","forms":["a two-way street"]},{"w":"requirement","pos":"n.","cn":"此处指科学家在传播科研内容方面的“需要、需求”。","sec":"text3","sec_label":"Text 3","ctx":"Fewer artists than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requi","note":"此处指科学家在传播科研内容方面的“需要、需求”。","forms":["requirement"]},{"w":"stake","pos":"词","cn":"常见义为“木桩、股份”；have a shared stake in 指“共同利益攸关、共同承担项目成败”。","sec":"text3","sec_label":"Text 3","ctx":"The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other's work.","note":"常见义为“木桩、股份”；have a shared stake in 指“共同利益攸关、共同承担项目成败”。","forms":["stake"]},{"w":"critique","pos":"词","cn":"对作品作出深入、专业的评议，并不只是一般的“批评”。","sec":"text3","sec_label":"Text 3","ctx":"The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other's work.","note":"对作品作出深入、专业的评议，并不只是一般的“批评”。","forms":["critique"]},{"w":"prompt","pos":"词","cn":"常见义为“提示”；此处作动词，意为“促使、推动”。","sec":"text3","sec_label":"Text 3","ctx":"Such an approach can both prompt new research as well as result in powerful art.","note":"常见义为“提示”；此处作动词，意为“促使、推动”。","forms":["prompt"]},{"w":"powerful","pos":"adj.","cn":"此处不指物理上的“强大”，而指艺术作品“有感染力、有冲击力”。","sec":"text3","sec_label":"Text 3","ctx":"Such an approach can both prompt new research as well as result in powerful art.","note":"此处不指物理上的“强大”，而指艺术作品“有感染力、有冲击力”。","forms":["powerful"]},{"w":"Massachusetts Institute of Technology (MIT)","pos":"phr.","cn":"麻省理工学院。","sec":"text3","sec_label":"Text 3","ctx":"More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture.","note":"麻省理工学院。","forms":["Massachusetts Institute of Technology (MIT)"]},{"w":"Center for Advanced Visual Studies (CAVS)","pos":"phr.","cn":"高级视觉研究中心。","sec":"text3","sec_label":"Text 3","ctx":"More than half a century ago, the Massachusetts Institute of Technology opened its Center for Advanced Visual Studies (CAVS) to explore the role of technology in culture.","note":"高级视觉研究中心。","forms":["Center for Advanced Visual Studies (CAVS)"]},{"w":"hence","pos":"n.","cn":"因此、由此，这里说明名称的由来。","sec":"text3","sec_label":"Text 3","ctx":"The founders deliberately focused their projects around light—hence the \"visual studies\" in the name.","note":"因此、由此，这里说明名称的由来。","forms":["hence"]},{"w":"look to","pos":"phr.","cn":"此处指“展望、期待”未来，而不是简单地“看向”。","sec":"text3","sec_label":"Text 3","ctx":"As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artist","note":"此处指“展望、期待”未来，而不是简单地“看向”。","forms":["look to"]},{"w":"vice versa","pos":"phr.","cn":"反之亦然，即艺术家、作家和诗人也可以成为研究人员。","sec":"text3","sec_label":"Text 3","ctx":"As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artist","note":"反之亦然，即艺术家、作家和诗人也可以成为研究人员。","forms":["vice versa"]},{"w":"as strong as ever","pos":"phr.","cn":"一如既往地强劲。","sec":"text3","sec_label":"Text 3","ctx":"Nature's poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge","note":"一如既往地强劲。","forms":["as strong as ever"]},{"w":"make sth. work","pos":"phr.","cn":"使某事顺利运转、取得成效。","sec":"text3","sec_label":"Text 3","ctx":"Nature's poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge","note":"使某事顺利运转、取得成效。","forms":["make sth. work"]},{"w":"embrace surprise and challenge","pos":"phr.","cn":"主动接受意外情况和挑战。","sec":"text3","sec_label":"Text 3","ctx":"Nature's poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge","note":"主动接受意外情况和挑战。","forms":["embrace surprise and challenge"]},{"w":"reach","pos":"词","cn":"常见义为“到达”；此处作名词，指合作所能发挥作用的“范围、影响范围”。","sec":"text3","sec_label":"Text 3","ctx":"The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each oth","note":"常见义为“到达”；此处作名词，指合作所能发挥作用的“范围、影响范围”。","forms":["reach"]},{"w":"tie-up","pos":"词","cn":"合作关系、联合行动。","sec":"text3","sec_label":"Text 3","ctx":"The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each oth","note":"合作关系、联合行动。","forms":["tie-up"]},{"w":"stereotype","pos":"词","cn":"把某人简单地套入刻板印象。","sec":"text3","sec_label":"Text 3","ctx":"The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each oth","note":"把某人简单地套入刻板印象。","forms":["stereotype"]},{"w":"alike","pos":"词","cn":"同样地；A and B alike 表示“A 和 B 都……”。","sec":"text3","sec_label":"Text 3","ctx":"Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.","note":"同样地；A and B alike 表示“A 和 B 都……”。","forms":["alike"]},{"w":"be immersed in","pos":"phr.","cn":"专注于、沉浸于。","sec":"text3","sec_label":"Text 3","ctx":"Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.","note":"专注于、沉浸于。","forms":["be immersed in"]},{"w":"be core to","pos":"phr.","cn":"对……至关重要、是……的核心。","sec":"text3","sec_label":"Text 3","ctx":"Artists and scientists alike are immersed in discovery and invention, and challenge and critique are core to both, too.","note":"对……至关重要、是……的核心。","forms":["be core to"]},{"w":"personal grievance","pos":"phr.","cn":"在新西兰劳动法语境中指员工针对不公正待遇或无正当理由解雇提出的“个人申诉”。","sec":"text4","sec_label":"Text 4","ctx":"The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause.","note":"在新西兰劳动法语境中指员工针对不公正待遇或无正当理由解雇提出的“个人申诉”。","forms":["personal grievance"]},{"w":"provision","pos":"n.","cn":"常见义为“提供、供应”；此处作名词，指法律中的“条款、规定”。","sec":"text4","sec_label":"Text 4","ctx":"The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause.","note":"常见义为“提供、供应”；此处作名词，指法律中的“条款、规定”。","forms":["provision"]},{"w":"fire an employee","pos":"phr.","cn":"解雇员工。","sec":"text4","sec_label":"Text 4","ctx":"The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause.","note":"解雇员工。","forms":["fire an employee"]},{"w":"without good cause","pos":"phr.","cn":"没有正当、充分的理由。","sec":"text4","sec_label":"Text 4","ctx":"The personal grievance provisions of New Zealand's Employment Relations Act 2000 (ERA) prevent an employer from firing an employee without good cause.","note":"没有正当、充分的理由。","forms":["without good cause"]},{"w":"justify","pos":"v.","cn":"证明……有正当理由；此处用被动语态表示雇主必须证明解雇合理。","sec":"text4","sec_label":"Text 4","ctx":"Instead, dismissals must be justified.","note":"证明……有正当理由；此处用被动语态表示雇主必须证明解雇合理。","forms":["justify"]},{"w":"show cause","pos":"phr.","cn":"说明正当理由、举证说明原因。","sec":"text4","sec_label":"Text 4","ctx":"Employers must both show cause and act in a procedurally fair way.","note":"说明正当理由、举证说明原因。","forms":["show cause"]},{"w":"procedurally fair","pos":"phr.","cn":"程序上公平的、符合正当程序的。","sec":"text4","sec_label":"Text 4","ctx":"Employers must both show cause and act in a procedurally fair way.","note":"程序上公平的、符合正当程序的。","forms":["procedurally fair"]},{"w":"guard","pos":"词","cn":"常见义为“守卫”；guard A from B 指“保护 A 免受 B 伤害”。","sec":"text4","sec_label":"Text 4","ctx":"Personal grievance procedures were designed to guard the jobs of ordinary workers from \"unjustified dismissals\".","note":"常见义为“守卫”；guard A from B 指“保护 A 免受 B 伤害”。","forms":["guard"]},{"w":"unjustified dismissal","pos":"phr.","cn":"无正当理由的解雇、不当解雇。","sec":"text4","sec_label":"Text 4","ctx":"Personal grievance procedures were designed to guard the jobs of ordinary workers from \"unjustified dismissals\".","note":"无正当理由的解雇、不当解雇。","forms":["unjustified dismissal"]},{"w":"premise","pos":"v.","cn":"前提、作为制度或论证出发点的假设。","sec":"text4","sec_label":"Text 4","ctx":"The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management.","note":"前提、作为制度或论证出发点的假设。","forms":["premise"]},{"w":"safeguard","pos":"词","cn":"保障措施、保护机制。","sec":"text4","sec_label":"Text 4","ctx":"The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management.","note":"保障措施、保护机制。","forms":["safeguard"]},{"w":"arbitrary","pos":"adj.","cn":"任意的、缺乏合理依据或约束的。","sec":"text4","sec_label":"Text 4","ctx":"The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management.","note":"任意的、缺乏合理依据或约束的。","forms":["arbitrary"]},{"w":"contractual notice","pos":"phr.","cn":"合同约定的解雇通知，即依合同提前通知员工终止雇佣关系。","sec":"text4","sec_label":"Text 4","ctx":"Long gone are the days when a boss could simply give an employee contractual notice.","note":"合同约定的解雇通知，即依合同提前通知员工终止雇佣关系。","forms":["contractual notice"]},{"w":"attest","pos":"词","cn":"证实、证明某事属实。","sec":"text4","sec_label":"Text 4","ctx":"As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and o","note":"证实、证明某事属实。","forms":["attest"]},{"w":"handbrake","pos":"词","cn":"本义为“手刹”；此处比喻妨碍发展或进步的“阻力、拖累”。","sec":"text4","sec_label":"Text 4","ctx":"As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and o","note":"本义为“手刹”；此处比喻妨碍发展或进步的“阻力、拖累”。","forms":["handbrake"]},{"w":"may very well","pos":"phr.","cn":"很可能，语气比单纯的 may 更肯定。","sec":"text4","sec_label":"Text 4","ctx":"The difference between C-grade and A-grade managers may very well be the difference between business success or failure.","note":"很可能，语气比单纯的 may 更肯定。","forms":["may very well"]},{"w":"mediocrity","pos":"n.","cn":"平庸、能力或表现普通而不出色。","sec":"text4","sec_label":"Text 4","ctx":"Yet mediocrity is no longer enough to justify a dismissal.","note":"平庸、能力或表现普通而不出色。","forms":["mediocrity"]},{"w":"justify a dismissal","pos":"phr.","cn":"构成解雇的正当理由。","sec":"text4","sec_label":"Text 4","ctx":"Yet mediocrity is no longer enough to justify a dismissal.","note":"构成解雇的正当理由。","forms":["justify a dismissal"]},{"w":"paradoxically","pos":"adv.","cn":"自相矛盾地、看似矛盾却可能真实地。","sec":"text4","sec_label":"Text 4","ctx":"Consequently—and paradoxically—laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.","note":"自相矛盾地、看似矛盾却可能真实地。","forms":["paradoxically"]},{"w":"place sth. at risk","pos":"phr.","cn":"使某事物面临风险。","sec":"text4","sec_label":"Text 4","ctx":"Consequently—and paradoxically—laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.","note":"使某事物面临风险。","forms":["place sth. at risk"]},{"w":"to the extent","pos":"phr.","cn":"在……的程度上；结合语境可译为“只要、就……而言”。","sec":"text4","sec_label":"Text 4","ctx":"If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint ","note":"在……的程度上；结合语境可译为“只要、就……而言”。","forms":["to the extent"]},{"w":"act as a constraint on","pos":"phr.","cn":"构成对……的制约。","sec":"text4","sec_label":"Text 4","ctx":"If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint ","note":"构成对……的制约。","forms":["act as a constraint on"]},{"w":"single out A as B","pos":"phr.","cn":"特别指出或选出 A，认定其为 B。","sec":"text4","sec_label":"Text 4","ctx":"Indeed, in \"An International Perspective on New Zealand's Productivity Paradox\" (2014), the Productivity Commission singled out the low quality of managerial capabilities","note":"特别指出或选出 A，认定其为 B。","forms":["single out A as B"]},{"w":"record","pos":"词","cn":"常见义为“记录”；此处指一段时期内表现出来的“业绩、表现”。","sec":"text4","sec_label":"Text 4","ctx":"Indeed, in \"An International Perspective on New Zealand's Productivity Paradox\" (2014), the Productivity Commission singled out the low quality of managerial capabilities","note":"常见义为“记录”；此处指一段时期内表现出来的“业绩、表现”。","forms":["record"]},{"w":"be immune from","pos":"phr.","cn":"不受……影响、免受……伤害。","sec":"text4","sec_label":"Text 4","ctx":"Nor are highly paid managers themselves immune from the harm caused by the ERA's unjustified dismissal procedures.","note":"不受……影响、免受……伤害。","forms":["be immune from"]},{"w":"marginal","pos":"adj.","cn":"常见义为“边缘的、微小的”；此处指竞争力较弱、处在能否被聘用边界上的求职者。","sec":"text4","sec_label":"Text 4","ctx":"This makes it harder for the marginal manager to gain employment.","note":"常见义为“边缘的、微小的”；此处指竞争力较弱、处在能否被聘用边界上的求职者。","forms":["marginal"]},{"w":"carry the burden of","pos":"phr.","cn":"承担……的负担、风险或成本。","sec":"text4","sec_label":"Text 4","ctx":"And firms pay staff less because firms carry the burden of the employment arrangement going wrong.","note":"承担……的负担、风险或成本。","forms":["carry the burden of"]},{"w":"stringent","pos":"词","cn":"严格的、限制严厉的。","sec":"text4","sec_label":"Text 4","ctx":"Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.","note":"严格的、限制严厉的。","forms":["stringent"]},{"w":"adversely affect","pos":"phr.","cn":"对……产生不利影响。","sec":"text4","sec_label":"Text 4","ctx":"Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.","note":"对……产生不利影响。","forms":["adversely affect"]},{"w":"hamper","pos":"词","cn":"妨碍、阻碍。","sec":"text4","sec_label":"Text 4","ctx":"Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.","note":"妨碍、阻碍。","forms":["hamper"]},{"w":"overall well-being","pos":"phr.","cn":"整体福祉、总体生活安康状况。","sec":"text4","sec_label":"Text 4","ctx":"Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-being.","note":"整体福祉、总体生活安康状况。","forms":["overall well-being"]},{"w":"across the Tasman Sea","pos":"phr.","cn":"塔斯曼海位于澳大利亚与新西兰之间，此处用来引出澳大利亚的对比做法。","sec":"text4","sec_label":"Text 4","ctx":"Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified \"high-income threshold\" from the protection","note":"塔斯曼海位于澳大利亚与新西兰之间，此处用来引出澳大利亚的对比做法。","forms":["across the Tasman Sea"]},{"w":"threshold","pos":"词","cn":"门槛、触发某项规则的临界值。","sec":"text4","sec_label":"Text 4","ctx":"Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified \"high-income threshold\" from the protection","note":"门槛、触发某项规则的临界值。","forms":["threshold"]},{"w":"exclude A from B","pos":"phr.","cn":"将 A 排除在 B 之外。","sec":"text4","sec_label":"Text 4","ctx":"Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified \"high-income threshold\" from the protection","note":"将 A 排除在 B 之外。","forms":["exclude A from B"]},{"w":"private members' Bill","pos":"phr.","cn":"由非政府部长身份的议员提出的议员私人法案。","sec":"text4","sec_label":"Text 4","ctx":"In New Zealand, a 2016 private members' Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime.","note":"由非政府部长身份的议员提出的议员私人法案。","forms":["private members' Bill"]},{"w":"contract out of","pos":"phr.","cn":"通过合同约定退出或不受某项制度约束。","sec":"text4","sec_label":"Text 4","ctx":"In New Zealand, a 2016 private members' Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime.","note":"通过合同约定退出或不受某项制度约束。","forms":["contract out of"]},{"w":"regime","pos":"词","cn":"常见义可为“政权”；此处指一套“制度、规则体系”。","sec":"text4","sec_label":"Text 4","ctx":"In New Zealand, a 2016 private members' Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime.","note":"常见义可为“政权”；此处指一套“制度、规则体系”。","forms":["regime"]},{"w":"unwieldy","pos":"词","cn":"笨重难用的；此处指机制复杂、难以操作。","sec":"text4","sec_label":"Text 4","ctx":"However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.","note":"笨重难用的；此处指机制复杂、难以操作。","forms":["unwieldy"]},{"w":"vote down","pos":"phr.","cn":"投票否决。","sec":"text4","sec_label":"Text 4","ctx":"However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.","note":"投票否决。","forms":["vote down"]}],"sentences":[{"id":"2022-T1-P1-S07","sec":"text1","sec_label":"Text 1","level":3,"en":"All of which creates huge headaches for institutions, such as museums, trying to preserve culturally important objects.","core":"All of which creates huge headaches for institutions.","structure":"All of which 概括前文塑料开裂、渗出添加剂和化为浆状物等现象；such as museums 举例说明 institutions；trying to preserve... 是现在分词短语，修饰这些机构。","key":"headache：常见义为“头痛”；此处比喻“棘手的问题、麻烦事”。","zh":"所有这些变化都给博物馆等试图保存具有文化价值物品的机构带来了巨大的难题。","tip":"which 指前述全部劣化现象，不是只指最近一句的 sludge。"},{"id":"2022-T1-P2-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Certain artifacts are especially vulnerable because some pioneers in plastic art didn't always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands (RCE).","core":"Certain artifacts are especially vulnerable, says Thea van Oosten.","structure":"because... 说明这些艺术品脆弱的原因；a polymer chemist 是人物同位语；who...worked for decades... 是修饰该化学家的定语从句，其中 until retiring... 是插入的时间状语。","key":"vulnerable：常见义为“易受伤的”；此处指材料“容易受损、容易劣化”。；ingredient：常用于指“烹饪原料”；此处指制作塑料艺术品所用的“配料、组分”。","zh":"聚合物化学家西娅·范·奥斯滕说，某些艺术品格外脆弱，是因为一些塑料艺术的先驱当年并不总是知道怎样正确调配原料；她在几年前退休之前，曾在荷兰文化遗产局（RCE）工作数十年。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T1-P3-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Those pieces included small beds of roses and other items as well as a few dozen \"nature carpets\"—large rectangles decorated with foam pumpkins, cabbages, and watermelons.","core":"Those pieces included A as well as B.","structure":"as well as 连接两类作品；破折号后的 large rectangles... 是对 nature carpets 的同位解释；decorated with... 是过去分词短语，说明地毯上的装饰。","key":"bed：常见义为“床”；a bed of roses 在此指种有玫瑰的“花坛、花圃”，不是习语“安逸的处境”。","zh":"这些作品包括小片玫瑰花圃等物件，也包括几十张“自然地毯”——装饰着泡沫塑料南瓜、卷心菜和西瓜的大幅长方形作品。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T1-P3-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"He wanted viewers to walk around on the carpets—which meant they had to be durable.","core":"He wanted viewers to walk around on the carpets.","structure":"破折号后的 which 指代前面“让参观者在地毯上走动”这件事；they 指 the carpets。","key":"见下方词汇笔记","zh":"他希望参观者能在这些地毯上走动——这意味着它们必须经久耐用。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T1-P4-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Museums locked some of them away in the dark.","core":"Museums locked some of them away.","structure":"them 指上一句中正在开裂、碎裂的吉拉尔迪作品；in the dark 说明保存环境。","key":"lock sth. away：把某物锁藏起来，使其不再被使用或展示。","zh":"博物馆把其中一些作品锁进了不见光的地方。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T1-P5-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"She is proud that several sculptures have even gone on display again, albeit sometimes beneath protective cases.","core":"She is proud that several sculptures have gone on display again.","structure":"that... 是说明自豪内容的从句；albeit... 补充让步信息，指出重新展出仍附带保护条件。","key":"go on display：被展出、公开陈列。；albeit：尽管、虽然，相当于 although，但其后常直接接短语而非完整从句。","zh":"令她自豪的是，有几件雕塑甚至已经重新展出，尽管有时需要放在保护罩下。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T1-P6-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"Despite success stories like van Oosten's, preservation of plastics will likely get harder.","core":"Preservation of plastics will likely get harder.","structure":"Despite... 引出让步背景；van Oosten's 省略了 success story。","key":"story：常见义为“故事”；success story 指“成功案例”。","zh":"尽管有范·奥斯滕这样的成功案例，塑料制品的保存工作很可能仍会变得更加艰难。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T1-P6-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Worse, biodegradable plastics, designed to disintegrate, are increasingly common.","core":"Biodegradable plastics are increasingly common.","structure":"designed to disintegrate 是过去分词短语，补充说明这类塑料的设计目的。","key":"biodegradable：可生物降解的。；disintegrate：瓦解、分解成碎片。","zh":"更糟的是，本来就被设计成会分解的可生物降解塑料正变得越来越常见。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T1-P7-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Joana Lia Ferreira, an assistant professor of conservation and restoration at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history—Stone Age, Iron Age, and so on—after examining artifacts in museums.","core":"Joana Lia Ferreira notes that archaeologists defined the great material ages.","structure":"人名后的长同位语交代其职务；that... 是 notes 的宾语从句；两个短横线之间列举 material ages；after examining... 说明时代划分所依据的材料。","key":"age：常见义为“年龄”；此处指具有特定历史文化特征的“时代”。","zh":"诺瓦科技学院文物保护与修复专业助理教授若阿娜·莉娅·费雷拉指出，考古学家正是在研究了博物馆藏品之后，才首次划分出人类历史上以材料命名的各大时代，例如石器时代、铁器时代等。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T1-P7-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"We now live in an age of plastic, she says, \"and what we decide to collect today, what we decide to preserve...will have a strong impact on how in the future we'll be seen.\"","core":"What we decide to collect today and what we decide to preserve will have a strong impact.","structure":"两个并列的 what 从句共同作主语；on how...we'll be seen 说明影响的对象，其中是被动语态。","key":"see：常见义为“看见”；此处是“看待、认识、评价”。；break down easily：容易分解、降解。；create huge headaches for：给……造成巨大的难题。；be vulnerable to light damage：容易受到光照损害。","zh":"她说，我们如今生活在一个塑料时代，“而我们今天决定收藏什么、保存什么……将深刻影响未来的人如何看待我们”。","tip":"we 指当代人；隐含的观察者是未来的人。句子强调今日保存塑料藏品对后世理解当代社会的历史意义，而非对今日文化生活的影响。"},{"id":"2022-T2-P1-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third stage of their educational journey.","core":"It may be worth considering A and B.","structure":"As... 是时间状语从句；how...has changed 与 what...need to consider 是两个并列的宾语从句；第二个从句中的 as... 表示“当他们开始……时”。","key":"crop：常见义为“庄稼、收成”；此处指同一时期出现的“一批”学生。；pen：常见义为“钢笔”；此处作动词，意为“书写、填写”。；point：常见义为“点、分数”；此处指做某事的“意义、用处”。；weigh up one's options：权衡某人可以作出的各种选择。","zh":"当最新一批学生填写本科申请表、权衡各种选择时，或许值得认真思考：大学学位的意义、目的与价值究竟发生了怎样的变化，以及 Z 世代在开启教育历程的第三阶段时需要考虑什么。","tip":"it 是形式主语，真正值得考虑的是后面两个疑问从句；作者要求重新审视的是学位本身的意义和必要性，而不只是如何选学校。"},{"id":"2022-T2-P2-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Millennials were told that if you did well in school, got a decent degree, you would be set up for life.","core":"Millennials were told that...","structure":"that 引导所告知的内容；其中 if you did well...and got... 是条件从句，you would be set up for life 是结果。","key":"decent：常见义为“体面的”；此处指质量或水平“相当不错的、过得去的”。；be set up for life：不是“为生活作好一般准备”，而是指经济或事业基础已经稳固，因而“一生有保障”。","zh":"千禧一代曾被告知，只要在学校表现良好、取得一个不错的学位，一辈子的生活就有了保障。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T2-P2-S05","sec":"text2","sec_label":"Text 2","level":3,"en":"Today, 28 per cent of graduates in the UK are in non-graduate roles, a percentage which is double the average among the OECD countries.","core":"28 per cent of graduates in the UK are in non-graduate roles.","structure":"逗号后的 a percentage 是对 28 per cent 的同位说明；which... 是定语从句，补充该比例与 OECD 平均水平的比较。","key":"non-graduate role：不是“非毕业生的身份”，而是“不要求大学学历的岗位”。","zh":"如今，英国有 28% 的大学毕业生从事并不要求大学学历的工作，这一比例是经济合作与发展组织成员国平均水平的两倍。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T2-P3-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.","core":"This is not to say A, but rather (to) stress B.","structure":"not...but rather... 先排除极端理解，再说明真正观点；stress 后接三个并列的 that 从句：学位并非适合所有人、升大学并非必然、另有其他选择。","key":"point：there is no point in doing sth. 表示“做某事没有意义”。；switch：此处作名词，指从中学到大学的“转变、转换”。；lecture hall：大学讲堂；这里借指大学教育。","zh":"这并不是说取得学位毫无意义，而是要强调：学位并不适合每一个人；从中学课堂转入大学讲堂并非必然选择；此外还有其他道路可走。","tip":"作者不是否定大学教育的全部价值，而是反对把上大学视为人人必须遵循的默认路径。"},{"id":"2022-T2-P4-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be still set in the degree mindset.","core":"There are signs that this is already happening.","structure":"that... 是解释 signs 内容的同位语从句；with Generation Z seeking... 补充伴随情况；even if... 引出让步背景。","key":"predecessor：前任、前辈；此处指年龄较长、先经历大学教育与就业的千禧一代。；be set in：固定于、固守于某种想法或做法。","zh":"令人欣慰的是，已经有迹象表明这种转变正在发生：Z 世代正努力从千禧一代前辈的经历中吸取教训，尽管父母和教师往往仍受“唯学位”思维束缚。","tip":"this 回指上一段所说“不把大学视为必然选择、考虑其他道路”的转变。"},{"id":"2022-T2-P4-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Many too are seeing the advantages of scrapping a degree requirement for certain roles.","core":"Many are seeing the advantages.","structure":"Many 承接上一句，指许多雇主；of scrapping... 说明他们认识到的是何种好处。","key":"scrap：常见义为“碎片、废料”；此处作动词，意为“取消、废除”。","zh":"许多雇主也开始认识到，取消某些岗位的学历要求是有好处的。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T2-P5-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"For those for whom a degree is the desired route, consider that this may well be the first of many.","core":"Consider that this may be the first of many.","structure":"For those... 指建议适用的人群；for whom a degree is the desired route 是定语从句，修饰 those；this 指即将攻读的第一个学位；many 后省略 degrees。","key":"见下方词汇笔记","zh":"对于那些确实希望走学位教育这条路的人，应当想到：这个学位很可能只是以后多个学位中的第一个。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T2-P6-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"It is unlikely that Generation Z will be done with education at 18 or 21; they will need to be constantly upskilling throughout their career to stay employable.","core":"It is unlikely that Generation Z will be done with education; they will need to be upskilling.","structure":"It 是形式主语，that... 是真正主语；分号连接“教育不会早早结束”与“职业生涯持续学习”两个紧密相关的判断；to stay employable 表目的。","key":"be done with：结束、不再继续做某事。；upskill：提升技能、学习更高级或更新的职业技能。；employable：具备受雇条件的、有就业竞争力的。","zh":"Z 世代不太可能在 18 岁或 21 岁时就结束教育；为了始终具备就业竞争力，他们需要在整个职业生涯中不断提升技能。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T2-P6-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"It has been estimated that this generation, due to the pressures of technology, the wish for personal fulfilment and desire for diversity, will work for 17 different employers over the course of their working life and have five different careers.","core":"It has been estimated that this generation will work for 17 different employers and have five different careers.","structure":"It 是形式主语；that... 是真正主语；三个并列名词短语置于主语之后作原因状语；work for... 与 have... 是并列谓语。","key":"personal fulfilment：个人价值的实现、个人成就感。；over the course of：在……的整个过程中。","zh":"据估计，由于技术发展带来的压力、实现个人价值的愿望以及追求多样性的需求，这一代人在整个职业生涯中将为 17 个不同的雇主工作，并经历 5 种不同的职业。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T2-P6-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Education, and not just knowledge gained on campus, will be a core part of Generation Z's career trajectory.","core":"Education will be a core part of Generation Z's career trajectory.","structure":"and not just knowledge gained on campus 是插入成分，强调教育不限于大学校园内一次性获得的知识。","key":"trajectory：本义为物体运动的“轨迹”；此处指职业生涯的“发展路径、走向”。","zh":"教育，而且不只是校园里获得的知识，将成为 Z 世代职业发展轨迹的核心组成部分。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T2-P7-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Their sons or daughters would never say such a thing; it's as if they already know that their degree won't define them in the same way.","core":"Their sons or daughters would never say such a thing; it's as if they know...","structure":"as if 引导方式从句；其中 that... 作 know 的宾语。","key":"define：常见义为“下定义”；此处指“界定一个人的身份和人生”。；weigh up one's options：权衡各种选择。；be set up for life：一生有保障。；be found wanting：被证明有缺陷、未达到预期。","zh":"他们的子女绝不会这样说；仿佛年轻一代已经明白，学位不会再以同样的方式定义自己的身份。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"These were some of the words that Nature readers used to describe their experience of art-science collaborations in a series of articles on partnerships between artists and researchers.","core":"These were some of the words.","structure":"that Nature readers used... 是定语从句，修饰 words；on partnerships... 修饰 a series of articles，说明系列文章的主题。","key":"见下方词汇笔记","zh":"在一组探讨艺术家与研究人员合作关系的文章中，《自然》杂志的读者用上述词语来形容他们参与艺术与科学合作的体验。","tip":"their experience 指读者亲身参与跨界合作的体验，不是阅读这些文章的体验。"},{"id":"2022-T3-P1-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"Nearly 40% of the roughly 350 people who responded to an accompanying poll said they had collaborated with artists; and almost all said they would consider doing so in future.","core":"Nearly 40% said A; and almost all said B.","structure":"who responded... 是定语从句，修饰 people；两个 said 后分别接省略了 that 的宾语从句。","key":"accompanying：此处指与系列文章一同发布、作为配套内容的。；do so：代替前面的 collaborate with artists，意为“与艺术家合作”。","zh":"在参加配套调查的大约 350 人中，近 40% 表示自己曾与艺术家合作；而且几乎所有人都表示，将来会考虑开展这类合作。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T3-P2-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"\"Artists help scientists reach a broader audience and make emotional connections that enhance learning,\" one respondent said.","core":"Artists help scientists reach...and make...connections.","structure":"help + 宾语 + 动词原形；reach 与 make 是并列补语；that enhance learning 是修饰 emotional connections 的定语从句。","key":"见下方词汇笔记","zh":"一名调查参与者说：“艺术家帮助科学家触及更广泛的受众，并建立能够促进理解与学习的情感联系。”","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T3-P3-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"One example of how artists and scientists have together rocked the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi's The Four Seasons.","core":"One example came last month.","structure":"of how... 说明这是哪一方面的例子；when... 是时间状语从句，交代具体事件。","key":"rock the scene：此处不是字面上的“摇动场景”，而是指“震撼现场、带来轰动”。；reworked：重新加工或改编的。","zh":"艺术家与科学家携手带来轰动效果的一个例子出现在上个月：悉尼交响乐团演奏了安东尼奥·维瓦尔第《四季》的改编版。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T3-P3-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"They reimagined the 300-year-old score by injecting the latest climate prediction data for each season—provided by Monash University's Climate Change Communication Research Hub.","core":"They reimagined the score.","structure":"by injecting... 说明改编方式；provided by... 是过去分词短语，修饰 climate prediction data，不是修饰 each season。","key":"score：常见义为“分数”；此处作名词，指音乐作品的“总谱、乐谱”。；inject：常见义为“注射”；此处指把气候数据“注入、融入”艺术作品。；reimagine：以新的方式重新构想、重新诠释。","zh":"他们把莫纳什大学气候变化传播研究中心提供的各季最新气候预测数据融入这部有 300 年历史的乐谱，从而对其作出全新诠释。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T3-P4-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Fewer artists than scientists responded to the Nature poll, however, several respondents noted that artists do not simply assist scientists with their communication requirements.","core":"Fewer artists responded; several respondents noted that...","structure":"fewer...than... 比较艺术家与科学家的参与人数；however 标记转折；that... 是 noted 的宾语从句。","key":"requirement：此处指科学家在传播科研内容方面的“需要、需求”。","zh":"不过，参与《自然》杂志调查的艺术家少于科学家；几名调查参与者指出，艺术家并不只是帮助科学家满足科研传播需求的助手。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T3-P4-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"Nor should their work be considered only as an object of study.","core":"Their work should not be considered only as an object of study.","structure":"否定副词 Nor 置于句首引起部分倒装，助动词 should 提到主语之前；their 指艺术家。","key":"见下方词汇笔记","zh":"艺术家的作品也不应仅仅被视为研究对象。","tip":"本句进一步反对把艺术及艺术家降为科学研究的工具或对象，核心是艺术方的地位不能被低估。"},{"id":"2022-T3-P4-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other's work.","core":"The alliances are most valuable when scientists and artists do A, B and C.","structure":"when 从句中，have、are able to design、can critique 是三个并列谓语；it 指 a project。","key":"stake：常见义为“木桩、股份”；have a shared stake in 指“共同利益攸关、共同承担项目成败”。；critique：对作品作出深入、专业的评议，并不只是一般的“批评”。","zh":"当科学家和艺术家共同关心项目的成败，能够一起设计项目并相互评议对方的工作时，这种合作关系才最有价值。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T3-P5-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"Light was a something that both artists and scientists had an interest in, and therefore could form the basis of collaboration.","core":"Light was something and therefore could form the basis of collaboration.","structure":"that both artists and scientists had an interest in 是定语从句，修饰 something；therefore 引出共同兴趣带来的结果。","key":"见下方词汇笔记","zh":"光是艺术家与科学家都感兴趣的事物，因此能够成为双方合作的基础。","tip":"原卷印作 a something，语义上仍应把 something 理解为“某种双方都感兴趣的事物”。"},{"id":"2022-T3-P5-S04","sec":"text3","sec_label":"Text 3","level":3,"en":"As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.","core":"The centre was looking to a time.","structure":"As... 是时间与趋势状语从句；when... 是定语从句，修饰 a time；and vice versa 将前述身份关系反向成立。","key":"look to：此处指“展望、期待”未来，而不是简单地“看向”。；vice versa：反之亦然，即艺术家、作家和诗人也可以成为研究人员。","zh":"随着科学技术不断发展并细分出更多学科，这一中心同时也在展望一个时代：顶尖研究人员也可以成为艺术家、作家和诗人，反之亦然。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T3-P6-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Nature's poll findings suggest that this trend is as strong as ever, but, to make a collaboration work, both sides need to invest time, and embrace surprise and challenge.","core":"The findings suggest A, but both sides need B.","structure":"that... 是 suggest 的宾语从句；to make... 是目的状语；invest 与 embrace 是并列谓语。","key":"as strong as ever：一如既往地强劲。；make sth. work：使某事顺利运转、取得成效。；embrace surprise and challenge：主动接受意外情况和挑战。","zh":"《自然》杂志的调查结果表明，这一合作趋势依旧十分强劲；但是，要让合作真正奏效，双方都需要投入时间，并欣然接受意外与挑战。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T3-P6-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other.","core":"The reach needs to go beyond...and participants must not fall into...","structure":"go beyond 与 must not fall into 由 and 连接，提出两项合作原则。","key":"reach：常见义为“到达”；此处作名词，指合作所能发挥作用的“范围、影响范围”。；tie-up：合作关系、联合行动。；stereotype：把某人简单地套入刻板印象。","zh":"艺术与科学合作的作用范围需要超越科研传播这一必要目的，参与者也绝不能落入彼此刻板化的陷阱。","tip":"作者并未否认科研传播的必要性，而是说合作不能止步于此，还应共同研究、创作与相互评议。"},{"id":"2022-T4-P2-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"The premise was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management.","core":"The premise was that the common law lacked safeguards.","structure":"that... 是表语从句，解释制度设计的前提；for workers 指保障对象；against arbitrary conduct... 指所防范的风险。","key":"premise：前提、作为制度或论证出发点的假设。；safeguard：保障措施、保护机制。；arbitrary：任意的、缺乏合理依据或约束的。","zh":"这一制度所依据的前提是，合同普通法不足以保护劳动者免受管理层任意行事的伤害。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T4-P2-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Long gone are the days when a boss could simply give an employee contractual notice.","core":"The days are long gone.","structure":"表语 Long gone 置于句首引起完全倒装；when... 是定语从句，修饰 the days。","key":"contractual notice：合同约定的解雇通知，即依合同提前通知员工终止雇佣关系。","zh":"老板只需按合同通知一声就能让员工走人的时代早已一去不复返。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T4-P3-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"But these provisions create difficulties for businesses when applied to highly paid managers and executives.","core":"These provisions create difficulties for businesses.","structure":"when applied... 是省略了 they are 的时间或条件状语从句，they 指这些条款。","key":"见下方词汇笔记","zh":"但是，当这些条款适用于高薪经理和企业高管时，会给企业造成困难。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T4-P3-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"As countless boards and business owners will attest, constraining firms from firing poorly performing, high-earning managers is a handbrake on boosting productivity and overall performance.","core":"Constraining firms ... is a handbrake on boosting productivity and performance.","structure":"As...will attest 是方式状语从句；动名词短语 constraining firms... 作主语；from firing... 说明限制企业做什么。","key":"attest：证实、证明某事属实。；handbrake：本义为“手刹”；此处比喻妨碍发展或进步的“阻力、拖累”。","zh":"正如无数董事会和企业主都会证实的那样，限制企业解雇表现不佳的高薪经理，会拖累生产率和整体业绩的提升。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T4-P3-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"Between preserving the jobs of ordinary workers or losing them.","core":"本句是承接上一句的省略结构，完整意思为 The difference may be the difference between preserving...and losing...。","structure":"见原句","key":"见下方词汇笔记","zh":"也可能就是保住普通劳动者的工作与让他们失业之间的差别。","tip":"them 指 the jobs of ordinary workers，也可从结果上理解为普通劳动者失去工作；其因果链是管理低效导致企业失败，最终危及普通岗位。"},{"id":"2022-T4-P4-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Consequently—and paradoxically—laws introduced to protect the jobs of ordinary workers may be placing those jobs at risk.","core":"Laws may be placing those jobs at risk.","structure":"introduced to protect... 是过去分词短语，修饰 laws；those jobs 回指 the jobs of ordinary workers。","key":"paradoxically：自相矛盾地、看似矛盾却可能真实地。；place sth. at risk：使某事物面临风险。","zh":"因此，颇具悖论意味的是，为保护普通劳动者岗位而制定的法律，可能反而正在把这些岗位置于危险之中。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T4-P5-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a constraint on firm productivity and therefore on workers' wages.","core":"Those laws act as a constraint on firm productivity and workers' wages.","structure":"If not placing jobs at risk 表示退一步假设“即便没有危及岗位”；to the extent... 说明限制产生的条件与程度；therefore 串联生产率与工资的因果关系。","key":"to the extent：在……的程度上；结合语境可译为“只要、就……而言”。；act as a constraint on：构成对……的制约。","zh":"即便这些法律尚未直接危及岗位，只要就业保护法限制企业主解雇绩效不佳的经理，它们就会制约企业生产率，进而压低劳动者工资。","tip":"and therefore on workers' wages 承接的是 a constraint on，即法律也间接制约工资，而不是保护工资。"},{"id":"2022-T4-P5-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Indeed, in \"An International Perspective on New Zealand's Productivity Paradox\" (2014), the Productivity Commission singled out the low quality of managerial capabilities as a cause of the country's poor productivity growth record.","core":"The Productivity Commission singled out the low quality ... as a cause.","structure":"书名和年份所在介词短语交代出处；of the country's poor productivity growth record 修饰 a cause。","key":"single out A as B：特别指出或选出 A，认定其为 B。；record：常见义为“记录”；此处指一段时期内表现出来的“业绩、表现”。","zh":"事实上，生产率委员会在 2014 年的《新西兰生产率悖论的国际视角》中，特别指出管理能力低下是该国生产率增长不佳的一个原因。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T4-P6-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Nor are highly paid managers themselves immune from the harm caused by the ERA's unjustified dismissal procedures.","core":"Highly paid managers are not immune from the harm.","structure":"否定词 Nor 置于句首引起部分倒装；caused by... 是过去分词短语，修饰 harm。","key":"be immune from：不受……影响、免受……伤害。","zh":"高薪经理自身也无法免受 ERA 不当解雇申诉程序所造成的伤害。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T4-P6-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Because employment protection laws make it costlier to fire an employee, employers are more cautious about hiring new staff.","core":"Employers are more cautious about hiring new staff.","structure":"Because... 说明招聘趋于谨慎的原因；make it costlier to fire... 中 it 是形式宾语，to fire... 是真正宾语。","key":"见下方词汇笔记","zh":"由于就业保护法提高了解雇员工的成本，雇主在招聘新员工时会更加谨慎。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T4-P6-S04","sec":"text4","sec_label":"Text 4","level":3,"en":"And firms pay staff less because firms carry the burden of the employment arrangement going wrong.","core":"Firms pay staff less because firms carry the burden.","structure":"of the employment arrangement going wrong 中，the employment arrangement 是动名词 going wrong 的逻辑主语。","key":"carry the burden of：承担……的负担、风险或成本。；go wrong：出问题、未按预期发展。","zh":"而且，由于企业必须承担雇佣安排出现问题的风险与成本，它们会给员工支付更低的薪酬。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T4-P8-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified \"high-income threshold\" from the protection of its unfair dismissal laws.","core":"Australia deals with the paradox by excluding employees from the protection.","structure":"earning above... 是现在分词短语，修饰 employees；by excluding... 说明解决方式。","key":"across the Tasman Sea：塔斯曼海位于澳大利亚与新西兰之间，此处用来引出澳大利亚的对比做法。；threshold：门槛、触发某项规则的临界值。；exclude A from B：将 A 排除在 B 之外。","zh":"在塔斯曼海另一边，澳大利亚的做法是把收入超过规定“高收入门槛”的员工排除在不公平解雇法的保护范围之外，以此应对不当解雇保护造成的悖论。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2022-T4-P8-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"However, the mechanisms proposed were unwieldy and the Bill was voted down following the change in government later that year.","core":"The mechanisms were unwieldy and the Bill was voted down.","structure":"proposed 是过去分词，修饰 mechanisms；following... 表示“在……之后”。","key":"unwieldy：笨重难用的；此处指机制复杂、难以操作。；vote down：投票否决。；without good cause：没有正当理由。；act in a procedurally fair way：依照公平程序行事。","zh":"然而，法案提出的实施机制过于繁琐笨重；当年晚些时候政府更迭后，该法案在表决中被否决。","tip":"难以实施并被否决的是新西兰 2016 年法案，不是澳大利亚已经采用的“高收入门槛”；不能据此选择“澳大利亚门槛难以实施”。"}]};</script>

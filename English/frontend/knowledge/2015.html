n - is similar to, say, go","note":"仔细翻查、搜查。","forms":["go through"]},{"w":"the Fourth Amendment","pos":"phr.","cn":"美国宪法第四修正案，核心是防止不合理搜查和扣押。","sec":"text2","sec_label":"Text 2","ctx":"The court has ruled that police don't violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant.","note":"美国宪法第四修正案，核心是防止不合理搜查和扣押。","forms":["the Fourth Amendment"]},{"w":"arrestee","pos":"词","cn":"被捕者；与实施逮捕的 arrester 不同。","sec":"text2","sec_label":"Text 2","ctx":"The court has ruled that police don't violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant.","note":"被捕者；与实施逮捕的 arrester 不同。","forms":["arrestee"]},{"w":"be more like","pos":"phr.","cn":"更类似于……，用于纠正前面的类比。","sec":"text2","sec_label":"Text 2","ctx":"But exploring one's smartphone is more like entering his or her home.","note":"更类似于……，用于纠正前面的类比。","forms":["be more like"]},{"w":"comprehensive records","pos":"phr.","cn":"全面、完整的记录。","sec":"text2","sec_label":"Text 2","ctx":"A smartphone may contain an arrestee's reading history, financial history, medical history and comprehensive records of recent correspondence.","note":"全面、完整的记录。","forms":["comprehensive records"]},{"w":"correspondence","pos":"n.","cn":"此处指邮件、短信等往来通信，为不可数名词。","sec":"text2","sec_label":"Text 2","ctx":"A smartphone may contain an arrestee's reading history, financial history, medical history and comprehensive records of recent correspondence.","note":"此处指邮件、短信等往来通信，为不可数名词。","forms":["correspondence"]},{"w":"that","pos":"词","cn":"此处不是指示形容词，而是代词，具体指前文所说的 exploring one's smartphone。","sec":"text2","sec_label":"Text 2","ctx":"The development of \"cloud computing\", meanwhile, has made that exploration so much the easier.","note":"此处不是指示形容词，而是代词，具体指前文所说的 exploring one's smartphone。","forms":["that"]},{"w":"make ... all/so much the + 比较级","pos":"phr.","cn":"使……更加……；the 不表示特指，而是比较级结构的一部分。","sec":"text2","sec_label":"Text 2","ctx":"The development of \"cloud computing\", meanwhile, has made that exploration so much the easier.","note":"使……更加……；the 不表示特指，而是比较级结构的一部分。","forms":["make ... all/so much the + 比较级"]},{"w":"take steps to do","pos":"phr.","cn":"采取措施做某事。","sec":"text2","sec_label":"Text 2","ctx":"Americans should take steps to protect their digital privacy.","note":"采取措施做某事。","forms":["take steps to do"]},{"w":"requirement","pos":"n.","cn":"此处不是外部规定的“要求”，而是正常生活中越来越难以回避的“必要条件”。","sec":"text2","sec_label":"Text 2","ctx":"But keeping sensitive information on these devices is increasingly a requirement of normal life.","note":"此处不是外部规定的“要求”，而是正常生活中越来越难以回避的“必要条件”。","forms":["requirement"]},{"w":"have a right to expect","pos":"phr.","cn":"有权合理期待……。","sec":"text2","sec_label":"Text 2","ctx":"Citizens still have a right to expect private documents to remain private and protected by the Constitution's prohibition on unreasonable searches.","note":"有权合理期待……。","forms":["have a right to expect"]},{"w":"prohibition on","pos":"phr.","cn":"对……的禁止。","sec":"text2","sec_label":"Text 2","ctx":"Citizens still have a right to expect private documents to remain private and protected by the Constitution's prohibition on unreasonable searches.","note":"对……的禁止。","forms":["prohibition on"]},{"w":"as is often the case","pos":"phr.","cn":"情况往往如此，常用于引出普遍存在的现象。原文以 so often 加强频率。","sec":"text2","sec_label":"Text 2","ctx":"As so often is the case, stating that principle doesn't ease the challenge of line-drawing.","note":"情况往往如此，常用于引出普遍存在的现象。原文以 so often 加强频率。","forms":["as is often the case"]},{"w":"line-drawing","pos":"adj.","cn":"划定界线，此处指确定隐私权与执法权的法律边界。","sec":"text2","sec_label":"Text 2","ctx":"As so often is the case, stating that principle doesn't ease the challenge of line-drawing.","note":"划定界线，此处指确定隐私权与执法权的法律边界。","forms":["line-drawing"]},{"w":"overly burdensome","pos":"phr.","cn":"负担过重的、过分麻烦的。","sec":"text2","sec_label":"Text 2","ctx":"In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone ormation in the 21st century with the establishment of automobile use as a virtual nece","note":"理清、解决。","forms":["sort out"]},{"w":"an extra round of","pos":"phr.","cn":"额外增加的一轮……。","sec":"text3","sec_label":"Text 3","ctx":"The journal Science is adding an extra round of statistical checks to its peer-review process, editor-in-chief Marcia McNutt announced today.","note":"额外增加的一轮……。","forms":["an extra round of"]},{"w":"peer-review process","pos":"phr.","cn":"同行评审流程，即由同领域专家评议论文的机制。","sec":"text3","sec_label":"Text 3","ctx":"The journal Science is adding an extra round of statistical checks to its peer-review process, editor-in-chief Marcia McNutt announced today.","note":"同行评审流程，即由同领域专家评议论文的机制。","forms":["peer-review process"]},{"w":"editor-in-chief","pos":"词","cn":"主编。","sec":"text3","sec_label":"Text 3","ctx":"The journal Science is adding an extra round of statistical checks to its peer-review process, editor-in-chief Marcia McNutt announced today.","note":"主编。","forms":["editor-in-chief"]},{"w":"follow","pos":"词","cn":"常见义为“跟随”；此处表示“在……之后发生、沿用……的做法”。","sec":"text3","sec_label":"Text 3","ctx":"The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many pu","note":"常见义为“跟随”；此处表示“在……之后发生、沿用……的做法”。","forms":["follow"]},{"w":"irreproducibility","pos":"n.","cn":"不可重复性，即其他研究者无法用相同方法得到相同结果。","sec":"text3","sec_label":"Text 3","ctx":"The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many pu","note":"不可重复性，即其他研究者无法用相同方法得到相同结果。","forms":["irreproducibility"]},{"w":"published research findings","pos":"phr.","cn":"已发表的研究结果。","sec":"text3","sec_label":"Text 3","ctx":"The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many pu","note":"已发表的研究结果。","fo  agreed to join because he \"found the foresight behind the establishment of the SBoRE to be novel, unique and likely to have a lasting impact.","note":"认为 A 具有 B 的性质。","forms":["find A to be B"]},{"w":"model ... after ...","pos":"phr.","cn":"以……为范本、仿照……，不是“为……制作模型”。","sec":"text3","sec_label":"Text 3","ctx":"This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach a","note":"以……为范本、仿照……，不是“为……制作模型”。","forms":["model ... after ..."]},{"w":"overdue","pos":"词","cn":"常见于“逾期未还”；此处意为“早该发生却迟迟未发生的”。","sec":"text3","sec_label":"Text 3","ctx":"John Ioannidis, a physician who studies research methodology, says that the policy is \"a most welcome step forward\" and \"long overdue\".","note":"常见于“逾期未还”；此处意为“早该发生却迟迟未发生的”。","forms":["overdue"]},{"w":"be weak in","pos":"phr.","cn":"在……方面薄弱。","sec":"text3","sec_label":"Text 3","ctx":"\"Most journals are weak in statistical review, and this damages the quality of what they publish.","note":"在……方面薄弱。","forms":["be weak in"]},{"w":"what they publish","pos":"phr.","cn":"他们所发表的内容；what 同时承担先行内容和宾语从句连接作用。","sec":"text3","sec_label":"Text 3","ctx":"\"Most journals are weak in statistical review, and this damages the quality of what they publish.","note":"他们所发表的内容；what 同时承担先行内容和宾语从句连接作用。","forms":["what they publish"]},{"w":"pay strong attention to","pos":"phr.","cn":"高度重视……。","sec":"text3","sec_label":"Text 3","ctx":"I think that, for the majority of scientific papers nowadays, statistical review is more essential than expert review,\" he says, but he noted that biomedical journals suc","note":"高度重视……。","forms":["pay strong attention to"]},{"w":"statistical review","pos":"phr.","cn":"统计方法审查；expert review 此处指侧重专业内容的同行评审。","sec":"text3","sec_label":"Text 3","ctx":"I think that, for the majority of scientific papers nowadays, statistical review is more essential than expert review,\" he says, but he noted that biomedical journals suc","note":"统计方法审查；expert review 此处指侧重专业内容的同行评审。","forms":["statistical review"]},{"w":"be expected to","pos":"phr.","cn":"此处不只是“被期待”，还带有“按职责理应……”之意。","sec":"text3","sec_label":"Text 3","ctx":"Professional scientists are expected to know how to analyse data, but statistical errors are alarmingly common in published research, according to David Vaux, a cell biol","note":"此处不只是“被期待”，还带有“按职责理应……”之意。","forms":["be expected to"]},{"w":"take a tougher line","pos":"phr.","cn":"采取更强硬、更严格的立场。","sec":"text3","sec_label":"Text 3","ctx":"Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, \"engaging reviewers who are statistically literate and editors","note":"采取更强硬、更严格的立场。","forms":["take a tougher line"]},{"w":"statistically literate","pos":"phr.","cn":"具备统计素养的，能正确理解和运用统计方法的。","sec":"text3","sec_label":"Text 3","ctx":"Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, \"engaging reviewers who are statistically literate and editors","note":"具备统计素养的，能正确理解和运用统计方法的。","forms":["statistically literate"]},{"w":"verify the process","pos":"phr.","cn":"核查、验证审查流程。","sec":"text3","sec_label":"Text 3","ctx":"Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, \"engaging reviewers who are statistically literate and editors","note":"核查、验证审查流程。","forms":["verify the process"]},{"w":"merit","pos":"词","cn":"常见义为“功绩”；此处作不可数名词，意为“可取之处、价值”。","sec":"text3","sec_label":"Text 3","ctx":"Vaux says that Science's idea to pass some papers to statisticians \"has some merit, but a weakness is that it relies on the board of reviewing editors to identify 'the pa","note":"常见义为“功绩”；此处作不可数名词，意为“可取之处、价值”。","forms":["merit"]},{"w":"pass papers to statisticians","pos":"phr.","cn":"把论文转交统计学家审查。","sec":"text3","sec_label":"Text 3","ctx":"Vaux says that Science's idea to pass some papers to statisticians \"has some merit, but a weakness is that it relies on the board of reviewing editors to identify 'the pa","note":"把论文转交统计学家审查。","forms":["pass papers to statisticians"]},{"w":"in the first place","pos":"phr.","cn":"一开始、首先；此处强调筛选环节本身可能出错。","sec":"text3","sec_label":"Text 3","ctx":"Vaux says that Science's idea to pass some papers to statisticians \"has some merit, but a weakness is that it relies on the board of reviewing editors to identify 'the pa","note":"一开始、首先；此处强调筛选环节本身可能出错。","forms":["in the first place"]},{"w":"integrity","pos":"n.","cn":"此处不是物体的“完整性”，而是个人或机构坚守道德原则的“诚信、正直”。","sec":"text4","sec_label":"Text 4","ctx":"Two years ago, Rupert Murdoch's daughter, Elisabeth, spoke of the \"unsettling dearth of integrity across so many of our institutions\".","note":"此处不是物体的“完整性”，而是个人或机构坚守道德原则的“诚信、正直”。","forms":["integrity"]},{"w":"dearth of","pos":"phr.","cn":"缺乏、匮乏，语气比普通的 lack of 更强。","sec":"text4","sec_label":"Text 4","ctx":"Two years ago, Rupert Murdoch's daughter, Elisabeth, spoke of the \"unsettling dearth of integrity across so many of our institutions\".","note":"缺乏、匮乏，语气比普通的 lack of 更强。","forms":["dearth of"]},{"w":"institution","pos":"n.","cn":"机构、制度性组织，此处包括政府、媒体和企业等。","sec":"text4","sec_label":"Text 4","ctx":"Two years ago, Rupert Murdoch's daughter, Elisabeth, spoke of the \"unsettling dearth of integrity across so many of our institutions\".","note":"机构、制度性组织，此处包括政府、媒体和企业等。","forms":["institution"]},{"w":"collective acceptance","pos":"phr.","cn":"社会群体的共同接受、集体认同。","sec":"text4","sec_label":"Text 4","ctx":"Integrity had collapsed, she argued, because of a collective acceptance that the only \"sorting mechanism\" in society should be profit and the market.","note":"社会群体的共同接受、集体认同。","forms":["collective acceptance"]},{"w":"sorting mechanism","pos":"phr.","cn":"决定资源、地位与价值排序的筛选机制。","sec":"text4","sec_label":"Text 4","ctx":"Integrity had collapsed, she argued, because of a collective acceptance that the only \"sorting mechanism\" in society should be profit and the market.","note":"决定资源、地位与价值排序的筛选机制。","forms":["sorting mechanism"]},{"w":"drive a point home","pos":"phr.","cn":"把观点讲透、使观点深入人心，并非“把观点开车送回家”。","sec":"text4","sec_label":"Text 4","ctx":"Driving her point home, she continued: \"It's increasingly apparent that the absence of purpose, of a moral language within government, media or business could become one ","note":"把观点讲透、使观点深入人心，并非“把观点开车送回家”。","forms":["drive a point home"]},{"w":"wound","pos":"词","cn":"常见义为“使身体受伤”；此处比喻“损害公司、伤及组织根基”。","sec":"text4","sec_label":"Text 4","ctx":"This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespr","note":"常见义为“使身体受伤”；此处比喻“损害公司、伤及组织根基”。","forms":["wound"]},{"w":"lose one's way","pos":"phr.","cn":"迷失方向；此处指公司失去道德和经营方向。","sec":"text4","sec_label":"Text 4","ctx":"This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespr","note":"迷失方向；此处指公司失去道德和经营方向。","forms":["lose one's way"]},{"w":"telephone hacking","pos":"phr.","cn":"非法侵入电话或语音信箱以获取信息。","sec":"text4","sec_label":"Text 4","ctx":"This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespr","note":"非法侵入电话或语音信箱以获取信息。","forms":["telephone hacking"]},{"w":"conspire to do","pos":"phr.","cn":"共谋、合谋做某事。","sec":"text4","sec_label":"Text 4","ctx":"As the hacking trial concludes - finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah ","note":"共谋、合谋做某事。","forms":["conspire to do"]},{"w":"the same charge","pos":"phr.","cn":"同一项指控。","sec":"text4","sec_label":"Text 4","ctx":"As the hacking trial concludes - finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah ","note":"同一项指控。","forms":["the same charge"]},{"w":"still stand","pos":"phr.","cn":"仍然成立、仍待解决。","sec":"text4","sec_label":"Text 4","ctx":"As the hacking trial concludes - finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah ","note":"仍然成立、仍待解决。","forms":["still stand"]},{"w":"on an industrial scale","pos":"phr.","cn":"达到工业化、大规模运作的程度。","sec":"text4","sec_label":"Text 4","ctx":"This is hacking on an industrial scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking.","note":"达到工业化、大规模运作的程度。","forms":["on an industrial scale"]},{"w":"point person","pos":"phr.","cn":"某项事务的主要负责人或联络人。","sec":"text4","sec_label":"Text 4","ctx":"This is hacking on an industrial scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking.","note":"某项事务的主要负责人或联络人。","forms":["point person"]},{"w":"await","pos":"词","cn":"及物动词，意为“等待”，后面直接接宾语，不与 for 连用。","sec":"text4","sec_label":"Text 4","ctx":"Others await trial.","note":"及物动词，意为“等待”，后面直接接宾语，不与 for 连用。","forms":["await"]},{"w":"unfold","pos":"词","cn":"常见义为“展开折叠物”；此处指事件“逐步展开、继续发展”。","sec":"text4","sec_label":"Text 4","ctx":"This long story still unfolds.","note":"常见义为“展开折叠物”；此处指事件“逐步展开、继续发展”。","forms":["unfold"]},{"w":"frame","pos":"词","cn":"常见义为“给……装框”；此处作动词，意为“构成……的框架、塑造对……的理解方式”。","sec":"text4","sec_label":"Text 4","ctx":"In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place.","note":"常见义为“给……装框”；此处作动词，意为“构成……的框架、塑造对……的理解方式”。","forms":["frame"]},{"w":"revelation","pos":"n.","cn":"此处指审判中披露出来的“惊人事实、揭露内容”，不是宗教意义的“启示”。","sec":"text4","sec_label":"Text 4","ctx":"One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired ","note":"此处指审判中披露出来的“惊人事实、揭露内容”，不是宗教意义的“启示”。","forms":["revelation"]},{"w":"defence","pos":"n.","cn":"此处是英式拼写，指法庭上的“辩护、辩护理由”。","sec":"text4","sec_label":"Text 4","ctx":"The core of her successful defence was that she knew nothing.","note":"此处是英式拼写，指法庭上的“辩护、辩护理由”。","forms":["defence"]},{"w":"be accountable for","pos":"phr.","cn":"对……负责，并有义务说明、承担后果。","sec":"text4","sec_label":"Text 4","ctx":"In today's world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.","note":"对……负责，并有义务说明、承担后果。","forms":["be accountable for"]},{"w":"executive","pos":"adj.","cn":"企业或机构的高级管理人员。","sec":"text4","sec_label":"Text 4","ctx":"In today's world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.","note":"企业或机构的高级管理人员。","forms":["executive"]},{"w":"doctrine","pos":"词","cn":"此处不是严格的宗教“教义”，而是被群体奉行的“信条、主导观念”。","sec":"text4","sec_label":"Text 4","ctx":"For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.","note":"此处不是严格的宗教“教义”，而是被群体奉行的“信条、主导观念”。","forms":["doctrine"]},{"w":"shareholder value","pos":"phr.","cn":"股东价值，即企业为股东创造的经济回报。","sec":"text4","sec_label":"Text 4","ctx":"The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation.","note":"股东价值，即企业为股东创造的经济回报。","forms":["shareholder value"]},{"w":"business-friendly","pos":"adv.","cn":"有利于商业的、亲商的。","sec":"text4","sec_label":"Text 4","ctx":"The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation.","note":"有利于商业的、亲商的。","forms":["business-friendly"]},{"w":"circulation","pos":"n.","cn":"报刊发行量。","sec":"text4","sec_label":"Text 4","ctx":"The words that have mattered are efficiency, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation.","note":"报刊发行量。","forms":["circulation"]},{"w":"degrade ... to the margin","pos":"phr.","cn":"使……贬值并退居边缘；这里说的是道德价值在社会生活中被边缘化。","sec":"text4","sec_label":"Text 4","ctx":"Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.","note":"使……贬值并退居边缘；这里说的是道德价值在社会生活中被边缘化。","forms":["degrade ... to the margin"]},{"w":"proportionality","pos":"n.","cn":"相称原则，即手段、惩罚或反应应与目标、过错或风险相称。","sec":"text4","sec_label":"Text 4","ctx":"Words degraded to the margin have been justice, fairness, tolerance, proportionality and accountability.","note":"相称原则，即手段、惩罚或反应应与目标、过错或风险相称。","forms":["proportionality"]},{"w":"betray","pos":"词","cn":"常见义为“背叛”；此处意为“不经意地显露、流露”，betray any common humanity 即“表现出共同人性”。","sec":"text4","sec_label":"Text 4","ctx":"The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity.","note":"常见义为“背叛”；此处意为“不经意地显露、流露”，betray any common humanity 即“表现出共同人性”。","forms":["betray"]},{"w":"in the quest for","pos":"phr.","cn":"为了追求……、在寻求……的过程中。","sec":"text4","sec_label":"Text 4","ctx":"It was to ruin lives in the quest for circulation and impact.","note":"为了追求……、在寻求……的过程中。","forms":["in the quest for"]},{"w":"may or may not have done","pos":"phr.","cn":"可能做过，也可能没有做过；表示作者不对该事实下定论。","sec":"text4","sec_label":"Text 4","ctx":"Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions - nor received traceable, recor","note":"可能做过，也可能没有做过；表示作者不对该事实下定论。","forms":["may or may not have done"]},{"w":"traceable","pos":"adj.","cn":"可追溯的，能够查明来源或过程的。","sec":"text4","sec_label":"Text 4","ctx":"Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions - nor received traceable, recor","note":"可追溯的，能够查明来源或过程的。","forms":["traceable"]}],"sentences":[{"id":"2015-T1-P1-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"But embarrassing scandals and the popularity of the republican left in the recent Euro-elections have forced him to eat his words and stand down.","core":"scandals and the popularity ... have forced him to eat his words and stand down。","structure":"embarrassing scandals 与 the popularity of the republican left 构成并列主语；force sb. to do 后并列两个动作 eat his words 和 stand down。","key":"the republican left：主张共和政体、反对君主制的左翼力量；republican 在此不是美国“共和党人”。；eat one's words：收回前言，承认自己先前说错了。；stand down：辞职、退位，此处指结束国王任期。","zh":"但是，令王室蒙羞的丑闻以及共和派左翼在最近欧洲议会选举中的受欢迎程度，迫使他收回前言并退位。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T1-P1-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?","core":"Does that mean the writing is on the wall for all European royals?","structure":"that 指上一句所问的“西班牙危机是否预示君主制走向末日”；with ... 补充描写欧洲王室成员的外在形象与生活方式。","key":"the writing is on the wall：明显的厄运征兆已经出现；某事注定失败或终结。","zh":"这是否意味着，对所有身着华丽制服、过着尊贵生活的欧洲王室成员来说，大势已去？","tip":"the writing is on the wall 是完整习语，不能按字面译为“墙上有字”。"},{"id":"2015-T1-P2-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"When public opinion is particularly polarised, as it was following the end of the Franco regime, monarchs can rise above \"mere\" politics and \"embody\" a spirit of national unity.","core":"monarchs can rise above politics and embody a spirit of national unity。","structure":"When public opinion is particularly polarised 是时间兼条件状语从句；as it was ... 是插入的比较从句，其中 it 指 public opinion，省略了表语 particularly polarised。","key":"polarised：形容词，意为“两极分化的、严重对立的”。；rise above：超越，不受某种纷争或局限的影响。；embody：体现，使某种抽象观念具体化。","zh":"当社会舆论高度分化时——正如佛朗哥政权结束后那样——君主可以超越“纯粹的”政治纷争，“体现”民族团结精神。","tip":"引号中的 mere 与 embody 带有审慎距离，表示这是拥护君主制者对君主功能的概括，并非作者毫无保留的断言。"},{"id":"2015-T1-P3-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"It is this apparent transcendence of politics that explains monarchs' continuing popularity as heads of state.","core":"This apparent transcendence of politics explains monarchs' continuing popularity.","structure":"It is ... that ... 是强调句，突出真正解释君主持续受欢迎的原因；as heads of state 说明君主受欢迎时的身份。","key":"apparent：此处意为“表面上的、看似的”，不宜直接理解为“显而易见的”。","zh":"正是这种看似超越政治纷争的属性，解释了君主作为国家元首为何能持续受到欢迎。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T1-P3-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"But unlike their absolutist counterparts in the Gulf and Asia, most royal families have survived because they allow voters to avoid the difficult search for a non-controversial but respected public figure.","core":"most royal families have survived because they allow voters to avoid the search。","structure":"句首 unlike ... 引出欧洲王室与专制王室的对比；because 引导原因状语从句；allow voters to avoid ... 是“允许某人避免某事”的结构；for ... public figure 修饰 search，说明寻找的对象。","key":"absolutist counterparts：实行君主专制的对应群体；此处指海湾地区和亚洲的王室。；non-controversial：不引发争议的；在文中尤其强调政治上的中立性。","zh":"然而，不同于海湾地区和亚洲那些实行专制统治的同类王室，欧洲大多数王室之所以延续下来，是因为它们让选民不必费力寻找一位不引发争议、又受人尊敬的公众人物。","tip":"they 指 most royal families；生存原因不是其权力强大，而是它们免除了选民另觅中立且受尊敬的国家象征人物的难题。"},{"id":"2015-T1-P4-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"Symbolic of national unity as they claim to be, their very history - and sometimes the way they behave today - embodies outdated and indefensible privileges and inequalities.","core":"their very history embodies outdated and indefensible privileges and inequalities。","structure":"Symbolic of national unity as they claim to be 是“形容词 + as + 主语 + 谓语”的让步倒装，相当于 Although they claim to be symbolic of national unity；破折号之间的 and sometimes the way they behave today 是对主语的补充。","key":"indefensible：无法为之辩护的，站不住脚的。；privileges and inequalities：特权与不平等现象。","zh":"尽管国王和女王自称是民族团结的象征，但恰恰是他们的历史——有时还包括他们今天的行为方式——体现着那些过时且无法辩护的特权与不平等。","tip":"they 指上一句的 kings and queens；very 在 their very history 中用于强调，意为“正是其历史本身”。"},{"id":"2015-T1-P4-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is bizarre that wealthy aristocratic families should still be the symbolic heart of modern democratic states.","core":"it is bizarre that wealthy aristocratic families should still be the symbolic heart ...。","structure":"At a time 后接 when 定语从句，交代时代背景；it 是形式主语，真正的主语是后面的 that 从句。","key":"warn of：警告某种危险或问题可能出现。；inherited wealth：继承而来的财富、世袭财富。；aristocratic：贵族的；具有贵族特征的。","zh":"在托马斯·皮凯蒂等经济学家正警告不平等日益加剧、继承性财富的影响力不断扩大之时，富有的贵族家庭居然仍是现代民主国家的象征性核心，实在荒诞。","tip":"should 在这里表达惊讶、不可思议，意为“竟然”，不是“应该”。"},{"id":"2015-T1-P5-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"Even so, these are wealthy families who party with the international 1%, and media intrusiveness makes it increasingly difficult to maintain the right image.","core":"these are wealthy families, and media intrusiveness makes it difficult to maintain the right image。","structure":"who party with ... 是定语从句，修饰 wealthy families；第二个分句中 it 是形式宾语，真正的宾语是 to maintain the right image。","key":"party with：与某人聚会、交际并享乐。；the international 1%：全球最富有、最具特权的顶层 1% 人群。；media intrusiveness：媒体对私人生活的侵扰、无孔不入的介入。；maintain the right image：维持合宜、符合公众期待的形象。","zh":"即便如此，这些仍是与全球最富有的 1% 群体一起社交享乐的富裕家族，而媒体无孔不入的干预使它们越来越难维持合宜的公众形象。","tip":"these 承接前两句所说的王室或王室家族；the right image 不是“正确的图像”，而是王室希望经营的公众形象。"},{"id":"2015-T1-P6-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"While Europe's monarchies will no doubt be smart enough to survive for some time to come, it is the British royals who have most to fear from the Spanish example.","core":"it is the British royals who have most to fear from the Spanish example。","structure":"While 引导让步状语从句，意为“尽管”；主句采用 It is ... who ... 强调句，突出 the British royals。","key":"for some time to come：在今后一段时间里。；have most to fear from：最需要担心、最可能受到某事物威胁。","zh":"尽管欧洲各君主制国家无疑足够精明，还能延续一段时日，但最该从西班牙这个先例中感到担忧的是英国王室。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T1-P7-S01","sec":"text1","sec_label":"Text 1","level":3,"en":"It is only the Queen who has preserved the monarchy's reputation with her rather ordinary (if well-heeled) granny style.","core":"Only the Queen has preserved the monarchy's reputation.","structure":"It is ... who ... 强调 only the Queen；with ... granny style 表示她维护声誉所凭借的方式；括号中的 if well-heeled 是让步性补充，意为“尽管富有”。","key":"well-heeled：富有的、生活优裕的，并非“鞋跟做得很好”。","zh":"只有女王凭借她相当平实的“祖母式”作风（尽管生活优裕），维护了英国君主制的声誉。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T1-P7-S02","sec":"text1","sec_label":"Text 1","level":3,"en":"The danger will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world.","core":"The danger will come with Charles.","structure":"who 引导非限制性定语从句，补充查尔斯带来危险的两个原因；both ... and ... 并列 an expensive taste of lifestyle 与 a ... hierarchical view。","key":"hierarchical：等级森严的；强调上下尊卑秩序的。","zh":"危险将随查尔斯而来：他既偏爱昂贵奢华的生活方式，又对世界持有相当强调等级的看法。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T1-P7-S03","sec":"text1","sec_label":"Text 1","level":3,"en":"He has failed to understand that monarchies have largely survived because they provide a service -as non-controversial and non-political heads of state.","core":"He has failed to understand that monarchies have survived.","structure":"that 引导 understand 的宾语从句；从句中的 because 说明君主制存续的原因；破折号后的 as ... heads of state 说明其发挥作用时的身份。","key":"provide a service：发挥作用、履行公共职能；此处并非字面上的“提供一项服务”。；non-political：不介入政治的、保持政治中立的。","zh":"他没有明白，君主制之所以大体延续至今，是因为君主以不引发争议、不介入政治的国家元首身份履行了一种公共职能。","tip":"they 语法上承接 monarchies，语义上指君主制下的王室成员；核心条件是“不引发争议且不介入政治”。"},{"id":"2015-T1-P7-S04","sec":"text1","sec_label":"Text 1","level":3,"en":"Charles ought to know that as English history shows, it is kings, not republicans, who are the monarchy's worst enemies.","core":"Charles ought to know that kings are the monarchy's worst enemies.","structure":"that 引导 know 的宾语从句；as English history shows 是插入的方式/依据状语；宾语从句内部用 it is ... who ... 强调并对比 kings 与 republicans。","key":"eat one's words：收回前言，承认先前说错了。；stand down：辞职；在本文中指退位。；the writing is on the wall：失败或终结的征兆已经十分明显。；rise above politics：超越党派政治或政治纷争。","zh":"查尔斯理应明白，正如英国历史所表明，君主制最危险的敌人是国王自身，而不是共和派人士。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T2-P1-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The Supreme Court will now consider whether police can search the contents of a mobile phone without a warrant if the phone is on or around a person during an arrest.","core":"The Supreme Court will now consider whether ...。","structure":"whether 引导宾语从句，说明法院要审议的问题；从句中的 if 引导条件状语从句，during an arrest 限定整个搜查场景。","key":"search the contents of：搜查、查阅……的内容。；without a warrant：没有搜查令；warrant 在此指法官签发的搜查令。；on or around a person：在某人身上或其近旁。","zh":"最高法院现在将审议：逮捕过程中，如果手机就在被捕者身上或身边，警方能否在没有搜查令的情况下搜查手机内容。","tip":"search the contents of a mobile phone 是“搜查手机中的内容”，不是“寻找手机”。"},{"id":"2015-T2-P2-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"California has asked the justices to refrain from a sweeping ruling, particularly one that upsets the old assumption that authorities may search through the possessions of suspects at the time of their arrest.","core":"California has asked the justices to refrain from a sweeping ruling.","structure":"particularly one 中 one 指代 a sweeping ruling；that upsets ... 修饰 one；末尾第二个 that 引导同位语从句，解释 the old assumption 的具体内容。","key":"sweeping：常见义为“清扫的”；此处作形容词，意为“影响广泛的、全面的”。；refrain from：克制、避免做某事，后接名词或动名词。；upset an assumption：推翻、动摇一项假定。","zh":"加州已请求大法官们不要作出覆盖面过广的裁决，尤其不要推翻那项由来已久的假定，即执法机关可以在逮捕嫌疑人时搜查其随身物品。","tip":"两个 that 功能不同，前者是定语从句关系词，后者是同位语从句连接词。"},{"id":"2015-T2-P2-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"It is hard, the state argues, for judges to assess the implications of new and rapidly changing technologies.","core":"It is hard for judges to assess the implications ...。","structure":"It 是形式主语，真正主语是 for judges to assess ...；the state argues 是插入语，交代这一判断的提出者。","key":"assess the implications of：评估……可能产生的影响或后果。","zh":"该州辩称，法官很难评估新技术及其飞速变化所带来的影响。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T2-P3-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"Enough of the implications are discernable, even obvious, so that the justices can and should provide updated guidelines to police, lawyers and defendants.","core":"Enough of the implications are discernable ... so that the justices can and should provide updated guidelines ...。","structure":"even obvious 对 discernable 递进补充；so that 引出由前述事实得出的结果；can and should 分别强调“能够”与“应当”。","key":"discernable：可以辨别的，可以看清的。；updated guidelines：根据新情况更新的指导规则。","zh":"新技术带来的影响已有足够多是可以辨明、甚至显而易见的，因此大法官们既有能力、也有必要为警方、律师和被告提供更新后的指导规则。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T2-P4-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"They should start by discarding California's lame argument that exploring the contents of a smartphone - a vast storehouse of digital information - is similar to, say, going through a suspect's purse.","core":"They should start by discarding California's lame argument.","structure":"that 引导同位语从句，说明 argument 的内容；两个连字符之间的 a vast storehouse of digital information 是 a smartphone 的同位语；say 是插入语，意为“比如说”。","key":"lame：常见义为“跛的”；此处形容论点，意为“软弱无力的、站不住脚的”。；start by doing：先从做某事开始。；a vast storehouse of：大量……的储藏库，此处突出手机的信息容量。；go through：仔细翻查、搜查。","zh":"他们首先应当摒弃加州那套站不住脚的论点：探查一部智能手机（一个海量数字信息的储藏库），类似于翻查嫌疑人的手提包之类的随身物品。","tip":"that 不是定语从句关系词，而是引出完整论点；purse 与下句的 wallet or pocketbook 都属于传统随身物品这一比较范畴。"},{"id":"2015-T2-P4-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"The court has ruled that police don't violate the Fourth Amendment when they go through the wallet or pocketbook of an arrestee without a warrant.","core":"The court has ruled that police don't violate the Fourth Amendment.","structure":"that 引导宾语从句；when 引导时间兼情境状语从句；without a warrant 修饰 go through。","key":"the Fourth Amendment：美国宪法第四修正案，核心是防止不合理搜查和扣押。；arrestee：被捕者；与实施逮捕的 arrester 不同。","zh":"法院此前裁定，警方在没有搜查令的情况下翻查被捕者的钱包或手提包，并不违反第四修正案。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T2-P4-S05","sec":"text2","sec_label":"Text 2","level":3,"en":"The development of \"cloud computing\", meanwhile, has made that exploration so much the easier.","core":"The development of \"cloud computing\" has made that exploration easier.","structure":"meanwhile 是插入性副词；so much 强化比较级 the easier，表示“容易得多”。","key":"that：此处不是指示形容词，而是代词，具体指前文所说的 exploring one's smartphone。；make ... all/so much the + 比较级：使……更加……；the 不表示特指，而是比较级结构的一部分。","zh":"与此同时，“云计算”的发展又使这种探查变得容易得多。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T2-P5-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Citizens still have a right to expect private documents to remain private and protected by the Constitution's prohibition on unreasonable searches.","core":"Citizens have a right to expect private documents to remain private and protected.","structure":"expect + 宾语 + to do 构成复合宾语；private 与 protected 是并列表语；protected by ... 说明保护依据。","key":"have a right to expect：有权合理期待……。；prohibition on：对……的禁止。","zh":"公民仍有权期待私人文件继续保持私密，并受到宪法禁止不合理搜查这一规定的保护。","tip":"private 第一次修饰 documents，第二次作 remain 的表语，分别表示“私人文件”和“保持私密”。"},{"id":"2015-T2-P6-S01","sec":"text2","sec_label":"Text 2","level":3,"en":"As so often is the case, stating that principle doesn't ease the challenge of line-drawing.","core":"Stating that principle doesn't ease the challenge of line-drawing.","structure":"As so often is the case 是方式状语从句；动名词短语 stating that principle 作主语。","key":"as is often the case：情况往往如此，常用于引出普遍存在的现象。原文以 so often 加强频率。；line-drawing：划定界线，此处指确定隐私权与执法权的法律边界。","zh":"然而，正如常见的情形那样，仅仅陈明这一原则并不能降低划定法律界线的难度。","tip":"that principle 指上一段的原则：私人数字文件应受宪法免遭不合理搜查的保护。"},{"id":"2015-T2-P6-S02","sec":"text2","sec_label":"Text 2","level":3,"en":"In many cases, it would not be overly burdensome for authorities to obtain a warrant to search through phone contents.","core":"It would not be overly burdensome for authorities to obtain a warrant.","structure":"it 是形式主语，for authorities to obtain ... 是真正主语；to search through phone contents 说明搜查令的用途。","key":"overly burdensome：负担过重的、过分麻烦的。；obtain a warrant：取得搜查令。","zh":"在许多情况下，要求执法机关取得搜查令后再查看手机内容，并不会造成过重负担。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T2-P6-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not erased or altered while waiting for a warrant.","core":"They could invalidate ... protections, and they could take reasonable measures.","structure":"两个 they could 分句并列，分别说明紧急例外与等候搜查令时的保全措施；when facing ... 是省略主语和 are 的状语从句；to ensure that ... 表目的，其中 that 引导宾语从句；while waiting ... 再次省略与主句相同的主语。","key":"invalidate：使失效；此处指紧急情形可能构成通常搜查令要求的例外。；take reasonable measures：采取合理措施。","zh":"面对严重而紧迫的情况时，执法机关仍可使第四修正案的相关保护暂时失效；在等待搜查令期间，他们也可以采取合理措施，确保手机数据不被删除或篡改。","tip":"They 指前句的 authorities，不是公民或法院。"},{"id":"2015-T2-P6-S04","sec":"text2","sec_label":"Text 2","level":3,"en":"The court, though, may want to allow room for police to cite situations where they are entitled to more freedom.","core":"The court may want to allow room for police.","structure":"though 是插入性转折副词；for police to cite situations 说明留出余地的对象和内容；where 引导定语从句，修饰 situations。","key":"cite：常见义为“引用”；此处意为“援引、举出（某种情形作为依据）”。；allow room for：为……留出余地。；be entitled to：有权享有……。","zh":"不过，法院或许会希望留出一定余地，让警方能够援引某些有权享有更大行动自由的情形。","tip":"they 指 police；本句并非允许警方在任何时候自由搜查，而只是保留可由警方援引的例外情形。"},{"id":"2015-T2-P7-S03","sec":"text2","sec_label":"Text 2","level":3,"en":"Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.","core":"Orin Kerr compares A with B: The justices had to specify novel rules then; they must sort out ... now.","structure":"a law professor 是 Orin Kerr 的同位语；compare 的宾语 A 是 the explosion and accessibility of digital information ...，宾语 B 是 the establishment of automobile use ...；冒号后解释这一历史类比，分号连接“过去制定汽车规则”与“现在厘清数字信息规则”两个平行分句。","key":"compare A with B：把 A 与 B 相比较。；a virtual necessity：几乎不可缺少的事物；virtual 在此意为“事实上的、几乎等同于”。；personal domain：私人领域、私人空间。；sort out：理清、解决。","zh":"法学教授奥林·克尔把 21 世纪数字信息的爆炸式增长与触手可及，同 20 世纪汽车的使用逐渐成为生活中几乎不可或缺之事相比较：当时，大法官们不得不为乘用车这一新的私人空间制定新规则；如今，他们必须厘清第四修正案如何适用于数字信息。","tip":"how the Fourth Amendment applies to digital information 是 sort out 的宾语从句；类比重点是规则适应新的私人领域，而不是说汽车与手机本身相同。"},{"id":"2015-T3-P1-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"The journal Science is adding an extra round of statistical checks to its peer-review process, editor-in-chief Marcia McNutt announced today.","core":"The journal Science is adding an extra round of statistical checks.","structure":"句末 editor-in-chief Marcia McNutt announced today 是报道来源；Science 与 the journal 构成同位关系。","key":"an extra round of：额外增加的一轮……。；peer-review process：同行评审流程，即由同领域专家评议论文的机制。；editor-in-chief：主编。","zh":"《科学》期刊主编玛西娅·麦克纳特当天宣布，该刊将在同行评审流程中增设一轮统计审查。","tip":"斜体刊名 Science 指《科学》期刊，不是泛指“科学”。"},{"id":"2015-T3-P1-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"The policy follows similar efforts from other journals, after widespread concern that basic mistakes in data analysis are contributing to the irreproducibility of many published research findings.","core":"The policy follows similar efforts from other journals.","structure":"after widespread concern 交代政策背景；that basic mistakes ... are contributing to ... 是同位语从句，说明 concern 的具体内容。","key":"follow：常见义为“跟随”；此处表示“在……之后发生、沿用……的做法”。；irreproducibility：不可重复性，即其他研究者无法用相同方法得到相同结果。；published research findings：已发表的研究结果。","zh":"在各界普遍担忧数据分析中的基础错误正导致许多已发表研究结果无法重复验证之后，《科学》推出了这项政策，而其他期刊此前也采取过类似措施。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T3-P2-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Working with the American Statistical Association, the journal has appointed seven experts to a statistics board of reviewing editors (SBoRE).","core":"the journal has appointed seven experts to a statistics board。","structure":"句首 Working with ... 是现在分词短语，说明期刊设立委员会时采取的合作方式；of reviewing editors 说明委员会成员的职能。","key":"见下方词汇笔记","zh":"《科学》与美国统计协会合作，已任命七位专家组成“统计审稿编辑委员会”（SBoRE）。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T3-P2-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"Manuscripts will be flagged up for additional scrutiny by the journal's internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers.","core":"Manuscripts will be flagged up for additional scrutiny.","structure":"三个 by 短语并列，列出可能标记稿件的三类人员；这是被动语态，重点在被筛出的稿件及后续审查。","key":"flag up：不是“把旗帜升起”，而是“标出、提请注意”，此处指识别出需要进一步审查的稿件。；additional scrutiny：额外的严格审查。；outside peer reviewers：外部同行评审人。","zh":"期刊内部编辑、现有的审稿编辑委员会或外部同行评审人会把某些稿件标记出来，以便接受额外审查。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T3-P3-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Asked whether any particular papers had impelled the change, McNutt said: \"The creation of the 'statistics board' was motivated by concerns broadly with the application of statistics and data analysis in scientific research and is part of Science's overall drive to increase reproducibility in the research we publish.\"","core":"McNutt said: \"The creation ... was motivated by concerns and is part of ... drive.\"","structure":"句首 Asked whether ... 是过去分词短语，其逻辑主语为 McNutt；引语中 was motivated by 与 is part of 并列；we publish 是省略关系词的定语从句，修饰 research。","key":"impel the change：促使、推动这项改变。；be motivated by：由……推动；出于……原因。；overall drive：整体推动行动、总体努力。","zh":"当被问及是否有某些具体论文促成了这一改变时，麦克纳特表示：“设立‘统计委员会’，是出于对科研中统计方法和数据分析应用状况的广泛担忧，也是《科学》为提高本刊研究可重复性所作整体努力的一部分。”","tip":"concerns broadly with 表示担忧面向统计和数据分析的整体应用，并非由某一篇问题论文单独触发。"},{"id":"2015-T3-P4-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Giovanni Parmigiani, a biostatistician at the Harvard School of Public Health, a member of the SBoRE group, says he expects the board to \"play primarily an advisory role.\"","core":"Giovanni Parmigiani says he expects the board to play an advisory role.","structure":"两个逗号隔开的名词短语都是 Giovanni Parmigiani 的同位语；expects the board to ... 是“预计某人/某机构会……”结构。","key":"biostatistician：生物统计学家，运用统计方法研究生物与医学问题。；play an advisory role：发挥咨询、顾问作用。","zh":"哈佛大学公共卫生学院的生物统计学家、SBoRE 成员乔瓦尼·帕米贾尼表示，他预计该委员会将“主要发挥咨询作用”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T3-P4-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"This impact will not only be through the publications in Science itself, but hopefully through a larger group of publishing places that may want to model their approach after Science.\"","core":"This impact will be not only through A, but through B.","structure":"not only ... but ... 并列影响传播的两条路径；that may want to ... 是定语从句，修饰 publishing places。","key":"model ... after ...：以……为范本、仿照……，不是“为……制作模型”。","zh":"这种影响不仅会体现在《科学》本身发表的论文中，还将有望通过更多可能愿意仿效《科学》做法的出版机构产生。”","tip":"publishing places 泛指其他期刊或出版机构；该句说明 SBoRE 可能成为同行效仿的范例，而不是提高《科学》的发行量。"},{"id":"2015-T3-P5-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"John Ioannidis, a physician who studies research methodology, says that the policy is \"a most welcome step forward\" and \"long overdue\".","core":"John Ioannidis says that the policy is ... and ... .","structure":"who studies research methodology 是定语从句，修饰 a physician；两个引号短语并列表明他强烈赞同这项政策。","key":"overdue：常见于“逾期未还”；此处意为“早该发生却迟迟未发生的”。","zh":"研究科研方法论的医生约翰·约阿尼迪斯表示，这项政策是“非常值得欢迎的进步”，而且“早就该实行了”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T3-P5-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"I think that, for the majority of scientific papers nowadays, statistical review is more essential than expert review,\" he says, but he noted that biomedical journals such as Annals of Internal Medicine, the Journal of the American Medical Association and The Lancet pay strong attention to statistical review.","core":"he says ..., but he noted that biomedical journals ... pay strong attention ... .","structure":"前半部分是直接引语；but 后的 that 从句说明部分生物医学期刊是积极例外；三个期刊名称由 such as 引出并列。","key":"pay strong attention to：高度重视……。；statistical review：统计方法审查；expert review 此处指侧重专业内容的同行评审。","zh":"他说：“我认为，对当今大多数科学论文而言，统计审查比专家评审更为必要。”不过他也指出，《内科学年鉴》《美国医学会杂志》和《柳叶刀》等生物医学期刊确实高度重视统计审查。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T3-P6-S01","sec":"text3","sec_label":"Text 3","level":3,"en":"Professional scientists are expected to know how to analyse data, but statistical errors are alarmingly common in published research, according to David Vaux, a cell biologist.","core":"scientists are expected to know ..., but statistical errors are common ... .","structure":"but 对照专业人员应有的能力与现实中的高频错误；句末 according to ... 标明观点来源，a cell biologist 是 David Vaux 的同位语。","key":"be expected to：此处不只是“被期待”，还带有“按职责理应……”之意。","zh":"按理说，专业科学家应该懂得如何分析数据；但细胞生物学家戴维·沃克斯指出，已发表研究中的统计错误多得惊人。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T3-P6-S02","sec":"text3","sec_label":"Text 3","level":3,"en":"Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, \"engaging reviewers who are statistically literate and editors who can verify the process\".","core":"Researchers should improve ..., but journals should also take a tougher line.","structure":"he wrote in 2012 是插入的报道语；句末现在分词 engaging ... 说明期刊“采取更严格立场”的具体做法；两个 who 定语从句分别修饰 reviewers 和 editors。","key":"take a tougher line：采取更强硬、更严格的立场。；statistically literate：具备统计素养的，能正确理解和运用统计方法的。；verify the process：核查、验证审查流程。","zh":"他在 2012 年写道，研究人员应提高自身标准，但期刊也应采取更严格的立场，“聘用具备统计素养的审稿人，以及能够核查审查流程的编辑”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T3-P6-S03","sec":"text3","sec_label":"Text 3","level":3,"en":"Vaux says that Science's idea to pass some papers to statisticians \"has some merit, but a weakness is that it relies on the board of reviewing editors to identify 'the papers that need scrutiny' in the first place\".","core":"Vaux says that the idea has some merit, but a weakness is that it relies on the board.","structure":"to pass ... 修饰 idea；that it relies ... 是表语从句，说明弱点内容；to identify ... 是 rely on sb. to do 结构；that need scrutiny 修饰 the papers。","key":"merit：常见义为“功绩”；此处作不可数名词，意为“可取之处、价值”。；pass papers to statisticians：把论文转交统计学家审查。；in the first place：一开始、首先；此处强调筛选环节本身可能出错。；an extra round of checks：额外增加的一轮审查。","zh":"沃克斯认为，《科学》把部分论文交给统计学家审查的想法“有一定可取之处，但其弱点在于，它首先要依靠审稿编辑委员会识别出‘那些需要严格审查的论文’”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T4-P1-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Integrity had collapsed, she argued, because of a collective acceptance that the only \"sorting mechanism\" in society should be profit and the market.","core":"Integrity had collapsed because of a collective acceptance.","structure":"she argued 是插入的报道语；that ... 是同位语从句，说明社会共同接受的具体观念。","key":"collective acceptance：社会群体的共同接受、集体认同。；sorting mechanism：决定资源、地位与价值排序的筛选机制。","zh":"她认为，诚信之所以崩塌，是因为社会集体接受了这样一种观念：利润和市场应当成为社会唯一的“筛选机制”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T4-P1-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"But \"it's us, human beings, we the people who create the society we want, not profit.\"","core":"It is we the people who create the society, not profit.","structure":"口语化的 it's us, human beings, we the people 反复同位强调行动主体；who 引导强调结构中的从句；we want 修饰 the society。","key":"见下方词汇笔记","zh":"但“创造我们所向往社会的是我们，是人，是我们这些民众，而不是利润”。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T4-P2-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"Driving her point home, she continued: \"It's increasingly apparent that the absence of purpose, of a moral language within government, media or business could become one of the most dangerous goals for capitalism and freedom.\"","core":"It is increasingly apparent that the absence ... could become ... .","structure":"句首现在分词短语 Driving her point home 修饰 she continued；引语中 it 是形式主语，that 从句是真正主语；两个 of 短语共同说明缺失的内容。","key":"drive a point home：把观点讲透、使观点深入人心，并非“把观点开车送回家”。","zh":"为了进一步把观点说透，她接着说道：“越来越明显的是，政府、媒体或企业内部缺乏目标、缺乏道德话语，可能会成为资本主义和自由面临的最危险目标之一。”","tip":"原卷用词为 goals，应按原文保留；句意核心仍是道德目的缺失会给资本主义和自由带来严重后果。"},{"id":"2015-T4-P2-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"This same absence of moral purpose was wounding companies such as News International, she thought, making it more likely that it would lose its way as it had with widespread illegal telephone hacking.","core":"This absence was wounding companies.","structure":"she thought 是插入语；making ... 是结果状语；其中 it 指 News International，as it had ... 回指该公司在电话窃听事件中已经表现出的迷失。","key":"wound：常见义为“使身体受伤”；此处比喻“损害公司、伤及组织根基”。；lose one's way：迷失方向；此处指公司失去道德和经营方向。；telephone hacking：非法侵入电话或语音信箱以获取信息。","zh":"她认为，同样是这种道德目的的缺失正在伤害新闻国际等公司，使其更可能像在大规模非法电话窃听事件中那样迷失方向。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T4-P3-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"As the hacking trial concludes - finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah Brooks, innocent of the same charge - the wider issue of dearth of integrity still stands.","core":"the wider issue of dearth of integrity still stands。","structure":"句首 As 从句交代审判结束的背景；两个 finding 结构分别说明库尔森有罪、布鲁克斯无罪；破折号内整体补充审判结果。","key":"conspire to do：共谋、合谋做某事。；the same charge：同一项指控。；still stand：仍然成立、仍待解决。","zh":"随着电话窃听案审理结束——《世界新闻报》前编辑安迪·库尔森因合谋窃听电话被判有罪，而他的前任丽贝卡·布鲁克斯被判同一指控不成立——诚信缺失这一更广泛的问题依然存在。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T4-P3-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"Journalists are known to have hacked the phones of up to 5,500 people.","core":"Journalists are known to have hacked the phones.","structure":"be known to have done 表示“据知曾经做过”，完成不定式说明窃听发生在“已知”之前。","key":"见下方词汇笔记","zh":"据悉，记者曾侵入多达 5,500 人的电话。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T4-P3-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"This is hacking on an industrial scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking.","core":"This is hacking on an industrial scale.","structure":"as was acknowledged by ... 是非限制性关系结构，指前面整个判断；the man ... 是 Glenn Mulcaire 的同位语；hired by ... 修饰 the man，to be ... 说明受雇目的。","key":"on an industrial scale：达到工业化、大规模运作的程度。；point person：某项事务的主要负责人或联络人。","zh":"这是工业化规模的电话窃听；格伦·马尔凯尔也承认了这一点，他在 2001 年受《世界新闻报》雇用，担任电话窃听事务的主要负责人。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T4-P4-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place.","core":"the dearth of moral purpose frames not only the fact but the terms。","structure":"not only ... but ... 并列 the fact 与 the terms；on which the trial took place 是定语从句，修饰 terms。","key":"frame：常见义为“给……装框”；此处作动词，意为“构成……的框架、塑造对……的理解方式”。","zh":"在许多方面，道德目的的缺失不仅为如此大规模电话窃听这一事实设定了理解框架，也塑造了审判展开所依据的条件与话语框架。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T4-P4-S02","sec":"text4","sec_label":"Text 4","level":3,"en":"One of the astonishing revelations was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived.","core":"One of the revelations was A, B and C.","structure":"表语由三个成分并列：how little ... knew、how little ... thought to ask 和 the fact that ...；what went on 作 knew of 的宾语；how the stories arrived 作 inquired 的宾语。","key":"revelation：此处指审判中披露出来的“惊人事实、揭露内容”，不是宗教意义的“启示”。","zh":"令人震惊的发现之一是：丽贝卡·布鲁克斯对自己新闻编辑室里发生的事知之甚少，很少想到要追问，而且从未调查新闻素材究竟如何得来。","tip":"三个并列细节共同塑造布鲁克斯“什么都不知道、也不主动留下信息链”的辩护形象。"},{"id":"2015-T4-P4-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"The core of her successful defence was that she knew nothing.","core":"The core was that she knew nothing.","structure":"that she knew nothing 是表语从句，直接说明辩护策略的核心内容。","key":"defence：此处是英式拼写，指法庭上的“辩护、辩护理由”。","zh":"她成功辩护的核心就是：她什么都不知道。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T4-P5-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"In today's world, it has become normal that well-paid executives should not be accountable for what happens in the organisations that they run.","core":"it has become normal that executives should not be accountable。","structure":"it 是形式主语，that 从句是真正主语；what happens ... 作 for 的宾语；that they run 修饰 organisations。","key":"be accountable for：对……负责，并有义务说明、承担后果。；executive：企业或机构的高级管理人员。","zh":"在当今世界，高薪管理者竟然可以不必为自己所经营机构中发生的事情负责，这已经变得司空见惯。","tip":"should 带有“竟然”的评价色彩，作者不是主张管理者不负责，而是在讽刺这种现象被正常化。"},{"id":"2015-T4-P5-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"For a generation, the collective doctrine has been that the sorting mechanism of society should be profit.","core":"the collective doctrine has been that ... .","structure":"that 引导表语从句，说明这套共同信条的内容；for a generation 表明它长期塑造社会生活方式和价值排序。","key":"doctrine：此处不是严格的宗教“教义”，而是被群体奉行的“信条、主导观念”。","zh":"整整一代人以来，社会奉行的共同信条一直是：利润应当成为社会的筛选机制。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"},{"id":"2015-T4-P6-S01","sec":"text4","sec_label":"Text 4","level":3,"en":"The purpose of editing the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity.","core":"The purpose was not to A, to B or to C.","structure":"三个不定式并列，依次列出该报编辑工作没有追求的读者理解、公平与共同人性。","key":"betray：常见义为“背叛”；此处意为“不经意地显露、流露”，betray any common humanity 即“表现出共同人性”。","zh":"编辑《世界新闻报》的目的，并不是促进读者理解，不是保证报道公平，也不是流露任何共同人性。","tip":"这里的否定是在反讽该报的实际目标；作者借此反向强调新闻报道本应尊重这些价值。"},{"id":"2015-T4-P6-S03","sec":"text4","sec_label":"Text 4","level":3,"en":"Ms Brooks may or may not have had suspicions about how her journalists got their stories, but she asked no questions, gave no instructions - nor received traceable, recorded answers.","core":"Ms Brooks may or may not have had suspicions, but she asked no questions, gave no instructions, nor received answers.","structure":"how ... got their stories 作 suspicions about 的宾语；but 后三个否定动作并列，nor 进一步递进。","key":"may or may not have done：可能做过，也可能没有做过；表示作者不对该事实下定论。；traceable：可追溯的，能够查明来源或过程的。；dearth of integrity：诚信匮乏。；sorting mechanism：决定社会价值与资源排序的筛选机制。","zh":"布鲁克斯女士或许怀疑过、也或许没有怀疑过手下记者如何获得新闻素材，但她既不提问，也不给指示，更没有收到可追溯、有记录的答复。","tip":"先找谓语，再拆从句；把修饰语挂回它修饰的词。"}]};</script>

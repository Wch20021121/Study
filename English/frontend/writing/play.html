<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="考研英语（一）随机作文练习：随机抽取应用文、图画作文、图表作文；写完查看按模板拆解的标准参考范文。">
  <title>随机作文 · 英语（一）</title>
  <link rel="stylesheet" href="../assets/exam/exam.css?v=bd5f521f1f">
  <link rel="stylesheet" href="../assets/writing-bank/writing.css?v=bd5f521f1f">
</head>
<body class="writing-play-page" data-version="e7f2102e80">
  <a class="skip-link" href="#writingCard">跳到作文题</a>

  <header class="exam-bar writing-bar">
    <a class="exam-brand" href="../index.html" aria-label="返回真题档案">
      <span class="brand-seal">英</span>
      <span class="brand-copy"><b>英语（一）</b><small>真题档案 / 随机作文</small></span>
    </a>
    <div class="bar-context"><b id="modeYear">—</b><span id="modeName">随机作文</span></div>
    <div class="bar-actions">
      <a class="btn btn-ghost btn-small" href="index.html">作文模板</a>
      <button class="btn btn-ghost btn-small" type="button" id="skipButton">换一题</button>
    </div>
  </header>

  <main class="writing-play-shell">
    <div class="writing-loading" id="writingLoading">正在抽作文题…</div>

    <article class="writing-card" id="writingCard" hidden>
      <header class="writing-meta">
        <div class="writing-meta-main">
          <span class="writing-year" id="metaYear">—</span>
          <span id="metaPart">—</span>
          <span id="metaType">—</span>
        </div>
        <span class="writing-score" id="metaScore">—</span>
      </header>

      <section class="writing-prompt" id="promptArea">
        <div class="writing-prompt-head">
          <h1 id="promptTitle">—</h1>
          <span id="promptWords">—</span>
        </div>
        <p class="writing-prompt-en" id="promptEn"></p>
        <p class="writing-prompt-zh" id="promptZh"></p>
        <div id="pictureMount"></div>
      </section>

      <section class="writing-work" aria-label="作文作答区">
        <div class="writing-toolbar">
          <span id="wordCount">0 words</span>
          <span id="targetWords"></span>
          <button class="text-btn" type="button" id="clearDraft">清空草稿</button>
        </div>
        <textarea id="writingInput" class="writing-input" placeholder="先列提纲，再写正文。草稿会自动保存在本机。"></textarea>
        <div class="writing-actions">
          <button class="btn btn-red" type="button" id="submitWriting">提交，查看参考</button>
          <button class="btn btn-ghost" type="button" id="nextWriting" hidden>下一题</button>
          <a class="text-link" id="templateLink" href="index.html">看这类题的模板 →</a>
        </div>
      </section>

      <section class="writing-reference" id="referenceMount" hidden aria-live="polite"></section>
    </article>
  </main>

  <footer class="writing-footer">
    <div><b>随机作文</b><span>参考范文用于对照，不代替自己的写作；主观题请自行评分。</span></div>
    <a href="index.html">返回作文模板</a>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">随机作文需要 JavaScript 才能抽题、保存草稿和显示参考范文。</div></noscript>

  <script>window.__WRITING_VERSION__ = "e7f2102e80";</script>
  <script src="../assets/writing-bank/writing-play.js?v=bd5f521f1f"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="{{DESC}}">
  <title>{{YEAR}} 英语（一）· 知识点分析</title>
  <link rel="stylesheet" href="../assets/exam/exam.css?v={{ASSET_VERSION}}">
</head>
<body class="knowledge-page" data-year="{{YEAR}}">
  <a class="skip-link" href="#knowledgeMain">跳到知识点分析</a>

  <header class="exam-bar knowledge-bar">
    <a class="exam-brand" href="../index.html" aria-label="返回真题档案">
      <span class="brand-seal">英</span>
      <span class="brand-copy"><b>英语（一）</b><small>真题档案 / 知识点模式</small></span>
    </a>
    <div class="bar-context"><b>{{YEAR}}</b><span>命题结构 · 词汇 · 长难句</span></div>
    <div class="bar-actions">
      <a class="btn btn-ghost btn-small" href="../practice/{{YEAR}}.html">开始做题</a>
      <button class="btn btn-ink btn-small" type="button" id="printPage">打印 / 存 PDF</button>
    </div>
  </header>

  {{VIEW_TABS}}

  <div class="knowledge-layout">
    <aside class="knowledge-rail" aria-label="知识点导航">
      <div class="knowledge-rail-head">
        <p class="rail-kicker">KNOWLEDGE MAP</p>
        <p class="rail-year">{{YEAR}}</p>
        <p class="rail-subject">知识点分析</p>
        <a class="rail-back" href="../analysis/{{YEAR}}.html">完整解析 →</a>
      </div>
      <nav class="knowledge-nav" id="knowledgeNav" aria-label="知识点章节"></nav>
      <div class="knowledge-rail-foot">
        <a href="../practice/{{YEAR}}.html">开始做题</a>
        <a href="../analysis/{{YEAR}}.html#vocab">全卷词汇</a>
        <a href="../drill/index.html">随机练</a>
        <a href="../index.html">真题档案</a>
      </div>
    </aside>

    <main class="knowledge-main" id="knowledgeMain">
      <section class="knowledge-cover" id="top">
        <div class="knowledge-cover-copy">
          <p class="cover-kicker">KNOWLEDGE X-RAY / 知识点分析</p>
          <h1><span>{{YEAR}}</span>把一套卷子<br><em>拆成可复习的块</em></h1>
          <p class="knowledge-lede" id="knowledgeLede">读取本卷知识结构…</p>
          <div class="knowledge-cover-actions">
            <a class="btn btn-ghost" href="#structure">看命题结构</a>
            <a class="btn btn-ghost" href="../analysis/{{YEAR}}.html#vocab">背本卷词汇</a>
            <a class="btn btn-red" href="../practice/{{YEAR}}.html">去做真题</a>
          </div>
        </div>
        <div class="knowledge-stamp" aria-hidden="true">
          <span>KNOWLEDGE</span>
          <strong id="knowledgeStamp">—</strong>
          <small>个可复习知识点</small>
        </div>
      </section>

      <div id="knowledgeMount"></div>

      <footer class="paper-footer knowledge-footer">
        <div><b>{{YEAR}} / 英语（一）</b><span>这一页只拆知识结构，不展示正确选项；答案在“真题解析”页。</span></div>
        <a href="#top">回到页首 ↑</a>
      </footer>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">这个知识点页需要 JavaScript 才能生成结构图、词汇和长难句清单。</div></noscript>

  <script>window.__PAPER__ = {{DATA}};</script>
  <script src="../assets/exam/yearbar.js?v={{ASSET_VERSION}}"></script>
  <script src="../assets/exam/knowledge.js?v={{ASSET_VERSION}}"></script>
</body>
</html>

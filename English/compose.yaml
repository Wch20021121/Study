# 英语单站独立编排（可选）：在 English/ 目录执行 docker compose up -d --build
# 日常分支开发优先用仓库根目录 compose.yaml + ./English/dev.sh（端口 5001）。
# 这里不固定 container_name，避免和 worktree/其他项目撞名。
name: kaoyan-english

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kaoyan-english:local
    ports:
      # 宿主机 5000 -> 容器 80；改宿主机端口用 PORT=8080 docker compose up -d
      - "${PORT:-5000}:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

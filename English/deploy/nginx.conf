server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # 静态站点不需要上传大文件
    client_max_body_size 1m;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 容器健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 静态文件；目录请求回落到 index.html
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    # 图片、样式、脚本缓存 7 天；HTML 不缓存，方便更新后立即生效
    location ~* \.(?:css|js|mjs|png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
